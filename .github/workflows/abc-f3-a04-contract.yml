name: "ABC F3 A04 -- variants modifiers"

on:
  push:
    branches: [abc-f3-a04-variants-modifiers]
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260924020000_abc_f3_a04_variants_modifiers.sql"
      - "tests/f3/a04/**"
      - ".github/workflows/abc-f3-a04-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  a04-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Guardar alcance A04
        shell: bash
        run: |
          set -euo pipefail
          migration="supabase/migrations/20260924020000_abc_f3_a04_variants_modifiers.sql"
          test -f "$migration"

          grep -q "create table public.catalogo_tpv_grupos_opciones" "$migration"
          grep -q "create table public.catalogo_tpv_producto_grupos" "$migration"
          grep -q "create table public.catalogo_tpv_opciones" "$migration"
          grep -q "create table public.pedido_linea_opciones" "$migration"
          grep -q "create function private.abc_calcular_linea_tpv_configurada" "$migration"
          grep -q "create trigger abc_guard_linea_configurada" "$migration"
          grep -q "create function public.abc_agregar_linea_pedido_configurada" "$migration"
          grep -q "create function public.abc_actualizar_linea_pedido_configurada" "$migration"
          grep -q "create function public.abc_confirmar_linea_pedido_configurada" "$migration"
          grep -q "SERVER_AUTHORITY_A04" "$migration"

          if grep -Eiq 'grant[[:space:]]+(insert|update|delete).*catalogo_tpv_(grupos_opciones|producto_grupos|opciones).*authenticated' "$migration"; then
            echo "A04_SECURITY: DML directo de catálogo concedido a authenticated" >&2
            exit 1
          fi
          if grep -Eiq 'grant[[:space:]]+(insert|update|delete).*pedido_linea_opciones.*authenticated' "$migration"; then
            echo "A04_SECURITY: DML directo de opciones vendidas concedido a authenticated" >&2
            exit 1
          fi

          for fn in abc_agregar_linea_pedido_configurada abc_actualizar_linea_pedido_configurada abc_confirmar_linea_pedido_configurada; do
            sig="$(grep -A20 "create function public.$fn" "$migration" | head -n 21)"
            if echo "$sig" | grep -Eiq 'p_(precio|impuesto|iva|descuento|total|base)'; then
              echo "A04_SECURITY: $fn acepta importe económico del cliente" >&2
              exit 1
            fi
          done

          echo "A04_SCOPE_GUARD=PASS"

      - name: Preparar fixture F2/F3
        run: psql -v ON_ERROR_STOP=1 -f tests/f3/a04/fixture-a04.sql

      - name: Aplicar M01
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
      - name: Aplicar M01b
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
      - name: Aplicar M02A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
      - name: Aplicar M02B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
      - name: Aplicar M03A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
      - name: Aplicar M03B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
      - name: Aplicar M03C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
      - name: Aplicar M04A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
      - name: Aplicar M04B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql
      - name: Aplicar M04C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924003000_abc_f2_m04c_outbox_persistente.sql
      - name: Aplicar M04D
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924004000_abc_f2_m04d_acl_parity.sql
      - name: Aplicar A03
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924010000_abc_f3_a03_server_authority.sql
      - name: Aplicar A04
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924020000_abc_f3_a04_variants_modifiers.sql

      - name: Regresión ACL F2 tras A04
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04d/m04d-contract.sql

      - name: Regresión A03 tras A04
        run: psql -v ON_ERROR_STOP=1 -f tests/f3/a03/a03-contract.sql

      - name: Ejecutar contrato A04
        run: psql -v ON_ERROR_STOP=1 -f tests/f3/a04/a04-contract.sql
