name: PM26 P07b source-recovery check

on:
  push:
    branches:
      - claude/pm26-preparacion-tecnica
    paths:
      - ".github/workflows/pm26-p07b-source-recovery-check.yml"
      - "source-recovery/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebuild-current:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias congeladas de source-recovery
        run: npm --prefix source-recovery ci

      - name: Validar scripts de recuperacion
        run: npm --prefix source-recovery run check

      - name: Primera reconstruccion determinista
        run: |
          npm --prefix source-recovery run build:current
          sha256sum source-recovery/dist/fuente.js
          cp source-recovery/dist/fuente.js /tmp/fuente-rebuild-1.js

      - name: Segunda reconstruccion determinista
        run: |
          npm --prefix source-recovery run build:current
          sha256sum source-recovery/dist/fuente.js
          cmp --silent /tmp/fuente-rebuild-1.js source-recovery/dist/fuente.js
          echo "P07B_SOURCE_RECOVERY_REBUILD=PASS"

      - name: Confirmar arbol limpio fuera de dist
        run: git status --short
