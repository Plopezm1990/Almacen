name: Auditar contexto reducido por rol
on:
  push:
    branches: [auditoria-cache-pr4]
    paths:
      - .github/workflows/auditar-contexto-roles.yml
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar contexto operativo y sustituciones
        shell: python
        run: |
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          tokens=['obtener_contexto_operativo','cobrosEncargos','fichasProduccion','empleadosFichaje','contextoOperativo','proveedores']
          for token in tokens:
              print('\n###',token,'TOTAL',s.count(token))
              posiciones=[]; p=0
              while True:
                  i=s.find(token,p)
                  if i<0: break
                  if not posiciones or i-posiciones[-1]>1600: posiciones.append(i)
                  p=i+len(token)
              for i in posiciones[:8]:
                  print('\n===',token,'POS',i,'===')
                  print(s[max(0,i-1300):min(len(s),i+2200)])
