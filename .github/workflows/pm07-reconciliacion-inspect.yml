name: PM07 reconciliacion inspect
on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-reconciliacion-inspect.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer contexto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text()
          keys=['function diagnosticarStock','diagnosticarStock =','Descuadres de stock','caché no coincide','historico','histórico']
          parts=[]
          for k in keys:
              start=0
              while True:
                  i=s.lower().find(k.lower(), start)
                  if i<0: break
                  parts.append(s[max(0,i-2500):min(len(s),i+4500)])
                  start=i+len(k)
          Path('docs/plan-maestro/PM07_RECONCILIACION_DIAGNOSTICO.txt').write_text('\n\n=====\n\n'.join(parts[:30]))
          PY
      - name: Guardar diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/plan-maestro/PM07_RECONCILIACION_DIAGNOSTICO.txt
          git commit -m 'PM07 diag: extraer lógica de reconciliación' || exit 0
          git push origin HEAD:pm07-stock-reversos-ubicacion
