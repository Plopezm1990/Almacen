name: PM-07 corregir precedencia alertas

on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-corregir-precedencia-alertas.yml'

permissions:
  contents: write

jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir y verificar expresiones de stock bajo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for nombre in ['source-recovery/fuente-recuperado.js','fuente.js']:
              p=Path(nombre)
              s=p.read_text(encoding='utf-8')
              old='p2.tipo !== "elaborado" && p2._pm07Servidor ? p2._pm07BajoMinimo === true : Number(p2.stock) < Number(p2.stockMinimo || 0)'
              new='p2.tipo !== "elaborado" && (p2._pm07Servidor ? p2._pm07BajoMinimo === true : Number(p2.stock) < Number(p2.stockMinimo || 0))'
              # El bundle compilado renombra p2 a p22 en algunos bloques.
              old2='p22.tipo !== "elaborado" && p22._pm07Servidor ? p22._pm07BajoMinimo === true : Number(p22.stock) < Number(p22.stockMinimo || 0)'
              new2='p22.tipo !== "elaborado" && (p22._pm07Servidor ? p22._pm07BajoMinimo === true : Number(p22.stock) < Number(p22.stockMinimo || 0))'
              n=s.count(old)+s.count(old2)
              if n == 0 and (new in s or new2 in s):
                  print(nombre, 'PM07_PRECEDENCIA_YA_CORREGIDA=1')
              elif n > 0:
                  s=s.replace(old,new).replace(old2,new2)
                  p.write_text(s,encoding='utf-8')
                  print(nombre, 'PM07_PRECEDENCIA_CORREGIDA=', n)
              else:
                  raise SystemExit(nombre+': PM07_PRECEDENCIA_SELECTOR_NO_LOCALIZADO')
          PY
          cd source-recovery
          npm ci
          npm run build
          cp dist/fuente.js ../fuente.js
          cd ..
          node --check source-recovery/fuente-recuperado.js
          node --check fuente.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8')
          assert 'p2.tipo !== "elaborado" && p2._pm07Servidor ?' not in s
          assert s.count('p2.tipo !== "elaborado" && (p2._pm07Servidor ?') >= 2
          assert s.count('async function sincronizarStockPm07(') == 1
          print('PM07_ALERTAS_VERIFY_OK=1')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-recovery/fuente-recuperado.js fuente.js
          if git diff --cached --quiet; then
            echo 'PM07_ALERTAS_SIN_CAMBIOS=1'
          else
            git commit -m 'PM-07: corregir precedencia de alertas de stock'
            git push
          fi
          echo 'PM07_ALERTAS_OK=1'
