name: A09 materialize role policy UI

on:
  push:
    branches:
      - abc-f3-a09-1-2-role-policy-ui
    paths:
      - 'tools/a09-materialize-role-policy-ui.mjs'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Materializar A09.1.2 en runtime y source recovery
        run: |
          set -euo pipefail
          node tools/a09-materialize-role-policy-ui.mjs
          node --check fuente.js
          node --check source-recovery/fuente-recuperado.js
          git diff --check
          if git diff --exit-code --quiet -- fuente.js source-recovery/fuente-recuperado.js; then
            echo "A09_MATERIALIZE_SIN_CAMBIOS" >&2
            exit 1
          fi
      - name: Versionar archivos grandes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.js source-recovery/fuente-recuperado.js
          git commit -m "[skip netlify] A09.1.2 materialize role policy UI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
