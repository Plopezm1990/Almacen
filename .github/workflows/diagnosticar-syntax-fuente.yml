name: Diagnosticar sintaxis fuente en Chromium
on:
  push:
    branches: [la-suite-identidad]
    paths:
      - '.github/workflows/diagnosticar-syntax-fuente.yml'
      - '.github/scripts/diagnosticar-syntax-fuente.mjs'
      - 'fuente.js'
  workflow_dispatch:
jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Levantar copia local aislada
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/la-suite-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/la-suite-http.log || true
          exit 1
      - name: Capturar ubicación exacta del error
        env:
          PREVIEW_URL: http://127.0.0.1:4173/
        run: node .github/scripts/diagnosticar-syntax-fuente.mjs
