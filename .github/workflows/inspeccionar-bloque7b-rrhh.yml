name: Inspeccionar bloque 7B RRHH
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-bloque7b-rrhh.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar RRHH exacto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def block(a,b):
              i=s.index(a); j=s.index(b,i+len(a)); print('\n===== '+a+' =====\n'+s[i:j])
          block('function crearLogicaFichaje(', 'function crearLogicaGastos(')
          block('function crearLogicaTurnos(', 'function crearLogica')
          block('function crearLogicaNominas(', 'function crearLogica')
          for t in [
            'labelSingular: "empleado"',
            'tab === "personal"',
            'tab === "fichaje"',
            'tab === "turnos"',
            'tab === "nominas"',
            'fichajeAbierto',
            'setFichajes(fj)',
            'setTurnos(tu)',
            'setNominas(nom)',
            'empleadosFinales'
          ]:
              print('\n===== '+t+' =====')
              k=0; n=0
              while True:
                  i=s.find(t,k)
                  if i<0: break
                  n+=1; print(s[max(0,i-1000):min(len(s),i+1800)]); k=i+1
                  if n>=6: break
          PY