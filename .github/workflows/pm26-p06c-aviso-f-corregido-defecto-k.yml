name: PM26 P06c diseno corregido aviso F y registro defecto K

# Presenta el diseno corregido del aviso F (GRANT SELECT explicito,
# mutaciones revocadas explicitamente, RPC con
# private.pm11_puede_mutar_personal, search_path vacio cualificado,
# nulabilidad/backfill sin tocar produccion, matriz de pruebas) tras
# el rechazo del SQL anterior. Registra aparte el defecto K (endpoint
# de produccion hardcodeado en el flujo publico de prefiltro), sin
# corregirlo. No aplica ningun cambio en QA ni produccion. No toca
# main, Netlify, Supabase (escritura), ni TPV.

on:
  push:
    branches: [claude/pm26-preparacion-tecnica]
    paths:
      - 'tests/pm26/P06B_AVISO_F_DISENO_CORREGIDO.md'
      - 'tests/pm26/P06B_DEFECTO_K_ENDPOINT_PRODUCCION_HARDCODEADO.md'
      - 'tests/pm26/p06c-contract.mjs'
      - '.github/workflows/pm26-p06c-aviso-f-corregido-defecto-k.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger lo que P06c no debe tocar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          # Comparado contra el cierre previo de la rama (PM26 P06b,
          # b80460d), no contra origin/main.
          intocables='edge-auth-patch.js
          fuente.js
          index.html
          _headers
          reset-pruebas-preview.js
          pm11-compra-mobile-loader.js
          source-recovery/recuperar_candidato.py
          source-recovery/fuente-recuperado.js
          netlify.toml'
          cambiados="$(git diff --name-only b80460d1c2a10307ef90c1cc9d186152635c0ccc..HEAD)"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            if echo "$cambiados" | grep -qxF "$archivo"; then
              echo "PM26 P06c no debe tocar: $archivo" >&2
              exit 1
            fi
          done <<< "$intocables"
          # No debe existir ninguna migracion nueva del aviso F.
          if git diff --name-only b80460d1c2a10307ef90c1cc9d186152635c0ccc..HEAD -- supabase/migrations | grep -qi prefiltro; then
            echo "PM26 P06c: no debe existir ninguna migracion del aviso F en este commit" >&2
            exit 1
          fi
          echo 'PM26_P06C_INTOCABLES_INTACTOS=PASS'
      - name: Contrato PM26 P06c (diseno corregido aviso F + defecto K + sin secretos)
        run: node tests/pm26/p06c-contract.mjs

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM26 P06c -- diseno corregido presentado, nada aplicado
        run: |
          set -euo pipefail
          node tests/pm26/p06c-contract.mjs
          echo 'PM26_P06C_GATE=PASS'
