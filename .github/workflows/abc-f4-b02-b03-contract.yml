name: "ABC F4 B02-B03 -- estados e identidad de cobro"

on:
  push:
    branches: [abc-f4-b02-b03-tpv-payment-core]
    paths:
      - "supabase/migrations/20260929040000_abc_f4_b02_b03_checkout_bridge.sql"
      - "tests/f4/b02-b03/**"
      - "scripts/f4/b02-b03-materialize.mjs"
      - "source-recovery/fuente-recuperado.js"
      - "fuente.js"
      - ".github/workflows/abc-f4-b02-b03-contract.yml"
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260929040000_abc_f4_b02_b03_checkout_bridge.sql"
      - "tests/f4/b02-b03/**"
      - "scripts/f4/b02-b03-materialize.mjs"
      - "source-recovery/fuente-recuperado.js"
      - "fuente.js"
      - ".github/workflows/abc-f4-b02-b03-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: abc-f4-b02-b03-${{ github.ref }}
  cancel-in-progress: false

jobs:
  f4-b02-b03:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Guardar alcance F4 B02/B03
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9a9f860e278349934ff067f1d42e60d26954b76e HEAD
          migration="supabase/migrations/20260929040000_abc_f4_b02_b03_checkout_bridge.sql"
          test -f "$migration"
          grep -q "create function public.abc_preparar_checkout_cuenta" "$migration"
          grep -q "checkout_cuotas_importe_pendiente_b05" "$migration"
          if grep -Eiq '(PAN|CVV|card_number|numero_tarjeta)[[:space:]]+(text|varchar|json)' "$migration"; then
            echo "F4_B02_B03_SECURITY_FAIL: dato sensible de tarjeta" >&2
            exit 1
          fi
          if grep -Eiq 'abc_resolver_intento' scripts/f4/b02-b03-materialize.mjs; then
            echo "F4_B02_B03_SCOPE_FAIL: la UI B02/B03 no resuelve proveedor" >&2
            exit 1
          fi
          echo "F4_B02_B03_SCOPE=PASS"

      - name: Materializar UI F4
        run: node scripts/f4/b02-b03-materialize.mjs

      - name: Verificar Source Recovery y sintaxis
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/f4/b02-b03-materialize.mjs
          node --check source-recovery/fuente-recuperado.js
          node --check fuente.js
          python3 source-recovery/recuperar_candidato.py --check
          echo "F4_B02_B03_SOURCE_RECOVERY=PASS"

      - name: Preparar fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/f3/a08/fixture-a08.sql
      - name: Aplicar F2 M01
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
      - name: Aplicar F2 M01b
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
      - name: Aplicar F2 M02A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
      - name: Aplicar F2 M02B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
      - name: Aplicar F2 M03A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
      - name: Aplicar F2 M03B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
      - name: Aplicar F2 M03C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
      - name: Aplicar F2 M04A-D
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924003000_abc_f2_m04c_outbox_persistente.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924004000_abc_f2_m04d_acl_parity.sql
      - name: Aplicar F3 A03-A09
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924010000_abc_f3_a03_server_authority.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924020000_abc_f3_a04_variants_modifiers.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924030000_abc_f3_a05_order_state_machine.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924040000_abc_f3_a06_account_recovery.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924050000_abc_f3_a07_tables_zones.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924060000_abc_f3_a08_account_split_merge.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924160739_abc_f3_a09_descuentos_cortesias.sql

      - name: Aplicar F4 B02/B03
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260929040000_abc_f4_b02_b03_checkout_bridge.sql

      - name: Ejecutar contrato F4 B02/B03
        run: psql -v ON_ERROR_STOP=1 -f tests/f4/b02-b03/b02-b03-contract.sql

      - name: Build directo Source Recovery
        shell: bash
        working-directory: source-recovery
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          rm -rf dist
          npm run build
          node --check dist/fuente.js
          echo "F4_B02_B03_BUILD=PASS"

      - name: Validar manifiesto y no regresión estructural
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validar-manifiesto-ci.mjs --self-test
          node .github/scripts/validar-manifiesto-ci.mjs
          git diff --check
          echo "F4_B02_B03_MANIFEST=PASS"

      - name: Persistir Source Recovery y runtime materializados
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-recovery/fuente-recuperado.js fuente.js
          if git diff --cached --quiet; then
            echo "F4_B02_B03_RUNTIME_ALREADY_CURRENT=1"
            exit 0
          fi
          git commit -m "[skip netlify] F4 B02-B03 materializar cobro TPV"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "F4_B02_B03_RUNTIME_COMMITTED=1"
