name: Actualizar documentación source recovery
on:
  push:
    branches: [documentacion-proyecto-a]
    paths:
      - .github/workflows/actualizar-documentacion-source-recovery.yml
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar estado técnico
        shell: python
        run: |
          from pathlib import Path
          p=Path('docs/PROYECTO_A_ESTADO_TECNICO.md')
          s=p.read_text(encoding='utf-8')
          old_head='- Head: `3417219fe435bc3d8fcb97d23c3a05a629a9b06e`'
          new_head='- Head: `5ba86a6d46f843b9385fb07de36cde6fe19b0c1d`'
          if old_head not in s:
              raise SystemExit('No se encontró el head antiguo esperado')
          s=s.replace(old_head,new_head,1)
          ini=s.index('## 8. Recuperación del código fuente y build reproducible')
          fin=s.index('\n---\n\n## 9. Edge Functions de Supabase',ini)
          nueva='''## 8. Recuperación del código fuente y build reproducible

El repositorio original no conservaba `fuente.jsx`, `package.json` ni un proceso de build original recuperable desde historial Git. La rama `recuperacion-fuente` preserva ahora una base recompilable validada dentro de `source-recovery/`.

### Hallazgo y recuperación

Dentro de `fuente.js` existe una sección marcada `// fuente.jsx`. Se extrajo esa lógica de aplicación, manteniendo el código ya transformado a `React.createElement`, y se restauraron imports normales de las dependencias.

`entrada-recuperada.js` hace explícita además la dependencia de seguridad que el bundle histórico ocultaba dentro de un chunk:

```js
import "../edge-auth-patch.js";
import "./fuente-recuperado.js";
```

Así el build recuperado no depende accidentalmente del nombre de un chunk para cargar la barrera de seguridad.

### Paridad exacta con el PR #4

La recuperación se actualizó usando el `fuente.js` validado del PR #4 (`preparacion-sin-netlify`).

- bundle de referencia: **5.427.505 bytes**;
- cuerpo de aplicación comparado en cada lado: **1.118.121 bytes**;
- SHA-256 del cuerpo en ambos lados: `03962de3bb9ae5ab6889f20bd772e422097d8ffd895c8e4ded06a9e7f1a76356`;
- marcador: **`PARIDAD_EXACTA_PR4=1`**;
- blob Git validado de `source-recovery/fuente-recuperado.js`: `c43d24f861452ba722a8a07fdd44f71513767b3b`.

La lógica recuperada actual coincide exactamente con el cuerpo de aplicación del bundle preparado del PR #4; no es una reescritura aproximada.

### Recompilación limpia

Con las dependencias fijadas en `package-lock.json` se ejecutó `npm ci`, `npm run check`, `npm run build` y `node --check dist/fuente.js`.

Resultado:

- instalación limpia correcta;
- fuente y entrada pasan `node --check`;
- esbuild genera el bundle correctamente;
- bundle recompilado de referencia: **5.065.205 bytes**;
- se conservan marcadores esenciales como `GestionAlmacen`, `crearLogicaCaja`, `SelectorLocalInformes` y `ErroresSistema`;
- marcador: **`BUILD_PR4_RECUPERADO_OK=1`**.

### Seguridad incluida

Para la prueba funcional final se compiló con el `edge-auth-patch.js` actual del PR #4. Se verificó dentro del bundle recompilado la presencia de `obtener_contexto_operativo` y la carga de `seleccion-neutral-patch.js`.

Marcador: **`SEGURIDAD_INCLUIDA_EN_BUILD=1`**.

### Smoke integral del build recuperado

Se construyó un sitio temporal con los archivos del PR #4 y se sustituyó únicamente `fuente.js` por el bundle recompilado desde `source-recovery`.

La prueba se ejecutó en Chromium headless, con contexto limpio por módulo, service worker bloqueado y Supabase interceptado para impedir acceso o modificación de datos reales. Se validaron los mismos **38 módulos** del smoke completo del PR #4.

Resultado:

- `MODULOS_OBJETIVO=38`
- `MODULOS_OK_TOTAL=38`
- `FALLOS=[]`
- `SMOKE_FUENTE_RECUPERADO_PR4_OK=1`

Además, en cada contexto se verificó `window.storage`, `window.__nubeActiva === false`, ausencia de errores JavaScript, `#root` renderizado y cero peticiones a Supabase en modo local.

### Dependencias identificadas

Versiones originales demostradas desde el bundle cuando fue posible:

- React 18.3.1
- React DOM 18.3.1
- Supabase JS 2.112.4
- XLSX/SheetJS 0.18.5
- jsPDF 4.2.1

Lucide y AutoTable se fijaron como versiones de compatibilidad validadas cuando el bundle no exponía una cadena inequívoca de versión.

### Estado

La recuperación ya no es solo una copia de emergencia: es una **base recompilable con paridad exacta y smoke 38/38** contra el estado preparado del PR #4. Aun así, no se sustituye automáticamente el `fuente.js` de producción; su adopción como fuente oficial debe hacerse dentro del despliegue controlado pendiente y después de las pruebas reales de roles/negocio.
'''
          s=s[:ini]+nueva+s[fin:]
          s=s.replace('- continuar transición desde bundle compilado hacia el código recuperado/recompilable;', '- adoptar gradualmente `source-recovery` como fuente oficial del frontend después del despliegue y las pruebas reales;')
          s=s.replace('- exista un proceso de build mantenible y documentado;', '- el proceso de build recuperado y documentado se haya adoptado de forma controlada como fuente oficial;')
          p.write_text(s,encoding='utf-8')
      - name: Guardar actualización
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROYECTO_A_ESTADO_TECNICO.md
          git diff --cached --quiet && exit 0
          git commit -m 'Actualizar estado técnico de recuperación de fuente [skip ci]'
          git push origin HEAD:documentacion-proyecto-a
