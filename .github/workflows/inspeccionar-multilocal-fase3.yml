name: Inspeccionar multilocal fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-multilocal-fase3.yml
  workflow_dispatch:

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar dependencias exactas de Productos y Pedidos
        shell: python
        run: |
          from pathlib import Path

          s = Path('fuente.js').read_text(encoding='utf-8')
          print('FUENTE_LEN', len(s))

          def posiciones(marcador):
              out=[]; i=0
              while True:
                  j=s.find(marcador,i)
                  if j < 0: break
                  out.append(j); i=j+1
              return out

          def contexto(etiqueta, marcador, antes=1800, despues=6000):
              ps=posiciones(marcador)
              print(f'\n===== {etiqueta} =====')
              print('MARCADOR', marcador, 'POSICIONES', ps)
              for i in ps[-3:]:
                  print('\n--- POS',i,'---')
                  print(s[max(0,i-antes):min(len(s),i+despues)])

          for etiqueta, marcador in [
              ('ABC','clasificacionABC'),
              ('SUGERENCIAS','sugerenciasPedido'),
              ('PEDIDOS PENDIENTES','pedidosPendientes'),
              ('PRODUCTO POR ID','productoPorId'),
              ('LOGICA PRODUCTOS CALL','crearLogicaProductos({'),
              ('LOGICA PEDIDOS CALL','crearLogicaPedidos({'),
              ('RENDER PRODUCTOS','tab === "productos"'),
              ('RENDER PEDIDOS','tab === "pedidos"'),
              ('MENU COMPRAR','"Comprar"'),
              ('MENU CADUCIDADES','"Caducidades"'),
              ('ITEMS META','const itemsMeta = [')
          ]:
              contexto(etiqueta, marcador)
