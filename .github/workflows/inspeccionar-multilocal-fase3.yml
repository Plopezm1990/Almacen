name: Inspeccionar multilocal fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-multilocal-fase3.yml
  workflow_dispatch:

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar puntos exactos del bundle
        shell: python
        run: |
          from pathlib import Path
          import re

          s = Path('fuente.js').read_text(encoding='utf-8')
          print('FUENTE_LEN', len(s))

          tabs = sorted(set(re.findall(r'tab === "([^"]+)"', s)))
          print('TABS', tabs)

          def contexto(etiqueta, marcador, antes=1200, despues=4200):
              i = s.find(marcador)
              print(f'\n===== {etiqueta} =====')
              if i < 0:
                  print('NO ENCONTRADO:', marcador)
                  return
              print('POS', i)
              print(s[max(0, i-antes):min(len(s), i+despues)])

          # Render principal: qué datos recibe cada módulo operativo.
          for marcador in [
              'tab === "productos"',
              'tab === "caducidades"',
              'tab === "comprar"',
              'tab === "pedidos"',
              'tab === "albaranes"',
              'tab === "almacen"',
              'tab === "conteos"'
          ]:
              contexto('RENDER ' + marcador, marcador)

          # Componentes/funciones que participan en el primer bloque multilocal.
          for nombre in [
              'crearLogicaProductos',
              'crearLogicaPedidos',
              'crearLogicaAlbaranes',
              'crearLogicaConteos',
              'Productos',
              'Caducidades',
              'Comprar',
              'Pedidos',
              'Albaranes'
          ]:
              contexto('DEF ' + nombre, 'function ' + nombre + '(', 200, 9000)

          # Estado y derivados locales ya existentes alrededor de localActivoId.
          contexto('ESTADO localActivoId', 'const [localActivoId', 2500, 7000)
          contexto('DERIVADO productosDelLocalActivo', 'productosDelLocalActivo', 2500, 7000)
