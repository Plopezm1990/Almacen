name: Inspeccionar multilocal fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-multilocal-fase3.yml
  workflow_dispatch:

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer fragmentos exactos para el primer parche
        shell: python
        run: |
          from pathlib import Path
          s = Path('fuente.js').read_text(encoding='utf-8')

          def trozo(nombre, marcador, antes, despues):
              i = s.find(marcador)
              assert i >= 0, f'No encontrado: {marcador}'
              print(f'\n===== {nombre} @ {i} =====')
              print(s[max(0,i-antes):min(len(s),i+despues)])

          trozo('DERIVADOS LOCALES', 'const productosDelLocalActivo =', 500, 1800)
          trozo('DECLARACION SUGERENCIAS', 'const sugerenciasPedido =', 700, 2200)
          trozo('PEDIDOS PENDIENTES', 'const pedidosPendientes =', 300, 900)
          trozo('RENDER PRODUCTOS', '), tab === "proveedores"', 0, 2400)
          trozo('RENDER PEDIDOS', '), tab === "buscar"', 0, 1800)
          trozo('BADGE PEDIDOS', '{ id: "pedidos", label: "Pedidos"', 250, 500)
          trozo('TOPBAR CONTADOR', 'TopBarC, {', 300, 900)
