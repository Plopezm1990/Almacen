name: Inspeccionar dashboard premium actual
on:
  push:
    branches: [la-suite-identidad]
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Mostrar Dashboard actual
        shell: bash
        run: |
          set -euo pipefail
          sed -n '122230,122560p' fuente.js
          echo '=== CSS PREMIUM ==='
          grep -n -A100 -B20 'la-dashboard-premium' index.html fuente.js || true
