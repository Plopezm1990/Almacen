name: Verificar paridad fuente recuperado
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/verificar-paridad-fuente.yml
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comparar cuerpo recuperado con bundle
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          bundle=Path('fuente.js').read_text(encoding='utf-8').splitlines()
          rec=Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8').splitlines()
          marca=next(i for i,l in enumerate(bundle) if l.strip()=='// fuente.jsx')
          app=bundle[marca:]
          # El recuperado añade 14 líneas de cabecera y conserva app[3:] exacto.
          cuerpo_bundle='\n'.join(app[3:])+'\n'
          cuerpo_rec='\n'.join(rec[14:])+'\n'
          hb=hashlib.sha256(cuerpo_bundle.encode()).hexdigest()
          hr=hashlib.sha256(cuerpo_rec.encode()).hexdigest()
          print('SHA_BUNDLE_BODY='+hb)
          print('SHA_RECOVERED_BODY='+hr)
          print('BYTES_BUNDLE_BODY='+str(len(cuerpo_bundle.encode())))
          print('BYTES_RECOVERED_BODY='+str(len(cuerpo_rec.encode())))
          if cuerpo_bundle != cuerpo_rec:
            raise SystemExit('PARIDAD_FALLIDA')
          print('PARIDAD_EXACTA=1')
