name: PM12 P08 replay concurrencia y fallos

on:
  push:
    branches: [pm12-conteo-estados-honestos]
    paths:
      - 'fuente.js'
      - 'source-recovery/fuente-recuperado.js'
      - 'index.html'
      - 'pm12-stock-atomico-v1.js'
      - 'tests/pm12/P08_FALLOS_REPLAY_CONCURRENCIA.md'
      - 'tests/pm12/p08-fallos-replay-concurrencia-contract.mjs'
      - 'tests/pm12/p08-instancias-fallos-contract.mjs'
      - 'supabase/migrations/20260907155028_pm12_p08_stock_atomico.sql'
      - 'tests/pm12/db/**'
      - 'tests/pm12/supabase-full/**'
      - '.github/workflows/pm12-p08-replay-concurrencia-fallos.yml'
      - '.github/workflows/pm12-p07-permisos-aislamiento-ajustes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: pm12_p08_test
          POSTGRES_PASSWORD: pm12-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar aislamiento de rama y main congelado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pm12-conteo-estados-honestos"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          echo 'MAIN_FROZEN=1'

      - name: Validar sintaxis
        shell: bash
        run: |
          set -euo pipefail
          node --check fuente.js
          node --check source-recovery/fuente-recuperado.js
          node --check pm12-conteo-estados-v1.js
          node --check pm12-stock-atomico-v1.js

      - name: Contrato P08 fallos replay y concurrencia
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm12/p08-fallos-replay-concurrencia-contract.mjs

      - name: Instancias, publicación interrumpida, respuesta perdida y UX
        run: node tests/pm12/p08-instancias-fallos-contract.mjs

      - name: Preparar cliente PostgreSQL de pruebas
        run: npm ci --prefix tests/pm12/db --ignore-scripts --no-audit --no-fund

      - name: Transacción candidata en PostgreSQL desechable
        env:
          PM12_TEST_DATABASE_URL: postgresql://postgres:pm12-ci-only@127.0.0.1:5432/pm12_p08_test
        run: node tests/pm12/db/p08-postgres-contract.mjs

      - name: Regresiones PM12 P02-P07
        shell: bash
        run: |
          set -euo pipefail
          for t in tests/pm12/p02-*contract.mjs tests/pm12/p03-*contract.mjs tests/pm12/p04-*contract.mjs tests/pm12/p05-*contract.mjs tests/pm12/p06-*contract.mjs tests/pm12/p07-*contract.mjs; do
            node "$t"
          done
          echo 'REGRESSION_P02_P07=PASS'

      - name: Confirmar cero escrituras externas
        shell: bash
        run: |
          set -euo pipefail
          # The new migration is executed only by the loopback-only test harness.
          # No Supabase credentials, db push, deploy, or remote connection are used.
          test -z "$(git diff --name-only HEAD^ HEAD -- supabase/ | grep -v '^supabase/migrations/20260907155028_pm12_p08_stock_atomico.sql$' || true)"
          echo 'PM12_P08_SUPABASE_REMOTE_WRITES=0'
          echo 'PM12_P08_PRODUCTION_WRITES=0'

  validar-supabase-completo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Preparar Supabase local reproducible
        run: |
          set -euo pipefail
          # The pinned Supabase package installs its platform CLI in postinstall.
          npm ci --prefix tests/pm12/supabase-full --no-audit --no-fund
          node tests/pm12/supabase-full/prepare-fixture.mjs

      - name: Iniciar Auth PostgREST y PostgreSQL desechables
        run: |
          set -euo pipefail
          tests/pm12/supabase-full/node_modules/.bin/supabase start \
            --workdir tests/pm12/supabase-full \
            -x realtime,storage-api,imgproxy,studio,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
          tests/pm12/supabase-full/node_modules/.bin/supabase status \
            --workdir tests/pm12/supabase-full -o env \
            > tests/pm12/supabase-full/supabase/.temp/status.env

      - name: Contrato Auth PostgREST RLS y RPC P08
        run: node tests/pm12/supabase-full/p08-auth-postgrest-rls-contract.mjs

      - name: Detener Supabase desechable
        if: always()
        run: tests/pm12/supabase-full/node_modules/.bin/supabase stop --workdir tests/pm12/supabase-full --no-backup || true
