name: PM09 Punto 12 conciliar Resultados
on:
  push:
    branches: [pm09-conciliacion-ventas-analitica]
    paths:
      - 'tools/corregir_pm09_p12_resultados.py'
      - 'tests/pm09/p12-resultados-margin-contract.mjs'
      - '.github/workflows/pm09-p12-corregir.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm09-conciliacion-ventas-analitica
      - name: Aplicar punto 12
        run: |
          set -euo pipefail
          python tools/corregir_pm09_p12_resultados.py
          node --check fuente.js
      - name: Validar Resultados y margen
        run: |
          set -euo pipefail
          node tests/pm09/p12-resultados-margin-contract.mjs
      - name: Regresiones PM09 previas
        run: |
          set -euo pipefail
          node tests/pm09/p11-iva-contract.mjs
          node tests/pm09/p10-caja-contract.mjs
          node tests/pm09/p09-historial-contract.mjs
          node tests/pm09/la007-results-contract.mjs
          node tests/pm09/la008-rotation-margin-contract.mjs
      - name: Regresiones heredadas
        run: |
          set -euo pipefail
          node tests/pm05/frontend-contract.mjs
          node tests/pm07/frontend-contract.mjs
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm08/replay-scope-contract.mjs
      - name: Generar evidencia punto 12
        run: |
          set -euo pipefail
          SHA256=$(sha256sum fuente.js | awk '{print $1}')
          cat > tests/pm09/P12_RESULTADOS_EVIDENCIA.json <<EOF
          {
            "punto": 12,
            "estado": "CORREGIDO_PENDIENTE_DE_QA",
            "rama": "pm09-conciliacion-ventas-analitica",
            "baseEntradaWorkflow": "${GITHUB_SHA}",
            "fuenteSha256": "${SHA256}",
            "riesgoReproducido": "Resultados ya restaba REVERSO por LA-007 pero no restaba DEVOLUCION_CLIENTE en ingresos/coste globales; una devolución podía dejar margen e ingreso superiores al neto real.",
            "cambio": "Resultados descuenta REVERSO y DEVOLUCION_CLIENTE en su propia fecha; el coste de correcciones usa coste histórico trazable y no ficha actual. El resultado neto mantiene gastos y costes de inventario separados.",
            "alcance": "fuente.js y pruebas solo en rama PM09; sin esquema, sin main, sin produccion"
          }
          EOF
      - name: Guardar candidato solo en PM09
        run: |
          set -euo pipefail
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add fuente.js tests/pm09/P12_RESULTADOS_EVIDENCIA.json
          git diff --cached --quiet && exit 0
          git commit -m "PM09: conciliar Resultados y margen punto 12"
          git push origin HEAD:pm09-conciliacion-ventas-analitica
