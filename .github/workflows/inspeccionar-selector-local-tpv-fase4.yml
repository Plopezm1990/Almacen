name: Aplicar contexto visible TPV fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-selector-local-tpv-fase4.yml
      - .github/scripts/corregir_contexto_visible_tpv_fase4.py
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar correccion
        run: python3 .github/scripts/corregir_contexto_visible_tpv_fase4.py
      - name: Validar
        run: |
          node --check fuente.js
          git diff --check
          grep -F 'El TPV no puede abrirse en Todos los locales.' fuente.js
          grep -F 'localInformeId && localActivoId === localInformeId ?' fuente.js
      - name: Limpiar y guardar
        run: |
          rm -f .github/workflows/inspeccionar-selector-local-tpv-fase4.yml
          rm -f .github/scripts/corregir_contexto_visible_tpv_fase4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuente.js .github/workflows/inspeccionar-selector-local-tpv-fase4.yml .github/scripts/corregir_contexto_visible_tpv_fase4.py
          git commit -m 'Alinear TPV con el local visible seleccionado'
          git push origin HEAD:tpv-ventas-fase-4
