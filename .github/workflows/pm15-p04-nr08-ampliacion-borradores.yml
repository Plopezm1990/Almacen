name: PM15 P04 NR-08 ampliacion proteccion de borradores

on:
  push:
    branches: [claude/pm15-contexto-borradores-errores]
    paths:
      - 'fuente.js'
      - 'tests/pm15/**'
      - '.github/workflows/pm15-p04-nr08-ampliacion-borradores.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-p04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger main y alcance P04 (sin cambios en supabase/)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "767a2c3163f924b7599338785fe4331f78f0e1ac"
          unexpected="$(git diff --name-only origin/main..HEAD -- supabase/ || true)"
          if [ -n "$unexpected" ]; then
            echo 'PM15 P04 es un cambio de frontend puro: no debe tocar supabase/' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo 'PM15_P04_MAIN_FROZEN=PASS'
          echo 'PM15_P04_SIN_CAMBIOS_SUPABASE=PASS'
      - name: Sintaxis bundle
        run: node --check fuente.js
      - name: Contrato PM15 P01 + P02 + P03 + P04
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm15/p01-la022-locales-empresa-contract.mjs
          node tests/pm15/p01-nr08-cambio-contexto-no-alcanzable-contract.mjs
          node tests/pm15/p02-mej01-contexto-modales-contract.mjs
          node tests/pm15/p03-mej02-confirmacion-pago-destino-contract.mjs
          node tests/pm15/p04-nr08-proteccion-borrador-navegacion-contract.mjs
      - name: Regresión completa (todas las suites vigentes)
        shell: bash
        run: |
          set -euo pipefail
          for d in tests/g1 tests/pm04 tests/pm05 tests/pm07 tests/pm08 tests/pm09 tests/pm10 tests/pm11-compra tests/pm12 tests/pm13 tests/pm14; do
            for t in "$d"/*.mjs; do
              [ -f "$t" ] || continue
              node "$t"
            done
          done
          echo 'PM15_P04_REGRESION_COMPLETA=PASS'
      - name: Sin secretos
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm15/p04-nr08-proteccion-borrador-navegacion-contract.mjs \
            tests/pm15/P04_CIERRE_NR08_AMPLIACION_BORRADORES.md
          echo 'PM15_P04_NO_SECRET=PASS'

  gate-final:
    needs: validar-p04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM15 P04
        run: |
          set -euo pipefail
          node tests/pm15/p01-la022-locales-empresa-contract.mjs
          node tests/pm15/p01-nr08-cambio-contexto-no-alcanzable-contract.mjs
          node tests/pm15/p02-mej01-contexto-modales-contract.mjs
          node tests/pm15/p03-mej02-confirmacion-pago-destino-contract.mjs
          node tests/pm15/p04-nr08-proteccion-borrador-navegacion-contract.mjs
          echo 'PM15_P04_GATE_FINAL=PASS'
