name: PM10 Punto 2 inventario validaciones
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p02-inventario.yml'
      - 'fuente.js'
permissions:
  contents: read
jobs:
  inventario:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Resumen estructural de dominios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          print(f'PM10_P02_BYTES={len(s.encode())}')
          groups={
            'PRODUCTOS':['guardarProductoNuevo','crearLogicaProductos','addProducto','updateProducto','unidadesPorCaja','stockMinimo','precioVenta'],
            'PEDIDOS':['crearLogicaPedidos','crearPedido','actualizarPedido','cantidadPedida','cantidadRecibida'],
            'RECEPCION':['recibirPedido','procesarRecepcion','cantidadRecibida','Quedará como recibido parcial'],
            'PERSONAL':['function Personal','crearLogicaPersonal','horasSemanales','salarioBrutoMensual','diasVacacionesAnuales','pagas'],
            'ENCARGOS':['crearLogicaEncargos','addEncargo','updateEncargo','fechaEntrega','anticipo','Sin cliente'],
            'PERSISTENCIA':['async function loadKey','async function saveKey','window.storage','almacen_kv','setOriginal(key, value, shared)']
          }
          for group, terms in groups.items():
            print(f'\n===== {group} =====')
            for term in terms:
              ms=list(re.finditer(re.escape(term),s,re.I))
              print(f'{term}:COUNT={len(ms)} OFFSETS={[m.start() for m in ms[:12]]}')
          PY
      - name: Extractos exactos de formularios y lógica
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          queries=[
            ('PRODUCTOS','function guardarProductoNuevo'),('PRODUCTOS','function addProducto'),('PRODUCTOS','function updateProducto'),
            ('PEDIDOS','function crearPedido'),('PEDIDOS','function actualizarPedido'),
            ('RECEPCION','function recibirPedido'),('RECEPCION','Quedará como recibido parcial'),('RECEPCION','function procesarRecepcion'),
            ('PERSONAL','function Personal'),('PERSONAL','horasSemanales: Number(form.horasSemanales)'),
            ('ENCARGOS','function addEncargo'),('ENCARGOS','function updateEncargo'),
            ('PERSISTENCIA','async function loadKey'),('PERSISTENCIA','async function saveKey'),('PERSISTENCIA','setOriginal(key, value, shared)')
          ]
          for group,q in queries:
            ms=list(re.finditer(re.escape(q),s,re.I))
            print(f'\n### {group} :: {q} :: total={len(ms)}')
            for i,m in enumerate(ms[:3],1):
              a=max(0,m.start()-1800); b=min(len(s),m.end()+5000)
              print(f'[{i}] offset={m.start()} '+s[a:b].replace('\n','\\n'))
          PY
      - name: Señales de validación de inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          terms=['Number.isFinite','min: 0','min:0','min: 1','min:1','cantidad <= 0','cantidad>0','cantidad > 0','salario < 0','vacaciones < 0','pagas <','stockMinimo <','precioVenta <','unidadesPorCaja <=','anticipo >','fechaEntrega']
          for q in terms:
            ms=list(re.finditer(re.escape(q),s,re.I))
            print(f'{q}:COUNT={len(ms)} OFFSETS={[m.start() for m in ms[:15]]}')
          PY
      - name: Sintaxis bundle exacto
        run: node --check fuente.js
