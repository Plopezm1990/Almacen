name: PM-06 aplicar identidad financiera

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-aplicar-identidad-financiera.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 6

      - name: Diagnosticar parche PM-06
        shell: bash
        run: |
          set -euo pipefail

          git show 9860ccb7a88a1a98a02bf79295cdfafd653b1090:.github/workflows/pm06-aplicar-identidad-financiera.yml \
            | awk '/^H4sI/{capture=1} capture{if ($0=="B64") exit; print}' \
            > /tmp/pm06_patch.b64

          base64 -d /tmp/pm06_patch.b64 | gzip -d > /tmp/pm06_patch.py

          echo '=== SELECTOR GUARDAR ALBARAN ==='
          grep -n -C 14 'identidad guardar albar' /tmp/pm06_patch.py || true
          echo '=== CONTEXTO FUENTE CANDIDATO ==='
          grep -n -C 5 -E 'guardarAlbar|albaran|albarán' source-recovery/fuente-recuperado.js | head -n 220 || true
          echo '=== FIN DIAGNOSTICO ==='

          exit 1
