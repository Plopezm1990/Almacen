name: PM-06 aplicar identidad financiera

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-aplicar-identidad-financiera.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 25

      - name: Diagnosticar bloque real de persistencia
        shell: bash
        run: |
          set -euo pipefail
          git show 5a0a712c49b0dd58420ffb4e193d428824bb9916:source-recovery/fuente-recuperado.js > /tmp/base.js
          python3 - <<'PY'
          from pathlib import Path
          s = Path('/tmp/base.js').read_text(encoding='utf-8')
          marker = 'saveKey("facturasDirectas", facturasDirectas)'
          p = s.find(marker)
          print('COUNT=', s.count(marker), 'POS=', p)
          if p < 0:
              raise SystemExit('marker no localizado')
          a = max(0, p-450)
          b = min(len(s), p+650)
          print('=== REPR ===')
          print(repr(s[a:b]))
          print('=== TEXTO ===')
          print(s[a:b])
          print('=== FIN ===')
          PY
          exit 1
