name: PM-06 aplicar identidad financiera

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-aplicar-identidad-financiera.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 7

      - name: Diagnosticar guardarAlbaran PM-06
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8')
          start = s.find('function crearLogicaAlbaranes(')
          end = s.find('\nfunction ', start + 1)
          if start < 0 or end < 0:
              raise SystemExit('crearLogicaAlbaranes no localizada')
          b = s[start:end]
          needle = 'guardarAlbaran'
          p = b.find(needle)
          print('BLOQUE_LEN=', len(b), 'POS_GUARDAR=', p)
          if p < 0:
              raise SystemExit('guardarAlbaran no localizado')
          print(b[max(0,p-2200):min(len(b),p+6500)])
          PY
          exit 1
