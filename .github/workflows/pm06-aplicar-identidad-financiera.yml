name: PM-06 aplicar identidad financiera

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-aplicar-identidad-financiera.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 12
      - name: Diagnosticar useEffect pagos PM-06
        shell: bash
        run: |
          set -euo pipefail
          git show 9860ccb7a88a1a98a02bf79295cdfafd653b1090:.github/workflows/pm06-aplicar-identidad-financiera.yml \
            | awk '/^H4sI/{capture=1} capture{if ($0=="B64") exit; print}' > /tmp/pm06_patch.b64
          base64 -d /tmp/pm06_patch.b64 | gzip -d > /tmp/pm06_patch.py
          grep -n -C 18 -E 'save pagos|pagosFacturas.*ready|saveKey\("pagosFacturas"' /tmp/pm06_patch.py || true
          exit 1
