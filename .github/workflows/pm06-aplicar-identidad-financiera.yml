name: PM-06 aplicar identidad financiera

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-aplicar-identidad-financiera.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Aplicar parche PM-06 y reconstruir
        shell: bash
        run: |
          set -euo pipefail

          git show 9860ccb7a88a1a98a02bf79295cdfafd653b1090:.github/workflows/pm06-aplicar-identidad-financiera.yml \
            | awk '/^H4sI/{capture=1} capture{if ($0=="B64") exit; print}' \
            > /tmp/pm06_patch.b64

          test -s /tmp/pm06_patch.b64
          base64 -d /tmp/pm06_patch.b64 | gzip -d > /tmp/pm06_patch.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/pm06_patch.py')
          s = p.read_text(encoding='utf-8')
          old = """def must_replace(text, old, new, label, count=1):
              n = text.count(old)
              if n != count:
                  raise SystemExit(f'{label}: esperado {count}, encontrado {n}')
              return text.replace(old, new, count)
          """
          new = """def must_replace(text, old, new, label, count=1):
              n = text.count(old)
              if label == 'index: get variables':
                  if n != 2:
                      raise SystemExit(f'{label}: esperado 2, encontrado {n}')
                  return text.replace(old, new, 1)
              if n != count:
                  raise SystemExit(f'{label}: esperado {count}, encontrado {n}')
              return text.replace(old, new, count)
          """
          if s.count(old) != 1:
              raise SystemExit('PM06: no se pudo localizar de forma única must_replace')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m py_compile /tmp/pm06_patch.py
          python3 /tmp/pm06_patch.py

          cd source-recovery
          npm ci
          npm run build
          cp dist/fuente.js ../fuente.js
          cd ..

          node --check source-recovery/fuente-recuperado.js
          node --check fuente.js

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html source-recovery/fuente-recuperado.js fuente.js

          if git diff --cached --quiet; then
            echo 'PM06_APPLY_NO_CHANGES=1'
          else
            git commit -m 'PM-06: aplicar identidad documental y pagos idempotentes'
            git push
          fi

          echo 'PM06_APPLY_OK=1'
