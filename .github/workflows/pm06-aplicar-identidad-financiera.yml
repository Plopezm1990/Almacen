name: PM-06 aplicar identidad financiera

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-aplicar-identidad-financiera.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 9

      - name: Diagnosticar export snapshot proveedor
        shell: bash
        run: |
          set -euo pipefail
          git show 9860ccb7a88a1a98a02bf79295cdfafd653b1090:.github/workflows/pm06-aplicar-identidad-financiera.yml \
            | awk '/^H4sI/{capture=1} capture{if ($0=="B64") exit; print}' \
            > /tmp/pm06_patch.b64
          base64 -d /tmp/pm06_patch.b64 | gzip -d > /tmp/pm06_patch.py

          echo '=== PATCH EXPORT SNAPSHOT ==='
          grep -n -C 16 'export snapshot proveedor' /tmp/pm06_patch.py || true
          echo '=== SOURCE EXPORTS PROVEEDOR ==='
          grep -n -C 4 -E 'proveedorPorId|crearLogicaProveedores|return \{' source-recovery/fuente-recuperado.js | tail -n 260 || true
          echo '=== FIN ==='
          exit 1
