name: G1 Punto 3 revalidar LA019

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p03-la019.yml'
      - 'tests/g1/P03_LA019_EVIDENCIA.md'
      - 'tests/g1/p03-la019-contract.mjs'
      - 'tests/pm08/**'
      - 'supabase/migrations/20260904204500_pm08_caja_devolucion_indivisible.sql'
      - 'supabase/migrations/20260904234000_pm08_replay_scope_hardening.sql'
      - 'supabase/migrations/20260905115000_pm09_fecha_operacion_economica.sql'

permissions:
  contents: read

jobs:
  la019:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar descendencia de PM10 final
        run: |
          git merge-base --is-ancestor 94d37cc7a5176e3a44d00f8f8bfb79a630dae314 HEAD
          echo 'G1_P03_DESCIENDE_PM10_FINAL=1'
      - name: Sintaxis del candidato
        run: node --check fuente.js
      - name: Contratos heredados PM08
        run: |
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm08/replay-scope-contract.mjs
      - name: Contratos económicos PM09 relacionados
        run: |
          node tests/pm09/p10-caja-contract.mjs
          node tests/pm09/p15-special-economic-contract.mjs
          node tests/pm09/p17-robustness-contract.mjs
      - name: Contrato G1.3 LA019
        run: node tests/g1/p03-la019-contract.mjs
      - name: Resumen
        run: |
          echo 'G1_P03_LA019=PASS'
          echo 'G1_GATE_SUPERADO=NO'
          echo 'G1_SIGUIENTE=P04_LA023'
