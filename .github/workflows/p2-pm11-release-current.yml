name: "P2-PM11 — Personal post-reset sobre release actual"

on:
  pull_request:
    branches: [release]
    paths:
      - '.github/workflows/p2-pm11-release-current.yml'
      - '.github/scripts/p2-pm11/**'
      - 'docs/plan-maestro/P2_PM11_RELEASE_CURRENT.md'
      - 'supabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  p2-pm11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Frontera exacta del candidato
        shell: bash
        run: |
          set -euo pipefail
          BASE='6b26b391e0d248a6f6d4f8271bc08938b5eee118'
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse origin/release)" = "$BASE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$ACTUAL_HEAD" = '${{ github.event.pull_request.head.sha }}'
          fi
          git merge-base --is-ancestor "$BASE" "$ACTUAL_HEAD"
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          expected=$'.github/scripts/p2-pm11/contract.mjs\n.github/scripts/p2-pm11/ephemeral-personal.sql\n.github/workflows/p2-pm11-release-current.yml\ndocs/plan-maestro/P2_PM11_RELEASE_CURRENT.md\nsupabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          echo "P2_PM11_SCOPE=PASS"
          echo "P2_PM11_BASE=$BASE"
          echo "P2_PM11_CANDIDATE=$ACTUAL_HEAD"

      - name: Contrato estático PM11
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/p2-pm11/contract.mjs

      - name: Regresiones R03A R03B R03C y sintaxis frontend
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/p2-r03a/contract.mjs
          node .github/scripts/p2-r03b/contract.mjs
          node .github/scripts/p2-r03c/contract.mjs
          node --check fuente.js
          echo "P2_PM11_R03ABC_REGRESSION=PASS"

      - name: Verificar preservación PM13-P01
        shell: bash
        run: |
          set -euo pipefail
          grep -F "'pm13:empleado:alta:'" supabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql >/dev/null
          grep -F "personal_local_concreto_requerido" supabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql >/dev/null
          ! grep -F "'pm11:empleado:alta:'" supabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql
          echo "P2_PM11_PM13_P01_PRESERVED=PASS"

      - name: Preparar harness efímero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/scripts/p2-pm11/ephemeral-personal.sql').read_text()
          old = r'\ir ../../supabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql'
          new = r'\i supabase/migrations/20260917143000_p2_pm11_personal_post_reset.sql'
          if old not in src:
              raise SystemExit('P2_PM11_HARNESS_INCLUDE_NOT_FOUND')
          src = src.replace(old, new)
          Path('/tmp/p2-pm11-ephemeral.sql').write_text(src)
          PY

      - name: Prueba funcional PostgreSQL 16 efímera
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/p2-pm11-ephemeral.sql

      - name: Confirmar árbol limpio
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "P2_PM11_GATE=PASS"
