name: Aplicar Recepción y catálogo por local fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-recepcion-catalogo-local-fase3.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar blindaje exacto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fuente.js')
          s=p.read_text(encoding='utf-8')

          def uno(texto,viejo,nuevo,nombre):
              n=texto.count(viejo)
              assert n==1, f'{nombre}: esperado 1, encontrado {n}'
              print('OK',nombre)
              return texto.replace(viejo,nuevo,1)

          # 1) Catálogo compatible con datos antiguos, pero con enlace de producto aislado por local.
          inicio=s.index('function crearLogicaAlbaranes({')
          fin=s.index('function crearLogicaPedidos(',inicio)
          b=s[inicio:fin]
          viejo='''  const claveCat = (proveedorId, codigo) => `${proveedorId}::${String(codigo || "").trim().toUpperCase()}`;
  const normalizarDescripcion = (t2) => String(t2 || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toUpperCase().replace(/\\s+/g, " ").trim();
  const claveCatDesc = (proveedorId, descripcion) => `${proveedorId}::DESC::${normalizarDescripcion(descripcion)}`;
  function buscarEnCatalogo(proveedorId, codigo, descripcion) {
    if (codigo) {
      const porCodigo = catalogoProv[claveCat(proveedorId, codigo)];
      if (porCodigo) return porCodigo;
    }
    if (descripcion && normalizarDescripcion(descripcion)) {
      return catalogoProv[claveCatDesc(proveedorId, descripcion)] || null;
    }
    return null;
  }
  function aprenderReferencia(proveedorId, codigo, datos) {
    if (!codigo) return;
    setCatalogoProv((s2) => ({ ...s2, [claveCat(proveedorId, codigo)]: { ...s2[claveCat(proveedorId, codigo)] || {}, ...datos } }));
  }'''
          nuevo='''  const claveCat = (proveedorId, codigo) => `${proveedorId}::${String(codigo || "").trim().toUpperCase()}`;
  const normalizarDescripcion = (t2) => String(t2 || "").normalize("NFD").replace(/[\\u0300-\\u036f]/g, "").toUpperCase().replace(/\\s+/g, " ").trim();
  const claveCatDesc = (proveedorId, descripcion) => `${proveedorId}::DESC::${normalizarDescripcion(descripcion)}`;
  const claveCatLocal = (localId, proveedorId, codigo) => `${localId}::${claveCat(proveedorId, codigo)}`;
  const claveCatDescLocal = (localId, proveedorId, descripcion) => `${localId}::${claveCatDesc(proveedorId, descripcion)}`;
  function catalogoSeguroPorLocal(datos) {
    if (!datos || !datos.productoId || !localActivoId) return datos || null;
    const prod = productos.find((p2) => p2.id === datos.productoId);
    if (!prod || !prod.localId || prod.localId !== localActivoId) return { ...datos, productoId: "" };
    return datos;
  }
  function buscarEnCatalogo(proveedorId, codigo, descripcion) {
    if (codigo) {
      if (localActivoId) {
        const porCodigoLocal = catalogoProv[claveCatLocal(localActivoId, proveedorId, codigo)];
        if (porCodigoLocal) return catalogoSeguroPorLocal(porCodigoLocal);
      }
      const porCodigo = catalogoProv[claveCat(proveedorId, codigo)];
      if (porCodigo) return catalogoSeguroPorLocal(porCodigo);
    }
    if (descripcion && normalizarDescripcion(descripcion)) {
      if (localActivoId) {
        const porDescLocal = catalogoProv[claveCatDescLocal(localActivoId, proveedorId, descripcion)];
        if (porDescLocal) return catalogoSeguroPorLocal(porDescLocal);
      }
      return catalogoSeguroPorLocal(catalogoProv[claveCatDesc(proveedorId, descripcion)] || null);
    }
    return null;
  }
  function aprenderReferencia(proveedorId, codigo, datos) {
    if (!codigo) return;
    const clave = localActivoId ? claveCatLocal(localActivoId, proveedorId, codigo) : claveCat(proveedorId, codigo);
    setCatalogoProv((s2) => ({ ...s2, [clave]: { ...s2[clave] || {}, ...datos, localId: datos.localId || localActivoId || null } }));
  }'''
          b=uno(b,viejo,nuevo,'catálogo local con fallback legado')

          viejo='''      if (ln2.productoId) prod = productos.find((p2) => p2.id === ln2.productoId);
      if (!prod && cat && cat.productoId) prod = productos.find((p2) => p2.id === cat.productoId);
      const motivoDoc ='''
          nuevo='''      if (ln2.productoId) prod = productos.find((p2) => p2.id === ln2.productoId);
      if (!prod && cat && cat.productoId) prod = productos.find((p2) => p2.id === cat.productoId);
      if (prod && localActivoId && (!prod.localId || prod.localId !== localActivoId)) prod = null;
      const motivoDoc ='''
          b=uno(b,viejo,nuevo,'rechazo de producto ajeno en recepción')

          viejo='''          productoId: ln2.productoId,
          ultimoPrecio: Number(ln2.precioBruto) || 0,
          ultimoDto: Number(ln2.dtoPct) || 0
        };
        if (ln2.codigoProveedor) copia[claveCat(proveedorId, ln2.codigoProveedor)] = datos;
        if (ln2.descripcion && normalizarDescripcion(ln2.descripcion)) copia[claveCatDesc(proveedorId, ln2.descripcion)] = datos;'''
          nuevo='''          productoId: ln2.productoId,
          localId: productos.find((p2) => p2.id === ln2.productoId)?.localId || localActivoId || null,
          ultimoPrecio: Number(ln2.precioBruto) || 0,
          ultimoDto: Number(ln2.dtoPct) || 0
        };
        const claveCodigo = localActivoId ? claveCatLocal(localActivoId, proveedorId, ln2.codigoProveedor) : claveCat(proveedorId, ln2.codigoProveedor);
        const claveDescripcion = localActivoId ? claveCatDescLocal(localActivoId, proveedorId, ln2.descripcion) : claveCatDesc(proveedorId, ln2.descripcion);
        if (ln2.codigoProveedor) copia[claveCodigo] = datos;
        if (ln2.descripcion && normalizarDescripcion(ln2.descripcion)) copia[claveDescripcion] = datos;'''
          b=uno(b,viejo,nuevo,'aprendizaje de catálogo por local')
          s=s[:inicio]+b+s[fin:]

          # 2) Blindar mutaciones de pedido por local.
          inicio=s.index('function crearLogicaPedidos(')
          fin=s.index('function crearLogicaFichasCosto(',inicio)
          b=s[inicio:fin]
          ancla='''function crearLogicaPedidos({ pedidos, setPedidos, productos, setProductos, setMovimientos, almacenCongelado, procesarRecepcion, localActivoId }) {
  function crearPedido({ proveedorId, fechaEsperada, items }) {'''
          nuevo='''function crearLogicaPedidos({ pedidos, setPedidos, productos, setProductos, setMovimientos, almacenCongelado, procesarRecepcion, localActivoId }) {
  function pedidoEsDelLocalActivo(pedido) {
    if (!pedido) return false;
    if (!localActivoId) return true;
    return !pedido.localId || pedido.localId === localActivoId;
  }
  function crearPedido({ proveedorId, fechaEsperada, items }) {'''
          b=uno(b,ancla,nuevo,'helper de pedido por local')

          viejo='''  function actualizarPedido(pedidoId, { proveedorId, fechaEsperada, items }) {
    setPedidos(
      (s2) => s2.map(
        (pe2) => pe2.id === pedidoId ? { ...pe2, proveedorId, fechaEsperada, items: items.map((it2) => ({ ...it2, cantidadRecibida: 0 })) } : pe2
      )
    );
  }
  function eliminarPedido(pedidoId) {
    setPedidos((s2) => s2.filter((pe2) => pe2.id !== pedidoId));
  }
  function cerrarPedido(pedidoId) {
    setPedidos((s2) => s2.map((pe2) => pe2.id === pedidoId ? { ...pe2, estado: "Recibido", cerradoManualmente: true } : pe2));
  }
  function recibirPedido(pedidoId, lineas) {
    if (almacenCongelado) return false;
    const pedido = pedidos.find((pe2) => pe2.id === pedidoId);
    if (!pedido) return false;'''
          nuevo='''  function actualizarPedido(pedidoId, { proveedorId, fechaEsperada, items }) {
    const actual = pedidos.find((pe2) => pe2.id === pedidoId);
    if (!pedidoEsDelLocalActivo(actual)) return false;
    setPedidos(
      (s2) => s2.map(
        (pe2) => pe2.id === pedidoId ? { ...pe2, proveedorId, fechaEsperada, items: items.map((it2) => ({ ...it2, cantidadRecibida: 0 })) } : pe2
      )
    );
    return true;
  }
  function eliminarPedido(pedidoId) {
    const actual = pedidos.find((pe2) => pe2.id === pedidoId);
    if (!pedidoEsDelLocalActivo(actual)) return false;
    setPedidos((s2) => s2.filter((pe2) => pe2.id !== pedidoId));
    return true;
  }
  function cerrarPedido(pedidoId) {
    const actual = pedidos.find((pe2) => pe2.id === pedidoId);
    if (!pedidoEsDelLocalActivo(actual)) return false;
    setPedidos((s2) => s2.map((pe2) => pe2.id === pedidoId ? { ...pe2, estado: "Recibido", cerradoManualmente: true } : pe2));
    return true;
  }
  function recibirPedido(pedidoId, lineas) {
    if (almacenCongelado) return false;
    const pedido = pedidos.find((pe2) => pe2.id === pedidoId);
    if (!pedidoEsDelLocalActivo(pedido)) return false;'''
          b=uno(b,viejo,nuevo,'mutaciones de pedido protegidas')

          viejo='''    const lineasConDatos = lineas.filter((ln2) => Number(ln2.cantidad) > 0).map((ln2) => {
      const prod = productos.find((p2) => p2.id === ln2.productoId);
      return {
        productoId: ln2.productoId,
        cantidad: Number(ln2.cantidad),
        precioBruto: Number(ln2.precioBruto) || 0,
        importe: (Number(ln2.precioBruto) || 0) * Number(ln2.cantidad),
        ivaPct: Number(ln2.ivaPct) || (prod ? prod.ivaCompra : 10) || 10,
        udsPorCaja: Number(ln2.udsPorCaja) || (prod ? prod.udsPorCaja : 1) || 1,
        descripcion: prod ? prod.nombre : "",
        unidad: prod ? prod.unidad : "unidad"
      };
    });'''
          nuevo='''    const lineasConDatos = lineas.filter((ln2) => Number(ln2.cantidad) > 0).map((ln2) => {
      const prod = productos.find((p2) => p2.id === ln2.productoId);
      if (!prod || localActivoId && (!prod.localId || prod.localId !== localActivoId)) return null;
      return {
        productoId: ln2.productoId,
        cantidad: Number(ln2.cantidad),
        precioBruto: Number(ln2.precioBruto) || 0,
        importe: (Number(ln2.precioBruto) || 0) * Number(ln2.cantidad),
        ivaPct: Number(ln2.ivaPct) || (prod ? prod.ivaCompra : 10) || 10,
        udsPorCaja: Number(ln2.udsPorCaja) || (prod ? prod.udsPorCaja : 1) || 1,
        descripcion: prod ? prod.nombre : "",
        unidad: prod ? prod.unidad : "unidad"
      };
    }).filter(Boolean);'''
          b=uno(b,viejo,nuevo,'líneas de recepción protegidas')
          s=s[:inicio]+b+s[fin:]

          # 3) Recepción solo ve pedidos del local activo.
          viejo='''tab === "recepcion" && /* @__PURE__ */ import_react4.default.createElement(Recepcion, { pedidos, proveedorPorId, productoPorId, recibirPedido, almacenCongelado, recibirConAlbaran, recibirConFotoIA, cerrarPedido })'''
          nuevo='''tab === "recepcion" && /* @__PURE__ */ import_react4.default.createElement(Recepcion, { pedidos: pedidosDelLocalActivo, proveedorPorId, productoPorId, recibirPedido, almacenCongelado, recibirConAlbaran, recibirConFotoIA, cerrarPedido })'''
          s=uno(s,viejo,nuevo,'render Recepción por local')

          # Guardas finales.
          assert s.count('claveCatLocal') >= 4
          assert s.count('pedidos: pedidosDelLocalActivo') == 2
          assert 'tab === "albaranes"' in s
          assert '      albaranes,\n      proveedores,\n      productos,' in s
          p.write_text(s,encoding='utf-8')
          print('GUARDAS_OK')
          PY
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,360p'
      - name: Guardar y retirar workflows temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/aplicar-recepcion-catalogo-local-fase3.yml
          rm -f .github/workflows/inspeccionar-recepcion-albaranes-fase3.yml
          git add fuente.js .github/workflows/aplicar-recepcion-catalogo-local-fase3.yml .github/workflows/inspeccionar-recepcion-albaranes-fase3.yml
          git diff --cached --check
          git commit -m 'Aislar recepción y catálogo de proveedor por local'
          git push origin HEAD:multilocal-fase-3
