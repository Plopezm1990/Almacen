name: Aplicar Recepción y catálogo por local fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-recepcion-catalogo-local-fase3.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar blindaje exacto
        run: python3 .github/scripts/aplicar_recepcion_catalogo_local_fase3.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,360p'
      - name: Guardar y retirar herramientas temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/aplicar-recepcion-catalogo-local-fase3.yml
          rm -f .github/workflows/inspeccionar-recepcion-albaranes-fase3.yml
          rm -f .github/scripts/aplicar_recepcion_catalogo_local_fase3.py
          git add fuente.js .github/workflows/aplicar-recepcion-catalogo-local-fase3.yml .github/workflows/inspeccionar-recepcion-albaranes-fase3.yml .github/scripts/aplicar_recepcion_catalogo_local_fase3.py
          git diff --cached --check
          git commit -m 'Aislar recepción y catálogo de proveedor por local'
          git push origin HEAD:multilocal-fase-3
# reintento 2: el script usa coincidencias globales únicas para catálogo
