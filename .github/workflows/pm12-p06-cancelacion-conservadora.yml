name: PM12 P06 cancelación conservadora

on:
  push:
    branches: [pm12-conteo-estados-honestos]
    paths:
      - 'fuente.js'
      - 'source-recovery/fuente-recuperado.js'
      - 'pm12-conteo-estados-v1.js'
      - 'tests/pm12/P06_CANCELACION_CONSERVADORA.md'
      - 'tests/pm12/p06-cancelacion-conservadora-contract.mjs'
      - '.github/workflows/pm12-p06-cancelacion-conservadora.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar main congelado
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
      - name: Sintaxis
        run: |
          node --check fuente.js
          node --check source-recovery/fuente-recuperado.js
          node --check pm12-conteo-estados-v1.js
      - name: Contrato P06
        run: node tests/pm12/p06-cancelacion-conservadora-contract.mjs
      - name: Regresión P02-P05
        run: |
          node tests/pm12/p02-estados-normalizacion-contract.mjs
          node tests/pm12/p03-documento-corte-contract.mjs
          node tests/pm12/p04-cierre-honesto-ux-contract.mjs
          node tests/pm12/p05-ajustes-trazables-contract.mjs
      - name: Confirmar cero escrituras externas
        run: |
          echo 'PM12_P06_SUPABASE_WRITES=0'
          echo 'PM12_P06_PRODUCTION_WRITES=0'
