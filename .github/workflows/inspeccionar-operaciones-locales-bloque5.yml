name: Inspeccionar operaciones locales bloque 5
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-operaciones-locales-bloque5.yml
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer funciones y anclas exactas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def f(nombre, marcador, siguiente=None, maxlen=14000):
              i=s.find(marcador)
              print(f'\n===== {nombre} @ {i} =====')
              assert i>=0, marcador
              j=s.find(siguiente,i+len(marcador)) if siguiente else -1
              if j<0: j=min(len(s),i+maxlen)
              print(s[i:min(j,i+maxlen)])
          def t(nombre, marcador, antes=600, despues=2400):
              i=s.find(marcador)
              print(f'\n===== {nombre} @ {i} =====')
              assert i>=0, marcador
              print(s[max(0,i-antes):min(len(s),i+despues)])
          f('PRODUCTOS CORE','function crearLogicaProductos(','function crearLogicaPedidos(',22000)
          f('VENTA CORE','function crearLogicaVenta(','function crearLogicaTraspasos(',17000)
          f('TRASPASOS CORE','function crearLogicaTraspasos(','function crearLogicaSeguridad(',7000)
          f('ENCARGOS CORE','function crearLogicaEncargos(','function crearLogicaVenta(',8000)
          f('DEVOLUCIONES CORE','function crearLogicaDevoluciones(','function crearLogicaClientes(',9000)
          f('CAJA MOV CORE','function crearLogicaMovimientosCaja(','function crearLogicaDevoluciones(',6500)
          t('INVOCACION VENTA','crearLogicaVenta({',800,1700)
          t('INVOCACION TRASPASOS','crearLogicaTraspasos({',800,1700)
          t('INVOCACION DEVOLUCIONES','crearLogicaDevoluciones({',800,1700)
          t('INVOCACION MOV CAJA','crearLogicaMovimientosCaja({',800,1700)
          t('DERIVADO ENCARGOS','const encargosPendientes =',900,2200)
          t('DERIVADO PISO BAJO','const pisoVentaBajo =',500,1600)
          t('RENDER HISTORIAL','tab === "historial_producto"',300,1600)
          t('RENDER MERMAS','tab === "mermas"',300,1000)
          t('RENDER VENTA','tab === "venta"',300,1000)
          t('RENDER ENCARGOS','tab === "encargos"',300,1800)
          t('RENDER DEVOLUCIONES','tab === "devoluciones"',300,1000)
          t('RENDER CAJA','tab === "caja"',300,1100)
          t('RENDER TRASPASOS','tab === "traspasos"',300,1000)
          PY