name: PM10 P10 diagnostico autoridad persistencia
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p10-diagnostico-autoridad.yml'
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraer persistencia y claves PM10
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, json
          s=Path('fuente.js').read_text(encoding='utf-8')
          terms=['function saveKey','async function saveKey','const saveKey','window.storage.set','setOriginal','almacen_kv','productosKey','pedidosKey','empleadosKey','encargosKey','saveKey(','loadKey(','setProductos(','setPedidos(','setEmpleados(','setEncargos(']
          out={}
          for t in terms:
            hits=[]
            for m in list(re.finditer(re.escape(t),s,re.I))[:40]:
              hits.append({'offset':m.start(),'snippet':s[max(0,m.start()-1800):min(len(s),m.start()+5000)]})
            out[t]=hits
          Path('tests/pm10/P10_DIAGNOSTICO_AUTORIDAD.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print({k:len(v) for k,v in out.items()})
          PY
      - name: Commit diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm10/P10_DIAGNOSTICO_AUTORIDAD.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PM10: guardar diagnóstico autoridad persistencia punto 10'
          git push
