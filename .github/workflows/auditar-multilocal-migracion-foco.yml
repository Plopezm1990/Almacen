name: Auditar consolidación multi-local

on:
  push:
    branches:
      - la-suite-identidad
    paths:
      - .github/workflows/auditar-multilocal-migracion-foco.yml
  workflow_dispatch:

jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar bloque de informes y aislamiento aplicado
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('fuente.js','utf8');
          const clean=s=>s.replace(/\s+/g,' ');

          const checks = [
            ['empresa legacy única', 'const empresaLegacyUnicaId = empresasFinales.length === 1'],
            ['empresa local exacta', 'const empresaDelLocalActivo'],
            ['locales empresa activa', 'const localesEmpresaActiva'],
            ['productos estrictos', 'return productos.filter((p2) => p2.localId === localActivoId)'],
            ['pedidos estrictos', 'return pedidos.filter((p2) => p2.localId === localActivoId)'],
            ['buscar acotado', 'BusquedaGlobal, { productos: productosDelLocalActivo'],
            ['pedidos lookup local', 'productoPorId: (id) => productosDelLocalActivo.find'],
          ];
          for (const [name, needle] of checks) {
            const count = src.split(needle).length - 1;
            console.log(`${name}: ${count}`);
            if (!count) process.exitCode = 1;
          }

          const start=src.indexOf('const localPorProductoInforme');
          if(start<0){console.error('No se encontró localPorProductoInforme');process.exit(1)}
          const endCandidates=[
            src.indexOf('const panelDatos', start),
            src.indexOf('return /* @__PURE__ */ import_react4.default.createElement', start),
            src.indexOf('return /* @__PURE__ */', start)
          ].filter(x=>x>start);
          const end=endCandidates.length ? Math.min(...endCandidates) : Math.min(src.length,start+30000);
          console.log('\n=== BLOQUE DE CONSOLIDACIÓN ACTUAL ===');
          console.log(clean(src.slice(start, Math.min(end, start+30000))));
          NODE
