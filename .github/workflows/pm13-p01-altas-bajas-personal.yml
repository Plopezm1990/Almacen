name: PM13 P01 altas y bajas personal

on:
  push:
    branches: [pm13-p01-altas-bajas-personal]
    paths:
      - 'fuente.js'
      - 'tools/corregir_pm13_p01_altas_bajas_personal.py'
      - 'tools/corregir_pm13_p01_compat_sync.py'
      - 'tests/pm10/p07-personal-contract.mjs'
      - 'tests/pm13/p01-altas-bajas-personal-contract.mjs'
      - 'tests/pm13/p01-rpc-personal-contract.mjs'
      - 'tests/pm13/p01-backend-personal-contract.mjs'
      - 'tests/pm13/backend/pm13-p01-ciclo-personal-idempotente.sql'
      - 'tests/pm13/P01_ALTAS_BAJAS_PERSONAL.md'
      - 'supabase/migrations/20260907194803_pm13_p01_ciclo_personal_idempotente.sql'
      - 'supabase/migrations/20260907195207_pm13_p01_alta_concurrency_lock.sql'
      - '.github/workflows/pm13-p01-altas-bajas-personal.yml'

permissions:
  contents: write

jobs:
  validar-p01:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Proteger main y alcance PM13 P01
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          PM13_BASE='5d278f60d8e06e7a43ee9efe0287c1137dee7ebe'
          mapfile -t supabase_diff < <(git diff --name-only "$PM13_BASE"..HEAD -- supabase/)
          for f in "${supabase_diff[@]}"; do
            case "$f" in
              supabase/migrations/20260907194803_pm13_p01_ciclo_personal_idempotente.sql) ;;
              supabase/migrations/20260907195207_pm13_p01_alta_concurrency_lock.sql) ;;
              *) echo "Cambio Supabase fuera de alcance P01: $f" >&2; exit 1 ;;
            esac
          done
          test -f supabase/migrations/20260907194803_pm13_p01_ciclo_personal_idempotente.sql
          test -f supabase/migrations/20260907195207_pm13_p01_alta_concurrency_lock.sql
          echo 'PM13_P01_MAIN_FROZEN=PASS'
          echo 'PM13_P01_SUPABASE_SCOPE=PASS'

      - name: Aplicar corrección P01 frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/corregir_pm13_p01_altas_bajas_personal.py
          python3 tools/corregir_pm13_p01_compat_sync.py

      - name: Sintaxis bundle
        run: node --check fuente.js

      - name: Contrato PM13 P01 RPC híbrido
        run: node tests/pm13/p01-rpc-personal-contract.mjs

      - name: Contrato PM13 P01 backend
        run: node tests/pm13/p01-backend-personal-contract.mjs

      - name: Regresión Personal PM10 P07
        run: node tests/pm10/p07-personal-contract.mjs

      - name: Regresión frontend PM12 P02-P10
        shell: bash
        run: |
          set -euo pipefail
          for n in 02 03 04 05 06 07 08 09 10; do
            for t in tests/pm12/p${n}-*contract.mjs; do
              test -f "$t" || continue
              case "$t" in
                *postgres*|*supabase*) continue ;;
              esac
              node "$t"
            done
          done
          echo 'PM13_P01_REGRESSION_PM12=PASS'

      - name: Barreras P01 de no borrado y no exposición
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          a=s.index('function crearLogicaPersonal({')
          b=s.index('function crearLogicaTurnos({', a)
          x=s[a:b]
          assert 'function deleteEmpleado(id, baja = {})' in x
          assert 'function reactivarEmpleado(id)' in x
          assert 'pm11_alta_empleado' in x
          assert 'pm11_editar_empleado' in x
          assert 'pm11_baja_empleado' in x
          assert 'pm11_reactivar_empleado' in x
          assert 'setNominas((s22) => s22.filter((n2) => n2.empleadoId !== id))' not in x
          assert 'setEmpleados((s22) => s22.filter((e22) => e22.id !== id))' not in x
          print('PM13_P01_NO_DELETE=PASS')
          PY
          ! grep -Eq 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm13/p01-rpc-personal-contract.mjs \
            tests/pm13/p01-backend-personal-contract.mjs \
            supabase/migrations/20260907194803_pm13_p01_ciclo_personal_idempotente.sql \
            supabase/migrations/20260907195207_pm13_p01_alta_concurrency_lock.sql
          echo 'PM13_P01_NO_SECRET=PASS'

      - name: Commit funcional si procede
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- fuente.js; then
            echo 'Fuente ya coincide con P01'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuente.js
          git commit -m 'feat(pm13): conectar altas y bajas al motor PM11'
          git push

  gate-final:
    needs: [validar-p01]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gate PM13 P01
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          echo 'PM13_P01_GATE=PASS'
