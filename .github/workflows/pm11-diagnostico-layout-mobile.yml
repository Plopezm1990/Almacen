name: PM11 aplicar layout movil v2

on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-diagnostico-layout-mobile.yml'

permissions:
  contents: write

jobs:
  aplicar-layout-v2:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar version v2 y validar contrato
        run: |
          python3 tools/corregir_pm11_p10_smoke_acceso.py index.html
          node --check pm11-access-patch.js
          node tests/pm11/p10-smoke-acceso-contract.mjs
      - name: Commit de index si cambia
        run: |
          if git diff --quiet -- index.html; then
            echo 'index.html ya estaba en v2'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'PM11 P10: activar layout movil v2 en preview'
          git push origin HEAD:pm11-personal-empleados
