name: PM11 diagnostico layout movil

on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-diagnostico-layout-mobile.yml'

permissions:
  contents: read

jobs:
  diagnostico-layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Localizar componentes y reglas de geometria
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'source-recovery/fuente-recuperado.js';
          const s = fs.readFileSync(p, 'utf8');
          console.log('SOURCE_LEN=' + s.length);
          const terms = [
            'Comprar','Almacén','Registro horario','Todos los locales',
            'Depart.','Ciclos','Rápido','Oscuro','Panel general',
            'calc(100% - 48px)','calc(100% - 3rem)','48px','w-12','ml-12','mr-12',
            'paddingRight','paddingLeft','marginRight','marginLeft','100vw','minWidth','maxWidth'
          ];
          for (const term of terms) {
            console.log('\n===== TERM ' + JSON.stringify(term) + ' =====');
            let from = 0, count = 0;
            while (count < 8) {
              const i = s.indexOf(term, from);
              if (i < 0) break;
              const a = Math.max(0, i - 900);
              const b = Math.min(s.length, i + term.length + 1400);
              console.log(`--- hit ${++count} @${i} ---`);
              console.log(s.slice(a,b).replace(/\n/g,'\\n'));
              from = i + term.length;
            }
            if (!count) console.log('NO_HITS');
          }
          NODE
