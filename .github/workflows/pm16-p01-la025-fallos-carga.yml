name: PM16 P01 LA-025 fallos de carga en arranque

on:
  push:
    branches: [claude/pm16-arranque-diagnostico-respaldo]
    paths:
      - 'fuente.js'
      - 'tests/pm16/**'
      - '.github/workflows/pm16-p01-la025-fallos-carga.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-p01:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger main y alcance P01 (sin cambios en supabase/)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "da7143b3b8a04003cf2212dee341ac5386383736"
          unexpected="$(git diff --name-only origin/main..HEAD -- supabase/ || true)"
          if [ -n "$unexpected" ]; then
            echo 'PM16 P01 es un cambio de frontend puro: no debe tocar supabase/' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo 'PM16_P01_MAIN_FROZEN=PASS'
          echo 'PM16_P01_SIN_CAMBIOS_SUPABASE=PASS'
      - name: Sintaxis bundle
        run: node --check fuente.js
      - name: Contrato PM16 P01 (LA-025)
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm16/p01-la025-loadkey-fallos-contract.mjs
          node tests/pm16/p01-la025-ui-fallos-carga-contract.mjs
      - name: Regresión completa (todas las suites vigentes)
        shell: bash
        run: |
          set -euo pipefail
          for d in tests/g1 tests/pm04 tests/pm05 tests/pm07 tests/pm08 tests/pm09 tests/pm10 tests/pm11-compra tests/pm12 tests/pm13 tests/pm14 tests/pm15; do
            for t in "$d"/*.mjs; do
              [ -f "$t" ] || continue
              node "$t"
            done
          done
          echo 'PM16_P01_REGRESION_COMPLETA=PASS'
      - name: Sin secretos
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm16/p01-la025-loadkey-fallos-contract.mjs \
            tests/pm16/p01-la025-ui-fallos-carga-contract.mjs \
            tests/pm16/P01_CIERRE_LA025_FALLOS_CARGA.md
          echo 'PM16_P01_NO_SECRET=PASS'

  gate-final:
    needs: validar-p01
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM16 P01
        run: |
          set -euo pipefail
          node tests/pm16/p01-la025-loadkey-fallos-contract.mjs
          node tests/pm16/p01-la025-ui-fallos-carga-contract.mjs
          echo 'PM16_P01_GATE_FINAL=PASS'
