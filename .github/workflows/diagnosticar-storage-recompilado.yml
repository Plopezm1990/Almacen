name: Diagnosticar storage recompilado
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/diagnosticar-storage-recompilado.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar capa de seguridad
        shell: python
        run: |
          from pathlib import Path
          archivos=['fuente.js','index.html','edge-auth-patch.js','seleccion-neutral-patch.js']
          terminos=[
            'CLAVES_CONTROLADAS',
            '__contextoRolSeguroInstalado',
            'Contexto operativo mínimo',
            'edge-auth-patch',
            'seleccion-neutral-patch',
            '__guardPerfilActivoInstalado',
            'respuestaVacia'
          ]
          for nombre in archivos:
            p=Path(nombre)
            if not p.exists():
              print(f'=== {nombre}: NO EXISTE ===')
              continue
            lines=p.read_text(encoding='utf-8').splitlines()
            print(f'\n=== {nombre} | lineas={len(lines)} bytes={p.stat().st_size} ===')
            for t in terminos:
              hits=[i for i,l in enumerate(lines) if t in l]
              print(f'{t}: {[i+1 for i in hits[:20]]}')
              for i in hits[:3]:
                for j in range(max(0,i-3),min(len(lines),i+5)):
                  x=lines[j]
                  if len(x)>500: x=x[:500]+' ...'
                  print(f'  {j+1}: {x}')
          # Marcas de módulos que esbuild preservó justo antes de fuente.jsx.
          lines=Path('fuente.js').read_text(encoding='utf-8').splitlines()
          marca=next(i for i,l in enumerate(lines) if l.strip()=='// fuente.jsx')
          print('\n=== 120 líneas antes de // fuente.jsx ===')
          for j in range(max(0,marca-120),marca+4):
            x=lines[j]
            if len(x)>600: x=x[:600]+' ...'
            print(f'{j+1}: {x}')
