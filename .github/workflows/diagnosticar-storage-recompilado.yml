name: Diagnosticar storage recompilado
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/diagnosticar-storage-recompilado.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar imports y cabeceras del build original
        shell: python
        run: |
          from pathlib import Path
          import re
          for nombre in ['fuente.js','chunk-WNPC2SID.js','chunk-43ACCR2P.js','chunk-CZ7CSFO4.js']:
            p=Path(nombre)
            lines=p.read_text(encoding='utf-8').splitlines()
            print(f'\n=== {nombre} | {len(lines)} líneas ===')
            print('--- PRIMERAS 120 ---')
            for i,l in enumerate(lines[:120],1):
              x=l if len(l)<=800 else l[:800]+' ...'
              print(f'{i}: {x}')
            print('--- IMPORTS ESTÁTICOS/DINÁMICOS ---')
            for i,l in enumerate(lines,1):
              if re.match(r'^\s*import\b',l) or 'import(' in l or re.search(r'from\s+["\']\.\/',l):
                x=l if len(l)<=1000 else l[:1000]+' ...'
                print(f'{i}: {x}')
          print('\n=== RELACIONES CHUNK ===')
          fuente=Path('fuente.js').read_text(encoding='utf-8')
          for n in ['chunk-WNPC2SID.js','chunk-43ACCR2P.js','chunk-CZ7CSFO4.js','edge-auth-patch.js']:
            print(n, '=>', fuente.count(n))
