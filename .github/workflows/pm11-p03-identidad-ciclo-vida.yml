name: PM11 P03 identidad y ciclo de vida Personal

on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p03-identidad-ciclo-vida.yml'
      - 'tests/pm11/P03_CONTRATO_IDENTIDAD_CICLO_VIDA_PERSONAL.md'
      - 'tests/pm11/p03-identidad-ciclo-vida-contract.mjs'

permissions:
  contents: read

jobs:
  contrato-pm11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar cierre histórico P03
        run: |
          git merge-base --is-ancestor 1e21458b48a11302c59911ef966ded0aca3eb639 HEAD
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          git diff --quiet 1e21458b48a11302c59911ef966ded0aca3eb639..bb77ce9e7bb8c5057f160044a1c5b0201addf119 -- fuente.js supabase/migrations
          echo 'PM11_P03_CIERRE_HISTORICO_SIN_CAMBIO_FUNCIONAL=1'

      - name: Sintaxis fuente
        run: node --check fuente.js

      - name: Contrato identidad y ciclo de vida
        run: node tests/pm11/p03-identidad-ciclo-vida-contract.mjs

      - name: Regresión mapa Personal P02
        run: node tests/pm11/p02-mapa-personal-contract.mjs

      - name: Regresión Personal LA-017
        run: node tests/pm10/p07-personal-contract.mjs

      - name: Regresión checkpoint PM11
        run: node tests/pm11/p01-checkpoint-contract.mjs

      - name: Build reproducible actual
        run: |
          cd source-recovery
          npm ci
          npm run check
          npm run build:current
          cmp -s dist/fuente.js ../fuente.js
          echo 'PM11_P03_BUILD_REPRODUCIBLE=PASS'
          cd ..

      - name: Resumen P03
        run: |
          echo 'PM11_P03_CONTRATO_IDENTIDAD_CICLO_VIDA=PASS'
          echo 'PM11_SIGUIENTE=P04_ENTIDAD_SQL_EMPLEADOS_RLS'
