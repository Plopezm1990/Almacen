name: Patch P5 migration loop

on:
  push:
    branches:
      - claude/hotfix-bootstrap-ui-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hotfix-bootstrap-ui-context
      - name: Cerrar bucle de locales antes de localActivoId
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260915043000_ui_context_bridge.sql')
          s=p.read_text(encoding='utf-8')
          old="""      where public.locales.empresa_id = excluded.empresa_id;\n\n  elsif v_clave = 'localActivoId' then"""
          new="""      where public.locales.empresa_id = excluded.empresa_id;\n    end loop;\n\n  elsif v_clave = 'localActivoId' then"""
          if s.count(old) != 1:
              raise SystemExit(f'PATCH_P5_LOOP_FALLO: coincidencias={s.count(old)}')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          PY
      - name: Guardar corrección exacta
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260915043000_ui_context_bridge.sql
          git commit -m "fix: cerrar bucle de locales en puente UI"
          git push origin HEAD:claude/hotfix-bootstrap-ui-context
