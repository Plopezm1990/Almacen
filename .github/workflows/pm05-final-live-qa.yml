name: PM-05 validación final QA

on:
  push:
    branches: [pm05-aislamiento-transversal]
    paths:
      - '.github/workflows/pm05-final-live-qa.yml'

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Validación final real tras hardening
        shell: bash
        run: |
          set -euo pipefail
          URL='https://qjqorixtkilwsndqayyx.supabase.co/functions/v1/qa-pm05-validar-rls'
          RESP=$(curl -fsS "$URL")
          printf '%s\n' "$RESP" | tee /tmp/pm05-final.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pm05-final.json'))
          assert d['fixture']=='PM05-FINAL-v1', d
          assert d['failed']==0, d
          assert d['passed']>=18, d
          print('PM05_FINAL_QA_OK=1')
          print('PM05_FINAL_PASSED=%s' % d['passed'])
          PY

# Activación deliberada del one-shot final tras hardening de helpers/RLS.
