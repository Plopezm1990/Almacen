name: Aplicar bloqueo de perfil inactivo
on:
  push:
    branches: [seguridad-perfil-inactivo]
    paths:
      - .github/workflows/aplicar-perfil-inactivo.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: seguridad-perfil-inactivo
      - name: Aplicar guard de perfil activo
        shell: node {0}
        run: |
          const fs = require('fs');
          let src = fs.readFileSync('fuente.js', 'utf8');
          const oldText = `  (0, import_react4.useEffect)(() => {
    if (!ready || typeof window === "undefined" || !window.__nubeActiva) return;
    let activo = true;
    (async () => {
      try {
        const supabase = await window.getSupabaseClient();
        const { data: sesion } = await supabase.auth.getSession();
        const userId = sesion?.session?.user?.id;
        if (!userId) return;
        const { data: perfil } = await supabase.from("perfiles").select("rol, nombre").eq("user_id", userId).maybeSingle();
        if (!activo || !perfil) return;
        setMiPerfil(perfil);
        if (perfil.rol !== "Propietario") setModoEmpleado(true);
      } catch (e) {
      }
    })();
    return () => {
      activo = false;
    };
  }, [ready]);`;
          const newText = `  (0, import_react4.useEffect)(() => {
    if (!ready || typeof window === "undefined" || !window.__nubeActiva) return;
    let activo = true;
    let bloqueando = false;
    let intervalo = null;
    let canal = null;
    let onFocus = null;
    let onVisibility = null;
    (async () => {
      try {
        const supabase = await window.getSupabaseClient();
        const { data: sesion } = await supabase.auth.getSession();
        const userId = sesion?.session?.user?.id;
        if (!userId) return;
        const bloquearAcceso = async () => {
          if (!activo || bloqueando) return;
          bloqueando = true;
          setMiPerfil(null);
          setModoEmpleado(false);
          try {
            await supabase.auth.signOut({ scope: "local" });
          } catch (e) {
          }
          if (typeof window !== "undefined") window.location.reload();
        };
        const comprobarPerfil = async () => {
          if (!activo || bloqueando) return;
          const { data: perfil, error: errorPerfil } = await supabase.from("perfiles").select("rol, nombre, activo").eq("user_id", userId).maybeSingle();
          if (!activo || bloqueando) return;
          if (errorPerfil) return;
          if (!perfil || perfil.activo !== true) {
            await bloquearAcceso();
            return;
          }
          setMiPerfil(perfil);
          setModoEmpleado(perfil.rol !== "Propietario");
        };
        await comprobarPerfil();
        if (!activo || bloqueando) return;
        const comprobarSeguro = () => {
          comprobarPerfil().catch(() => {});
        };
        intervalo = window.setInterval(comprobarSeguro, 3e4);
        onFocus = comprobarSeguro;
        onVisibility = () => {
          if (document.visibilityState === "visible") comprobarSeguro();
        };
        window.addEventListener("focus", onFocus);
        document.addEventListener("visibilitychange", onVisibility);
        try {
          canal = supabase.channel("perfil-activo-" + userId).on("postgres_changes", {
            event: "UPDATE",
            schema: "public",
            table: "perfiles",
            filter: "user_id=eq." + userId
          }, (payload) => {
            if (payload?.new?.activo === false) bloquearAcceso();
            else comprobarSeguro();
          }).subscribe();
        } catch (e) {
        }
      } catch (e) {
      }
    })();
    return () => {
      activo = false;
      if (intervalo) window.clearInterval(intervalo);
      if (onFocus) window.removeEventListener("focus", onFocus);
      if (onVisibility) document.removeEventListener("visibilitychange", onVisibility);
      if (canal && typeof window.getSupabaseClient === "function") {
        window.getSupabaseClient().then((supabase) => supabase.removeChannel(canal)).catch(() => {});
      }
    };
  }, [ready]);`;
          const i = src.indexOf(oldText);
          if (i < 0) throw new Error('No se encontró el bloque original de perfil');
          if (src.indexOf(oldText, i + 1) >= 0) throw new Error('El bloque original aparece más de una vez');
          src = src.slice(0, i) + newText + src.slice(i + oldText.length);
          fs.writeFileSync('fuente.js', src);
          console.log('Guard de perfil inactivo aplicado');
      - name: Validar sintaxis
        run: node --check fuente.js
      - name: Validar marcadores
        shell: node {0}
        run: |
          const fs = require('fs');
          const s = fs.readFileSync('fuente.js','utf8');
          const checks = [
            'select("rol, nombre, activo")',
            'perfil.activo !== true',
            'signOut({ scope: "local" })',
            'visibilitychange',
            'perfil-activo-'
          ];
          for (const x of checks) if (!s.includes(x)) throw new Error('Falta marcador: ' + x);
          console.log('Validación de guard correcta');
      - name: Guardar cambio en rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.js
          git diff --cached --quiet && exit 0
          git commit -m "Bloquear frontend para perfiles inactivos [skip ci]"
          git push origin HEAD:seguridad-perfil-inactivo
