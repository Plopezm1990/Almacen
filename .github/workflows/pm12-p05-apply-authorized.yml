name: PM12 P05 aplicar parche autorizado

on:
  push:
    branches: [pm12-conteo-estados-honestos]
    paths:
      - 'source-recovery/post-pm08-patches/pm12-p05-ajustes.patch'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar base PM12 P04
        run: git merge-base --is-ancestor da8bf4761afecac4d4633d7846763808a2b3c15b HEAD
      - name: Aplicar parche y probar
        run: |
          git apply --check source-recovery/post-pm08-patches/pm12-p05-ajustes.patch
          git apply source-recovery/post-pm08-patches/pm12-p05-ajustes.patch
          node --check fuente.js
          node --check source-recovery/fuente-recuperado.js
          node tests/pm12/p05-ajustes-trazables-contract.mjs
          node tests/pm12/p02-estados-normalizacion-contract.mjs
          node tests/pm12/p03-documento-corte-contract.mjs
          node tests/pm12/p04-cierre-honesto-ux-contract.mjs
      - name: Registrar cambio y limpiar transporte
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm source-recovery/post-pm08-patches/pm12-p05-ajustes.patch
          rm .github/workflows/pm12-p05-apply-authorized.yml
          git add fuente.js source-recovery/fuente-recuperado.js source-recovery/post-pm08-patches/pm12-p05-ajustes.patch .github/workflows/pm12-p05-apply-authorized.yml
          git commit -m "PM12 P05: asegurar ajustes trazables e idempotentes"
          git push origin HEAD:pm12-conteo-estados-honestos
