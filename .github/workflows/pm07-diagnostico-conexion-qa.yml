name: PM07 diagnostico conexion QA
on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-diagnostico-conexion-qa.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar conexión nube y loadKey
        shell: bash
        run: |
          set -euo pipefail
          SRC=source-recovery/fuente-recuperado.js
          echo '=== conectarNube/getSupabaseClient/loadKey ==='
          grep -n -B18 -A55 -E 'function conectarNube|async function conectarNube|getSupabaseClient|async function loadKey|function loadKey|__nubeActiva|__modoPruebasLocal|__modoPruebasQA' "$SRC" | head -n 700 || true
          echo '=== auth / montaje app ==='
          grep -n -B18 -A55 -E 'onAuthStateChange|getSession\(|signInWithPassword|GestionAlmacen|createRoot|render\(' "$SRC" | head -n 700 || true
