name: Inspeccionar base multiempresa fase 4
on:
  push:
    paths:
      - '.github/workflows/inspeccionar-multiempresa-fase4.yml'
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver estructura relevante
        run: |
          set -euo pipefail
          echo '=== ESTADO EMPRESA ==='
          grep -n -A18 -B4 'const \[configEmpresa, setConfigEmpresa\]' fuente.js | head -n 60 || true
          echo '=== CARGA EMPRESA ==='
          grep -n -A22 -B8 'loadKey("configEmpresa"' fuente.js | head -n 80 || true
          echo '=== EFECTO EMPRESA ==='
          grep -n -A12 -B6 'saveKey("configEmpresa"' fuente.js | head -n 50 || true
          echo '=== FICHA EMPRESA ==='
          grep -n -A90 -B5 'function FichaEmpresaBasica' fuente.js | head -n 130 || true
          echo '=== FICHA LOCAL ==='
          grep -n -A95 -B5 'function FichaLocalGeneral' fuente.js | head -n 140 || true
          echo '=== CREAR LOCAL ==='
          grep -n -A50 -B8 'function crearLocal' fuente.js | head -n 90 || true
          echo '=== LOCALES INVOCACION ==='
          grep -n -A4 -B4 'createElement(Locales' fuente.js | head -n 40 || true
          echo '=== TPV FIRMA ==='
          grep -n -A4 -B3 'function VentaRapida' fuente.js | head -n 30 || true
          echo '=== TPV INVOCACION ==='
          grep -n -A3 -B3 'createElement(VentaRapida' fuente.js | head -n 30 || true
