name: Aplicar corrección errores PR4
on:
  push:
    branches: [preparacion-sin-netlify]
    paths:
      - .github/workflows/aplicar-correccion-errores-pr4.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar corrección validada
        shell: python
        run: |
          from pathlib import Path
          p=Path('fuente.js')
          s=p.read_text(encoding='utf-8')
          inicio=s.index('function ErroresSistema() {')
          fin=s.index('function DiagnosticoSincronizacion()', inicio)
          bloque=s[inicio:fin]
          viejo='''    (async () => {
      try {
        const supabase = await window.getSupabaseClient();
'''
          nuevo='''    (async () => {
      if (!window.__nubeActiva) {
        if (activo) {
          setError("El historial de errores en la nube no está disponible mientras trabajas solo en este equipo.");
          setCargando(false);
        }
        return;
      }
      try {
        const supabase = await window.getSupabaseClient();
'''
          assert bloque.count(viejo)==1, f'Patrón esperado {bloque.count(viejo)} veces'
          bloque=bloque.replace(viejo,nuevo,1)
          s=s[:inicio]+bloque+s[fin:]
          assert s.count('El historial de errores en la nube no está disponible mientras trabajas solo en este equipo.')==1
          p.write_text(s,encoding='utf-8')
      - name: Validar
        run: |
          node --check fuente.js
          git diff --check
          grep -q 'El historial de errores en la nube no está disponible mientras trabajas solo en este equipo.' fuente.js
      - name: Guardar y retirar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/aplicar-correccion-errores-pr4.yml
          git add fuente.js .github/workflows/aplicar-correccion-errores-pr4.yml
          git commit -m 'Evitar conexión de errores del sistema en modo local'
          git push origin HEAD:preparacion-sin-netlify