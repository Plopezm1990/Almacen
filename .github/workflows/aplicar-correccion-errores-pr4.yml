name: Inspeccionar ErroresSistema PR4
on:
  push:
    branches: [preparacion-sin-netlify]
    paths:
      - .github/workflows/aplicar-correccion-errores-pr4.yml
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar bloque exacto
        shell: python
        run: |
          from pathlib import Path
          s = Path('fuente.js').read_text(encoding='utf-8')
          i = s.index('function ErroresSistema() {')
          j = s.index('function DiagnosticoSincronizacion()', i)
          b = s[i:j]
          print(b[:2200])
          print('--- REPR INICIO ---')
          print(repr(b[:500]))