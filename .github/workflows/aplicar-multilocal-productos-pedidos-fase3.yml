name: Aplicar multilocal Productos y Pedidos fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-multilocal-productos-pedidos-fase3.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios quirúrgicos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('fuente.js')
          s=p.read_text(encoding='utf-8')

          def reemplazar_uno(texto, viejo, nuevo, nombre):
              n=texto.count(viejo)
              assert n==1, f'{nombre}: se esperaba 1 coincidencia y hay {n}'
              print('OK', nombre)
              return texto.replace(viejo,nuevo,1)

          ancla="  const productosDelLocalActivo = (0, import_react4.useMemo)(() => {\n    if (!localActivoId) return productos;\n    return productos.filter((p2) => !p2.localId || p2.localId === localActivoId);\n  }, [productos, localActivoId]);"
          derivados=ancla+"\n  const movimientosDelLocalActivo = (0, import_react4.useMemo)(() => {\n    if (!localActivoId) return movimientos;\n    const localPorProducto = new Map(productos.map((p2) => [p2.id, p2.localId || null]));\n    return movimientos.filter((m2) => (m2.localId || localPorProducto.get(m2.productoId) || null) === localActivoId);\n  }, [movimientos, productos, localActivoId]);\n  const pedidosDelLocalActivo = (0, import_react4.useMemo)(() => {\n    if (!localActivoId) return pedidos;\n    return pedidos.filter((p2) => !p2.localId || p2.localId === localActivoId);\n  }, [pedidos, localActivoId]);\n  const pedidosPendientesDelLocalActivo = (0, import_react4.useMemo)(() => pedidosDelLocalActivo.filter((p2) => p2.estado !== \"Recibido\"), [pedidosDelLocalActivo]);"
          s=reemplazar_uno(s,ancla,derivados,'derivados del local activo')

          ancla_sug="  }, [rotacionPorProducto, proveedores, productosEnPedidoPendiente]);\n  const lotesCaducidad ="
          nuevo_sug="  }, [rotacionPorProducto, proveedores, productosEnPedidoPendiente]);\n  const sugerenciasPedidoDelLocalActivo = (0, import_react4.useMemo)(() => {\n    if (!localActivoId) return sugerenciasPedido;\n    return sugerenciasPedido.filter((p2) => p2.localId === localActivoId);\n  }, [sugerenciasPedido, localActivoId]);\n  const lotesCaducidad ="
          s=reemplazar_uno(s,ancla_sug,nuevo_sug,'sugerencias por local activo')

          ini=s.index('tab === "productos"')
          fin=s.index('tab === "historial_producto"',ini)
          bloque=s[ini:fin]
          bloque=reemplazar_uno(bloque,'      productos,\n','      productos: productosDelLocalActivo,\n','Productos: productos')
          bloque=reemplazar_uno(bloque,'      movimientos,\n','      movimientos: movimientosDelLocalActivo,\n','Productos: movimientos')
          s=s[:ini]+bloque+s[fin:]

          ini=s.index('tab === "pedidos"')
          fin=s.index('tab === "recepcion"',ini)
          bloque=s[ini:fin]
          bloque=reemplazar_uno(bloque,'      pedidos,\n','      pedidos: pedidosDelLocalActivo,\n','Pedidos: pedidos')
          bloque=reemplazar_uno(bloque,'      productos,\n','      productos: productosDelLocalActivo,\n','Pedidos: productos')
          bloque=reemplazar_uno(bloque,'      sugerenciasPedido,\n','      sugerenciasPedido: sugerenciasPedidoDelLocalActivo,\n','Pedidos: sugerencias')
          s=s[:ini]+bloque+s[fin:]

          s=reemplazar_uno(s,'{ id: "pedidos", label: "Pedidos", icon: ShoppingCart, badge: pedidosPendientes.length }','{ id: "pedidos", label: "Pedidos", icon: ShoppingCart, badge: pedidosPendientesDelLocalActivo.length }','badge Pedidos')
          s=reemplazar_uno(s,'pendientes: pedidosPendientes.length, temaOscuro','pendientes: pedidosPendientesDelLocalActivo.length, temaOscuro','contador TopBar')

          assert s.count('productos: productosDelLocalActivo')==2
          assert s.count('pedidos: pedidosDelLocalActivo')==1
          assert s.count('movimientos: movimientosDelLocalActivo')==1
          assert s.count('sugerenciasPedido: sugerenciasPedidoDelLocalActivo')==1
          assert 'Recepcion, { pedidos, proveedorPorId' in s
          assert 'InventarioCiego,\n    {\n      productos,' in s
          p.write_text(s,encoding='utf-8')
          print('GUARDAS_OK')
          PY
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,260p'
      - name: Guardar y retirar workflows temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/aplicar-multilocal-productos-pedidos-fase3.yml
          rm -f .github/workflows/inspeccionar-multilocal-fase3.yml
          git add fuente.js .github/workflows/aplicar-multilocal-productos-pedidos-fase3.yml .github/workflows/inspeccionar-multilocal-fase3.yml
          git diff --cached --check
          git commit -m 'Separar productos y pedidos por local activo'
          git push origin HEAD:multilocal-fase-3
