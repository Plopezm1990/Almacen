name: PM07 fix reconciliacion cloud
on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-fix-reconciliacion-cloud.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Corregir reconciliacion PM07
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source-recovery/fuente-recuperado.js')
          s=p.read_text()
          old='''      const teoricoReal = movimientosDelProducto.filter((m2) => m2.origen !== "reconciliacionStock").filter((m2) => esMovimientoNuevo(m2) ? !!m2.afectaStockTotal : true).reduce((suma, m2) => suma + cantidadConSigno(m2), 0);\n      const diferencia = Number((teoricoReal - teoricoCache).toFixed(4));'''
          new='''      const teoricoHistorico = movimientosDelProducto.filter((m2) => m2.origen !== "reconciliacionStock").filter((m2) => esMovimientoNuevo(m2) ? !!m2.afectaStockTotal : true).reduce((suma, m2) => suma + cantidadConSigno(m2), 0);\n      // PM-07 cloud: stock_estado/stock_ubicacion es la fuente autoritativa. El historial servidor\n      // contiene deltas desde la adopcion de PM-07 y no parte necesariamente de stock cero, por\n      // lo que no puede usarse solo para reconstruir el saldo inicial. Evitamos falsos descuadres\n      // y cualquier reconciliacion local destructiva sobre stock ya confirmado por servidor.\n      const teoricoReal = p2._pm07Servidor ? teoricoCache : teoricoHistorico;\n      const diferencia = Number((teoricoReal - teoricoCache).toFixed(4));'''
          if old not in s:
              raise SystemExit('bloque diagnosticarStock no encontrado')
          s=s.replace(old,new,1)
          old2='''    const p2 = productos.find((pr) => pr.id === productoId);\n    if (!p2) return { ok: false, error: "Producto no encontrado." };\n    if (localActivoId && p2.localId !== localActivoId) return { ok: false, error: "El producto no pertenece al local activo." };'''
          new2='''    const p2 = productos.find((pr) => pr.id === productoId);\n    if (!p2) return { ok: false, error: "Producto no encontrado." };\n    if (localActivoId && p2.localId !== localActivoId) return { ok: false, error: "El producto no pertenece al local activo." };\n    if (p2._pm07Servidor) return { ok: true, sinCambios: true, autoritativoServidor: true };'''
          if old2 not in s:
              raise SystemExit('bloque corregirProducto no encontrado')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          t=Path('tests/pm07/frontend-contract.mjs')
          ts=t.read_text()
          marker='console.log('
          checks='''\n// PM07 cloud reconciliation must not rebuild authoritative stock from delta-only history\nassert(source.includes('const teoricoReal = p2._pm07Servidor ? teoricoCache : teoricoHistorico'), 'PM07 cloud reconciliation must trust authoritative server stock');\nassert(source.includes('if (p2._pm07Servidor) return { ok: true, sinCambios: true, autoritativoServidor: true }'), 'PM07 cloud reconciliation must not mutate authoritative stock locally');\n'''
          if 'autoritativoServidor: true' not in ts:
              idx=ts.rfind(marker)
              if idx<0: raise SystemExit('marker contrato no encontrado')
              ts=ts[:idx]+checks+ts[idx:]
              t.write_text(ts)
          PY
      - name: Reconstruir bundle y validar
        working-directory: source-recovery
        run: |
          npm ci
          npm run build
          cp dist/fuente.js ../fuente.js
      - name: Tests
        run: |
          node --check source-recovery/fuente-recuperado.js
          node --check fuente.js
          node tests/pm07/frontend-contract.mjs
          git diff --check
      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-recovery/fuente-recuperado.js fuente.js tests/pm07/frontend-contract.mjs
          git commit -m 'PM07 fix: reconciliacion respeta stock autoritativo cloud' || exit 0
          git push origin HEAD:pm07-stock-reversos-ubicacion
