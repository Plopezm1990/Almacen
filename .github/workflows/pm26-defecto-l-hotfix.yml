name: PM26 Defecto L hotfix

on:
  push:
    branches:
      - release
    paths:
      - reset-pruebas-preview.js
      - tests/pm26/defecto-l-context-hotfix.test.mjs
      - .github/workflows/pm26-defecto-l-hotfix.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Sintaxis del hotfix
        run: node --check reset-pruebas-preview.js

      - name: Sintaxis de la regresión
        run: node --check tests/pm26/defecto-l-context-hotfix.test.mjs

      - name: Regresión Defecto L
        run: node tests/pm26/defecto-l-context-hotfix.test.mjs
