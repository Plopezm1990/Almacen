name: Inspeccionar campo nombre local fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/inspeccionar-campo-nombre-local-fase4.yml'
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver campos usados para locales
        run: |
          set -euo pipefail
          grep -n -A45 -B5 'function SelectorLocalInformes' fuente.js | head -n 80 || true
          echo '=== nombres de local usados ==='
          grep -n -E 'local\.nombre|local\.name|local\.nombreLocal|l2\.nombre|l2\.name|l2\.nombreLocal' fuente.js | head -n 120 || true
