name: PM-07 ejecutar parche frontend

on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-ejecutar-parche-wrapper.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5
      - name: Ejecutar payload PM-07 del workflow original
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/pm07-aplicar-frontend-stock.yml').read_text(encoding='utf-8').splitlines()
          inicio = next(i for i,l in enumerate(src) if l.strip() == 'run: |') + 1
          bloque = src[inicio:]
          while bloque and not bloque[-1].strip():
              bloque.pop()
          script = '\n'.join((l[10:] if l.startswith('          ') else l) for l in bloque) + '\n'

          # El selector original buscaba origen:"TPV", pero la venta local real entra por venderLineas.
          viejo="if s.count(frag)!=1: raise SystemExit(f'PM07_DEFICIT_TPV_COUNT={s.count(frag)}')\ns=s.replace(frag,frag.replace('permitirDeficit: true','permitirDeficit: false'),1)"
          nuevo="venta_frag='''origen,\n        documentoOrigenId: documentoOrigenId || ventaId,\n        afectaStockTotal: true,\n        afectaStockPisoVenta: true,\n        permitirDeficit: true,\n        motivo: motivoBase,\n        camposExtra'''\nventa_frag_ok=venta_frag.replace('permitirDeficit: true','permitirDeficit: false')\nif s.count(venta_frag)==1:\n  s=s.replace(venta_frag,venta_frag_ok,1)\nelif s.count(venta_frag_ok)==1:\n  print('PM07_DEFICIT_TPV_YA_CORREGIDO=1')\nelse:\n  raise SystemExit(f'PM07_DEFICIT_TPV_REAL_COUNT={s.count(venta_frag)}')"
          if viejo not in script:
              raise SystemExit('PM07_WRAPPER_SELECTOR_DEFICIT_NO_LOCALIZADO')
          script = script.replace(viejo, nuevo, 1)

          # El precheck real del TPV es faltaStock, no una variable "disponible".
          viejo2="old='const disponible = Number(p2.stockPisoVenta) || 0;'\nif s.count(old)<1: raise SystemExit('PM07_PRECHECK_STOCK_NO_LOCALIZADO')\ns=s.replace(old,'const disponible = p2._pm07Servidor ? Number(p2.stock) || 0 : Number(p2.stockPisoVenta) || 0;',1)"
          nuevo2="old='const faltaStock = lineasCarrito.filter((l2) => l2.cantidadNum > (Number(l2.producto.stockPisoVenta) || 0));'\nnew='const faltaStock = lineasCarrito.filter((l2) => l2.cantidadNum > (l2.producto._pm07Servidor ? Number(l2.producto.stock) || 0 : Number(l2.producto.stockPisoVenta) || 0));'\nif s.count(old)==1:\n  s=s.replace(old,new,1)\nelif s.count(new)==1:\n  print('PM07_PRECHECK_TPV_YA_CORREGIDO=1')\nelse:\n  raise SystemExit(f'PM07_PRECHECK_TPV_REAL_COUNT={s.count(old)}')\nvend_old='(Number(p2.stockPisoVenta) || 0) > 0),\\n    [productos]'\nvend_new='(p2._pm07Servidor ? Number(p2.stock) || 0 : Number(p2.stockPisoVenta) || 0) > 0),\\n    [productos]'\nif s.count(vend_old)==1:\n  s=s.replace(vend_old,vend_new,1)\nelif s.count(vend_new)==1:\n  print('PM07_VENDIBLES_TPV_YA_CORREGIDO=1')\nelse:\n  raise SystemExit(f'PM07_VENDIBLES_TPV_COUNT={s.count(vend_old)}')"
          if viejo2 not in script:
              raise SystemExit('PM07_WRAPPER_SELECTOR_PRECHECK_NO_LOCALIZADO')
          script = script.replace(viejo2, nuevo2, 1)

          # La invariante original confundía el único fallback offline permitido con un fallback cloud.
          inv_old="'PM07_SIN_FALLBACK_CLOUD': 'return venderLocal(lineas, medioPago, detallePago);' not in s[find_function(s,'venderCarrito')[0]:find_function(s,'venderCarrito')[1]][300:],"
          inv_new="'PM07_SIN_FALLBACK_CLOUD': s[find_function(s,'venderCarrito')[0]:find_function(s,'venderCarrito')[1]].count('return venderLocal(lineas, medioPago, detallePago);') == 1 and 'No se ha descontado stock localmente.' in s[find_function(s,'venderCarrito')[0]:find_function(s,'venderCarrito')[1]],"
          if inv_old not in script:
              raise SystemExit('PM07_WRAPPER_INVARIANTE_FALLBACK_NO_LOCALIZADA')
          script = script.replace(inv_old, inv_new, 1)

          Path('/tmp/pm07_payload.sh').write_text(script, encoding='utf-8')
          print('PM07_WRAPPER_PAYLOAD_LINES=', len(script.splitlines()))
          PY
          bash /tmp/pm07_payload.sh
