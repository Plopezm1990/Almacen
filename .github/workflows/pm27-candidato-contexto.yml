name: PM27 candidato - contexto Defecto L

on:
  push:
    branches:
      - claude/pm27-reauditoria-candidato
    paths:
      - pm11-compra-mobile-loader.js
      - tests/pm27/defecto-l-context-hotfix.test.mjs
      - tests/pm27/release-hotfix-state.test.mjs
      - .github/workflows/pm27-candidato-contexto.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-contexto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sintaxis loader universal
        run: node --check pm11-compra-mobile-loader.js

      - name: Sintaxis regresiones PM27
        run: |
          node --check tests/pm27/defecto-l-context-hotfix.test.mjs
          node --check tests/pm27/release-hotfix-state.test.mjs

      - name: Regresion Defecto L y aislamiento
        run: node tests/pm27/defecto-l-context-hotfix.test.mjs

      - name: Estado autorizado main-release posterior a P05
        run: node tests/pm27/release-hotfix-state.test.mjs

      - name: Preparar dependencias del build canonico PM26
        run: npm ci --prefix source-recovery

      - name: Regresion de contratos PM26 aplicables
        shell: bash
        run: |
          set -euo pipefail
          for contrato in tests/pm26/*-contract.mjs; do
            case "$contrato" in
              tests/pm26/p05b-contract.mjs|tests/pm26/p05c-contract.mjs)
                echo "==> $contrato [invariante histórico release==main sustituido por test PM27 de fast-forward y alcance exacto]"
                continue
                ;;
            esac
            echo "==> $contrato"
            node "$contrato"
          done
