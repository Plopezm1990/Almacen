name: PM27 candidato - contexto Defecto L

on:
  push:
    branches:
      - claude/pm27-reauditoria-candidato
    paths:
      - pm11-compra-mobile-loader.js
      - tests/pm27/defecto-l-context-hotfix.test.mjs
      - tests/pm27/release-hotfix-state.test.mjs
      - tests/pm27/p08c-post-p09f-compat.test.mjs
      - .github/workflows/pm27-candidato-contexto.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-contexto:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Supabase CLI estable para pruebas locales PM26
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.117.0

      - name: Verificar Supabase CLI local
        run: supabase --version

      - name: Sintaxis loader universal
        run: node --check pm11-compra-mobile-loader.js

      - name: Sintaxis regresiones PM27
        run: |
          node --check tests/pm27/defecto-l-context-hotfix.test.mjs
          node --check tests/pm27/release-hotfix-state.test.mjs
          node --check tests/pm27/p08c-post-p09f-compat.test.mjs

      - name: Regresion Defecto L y aislamiento
        run: node tests/pm27/defecto-l-context-hotfix.test.mjs

      - name: Estado autorizado main-release posterior a P05
        run: node tests/pm27/release-hotfix-state.test.mjs

      - name: Compatibilidad historica P08c con P09f-B3
        run: node tests/pm27/p08c-post-p09f-compat.test.mjs

      - name: Preparar dependencias del build canonico PM26
        run: npm ci --prefix source-recovery

      - name: Preparar PostgreSQL local aislado para P06b
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl start postgresql
          sudo -u postgres pg_isready
          sudo -u postgres psql -tAc 'select current_user, current_database();'

      - name: Regresion de contratos PM26 aplicables
        shell: bash
        run: |
          set -euo pipefail
          for contrato in tests/pm26/*-contract.mjs; do
            case "$contrato" in
              tests/pm26/p05b-contract.mjs|tests/pm26/p05c-contract.mjs)
                echo "==> $contrato [invariante histórico release==main sustituido por test PM27 de fast-forward y alcance exacto]"
                continue
                ;;
              tests/pm26/p08c-contract.mjs|tests/pm26/p08d-contract.mjs)
                echo "==> $contrato [reproducido en alcance histórico; P09f-B3 validado aparte por PM27]"
                migracion='supabase/migrations/20260912120000_pm26_p09f_b3_pagos_encargo_operation_id_global.sql'
                backup="$(mktemp)"
                cp "$migracion" "$backup"
                rm "$migracion"
                set +e
                node "$contrato"
                status=$?
                set -e
                cp "$backup" "$migracion"
                rm -f "$backup"
                if [[ $status -ne 0 ]]; then
                  exit "$status"
                fi
                git diff --exit-code -- "$migracion"
                continue
                ;;
            esac
            echo "==> $contrato"
            node "$contrato"
          done
