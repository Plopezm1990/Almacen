name: PM17 P04 retirada de parches externos

on:
  push:
    branches: [claude/pm17-seguridad-notificaciones]
    paths:
      - 'fuente.js'
      - 'tests/pm17/**'
      - '.github/workflows/pm17-p04-retirar-parches-externos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-p04:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger main y alcance P04 (sin cambios en supabase/)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "5db0b9ed03c8f8ecd700ff339edce1dff14ffde4"
          unexpected="$(git diff --name-only origin/main..HEAD -- supabase/ || true)"
          if [ -n "$unexpected" ]; then
            echo 'PM17 P04 es un cambio de frontend puro: no debe tocar supabase/' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo 'PM17_P04_MAIN_FROZEN=PASS'
          echo 'PM17_P04_SIN_CAMBIOS_SUPABASE=PASS'
      - name: Sintaxis bundle
        run: node --check fuente.js
      - name: Contrato PM17 P04 (retirada de parches externos)
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm17/p04-retirar-parches-externos-contract.mjs
      - name: Regresión completa (todas las suites vigentes, incluye PM17 P01-P03)
        shell: bash
        run: |
          set -euo pipefail
          for d in tests/g1 tests/pm04 tests/pm05 tests/pm07 tests/pm08 tests/pm09 tests/pm10 tests/pm11-compra tests/pm12 tests/pm13 tests/pm14 tests/pm15 tests/pm16; do
            for t in "$d"/*.mjs; do
              [ -f "$t" ] || continue
              node "$t"
            done
          done
          for t in tests/pm17/*.mjs; do
            [ -f "$t" ] || continue
            node "$t"
          done
          echo 'PM17_P04_REGRESION_COMPLETA=PASS'
      - name: Sin secretos
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm17/p04-retirar-parches-externos-contract.mjs \
            tests/pm17/P04_CIERRE_RETIRADA_PARCHES_EXTERNOS.md
          echo 'PM17_P04_NO_SECRET=PASS'

  gate-final:
    needs: validar-p04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM17 P04
        run: |
          set -euo pipefail
          node tests/pm17/p04-retirar-parches-externos-contract.mjs
          echo 'PM17_P04_GATE_FINAL=PASS'
