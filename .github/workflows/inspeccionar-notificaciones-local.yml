name: Inspeccionar Notificaciones
on:
  push:
    branches: [preparacion-sin-netlify]
    paths:
      - .github/workflows/inspeccionar-notificaciones-local.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preparacion-sin-netlify
      - name: Mostrar función y llamada
        shell: node {0}
        run: |
          const fs = require('fs');
          const s = fs.readFileSync('fuente.js','utf8');
          for (const term of ['function Notificaciones(', 'Notificaciones,', 'createElement(Notificaciones']) {
            let from = 0, n = 0;
            while (n < 6) {
              const i = s.indexOf(term, from);
              if (i < 0) break;
              n++;
              console.log(`\n--- ${term} #${n} at ${i} ---\n` + s.slice(Math.max(0,i-1800), Math.min(s.length,i+6500)));
              from = i + term.length;
            }
          }
