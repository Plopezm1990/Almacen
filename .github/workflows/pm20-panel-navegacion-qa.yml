name: PM20 panel y navegación QA

on:
  push:
    branches: [codex/ventas-release-integration]
    paths:
      - 'fuente.js'
      - 'index-storage-bootstrap.js'
      - 'tests/pm20/**'
      - 'tests/plataforma/p05-panel-ui-runtime.mjs'
      - 'tests/plataforma/p08c-copia-historial-cuota-runtime.mjs'
      - '.github/workflows/pm20-panel-navegacion-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  panel-navegacion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Instalar dependencias de runtime aislado
        run: npm install --no-save --no-audit --no-fund --ignore-scripts react@18.3.1 react-dom@18.3.1 jsdom@24.1.3

      - name: Sintaxis y contratos de panel/navegación
        shell: bash
        run: |
          set -euo pipefail
          node --check fuente.js
          node tests/pm20/p06-panel-navegacion-p0-contract.mjs
          node tests/pm20/p07-panel-search-target-contract.mjs
          node tests/pm20/p08-sync-banner-contract.mjs
          node tests/pm20/p09-sync-events-runtime.mjs
          node tests/pm20/p12-employee-owner-guard-contract.mjs

      - name: Runtime aislado del panel y sincronización
        env:
          CFG6_UI_DEPS: ${{ github.workspace }}
        run: |
          set -euo pipefail
          node tests/pm20/p10-sync-banner-ui-runtime.mjs
          node tests/pm20/p11-panel-navigation-e2e-runtime.mjs
          node tests/plataforma/p08c-copia-historial-cuota-runtime.mjs
          node tests/plataforma/p05-panel-ui-runtime.mjs

      - name: Regresión de contexto, permisos y borradores
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm12/p13-local-context-sync-contract.mjs
          node tests/pm12/p14-contextual-kv-storage-contract.mjs
          node tests/pm12/p15-local-context-reload-contract.mjs
          node tests/pm13/p14-pantallas-inventario-contract.mjs
          node tests/pm13/p15-pantallas-capacidades-contract.mjs
          node tests/pm13/p16-editor-pantallas-contract.mjs
          node tests/pm13/p18-cargo-action-resolver-contract.mjs
          node tests/pm13/p19-cargo-action-guard-integration-contract.mjs
          node tests/pm13/p21-roles-fijos-pantallas-contract.mjs
          node tests/pm13/p22-read-permission-contract.mjs
          node tests/pm13/p23-empleados-rls-permission-contract.mjs
          node tests/pm15/p04-nr08-proteccion-borrador-navegacion-contract.mjs
          node tests/pm32/p01-selector-empresa-y-local-contract.mjs

      - name: Verificar ausencia de secretos en las pruebas nuevas
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm20/p06-panel-navegacion-p0-contract.mjs \
            tests/pm20/p07-panel-search-target-contract.mjs \
            tests/pm20/p08-sync-banner-contract.mjs \
            tests/pm20/p09-sync-events-runtime.mjs \
            tests/pm20/p10-sync-banner-ui-runtime.mjs
          echo 'PM20_PANEL_NAVEGACION_NO_SECRET=PASS'
