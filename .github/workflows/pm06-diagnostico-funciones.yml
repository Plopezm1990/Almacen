name: PM-06 diagnostico funciones

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-diagnostico-funciones.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer bloques exactos PM-06
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(errors='ignore').splitlines()
          pats=['function crearLogicaFacturasDirectas','function CuentasPorPagar','function Facturas','function crearLogicaAlbaranes']
          for pat in pats:
              found=False
              for i,line in enumerate(s):
                  if pat in line:
                      found=True
                      print(f'===== {pat} @ {i+1} =====')
                      for j in range(i, min(len(s), i+180)):
                          print(f'{j+1}: {s[j][:1000]}')
                      break
              if not found: print(f'===== {pat} NOT FOUND =====')
          print('PM06_DIAGNOSTICO_BLOQUES_OK=1')
          PY
