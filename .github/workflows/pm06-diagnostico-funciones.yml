name: PM-06 diagnostico funciones

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-diagnostico-funciones.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer contextos UI financiera PM-06
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(errors='ignore')
          pats=['Marcar como pagada','Marcar como pendiente','marcar(f2,','deleteFacturaDirecta(f2.id)','Pagada','Sin pagar','Factura directa','Vencimiento','proveedorId: form.proveedorId']
          for pat in pats:
              start=0; n=0
              while True:
                  i=s.find(pat,start)
                  if i<0: break
                  n+=1
                  print(f'===== {pat} OCC {n} @ CHAR {i} =====')
                  print(s[max(0,i-900):min(len(s),i+1600)])
                  start=i+len(pat)
                  if n>=6: break
              if n==0: print(f'===== {pat} NOT FOUND =====')
          print('PM06_UI_CONTEXTOS_OK=1')
          PY
