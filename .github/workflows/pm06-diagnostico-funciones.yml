name: PM-06 diagnostico funciones

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-diagnostico-funciones.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer UI financiera PM-06
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(errors='ignore').splitlines()
          for pat,span in [('function CuentasPorPagar',420),('function Facturas',300),('const facturasPorPagar',180),('const libroIva',160)]:
              found=False
              for i,line in enumerate(s):
                  if pat in line:
                      found=True
                      print(f'===== {pat} @ {i+1} =====')
                      for j in range(max(0,i-20), min(len(s),i+span)):
                          print(f'{j+1}: {s[j][:1200]}')
                      break
              if not found: print(f'===== {pat} NOT FOUND =====')
          print('PM06_UI_DIAGNOSTICO_OK=1')
          PY
