name: PM-06 diagnostico funciones

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-diagnostico-funciones.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer bloques exactos PM-06
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['source-recovery/fuente-recuperado.js','index.html']
          pats=['function crearLogicaGastos','addGasto','deleteGasto','gastosGenerales','facturasDirectas','albaranes','CLAVES_CACHE_POR_USUARIO','TABLAS_EMPRESA','MAPA_TABLAS','almacen_kv']
          for fn in files:
              s=Path(fn).read_text(errors='ignore').splitlines()
              print(f'######## FILE {fn} ########')
              shown=0
              for pat in pats:
                  for i,line in enumerate(s):
                      if pat in line:
                          print(f'===== {pat} @ {i+1} =====')
                          a=max(0,i-10); b=min(len(s),i+90)
                          for j in range(a,b): print(f'{j+1}: {s[j][:1000]}')
                          shown += 1
                          break
              print(f'PM06_HITS_{fn.replace("/","_")}={shown}')
          print('PM06_DIAGNOSTICO_BLOQUES_OK=1')
          PY
