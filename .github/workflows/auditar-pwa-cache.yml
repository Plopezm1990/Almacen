name: Auditar PWA y cache
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/auditar-pwa-cache.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar service worker y caches en todo el frontend
        shell: python
        run: |
          from pathlib import Path
          import re
          extensiones={'.js','.html','.json','.md','.txt','.jsx','.ts','.tsx'}
          terminos=[
            'serviceWorker','sw.js','navigator.serviceWorker','caches.','caches[',
            'CacheStorage','skipWaiting','clients.claim','register(', 'unregister('
          ]
          ignorar={'.git','node_modules','source-recovery'}
          archivos=[]
          for p in Path('.').rglob('*'):
            if not p.is_file(): continue
            if any(x in p.parts for x in ignorar): continue
            if p.suffix.lower() not in extensiones and p.name not in {'_headers'}: continue
            archivos.append(p)
          print('ARCHIVOS_ANALIZADOS=',len(archivos))
          for p in archivos:
            try: text=p.read_text(encoding='utf-8')
            except Exception: continue
            lines=text.splitlines()
            hits=[]
            for i,l in enumerate(lines):
              if any(t.lower() in l.lower() for t in terminos): hits.append(i)
            if not hits: continue
            print(f'\n=== {p} | {len(lines)} lineas | {p.stat().st_size} bytes ===')
            vistos=set()
            for i in hits:
              a=max(0,i-4); b=min(len(lines),i+6)
              if (a,b) in vistos: continue
              vistos.add((a,b))
              print(f'--- contexto {i+1} ---')
              for j in range(a,b):
                x=lines[j]
                if len(x)>900: x=x[:900]+' ...'
                print(f'{j+1}: {x}')
          print('\n=== INVENTARIO CACHE API ===')
          for p in archivos:
            try: text=p.read_text(encoding='utf-8')
            except Exception: continue
            if re.search(r'\bcaches\s*\.|\bCacheStorage\b',text,re.I): print(p)
