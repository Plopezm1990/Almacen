name: Inspeccionar historial respaldos
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/inspeccionar-historial-respaldos.yml
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar contextos relevantes
        shell: python
        run: |
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          objetivos=['saveKey("historialRespaldos"','historialRespaldos']
          vistos=[]
          for obj in objetivos:
            pos=0
            while True:
              i=s.find(obj,pos)
              if i<0: break
              if all(abs(i-v)>2000 for v in vistos):
                vistos.append(i)
                print('\n=== POS',i,'OBJ',obj,'===')
                print(s[max(0,i-2500):min(len(s),i+3500)])
              pos=i+1
          print('COINCIDENCIAS=',len(vistos))