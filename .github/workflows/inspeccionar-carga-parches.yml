name: Inspeccionar carga de parches PR4
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/inspeccionar-carga-parches.yml
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirmar cadena de imports
        run: |
          git fetch origin preparacion-sin-netlify
          mkdir -p /tmp/pr4
          git archive origin/preparacion-sin-netlify | tar -x -C /tmp/pr4
          cd /tmp/pr4
          echo '=== fuente -> chunk ==='
          grep -n 'chunk-CZ7CSFO4' fuente.js | head -20
          echo '=== chunk -> edge patch ==='
          grep -n 'edge-auth-patch' chunk-CZ7CSFO4.js | head -20
          echo '=== edge patch -> seleccion patch ==='
          grep -n 'seleccion-neutral-patch' edge-auth-patch.js | head -20
          echo 'INSPECCION_CARGA_PARCHES_OK=1'
