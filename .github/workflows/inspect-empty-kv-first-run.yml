name: Inspect empty KV first-run

on:
  push:
    branches:
      - claude/hotfix-empty-kv-first-run

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact storage/loadKey implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('fuente.js')
          lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
          needles=[
            'window.storage =',
            'window.storage=',
            'storage = {',
            'storage={',
            'storage.get =',
            'storage.get=',
            '"no existe"',
            "'no existe'",
            'Error("no existe")',
            "Error('no existe')",
            'throw new Error',
            'async function loadKey',
            'function loadKey'
          ]
          hits=[]
          for i,line in enumerate(lines,1):
            if any(n in line for n in needles): hits.append(i)
          print('HITS', hits[:400])
          merged=[]
          for i in hits[:200]:
            a=max(1,i-18); b=min(len(lines),i+35)
            if merged and a <= merged[-1][1]+1:
              merged[-1]=(merged[-1][0],max(merged[-1][1],b))
            else:
              merged.append((a,b))
          for a,b in merged[:80]:
            print(f'--- {p}:{a}-{b} ---')
            for j in range(a,b+1): print(f'{j}: {lines[j-1]}')
          PY
