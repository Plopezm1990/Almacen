name: PM11 Compra P03 recepciones multiples y replay

on:
  workflow_dispatch:
  push:
    branches:
      - pm11-compra-recepcion-pago-e2e
    paths:
      - 'tools/corregir_pm11_compra_p03_recepciones.py'
      - 'tests/pm11-compra/p03-recepciones-multiples-replay-contract.mjs'
      - 'tests/pm11-compra/P03_RECEPCIONES_MULTIPLES_REPLAY.md'
      - '.github/workflows/pm11-compra-p03-recepciones.yml'
      - 'fuente.js'

permissions:
  contents: write

jobs:
  recepciones-multiples:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar main congelado
        shell: bash
        run: |
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"

      - name: Aplicar endurecimiento P03
        run: python3 tools/corregir_pm11_compra_p03_recepciones.py

      - name: Sintaxis bundle
        run: node --check fuente.js

      - name: Contrato P03
        run: node tests/pm11-compra/p03-recepciones-multiples-replay-contract.mjs

      - name: Regresión recepción PM10
        run: node tests/pm10/p06-recepcion-contract.mjs

      - name: Regresión pedidos PM10
        run: node tests/pm10/p05-pedidos-contract.mjs

      - name: Contrato E2E P02
        run: node tests/pm11-compra/p02-contrato-e2e-estados-contract.mjs

      - name: Commit funcional generado
        shell: bash
        run: |
          if git diff --quiet -- fuente.js; then
            echo 'fuente.js ya contiene P03'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuente.js
          git commit -m 'PM11 compra P03: hacer idempotentes recepciones directas'
          git push

      - name: Resultado
        run: echo 'PM11_COMPRA_P03_GATE=PASS'
