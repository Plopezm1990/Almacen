name: PM11 P06 Focus Frontend Personal
on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p06-focus-frontend.yml'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar rama protegida de trabajo
        run: test "$GITHUB_REF_NAME" = "pm11-personal-empleados"
      - name: Extraer montaje exacto de Personal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          out=[]
          for token in ['createElement(Personal', 'crearCuentaEmpleado']:
            start=0; n=0
            while True:
              i=s.find(token,start)
              if i<0: break
              n+=1
              out.append(f'\n===== {token!r} HIT {n} @ {i} =====\n{s[max(0,i-1800):min(len(s),i+4200)]}\n')
              start=i+len(token)
          Path('tests/pm11/P06_MONTAJE_PERSONAL.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm11/P06_MONTAJE_PERSONAL.txt
          git diff --cached --quiet && exit 0
          git commit -m 'PM11: guardar montaje exacto de Personal'
          git push
