name: PM11 P06 Focus Frontend Personal
on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p06-focus-frontend.yml'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar rama protegida de trabajo
        run: |
          test "$GITHUB_REF_NAME" = "pm11-personal-empleados"
      - name: Extraer contextos necesarios de fuente.js
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          tokens=[
            'function normalizeEmpleadosList',
            'normalizeEmpleadosList(',
            'function reconcileAppEmpleados',
            'reconcileAppEmpleados(',
            'function loadRemoteAppData',
            'loadRemoteAppData',
            'function saveAll',
            'saveAll=',
            'saveAll =',
            '_pm10_ensurePersonalEmployeeId',
            '_pm10_normalizePersonalEmpleado',
            'state.empleados.push',
            'state.empleados[index]',
            'splice(index,1)',
            'splice(index, 1)',
            '.rpc(',
            'createClient(',
            'supabaseClient',
            'almacen_kv',
            'Editar empleado',
            'Nuevo empleado',
            'Eliminar empleado',
            'reactivar',
          ]
          out=[]
          out.append(f'FUENTE_LEN={len(s)}\n')
          for token in tokens:
            positions=[]
            start=0
            while True:
              i=s.find(token,start)
              if i<0: break
              positions.append(i)
              start=i+max(1,len(token))
              if len(positions)>=12: break
            out.append(f'\n===== TOKEN {token!r} COUNT_SHOWN={len(positions)} =====\n')
            for n,i in enumerate(positions,1):
              a=max(0,i-2200); b=min(len(s),i+5200)
              out.append(f'\n--- hit {n} @ {i} ---\n{s[a:b]}\n')
          Path('tests/pm11/P06_FRONTEND_FOCUS.txt').write_text(''.join(out),encoding='utf-8')
          print('Generado tests/pm11/P06_FRONTEND_FOCUS.txt')
          PY
      - name: Commit diagnóstico focalizado
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm11/P06_FRONTEND_FOCUS.txt
          git diff --cached --quiet && exit 0
          git commit -m 'PM11: guardar foco frontend Personal'
          git push
