name: PM11 P06 Focus Frontend Personal
on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p06-focus-frontend.yml'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verificar rama protegida de trabajo
        run: test "$GITHUB_REF_NAME" = "pm11-personal-empleados"
      - name: Extraer estado y persistencia de Personal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          tokens=[
            'setEmpleados',
            'crearLogicaPersonal({',
            'Personal,',
            'Personal({',
            'empleados,',
            'empleados:',
            'documentosPersonalCaducan',
            'localActivoId',
            'empresaId',
            'window.storage.get',
            'window.storage.set',
            'storage.get(',
            'storage.set(',
          ]
          out=[f'FUENTE_LEN={len(s)}\n']
          for token in tokens:
            pos=[]; start=0
            while True:
              i=s.find(token,start)
              if i<0: break
              pos.append(i); start=i+max(1,len(token))
              if len(pos)>=35: break
            out.append(f'\n===== {token!r} HITS={len(pos)} =====\n')
            for n,i in enumerate(pos,1):
              a=max(0,i-1800); b=min(len(s),i+4200)
              out.append(f'\n--- {n} @ {i} ---\n{s[a:b]}\n')
          Path('tests/pm11/P06_ESTADO_PERSISTENCIA.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Commit diagnóstico
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm11/P06_ESTADO_PERSISTENCIA.txt
          git diff --cached --quiet && exit 0
          git commit -m 'PM11: guardar diagnóstico de estado Personal'
          git push
