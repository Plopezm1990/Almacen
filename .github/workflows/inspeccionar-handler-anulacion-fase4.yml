name: Inspeccionar handler anulacion fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-handler-anulacion-fase4.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer funciones objetivo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for marker, span in [('function confirmarAnulacion()', 3500), ('function anularVenta(ventaId, movimientosActuales, motivo = "")', 7500)]:
              i=s.index(marker)
              print('\n===== '+marker+' =====\n'+s[i:i+span])
          PY