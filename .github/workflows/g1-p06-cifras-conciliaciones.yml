name: G1 Punto 6 cifras conciliaciones

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p06-cifras-conciliaciones.yml'
      - 'tests/g1/P06_CIFRAS_CONCILIACIONES_EVIDENCIA.md'
      - 'tests/g1/p06-cifras-conciliaciones-contract.mjs'
      - 'tests/g1/**'
      - 'tests/pm09/**'
      - 'fuente.js'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  cifras-conciliaciones:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar descendencia de PM10 final
        run: |
          git merge-base --is-ancestor 94d37cc7a5176e3a44d00f8f8bfb79a630dae314 HEAD
          echo 'G1_P06_DESCIENDE_PM10_FINAL=1'
      - name: Sintaxis del candidato
        run: node --check fuente.js
      - name: Contrato G1.6
        run: node tests/g1/p06-cifras-conciliaciones-contract.mjs
      - name: Regresión económica PM09
        run: |
          node tests/pm09/la007-results-contract.mjs
          node tests/pm09/la008-rotation-margin-contract.mjs
          node tests/pm09/p10-caja-contract.mjs
          node tests/pm09/p11-iva-contract.mjs
          node tests/pm09/p12-resultados-margin-contract.mjs
          node tests/pm09/p15-special-economic-contract.mjs
      - name: Regresión G1 previa
        run: |
          node tests/g1/p02-evidence-map-contract.mjs
          node tests/g1/p03-la019-contract.mjs
          node tests/g1/p04-la023-contract.mjs
          node tests/g1/p05-permisos-aislamiento-contract.mjs
      - name: Resumen
        run: |
          echo 'G1_P06_CIFRAS_CONCILIACIONES=PASS'
          echo 'G1_GATE_SUPERADO=NO'
          echo 'G1_SIGUIENTE=P07_CONCURRENCIA_REPLAY'
