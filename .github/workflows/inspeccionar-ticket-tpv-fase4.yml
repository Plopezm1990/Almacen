name: Precisar anclas ticket TPV fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-ticket-tpv-fase4.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar contexto exacto del detalle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for needle in ['ID interno', 'confirmAnular &&', 'ventaDetalle.id', 'Anular venta']:
              print('\n===', needle, '===')
              pos=[]; start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  pos.append(i); start=i+len(needle)
              print('COUNT',len(pos))
              for i in pos[-5:]:
                  print(repr(s[max(0,i-700):i+1100]))
                  print('---')
          PY
