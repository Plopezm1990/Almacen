name: Inspeccionar modelo ticket TPV fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-ticket-tpv-fase4.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar modelo normalizado del historial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for needle in ['function renderHistorialVentas', 'const ventasAgrupadas', 'const historialVentas', 'ventaId:', 'importe:', 'resumen:']:
              print('\n===', needle, '===')
              i=s.find(needle)
              print('POS',i)
              if i>=0: print(s[max(0,i-3000):i+9000])
          PY
