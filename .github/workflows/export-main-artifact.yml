name: Export main artifact
on:
  push:
    branches: [export-netlify-main]
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Exportar exactamente main base
        run: |
          git archive --format=zip HEAD^ -o site-main.zip
      - uses: actions/upload-artifact@v4
        with:
          name: site-main
          path: site-main.zip
          if-no-files-found: error
