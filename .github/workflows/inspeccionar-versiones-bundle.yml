name: Inspeccionar versiones originales
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/inspeccionar-versiones-bundle.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar versiones y firmas
        shell: python
        run: |
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          lines=s.splitlines()
          checks={
            'lucide':['lucide-react','lucide','Lucide'],
            'jspdf':['jsPDF.version','jspdf','jsPDF'],
            'autotable':['autoTable','AutoTable','jspdf-autotable'],
            'xlsx':['0.18.5','XLSX','SheetJS','xlsx'],
            'supabase':['2.112.4','supabase-js/'],
            'react':['18.3.1','ReactVersion'],
          }
          for nombre,terms in checks.items():
            print('=== '+nombre.upper()+' ===')
            hits=[]
            for i,l in enumerate(lines):
              if any(t.lower() in l.lower() for t in terms): hits.append(i)
            for i in hits[:30]:
              a=max(0,i-2); b=min(len(lines),i+3)
              print('---',i+1,'---')
              for j in range(a,b):
                x=lines[j].strip()
                if len(x)>500: x=x[:500]+' ...[cortado]'
                print(f'{j+1}: {x}')
          print('=== VERSION STRINGS CANDIDATAS ===')
          pats=[r'\bversion\w*\s*=\s*["\']([0-9]+\.[0-9]+\.[0-9]+)["\']',r'\.version\s*=\s*["\']([0-9]+\.[0-9]+\.[0-9]+)["\']']
          found=[]
          for i,l in enumerate(lines):
            for p in pats:
              for m in re.finditer(p,l,re.I): found.append((i+1,m.group(1),l.strip()[:300]))
          for x in found[:100]: print(x)
