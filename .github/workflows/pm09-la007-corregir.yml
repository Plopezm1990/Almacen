name: PM09 LA-007 corregir Resultados
on:
  push:
    branches: [pm09-conciliacion-ventas-analitica]
    paths:
      - '.github/workflows/pm09-la007-corregir.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm09-conciliacion-ventas-analitica
      - name: Aplicar cambio mínimo
        shell: bash
        run: |
          set -euo pipefail
          python tools/corregir_pm09_la007.py
          node --check fuente.js
      - name: Validar contrato LA-007
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm09/la007-results-contract.mjs
      - name: Regresiones heredadas de frontend
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm05/frontend-contract.mjs
          node tests/pm07/frontend-contract.mjs
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm08/replay-scope-contract.mjs
      - name: Generar evidencia del candidato
        shell: bash
        run: |
          set -euo pipefail
          SHA256=$(sha256sum fuente.js | awk '{print $1}')
          mkdir -p tests/pm09
          cat > tests/pm09/LA007_RESULTADOS_EVIDENCIA.json <<EOF
          {
            "hallazgo": "LA-007",
            "estado": "CORREGIDO_PENDIENTE_DE_QA_FINAL_PM09",
            "rama": "pm09-conciliacion-ventas-analitica",
            "baseEntradaWorkflow": "${GITHUB_SHA}",
            "fuenteSha256": "${SHA256}",
            "auditoriaHistorica": {
              "cancelada24MasActiva2_obtenido_ingresos": 141.82,
              "cancelada24MasActiva2_obtenido_coste": 78,
              "esperado_activa2_ingresos": 10.91,
              "esperado_activa2_coste": 6
            },
            "reproduccionQAPM09": {
              "cancelada2MasActiva1_legacy_ingresos": 16.36,
              "cancelada2MasActiva1_legacy_coste": 9,
              "esperado_ingresos": 5.45,
              "esperado_coste": 3
            },
            "causa": "Resultados solo agregaba VENTA como salida; REVERSO es entrada positiva y quedaba fuera de ventas.",
            "cambio": "Restar REVERSO trazable del periodo usando ingreso/coste historicos del propio reverso; conservar venta original y su periodo.",
            "sourceRecoveryRebuild": false,
            "notaSourceRecovery": "No se recompila desde source-recovery porque su README acredita paridad con PR4, anterior a PM05-PM08; se modifica el bundle vivo de la rama de forma mínima y verificable."
          }
          EOF
      - name: Guardar solo en PM09
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add fuente.js tests/pm09/LA007_RESULTADOS_EVIDENCIA.json
          git diff --cached --quiet && exit 0
          git commit -m "PM09: conciliar anulaciones en Resultados (LA-007)"
          git push origin HEAD:pm09-conciliacion-ventas-analitica
