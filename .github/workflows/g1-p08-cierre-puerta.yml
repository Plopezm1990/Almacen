name: G1 Punto 8 cierre Puerta G1

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p08-cierre-puerta.yml'
      - 'tests/g1/**'
      - 'tests/pm04/**'
      - 'tests/pm05/**'
      - 'tests/pm07/**'
      - 'tests/pm08/**'
      - 'tests/pm09/**'
      - 'tests/pm10/**'
      - 'source-recovery/**'
      - 'fuente.js'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  cierre-g1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fijar SHA del candidato
        run: |
          echo "G1_GATE_SHA=$(git rev-parse HEAD)"
          git merge-base --is-ancestor 94d37cc7a5176e3a44d00f8f8bfb79a630dae314 HEAD
          echo 'G1_DESCIENDE_PM10_FINAL=1'

      - name: Sintaxis del candidato
        run: node --check fuente.js

      - name: Contrato LA-004 y gate
        run: node tests/g1/p08-la004-gate-contract.mjs

      - name: Regresión G1 P02-P07
        run: |
          node tests/g1/p02-evidence-map-contract.mjs
          node tests/g1/p03-la019-contract.mjs
          node tests/g1/p04-la023-contract.mjs
          node tests/g1/p05-permisos-aislamiento-contract.mjs
          node tests/g1/p06-cifras-conciliaciones-contract.mjs
          node tests/g1/p07-concurrencia-replay-contract.mjs

      - name: Regresión CRITICAL HIGH PM05 PM07 PM08
        run: |
          node tests/pm05/frontend-contract.mjs
          node tests/pm07/frontend-contract.mjs
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm08/replay-scope-contract.mjs

      - name: Regresión CRITICAL HIGH PM09
        run: |
          node tests/pm09/la007-results-contract.mjs
          node tests/pm09/la008-rotation-margin-contract.mjs
          node tests/pm09/p09-historial-contract.mjs
          node tests/pm09/p10-caja-contract.mjs
          node tests/pm09/p11-iva-contract.mjs
          node tests/pm09/p12-resultados-margin-contract.mjs
          node tests/pm09/p15-special-economic-contract.mjs
          node tests/pm09/p16-isolation-context-contract.mjs
          node tests/pm09/p17-robustness-contract.mjs

      - name: Regresión CRITICAL HIGH PM10
        run: |
          node tests/pm10/p04-productos-contract.mjs
          node tests/pm10/p05-pedidos-contract.mjs
          node tests/pm10/p06-recepcion-contract.mjs
          node tests/pm10/p07-personal-contract.mjs
          node tests/pm10/p08-encargos-contract.mjs
          node tests/pm10/p09-transversal-contract.mjs
          node tests/pm10/p10-autoridad-persistencia-contract.mjs
          node tests/pm10/p11-robustez-altas-contract.mjs
          node tests/pm10/p12-datos-legados-contract.mjs
          node tests/pm10/p13-contexto-aislamiento-contract.mjs

      - name: Build reproducible del candidato
        run: |
          cd source-recovery
          npm ci
          npm run check
          npm run build
          echo '--- SHA256 build vs candidato ---'
          sha256sum dist/fuente.js ../fuente.js
          cmp -s dist/fuente.js ../fuente.js
          echo 'G1_BUILD_REPRODUCIBLE=PASS'
          cd ..

      - name: Resumen Puerta G1
        run: |
          echo 'G1_LA004=PASS'
          echo 'G1_CRIT_HIGH_16_OF_16=PASS'
          echo 'G1_LA019=PASS'
          echo 'G1_LA023=PASS'
          echo 'G1_PERMISOS_AISLAMIENTO=PASS'
          echo 'G1_CIFRAS_CONCILIACIONES=PASS'
          echo 'G1_CONCURRENCIA_REPLAY=PASS'
          echo 'G1_BUILD_REPRODUCIBLE=PASS'
          echo 'G1_GATE_SUPERADO=SI'
          echo 'G1_SIGUIENTE=PM11'
