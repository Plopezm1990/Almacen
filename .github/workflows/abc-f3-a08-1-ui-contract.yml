name: A08.1 UI reparto por productos

on:
  push:
    branches:
      - abc-f3-a08-1-ui-lines
    paths:
      - 'source-recovery/fuente-recuperado.js'
      - 'fuente.js'
      - 'scripts/f3/a08-1-materialize.mjs'
      - 'tests/f3/a08/a08-1-ui-contract.mjs'
      - 'tests/ci/manifiesto_clasificacion.json'
      - '.github/scripts/validar-manifiesto-ci.mjs'
      - '.github/workflows/puerta-ci-release.yml'
      - '.github/workflows/abc-f3-a08-1-ui-contract.yml'

permissions:
  contents: write

concurrency:
  group: abc-f3-a08-1-ui-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Guardar alcance y base release
        shell: bash
        run: |
          set -euo pipefail
          BASE=ed30d80f3d3a2e0b7d1841fc31ce589d70710e7a
          git merge-base --is-ancestor "$BASE" HEAD
          BAD=$(git diff --name-only "$BASE...HEAD" | grep -Ev '^(fuente\.js|source-recovery/fuente-recuperado\.js|scripts/f3/a08-1-materialize\.mjs|tests/f3/a08/a08-1-ui-contract\.mjs|tests/ci/manifiesto_clasificacion\.json|\.github/scripts/validar-manifiesto-ci\.mjs|\.github/workflows/puerta-ci-release\.yml|\.github/workflows/abc-f3-a08-1-ui-contract\.yml)$' || true)
          if [ -n "$BAD" ]; then
            echo "A08_1_SCOPE_FAIL" >&2
            echo "$BAD" >&2
            exit 1
          fi
          echo "A08_1_SCOPE=PASS"

      - name: Materializar runtime desde Source Recovery
        shell: bash
        run: |
          set -euo pipefail
          node scripts/f3/a08-1-materialize.mjs

      - name: Verificar sintaxis y Source Recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check fuente.js
          python3 source-recovery/recuperar_candidato.py --check
          echo "A08_1_SOURCE_RECOVERY=PASS"

      - name: Build directo recuperado
        shell: bash
        working-directory: source-recovery
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          rm -rf dist
          npm run build
          node --check dist/fuente.js
          echo "A08_1_DIRECT_BUILD=PASS"

      - name: Validar manifiesto CI
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/validar-manifiesto-ci.mjs --self-test
          node .github/scripts/validar-manifiesto-ci.mjs
          echo
          echo "A08_1_MANIFEST=PASS"

      - name: Regresión acumulada y contrato A08.1
        shell: bash
        run: |
          set -euo pipefail
          node tests/f3/a02/a02-1-contract.mjs
          node tests/f3/a05/a05-2-ui-contract.mjs
          node tests/f3/a05/a05-3-ui-contract.mjs
          node tests/f3/a06/a06-1-ui-contract.mjs
          node tests/f3/a06/a06-2-ui-contract.mjs
          node tests/f3/a07/a07-1-ui-contract.mjs
          node tests/f3/a07/a07-2-ui-contract.mjs
          node tests/f3/a08/a08-1-ui-contract.mjs
          node tests/pm20/p07-revalidacion-acumulada-contract.mjs

      - name: Persistir runtime materializado
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.js
          if git diff --cached --quiet; then
            echo "A08_1_RUNTIME_ALREADY_CURRENT=1"
            exit 0
          fi
          git commit -m "[skip netlify] A08.1 materialize reparto por productos"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "A08_1_RUNTIME_COMMITTED=1"
