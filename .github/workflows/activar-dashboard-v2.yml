name: Activar dashboard premium v2
on:
  push:
    branches: [la-suite-identidad]
    paths: ['.github/workflows/activar-dashboard-v2.yml']
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: la-suite-identidad
      - name: Enlazar capa v2 y validar
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script defer src="./dashboard-premium-v2.js"></script>'
          if tag not in s:
              marker='<script type="module" src="./fuente.js"></script>'
              if marker not in s:
                  raise SystemExit('No se encontró el marcador fuente.js')
              s=s.replace(marker, marker+'\n'+tag, 1)
              p.write_text(s,encoding='utf-8')
          PY
          node --check dashboard-premium-v2.js
          grep -q 'dashboard-premium-v2.js' index.html
          grep -q 'la-suite-logo.svg' index.html
      - name: Guardar cambio
        run: |
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Activar dashboard premium v2 y logo maestro"
          git push origin HEAD:la-suite-identidad
# activacion 2
