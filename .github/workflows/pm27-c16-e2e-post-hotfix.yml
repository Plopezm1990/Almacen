name: PM27 C16 - E2E post-hotfix cierre

on:
  push:
    branches:
      - claude/pm27-c16-e2e-post-hotfix
    paths:
      - tests/pm27/PM27_C16_E2E_POST_HOTFIX.md
      - tests/pm27/PM27_C16_QA_PREVIEW_AUTORIZADO.md
      - .github/workflows/pm27-c16-e2e-post-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c16-cierre:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trazable
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar SHA exacto y referencias protegidas
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin main release --no-tags
          test "$(git rev-parse origin/main)" = '93a570badba1c5375febfbddc1dffdbcef003dcd'
          test "$(git rev-parse origin/release)" = 'a97740987be57aa9646f6a06e69b2230f140ec5f'

      - name: Verificar baseline y alcance C16
        shell: bash
        run: |
          set -euo pipefail
          BASE='b3d37a4cf2fdc37f66d862948a5894dfbc66b0be'
          git cat-file -e "$BASE^{commit}"
          mapfile -t files < <(git diff --name-only "$BASE"...HEAD)
          printf '%s\n' "${files[@]}"
          for f in "${files[@]}"; do
            case "$f" in
              tests/pm27/PM27_C16_E2E_POST_HOTFIX.md|tests/pm27/PM27_C16_QA_PREVIEW_AUTORIZADO.md|.github/workflows/pm27-c16-e2e-post-hotfix.yml) ;;
              *) echo "Cambio fuera del alcance C16: $f" >&2; exit 1 ;;
            esac
          done

      - name: Confirmar evidencia E2E y cierre honesto
        shell: bash
        run: |
          set -euo pipefail
          doc='tests/pm27/PM27_C16_E2E_POST_HOTFIX.md'
          grep -Fq 'PM27_C16_E2E_REAL=EJECUTADO' "$doc"
          grep -Fq 'PM27_C16_RESULTADO=PASS' "$doc"
          grep -Fq 'PM27_C16_QA_FILA_CREADA=1' "$doc"
          grep -Fq 'PM27_C16_QA_MEMBRESIA_COMPATIBLE=1' "$doc"
          grep -Fq 'PM27_C16_QA_FILA_FINAL=0' "$doc"
          grep -Fq 'PM27_C16_PRODUCCION_ESCRITURAS=0' "$doc"
          grep -Fq 'PM27_C16_PREVIEW_DEPLOY=6aa7141d6347760008c7bd12' "$doc"
          grep -Fq 'PM27_C16_PREVIEW_SHA=43b62653fa56f209664ee2002d7c6114446dae05' "$doc"
          grep -Fq 'PM27_C16_PREVIEW_TREE=617d3a919f97bf710cd4d51c72ae08252e5ff5cb' "$doc"
          grep -Fq 'BLOCKED_EXTERNAL / PENDIENTE_CONFIRMACION' "$doc"
          grep -Fq 'Autorización explícita recibida' tests/pm27/PM27_C16_QA_PREVIEW_AUTORIZADO.md
          echo 'PM27_C16_EVIDENCIA_E2E=PASS'

      - name: Regresion Defecto L cliente
        run: node tests/pm27/defecto-l-context-hotfix.test.mjs

      - name: Arbol limpio
        run: git diff --exit-code && test -z "$(git status --porcelain)"
