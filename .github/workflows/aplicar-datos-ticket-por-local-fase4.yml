name: Aplicar datos ticket por local fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/aplicar-datos-ticket-por-local-fase4.yml'
      - '.github/scripts/aplicar_datos_ticket_por_local_fase4.py'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar configuración TPV por local
        run: python3 .github/scripts/aplicar_datos_ticket_por_local_fase4.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          grep -q 'TPV y ticket' fuente.js
          grep -q 'nombreComercialTicket' fuente.js
          grep -q 'logoTicket' fuente.js
          grep -q 'telefonoTicket' fuente.js
          grep -q 'emailTicket' fuente.js
      - name: Limpiar temporales y guardar
        run: |
          rm -f .github/workflows/aplicar-datos-ticket-por-local-fase4.yml
          rm -f .github/workflows/inspeccionar-locales-ticket-fase4.yml
          rm -f .github/scripts/aplicar_datos_ticket_por_local_fase4.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hacer editable el ticket por local'
          git push origin HEAD:tpv-ventas-fase-4
