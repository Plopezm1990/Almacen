name: Patch UI context index

on:
  push:
    branches:
      - claude/hotfix-bootstrap-ui-context

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hotfix-bootstrap-ui-context
      - name: Insertar puente antes del bootstrap post-reset
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="./edge-auth-patch.js"></script>\n<script src="./owner-bootstrap-post-reset.js"></script>'
          new='<script src="./edge-auth-patch.js"></script>\n<script src="./ui-context-bridge.js"></script>\n<script src="./owner-bootstrap-post-reset.js"></script>'
          if s.count(old) != 1:
              raise SystemExit(f'PATCH_INDEX_FALLO: coincidencias={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Guardar parche exacto
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: cargar puente UI antes del bootstrap post-reset"
          git push origin HEAD:claude/hotfix-bootstrap-ui-context
