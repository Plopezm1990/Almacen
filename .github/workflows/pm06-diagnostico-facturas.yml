name: PM-06 diagnostico facturas

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-diagnostico-facturas.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer funciones PM-06
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(errors='ignore').splitlines()
          pats=['function crearLogicaFacturasDirectas','marcarPagadaFacturaDirecta','addFacturaDirecta','updateFacturaDirecta','function CuentasPorPagar','function Facturas','marcarPagada(','crearLogicaAlbaranes','esFactura','numeroFactura','facturasDirectas.map','proveedorPorId(f2.proveedorId)']
          hits=[]
          for i,line in enumerate(s):
              if any(x in line for x in pats): hits.append(i)
          for n,i in enumerate(hits):
              print(f'--- HIT {n+1} LINE {i+1}: {s[i][:300]}')
              a=max(0,i-12); b=min(len(s),i+45)
              for j in range(a,b): print(f'{j+1}: {s[j][:700]}')
          print('PM06_DIAGNOSTICO_FUNCIONES_OK=1')
          PY
