name: PM-06 diagnostico facturas

on:
  push:
    branches: [pm06-identidad-factura-pago-gasto]
    paths:
      - '.github/workflows/pm06-diagnostico-facturas.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer persistencia PM-06
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(errors='ignore').splitlines()
          needles=['loadKey("facturasDirectas"','saveKey("facturasDirectas"','"facturasDirectas",','loadKey("gastosGenerales"','saveKey("gastosGenerales"','"gastosGenerales",','loadKey("albaranes"','saveKey("albaranes"','"albaranes",','setFacturasDirectas(','setGastosGenerales(','setAlbaranes(']
          hits=[]
          for i,line in enumerate(s):
              if any(x in line for x in needles): hits.append(i)
          seen=set()
          for i in hits:
              if i in seen: continue
              print(f'===== HIT @ {i+1}: {s[i][:500]} =====')
              for j in range(max(0,i-18), min(len(s),i+40)):
                  if j not in seen:
                      print(f'{j+1}: {s[j][:1000]}')
                      seen.add(j)
          print('PM06_PERSISTENCIA_DIAGNOSTICO_OK=1')
          PY
