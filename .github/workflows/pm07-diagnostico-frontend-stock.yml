name: PM-07 diagnóstico frontend stock

on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-diagnostico-frontend-stock.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer funciones completas de venta y traspasos
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8',errors='ignore')
          markers=[
            ('VENTA','function crearLogicaVenta(', 'function crearLogicaClientes('),
            ('TRASPASOS','function crearLogicaTraspasos(', 'function crearLogicaLocales('),
          ]
          for label,start_marker,end_marker in markers:
            a=s.find(start_marker)
            b=s.find(end_marker,a+1)
            if a<0 or b<0 or b<=a:
              raise SystemExit(f'PM07_{label}_NO_LOCALIZADO=1')
            print(f'===== PM07_{label}_INICIO =====')
            print(s[a:b])
            print(f'===== PM07_{label}_FIN =====')
          for marker in ['const stockBajo =','const stockBajoDelLocalActivo =','kardexId && (() => {']:
            i=s.find(marker)
            if i>=0:
              print(f'===== PM07_CTX {marker} =====')
              print(s[max(0,i-800):min(len(s),i+3200)])
          print('PM07_DIAGNOSTICO_FRONTEND_COMPLETO_OK=1')
          PY
