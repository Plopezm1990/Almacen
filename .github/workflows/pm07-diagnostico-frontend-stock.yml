name: PM-07 diagnóstico frontend stock

on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-diagnostico-frontend-stock.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar call sites PM-07
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8',errors='ignore')
          for pat in ['traspasarStock(', 'traspasarEntreLocales(', 'venderCarrito(', 'anularVenta(', 'cantidadConSigno(', 'function esVenta(', 'const stockBajo =', 'const stockBajoDelLocalActivo =']:
            start=0;n=0
            while True:
              i=s.find(pat,start)
              if i<0: break
              n+=1
              print(f'===== {pat} OCC {n} CHAR {i} =====')
              print(s[max(0,i-1800):min(len(s),i+3500)])
              start=i+len(pat)
              if n>=12: break
            print(f'PM07_COUNT {pat}={n}')
          print('PM07_CALLSITES_OK=1')
          PY
