name: Auditar traspasos multi-local funcional
# Reejecución tras corregir la sintaxis de la UI de Traspasos.
on:
  push:
    branches: [la-suite-identidad]
    paths:
      - '.github/workflows/auditar-traspasos-multilocal-funcional.yml'
      - '.github/scripts/auditar-traspasos-multilocal.mjs'
      - 'fuente.js'
  workflow_dispatch:
jobs:
  auditar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Levantar copia local aislada
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/la-suite-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/la-suite-http.log || true
          exit 1
      - name: Probar traspasos entre locales
        env:
          PREVIEW_URL: http://127.0.0.1:4173/
        run: node .github/scripts/auditar-traspasos-multilocal.mjs
      - name: Guardar informe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: auditoria-traspasos-multilocal
          path: |
            traspasos-multilocal-audit.txt
            traspasos-multilocal-audit.png
          if-no-files-found: ignore
