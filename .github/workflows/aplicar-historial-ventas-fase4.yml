name: Aplicar historial ventas fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/aplicar-historial-ventas-fase4.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar historial profesional
        run: python3 .github/scripts/aplicar_historial_ventas_fase4.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
      - name: Guardas semánticas TPV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          req=[
            'const historialVentas =',
            'const ventasFiltradas =',
            'function renderHistorialVentas()',
            'Historial de ventas',
            'Total vigente',
            'Ticket medio',
            'ID interno:',
            'resultado.ventaId || null'
          ]
          for x in req: assert x in s, x
          assert 'm2.fecha === hoy && m2.ventaId && m2.tipo === "salida"' not in s
          print('SEMANTICA_HISTORIAL_VENTAS_OK')
          PY
      - name: Guardar bloque y limpiar temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/aplicar_historial_ventas_fase4.py
          rm -f .github/workflows/aplicar-historial-ventas-fase4.yml
          rm -f .github/workflows/inspeccionar-tpv-ventas-fase4.yml
          git add -A
          git diff --cached --check
          git commit -m 'Crear historial profesional de ventas'
          git push origin HEAD:tpv-ventas-fase-4
