name: Inspeccionar Albaranes y Facturas fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-albaranes-facturas-fase3.yml
  workflow_dispatch:

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer dependencias multilocal
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def mostrar(nombre, marcador, antes=600, despues=7000):
              posiciones=[]; i=0
              while True:
                  j=s.find(marcador,i)
                  if j<0: break
                  posiciones.append(j); i=j+1
              print('\n=====',nombre,'POS',posiciones,'=====')
              for j in posiciones[:3]:
                  print('\n---',j,'---')
                  print(s[max(0,j-antes):min(len(s),j+despues)])
          mostrar('DERIVADOS INFORMES','const albaranesInforme =',500,3000)
          mostrar('FACTURAS DIRECTAS LOGICA','function crearLogicaFacturasDirectas(',400,9000)
          mostrar('ALBARANES COMPONENTE','function Albaranes(',300,9000)
          mostrar('FACTURAS COMPONENTE','function Facturas(',300,9000)
          mostrar('CUENTAS POR PAGAR','function CuentasPorPagar(',300,8000)
          mostrar('FACTURAS POR PAGAR','const facturasPorPagar =',500,5000)
          mostrar('RENDER ALBARANES','tab === "albaranes"',500,4500)
          mostrar('RENDER FACTURAS','tab === "facturas"',500,4500)
          mostrar('RENDER PAGOS','tab === "pagos"',500,4000)
          mostrar('IR A ALBARAN','irAAlbaran:',500,2500)
          PY