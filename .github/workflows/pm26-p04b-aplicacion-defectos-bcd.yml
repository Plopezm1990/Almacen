name: PM26 P04b aplicacion de las correcciones B C D

# Aplica exactamente la propuesta minima gateada como diagnostico en
# PM26 P04a: elimina los 10 archivos JS huerfanos (defecto B) y
# regenera el ledger de seguridad; retira la regla residual de
# _headers (defecto C); separa reset-pruebas-preview.js en un loader
# universal (pm11-compra-mobile-loader.js) y el resto exclusivo de
# Deploy Preview (defecto D). No reabre PM05-PM09, no toca fuente.js,
# main, Netlify, Supabase, QA, produccion ni TPV.

on:
  push:
    branches: [claude/pm26-preparacion-tecnica]
    paths:
      - '_headers'
      - 'index.html'
      - 'reset-pruebas-preview.js'
      - 'pm11-compra-mobile-loader.js'
      - 'tools/seguridad/linea-base-aceptada.json'
      - 'tests/pm11-compra/p10-regresion-integral-contract.mjs'
      - 'tests/pm26/P04B_APLICACION_DEFECTOS_B_C_D.md'
      - 'tests/pm26/p04b-contract.mjs'
      - '.github/workflows/pm26-p04b-aplicacion-defectos-bcd.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger lo que P04b no debe tocar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          # Comparado contra el cierre previo de la rama (PM26 P04a,
          # 2ac878c), no contra origin/main.
          intocables='edge-auth-patch.js
          fuente.js
          source-recovery/recuperar_candidato.py
          source-recovery/fuente-recuperado.js'
          cambiados="$(git diff --name-only 2ac878c96275a26e72ee2af061b2f3953e10a90f..HEAD)"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            if echo "$cambiados" | grep -qxF "$archivo"; then
              echo "PM26 P04b no debe tocar: $archivo" >&2
              exit 1
            fi
          done <<< "$intocables"
          echo 'PM26_P04B_INTOCABLES_INTACTOS=PASS'
      - name: Contrato PM26 P04b (aplicacion real + tests vivos + gate de secretos + sin identificadores QA)
        run: node tests/pm26/p04b-contract.mjs

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM26 P04b -- correcciones B, C y D aplicadas
        run: |
          set -euo pipefail
          node tests/pm26/p04b-contract.mjs
          echo 'PM26_P04B_GATE_APLICACION=PASS'
