name: Smoke final PR4 corregido
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/smoke-pr4-final.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar código corregido
        run: |
          node --check fuente.js
          node --check edge-auth-patch.js
          grep -q 'modoLocalNoReclamado' edge-auth-patch.js
          grep -q 'localActivoFinal !== (lai || null)' fuente.js
      - name: Preparar navegador aislado
        run: |
          python3 -m http.server 4217 --bind 127.0.0.1 >/tmp/pr4-http.log 2>&1 &
          mkdir -p /tmp/pr4-final && cd /tmp/pr4-final
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Ejecutar smoke final
        run: |
          cd /tmp/pr4-final
          cat > final.cjs <<'NODE'
          const { chromium } = require('playwright');
          const URL='http://127.0.0.1:4217/';
          const SUPA='https://flqercbgpgmmfaakrwkc.supabase.co/**';

          const multi={
            locales:[{id:'n',nombre:'Local Norte',activo:true},{id:'s',nombre:'Local Sur',activo:true}],
            localActivoId:'n',
            productos:[
              {id:'pn',nombre:'Norte',tipo:'materiaPrima',unidad:'ud',stock:10,stockMinimo:1,costo:1,precioVenta:3,ivaPct:10,localId:'n',activo:true},
              {id:'ps',nombre:'Sur',tipo:'materiaPrima',unidad:'ud',stock:8,stockMinimo:1,costo:5,precioVenta:9,ivaPct:10,localId:'s',activo:true}
            ],
            movimientos:[
              {id:'mn',productoId:'pn',localId:'n',cantidad:-2,tipo:'VENTA',motivo:'Venta',fecha:'2026-09-01',costoUnitario:1,precioUnitario:3,ivaPct:10},
              {id:'ms',productoId:'ps',localId:'s',cantidad:-1,tipo:'VENTA',motivo:'Venta',fecha:'2026-09-01',costoUnitario:5,precioUnitario:9,ivaPct:10}
            ],
            gastosGenerales:[{id:'gn',concepto:'GN',importe:2,fecha:'2026-09-01',localId:'n'},{id:'gs',concepto:'GS',importe:4,fecha:'2026-09-01',localId:'s'}],
            albaranes:[],pedidos:[],encargos:[],facturasDirectas:[],empleados:[]
          };
          const reparar={
            locales:[{id:'d1',nombre:'Chocoloyos S.L',activo:true},{id:'d2',nombre:'Chocoloyos S.L',activo:true}],
            localActivoId:'d1',
            productos:[{id:'p',nombre:'Histórico',tipo:'materiaPrima',unidad:'ud',stock:5,stockMinimo:1,costo:2,precioVenta:4,ivaPct:10,localId:'hist',activo:true}],
            movimientos:[],gastosGenerales:[],albaranes:[],pedidos:[],encargos:[],facturasDirectas:[],empleados:[]
          };

          async function contexto(browser,datos,cache=null){
            const ctx=await browser.newContext({serviceWorkers:'block'}); const page=await ctx.newPage(); const errores=[];
            await page.addInitScript(({datos,cache})=>{
              localStorage.clear();
              for(const [k,v] of Object.entries(datos)) localStorage.setItem('almacen:'+k,JSON.stringify(v));
              localStorage.setItem('almacen__pendientes','[]');
              if(cache) localStorage.setItem('chocoloyos_contexto_operativo_seguro_v1',JSON.stringify(cache));
            },{datos,cache});
            page.on('pageerror',e=>errores.push(e.message));
            await page.route(SUPA,r=>r.abort());
            await page.goto(URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            return {ctx,page,errores};
          }
          async function entrarLocal(page){
            const b=page.getByText('Trabajar solo en este equipo, sin sincronizar',{exact:false});
            if(!(await b.count())) throw new Error('No aparece entrada local');
            await b.first().click(); await page.waitForTimeout(2200);
          }
          async function selLocal(page){
            const ss=page.locator('select');
            for(let i=0;i<await ss.count();i++){
              const s=ss.nth(i),ops=await s.locator('option').allTextContents();
              if(ops.some(x=>x.includes('Todos los locales'))) return s;
            }
            return null;
          }

          async function testMulti(browser){
            const {ctx,page,errores}=await contexto(browser,multi); await entrarLocal(page);
            if(errores.length) throw new Error('MULTI JS '+errores.join('|'));
            let s=await selLocal(page); if(!s) throw new Error('MULTI sin selector');
            const ops=await s.locator('option').allTextContents();
            for(const x of ['Todos los locales','Local Norte','Local Sur']) if(!ops.some(o=>o.includes(x))) throw new Error('MULTI falta '+x);
            await s.selectOption('n'); await page.waitForTimeout(200);
            if(!(await page.locator('body').innerText()).includes('Mostrando solo Local Norte.')) throw new Error('MULTI filtro no aplicado');
            for(const d of ['Resultados','Libro de IVA']){
              const l=page.getByText(d,{exact:true}); if(!(await l.count())) throw new Error('MULTI falta '+d);
              await l.first().click(); await page.waitForTimeout(300); s=await selLocal(page);
              if(!s||await s.inputValue()!=='n') throw new Error('MULTI filtro no persiste '+d);
            }
            const p=await page.evaluate(()=>JSON.parse(localStorage.getItem('almacen__pendientes')||'[]'));
            const falsos=p.filter(k=>['locales','localActivoId'].includes(k));
            if(falsos.length) throw new Error('MULTI guardados locales falsos '+falsos.join(','));
            console.log('MULTILOCAL_INFORMES_OK=1 PENDIENTES='+JSON.stringify(p)); await ctx.close();
          }

          async function testReparar(browser){
            const {ctx,page}=await contexto(browser,reparar); await entrarLocal(page);
            const e=await page.evaluate(()=>({l:JSON.parse(localStorage.getItem('almacen:locales')||'[]'),a:JSON.parse(localStorage.getItem('almacen:localActivoId')||'null'),p:JSON.parse(localStorage.getItem('almacen:productos')||'[]'),q:JSON.parse(localStorage.getItem('almacen__pendientes')||'[]')}));
            const canon=e.l.find(x=>x.id==='hist'), fusion=e.l.filter(x=>x.fusionadoEn==='hist');
            if(!canon||canon.activo===false||fusion.length!==2||fusion.some(x=>x.activo!==false)) throw new Error('REPARAR fusión incorrecta');
            if(e.a!=='hist'||e.p[0]?.localId!=='hist') throw new Error('REPARAR no preserva histórico');
            if(!e.q.includes('locales')||!e.q.includes('localActivoId')) throw new Error('REPARAR no guarda cambios reales');
            console.log('REPARACION_HISTORICA_OK=1'); await ctx.close();
          }

          async function testSinSesion(browser){
            const cache={userId:'u-ant',contexto:{rol:'Propietario'},verificadoEn:Date.now()};
            const {ctx,page}=await contexto(browser,{productos:[{id:'secreto',nombre:'Previo',stock:1}]},cache); await entrarLocal(page);
            const r=await page.evaluate(async()=>{const a=localStorage.getItem('almacen:productos');const l=await window.storage.get('productos');await window.storage.set('productos','[]');await window.storage.delete('productos');return{a,l,d:localStorage.getItem('almacen:productos')}});
            if(r.l.value!==''||r.a!==r.d) throw new Error('CIERRE sin sesión permite saltar aislamiento');
            console.log('CIERRE_SIN_SESION_OK=1'); await ctx.close();
          }

          async function testEmpleadoOffline(browser){
            const cache={userId:'u-caja',contexto:{rol:'Cajero/a',empleadosFichaje:[],proveedores:[],fichasProduccion:[],cobrosEncargos:[]},verificadoEn:Date.now()};
            const {ctx,page}=await contexto(browser,{productos:[{id:'comun',nombre:'Común',stock:1}],clientes:[{id:'privado',nombre:'Privado'}]},cache);
            await page.evaluate(()=>{window.getSupabaseClient=async()=>({auth:{getSession:async()=>({data:{session:{user:{id:'u-caja'}}}})}})});
            await entrarLocal(page);
            const r=await page.evaluate(async()=>({productos:await window.storage.get('productos'),clientes:await window.storage.get('clientes')}));
            if(!r.productos.value.includes('comun')) throw new Error('OFFLINE empleado perdió datos comunes');
            if(r.clientes.value!=='') throw new Error('OFFLINE Cajero pudo leer clientes privados');
            console.log('EMPLEADO_OFFLINE_ROL_OK=1'); await ctx.close();
          }

          (async()=>{const b=await chromium.launch({headless:true});await testMulti(b);await testReparar(b);await testSinSesion(b);await testEmpleadoOffline(b);await b.close();console.log('SMOKE_FINAL_PR4_OK=1')})().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node final.cjs