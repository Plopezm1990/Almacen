name: Inspeccionar TPV por local fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-tpv-local-fase4.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Localizar etiqueta navegacion TPV
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          patterns=[r'id:\s*"venta"',r'key:\s*"venta"',r'"venta"\s*,',r'venta.{0,120}icon',r'icon.{0,120}venta',r'Venta\\x',r'venta\\x']
          for pat in patterns:
              print('\n=== PATTERN',pat,'===')
              hits=list(re.finditer(pat,s,re.I))
              print('COUNT',len(hits))
              for m in hits[:20]:
                  i=m.start()
                  print(s[max(0,i-700):i+1200])
                  print('\n---')
          PY