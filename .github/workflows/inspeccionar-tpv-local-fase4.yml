name: Aplicar TPV por local fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-tpv-local-fase4.yml
      - .github/scripts/aplicar_tpv_por_local_fase4.py
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar cambio
        run: python3 .github/scripts/aplicar_tpv_por_local_fase4.py
      - name: Validar
        run: |
          node --check fuente.js
          git diff --check
          test "$(grep -o 'label: \"TPV\"' fuente.js | wc -l)" -eq 1
          test "$(grep -o 'Selecciona un local concreto para abrir el TPV' fuente.js | wc -l)" -eq 1
      - name: Limpiar y guardar
        run: |
          git rm -f .github/workflows/inspeccionar-tpv-local-fase4.yml .github/scripts/aplicar_tpv_por_local_fase4.py
          node --check fuente.js
          git diff --check
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add fuente.js
          git commit -m "Exigir local concreto para usar el TPV"
          git push origin HEAD:tpv-ventas-fase-4