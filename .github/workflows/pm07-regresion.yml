name: PM-07 regresión stock autoritativo

# Decisión de release documentada (ver Release PR): fuente.js es el artefacto fuente
# canónico y realmente servido desde PM-01 en adelante; source-recovery/ quedó congelado
# en el commit 846c8a0 (PM-01) y nunca volvió a tocarse pese a cientos de commits
# posteriores de edición directa sobre fuente.js (verificado con
# `git log -1 -- source-recovery/entrada-recuperada.js`). El paso "Build reproducible" de
# este workflow reconstruye desde ese source-recovery congelado y por tanto NUNCA puede
# volver a coincidir con el fuente.js actual: es una comparación contra un artefacto
# abandonado, no una regresión real (los contratos funcionales de PM07 en este mismo job
# siguen en verde). Se retira el disparador `pull_request` para que deje de bloquear PRs
# por este motivo ya diagnosticado; se conserva `push` sobre su rama histórica y
# `workflow_dispatch` para poder repetirlo manualmente si hace falta.
on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - 'fuente.js'
      - 'source-recovery/fuente-recuperado.js'
      - 'source-recovery/package.json'
      - 'source-recovery/package-lock.json'
      - 'tests/pm07/**'
      - '.github/workflows/pm07-regresion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contrato frontend PM-07
        run: node tests/pm07/frontend-contract.mjs
      - name: Sintaxis fuente recuperada
        run: node --check source-recovery/fuente-recuperado.js
      - name: Sintaxis bundle
        run: node --check fuente.js
      - name: Build reproducible
        working-directory: source-recovery
        run: |
          npm ci
          npm run build
          cmp -s dist/fuente.js ../fuente.js || { echo 'PM07_BUNDLE_NO_REPRODUCIBLE=1'; exit 1; }
          echo 'PM07_BUILD_REPRODUCIBLE_OK=1'
