name: Activar dashboard premium
on:
  push:
    paths:
      - '.github/workflows/activar-dashboard-premium.yml'
permissions:
  contents: write
jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activar panel y validar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./dashboard-premium-patch.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>')
          p.write_text(s)
          PY
          test -f dashboard-premium-patch.js
          grep -q 'dashboard-premium-patch.js' index.html
          node --check dashboard-premium-patch.js
          rm .github/workflows/activar-dashboard-premium.yml .github/workflows/inspeccionar-panel-la-suite.yml
          git config user.name 'Plopezm1990'
          git config user.email 'pedroroger1990@gmail.com'
          git add index.html dashboard-premium-patch.js .github/workflows
          git commit -m 'Aplicar panel general premium móvil y escritorio'
          git push
