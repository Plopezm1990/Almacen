name: Inspeccionar bundle build
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/inspeccionar-bundle-build.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar sección fuente.jsx
        shell: bash
        run: |
          MARCA=$(grep -n -m1 '^// fuente.jsx$' fuente.js | cut -d: -f1)
          echo "MARCA=$MARCA"
          TOTAL=$(wc -l < fuente.js)
          echo "TOTAL=$TOTAL"
          echo "LINEAS_APP=$((TOTAL-MARCA+1))"
          echo '=== INICIO APP (120 líneas) ==='
          sed -n "${MARCA},$((MARCA+119))p" fuente.js
          echo '=== PATRONES JSX/REACT EN APP ==='
          tail -n +"$MARCA" fuente.js | grep -n -m 30 'jsxDEV\|jsx(\|jsxs(\|createElement\|React.createElement' || true
          echo '=== IMPORTS/REQUIRE EN APP ==='
          tail -n +"$MARCA" fuente.js | grep -n -m 40 '^import \|require_' || true
          echo '=== FUNCIONES PRINCIPALES ==='
          tail -n +"$MARCA" fuente.js | grep -n -m 40 '^function \|^var [A-Za-z_].* = (' || true
          echo '=== BYTES APP ==='
          tail -n +"$MARCA" fuente.js | wc -c
          echo '=== SINTAXIS BUNDLE ==='
          node --check fuente.js
