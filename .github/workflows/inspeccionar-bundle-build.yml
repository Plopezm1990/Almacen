name: Inspeccionar bundle build
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/inspeccionar-bundle-build.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspeccion-build-reproducible
      - name: Generar fuente recuperado
        shell: python
        run: |
          from pathlib import Path
          import json
          lines=Path('fuente.js').read_text(encoding='utf-8').splitlines()
          marca=next(i for i,l in enumerate(lines) if l.strip()=='// fuente.jsx')
          app=lines[marca:]
          if app[1].strip()!='var import_react4 = __toESM(require_react());':
            raise SystemExit('Bootstrap React inesperado')
          if app[2].strip()!='var import_client = __toESM(require_client());':
            raise SystemExit('Bootstrap ReactDOM inesperado')
          iconos='''ArrowLeftRight Bell Boxes Calculator CalendarClock CalendarDays CalendarRange Camera ChartColumn ChartLine ChevronRight CircleArrowDown CircleArrowUp CircleCheck ClipboardList Clock Cog Coins Download Droplet Ellipsis Eye EyeOff Factory FileText Files LoaderCircle LogIn LogOut Mail MessageCircle Minus Package Pencil Phone Plus Receipt RotateCcwClock ScanBarcode Search ShieldCheck ShoppingBag ShoppingCart Stethoscope Tags Trash2 TrendingUp TriangleAlert Truck Upload UserRound Users Wallet X'''.split()
          cabecera=[
            '// FUENTE RECUPERADO DESDE EL BUNDLE DE PROYECTO A.',
            '// No es el JSX original: es la sección de aplicación conservada por esbuild,',
            '// con JSX ya transformado a React.createElement y dependencias restauradas.',
            'import React, * as ReactNS from "react";',
            'import { createRoot } from "react-dom/client";',
            'import { createClient } from "@supabase/supabase-js";',
            'import { jsPDF as E } from "jspdf";',
            'import autoTable from "jspdf-autotable";',
            'import * as XLSX from "xlsx";',
            'import { '+', '.join(iconos)+', Map as Map2 } from "lucide-react";',
            'const import_react4 = Object.assign({ default: React }, ReactNS);',
            'const import_client = { createRoot };',
            'const utils = XLSX.utils;',
            'const writeFileSync = XLSX.writeFile || XLSX.writeFileSync;',
          ]
          base=Path('source-recovery')
          base.mkdir(exist_ok=True)
          (base/'fuente-recuperado.js').write_text('\n'.join(cabecera+app[3:])+'\n',encoding='utf-8')
          package={
            'name':'chocoloyos-almacen-source-recovery',
            'private':True,
            'version':'0.0.0-recovered',
            'type':'module',
            'scripts':{
              'build':'esbuild fuente-recuperado.js --bundle --platform=browser --format=esm --target=es2020 --outfile=dist/fuente.js',
              'check':'node --check fuente-recuperado.js'
            }
          }
          (base/'package.json').write_text(json.dumps(package,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (base/'.gitignore').write_text('node_modules/\ndist/\n',encoding='utf-8')
          readme='''# Fuente recuperado — Proyecto A\n\nEste directorio preserva una base **recompilable** de la aplicación extraída del `fuente.js` preparado.\n\n## Qué es\n\n- La sección marcada por esbuild como `// fuente.jsx`, separada de las dependencias empaquetadas.\n- Conserva nombres de funciones, comentarios y lógica de negocio.\n- El JSX original no puede recuperarse exactamente porque no existe source map; quedó transformado a `React.createElement`.\n- Los nombres temporales creados por el compilador (`p2`, `s2`, etc.) tampoco se pueden reconstruir con certeza al nombre original.\n\n## Qué se comprobó\n\n- 0 identificadores externos sin resolver tras restaurar imports.\n- Compilación correcta con esbuild para navegador.\n- `node --check` correcto en el bundle generado.\n- Se conservan marcadores esenciales como `GestionAlmacen`, `crearLogicaCaja` y `SelectorLocalInformes`.\n\n## Uso\n\n```bash\nnpm ci\nnpm run build\n```\n\nEl resultado se genera en `dist/fuente.js`.\n\n## Importante\n\nEsto es una **base de recuperación y mantenimiento**, no se debe sustituir todavía el `fuente.js` de producción. Antes hace falta una comparación funcional y una prueba integral de la aplicación.\n'''
          (base/'README.md').write_text(readme,encoding='utf-8')
          print('MARCA_ORIGEN=',marca+1)
          print('LINEAS_RECUPERADAS=',len(cabecera)+len(app)-3)
          print('BYTES_RECUPERADOS=',(base/'fuente-recuperado.js').stat().st_size)
      - name: Fijar dependencias exactas
        shell: bash
        run: |
          cd source-recovery
          npm install --no-audit --no-fund --save-exact \
            react@18.3.1 react-dom@18.3.1 \
            @supabase/supabase-js@2.112.4 \
            lucide-react jspdf jspdf-autotable xlsx
          npm install --no-audit --no-fund --save-dev --save-exact esbuild
          npm list --depth=0
      - name: Validar recuperación
        shell: bash
        run: |
          cd source-recovery
          npm run check
          npm run build
          node --check dist/fuente.js
          grep -q 'function GestionAlmacen' dist/fuente.js
          grep -q 'function crearLogicaCaja' dist/fuente.js
          grep -q 'SelectorLocalInformes' dist/fuente.js
          echo "BUILD_BYTES=$(wc -c < dist/fuente.js)"
          echo 'SOURCE_RECOVERY_OK=1'
      - name: Guardar recuperación en rama
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-recovery
          git diff --cached --quiet && exit 0
          git commit -m "Guardar fuente recuperado recompilable [skip ci]"
          git push origin HEAD:inspeccion-build-reproducible
