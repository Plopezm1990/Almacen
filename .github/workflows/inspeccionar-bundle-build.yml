name: Inspeccionar bundle build
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/inspeccionar-bundle-build.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer sección de aplicación
        shell: bash
        run: |
          MARCA=$(grep -n -m1 '^// fuente.jsx$' fuente.js | cut -d: -f1)
          tail -n +"$MARCA" fuente.js > /tmp/fuente-recuperada.js
          echo "Lineas: $(wc -l < /tmp/fuente-recuperada.js)"
          echo "Bytes: $(wc -c < /tmp/fuente-recuperada.js)"
      - name: Detectar identificadores externos
        shell: bash
        run: |
          npx --yes eslint@8.57.1 /tmp/fuente-recuperada.js \
            --no-eslintrc \
            --env browser,es2022 \
            --parser-options '{"ecmaVersion":"latest","sourceType":"module"}' \
            --rule 'no-undef:error' \
            -f json > /tmp/eslint.json || true
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/eslint.json','utf8') || '[]');
          const nombres = new Set();
          for (const file of data) for (const m of file.messages || []) {
            if (m.ruleId !== 'no-undef') continue;
            const x = /^'(.+)' is not defined\.$/.exec(m.message);
            if (x) nombres.add(x[1]);
          }
          console.log('=== IDENTIFICADORES EXTERNOS ===');
          console.log([...nombres].sort().join('\n'));
          console.log('TOTAL_EXTERNOS=' + nombres.size);
          NODE
      - name: Sintaxis original
        run: node --check fuente.js
