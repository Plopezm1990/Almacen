name: Inspeccionar bundle build
on:
  push:
    branches: [inspeccion-build-reproducible]
    paths:
      - .github/workflows/inspeccionar-bundle-build.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar alias E y versiones
        shell: python
        run: |
          from pathlib import Path
          import re
          lines=Path('fuente.js').read_text(encoding='utf-8').splitlines()
          marca=next(i for i,l in enumerate(lines) if l.strip()=='// fuente.jsx')
          app=lines[marca:]
          print('=== USOS DE new E ===')
          for i,l in enumerate(app):
            if re.search(r'\bnew E\s*\(',l):
              print(f'{marca+i+1}: {l[:600]}')
          print('=== USOS XLSX ===')
          for nombre in ('utils.','writeFileSync('):
            print('--- '+nombre+' ---')
            c=0
            for i,l in enumerate(app):
              if nombre in l:
                print(f'{marca+i+1}: {l[:600]}'); c+=1
                if c>=12: break
          print('=== VERSIONES / FIRMAS ===')
          patrones=[
            r'18\.\d+\.\d+', r'19\.\d+\.\d+', r'@supabase/supabase-js',
            r'jspdf', r'jsPDF', r'AutoTable', r'0\.18\.\d+', r'XLSX',
            r'lucide-react', r'Version', r'version\s*[:=]'
          ]
          vistos=0
          for i,l in enumerate(lines):
            if any(re.search(p,l,re.I) for p in patrones):
              t=l.strip()
              if len(t)>400: t=t[:400]+' ...[cortado]'
              print(f'{i+1}: {t}')
              vistos+=1
              if vistos>=100: break
      - name: Validar bundle
        run: node --check fuente.js
