name: "ABC F4 B12 -- matriz de ensayos de pagos"

on:
  pull_request:
    branches: [release]
    paths:
      - "docs/plan-abc/F4_B07_CONTRATO_TECNICO_2026-09-30.md"
      - "docs/plan-abc/F4_B08_CONTRATO_TECNICO_2026-09-30.md"
      - "docs/plan-abc/F4_B12_CONTRATO_ENSAYO_PAGOS_2026-10-01.md"
      - "docs/plan-abc/F4_B12_EVIDENCIA_SIMULADOR_2026-10-01.md"
      - "tests/f4/b12/**"
      - ".github/workflows/abc-f4-b12-payment-trials.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  f4-b12-payment-trials:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validar matriz B12.1
        run: node tests/f4/b12/b12-payment-trial-matrix-contract.mjs
