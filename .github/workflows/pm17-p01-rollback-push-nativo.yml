name: PM17 P01 rollback nativo de suscripción push

on:
  push:
    branches: [claude/pm17-seguridad-notificaciones]
    paths:
      - 'fuente.js'
      - 'tests/pm17/**'
      - '.github/workflows/pm17-p01-rollback-push-nativo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar-p01:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger main y alcance P01 (sin cambios en supabase/)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "5db0b9ed03c8f8ecd700ff339edce1dff14ffde4"
          unexpected="$(git diff --name-only origin/main..HEAD -- supabase/ || true)"
          if [ -n "$unexpected" ]; then
            echo 'PM17 P01 es un cambio de frontend puro: no debe tocar supabase/' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo 'PM17_P01_MAIN_FROZEN=PASS'
          echo 'PM17_P01_SIN_CAMBIOS_SUPABASE=PASS'
      - name: Sintaxis bundle
        run: node --check fuente.js
      - name: Contrato PM17 P01 (rollback push nativo)
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm17/p01-rollback-push-nativo-contract.mjs
          node tests/pm17/p01-wiring-notificaciones-contract.mjs
      - name: Regresión completa (todas las suites vigentes)
        shell: bash
        run: |
          set -euo pipefail
          for d in tests/g1 tests/pm04 tests/pm05 tests/pm07 tests/pm08 tests/pm09 tests/pm10 tests/pm11-compra tests/pm12 tests/pm13 tests/pm14 tests/pm15 tests/pm16; do
            for t in "$d"/*.mjs; do
              [ -f "$t" ] || continue
              node "$t"
            done
          done
          echo 'PM17_P01_REGRESION_COMPLETA=PASS'
      - name: Sin secretos
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm17/p01-rollback-push-nativo-contract.mjs \
            tests/pm17/p01-wiring-notificaciones-contract.mjs \
            tests/pm17/P01_CIERRE_ROLLBACK_PUSH_NATIVO.md
          echo 'PM17_P01_NO_SECRET=PASS'

  gate-final:
    needs: validar-p01
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM17 P01
        run: |
          set -euo pipefail
          node tests/pm17/p01-rollback-push-nativo-contract.mjs
          node tests/pm17/p01-wiring-notificaciones-contract.mjs
          echo 'PM17_P01_GATE_FINAL=PASS'
