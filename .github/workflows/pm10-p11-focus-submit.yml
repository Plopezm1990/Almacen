name: PM10 P11 focus submits
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p11-focus-submit.yml'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraer submits exactos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          out=[]
          for label,func,nextfunc in [
            ('PRODUCTOS','function Productos(', 'function Proveedores('),
            ('PEDIDOS','function Pedidos(', 'function Recepcion('),
            ('RECEPCION','function Recepcion(', 'function textoHojaConteo('),
            ('PERSONAL','function Personal(', 'function Turnos('),
            ('ENCARGOS','function Encargos(', 'function Clientes('),
          ]:
            a=s.find(func); b=s.find(nextfunc,a+len(func))
            if a<0: continue
            if b<0: b=min(len(s),a+80000)
            block=s[a:b]
            out.append(f'===== {label} HEAD =====\n'+block[:3500])
            # extract submit-like functions
            import re
            for m in re.finditer(r'(?:async\s+)?function\s+(submit|guardarProductoNuevo|darEntrada)\s*\([^)]*\)\s*\{',block):
              start=m.start(); depth=0; end=None
              brace=block.find('{',start)
              for i in range(brace,len(block)):
                if block[i]=='{': depth+=1
                elif block[i]=='}':
                  depth-=1
                  if depth==0:
                    end=i+1; break
              if end: out.append(f'===== {label} {m.group(1)} =====\n'+block[start:end])
            # last 4500 chars often contains save buttons
            out.append(f'===== {label} TAIL =====\n'+block[-5000:])
          Path('tests/pm10/P11_SUBMITS.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm10/P11_SUBMITS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PM10: guardar submits robustez punto 11'
          git push
