name: PM09 LA-008 corregir rotacion y margen
on:
  push:
    branches: [pm09-conciliacion-ventas-analitica]
    paths:
      - '.github/workflows/pm09-la008-corregir.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm09-conciliacion-ventas-analitica
      - name: Aplicar cambio LA-008
        shell: bash
        run: |
          set -euo pipefail
          python tools/corregir_pm09_la008.py
          node --check fuente.js
      - name: Validar contratos PM09
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm09/la008-rotation-margin-contract.mjs
          node tests/pm09/la007-results-contract.mjs
      - name: Regresiones heredadas
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm05/frontend-contract.mjs
          node tests/pm07/frontend-contract.mjs
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm08/replay-scope-contract.mjs
      - name: Generar evidencia LA-008
        shell: bash
        run: |
          set -euo pipefail
          SHA256=$(sha256sum fuente.js | awk '{print $1}')
          cat > tests/pm09/LA008_ROTACION_MARGEN_EVIDENCIA.json <<EOF
          {
            "hallazgo": "LA-008",
            "estado": "CORREGIDO_PENDIENTE_DE_QA_FINAL_PM09",
            "rama": "pm09-conciliacion-ventas-analitica",
            "baseEntradaWorkflow": "${GITHUB_SHA}",
            "fuenteSha256": "${SHA256}",
            "reproduccionQAPM09": {
              "escenario": "venta A 2 anulada completa + venta B 2 con devolucion cliente 1",
              "legacy_unidades": 4,
              "legacy_ingresos": 21.82,
              "legacy_costes": 12,
              "legacy_rotacion_salidas": 4,
              "esperado_unidades_netas": 1,
              "esperado_ingresos": 5.45,
              "esperado_costes": 3,
              "esperado_beneficio": 2.45,
              "esperado_margen_pct": 45,
              "esperado_rotacion_unidades": 1
            },
            "causa": "margenPorProducto solo agregaba VENTA y rotacionPorProducto solo salidas negativas; REVERSO y DEVOLUCION_CLIENTE quedaban fuera. Ademas el margen porcentual dependia del precio/coste actual del producto.",
            "cambio": "Unificar ventas y correcciones con signo; recuperar coste historico desde el movimiento original cuando la devolucion no lo copia; agrupar la rotacion por familia de venta y aplicar el mismo signo al ABC.",
            "alcance": "fuente.js en rama PM09; sin cambios de esquema ni produccion"
          }
          EOF
      - name: Guardar candidato solo en PM09
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add fuente.js tests/pm09/LA008_ROTACION_MARGEN_EVIDENCIA.json
          git diff --cached --quiet && exit 0
          git commit -m "PM09: conciliar unidades rotacion y margen (LA-008)"
          git push origin HEAD:pm09-conciliacion-ventas-analitica
