name: Auditar claves storage PR4
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/auditar-claves-storage-pr4.yml
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comparar claves del bundle con barrera de roles
        shell: python
        run: |
          import re, subprocess, pathlib, json
          subprocess.run(['git','fetch','origin','preparacion-sin-netlify'], check=True)
          fuente=subprocess.check_output(['git','show','origin/preparacion-sin-netlify:fuente.js'], text=True)
          edge=subprocess.check_output(['git','show','origin/preparacion-sin-netlify:edge-auth-patch.js'], text=True)
          cargas=sorted(set(re.findall(r'loadKey\(\s*["\']([^"\']+)["\']', fuente)))
          guardados=sorted(set(re.findall(r'saveKey\(\s*["\']([^"\']+)["\']', fuente)))
          listas=[]
          for nombre in ['CLAVES_COMUNES','CLAVES_ENCARGADO','CLAVES_CAJERO','CLAVES_CHURRERO','CLAVES_SOLO_PROPIETARIO']:
              m=re.search(r'var\s+'+nombre+r'\s*=\s*\[(.*?)\];', edge, re.S)
              vals=re.findall(r'["\']([^"\']+)["\']', m.group(1)) if m else []
              listas.extend(vals)
              print(nombre+'='+json.dumps(vals,ensure_ascii=False))
          controladas=sorted(set(listas))
          usadas=sorted(set(cargas)|set(guardados))
          faltan=sorted(set(usadas)-set(controladas))
          print('LOAD_KEYS='+json.dumps(cargas,ensure_ascii=False))
          print('SAVE_KEYS='+json.dumps(guardados,ensure_ascii=False))
          print('CONTROLADAS='+json.dumps(controladas,ensure_ascii=False))
          print('USADAS_NO_CONTROLADAS='+json.dumps(faltan,ensure_ascii=False))
          print('TOTAL_LOAD='+str(len(cargas)))
          print('TOTAL_SAVE_LITERAL='+str(len(guardados)))
          print('TOTAL_CONTROLADAS='+str(len(controladas)))
          print('AUDITORIA_CLAVES_STORAGE_OK=1')
