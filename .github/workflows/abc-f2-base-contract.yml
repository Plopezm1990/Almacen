name: "ABC F2.1 -- contrato base transaccional"

on:
  push:
    branches: [codex/f2-base-transaccional]
    paths:
      - "docs/plan-abc/F2_1_BASE_TRANSACCIONAL_CONTRATO_2026-10-01.md"
      - "docs/plan-abc/F2_2_INVENTARIO_DEPENDENCIAS_RELEASE_2026-10-01.md"
      - "docs/plan-abc/F2_3_VERIFICACION_LOCAL_POSTGRES_2026-10-01.md"
      - "docs/plan-abc/F2_3_EVIDENCIA_PGLITE_FALLBACK_2026-10-01.md"
      - "docs/plan-abc/F2_4_PRECHECK_MIGRACION_CANDIDATA_2026-10-01.md"
      - "tests/f2/f2-base-contract.mjs"
      - "tests/f2/f2-local-verification-contract.mjs"
      - "tests/f2/f2-local-evidence-contract.mjs"
      - "tests/f2/f2-migration-precheck-contract.mjs"
      - ".github/workflows/abc-f2-base-contract.yml"
  pull_request:
    paths:
      - "docs/plan-abc/F2_1_BASE_TRANSACCIONAL_CONTRATO_2026-10-01.md"
      - "docs/plan-abc/F2_2_INVENTARIO_DEPENDENCIAS_RELEASE_2026-10-01.md"
      - "docs/plan-abc/F2_3_VERIFICACION_LOCAL_POSTGRES_2026-10-01.md"
      - "docs/plan-abc/F2_3_EVIDENCIA_PGLITE_FALLBACK_2026-10-01.md"
      - "docs/plan-abc/F2_4_PRECHECK_MIGRACION_CANDIDATA_2026-10-01.md"
      - "tests/f2/f2-base-contract.mjs"
      - "tests/f2/f2-local-verification-contract.mjs"
      - "tests/f2/f2-local-evidence-contract.mjs"
      - "tests/f2/f2-migration-precheck-contract.mjs"
      - ".github/workflows/abc-f2-base-contract.yml"

jobs:
  f2-base-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar contrato base F2.1
        run: node tests/f2/f2-base-contract.mjs
      - name: Validar contrato local F2.3
        run: node tests/f2/f2-local-verification-contract.mjs
      - name: Validar evidencia auxiliar F2.3
        run: node tests/f2/f2-local-evidence-contract.mjs
      - name: Validar precheck de migración F2.4
        run: node tests/f2/f2-migration-precheck-contract.mjs
