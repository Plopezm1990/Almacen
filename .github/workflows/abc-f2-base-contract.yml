name: "ABC F2.1 -- contrato base transaccional"

on:
  push:
    branches: [codex/f2-base-transaccional]
    paths:
      - "docs/plan-abc/F2_1_BASE_TRANSACCIONAL_CONTRATO_2026-10-01.md"
      - "tests/f2/f2-base-contract.mjs"
      - ".github/workflows/abc-f2-base-contract.yml"
  pull_request:
    paths:
      - "docs/plan-abc/F2_1_BASE_TRANSACCIONAL_CONTRATO_2026-10-01.md"
      - "tests/f2/f2-base-contract.mjs"
      - ".github/workflows/abc-f2-base-contract.yml"

jobs:
  f2-base-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validar contrato base F2.1
        run: node tests/f2/f2-base-contract.mjs
