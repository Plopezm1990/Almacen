name: Inspeccionar suscripciones push
on:
  push:
    branches: [preparacion-sin-netlify]
    paths:
      - .github/workflows/inspeccionar-push-suscripciones.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preparacion-sin-netlify
      - name: Mostrar contextos push
        shell: node {0}
        run: |
          const fs = require('fs');
          for (const file of ['fuente.js','seleccion-neutral-patch.js']) {
            const s = fs.readFileSync(file,'utf8');
            console.log('\n===== FILE', file, '=====');
            for (const term of ['suscripciones_push','pushManager','Notification.requestPermission','subscribe(','unsubscribe(']) {
              let from = 0, n = 0;
              while (n < 8) {
                const i = s.indexOf(term, from);
                if (i < 0) break;
                n++;
                console.log(`\n--- ${term} #${n} at ${i} ---\n` + s.slice(Math.max(0,i-1800), Math.min(s.length,i+4200)));
                from = i + term.length;
              }
            }
          }
