name: Inspeccionar empresas multisociedad fase 4
on:
  push:
    paths:
      - '.github/workflows/inspeccionar-empresas-multisociedad-fase4.yml'
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver integración locales y empresa
        run: |
          set -euo pipefail
          echo '=== ESTADOS ==='
          grep -n -A20 -B5 'const \[locales, setLocales\]' fuente.js | head -n 60 || true
          echo '=== CARGA CONFIG EMPRESA ==='
          grep -n -A20 -B10 'loadKey("configEmpresa"' fuente.js | head -n 80 || true
          echo '=== SET CONFIG Y LOCALES ==='
          grep -n -A100 -B10 'setConfigEmpresa' fuente.js | head -n 160 || true
          echo '=== SETLOCALES ==='
          grep -n -A30 -B40 'setLocales(localesFinales' fuente.js | head -n 100 || true
          echo '=== CREAR/ACTUALIZAR LOCAL ==='
          grep -n -A100 -B10 'function crearLocal' fuente.js | head -n 160 || true
