name: Inspeccionar flujos negocio PR4
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/inspeccionar-flujos-negocio.yml
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Obtener fuente del PR4
        run: |
          git fetch origin preparacion-sin-netlify
          git show origin/preparacion-sin-netlify:fuente.js > /tmp/fuente-pr4.js
      - name: Extraer contexto exacto de venta devoluciones y caja
        shell: python
        run: |
          from pathlib import Path
          s=Path('/tmp/fuente-pr4.js').read_text(encoding='utf-8')
          tokens=[
            'function VentaRapida','function Venta','venderCarrito','venderLocal','Añadir al carrito','Cobrar','Finalizar venta','Confirmar venta','Efectivo','Tarjeta','Mixto',
            'function Devoluciones','registrarDevolucionCliente','Devolución de cliente','Devolución a proveedor','Reembolso','Motivo de la devolución',
            'function BloqueEntradasSalidas','Entrada de caja','Retirada de caja','Registrar entrada','Registrar salida','Añadir entrada','Añadir retirada'
          ]
          for token in tokens:
              posiciones=[]
              start=0
              while len(posiciones)<3:
                  p=s.find(token,start)
                  if p<0: break
                  posiciones.append(p); start=p+len(token)
              print('\n'+'='*100)
              print('TOKEN=',repr(token),'COUNT=',s.count(token),'POS=',posiciones)
              for i,p in enumerate(posiciones,1):
                  print('\n--- OCC',i,'POS',p,'---')
                  print(s[max(0,p-5000):min(len(s),p+9000)])
