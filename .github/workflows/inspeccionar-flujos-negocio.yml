name: Inspeccionar flujos negocio PR4
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/inspeccionar-flujos-negocio.yml
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Obtener fuente del PR4
        run: |
          git fetch origin preparacion-sin-netlify
          git show origin/preparacion-sin-netlify:fuente.js > /tmp/fuente-pr4.js
      - name: Extraer solo controles necesarios
        shell: python
        run: |
          from pathlib import Path
          s=Path('/tmp/fuente-pr4.js').read_text(encoding='utf-8')
          tokens=[
            'carritoValido && efectivoSuficiente',
            'function Devoluciones',
            'registrarDevolucionCliente',
            'Devolución de cliente',
            'Motivo de la devolución',
            'reembolso',
          ]
          for token in tokens:
              p=s.find(token)
              print('\n'+'='*90)
              print('TOKEN=',repr(token),'COUNT=',s.count(token),'POS=',p)
              if p>=0:
                  print(s[max(0,p-2200):min(len(s),p+4200)])
