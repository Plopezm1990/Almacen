name: PM27 C24 - Migraciones preflight rollback

on:
  push:
    branches:
      - claude/pm27-c24-migraciones-preflight-rollback
    paths:
      - .github/workflows/pm27-c24-migraciones-preflight-rollback.yml
      - supabase/migrations/20260913190500_pm27_c13_security_definer_tenant_guard.sql
      - supabase/migrations/20260913193500_pm27_c13_private_helper_hardening.sql
      - supabase/migrations/20260914064500_pm27_c18_stock_sale_operation_id_hardening.sql
      - supabase/migrations/20260914071000_pm27_c19_transfer_operation_id_hardening.sql
      - supabase/migrations/20260914080000_pm27_c20_inventory_count_replay_hardening.sql
      - supabase/qa-solo/pm27_c24_preflight_migraciones.sql
      - supabase/qa-solo/pm27_c24_postflight_migraciones.sql
      - supabase/qa-solo/pm27_c24_predeploy_snapshot.sql
      - tests/pm27/PM27_C24_MIGRACIONES_PREFLIGHT_ROLLBACK.md
      - tests/pm27/c24-migrations-preflight-rollback.mjs
      - tests/pm27/pm27-c24-migration-manifest.json
      - tests/pm27/fixtures/c24-pre-c13-baseline.sql
      - tests/pm27/c24-pg17-gate.sh
  pull_request:
    paths:
      - .github/workflows/pm27-c24-migraciones-preflight-rollback.yml
      - supabase/migrations/20260913190500_pm27_c13_security_definer_tenant_guard.sql
      - supabase/migrations/20260913193500_pm27_c13_private_helper_hardening.sql
      - supabase/migrations/20260914064500_pm27_c18_stock_sale_operation_id_hardening.sql
      - supabase/migrations/20260914071000_pm27_c19_transfer_operation_id_hardening.sql
      - supabase/migrations/20260914080000_pm27_c20_inventory_count_replay_hardening.sql
      - supabase/qa-solo/pm27_c24_preflight_migraciones.sql
      - supabase/qa-solo/pm27_c24_postflight_migraciones.sql
      - supabase/qa-solo/pm27_c24_predeploy_snapshot.sql
      - tests/pm27/PM27_C24_MIGRACIONES_PREFLIGHT_ROLLBACK.md
      - tests/pm27/c24-migrations-preflight-rollback.mjs
      - tests/pm27/pm27-c24-migration-manifest.json
      - tests/pm27/fixtures/c24-pre-c13-baseline.sql
      - tests/pm27/c24-pg17-gate.sh

permissions:
  contents: read

jobs:
  certify-c24-pg17:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PG_IMAGE: postgres:17

    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard protected refs unchanged
        shell: bash
        run: |
          set -euo pipefail
          expected_main='93a570badba1c5375febfbddc1dffdbcef003dcd'
          expected_release='a97740987be57aa9646f6a06e69b2230f140ec5f'
          actual_main="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          actual_release="$(git ls-remote origin refs/heads/release | awk '{print $1}')"
          test "$actual_main" = "$expected_main"
          test "$actual_release" = "$expected_release"
          echo 'PM27_C24_PROTECTED_REFS=PASS'

      - name: Guard C24 scope against certified C23 base
        shell: bash
        run: |
          set -euo pipefail
          base='6733894915eadaf26f10b65f32e6e296b41a4311'
          git cat-file -e "${base}^{commit}"
          cat > /tmp/expected.txt <<'EOF'
          .github/workflows/pm27-c24-migraciones-preflight-rollback.yml
          supabase/migrations/20260913190500_pm27_c13_security_definer_tenant_guard.sql
          supabase/migrations/20260913193500_pm27_c13_private_helper_hardening.sql
          supabase/migrations/20260914064500_pm27_c18_stock_sale_operation_id_hardening.sql
          supabase/migrations/20260914071000_pm27_c19_transfer_operation_id_hardening.sql
          supabase/migrations/20260914080000_pm27_c20_inventory_count_replay_hardening.sql
          supabase/qa-solo/pm27_c24_postflight_migraciones.sql
          supabase/qa-solo/pm27_c24_predeploy_snapshot.sql
          supabase/qa-solo/pm27_c24_preflight_migraciones.sql
          tests/pm27/PM27_C24_MIGRACIONES_PREFLIGHT_ROLLBACK.md
          tests/pm27/c24-migrations-preflight-rollback.mjs
          tests/pm27/c24-pg17-gate.sh
          tests/pm27/fixtures/c24-pre-c13-baseline.sql
          tests/pm27/pm27-c24-migration-manifest.json
          EOF
          git diff --name-only "$base" "$GITHUB_SHA" | sort > /tmp/actual.txt
          sort /tmp/expected.txt -o /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          test "$(wc -l < /tmp/actual.txt | tr -d ' ')" = '14'
          echo 'PM27_C24_SCOPE=PASS'

      - name: Syntax checks C24
        shell: bash
        run: |
          set -euo pipefail
          node --check tests/pm27/c24-migrations-preflight-rollback.mjs
          bash -n tests/pm27/c24-pg17-gate.sh
          echo 'PM27_C24_SYNTAX=PASS'

      - name: Run PostgreSQL 17 C24 certification
        shell: bash
        run: bash tests/pm27/c24-pg17-gate.sh

      - name: Clean working tree
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          test -z "$(git status --porcelain)"
          echo 'PM27_C24_CLEAN_TREE=PASS'
