name: G1 Punto 5 permisos aislamiento

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p05-permisos-aislamiento.yml'
      - 'tests/g1/P05_PERMISOS_AISLAMIENTO_EVIDENCIA.md'
      - 'tests/g1/p05-permisos-aislamiento-contract.mjs'
      - 'supabase/migrations/20260905183353_g1_p05_bloquear_todos_locales_mutacion.sql'
      - 'supabase/migrations/20260905183514_g1_p05_restringir_rpc_stock_anon.sql'
      - 'docs/plan-maestro/PM03_CONTRATOS_MINIMOS_PROPUESTA.md'
      - 'docs/plan-maestro/PM05_EVIDENCIA.md'
      - 'tests/pm05/**'
      - 'tests/pm07/**'
      - 'tests/pm08/**'
      - 'tests/pm09/P16_AISLAMIENTO_CONTEXTO_EVIDENCIA.json'
      - 'tests/pm09/p16-isolation-context-contract.mjs'
      - 'tests/pm10/P13_CONTEXTO_AISLAMIENTO_EVIDENCIA.json'
      - 'tests/pm10/p13-contexto-aislamiento-contract.mjs'

permissions:
  contents: read

jobs:
  permisos-aislamiento:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar descendencia de PM10 final
        run: |
          git merge-base --is-ancestor 94d37cc7a5176e3a44d00f8f8bfb79a630dae314 HEAD
          echo 'G1_P05_DESCIENDE_PM10_FINAL=1'
      - name: Sintaxis del candidato
        run: node --check fuente.js
      - name: Contrato G1.5 permisos y aislamiento
        run: node tests/g1/p05-permisos-aislamiento-contract.mjs
      - name: Regresión G1 previa
        run: |
          node tests/g1/p02-evidence-map-contract.mjs
          node tests/g1/p03-la019-contract.mjs
          node tests/g1/p04-la023-contract.mjs
      - name: Regresión histórica de aislamiento
        run: |
          node tests/pm05/frontend-contract.mjs
          node tests/pm07/frontend-contract.mjs
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm08/replay-scope-contract.mjs
          node tests/pm09/p16-isolation-context-contract.mjs
          node tests/pm10/p13-contexto-aislamiento-contract.mjs
      - name: Resumen
        run: |
          echo 'G1_P05_PERMISOS_AISLAMIENTO=PASS'
          echo 'G1_GATE_SUPERADO=NO'
          echo 'G1_SIGUIENTE=P06_CIFRAS_CONCILIACIONES'
