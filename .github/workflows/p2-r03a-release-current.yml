name: "P2-R03A — caja, arqueos y devoluciones sobre release actual"

on:
  pull_request:
    branches: [release]
    paths:
      - '.github/workflows/p2-r03a-release-current.yml'
      - '.github/scripts/p2-r03a/**'
      - 'docs/plan-maestro/P2_R03A_RELEASE_CURRENT.md'
      - 'supabase/migrations/20260916195500_p2_r03a_restore_pm08_pm09_post_reset.sql'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  p2-r03a:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Frontera exacta del candidato
        shell: bash
        run: |
          set -euo pipefail
          BASE='a34ac998f6e806e4dbeefaf511f4de6ca3bbbfc4'
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          expected=$'.github/scripts/p2-r03a/contract.mjs\n.github/scripts/p2-r03a/ephemeral-runtime.sql\n.github/workflows/p2-r03a-release-current.yml\ndocs/plan-maestro/P2_R03A_RELEASE_CURRENT.md\nsupabase/migrations/20260916195500_p2_r03a_restore_pm08_pm09_post_reset.sql'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          echo "P2_R03A_SCOPE=PASS"

      - name: Verificar SQL histórico exacto
        shell: bash
        run: |
          set -euo pipefail
          blob="$(git hash-object supabase/migrations/20260916195500_p2_r03a_restore_pm08_pm09_post_reset.sql)"
          test "$blob" = "f4e75925a418ca35eb00dec5805aeae41566728e"
          echo "P2_R03A_SQL_HISTORICO_EXACTO=$blob"

      - name: Contrato estático P2-R03A
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/p2-r03a/contract.mjs

      - name: Wiring frontend actual
        shell: bash
        run: |
          set -euo pipefail
          for rpc in             registrar_movimiento_caja             registrar_arqueo_caja             registrar_devolucion_venta_pm09             registrar_devolucion_proveedor             registrar_venta_stock_carrito_pm09             revertir_venta_stock_carrito_pm09
          do
            grep -F "$rpc" fuente.js >/dev/null
            echo "P2_R03A_WIRING_$rpc=PASS"
          done

      - name: Regresiones heredadas PM08 PM09
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm08/replay-scope-contract.mjs
          node tests/pm09/p10-caja-contract.mjs
          node --check fuente.js

      - name: Preparar harness efímero
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/scripts/p2-r03a/ephemeral-runtime.sql').read_text()
          bad = "select case when not exists(select 1 from public.caja_operaciones where empresa_id='e2') then 1 else 1/0 end as rls_tenant_ok;"
          if bad not in src:
              raise SystemExit('P2_R03A_HARNESS_RLS_SENTINEL_NOT_FOUND')
          src = src.replace(bad, "select 1 as rls_test_deferred;", 1)
          src = src.replace(
              r'\ir ../../supabase/migrations/20260916195500_p2_r03a_restore_pm08_pm09_post_reset.sql',
              r'\i supabase/migrations/20260916195500_p2_r03a_restore_pm08_pm09_post_reset.sql',
              1,
          )
          Path('/tmp/p2-r03a-runtime.sql').write_text(src)
          PY

      - name: Prueba funcional PostgreSQL 16 efímera
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f /tmp/p2-r03a-runtime.sql

      - name: Verificar RLS multiempresa como authenticated
        shell: bash
        run: |
          set -euo pipefail
          FOREIGN_COUNT="$(psql -h 127.0.0.1 -U postgres -d postgres -Atq <<'SQL'
          set role authenticated;
          set app.current_uid = '11111111-1111-1111-1111-111111111111';
          select count(*) from public.caja_operaciones where empresa_id='e2';
          SQL
          )"
          OWN_COUNT="$(psql -h 127.0.0.1 -U postgres -d postgres -Atq <<'SQL'
          set role authenticated;
          set app.current_uid = '11111111-1111-1111-1111-111111111111';
          select count(*) from public.caja_operaciones where empresa_id='e1';
          SQL
          )"
          test "$FOREIGN_COUNT" = "0"
          test "$OWN_COUNT" -gt 0
          echo "P2_R03A_RLS_FOREIGN_ROWS=$FOREIGN_COUNT"
          echo "P2_R03A_RLS_OWN_ROWS=$OWN_COUNT"
          echo "P2_R03A_RLS_RUNTIME=PASS"

      - name: Confirmar árbol limpio
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "P2_R03A_GATE=PASS"
