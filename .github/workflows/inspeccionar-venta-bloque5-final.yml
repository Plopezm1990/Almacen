name: Inspeccionar movimientos de caja bloque 5 final
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-venta-bloque5-final.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar función exacta de movimientos de caja
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          i=s.index('function crearLogicaMovimientosCaja(')
          print(s[i:i+7000])
          PY