name: Inspeccionar caja bloque 5 final
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-venta-bloque5-final.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar funciones exactas de caja
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          i=s.index('function crearLogicaCaja(')
          j=s.index('function crearLogicaLocales(', i)
          b=s[i:j]
          print(b)
          PY