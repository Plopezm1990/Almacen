name: Inspeccionar historial bloque 5 final
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-venta-bloque5-final.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar render exacto de historial
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          i=s.index('tab === "historial_producto"')
          j=s.index('tab === "aceite"', i)
          print(s[i:j])
          PY