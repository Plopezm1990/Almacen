name: PM09 Punto 10 diagnostico Caja
on:
  push:
    branches: [pm09-conciliacion-ventas-analitica]
    paths:
      - 'tools/diagnosticar_pm09_p10_caja.py'
      - '.github/workflows/pm09-p10-diagnostico.yml'
permissions:
  contents: write
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm09-conciliacion-ventas-analitica
      - name: Extraer diagnostico Caja
        run: |
          set -euo pipefail
          python tools/diagnosticar_pm09_p10_caja.py
          node --check fuente.js
      - name: Guardar diagnostico en PM09
        run: |
          set -euo pipefail
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add tests/pm09/P10_CAJA_DIAGNOSTICO.txt
          git diff --cached --quiet && exit 0
          git commit -m "PM09: conservar diagnostico Caja punto 10"
          git push origin HEAD:pm09-conciliacion-ventas-analitica
