name: Inspeccionar login L&A Suite
on:
  push:
    paths:
      - '.github/workflows/inspeccionar-login-la-suite.yml'
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar bloque del login
        run: |
          set -euo pipefail
          sed -n '128720,128790p' fuente.js
