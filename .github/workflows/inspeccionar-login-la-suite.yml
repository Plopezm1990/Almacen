name: Inspeccionar login L&A Suite
on:
  push:
    paths:
      - '.github/workflows/inspeccionar-login-la-suite.yml'
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar textos exactos del login
        run: |
          set -euo pipefail
          echo '=== LOGIN EXACTO ==='
          grep -Rni -A18 -B18 --exclude-dir=.git -E 'Inicia sesi[oó]n para sincronizar entre dispositivos|Trabajar solo en este equipo' . || true
