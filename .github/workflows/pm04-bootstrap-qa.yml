name: PM-04 bootstrap QA

on:
  push:
    branches: [pm04-regresion-fixtures]
    paths:
      - '.github/workflows/pm04-bootstrap-qa.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Ejecutar bootstrap one-shot en Supabase QA
        shell: bash
        run: |
          set -euo pipefail
          URL='https://qjqorixtkilwsndqayyx.supabase.co/functions/v1/qa-pm04-bootstrap'
          RESP=$(curl -fsS "$URL")
          printf '%s\n' "$RESP" | tee /tmp/pm04.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/pm04.json'))
          assert d['fixture']=='PM04-v1'
          assert len(d['users'])==5
          assert d['contract_fail']==0
          print('PM04_FIXTURES_CREADOS=1')
          print('PM04_USUARIOS_QA=5')
          print('PM04_CONTRATOS_BASE_OK=1')
          print('PM04_PERMISOS_PASS=%s' % d['permission_pass'])
          print('PM04_PERMISOS_FAIL=%s' % d['permission_fail'])
          PY
