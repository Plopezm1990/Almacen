name: Inspeccionar UI multiempresa fase 4
on:
  push:
    paths:
      - '.github/workflows/inspeccionar-ui-multiempresa-fase4.yml'
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ver UI y persistencia empresas
        run: |
          set -euo pipefail
          echo '=== FICHA EMPRESA ==='
          grep -n -A100 -B5 'function FichaEmpresaBasica' fuente.js | head -n 180 || true
          echo '=== LOCALES COMPONENTE ==='
          grep -n -A160 -B10 'function Locales' fuente.js | head -n 230 || true
          echo '=== EFECTO EMPRESAS ==='
          grep -n -A16 -B10 'saveKey("empresas"' fuente.js | head -n 80 || true
          echo '=== INVOCACION LOCALES ==='
          grep -n -A5 -B5 'createElement(Locales' fuente.js | head -n 40 || true
          echo '=== LOGICA LOCALES INVOCACION ==='
          grep -n -A20 -B10 'crearLogicaLocales({' fuente.js | head -n 70 || true
