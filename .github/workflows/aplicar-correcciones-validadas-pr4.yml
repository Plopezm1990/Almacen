name: Aplicar correcciones validadas PR4
on:
  push:
    branches: [preparacion-sin-netlify]
    paths:
      - .github/workflows/aplicar-correcciones-validadas-pr4.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preparacion-sin-netlify
      - name: Aplicar exactamente las dos correcciones validadas
        shell: python
        run: |
          from pathlib import Path
          import re

          edge = Path('edge-auth-patch.js')
          s = edge.read_text(encoding='utf-8')
          if 'modoLocalNoReclamado' in s:
            raise SystemExit('La corrección de modo local ya estaba aplicada')

          marcador = '  async function sesionActual(supabase) {'
          if s.count(marcador) != 1:
            raise SystemExit(f'Marcador sesionActual inesperado: {s.count(marcador)}')
          helpers = '''  // Compatibilidad con instalaciones que siempre han trabajado sin cuenta:
          // si este navegador nunca ha guardado un contexto autenticado, sus datos
          // locales siguen siendo un espacio local legítimo. En cuanto una cuenta se
          // verifica aquí, CACHE_LOCAL reclama el navegador y cerrar sesión no permite
          // saltarse el aislamiento de roles.
          function hayContextoAutenticadoGuardado() {
            try {
              var guardado = JSON.parse(localStorage.getItem(CACHE_LOCAL) || "null");
              return !!(guardado && guardado.userId && guardado.contexto && guardado.contexto.rol);
            } catch (e) {
              return false;
            }
          }

          function modoLocalNoReclamado() {
            return window.__nubeActiva === false && !hayContextoAutenticadoGuardado();
          }

          '''
          s = s.replace(marcador, helpers + marcador, 1)

          viejo = '    if (!rol) return respuestaVacia(key);'
          if s.count(viejo) != 1:
            raise SystemExit(f'Guard lectura inesperado: {s.count(viejo)}')
          s = s.replace(viejo, '''    if (!rol) {
              if (modoLocalNoReclamado()) return getOriginal(key, shared);
              return respuestaVacia(key);
            }''', 1)

          viejo = '    if (!rol) return { key: key, value: value, shared: false };'
          if s.count(viejo) != 1:
            raise SystemExit(f'Guard escritura inesperado: {s.count(viejo)}')
          s = s.replace(viejo, '''    if (!rol) {
              if (modoLocalNoReclamado()) return setOriginal(key, value, shared);
              return { key: key, value: value, shared: false };
            }''', 1)

          marcador_borrado = '      if (!contexto || contexto.rol !== "Propietario") {'
          if s.count(marcador_borrado) != 1:
            raise SystemExit(f'Guard borrado inesperado: {s.count(marcador_borrado)}')
          s = s.replace(
            marcador_borrado,
            marcador_borrado + '\n        if (!contexto && modoLocalNoReclamado()) return deleteOriginal(key, shared);',
            1
          )
          edge.write_text(s, encoding='utf-8')

          fuente = Path('fuente.js')
          f = fuente.read_text(encoding='utf-8')
          if 'localActivoFinal !== (lai || null)' in f:
            raise SystemExit('La corrección de guardados locales ya estaba aplicada')
          f, n1 = re.subn(
            r'(?m)^(\s*)await saveKey\("locales", localesFinales\);\s*$',
            r'\1if (JSON.stringify(localesFinales) !== JSON.stringify(Array.isArray(loc) ? loc : [])) await saveKey("locales", localesFinales);',
            f,
            count=1
          )
          f, n2 = re.subn(
            r'(?m)^(\s*)await saveKey\("localActivoId", localActivoFinal\);\s*$',
            r'\1if (localActivoFinal !== (lai || null)) await saveKey("localActivoId", localActivoFinal);',
            f,
            count=1
          )
          if n1 != 1 or n2 != 1:
            raise SystemExit(f'Guardados locales inesperados: locales={n1}, activo={n2}')
          fuente.write_text(f, encoding='utf-8')
      - name: Validar antes de guardar
        run: |
          node --check edge-auth-patch.js
          node --check fuente.js
          grep -q 'modoLocalNoReclamado' edge-auth-patch.js
          grep -q 'localActivoFinal !== (lai || null)' fuente.js
          git diff --check
      - name: Guardar correcciones y retirar este workflow temporal
        run: |
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add edge-auth-patch.js fuente.js
          git rm .github/workflows/aplicar-correcciones-validadas-pr4.yml
          git commit -m "Corregir modo local y evitar guardados redundantes"
          git push origin HEAD:preparacion-sin-netlify