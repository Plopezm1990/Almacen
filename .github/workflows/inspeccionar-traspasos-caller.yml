name: Inspeccionar integración exacta de traspasos
on:
  push:
    branches: [la-suite-identidad]
    paths: ['.github/workflows/inspeccionar-traspasos-caller.yml']
  workflow_dispatch:
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer función lógica y caller exactos
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8', errors='ignore')
          def block(name):
            i=s.find('function '+name+'(')
            print('\n###',name,'START',i)
            if i<0:return
            p=s.find('(',i); depth=0; ins=None; esc=False; k=p
            while k<len(s):
              c=s[k]
              if ins:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c==ins: ins=None
              else:
                if c in ('"',"'",'`'): ins=c
                elif c=='(': depth+=1
                elif c==')':
                  depth-=1
                  if depth==0: break
              k+=1
            brace=s.find('{',k)
            depth=0; ins=None; esc=False; j=brace
            while j<len(s):
              c=s[j]
              if ins:
                if esc: esc=False
                elif c=='\\': esc=True
                elif c==ins: ins=None
              else:
                if c in ('"',"'",'`'): ins=c
                elif c=='{': depth+=1
                elif c=='}':
                  depth-=1
                  if depth==0:
                    print(s[i:j+1]); return
              j+=1
          block('crearLogicaTraspasos')
          for q in ['crearLogicaTraspasos({','traspasarStock =','traspasarStock }','fusionadoEnId: destino.id','setTraspasos((arr) => arr.map']:
            print('\n### QUERY',q)
            for m in list(re.finditer(re.escape(q),s))[:10]:
              print(s[max(0,m.start()-2500):min(len(s),m.end()+5500)])
          PY
