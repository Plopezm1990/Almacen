name: PM12 P07 permisos y aislamiento de ajustes

on:
  push:
    branches: [pm12-conteo-estados-honestos]
    paths:
      - 'fuente.js'
      - 'source-recovery/fuente-recuperado.js'
      - 'pm12-conteo-estados-v1.js'
      - 'tests/pm12/P07_PERMISOS_AISLAMIENTO_AJUSTES.md'
      - 'tests/pm12/p07-permisos-aislamiento-ajustes-contract.mjs'
      - '.github/workflows/pm12-p07-permisos-aislamiento-ajustes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar aislamiento de rama y main congelado
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pm12-conteo-estados-honestos"
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"

      - name: Validar sintaxis
        shell: bash
        run: |
          set -euo pipefail
          node --check fuente.js
          node --check source-recovery/fuente-recuperado.js
          node --check pm12-conteo-estados-v1.js

      - name: Contrato P07 permisos y aislamiento
        run: node tests/pm12/p07-permisos-aislamiento-ajustes-contract.mjs

      - name: Regresiones PM12 P02-P06
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm12/p02-estados-normalizacion-contract.mjs
          node tests/pm12/p03-documento-corte-contract.mjs
          node tests/pm12/p04-cierre-honesto-ux-contract.mjs
          node tests/pm12/p05-ajustes-trazables-contract.mjs
          node tests/pm12/p06-cancelacion-conservadora-contract.mjs

      - name: Confirmar alcance de archivos Supabase
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            # P08 adds one reviewed migration, executed only in disposable PostgreSQL.
            # This workflow never applies migrations or connects to Supabase.
            test -z "$(git diff --name-only HEAD^ HEAD -- supabase/ | grep -v '^supabase/migrations/20260907155028_pm12_p08_stock_atomico.sql$' || true)"
          fi
          echo 'PM12_P07_SUPABASE_REMOTE_WRITES=0'
          echo 'PM12_P07_PRODUCTION_WRITES=0'
