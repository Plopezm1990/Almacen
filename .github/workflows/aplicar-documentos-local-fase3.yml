name: Aplicar documentos por local fase 3
# Reintento con aplicador corregido: derivados de pagos después de facturasPorPagar.
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-documentos-local-fase3.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche con guardas
        run: python3 .github/scripts/aplicar_documentos_local_fase3.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,420p'
      - name: Guardar y retirar herramientas temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/aplicar_documentos_local_fase3.py
          rm -f .github/workflows/aplicar-documentos-local-fase3.yml
          rm -f .github/workflows/inspeccionar-albaranes-facturas-fase3.yml
          rm -f .github/workflows/inspeccionar-mutaciones-documentos-fase3.yml
          git add fuente.js .github/scripts/aplicar_documentos_local_fase3.py .github/workflows/aplicar-documentos-local-fase3.yml .github/workflows/inspeccionar-albaranes-facturas-fase3.yml .github/workflows/inspeccionar-mutaciones-documentos-fase3.yml
          git diff --cached --check
          git commit -m 'Aislar albaranes facturas y pagos por local'
          git push origin HEAD:multilocal-fase-3