name: Inspeccionar fichajes abiertos 7A
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-fichajes-abiertos-7a.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar cálculo completo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          i=s.index('const fichajesAbiertos =')
          candidatos=[]
          for marcador in ['  const documentosPersonal', '  const caducanPronto', '  const encargosPendientes', '  const stockBajo', '  const appccPendientesHoy']:
              j=s.find(marcador,i+40)
              if j>i: candidatos.append(j)
          j=min(candidatos) if candidatos else i+8000
          print(s[i:j])
          PY