name: Inspeccionar fichajes abiertos 7A
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-fichajes-abiertos-7a.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar cálculo exacto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          i=s.index('const fichajesAbiertos =')
          j=s.find('  const ', i+25)
          while j>0 and j<i+300:
              j=s.find('  const ',j+7)
          if j<0: j=i+5000
          print(s[i:min(j,i+6000)])
          PY