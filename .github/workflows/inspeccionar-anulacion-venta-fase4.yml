name: Inspeccionar anulacion venta fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-anulacion-venta-fase4.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer motor de stock y persistencia de anulacion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for inicio, fin, maxlen in [
            ('function crearMotorStock(', 'function crearLogicaVenta(', 45000),
            ('function crearLogicaVenta(', 'function crearLogicaTraspasos(', 30000),
          ]:
            print('\n===== '+inicio+' =====')
            i=s.index(inicio); j=s.index(fin,i)
            print(s[i:min(j,i+maxlen)])
          for t in ['saveKey("movimientos"', 'saveKey("productos"', 'setMovimientos(', 'setProductos(']:
            print('\n===== '+t+' =====')
            start=0; hits=0
            while True:
              i=s.find(t,start)
              if i<0 or hits>=8: break
              print(s[max(0,i-1200):min(len(s),i+3000)])
              hits+=1; start=i+len(t)
          PY
