name: Inspeccionar datos ticket local y hora fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/inspeccionar-ticket-datos-local-hora-fase4.yml'
permissions:
  contents: read
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar invocacion TPV y marcas de tiempo
        run: |
          set -euo pipefail
          echo '=== INVOCACIONES VentaRapida ==='
          grep -n -A8 -B8 'createElement(VentaRapida' fuente.js | head -n 120 || true
          echo '=== CAMPOS TIEMPO EN HISTORIAL ==='
          grep -n -A35 -B5 'const fecha = lineas.map' fuente.js | head -n 80 || true
          echo '=== CAMPOS marcaTiempo / createdAt cercanos ==='
          grep -n -E 'marcaTiempo|createdAt|timestamp|fechaHora' fuente.js | grep -E '1271|1272|1273|venta|movimiento' | head -n 100 || true
