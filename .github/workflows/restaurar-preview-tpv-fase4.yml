name: Restaurar Preview TPV fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/restaurar-preview-tpv-fase4.yml'
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Restaurar fuente al último estado funcional
        run: |
          git checkout 36eae8eee94a9f9e82890cf520efbd406019ca68 -- fuente.js
          node --check fuente.js
          git diff --check
      - name: Limpiar diagnóstico temporal y guardar
        run: |
          rm -f .github/workflows/diagnosticar-runtime-tpv-fase4.yml
          rm -f .github/workflows/restaurar-preview-tpv-fase4.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuente.js .github/workflows
          git commit -m 'Restaurar Preview TPV al último estado funcional'
          git push origin HEAD:tpv-ventas-fase-4
