name: Inspeccionar Recepción y Albaranes fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-recepcion-albaranes-fase3.yml
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer dependencias de Recepción y Albaranes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def mostrar(nombre, marcador, antes=500, despues=5000, ultimo=False):
              ps=[]; i=0
              while True:
                  j=s.find(marcador,i)
                  if j<0: break
                  ps.append(j); i=j+1
              print('\n=====',nombre,'POS',ps,'=====')
              if not ps: return
              elegidas=ps[-2:] if ultimo else ps[:2]
              for j in elegidas:
                  print('\n---',j,'---')
                  print(s[max(0,j-antes):min(len(s),j+despues)])
          mostrar('LOGICA ALBARANES','function crearLogicaAlbaranes(',300,12000)
          mostrar('CATALOGO PROVEEDOR','catalogoProv[',700,5000)
          mostrar('BUSCAR CATALOGO','buscarEnCatalogo',700,5000)
          mostrar('GUARDAR ALBARAN','function guardarAlbaran(',700,5000)
          mostrar('RECEPCION COMPONENTE','function Recepcion(',200,9000)
          mostrar('ALBARANES COMPONENTE','function Albaranes(',200,7000)
          mostrar('RECIBIR PEDIDO','function recibirPedido(',500,7500)
          mostrar('RECIBIR CON ALBARAN','recibirConAlbaran',700,6000)
          mostrar('RECIBIR CON FOTO IA','recibirConFotoIA',700,6000)
          PY
