name: Auditoría final multilocal fase 3 tercera pasada
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/auditoria-final-multilocal-fase3-3.yml
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar últimos contextos exactos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          terminos=[
            'GastosGenerales', 'function Gastos', 'addGastoInforme', 'gastosGeneralesInforme',
            'const fichajesAbiertos =', 'const appccPendientesHoy =', 'const caducanPronto =',
            'tab === "dashboard"',
            'const rotacionPorProducto =', 'const gastoPorProveedor =', 'const productosSinMovimiento =',
            'const margenPorProducto =', 'const patronesDesviacionConteo =',
            'const empleadosFinales =', 'setFichajes(fj)', 'setTurnos(tu)',
            'crearLogicaFichaje({', 'crearLogicaTurnos({',
            'function crearLogicaReconciliacion('
          ]
          for termino in terminos:
              print('\n===== '+termino+' =====')
              pos=[]; k=0
              while True:
                  i=s.find(termino,k)
                  if i<0: break
                  pos.append(i); k=i+1
              print('POS',pos[:20])
              for i in pos[:8]: print(s[max(0,i-1600):min(len(s),i+5500)])
          PY