name: PM13 P02 turnos

on:
  push:
    branches: [pm13-p02-turnos]
    paths:
      - 'fuente.js'
      - 'tools/corregir_pm13_p02_turnos.py'
      - 'tests/pm13/p02-turnos-contract.mjs'
      - 'tests/pm13/P02_CIERRE_TURNOS.md'
      - 'tests/pm10/p07-personal-contract.mjs'
      - '.github/workflows/pm13-p02-turnos.yml'

permissions:
  contents: write

jobs:
  validar-p02:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Proteger main y alcance P02
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          P02_BASE='4a178637d48aed85a6b8d00bcddb6d5659a06605'
          if git diff --name-only "$P02_BASE"..HEAD -- supabase/ | grep -q .; then
            echo 'PM13 P02 no puede modificar Supabase' >&2
            git diff --name-only "$P02_BASE"..HEAD -- supabase/ >&2
            exit 1
          fi
          echo 'PM13_P02_MAIN_FROZEN=PASS'
          echo 'PM13_P02_NO_SUPABASE_DIFF=PASS'

      - name: Aplicar hardening Turnos
        run: python3 tools/corregir_pm13_p02_turnos.py

      - name: Sintaxis bundle
        run: node --check fuente.js

      - name: Contrato PM13 P02 Turnos
        run: node tests/pm13/p02-turnos-contract.mjs

      - name: Regresión PM13 P01 y Personal PM10
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm13/p01-rpc-personal-contract.mjs
          node tests/pm13/p01-backend-personal-contract.mjs
          node tests/pm10/p07-personal-contract.mjs
          echo 'PM13_P02_REGRESSION_P01_PM10=PASS'

      - name: Regresión frontend PM12 P02-P10
        shell: bash
        run: |
          set -euo pipefail
          for n in 02 03 04 05 06 07 08 09 10; do
            for t in tests/pm12/p${n}-*contract.mjs; do
              test -f "$t" || continue
              case "$t" in
                *postgres*|*supabase*) continue ;;
              esac
              node "$t"
            done
          done
          echo 'PM13_P02_REGRESSION_PM12=PASS'

      - name: Barreras de alcance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('fuente.js').read_text(encoding='utf-8')
          a = s.index('function crearLogicaTurnos({')
          b = s.index('function crearLogicaAppcc({', a)
          x = s[a:b]
          assert 'e2.activo !== false' in x
          assert 'parseFechaTurnoPM13' in x
          assert 'parseHoraTurnoPM13' in x
          assert 'conflictoTurnoPM13' in x
          assert 'ocupados' in x
          print('PM13_P02_DOMAIN_GUARDS=PASS')
          PY
          ! grep -Eq 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tools/corregir_pm13_p02_turnos.py tests/pm13/p02-turnos-contract.mjs
          echo 'PM13_P02_NO_SECRET=PASS'

      - name: Commit funcional si procede
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- fuente.js; then
            echo 'Fuente ya coincide con P02'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuente.js
          git commit -m 'feat(pm13): cerrar reglas seguras de Turnos P02'
          git push

  gate-final:
    needs: validar-p02
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM13 P02
        run: echo 'PM13_P02_GATE=SUCCESS'
