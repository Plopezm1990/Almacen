name: "ABC F4 B09 -- liquidaciones y disputas"

on:
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260930230000_abc_f4_b09_settlements_disputes.sql"
      - "supabase/migrations/20260930233000_abc_f4_b09_import_resolution.sql"
      - "tests/f4/b09/**"
      - "docs/plan-abc/F4_B09_CONTRATO_TECNICO_2026-09-30.md"
      - ".github/workflows/abc-f4-b09-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  f4-b09-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validar contrato de esquema B09.1
        run: node tests/f4/b09/b09-schema-contract.mjs
      - name: Validar contrato de RPC B09.2
        run: node tests/f4/b09/b09-rpc-contract.mjs
