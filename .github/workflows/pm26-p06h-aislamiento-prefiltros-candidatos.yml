name: PM26 P06h aviso F diseno estricto aislamiento prefiltros candidatos

# Certifica el diseno estricto (Opcion B) del aviso F para
# prefiltros_candidatos: aislamiento obligatorio por empresa/local,
# lectura por RLS, escritura exclusivamente por RPC, migracion
# combinada A+C justificada porque QA/produccion tenian 0 filas en el
# momento del conteo agregado autorizado. No aplica nada en QA ni
# produccion. No toca fuente.js (Fase B bloqueada por el Defecto K), ni
# main, release, Netlify, Supabase (escritura), ni TPV.

on:
  push:
    branches: [claude/pm26-preparacion-tecnica]
    paths:
      - 'tests/pm26/P06H_AVISO_F_DISENO_DESPLIEGUE.md'
      - 'tests/pm26/P06G_DEFECTO_L_SIN_AISLAMIENTO_PRODUCCION.md'
      - 'tests/pm26/p06h-contract.mjs'
      - 'tests/pm26/p06h-f-aislado/**'
      - 'supabase/qa-solo/pm26_p06h_aislamiento_prefiltros_candidatos.sql'
      - '.github/workflows/pm26-p06h-aislamiento-prefiltros-candidatos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger lo que P06h no debe tocar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          # Comparado contra el cierre previo de la rama (PM26 P06f,
          # 57691fe), no contra origin/main.
          intocables='edge-auth-patch.js
          fuente.js
          index.html
          _headers
          reset-pruebas-preview.js
          pm11-compra-mobile-loader.js
          source-recovery/recuperar_candidato.py
          source-recovery/fuente-recuperado.js
          netlify.toml
          supabase/qa-solo/pm26_p06b_rendimiento_indices_rls_initplan.sql
          tests/pm26/p06b-h-aislado/preflight-catalogo.sql
          tests/pm26/p06b-h-aislado/validar.sh'
          cambiados="$(git diff --name-only 57691fe0a75e08bc073200affa0aa5b7749f2803..HEAD)"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            if echo "$cambiados" | grep -qxF "$archivo"; then
              echo "PM26 P06h no debe tocar: $archivo" >&2
              exit 1
            fi
          done <<< "$intocables"
          nuevos_en_migrations="$(git diff --name-only --diff-filter=A 57691fe0a75e08bc073200affa0aa5b7749f2803..HEAD -- supabase/migrations)"
          if [ -n "$nuevos_en_migrations" ]; then
            echo "PM26 P06h no debe anadir nada a supabase/migrations: $nuevos_en_migrations" >&2
            exit 1
          fi
          echo 'PM26_P06H_INTOCABLES_INTACTOS=PASS'
      - name: Instalar PostgreSQL local (aislado)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sleep 2
          sudo -u postgres pg_isready
      - name: Contrato PM26 P06h (diseno estricto aviso F + bateria 15 casos + sin secretos)
        run: node tests/pm26/p06h-contract.mjs

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL local (aislado)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sleep 2
          sudo -u postgres pg_isready
      - name: Gate PM26 P06h -- diseno estricto aviso F, nada aplicado en QA
        run: |
          set -euo pipefail
          node tests/pm26/p06h-contract.mjs
          echo 'PM26_P06H_GATE=PASS'
