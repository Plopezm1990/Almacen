name: PM26 P06a diagnostico de solo lectura de los avisos F G H

# Documenta, sin aplicar ningun cambio, la reverificacion en vivo de los
# avisos F (RLS sin politicas en QA), G (proteccion de contrasenas
# filtradas desactivada en Auth QA) y H (rendimiento en QA), y presenta
# propuestas tecnicas sin aplicar ninguna. No toca main, Netlify,
# Supabase produccion, QA (escritura) ni TPV.

on:
  push:
    branches: [claude/pm26-preparacion-tecnica]
    paths:
      - 'tests/pm26/P06A_DIAGNOSTICO_AVISOS_FGH.md'
      - 'tests/pm26/p06a-contract.mjs'
      - '.github/workflows/pm26-p06a-diagnostico-avisos-fgh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger lo que P06a no debe tocar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          # Comparado contra el cierre previo de la rama (PM26 P05b,
          # 456a3e1), no contra origin/main.
          intocables='edge-auth-patch.js
          fuente.js
          index.html
          _headers
          reset-pruebas-preview.js
          pm11-compra-mobile-loader.js
          source-recovery/recuperar_candidato.py
          source-recovery/fuente-recuperado.js
          netlify.toml'
          cambiados="$(git diff --name-only 456a3e174cb7c601121f015634a63528e1d72b03..HEAD)"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            if echo "$cambiados" | grep -qxF "$archivo"; then
              echo "PM26 P06a no debe tocar: $archivo" >&2
              exit 1
            fi
          done <<< "$intocables"
          echo 'PM26_P06A_INTOCABLES_INTACTOS=PASS'
      - name: Contrato PM26 P06a (diagnostico + hallazgo reproducible + sin secretos)
        run: node tests/pm26/p06a-contract.mjs

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM26 P06a -- diagnostico de los avisos F, G y H, sin cambios aplicados
        run: |
          set -euo pipefail
          node tests/pm26/p06a-contract.mjs
          echo 'PM26_P06A_GATE_DIAGNOSTICO=PASS'
