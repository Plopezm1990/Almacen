name: PM07 diagnostico hidratacion locales v2
on:
  push:
    branches: [pm07-stock-reversos-ubicacion]
    paths:
      - '.github/workflows/pm07-diagnostico-hidratacion-locales-v2.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar carga de empresas y locales
        shell: bash
        run: |
          set -euo pipefail
          SRC=source-recovery/fuente-recuperado.js
          echo '=== loadKey y carga inicial ==='
          grep -n -B12 -A35 -E 'loadKey\("empresas"|loadKey\("locales"|loadKey\("localActivoId"|Promise\.all' "$SRC" | head -n 420 || true
          echo '=== estados y filtros de locales ==='
          grep -n -B12 -A35 -E 'setLocales\(|localesFinales|localActivoFinal|localesEmpresaActiva|SelectorLocalInformes' "$SRC" | head -n 520 || true
          echo '=== storage get y pendientes ==='
          grep -n -B10 -A45 -E 'window\.storage =|async get\(key\)|pendientes\(\)\.indexOf\(key\)' index.html | head -n 320 || true
