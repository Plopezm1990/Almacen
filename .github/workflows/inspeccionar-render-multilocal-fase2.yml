name: Inspeccionar render multilocal fase 2
on:
  push:
    branches: [multilocal-fase-2]
    paths:
      - .github/workflows/inspeccionar-render-multilocal-fase2.yml
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer llamadas y renders relevantes
        shell: python
        run: |
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          pats=[
            'crearLogicaConteos({','crearLogicaMovimientosCaja({','crearLogicaFichaje({',
            'crearLogicaAppcc({','crearLogicaAceite({','crearLogicaProduccion({','crearLogicaTraspasos({',
            'tab === "productos"','tab === "conteo"','tab === "pedidos"','tab === "recepcion"',
            'tab === "albaranes"','tab === "traspasos"','tab === "fichas"','tab === "produccion"',
            'tab === "mermas"','tab === "venta"','tab === "encargos"','tab === "devoluciones"',
            'tab === "caja"','tab === "fichaje"','tab === "personal"','tab === "appcc"','tab === "aceite"'
          ]
          for pat in pats:
            pos=[]; i=0
            while True:
              j=s.find(pat,i)
              if j<0: break
              pos.append(j); i=j+1
            print(f'\n### {pat} :: {pos}')
            for j in pos[-2:]:
              print(s[max(0,j-1200):min(len(s),j+3500)])