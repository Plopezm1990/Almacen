name: "ABC F2 M04D -- ACL parity"

on:
  push:
    branches: [abc-f2-m04d-acl-parity]
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql"
      - "supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql"
      - "supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql"
      - "supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql"
      - "supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql"
      - "supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql"
      - "supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql"
      - "supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql"
      - "supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql"
      - "supabase/migrations/20260924003000_abc_f2_m04c_outbox_persistente.sql"
      - "supabase/migrations/20260924004000_abc_f2_m04d_acl_parity.sql"
      - "tests/f2/m04d/**"
      - ".github/workflows/abc-f2-m04d-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  m04d-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Guardar orden y alcance F2-M04D
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
            supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
            supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
            supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
            supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
            supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
            supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
            supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
            supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql
            supabase/migrations/20260924003000_abc_f2_m04c_outbox_persistente.sql
            supabase/migrations/20260924004000_abc_f2_m04d_acl_parity.sql
          )

          previous=""
          for file in "${files[@]}"; do
            test -f "$file"
            current="$(basename "$file")"
            if [[ -n "$previous" && ! "$previous" < "$current" ]]; then
              echo "M04D_ORDER_GUARD: orden invalido $previous -> $current" >&2
              exit 1
            fi
            previous="$current"
          done

          m04d="${files[10]}"
          grep -qi "revoke all privileges" "$m04d"
          grep -qi "alter default privileges for role postgres in schema public" "$m04d"
          grep -qi "grant select on table public.efectos_pendientes to service_role" "$m04d"

          if grep -Eiq 'grant[[:space:]]+(insert|update|delete|truncate).*authenticated' "$m04d"; then
            echo "M04D_SECURITY: mutacion directa concedida a authenticated" >&2
            exit 1
          fi
          if grep -Eiq 'grant[[:space:]]+(insert|update|delete|truncate).*service_role' "$m04d"; then
            echo "M04D_SECURITY: mutacion directa concedida a service_role" >&2
            exit 1
          fi

          echo "M04D_SCOPE_GUARD=PASS"

      - name: Preparar fixture QA-like
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04d/fixture-m04d.sql
      - name: Aplicar M01
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
      - name: Aplicar M01b
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
      - name: Aplicar M02A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
      - name: Aplicar M02B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
      - name: Aplicar M03A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
      - name: Aplicar M03B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
      - name: Aplicar M03C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
      - name: Aplicar M04A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
      - name: Aplicar M04B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql
      - name: Aplicar M04C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924003000_abc_f2_m04c_outbox_persistente.sql

      - name: Confirmar que el fixture reprodujo el drift QA
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            if not has_table_privilege('service_role','public.caja_sesion_responsables','INSERT')
               or not has_table_privilege('service_role','public.pagos','UPDATE')
               or not has_sequence_privilege('service_role','public.abc_eventos_id_seq','USAGE') then
              raise exception 'M04D_FIXTURE_FAIL: no se reprodujo drift QA';
            end if;
          end $$;
          SQL

      - name: Aplicar M04D
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924004000_abc_f2_m04d_acl_parity.sql

      - name: Regresión funcional M04C bajo ACL endurecida
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04c/m04c-contract.sql

      - name: Ejecutar contrato M04D
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04d/m04d-contract.sql
