name: Inspeccionar Inventario y ABC fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-inventario-abc-fase3.yml
  workflow_dispatch:

jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer dependencias de inventario y ABC
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def mostrar(nombre, marcador, antes=500, despues=9000, todas=False):
              pos=[]; i=0
              while True:
                  j=s.find(marcador,i)
                  if j<0: break
                  pos.append(j); i=j+1
              print('\n=====',nombre,'POS',pos,'=====')
              elegidas=pos if todas else pos[:3]
              for j in elegidas:
                  print('\n---',j,'---')
                  print(s[max(0,j-antes):min(len(s),j+despues)])
          mostrar('LOGICA CONTEOS','function crearLogicaConteos(',300,17000)
          mostrar('CONTEO ABIERTO','const conteoAbierto =',700,4000)
          mostrar('ANALISIS ABC','const analisisABC =',500,6500)
          mostrar('CLASIFICACION ABC','clasificacionABC',500,3500,True)
          mostrar('INVENTARIO CIEGO COMPONENTE','function InventarioCiego(',300,12000)
          mostrar('RENDER CONTEO','tab === "conteo"',500,5000)
          mostrar('SALDO ALMACEN','function SaldoAlmacen(',300,7000)
          mostrar('RENDER SALDO','tab === "saldo"',500,2500)
          mostrar('ALMACEN CONGELADO','almacenCongelado',350,1800,True)
          PY