name: Inspeccionar bloque 7A final
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-bloque7a-final.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar anclas exactas bloque 7A
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def ctx(term, before=900, after=1800):
              print('\n===== '+term+' =====')
              k=0; n=0
              while True:
                  i=s.find(term,k)
                  if i<0: break
                  n+=1
                  print(f'--- {n} @ {i} ---')
                  print(s[max(0,i-before):min(len(s),i+after)])
                  k=i+1
                  if n>=8: break
          for t in [
            'function crearLogicaGastos(',
            'function crearLogicaReconciliacion(',
            'const recordatorioConteo =',
            'tab === "mapa"',
            'tab === "reportes"',
            'tab === "diagnostico"',
            '{ id: "traspasos"',
            'tab === "productos"',
            'const rotacionPorProducto =',
            'const gastoPorProveedor =',
            'const productosSinMovimiento =',
            'const valorInventario =',
            'const margenPorProducto =',
            'const patronesDesviacionConteo ='
          ]: ctx(t)
          PY