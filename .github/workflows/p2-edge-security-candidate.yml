name: "P2-SEC — Edge tenant security candidate"

on:
  pull_request:
    branches: [release]
    paths:
      - '.github/scripts/p2-edge-security/**'
      - '.github/workflows/p2-edge-security-candidate.yml'
      - 'docs/plan-maestro/P2_EDGE_SECURITY_CANDIDATE.md'
      - 'supabase/functions/_shared/tenant-scope.js'
      - 'supabase/functions/crear-cuenta-empleado/index.ts'
      - 'supabase/functions/enviar-notificacion/index.ts'
      - 'supabase/functions/prefiltro-candidato/index.ts'
      - 'supabase/functions/edge-security-manifest.json'
      - 'supabase/migrations/20260922080500_p2_sec_prefiltro_rate_limit_rpc.sql'
      - 'supabase/migrations/20260922095000_p2_sec_revoke_pm05_scope_anon.sql'
      - 'supabase/migrations/20260922180000_p2_sec_pm11_finalize_account_dependency.sql'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  edge-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'

      - name: Frontera exacta del candidato
        shell: bash
        run: |
          set -euo pipefail
          BASE='e8de01fbdad63bd7fbe57982e3ae978e06d1ca52'
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          git fetch origin release --quiet
          test "$(git rev-parse origin/release)" = "$BASE"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            test "$ACTUAL_HEAD" = '${{ github.event.pull_request.head.sha }}'
          fi
          git merge-base --is-ancestor "$BASE" "$ACTUAL_HEAD"
          mapfile -t changed < <(git diff --name-only "$BASE"...HEAD | LC_ALL=C sort)
          printf '%s\n' "${changed[@]}"
          expected=$'.github/scripts/p2-edge-security/behavior.mjs\n.github/scripts/p2-edge-security/contract.mjs\n.github/scripts/p2-edge-security/ephemeral-rate-limit.sql\n.github/workflows/p2-edge-security-candidate.yml\ndocs/plan-maestro/P2_EDGE_SECURITY_CANDIDATE.md\nsupabase/functions/_shared/tenant-scope.js\nsupabase/functions/crear-cuenta-empleado/index.ts\nsupabase/functions/edge-security-manifest.json\nsupabase/functions/enviar-notificacion/index.ts\nsupabase/functions/prefiltro-candidato/index.ts\nsupabase/migrations/20260922080500_p2_sec_prefiltro_rate_limit_rpc.sql\nsupabase/migrations/20260922095000_p2_sec_revoke_pm05_scope_anon.sql\nsupabase/migrations/20260922180000_p2_sec_pm11_finalize_account_dependency.sql'
          actual="$(printf '%s\n' "${changed[@]}")"
          test "$actual" = "$expected"
          ! printf '%s\n' "${changed[@]}" | grep -Eq '^fuente\.js$'
          mapfile -t migrations < <(printf '%s\n' "${changed[@]}" | grep '^supabase/migrations/' || true)
          test "${#migrations[@]}" = "3"
          test "${migrations[0]}" = 'supabase/migrations/20260922080500_p2_sec_prefiltro_rate_limit_rpc.sql'
          test "${migrations[1]}" = 'supabase/migrations/20260922095000_p2_sec_revoke_pm05_scope_anon.sql'
          test "${migrations[2]}" = 'supabase/migrations/20260922180000_p2_sec_pm11_finalize_account_dependency.sql'
          echo "P2_EDGE_SECURITY_SCOPE=PASS"
          echo "P2_EDGE_SECURITY_BASE=$BASE"
          echo "P2_EDGE_SECURITY_CANDIDATE=$ACTUAL_HEAD"

      - name: Contratos de tenant Edge
        shell: bash
        run: |
          set -euo pipefail
          node --check supabase/functions/_shared/tenant-scope.js
          node .github/scripts/p2-edge-security/contract.mjs
          node .github/scripts/p2-edge-security/behavior.mjs

      - name: PostgreSQL 16 efímero — rate limit
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f .github/scripts/p2-edge-security/ephemeral-rate-limit.sql

      - name: PostgreSQL 16 efímero — P2-SEC-F01
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create table public.almacen_kv(
            key text primary key,
            value jsonb not null default '{}'::jsonb,
            empresa_id text,
            local_id text
          );

          create or replace function public.pm05_scope_almacen_kv()
          returns trigger
          language plpgsql
          set search_path to 'public'
          as $$
          begin
            new.empresa_id := coalesce(new.value->>'empresaId', new.empresa_id);
            new.local_id := coalesce(new.value->>'localId', new.local_id);
            return new;
          end
          $$;

          create trigger pm05_scope_almacen_kv_trg
          before insert or update on public.almacen_kv
          for each row execute function public.pm05_scope_almacen_kv();

          grant execute on function public.pm05_scope_almacen_kv() to authenticated, service_role;
          grant insert, select, update on public.almacen_kv to authenticated;
          SQL

          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260922095000_p2_sec_revoke_pm05_scope_anon.sql

          psql -v ON_ERROR_STOP=1 <<'SQL'
          select public.p2_sec_assert(
            not has_function_privilege('public','public.pm05_scope_almacen_kv()','EXECUTE'),
            'F01 public execute remains open'
          );
          select public.p2_sec_assert(
            not has_function_privilege('anon','public.pm05_scope_almacen_kv()','EXECUTE'),
            'F01 anon execute remains open'
          );
          select public.p2_sec_assert(
            has_function_privilege('authenticated','public.pm05_scope_almacen_kv()','EXECUTE'),
            'F01 authenticated explicit grant lost'
          );
          select public.p2_sec_assert(
            has_function_privilege('service_role','public.pm05_scope_almacen_kv()','EXECUTE'),
            'F01 service_role explicit grant lost'
          );

          set role authenticated;
          insert into public.almacen_kv(key,value)
          values('f01-smoke','{"empresaId":"empresa-f01","localId":"local-f01"}'::jsonb);
          reset role;

          select public.p2_sec_assert(
            exists(
              select 1 from public.almacen_kv
              where key='f01-smoke'
                and empresa_id='empresa-f01'
                and local_id='local-f01'
            ),
            'F01 trigger stopped working after revoke'
          );
          select 'P2_EDGE_SECURITY_F01_EPHEMERAL=PASS' as result;
          SQL

      - name: PostgreSQL 16 efímero — dependencia PM11 finalizadora
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create schema if not exists private;

          create table public.locales(
            id text primary key,
            empresa_id text not null,
            activo boolean not null default true
          );
          create table public.empleados(
            id text primary key,
            empresa_id text not null,
            local_id text not null,
            estado text not null,
            nombre text
          );
          create table public.perfiles(
            user_id uuid primary key,
            rol text not null,
            nombre text,
            empleado_id text,
            activo boolean not null default true
          );
          create table public.membresias_usuario(
            user_id uuid not null,
            empresa_id text not null,
            local_id text,
            todos_locales boolean not null default false,
            rol text not null,
            activo boolean not null default true
          );
          create table public.auditoria_registro(
            id text primary key,
            fecha date not null,
            datos jsonb not null,
            empresa_id text,
            local_id text,
            actor_user_id uuid
          );
          create table auth.users(id uuid primary key);

          create or replace function private.pm11_local_activo(p_empresa_id text,p_local_id text)
          returns boolean
          language sql
          stable
          security definer
          set search_path=''
          as $
            select exists(
              select 1 from public.locales l
              where l.id=p_local_id and l.empresa_id=p_empresa_id and l.activo=true
            );
          $;

          insert into public.locales(id,empresa_id,activo)
          values('local-finalize','empresa-finalize',true);
          insert into public.empleados(id,empresa_id,local_id,estado,nombre)
          values('emp-finalize','empresa-finalize','local-finalize','activo','Empleado Finalize');
          insert into public.perfiles(user_id,rol,nombre,empleado_id,activo)
          values('11111111-1111-1111-1111-111111111111'::uuid,'Propietario','Owner',null,true);
          insert into public.membresias_usuario(user_id,empresa_id,local_id,todos_locales,rol,activo)
          values('11111111-1111-1111-1111-111111111111'::uuid,'empresa-finalize',null,true,'Propietario',true);
          insert into auth.users(id)
          values('22222222-2222-2222-2222-222222222222'::uuid);
          SQL

          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260922180000_p2_sec_pm11_finalize_account_dependency.sql

          psql -v ON_ERROR_STOP=1 <<'SQL'
          select public.p2_sec_assert(
            md5(pg_get_functiondef(to_regprocedure('public.pm11_finalizar_creacion_cuenta_empleado(uuid,uuid,text,text,text,text,text)')))='354cd3754c4e09f56d0645a7599baf88',
            'finalizer hash differs from certified QA/PROD'
          );
          select public.p2_sec_assert(
            has_function_privilege('service_role','public.pm11_finalizar_creacion_cuenta_empleado(uuid,uuid,text,text,text,text,text)','EXECUTE'),
            'service_role execute missing on finalizer'
          );
          select public.p2_sec_assert(
            not has_function_privilege('authenticated','public.pm11_finalizar_creacion_cuenta_empleado(uuid,uuid,text,text,text,text,text)','EXECUTE')
            and not has_function_privilege('anon','public.pm11_finalizar_creacion_cuenta_empleado(uuid,uuid,text,text,text,text,text)','EXECUTE')
            and not has_function_privilege('public','public.pm11_finalizar_creacion_cuenta_empleado(uuid,uuid,text,text,text,text,text)','EXECUTE'),
            'finalizer execute opened outside service_role'
          );

          set role service_role;
          select public.p2_sec_assert(
            (public.pm11_finalizar_creacion_cuenta_empleado(
              '11111111-1111-1111-1111-111111111111'::uuid,
              '22222222-2222-2222-2222-222222222222'::uuid,
              'empresa-finalize','local-finalize','emp-finalize','Empleado Finalize','Camarero/a'
            )->>'ok')::boolean,
            'finalizer first execution failed'
          );
          select public.p2_sec_assert(
            (public.pm11_finalizar_creacion_cuenta_empleado(
              '11111111-1111-1111-1111-111111111111'::uuid,
              '22222222-2222-2222-2222-222222222222'::uuid,
              'empresa-finalize','local-finalize','emp-finalize','Empleado Finalize','Camarero/a'
            )->>'yaCreada')::boolean,
            'finalizer replay was not idempotent'
          );
          reset role;

          select public.p2_sec_assert(
            exists(select 1 from public.perfiles where user_id='22222222-2222-2222-2222-222222222222'::uuid and empleado_id='emp-finalize' and rol='Camarero/a' and activo=true),
            'target profile was not created'
          );
          select public.p2_sec_assert(
            exists(select 1 from public.membresias_usuario where user_id='22222222-2222-2222-2222-222222222222'::uuid and empresa_id='empresa-finalize' and local_id='local-finalize' and todos_locales=false and rol='Camarero/a' and activo=true),
            'target membership was not created'
          );
          select public.p2_sec_assert(
            (select count(*) from public.auditoria_registro where empresa_id='empresa-finalize' and local_id='local-finalize' and actor_user_id='11111111-1111-1111-1111-111111111111'::uuid)=1,
            'finalizer audit must be exactly one row after replay'
          );
          select 'P2_EDGE_SECURITY_PM11_FINALIZER_EPHEMERAL=PASS' as result;
          SQL

      - name: Concurrencia — sin incrementos perdidos
        shell: bash
        run: |
          set -euo pipefail
          KEY="$(printf 'b%.0s' {1..64})"
          psql -v ON_ERROR_STOP=1 -c "delete from public.prefiltro_limites where clave='$KEY';" >/dev/null
          pids=()
          for i in $(seq 1 16); do
            (
              psql -v ON_ERROR_STOP=1 -Atq -c "set role service_role; select public.registrar_intento_prefiltro('$KEY');" >"/tmp/p2-sec-rate-$i.out"
            ) &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do wait "$pid"; done
          final="$(psql -v ON_ERROR_STOP=1 -Atq -c "select intentos from public.prefiltro_limites where clave='$KEY';")"
          test "$final" = "16"
          echo "P2_EDGE_SECURITY_RATE_LIMIT_CONCURRENCY=PASS"

      - name: Regresiones P2 existentes
        shell: bash
        run: |
          set -euo pipefail
          node .github/scripts/p2-r03a/contract.mjs
          node .github/scripts/p2-r03b/contract.mjs
          node .github/scripts/p2-r03c/contract.mjs
          node .github/scripts/p2-pm11/contract.mjs
          node .github/scripts/p2-pm13/contract.mjs
          node .github/scripts/p2-p06/contract.mjs
          node --check fuente.js
          echo "P2_EDGE_SECURITY_REGRESSION=PASS"

      - name: No credenciales ni proyecto Supabase hardcodeados
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIE 'sb_secret_|eyJ[A-Za-z0-9_-]{30,}|https://[a-z]{20}\.supabase\.co' \
            supabase/functions/_shared \
            supabase/functions/crear-cuenta-empleado \
            supabase/functions/enviar-notificacion \
            supabase/functions/prefiltro-candidato
          echo "P2_EDGE_SECURITY_NO_LITERAL_SECRETS=PASS"

      - name: Confirmar árbol limpio
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          echo "P2_EDGE_SECURITY_GATE=PASS"
