name: PM26 P03b pipeline canonico permanente

# Gate permanente de la fuente canonica (PM26 P03b). Verifica que la
# fuente canonica (source-recovery/fuente-recuperado.js +
# entrada-recuperada.js) compila con esbuild sin errores, que el
# resultado es JavaScript sintacticamente valido, y que toda la logica de
# negocio conocida (11 anclas PM15-PM25) sigue presente y en orden.
#
# Este gate NO compara el build byte a byte contra fuente.js -- un
# experimento real (documentado en PM26_P03B_CIERRE.md) demostro que
# esbuild no produce una salida estable byte a byte entre distintas
# composiciones de bundle (recorta algunos comentarios y renombra
# variables locales), sin que eso represente perdida de logica. Exigir
# esa comparacion produciria fallos falsos permanentes, no señal real.
# No toca fuente.js, index.html, dependencias raiz, main, Netlify,
# Supabase, QA, produccion ni TPV.

on:
  push:
    branches: [claude/pm26-preparacion-tecnica]
    paths:
      - 'source-recovery/fuente-recuperado.js'
      - 'source-recovery/entrada-recuperada.js'
      - 'source-recovery/recuperar_candidato_p03b.py'
      - 'source-recovery/verificar-build-canonico.mjs'
      - 'source-recovery/package.json'
      - 'source-recovery/package-lock.json'
      - 'source-recovery/PM26_P03B_CIERRE.md'
      - 'tests/pm26/p03b-contract.mjs'
      - '.github/workflows/pm26-p03b-pipeline-canonico.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger lo que P03b no debe tocar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          # Comparado contra el cierre previo de la rama (PM26 P02,
          # 1060e2f), no contra origin/main -- ver PM26 P03a para la
          # explicacion de por que origin/main no es la base correcta.
          intocables='fuente.js
          index.html
          source-recovery/recuperar_candidato.py
          source-recovery/README.md
          source-recovery/PM01_CIERRE.md'
          cambiados="$(git diff --name-only 1060e2f5ec26cb4175150df449c95f7504c32df7..HEAD)"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            if echo "$cambiados" | grep -qxF "$archivo"; then
              echo "PM26 P03b no debe tocar: $archivo" >&2
              exit 1
            fi
          done <<< "$intocables"
          echo 'PM26_P03B_INTOCABLES_INTACTOS=PASS'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias fijadas de source-recovery
        working-directory: source-recovery
        run: npm ci
      - name: Contrato PM26 P03b (build real + gate + sin secretos + informe)
        run: node tests/pm26/p03b-contract.mjs

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias fijadas de source-recovery
        working-directory: source-recovery
        run: npm ci
      - name: Gate PM26 P03b -- pipeline canonico permanente
        run: |
          set -euo pipefail
          node tests/pm26/p03b-contract.mjs
          echo 'PM26_P03B_GATE_PIPELINE_CANONICO=PASS'
          echo 'AVISO: este gate certifica que la fuente canonica compila y conserva su logica de negocio conocida -- NO que el build sea byte a byte identico a fuente.js (no alcanzable, documentado), ni que fuente.js real haya sido sustituido.'
