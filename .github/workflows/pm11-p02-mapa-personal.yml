name: PM11 P02 mapa Personal actual

on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p02-mapa-personal.yml'
      - 'tests/pm11/P02_MAPA_PERSONAL_ACTUAL.md'
      - 'tests/pm11/p02-mapa-personal-contract.mjs'

permissions:
  contents: read

jobs:
  mapa-pm11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar cierre histórico P02
        run: |
          git merge-base --is-ancestor 1e21458b48a11302c59911ef966ded0aca3eb639 HEAD
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          git diff --quiet 1e21458b48a11302c59911ef966ded0aca3eb639..9cff6a788393afef067dc4f3e80d90cda686b7de -- fuente.js supabase/migrations
          echo 'PM11_P02_CIERRE_HISTORICO_SIN_CAMBIO_FUNCIONAL=1'

      - name: Sintaxis fuente
        run: node --check fuente.js

      - name: Contrato mapa Personal
        run: node tests/pm11/p02-mapa-personal-contract.mjs

      - name: Regresión Personal LA-017
        run: node tests/pm10/p07-personal-contract.mjs

      - name: Regresión checkpoint PM11
        run: node tests/pm11/p01-checkpoint-contract.mjs

      - name: Build reproducible actual
        run: |
          cd source-recovery
          npm ci
          npm run check
          npm run build:current
          cmp -s dist/fuente.js ../fuente.js
          echo 'PM11_P02_BUILD_REPRODUCIBLE=PASS'
          cd ..

      - name: Resumen P02
        run: |
          echo 'PM11_P02_MAPA_PERSONAL_ACTUAL=PASS'
          echo 'PM11_SIGUIENTE=P03_CONTRATO_IDENTIDAD_CICLO_VIDA_PERSONAL'
