name: PM10 P05 diagnostico LA-012 pedidos
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p05-diagnostico-pedidos.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Diagnosticar firmas y referencias Pedidos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          for q in ['function crearLogicaPedidos(', 'crearLogicaPedidos({', 'function Pedidos({', 'function guardarPedido() {']:
            print('\n===== QUERY',q,'=====')
            for m in list(re.finditer(re.escape(q),s))[:10]:
              a=max(0,m.start()-600); b=min(len(s),m.start()+5000)
              print('\nOFFSET',m.start(),'\n',s[a:b].replace('\n','\\n'))
          PY
