name: Diagnostico bootstrap UI context

on:
  push:
    branches:
      - claude/hotfix-bootstrap-ui-context

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hotfix-bootstrap-ui-context
      - name: Extraer persistencia exacta del bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          terms=['saveKey("empresas"','saveKey("locales"','saveKey("localActivoId"','setEmpresas(emps','setLocales(loc','setLocalActivoId(lai','function Locales','function Gestion','Desactivar','actualizarLocal(id','empresaNuevaId']
          out=[]
          for term in terms:
            out.append('\n'+'='*90+'\nTERM '+term+'\n'+'='*90+'\n')
            start=0; n=0
            while True:
              i=s.find(term,start)
              if i<0: break
              n+=1; a=max(0,i-5000); b=min(len(s),i+len(term)+6500)
              out.append(f'\n--- MATCH {n} @ {i} ---\n{s[a:b]}\n')
              start=i+len(term)
              if n>=8: break
            if n==0: out.append('[sin coincidencias]\n')
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/bootstrap-ui-persist.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Guardar diagnostico
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/bootstrap-ui-persist.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: guardar persistencia legacy empresa local"
          git push origin HEAD:claude/hotfix-bootstrap-ui-context
