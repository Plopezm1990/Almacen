name: Diagnostico bootstrap UI context

on:
  push:
    branches:
      - claude/hotfix-bootstrap-ui-context

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/hotfix-bootstrap-ui-context
      - name: Extraer fragmentos exactos del bundle
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('fuente.js').read_text(encoding='utf-8')
          patrones = {
            'loadKey_pin': r'loadKey\([^\n]{0,250}pinPropietario[^\n]{0,250}',
            'loadKey_empresas': r'loadKey\([^\n]{0,250}empresas[^\n]{0,250}',
            'loadKey_locales': r'loadKey\([^\n]{0,250}locales[^\n]{0,250}',
            'storage_get_impl': r'(?:get\s*:\s*async|async\s+get\s*\(|get\s*\([^)]*\)\s*\{)[\s\S]{0,3500}almacen_kv',
            'storage_global': r'window\.storage[\s\S]{0,4500}',
            'state_empresas': r'(?:setEmpresas|\[empresas\s*,\s*setEmpresas)[\s\S]{0,2500}',
            'state_locales': r'(?:setLocales|\[locales\s*,\s*setLocales)[\s\S]{0,2500}',
          }
          out=[]
          for nombre, pat in patrones.items():
            out.append('\n### '+nombre+'\n')
            ms=list(re.finditer(pat,s,re.I))[:8]
            if not ms:
              out.append('[sin coincidencias]\n')
              continue
            for n,m in enumerate(ms,1):
              i=m.start(); a=max(0,i-2200); b=min(len(s),m.end()+2200)
              out.append(f'\n--- {n} @ {i} ---\n{s[a:b]}\n')
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/bootstrap-ui-source-v3.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - name: Guardar diagnostico en la rama aislada
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add diagnostics/bootstrap-ui-source-v3.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: aislar lecturas legacy de empresa local y PIN"
          git push origin HEAD:claude/hotfix-bootstrap-ui-context
