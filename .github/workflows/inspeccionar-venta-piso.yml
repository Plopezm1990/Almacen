name: Inspeccionar venta con stock de piso
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/inspeccionar-venta-piso.yml
jobs:
  inspeccionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar PR4 y Chromium
        run: |
          git fetch origin preparacion-sin-netlify
          mkdir -p /tmp/site
          git archive origin/preparacion-sin-netlify | tar -x -C /tmp/site
          cd /tmp/site && python3 -m http.server 4231 --bind 127.0.0.1 >/tmp/http-venta.log 2>&1 &
          mkdir -p /tmp/venta-ui && cd /tmp/venta-ui
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Inspeccionar modal de cobro
        run: |
          cd /tmp/venta-ui
          cat > inspect.cjs <<'NODE'
          const { chromium }=require('playwright');
          const URL='http://127.0.0.1:4231/';
          async function abrir(page,texto){return page.evaluate(t=>{const r=document.querySelector('aside')||document.querySelector('nav');const n=v=>(v||'').replace(/\s+/g,' ').trim();const e=r&&[...r.querySelectorAll('button,a')].find(x=>n(x.innerText||x.textContent)===t);if(!e)return false;e.click();return true},texto)}
          async function dump(page,tag){const d=await page.evaluate(()=>({text:(document.body.innerText||'').replace(/\s+/g,' ').trim().slice(-3200),buttons:[...document.querySelectorAll('button')].map(x=>(x.innerText||x.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean).slice(-30),inputs:[...document.querySelectorAll('input')].map(x=>({type:x.type,placeholder:x.placeholder,value:x.value})),selects:[...document.querySelectorAll('select')].map(x=>({value:x.value,options:[...x.options].map(o=>({text:o.text,value:o.value}))})),labels:[...document.querySelectorAll('label')].map(x=>(x.innerText||x.textContent||'').replace(/\s+/g,' ').trim()).filter(Boolean).slice(-20)}));console.log(tag+'='+JSON.stringify(d,null,2))}
          (async()=>{const browser=await chromium.launch({headless:true});const ctx=await browser.newContext({serviceWorkers:'block',viewport:{width:1440,height:1100}});const page=await ctx.newPage();const sup=[];const err=[];page.on('pageerror',e=>err.push(e.message));await page.route('https://flqercbgpgmmfaakrwkc.supabase.co/**',r=>{sup.push(r.request().url());r.abort()});await page.addInitScript(()=>{localStorage.clear();const put=(k,v)=>localStorage.setItem('almacen:'+k,JSON.stringify(v));put('locales',[{id:'loc',nombre:'Local Prueba',activo:true}]);put('localActivoId','loc');put('productos',[{id:'p1',nombre:'Chocolate prueba',tipo:'final',unidad:'ud',stock:10,stockPisoVenta:5,stockMinimo:2,costo:4,precioVenta:8,ivaPct:10,localId:'loc',activo:true}]);for(const k of ['proveedores','pedidos','movimientos','conteos','fichasCosto','albaranes','gastosGenerales','empleados','fichajes','registrosAppcc','puntosControl','clientes','encargos','arqueos','movimientosCaja','devoluciones','turnos','nominas','facturasDirectas','ordenesProduccion','traspasos','auditoria','freidoras','registrosAceite','entrevistas'])put(k,[]);put('catalogoProv',{});put('historialRespaldos',[]);localStorage.setItem('almacen__pendientes','[]')});await page.goto(URL,{waitUntil:'domcontentloaded'});await page.waitForTimeout(900);await page.getByText('Trabajar solo en este equipo, sin sincronizar',{exact:false}).first().click();await page.waitForTimeout(900);if(!(await abrir(page,'Venta rápida')))throw new Error('No abre Venta rápida');await page.waitForTimeout(400);await page.getByText('Chocolate prueba',{exact:true}).first().click();await page.waitForTimeout(350);const cobrar=page.getByRole('button',{name:/Cobrar €8,00/});console.log('COBRAR_COUNT='+(await cobrar.count()));if(!(await cobrar.count()))throw new Error('No aparece Cobrar');await cobrar.first().click();await page.waitForTimeout(350);await dump(page,'MODAL_COBRO');console.log('SUPABASE_COUNT='+sup.length);console.log('ERRORS='+JSON.stringify(err));await browser.close();if(sup.length||err.length)process.exit(1);console.log('MODAL_COBRO_UI_OK=1')})().catch(e=>{console.error(e);process.exit(1)})
          NODE
          node inspect.cjs
