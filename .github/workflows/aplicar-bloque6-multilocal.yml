name: Aplicar bloque 6 multilocal
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-bloque6-multilocal.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche con guardas
        run: python3 .github/scripts/aplicar_bloque6_multilocal.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,1400p'
      - name: Guardas semánticas del bloque 6
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          requeridos=[
            'fichasCosto: fichasCostoDelLocalActivo',
            'productos: productosDelLocalActivo',
            'ordenesProduccion: ordenesProduccionDelLocalActivo',
            'puntosControl: puntosControlDelLocalActivo',
            'registrosAppcc: registrosAppccDelLocalActivo',
            'freidoras: freidorasDelLocalActivo',
            'registrosAceite: registrosAceiteDelLocalActivo',
            'localId: localActivoId || elaboradoOriginal.localId || null',
            'La producción incluye un ingrediente inexistente o de otro local.',
            'El aceite pertenece a otro local.',
            'const fichasCostoFinales =',
            'const ordenesProduccionFinales =',
            'const puntosControlFinales =',
            'const registrosAppccFinales =',
            'const freidorasFinales =',
            'const registrosAceiteFinales =',
            'const activos = (puntosControlDelLocalActivo || []).filter',
            '], [puntosControlDelLocalActivo, registrosAppccDelLocalActivo]);'
          ]
          for x in requeridos:
              assert x in s, x
          antiguos=[
            'tab === "produccion" && /* @__PURE__ */ import_react4.default.createElement(Produccion, { fichasCosto, productos, ordenesProduccion, producir, anularProduccion, traspasarStock })',
            'tab === "etiquetas" && /* @__PURE__ */ import_react4.default.createElement(EtiquetasCatalogo, { productos, fichasCosto, alergenosDeFicha })'
          ]
          for x in antiguos:
              assert x not in s, x
          print('GUARDAS_SEMANTICAS_BLOQUE6_OK')
          PY
      - name: Guardar y retirar herramientas temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/aplicar_bloque6_multilocal.py
          rm -f .github/workflows/aplicar-bloque6-multilocal.yml
          rm -f .github/workflows/inspeccionar-produccion-appcc-aceite-bloque6.yml
          rm -f .github/workflows/inspeccionar-anclas-bloque6.yml
          rm -f .github/workflows/inspeccionar-fichas-appcc-bloque6.yml
          rm -f .github/workflows/inspeccionar-alertas-migracion-bloque6.yml
          git add fuente.js .github/scripts/aplicar_bloque6_multilocal.py .github/workflows/aplicar-bloque6-multilocal.yml .github/workflows/inspeccionar-produccion-appcc-aceite-bloque6.yml .github/workflows/inspeccionar-anclas-bloque6.yml .github/workflows/inspeccionar-fichas-appcc-bloque6.yml .github/workflows/inspeccionar-alertas-migracion-bloque6.yml
          git diff --cached --check
          git commit -m 'Aislar producción APPCC y aceite por local'
          git push origin HEAD:multilocal-fase-3