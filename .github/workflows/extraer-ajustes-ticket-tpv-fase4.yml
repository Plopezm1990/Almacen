name: Extraer contexto ajustes ticket TPV

on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/extraer-ajustes-ticket-tpv-fase4.yml'

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer y guardar contexto
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          partes=[]
          for titulo,pat,antes,despues in [
            ('INVOCACION','createElement(VentaRapida',800,1800),
            ('NORMALIZADO','return Object.entries(porVenta).map',0,4200),
            ('TICKET','TICKET / RECIBO INTERNO',2500,6500),
          ]:
            i=s.find(pat)
            partes.append(f'===== {titulo} idx={i} =====\n'+(s[max(0,i-antes):i+despues] if i>=0 else 'NO ENCONTRADO'))
          Path('.github/tmp-inspeccion-ajustes-ticket.txt').write_text('\n\n'.join(partes),encoding='utf-8')
          PY
          git config user.name 'Plopezm1990'
          git config user.email 'pedroroger1990@gmail.com'
          git add .github/tmp-inspeccion-ajustes-ticket.txt
          git commit -m 'Guardar inspección temporal de ajustes del ticket'
          git push origin HEAD:tpv-ventas-fase-4
