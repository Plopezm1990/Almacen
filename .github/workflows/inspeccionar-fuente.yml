name: Inspeccionar fuente temporal
on:
  push:
    branches: [inspeccion-fuente-locales]
    paths:
      - .github/workflows/inspeccionar-fuente.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspeccion-fuente-locales
      - name: Extraer fragmentos relevantes
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const src = fs.readFileSync('fuente.js','utf8');
          fs.rmSync('tmp-inspeccion', { recursive: true, force: true });
          fs.mkdirSync('tmp-inspeccion', { recursive: true });
          function functionBlock(name) {
            const start = src.indexOf(`function ${name}(`);
            if (start < 0) return `NOT FOUND function ${name}\n`;
            const next = src.indexOf('\nfunction ', start + 10);
            const end = next < 0 ? Math.min(src.length, start + 150000) : next;
            return `START ${start} END ${end} LEN ${end-start}\n` + src.slice(start, end);
          }
          fs.writeFileSync('tmp-inspeccion/meta.txt', `SIZE ${src.length}\n`);
          const funcs = [
            'Dashboard','Resultados','LibroIva','GestionAlmacen','crearMotorStock',
            'crearLogicaGastos','crearLogicaPersonal','crearLogicaFacturasDirectas',
            'crearLogicaAlbaranes','crearLogicaPedidos','crearLogicaVenta',
            'crearLogicaEncargos','crearLogicaFichaje','crearLogicaAppcc'
          ];
          for (const name of funcs) fs.writeFileSync(path.join('tmp-inspeccion', `fn-${name}.txt`), functionBlock(name));
          const contenido = src.indexOf('const contenido =');
          fs.writeFileSync('tmp-inspeccion/contenido.txt', contenido < 0 ? 'NOT FOUND' : src.slice(contenido, Math.min(src.length, contenido + 52000)));
      - name: Guardar inspección en rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-inspeccion
          git diff --cached --quiet && exit 0
          git commit -m "Resultados temporales de inspección [skip ci]"
          git push origin HEAD:inspeccion-fuente-locales
