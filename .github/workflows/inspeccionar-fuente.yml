name: Finalizar filtro por local temporal
on:
  push:
    branches: [inspeccion-fuente-locales]
    paths:
      - .github/workflows/inspeccionar-fuente.yml
jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspeccion-fuente-locales
      - name: Validar sintaxis final
        run: node --check fuente.js
      - name: Validar alcance y migración actual
        shell: node {0}
        run: |
          const fs = require('fs');
          const s = fs.readFileSync('fuente.js','utf8');
          const obligatorios = [
            'function SelectorLocalInformes(',
            'Todos los locales',
            'gastosGenerales: gastosGeneralesInforme',
            'facturasDirectas: facturasDirectasInforme',
            'localId: producto.localId || null',
            'l2.activo === false && !l2.fusionadoEn'
          ];
          for (const x of obligatorios) if (!s.includes(x)) throw new Error('Falta marcador final: ' + x);
          const aparicionesSelector = (s.match(/SelectorLocalInformes/g) || []).length;
          if (aparicionesSelector !== 2) throw new Error('El selector debe definirse y usarse una sola vez; apariciones=' + aparicionesSelector);

          const locales = [
            { id: 'mth545idjd8jw6', activo: true, nombre: 'Chocoloyos S.L', direccion: '' },
            { id: 'mteeqisnamymz7', activo: true, nombre: 'Chocoloyos S.L', direccion: '' }
          ];
          const idProductoHistorico = 'mtedeb6gkvw80r';
          const nombres = new Set(locales.map(l => String(l.nombre || '').trim().toLowerCase()).filter(Boolean));
          const idsLocales = new Set(locales.map(l => l.id));
          const huerfanos = [idProductoHistorico].filter(id => !idsLocales.has(id));
          if (!(huerfanos.length === 1 && nombres.size === 1)) throw new Error('El caso real de reconciliación no se reconoce');
          const canonico = huerfanos[0];
          const reparados = [
            { ...locales[0], id: canonico, activo: true, fusionadoEn: null },
            ...locales.map(l => ({ ...l, activo: false, fusionadoEn: canonico }))
          ];
          const activosVisibles = reparados.filter(l => l.activo !== false && !l.fusionadoEn);
          if (activosVisibles.length !== 1 || activosVisibles[0].id !== idProductoHistorico) throw new Error('La reconciliación no conserva el ID usado por los productos');
          console.log('OK sintaxis, alcance y reconciliación del caso real');
      - name: Retirar apoyo temporal
        run: |
          rm -rf tmp-inspeccion
          rm -f tmp-aplicar-local.js
          rm -f .github/workflows/inspeccionar-fuente.yml
      - name: Guardar rama limpia
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retirar apoyo temporal de filtro por local [skip ci]"
          git push origin HEAD:inspeccion-fuente-locales
