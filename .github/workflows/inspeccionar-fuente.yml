name: Aplicar filtro por local temporal
on:
  push:
    branches: [inspeccion-fuente-locales]
    paths:
      - .github/workflows/inspeccionar-fuente.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspeccion-fuente-locales
      - name: Aplicar cambios acotados
        run: node tmp-aplicar-local.js
      - name: Validar sintaxis
        run: node --check fuente.js
      - name: Validar marcadores
        shell: node {0}
        run: |
          const fs = require('fs');
          const s = fs.readFileSync('fuente.js','utf8');
          const checks = [
            ['SelectorLocalInformes', s.includes('function SelectorLocalInformes(')],
            ['Todos los locales', s.includes('Todos los locales')],
            ['localInformeId', s.includes('localInformeId')],
            ['movimientos con localId', s.includes('localId: producto.localId || null')],
            ['Resultados filtrados', s.includes('gastosGenerales: gastosGeneralesInforme')],
            ['Libro IVA filtrado', s.includes('facturasDirectas: facturasDirectasInforme')]
          ];
          const fallos = checks.filter(([, ok]) => !ok);
          if (fallos.length) throw new Error('Fallan marcadores: ' + fallos.map(([n]) => n).join(', '));
          fs.appendFileSync('tmp-inspeccion/patch-check.txt', checks.map(([n, ok]) => (ok ? 'OK ' : 'FAIL ') + n).join('\n') + '\n');
      - name: Guardar parche solo en rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuente.js tmp-inspeccion/patch-check.txt
          git diff --cached --quiet && exit 0
          git commit -m "Filtro por local en informes [skip ci]"
          git push origin HEAD:inspeccion-fuente-locales
