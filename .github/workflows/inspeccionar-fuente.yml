name: Inspeccionar fuente temporal
on:
  push:
    branches: [inspeccion-fuente-locales]
    paths:
      - .github/workflows/inspeccionar-fuente.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: inspeccion-fuente-locales
      - name: Extraer fragmentos relevantes
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const src = fs.readFileSync('fuente.js','utf8');
          fs.rmSync('tmp-inspeccion', { recursive: true, force: true });
          fs.mkdirSync('tmp-inspeccion', { recursive: true });
          const specs = [
            ['selector', ['SelectorVistaInformes']],
            ['dashboard', ['Dashboard', 'dashboard']],
            ['resultados', ['Resultados', 'resultados']],
            ['libro-iva', ['Libro IVA', 'libro IVA', 'libroIva', 'libroIVA']],
            ['local-ids', ['negocioLocalId', 'localActivoId']],
            ['todos-locales', ['Todos los locales', 'todos los locales']]
          ];
          function extract(terms, before=7000, after=11000, max=8) {
            const hits = [];
            const seen = new Set();
            for (const term of terms) {
              let from = 0;
              while (hits.length < max) {
                const i = src.indexOf(term, from);
                if (i < 0) break;
                const key = Math.floor(i / 1500);
                if (!seen.has(key)) {
                  seen.add(key);
                  hits.push({ term, i, text: src.slice(Math.max(0,i-before), Math.min(src.length,i+term.length+after)) });
                }
                from = i + term.length;
              }
            }
            hits.sort((a,b)=>a.i-b.i);
            return hits.map((h,n)=>`\n===== HIT ${n+1}: ${h.term} @ ${h.i} =====\n${h.text}\n`).join('\n');
          }
          fs.writeFileSync('tmp-inspeccion/meta.txt', `SIZE ${src.length}\n`);
          for (const [name, terms] of specs) {
            fs.writeFileSync(path.join('tmp-inspeccion', name + '.txt'), extract(terms));
          }
      - name: Guardar inspección en rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-inspeccion
          git diff --cached --quiet && exit 0
          git commit -m "Resultados temporales de inspección [skip ci]"
          git push origin HEAD:inspeccion-fuente-locales
