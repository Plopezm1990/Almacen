name: Auditoría final multilocal fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/auditoria-final-multilocal-fase3.yml
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Revisar módulos e indicadores restantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          terminos=[
            'function crearLogicaGastos(',
            'function crearLogicaFichaje(',
            'function crearLogicaTurnos(',
            'function crearLogicaEmpleados(',
            'tab === "gastos"',
            'tab === "fichaje"',
            'tab === "turnos"',
            'tab === "personal"',
            'tab === "mapa"',
            'tab === "diagnostico"',
            'const recordatorioConteo =',
            '{ id: "traspasos", label:',
            'descuadresPendientes',
            'diagnosticoStock',
            'movimientosParaReconciliar',
            'tab === "reportes"'
          ]
          for termino in terminos:
              print('\n===== '+termino+' =====')
              pos=[]; k=0
              while True:
                  i=s.find(termino,k)
                  if i<0: break
                  pos.append(i); k=i+1
              print('POS',pos[:20])
              for i in pos[:8]:
                  print('\n--- contexto',i,'---')
                  print(s[max(0,i-1800):min(len(s),i+5000)])
          PY