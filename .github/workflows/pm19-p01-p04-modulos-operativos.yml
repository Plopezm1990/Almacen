name: PM19 P01-P04 módulos operativos restantes

on:
  push:
    branches: [claude/pm19-pendiente]
    paths:
      - 'fuente.js'
      - 'tests/pm19/**'
      - '.github/workflows/pm19-p01-p04-modulos-operativos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger main y alcance (sin cambios en supabase/)
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "cc7cab7cc3781012ab3e7729dfa2af7476e19eae"
          unexpected="$(git diff --name-only origin/main..HEAD -- supabase/ || true)"
          if [ -n "$unexpected" ]; then
            echo 'PM19 P01-P04 es un cambio de frontend puro: no debe tocar supabase/' >&2
            echo "$unexpected" >&2
            exit 1
          fi
          echo 'PM19_MAIN_FROZEN=PASS'
          echo 'PM19_SIN_CAMBIOS_SUPABASE=PASS'
      - name: Sintaxis bundle
        run: node --check fuente.js
      - name: Contratos PM19 (P01-P04)
        shell: bash
        run: |
          set -euo pipefail
          node tests/pm19/p01-appcc-historico-trazable-contract.mjs
          node tests/pm19/p01-wiring-appcc-contract.mjs
          node tests/pm19/p02-aceite-responsable-contract.mjs
          node tests/pm19/p02-wiring-aceite-contract.mjs
          node tests/pm19/p03-traspaso-local-cerrado-contract.mjs
          node tests/pm19/p03-wiring-traspasos-contract.mjs
          node tests/pm19/p04-merma-descuenta-una-vez-contract.mjs
          node tests/pm19/p04-wiring-merma-contract.mjs
      - name: Regresión completa (todas las suites vigentes)
        shell: bash
        run: |
          set -euo pipefail
          for d in tests/g1 tests/pm04 tests/pm05 tests/pm07 tests/pm08 tests/pm09 tests/pm10 tests/pm11-compra tests/pm12 tests/pm13 tests/pm14 tests/pm15 tests/pm16 tests/pm17 tests/pm18; do
            for t in "$d"/*.mjs; do
              [ -f "$t" ] || continue
              node "$t"
            done
          done
          echo 'PM19_REGRESION_COMPLETA=PASS'
      - name: Sin secretos
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eqi 'service_role|SUPABASE_SERVICE_ROLE_KEY|sb_secret_' \
            tests/pm19/*.mjs tests/pm19/*.md
          echo 'PM19_NO_SECRET=PASS'

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gate PM19 P01-P04
        run: |
          set -euo pipefail
          node tests/pm19/p01-appcc-historico-trazable-contract.mjs
          node tests/pm19/p01-wiring-appcc-contract.mjs
          node tests/pm19/p02-aceite-responsable-contract.mjs
          node tests/pm19/p02-wiring-aceite-contract.mjs
          node tests/pm19/p03-traspaso-local-cerrado-contract.mjs
          node tests/pm19/p03-wiring-traspasos-contract.mjs
          node tests/pm19/p04-merma-descuenta-una-vez-contract.mjs
          node tests/pm19/p04-wiring-merma-contract.mjs
          echo 'PM19_GATE_FINAL=PASS'
