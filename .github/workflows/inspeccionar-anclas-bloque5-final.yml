name: Inspeccionar anclas finales bloque 5
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-anclas-bloque5-final.yml
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer anclas finales
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def f(nombre,marcador,siguiente,maxlen=10000):
              i=s.find(marcador); assert i>=0
              j=s.find(siguiente,i+len(marcador)); assert j>=0
              print(f'\n===== {nombre} @ {i} =====\n'+s[i:min(j,i+maxlen)])
          def allx(nombre,marcador,antes=350,despues=700):
              pos=[]; i=0
              while True:
                  j=s.find(marcador,i)
                  if j<0: break
                  pos.append(j); i=j+1
              print(f'\n===== {nombre} {pos} =====')
              for j in pos: print(s[max(0,j-antes):min(len(s),j+despues)])
          f('CAJA CORE','function crearLogicaCaja(','function crearLogicaMovimientosCaja(',7000)
          allx('ENCARGOS URGENTES','encargosUrgentes')
          allx('ARQUEOS','arqueos')
          allx('MOVIMIENTOS CAJA','movimientosCaja')
          allx('PISO VENTA BAJO','pisoVentaBajo')
          allx('TRASPASOS DATA','traspasos')
          allx('DEVOLUCIONES DATA','devoluciones')
          allx('PRODUCTOS DEL LOCAL','productosDelLocalActivo')
          PY