name: PM12 P09 diagnostico temp

on:
  push:
    branches: [pm12-conteo-estados-honestos]
    paths:
      - '.github/workflows/pm12-p09-diagnostico-temp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnosticar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm12-conteo-estados-honestos
          fetch-depth: 0
      - name: Proteger QA y main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pm12-conteo-estados-honestos"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
      - name: Extraer focos P09
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          src = Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8')
          needles = [
            'function crearLogicaConteos', 'conteo_vacio:', 'Cerrar conteo parcial',
            'Historial', 'historial', 'estadoDerivado', 'ajustesAplicados',
            'motivoParcial', 'responsables', 'COMPLETADO', 'CANCELADO', 'PARCIAL'
          ]
          lines = src.splitlines()
          out=[]
          seen=set()
          for needle in needles:
            out.append(f'\n===== {needle} =====')
            hits=[i for i,l in enumerate(lines) if needle in l]
            out.append(f'HITS={len(hits)}')
            for i in hits[:25]:
              a=max(0,i-8); b=min(len(lines),i+12)
              key=(a,b)
              if key in seen: continue
              seen.add(key)
              out.append(f'--- lines {a+1}-{b} ---')
              for j in range(a,b): out.append(f'{j+1}: {lines[j]}')
          Path('tests/pm12/P09_DIAGNOSTICO_TEMP.txt').write_text('\n'.join(out)+'\n', encoding='utf-8')
          PY
      - name: Commit diagnostico
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/pm12/P09_DIAGNOSTICO_TEMP.txt
          git commit -m "PM12 P09: diagnostico temporal historial informes movil"
          git push origin HEAD:pm12-conteo-estados-honestos
