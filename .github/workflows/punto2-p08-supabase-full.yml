name: "Punto 2 (134 pruebas): PM12 P08 y PM33 P05 -- entorno aislado real (PG + Auth + PostgREST)"

# Parte de la reconstrucción honesta del Punto 2 del seguimiento de cierre
# (deuda de pruebas fallidas): los 3 casos de la batería que requieren
# Auth/PostgREST/Postgres reales (tests/pm12/supabase-full/*.mjs,
# tests/pm33/supabase-full/p05-auth-postgrest-contract.mjs) no pueden
# ejecutarse en el entorno de trabajo local de esta sesión (sin Docker
# operativo). Este workflow reutiliza EXACTAMENTE el patrón ya validado en
# pm12-p08-produccion-segura.yml y pm33-p05-entorno-aislado.yml (mismo
# supabase CLI local, mismos excludes de servicios) para obtener un
# resultado real, no simulado, sobre el SHA exacto de esta rama.
on:
  push:
    branches: [claude/punto2-134-pruebas]
    paths:
      - 'tests/pm12/supabase-full/**'
      - 'tests/pm12/prod-baseline/**'
      - 'tests/pm33/supabase-full/**'
      - 'supabase/migrations/20260907155028_pm12_p08_stock_atomico.sql'
      - 'supabase/migrations/20260919225831_pm33_p05_identidad_antes_de_actividad.sql'
      - '.github/workflows/punto2-p08-supabase-full.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  pm12-p08-supabase-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar rama dedicada y release sin tocar
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "claude/punto2-134-pruebas"
          git fetch origin release --quiet
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          git merge-base --is-ancestor origin/release HEAD
          echo 'MAIN_FROZEN=1'
          echo 'RELEASE_ANCESTOR_OK=1'

      - name: Preparar Supabase local sin fixtures QA (baseline productiva PM12 P08)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix tests/pm12/supabase-full --no-audit --no-fund
          node tests/pm12/supabase-full/prepare-production-baseline.mjs

      - name: Iniciar Auth, PostgREST y PostgreSQL desechables
        shell: bash
        run: |
          set -euo pipefail
          tests/pm12/supabase-full/node_modules/.bin/supabase start \
            --workdir tests/pm12/supabase-full \
            -x realtime,storage-api,imgproxy,studio,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
          tests/pm12/supabase-full/node_modules/.bin/supabase status \
            --workdir tests/pm12/supabase-full -o env \
            > tests/pm12/supabase-full/supabase/.temp/status.env

      - name: P08 real con Auth JWT, PostgREST y RLS
        run: node tests/pm12/supabase-full/p08-auth-postgrest-rls-contract.mjs

      - name: Contrato de minimalidad de permisos y constraints (baseline productiva)
        run: node tests/pm12/supabase-full/p08-production-baseline-contract.mjs

      - name: Detener Supabase desechable
        if: always()
        run: tests/pm12/supabase-full/node_modules/.bin/supabase stop --workdir tests/pm12/supabase-full --no-backup || true

  pm33-p05-supabase-full:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar rama dedicada y release sin tocar
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "claude/punto2-134-pruebas"
          git fetch origin release --quiet
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          git merge-base --is-ancestor origin/release HEAD
          echo 'MAIN_FROZEN=1'
          echo 'RELEASE_ANCESTOR_OK=1'

      - name: Instalar dependencias del entorno aislado
        shell: bash
        run: npm ci --prefix tests/pm33/supabase-full --no-audit --no-fund

      - name: Iniciar Auth, PostgREST y PostgreSQL 17 desechables
        shell: bash
        run: |
          set -euo pipefail
          tests/pm33/supabase-full/node_modules/.bin/supabase start \
            --workdir tests/pm33/supabase-full \
            -x realtime,storage-api,imgproxy,studio,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
          tests/pm33/supabase-full/node_modules/.bin/supabase status \
            --workdir tests/pm33/supabase-full -o env \
            > tests/pm33/supabase-full/supabase/.temp/status.env

      - name: P05 real -- Auth JWT + PostgREST + RLS contra PG17 real
        run: node tests/pm33/supabase-full/p05-auth-postgrest-contract.mjs

      - name: Detener Supabase desechable
        if: always()
        run: tests/pm33/supabase-full/node_modules/.bin/supabase stop --workdir tests/pm33/supabase-full --no-backup || true
