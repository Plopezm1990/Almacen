name: G1 Punto 4 revalidar LA023

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p04-la023.yml'
      - 'tests/g1/P04_LA023_EVIDENCIA.md'
      - 'tests/g1/p04-la023-contract.mjs'
      - 'fuente.js'
      - 'source-recovery/fuente-recuperado.js'
      - 'source-recovery/package.json'
      - 'source-recovery/package-lock.json'
      - 'docs/plan-maestro/PM02_LA023_EVIDENCIA.txt'
      - 'docs/plan-maestro/PM03_CONTRATOS_MINIMOS_PROPUESTA.md'

permissions:
  contents: read

jobs:
  la023:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar descendencia de PM10 final
        run: |
          git merge-base --is-ancestor 94d37cc7a5176e3a44d00f8f8bfb79a630dae314 HEAD
          echo 'G1_P04_DESCIENDE_PM10_FINAL=1'
      - name: Sintaxis del candidato
        run: node --check fuente.js
      - name: Recompilar fuente recuperada
        run: |
          cd source-recovery
          npm ci --no-audit --no-fund
          npm run check
          npm run build
          node --check dist/fuente.js
      - name: Contrato G1.4 LA023
        run: node tests/g1/p04-la023-contract.mjs
      - name: Mantener regresión de puntos previos
        run: |
          node tests/g1/p02-evidence-map-contract.mjs
          node tests/g1/p03-la019-contract.mjs
      - name: Resumen
        run: |
          echo 'G1_P04_LA023=PASS'
          echo 'G1_GATE_SUPERADO=NO'
          echo 'G1_SIGUIENTE=P05_PERMISOS_AISLAMIENTO'
