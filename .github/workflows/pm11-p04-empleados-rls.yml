name: PM11 P04 entidad empleados y RLS

on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p04-empleados-rls.yml'
      - 'tests/pm11/P04_ENTIDAD_SQL_EMPLEADOS_RLS_EVIDENCIA.md'
      - 'tests/pm11/p04-empleados-rls-contract.mjs'
      - 'supabase/migrations/20260906081500_pm11_empleados_entidad_rls.sql'
      - 'supabase/migrations/20260906082500_pm11_guard_perfiles_sensibles.sql'

permissions:
  contents: read

jobs:
  empleados-rls-pm11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar origen, alcance P04 y main intacto
        run: |
          git merge-base --is-ancestor 1e21458b48a11302c59911ef966ded0aca3eb639 HEAD
          git merge-base --is-ancestor bb77ce9e7bb8c5057f160044a1c5b0201addf119 HEAD
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          git diff --quiet bb77ce9e7bb8c5057f160044a1c5b0201addf119 -- fuente.js source-recovery
          test "$(git diff --name-only bb77ce9e7bb8c5057f160044a1c5b0201addf119 -- supabase/migrations | sort)" = "$(printf '%s\n%s' 'supabase/migrations/20260906081500_pm11_empleados_entidad_rls.sql' 'supabase/migrations/20260906082500_pm11_guard_perfiles_sensibles.sql' | sort)"
          echo 'PM11_P04_ALCANCE=PASS'
          echo "PM11_P04_SHA=$(git rev-parse HEAD)"

      - name: Sintaxis fuente
        run: node --check fuente.js

      - name: Contrato P04 entidad empleados y RLS
        run: node tests/pm11/p04-empleados-rls-contract.mjs

      - name: Regresión P03 identidad y ciclo de vida
        run: node tests/pm11/p03-identidad-ciclo-vida-contract.mjs

      - name: Regresión P02 mapa Personal
        run: node tests/pm11/p02-mapa-personal-contract.mjs

      - name: Regresión Personal LA-017
        run: node tests/pm10/p07-personal-contract.mjs

      - name: Regresión checkpoint PM11
        run: node tests/pm11/p01-checkpoint-contract.mjs

      - name: Build reproducible actual
        run: |
          cd source-recovery
          npm ci
          npm run check
          npm run build:current
          cmp -s dist/fuente.js ../fuente.js
          echo 'PM11_P04_BUILD_REPRODUCIBLE=PASS'
          cd ..

      - name: Resumen P04
        run: |
          echo 'PM11_P04_ENTIDAD_SQL_EMPLEADOS_RLS=PASS'
          echo 'PM11_SIGUIENTE=P05_RPC_ALTA_EDICION_BAJA_REACTIVACION'
