name: Inspeccionar TPV ventas fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/inspeccionar-tpv-ventas-fase4.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer motor completo de ventas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def bloque(inicio, fin, maxlen=30000):
            i=s.index(inicio)
            j=s.index(fin,i)
            print(s[i:min(j,i+maxlen)])
          print('===== crearLogicaVenta =====')
          bloque('function crearLogicaVenta(', 'function crearLogicaTraspasos(', 42000)
          print('\n===== VentaRapida COMPLETA =====')
          bloque('function VentaRapida(', 'function Traspasos(', 50000)
          print('\n===== helpers venta =====')
          for t in ['function esVenta(', 'function esSalida(', 'function cantidadConSigno(']:
            try:
              i=s.index(t); print(s[i:i+5000])
            except ValueError: print('NO ENCONTRADO',t)
          PY
