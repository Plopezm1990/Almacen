name: Diagnosticar baseline TPV fase 4

on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/aplicar-ticket-tpv-fase4-v2.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validar fuente estable sin aplicar ticket
        run: node --check fuente.js

      - name: Comparar arranque local de la versión estable
        run: |
          set -u
          python3 -m http.server 8765 >/tmp/tpv-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=9000 --dump-dom http://127.0.0.1:8765/ >/tmp/tpv-dom.html 2>/tmp/tpv-chrome.log || true
          if grep -q 'Error al arrancar' /tmp/tpv-dom.html; then echo 'BASELINE_LOCAL_TAMBIEN_ERROR_AL_ARRANCAR=1'; else echo 'BASELINE_LOCAL_ARRANCA=1'; fi
          grep -Ei 'Uncaught|ReferenceError|TypeError|SyntaxError' /tmp/tpv-chrome.log | tail -n 80 || true
          grep -o 'Error al arrancar[^<]*' /tmp/tpv-dom.html | head -n 5 || true

      - name: Limpiar herramientas temporales
        run: |
          rm -f .github/scripts/aplicar_ticket_tpv_fase4_v2.py
          rm -f .github/workflows/aplicar-ticket-tpv-fase4-v2.yml
          git config user.name 'Plopezm1990'
          git config user.email 'pedroroger1990@gmail.com'
          git add .github/scripts .github/workflows
          git diff --cached --check
          git commit -m 'Limpiar diagnostico temporal del ticket TPV'
          git push origin HEAD:tpv-ventas-fase-4
