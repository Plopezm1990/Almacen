name: PM27 - Ajuste drift vivo reconciliacion

on:
  push:
    branches:
      - claude/pm27-prod-reconciliacion
    paths:
      - .github/workflows/pm27-prod-recon-live-drift-fix.yml

permissions:
  contents: write

jobs:
  patch-live-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact trigger SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Guard parent certified SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '7637617356a479b9deb65b5a68c6ad7f7b755fca'

      - name: Patch observed production pm07 validator
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          mig = Path('supabase/migrations/20260914170500_pm27_prod_reconciliacion_pre_c24.sql')
          recovery = Path('supabase/qa-solo/pm27_prod_recovery_pre_c24.sql')
          fixture = Path('tests/pm27/fixtures/prod-pre-reconciliacion-from-c24.sql')
          recovery_verify = Path('tests/pm27/fixtures/prod-reconciliacion-recovery-verify.sql')
          static = Path('tests/pm27/prod-reconciliacion-pre-c24.mjs')

          s = mig.read_text()
          old = """  if to_regprocedure('private.pm06_puede_gestionar_finanzas()') is not null
             or to_regprocedure('private.pm07_puede_vender()') is not null
             or to_regprocedure('private.pm07_validar_cantidad(numeric,boolean,smallint)') is not null
             or to_regprocedure('private.pm08_local_operable(text,text)') is not null
          """
          new = """  if to_regprocedure('private.pm06_puede_gestionar_finanzas()') is not null
             or to_regprocedure('private.pm07_puede_vender()') is not null
             or to_regprocedure('private.pm08_local_operable(text,text)') is not null
          """
          if s.count(old) != 1:
              raise SystemExit('preflight absence block unexpected')
          s = s.replace(old, new, 1)

          needle = """  if to_regprocedure('public.registrar_venta_stock(text,text,text,text,numeric,jsonb)') is not null
          """
          validation = """  -- Produccion ya contiene una variante PM07 mas endurecida que QA. Se preserva
          -- byte-semanticamente: debe existir, ser IMMUTABLE, invoker, search_path vacio,
          -- rechazar no-finitos y no exponer EXECUTE a PUBLIC/anon/authenticated.
          if to_regprocedure('private.pm07_validar_cantidad(numeric,boolean,smallint)') is null then
            raise exception 'PM27_PROD_RECON_PREFLIGHT_FALLO: falta pm07_validar_cantidad productiva';
          end if;
          if not exists (
            select 1
              from pg_proc p
             where p.oid = 'private.pm07_validar_cantidad(numeric,boolean,smallint)'::regprocedure
               and p.provolatile = 'i'
               and p.prosecdef is false
               and coalesce(p.proconfig, '{}'::text[]) @> array['search_path=""']::text[]
               and strpos(pg_get_functiondef(p.oid), $$p_cantidad::text in ('NaN','Infinity','-Infinity')$$) > 0
               and strpos(pg_get_functiondef(p.oid), 'unidad_indivisible') > 0
               and strpos(pg_get_functiondef(p.oid), 'precision_cantidad_excedida') > 0
          )
          or has_function_privilege('anon', 'private.pm07_validar_cantidad(numeric,boolean,smallint)', 'EXECUTE')
          or has_function_privilege('authenticated', 'private.pm07_validar_cantidad(numeric,boolean,smallint)', 'EXECUTE')
          or exists (
            select 1
              from pg_proc p
              cross join lateral aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) acl
             where p.oid = 'private.pm07_validar_cantidad(numeric,boolean,smallint)'::regprocedure
               and acl.grantee = 0
               and acl.privilege_type = 'EXECUTE'
          ) then
            raise exception 'PM27_PROD_RECON_PREFLIGHT_FALLO: pm07_validar_cantidad productiva inesperada';
          end if;

          """
          if s.count(needle) != 1:
              raise SystemExit('RPC target block unexpected')
          s = s.replace(needle, validation + needle, 1)

          pattern = re.compile(r"create or replace function private\.pm07_validar_cantidad\([\s\S]*?\n\$function\$;\n\n(?=create or replace function private\.pm07_puede_vender\(\))")
          s, n = pattern.subn('', s, count=1)
          if n != 1:
              raise SystemExit('pm07 function creation block unexpected')
          revoke = "revoke all on function private.pm07_validar_cantidad(numeric,boolean,smallint) from public, anon, authenticated;\n"
          if s.count(revoke) != 1:
              raise SystemExit('pm07 revoke line unexpected')
          s = s.replace(revoke, '', 1)
          mig.write_text(s)

          r = recovery.read_text()
          drop = "drop function if exists private.pm07_validar_cantidad(numeric,boolean,smallint);\n"
          if r.count(drop) != 1:
              raise SystemExit('recovery pm07 drop unexpected')
          recovery.write_text(r.replace(drop, '', 1))

          f = fixture.read_text()
          drop_fixture = "drop function private.pm07_validar_cantidad(numeric,boolean,smallint);\n"
          if f.count(drop_fixture) != 1:
              raise SystemExit('fixture pm07 drop unexpected')
          prod_pm07 = """create or replace function private.pm07_validar_cantidad(p_cantidad numeric, p_fraccionable boolean, p_precision smallint)
          returns numeric
          language plpgsql
          immutable
          set search_path=''
          as $function$
          declare v numeric;
          begin
            if p_cantidad is null or p_cantidad::text in ('NaN','Infinity','-Infinity') then raise exception 'cantidad_invalida'; end if;
            v := round(p_cantidad,greatest(0,least(6,coalesce(p_precision,0))));
            if v <= 0 then raise exception 'cantidad_invalida'; end if;
            if not coalesce(p_fraccionable,false) and v <> trunc(v) then raise exception 'unidad_indivisible'; end if;
            if p_cantidad <> v then raise exception 'precision_cantidad_excedida'; end if;
            return v;
          end;
          $function$;
          revoke all on function private.pm07_validar_cantidad(numeric,boolean,smallint) from public, anon, authenticated;
          """
          fixture.write_text(f.replace(drop_fixture, prod_pm07, 1))

          rv = recovery_verify.read_text()
          rv_needle = """  if not has_function_privilege('authenticated','public.descontar_stock_carrito(jsonb,text)','EXECUTE')
          """
          rv_check = """  if to_regprocedure('private.pm07_validar_cantidad(numeric,boolean,smallint)') is null
             or has_function_privilege('authenticated','private.pm07_validar_cantidad(numeric,boolean,smallint)','EXECUTE')
             or has_function_privilege('anon','private.pm07_validar_cantidad(numeric,boolean,smallint)','EXECUTE')
             or strpos(pg_get_functiondef('private.pm07_validar_cantidad(numeric,boolean,smallint)'::regprocedure), $$p_cantidad::text in ('NaN','Infinity','-Infinity')$$) = 0 then
            raise exception 'recovery_pm07_productiva';
          end if;
          """
          if rv.count(rv_needle) != 1:
              raise SystemExit('recovery verify insertion point unexpected')
          recovery_verify.write_text(rv.replace(rv_needle, rv_check + rv_needle, 1))

          st = static.read_text()
          st_needle = "check('SNAPSHOT_RECOVERY_PRIVADO',"
          idx = st.find(st_needle)
          if idx < 0:
              raise SystemExit('static insertion point unexpected')
          line_end = st.find('\n', idx)
          check = "\ncheck('PM07_PRODUCTIVA_PRESERVADA', sql.includes('pm07_validar_cantidad productiva inesperada') && !sql.includes('create or replace function private.pm07_validar_cantidad(') && !recovery.includes('drop function if exists private.pm07_validar_cantidad'));// live production hardening\n"
          st = st[:line_end+1] + check + st[line_end+1:]
          static.write_text(st)
          PY

          node --check tests/pm27/prod-reconciliacion-pre-c24.mjs
          node tests/pm27/prod-reconciliacion-pre-c24.mjs
          git diff --check

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pm27-prod-recon-live-drift-fix.yml
          git config user.name 'Plopezm1990'
          git config user.email 'pedroroger1990@gmail.com'
          git add supabase/migrations/20260914170500_pm27_prod_reconciliacion_pre_c24.sql \
                  supabase/qa-solo/pm27_prod_recovery_pre_c24.sql \
                  tests/pm27/fixtures/prod-pre-reconciliacion-from-c24.sql \
                  tests/pm27/fixtures/prod-reconciliacion-recovery-verify.sql \
                  tests/pm27/prod-reconciliacion-pre-c24.mjs \
                  .github/workflows/pm27-prod-recon-live-drift-fix.yml
          git commit -m 'fix(pm27-prod): preservar validador PM07 productivo'
          git push origin HEAD:claude/pm27-prod-reconciliacion
