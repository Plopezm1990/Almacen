name: Inspeccionar Producción APPCC y Aceite bloque 6
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-produccion-appcc-aceite-bloque6.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar lógica y renders relevantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          terminos=[
            'function crearLogicaProduccion(',
            'function crearLogicaAppcc(',
            'function crearLogicaAceite(',
            'function crearLogicaFreidoras(',
            'tab === "produccion"',
            'tab === "appcc"',
            'tab === "aceite"',
            'ordenesProduccion',
            'registrosAppcc',
            'freidoras',
            'registrosAceite'
          ]
          for termino in terminos:
              print('\n===== '+termino+' =====')
              pos=[]; k=0
              while True:
                  i=s.find(termino,k)
                  if i<0: break
                  pos.append(i); k=i+1
              print('POS',pos[:20])
              for i in pos[:8]:
                  print('\n--- contexto',i,'---')
                  print(s[max(0,i-1500):min(len(s),i+3500)])
          PY