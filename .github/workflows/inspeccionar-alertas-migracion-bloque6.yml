name: Inspeccionar alertas y migración bloque 6
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-alertas-migracion-bloque6.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar alertas APPCC y tramo migración
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for termino in ['const alertasAppcc =','alertasAppcc =']:
              i=s.find(termino)
              print('\n===== '+termino+' '+str(i)+' =====')
              if i>=0: print(s[max(0,i-1200):min(len(s),i+6500)])
          i=s.index('const localPorProductoMigracion')
          j=s.index('setReady(true)',i)
          print('\n===== MIGRACION =====\n'+s[i:j+120])
          PY