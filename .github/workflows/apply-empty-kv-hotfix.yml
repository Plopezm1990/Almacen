name: Apply empty KV first-run hotfix

on:
  push:
    branches:
      - claude/hotfix-empty-kv-first-run
    paths:
      - .github/workflows/apply-empty-kv-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply narrow storage adapter fix
        run: python scripts/apply-empty-kv-hotfix.py

      - name: Run P1 regressions before commit
        run: |
          set -euo pipefail
          node tests/p1-empty-kv-first-run.mjs
          node tests/hotfix-barrera-reset-local.mjs
          git diff --check

      - name: Commit functional hotfix to isolated branch
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "No functional diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: treat absent local KV as empty first-run"
          git push origin HEAD:claude/hotfix-empty-kv-first-run
