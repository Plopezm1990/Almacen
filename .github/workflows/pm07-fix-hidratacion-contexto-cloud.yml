name: PM07 fix hidratacion contexto cloud
on:
  push:
    branches:
      - pm07-stock-reversos-ubicacion
    paths:
      - .github/workflows/pm07-fix-hidratacion-contexto-cloud.yml
      - .github/scripts/pm07-fix-contexto-cloud.py
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parche
        run: python3 .github/scripts/pm07-fix-contexto-cloud.py
      - name: Reconstruir bundle
        working-directory: source-recovery
        run: |
          npm ci
          npm run build
          cp dist/fuente.js ../fuente.js
      - name: Validar
        run: |
          node --check source-recovery/fuente-recuperado.js
          node --check fuente.js
          node tests/pm07/frontend-contract.mjs
          git diff --check
      - name: Commit y push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source-recovery/fuente-recuperado.js fuente.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PM07 fix: hidratar empresa y locales desde cloud tras login'
          git push origin HEAD:pm07-stock-reversos-ubicacion
