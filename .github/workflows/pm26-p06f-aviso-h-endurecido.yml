name: PM26 P06f aviso H endurecido preflight embebido y lock_timeout

# Certifica el endurecimiento del aviso H: preflight embebido en la
# misma ejecucion que apply_migration (una sola llamada, un solo
# project_id), atomicidad BEGIN/COMMIT, lock_timeout/statement_timeout
# con prueba real de bloqueo concurrente, comprobacion de indices
# equivalentes con otro nombre. No aplica nada en QA ni produccion. No
# toca main, release, Netlify, Supabase (escritura), ni TPV.

on:
  push:
    branches: [claude/pm26-preparacion-tecnica]
    paths:
      - 'tests/pm26/P06F_AVISO_H_ENDURECIDO.md'
      - 'tests/pm26/p06f-contract.mjs'
      - 'tests/pm26/p06b-h-aislado/**'
      - 'supabase/qa-solo/pm26_p06b_rendimiento_indices_rls_initplan.sql'
      - '.github/workflows/pm26-p06f-aviso-h-endurecido.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Proteger lo que P06f no debe tocar
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          # Alcance HISTORICO de P06f: termina en su cierre exacto. Los
          # paquetes posteriores pueden cambiar fuente.js o preparar otros
          # artefactos QA-only bajo sus propios contratos.
          cierre_p06f='a2f6f2c474b67eeb93079a99bdd6455c868375c0'
          git cat-file -e "$cierre_p06f^{commit}"
          intocables='edge-auth-patch.js
          fuente.js
          index.html
          _headers
          reset-pruebas-preview.js
          pm11-compra-mobile-loader.js
          source-recovery/recuperar_candidato.py
          source-recovery/fuente-recuperado.js
          netlify.toml'
          cambiados="$(git diff --name-only 33e615b57346c6b37c63295a7ac808634583969c.."$cierre_p06f")"
          while IFS= read -r archivo; do
            [ -z "$archivo" ] && continue
            if echo "$cambiados" | grep -qxF "$archivo"; then
              echo "PM26 P06f no debe tocar: $archivo" >&2
              exit 1
            fi
          done <<< "$intocables"
          nuevos_en_migrations="$(git diff --name-only --diff-filter=A 33e615b57346c6b37c63295a7ac808634583969c.."$cierre_p06f" -- supabase/migrations)"
          if [ -n "$nuevos_en_migrations" ]; then
            echo "PM26 P06f no debe anadir nada a supabase/migrations: $nuevos_en_migrations" >&2
            exit 1
          fi
          echo 'PM26_P06F_INTOCABLES_INTACTOS=PASS'
      - name: Instalar PostgreSQL local (aislado)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sleep 2
          sudo -u postgres pg_isready
      - name: Instalar CLI de Supabase
        run: npm install -g supabase
      - name: Contrato PM26 P06f (endurecimiento + lock_timeout real + sin secretos)
        run: node tests/pm26/p06f-contract.mjs

  gate-final:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar PostgreSQL local (aislado)
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sleep 2
          sudo -u postgres pg_isready
      - name: Instalar CLI de Supabase
        run: npm install -g supabase
      - name: Gate PM26 P06f -- endurecido, nada aplicado en QA
        run: |
          set -euo pipefail
          node tests/pm26/p06f-contract.mjs
          echo 'PM26_P06F_GATE=PASS'
