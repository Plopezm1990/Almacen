name: Aplicar ticket TPV fase 4 capa 2

on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/aplicar-ticket-tpv-fase4-capa2.yml'
      - '.github/scripts/aplicar_ticket_tpv_fase4_capa2.py'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Aplicar vista aislada del ticket
        run: python3 .github/scripts/aplicar_ticket_tpv_fase4_capa2.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          grep -q 'function renderTicketVenta()' fuente.js
          grep -q 'Ver ticket / reimprimir' fuente.js
          grep -q 'TICKET / RECIBO INTERNO' fuente.js
      - name: Limpiar temporales y guardar
        run: |
          rm -f .github/scripts/aplicar_ticket_tpv_fase4_capa2.py
          rm -f .github/workflows/aplicar-ticket-tpv-fase4-capa2.yml
          rm -f .github/workflows/inspeccionar-ticket-tpv-fase4-capa2.yml
          git config user.name 'Plopezm1990'
          git config user.email 'pedroroger1990@gmail.com'
          git add fuente.js .github/scripts .github/workflows
          git diff --cached --check
          git commit -m 'Añadir vista aislada del ticket al TPV'
          git push origin HEAD:tpv-ventas-fase-4
