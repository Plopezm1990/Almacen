name: Inspeccionar salidas producto bloque 5
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/inspeccionar-salidas-producto-bloque5.yml
permissions:
  contents: read
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar contextos exactos
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for termino in ['registrarSalida','ajustarProductoPorOtro']:
              pos=[]; i=0
              while True:
                  j=s.find(termino,i)
                  if j<0: break
                  pos.append(j); i=j+1
              print('\n=====',termino,pos,'=====')
              for j in pos[:8]:
                  print('\n---',j,'---')
                  print(s[max(0,j-700):min(len(s),j+3200)])
          PY