name: PM-02 validar barrera sin trafico real

on:
  push:
    branches: [pm02-integrado]
    paths:
      - .github/workflows/pm02-validar-barrera.yml

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Ejecutar simulacion de host y fetch
        run: node .github/scripts/pm02-validar-barrera.mjs
