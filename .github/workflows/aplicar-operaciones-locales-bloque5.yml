name: Aplicar operaciones locales bloque 5
# Reintento con caja y movimientos de caja verificados.
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-operaciones-locales-bloque5.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar aplicador con anclas verificadas
        run: python3 .github/scripts/corregir_aplicador_bloque5.py
      - name: Aplicar parche con guardas
        run: python3 .github/scripts/aplicar_operaciones_locales_bloque5.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,1100p'
      - name: Guardas semánticas mínimas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          requeridos=[
            'encargos: encargosDelLocalActivo',
            'devoluciones: devolucionesDelLocalActivo',
            'traspasos: traspasosDelLocalActivo',
            'movimientosCaja: movimientosCajaDelLocalActivo',
            'badge: encargosUrgentesDelLocalActivo.length',
            'productos: productosDelLocalActivo, venderCarrito',
            'Mermas, { productos: productosDelLocalActivo',
            'localId: localActivoId || data.localId || null',
            'if (!prod || !productoEsDelLocalActivo(prod)) return false;',
            'Los dos productos deben pertenecer al local activo.',
            'La venta incluye productos de otro local.',
            '.filter((m2) => movimientoEsDelLocalActivoVenta(m2));',
            'a2.fecha === fechaVenta && (!localActivoId || a2.localId === localActivoId)',
            'localId: producto.localId || localActivoId || null',
            'creadoEn: (/* @__PURE__ */ new Date()).toISOString(), localId: localActivoId || null',
            'if (!m2 || localActivoId && m2.localId !== localActivoId) return false;'
          ]
          for x in requeridos:
              assert x in s, x
          assert 'localId: prod.localId || localActivoId || null' not in s
          print('GUARDAS_SEMANTICAS_OK')
          PY
      - name: Guardar y retirar herramientas temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/aplicar_operaciones_locales_bloque5.py
          rm -f .github/scripts/corregir_aplicador_bloque5.py
          rm -f .github/workflows/aplicar-operaciones-locales-bloque5.yml
          rm -f .github/workflows/auditar-modulos-locales-restantes-fase3.yml
          rm -f .github/workflows/inspeccionar-operaciones-locales-bloque5.yml
          rm -f .github/workflows/inspeccionar-anclas-bloque5-final.yml
          rm -f .github/workflows/inspeccionar-addproducto-bloque5.yml
          rm -f .github/workflows/inspeccionar-salidas-producto-bloque5.yml
          rm -f .github/workflows/inspeccionar-venta-bloque5-final.yml
          git add fuente.js .github/scripts/aplicar_operaciones_locales_bloque5.py .github/scripts/corregir_aplicador_bloque5.py .github/workflows/aplicar-operaciones-locales-bloque5.yml .github/workflows/auditar-modulos-locales-restantes-fase3.yml .github/workflows/inspeccionar-operaciones-locales-bloque5.yml .github/workflows/inspeccionar-anclas-bloque5-final.yml .github/workflows/inspeccionar-addproducto-bloque5.yml .github/workflows/inspeccionar-salidas-producto-bloque5.yml .github/workflows/inspeccionar-venta-bloque5-final.yml
          git diff --cached --check
          git commit -m 'Aislar operaciones de stock y caja por local'
          git push origin HEAD:multilocal-fase-3