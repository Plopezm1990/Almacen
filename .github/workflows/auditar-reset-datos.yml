name: Auditar reset seguro de datos
on:
  push:
    branches: [la-suite-identidad]
    paths: ['.github/workflows/auditar-reset-datos.yml']
  workflow_dispatch:
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventariar claves y arranque del modo local
        run: |
          python3 <<'PY'
          import re, pathlib
          fuente=pathlib.Path('fuente.js').read_text(encoding='utf-8', errors='ignore')
          index=pathlib.Path('index.html').read_text(encoding='utf-8', errors='ignore')
          keys=set()
          for p in [
            r'\bsaveKey\(\s*["\']([^"\']+)["\']',
            r'\bloadKey\(\s*["\']([^"\']+)["\']',
            r'(?:window\.)?storage\.(?:get|set|delete)\(\s*["\']([^"\']+)["\']',
            r'localStorage\.(?:getItem|setItem|removeItem)\(\s*["\']almacen:([^"\']+)["\']',
          ]:
            keys.update(re.findall(p,fuente))
          print('=== CLAVES APP ===')
          print('\n'.join(sorted(keys)))
          print('TOTAL=',len(keys))

          print('\n=== INDEX: MODO LOCAL/NUBE ===')
          for term in ['Trabajar solo en este equipo','solo en este equipo','__nubeActiva','conectarNube','almacen__pendientes','sessionStorage','localStorage','continuarLocal','modoLocal','sin nube']:
            ms=list(re.finditer(re.escape(term),index,re.I))
            print('\n---',term,'matches=',len(ms),'---')
            for m in ms[:8]:
              print(index[max(0,m.start()-900):min(len(index),m.end()+1800)].replace('\n',' ')[:2800])

          print('\n=== INDEX: ORDEN DE SCRIPTS ===')
          for m in re.finditer(r'<script[^>]*?(?:src=["\']([^"\']+)["\'])?[^>]*>',index,re.I):
            start=m.start()
            print(start, m.group(0)[:300])

          print('\n=== FUENTE: CONEXION NUBE ===')
          for term in ['function conectarNube','async function conectarNube','getSupabaseClient','__nubeActiva']:
            ms=list(re.finditer(re.escape(term),fuente))
            print('\n---',term,'matches=',len(ms),'---')
            for m in ms[:5]:
              print(fuente[max(0,m.start()-900):min(len(fuente),m.end()+2600)].replace('\n',' ')[:3600])
          PY
