name: Auditar reset seguro de datos
on:
  push:
    branches: [la-suite-identidad]
    paths: ['.github/workflows/auditar-reset-datos.yml']
  workflow_dispatch:
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inventariar claves y lógica de limpieza
        run: |
          python3 <<'PY'
          import re, pathlib
          s=pathlib.Path('fuente.js').read_text(encoding='utf-8', errors='ignore')
          pats=[
            r'(?:window\.)?storage\.get\(\s*["\']([^"\']+)',
            r'(?:window\.)?storage\.set\(\s*["\']([^"\']+)',
            r'(?:window\.)?storage\.delete\(\s*["\']([^"\']+)',
            r'localStorage\.getItem\(\s*["\']almacen:([^"\']+)',
            r'localStorage\.setItem\(\s*["\']almacen:([^"\']+)',
            r'localStorage\.removeItem\(\s*["\']almacen:([^"\']+)',
          ]
          keys=set()
          for p in pats:
            keys.update(re.findall(p,s))
          print('=== CLAVES STORAGE DETECTADAS ===')
          for k in sorted(keys):
            if len(k)<100: print(k)
          print('TOTAL=',len(keys))
          print('\n=== CONTEXTO DE CARGA PRINCIPAL ===')
          for term in ['empresas', 'productos', 'ventasTPV', 'movimientos', 'pedidos', 'albaranes', 'traspasos', 'arqueos', 'empleados', 'encargos']:
            matches=list(re.finditer(r'["\']'+re.escape(term)+r'["\']',s))
            if not matches: continue
            m=matches[-1]
            a=max(0,m.start()-600); b=min(len(s),m.end()+1000)
            print('\n---',term,'---')
            print(s[a:b].replace('\n',' ')[:1700])
          print('\n=== RESET EXISTENTE ===')
          for term in ['restablecer','limpiar datos','borrar datos','localStorage.clear']:
            found=list(re.finditer(re.escape(term),s,re.I))
            print(term, len(found))
          PY
