name: PM12 P08 implementation temp

on:
  push:
    branches: [pm12-conteo-estados-honestos]
    paths:
      - '.github/workflows/pm12-p08-implementation-temp.yml'
      - 'fuente.js'
      - 'source-recovery/fuente-recuperado.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implementar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pm12-conteo-estados-honestos
          fetch-depth: 0
      - name: Proteger rama y main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "pm12-conteo-estados-honestos"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
      - name: Implementar P08
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fuentes = [Path('fuente.js'), Path('source-recovery/fuente-recuperado.js')]

          batch = r'''
  function aplicarLoteMovimientosStock(operaciones = []) {
    if (!Array.isArray(operaciones) || operaciones.length === 0) {
      return { ok: false, codigo: "lote_vacio", error: "El lote de movimientos está vacío.", movimientos: [] };
