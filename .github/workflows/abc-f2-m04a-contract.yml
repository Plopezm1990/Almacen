name: "ABC F2 M04A -- sesiones cajas terminales"

on:
  push:
    branches: [abc-f2-m04a-caja-sesiones]
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql"
      - "supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql"
      - "supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql"
      - "supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql"
      - "supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql"
      - "supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql"
      - "supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql"
      - "supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql"
      - "tests/f2/m04a/**"
      - ".github/workflows/abc-f2-m04a-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  m04a-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Guardar orden y alcance C01-M04A
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
            supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
            supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
            supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
            supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
            supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
            supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
            supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
          )

          previous=""
          for file in "${files[@]}"; do
            test -f "$file"
            current="$(basename "$file")"
            if [[ -n "$previous" && ! "$previous" < "$current" ]]; then
              echo "M04A_ORDER_GUARD: orden invalido $previous -> $current" >&2
              exit 1
            fi
            previous="$current"
          done

          m04a="${files[7]}"
          if grep -Eiq '(^|[[:space:]])drop[[:space:]]+(table|column|constraint)|alter[[:space:]]+table.*rename|alter[[:space:]]+table.*alter[[:space:]]+column.*type' "$m04a"; then
            echo "M04A_DESTRUCTIVA: DDL destructivo detectado" >&2
            exit 1
          fi

          if grep -Eiq 'grant[[:space:]]+(insert|update|delete|truncate).*authenticated' "$m04a"; then
            echo "M04A_SECURITY: mutacion directa concedida a authenticated" >&2
            exit 1
          fi

          if grep -Eiq 'stock_operaciones|movimientos_stock|ventas_fiscales|pago_aplicaciones|reembolso_aplicaciones' "$m04a"; then
            echo "M04A_SCOPE: dependencia economica/stock fuera de C01" >&2
            exit 1
          fi

          echo "M04A_SCOPE_GUARD=PASS"

      - name: Preparar fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04a/fixture-m04a.sql
      - name: Aplicar M01
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
      - name: Aplicar M01b
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
      - name: Aplicar M02A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
      - name: Aplicar M02B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
      - name: Aplicar M03A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
      - name: Aplicar M03B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
      - name: Aplicar M03C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
      - name: Aplicar C01-M04A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
      - name: Ejecutar contrato C01-M04A
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04a/m04a-contract.sql

      - name: Concurrencia -- dos aperturas sobre la misma caja
        shell: bash
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 <<'SQL' &
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_abrir_sesion_caja(
            'M04A:conc:box:first','E1','L1',
            'c1000000-0000-0000-0000-000000000010',
            'a1000000-0000-0000-0000-000000000004',
            '11111111-1111-1111-1111-111111111111',
            'b1000000-0000-0000-0000-000000000005',
            'EUR',0,'2026-09-23'
          );
          select pg_sleep(4);
          commit;
          SQL
          holder=$!

          sleep 1
          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m04a_box_lock.out 2>&1 <<'SQL'
          begin;
          set local lock_timeout='1s';
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_abrir_sesion_caja(
            'M04A:conc:box:second','E1','L1',
            'c1000000-0000-0000-0000-000000000011',
            'a1000000-0000-0000-0000-000000000004',
            '11111111-1111-1111-1111-111111111111',
            'b1000000-0000-0000-0000-000000000006',
            'EUR',0,'2026-09-23'
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]] || ! grep -Eiq 'lock timeout|canceling statement due to lock timeout' /tmp/m04a_box_lock.out; then
            cat /tmp/m04a_box_lock.out
            wait "$holder" || true
            echo "M04A_CONCURRENCY_FAIL: misma caja no serializo" >&2
            exit 1
          fi
          wait "$holder"

          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m04a_box_after.out 2>&1 <<'SQL'
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_abrir_sesion_caja(
            'M04A:conc:box:second','E1','L1',
            'c1000000-0000-0000-0000-000000000011',
            'a1000000-0000-0000-0000-000000000004',
            '11111111-1111-1111-1111-111111111111',
            'b1000000-0000-0000-0000-000000000006',
            'EUR',0,'2026-09-23'
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]] || ! grep -q 'caja_con_sesion_activa' /tmp/m04a_box_after.out; then
            cat /tmp/m04a_box_after.out
            echo "M04A_CONCURRENCY_FAIL: segunda apertura de caja no fue rechazada" >&2
            exit 1
          fi

          echo "ABC_F2_M04A_SAME_BOX_CONCURRENCY=PASS"

      - name: Concurrencia -- un terminal no puede quedar en dos sesiones
        shell: bash
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 <<'SQL' &
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_abrir_sesion_caja(
            'M04A:conc:terminal:first','E1','L1',
            'c1000000-0000-0000-0000-000000000012',
            'a1000000-0000-0000-0000-000000000005',
            '11111111-1111-1111-1111-111111111111',
            'b1000000-0000-0000-0000-000000000007',
            'EUR',0,'2026-09-23'
          );
          select pg_sleep(4);
          commit;
          SQL
          holder=$!

          sleep 1
          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m04a_terminal_lock.out 2>&1 <<'SQL'
          begin;
          set local lock_timeout='1s';
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_abrir_sesion_caja(
            'M04A:conc:terminal:second','E1','L1',
            'c1000000-0000-0000-0000-000000000013',
            'a1000000-0000-0000-0000-000000000006',
            '11111111-1111-1111-1111-111111111111',
            'b1000000-0000-0000-0000-000000000007',
            'EUR',0,'2026-09-23'
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]] || ! grep -Eiq 'lock timeout|canceling statement due to lock timeout' /tmp/m04a_terminal_lock.out; then
            cat /tmp/m04a_terminal_lock.out
            wait "$holder" || true
            echo "M04A_CONCURRENCY_FAIL: mismo terminal no serializo" >&2
            exit 1
          fi
          wait "$holder"

          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m04a_terminal_after.out 2>&1 <<'SQL'
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_abrir_sesion_caja(
            'M04A:conc:terminal:second','E1','L1',
            'c1000000-0000-0000-0000-000000000013',
            'a1000000-0000-0000-0000-000000000006',
            '11111111-1111-1111-1111-111111111111',
            'b1000000-0000-0000-0000-000000000007',
            'EUR',0,'2026-09-23'
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]] || ! grep -q 'terminal_ya_vinculado_otra_sesion' /tmp/m04a_terminal_after.out; then
            cat /tmp/m04a_terminal_after.out
            echo "M04A_CONCURRENCY_FAIL: segundo vinculo de terminal no fue rechazado" >&2
            exit 1
          fi

          echo "ABC_F2_M04A_TERMINAL_CONCURRENCY=PASS"
