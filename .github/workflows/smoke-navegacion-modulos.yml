name: Smoke navegación módulos
on:
  push:
    branches: [smoke-pr4-global]
    paths:
      - .github/workflows/smoke-navegacion-modulos.yml
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar app y Chromium
        run: |
          node --check fuente.js
          node --check edge-auth-patch.js
          python3 -m http.server 4218 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          mkdir -p /tmp/nav-smoke && cd /tmp/nav-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install chromium
      - name: Recorrer navegación visible sin Supabase
        run: |
          cd /tmp/nav-smoke
          cat > nav.cjs <<'NODE'
          const { chromium } = require('playwright');
          const URL='http://127.0.0.1:4218/';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const ctx=await browser.newContext({serviceWorkers:'block',viewport:{width:1440,height:1000}});
            const page=await ctx.newPage();
            const pageErrors=[]; const supabase=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            await page.route('https://flqercbgpgmmfaakrwkc.supabase.co/**',r=>{supabase.push(r.request().url());r.abort();});
            await page.addInitScript(()=>{
              localStorage.clear();
              const poner=(k,v)=>localStorage.setItem('almacen:'+k,JSON.stringify(v));
              poner('locales',[{id:'loc',nombre:'Local Prueba',activo:true}]);
              poner('localActivoId','loc');
              poner('productos',[{id:'p1',nombre:'Chocolate prueba',tipo:'materiaPrima',unidad:'kg',stock:10,stockMinimo:2,costo:4,precioVenta:8,ivaPct:10,localId:'loc',activo:true}]);
              poner('proveedores',[{id:'prov1',nombre:'Proveedor prueba'}]);
              poner('pedidos',[]); poner('movimientos',[]); poner('conteos',[]); poner('fichasCosto',[]);
              poner('albaranes',[]); poner('catalogoProv',{}); poner('gastosGenerales',[]); poner('empleados',[]);
              poner('fichajes',[]); poner('registrosAppcc',[]); poner('puntosControl',[]); poner('clientes',[]);
              poner('encargos',[]); poner('arqueos',[]); poner('movimientosCaja',[]); poner('devoluciones',[]);
              poner('turnos',[]); poner('nominas',[]); poner('facturasDirectas',[]); poner('ordenesProduccion',[]);
              poner('traspasos',[]); poner('auditoria',[]); poner('freidoras',[]); poner('registrosAceite',[]);
              poner('entrevistas',[]); poner('historialRespaldos',[{id:'hoy',fecha:new Date().toISOString(),automatica:true,motivo:'automatico-diario',data:{}}]);
              localStorage.setItem('almacen__pendientes','[]');
            });
            await page.goto(URL,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForTimeout(1800);
            const b=page.getByText('Trabajar solo en este equipo, sin sincronizar',{exact:false});
            if(!(await b.count())) throw new Error('No aparece entrada local');
            await b.first().click(); await page.waitForTimeout(1800);
            if(pageErrors.length) throw new Error('Error inicial: '+pageErrors.join(' | '));

            async function raizNav(){
              const aside=page.locator('aside').first();
              if(await aside.count()) return aside;
              return page.locator('nav').first();
            }
            async function textosNav(){
              return page.evaluate(()=>{
                const raiz=document.querySelector('aside') || document.querySelector('nav');
                if(!raiz) return [];
                return [...raiz.querySelectorAll('button,a')]
                  .map(e=>(e.innerText||e.textContent||'').replace(/\s+/g,' ').trim())
                  .filter(Boolean);
              });
            }

            const excluir=/cerrar sesi[oó]n|salir|notificaciones|activar notificaciones|desactivar notificaciones|borrar|eliminar|restaurar|importar|exportar/i;
            const detectados=new Set(); const clicados=new Set(); const omitidos=new Set();
            for(let ronda=0;ronda<5;ronda++){
              const textos=[...new Set(await textosNav())].filter(t=>!excluir.test(t));
              let aparecioNuevo=false;
              for(const texto of textos){
                if(detectados.has(texto)) continue;
                detectados.add(texto); aparecioNuevo=true;
                const raiz=await raizNav();
                const candidato=raiz.getByText(texto,{exact:true}).first();
                if(!(await candidato.count())) { omitidos.add(texto); continue; }
                const antes=pageErrors.length;
                try { await candidato.click({timeout:3000}); }
                catch(e) { omitidos.add(texto); console.log('OMITIDO_CLICK='+texto); continue; }
                await page.waitForTimeout(250);
                if(pageErrors.length>antes) throw new Error('Módulo '+texto+' produjo: '+pageErrors.slice(antes).join(' | '));
                if((await page.locator('#root').innerHTML()).length<500) throw new Error('Módulo '+texto+' dejó root vacío');
                clicados.add(texto);
                console.log('MODULO_OK='+texto);
              }
              if(!aparecioNuevo) break;
            }
            if(supabase.length) throw new Error('El modo local contactó Supabase: '+supabase.join(' | '));
            console.log('ETIQUETAS_DETECTADAS='+detectados.size);
            console.log('CLICS_EFECTIVOS='+clicados.size);
            console.log('OMITIDOS='+JSON.stringify([...omitidos]));
            if(clicados.size<20) throw new Error('Cobertura insuficiente: solo '+clicados.size+' clics efectivos de '+detectados.size+' etiquetas');
            console.log('SMOKE_NAVEGACION_OK=1');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node nav.cjs