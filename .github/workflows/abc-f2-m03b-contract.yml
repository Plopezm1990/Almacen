name: "ABC F2 M03B -- checkout y cobro"

on:
  push:
    branches: [abc-f2-m03b-checkout-cobro]
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql"
      - "supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql"
      - "supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql"
      - "supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql"
      - "supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql"
      - "supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql"
      - "tests/f2/m03b/**"
      - ".github/workflows/abc-f2-m03b-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  m03b-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Guardar orden y alcance M03B
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
          test -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
          test -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
          test -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
          test -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
          test -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
          test "20260923210000" < "20260923210100"
          test "20260923210100" < "20260923220000"
          test "20260923220000" < "20260923230000"
          test "20260923230000" < "20260923233000"
          test "20260923233000" < "20260923234500"
          if grep -Eiq '(^|[[:space:]])drop[[:space:]]+(table|column|constraint)|alter[[:space:]]+table.*rename|alter[[:space:]]+table.*alter[[:space:]]+column.*type' supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql; then
            echo "M03B_DESTRUCTIVA: DDL destructivo detectado" >&2
            exit 1
          fi
          echo "M03B_SCOPE_GUARD=PASS"

      - name: Preparar fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m03b/fixture-m03b.sql
      - name: Aplicar M01
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
      - name: Aplicar M01b
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
      - name: Aplicar M02A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
      - name: Aplicar M02B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
      - name: Aplicar M03A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
      - name: Aplicar M03B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
      - name: Ejecutar contrato M03B
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m03b/m03b-contract.sql

      - name: Concurrencia real -- dos cobros sobre el mismo saldo
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL' &
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_iniciar_cobro(
            'M03B:conc:pay:0001','E1','L1',
            '40000000-0000-0000-0000-000000000003',
            '50000000-0000-0000-0000-000000000010',
            '60000000-0000-0000-0000-000000000010',
            'TARJETA',15,'EUR',
            '90000000-0000-0000-0000-000000000001',null,null
          );
          select pg_sleep(4);
          commit;
          SQL
          holder=$!

          sleep 1
          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m03b_lock.out 2>&1 <<'SQL'
          begin;
          set local lock_timeout='1s';
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_iniciar_cobro(
            'M03B:conc:pay:0002','E1','L1',
            '40000000-0000-0000-0000-000000000003',
            '50000000-0000-0000-0000-000000000011',
            '60000000-0000-0000-0000-000000000011',
            'TARJETA',15,'EUR',
            '90000000-0000-0000-0000-000000000001',null,null
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]]; then
            cat /tmp/m03b_lock.out
            wait "$holder" || true
            echo "M03B_CONCURRENCY_FAIL: segundo cobro no espero lock" >&2
            exit 1
          fi
          if ! grep -Eiq 'lock timeout|canceling statement due to lock timeout' /tmp/m03b_lock.out; then
            cat /tmp/m03b_lock.out
            wait "$holder" || true
            echo "M03B_CONCURRENCY_FAIL: error inesperado" >&2
            exit 1
          fi
          wait "$holder"

          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m03b_after.out 2>&1 <<'SQL'
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_iniciar_cobro(
            'M03B:conc:pay:0002','E1','L1',
            '40000000-0000-0000-0000-000000000003',
            '50000000-0000-0000-0000-000000000011',
            '60000000-0000-0000-0000-000000000011',
            'TARJETA',15,'EUR',
            '90000000-0000-0000-0000-000000000001',null,null
          );
          commit;
          SQL
          rc=$?
          set -e
          if [[ "$rc" -eq 0 ]] || ! grep -q 'saldo_insuficiente' /tmp/m03b_after.out; then
            cat /tmp/m03b_after.out
            echo "M03B_CONCURRENCY_FAIL: tras commit esperaba saldo_insuficiente" >&2
            exit 1
          fi
          echo "ABC_F2_M03B_CONCURRENCY=PASS"
