name: PM10 P11 focus recepcion stock
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p11-focus-stock.yml'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraer motor stock y recepcion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          out=[]
          for label,start,end,maxlen in [
            ('MOTOR','function crearMotorStock(', 'function esEntrada',50000),
            ('PROCESAR_RECEPCION','function procesarRecepcion(', 'function crearLogicaAlbaranes',30000),
            ('LOGICA_PEDIDOS','function crearLogicaPedidos(', 'function crearLogicaFichasCosto',30000),
            ('PRODUCTOS_UI','function Productos(', 'function Proveedores(',65000),
          ]:
            a=s.find(start)
            if a<0:
              out.append(f'===== {label} NO ENCONTRADO ====='); continue
            b=s.find(end,a+len(start))
            if b<0 or b-a>maxlen: b=min(len(s),a+maxlen)
            out.append(f'===== {label} {a}:{b} =====\n'+s[a:b])
          Path('tests/pm10/P11_FOCUS_STOCK.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm10/P11_FOCUS_STOCK.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PM10: guardar foco recepción stock punto 11'
          git push
