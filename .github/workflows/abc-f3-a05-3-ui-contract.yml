name: A05.3 TPV operational actions

on:
  push:
    branches:
      - abc-f3-a05-2-tpv-state-integration
    paths:
      - 'source-recovery/fuente-recuperado.js'
      - 'fuente.js'
      - 'tests/f3/a05/a05-3-ui-contract.mjs'
      - 'scripts/f3/a05-3-patch.mjs'
      - '.github/workflows/abc-f3-a05-3-ui-contract.yml'

permissions:
  contents: write

concurrency:
  group: abc-f3-a05-3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Guardar alcance y base release
        shell: bash
        run: |
          set -euo pipefail
          BASE=18f2bd86281dc5451f8d9e0624635f88c82fc472
          git merge-base --is-ancestor "$BASE" HEAD
          BAD=$(git diff --name-only "$BASE...HEAD" | grep -Ev '^(fuente\.js|source-recovery/fuente-recuperado\.js|tests/f3/a05/a05-[23]-ui-contract\.mjs|scripts/f3/a05-[23]-patch\.mjs|\.github/workflows/abc-f3-a05-[23]-ui-contract\.yml)$' || true)
          if [ -n "$BAD" ]; then
            echo "A05_3_SCOPE_FAIL" >&2
            echo "$BAD" >&2
            exit 1
          fi
          echo "A05_3_SCOPE=PASS"

      - name: Aplicar integración A05.3
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'async function accionPedidoA05(' source-recovery/fuente-recuperado.js; then
            echo "A05_3_ALREADY_MATERIALIZED=1"
          else
            node scripts/f3/a05-3-patch.mjs
          fi

      - name: Materializar runtime
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");
          const recovered = fs.readFileSync("source-recovery/fuente-recuperado.js", "utf8");
          const runtime = fs.readFileSync("fuente.js", "utf8");
          const lines = recovered.split("\n");
          if (lines[0] !== "// FUENTE RECUPERADO DESDE EL BUNDLE CANDIDATO DE L&A SUITE.") {
            throw new Error("A05_3_BAD_RECOVERY_HEADER");
          }
          const body = lines.slice(14).join("\n");
          const marker = "var C2 = {";
          const first = runtime.indexOf(marker);
          const second = runtime.indexOf(marker, first + 1);
          if (first < 0 || second >= 0) throw new Error("A05_3_RUNTIME_BOUNDARY_AMBIGUOUS");
          const next = runtime.slice(0, first) + body;
          if (!next.endsWith(body)) throw new Error("A05_3_RUNTIME_PARITY_BUILD_FAIL");
          fs.writeFileSync("fuente.js", next);
          NODE
          echo "A05_3_RUNTIME_MATERIALIZED=PASS"

      - name: Verificar sintaxis y source recovery
        shell: bash
        run: |
          set -euo pipefail
          node --check fuente.js
          python3 source-recovery/recuperar_candidato.py --check
          echo "A05_3_SOURCE_RECOVERY=PASS"

      - name: Build directo recuperado
        shell: bash
        working-directory: source-recovery
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run check
          rm -rf dist
          npm run build
          node --check dist/fuente.js
          echo "A05_3_DIRECT_BUILD=PASS"

      - name: Contratos A05.2 y A05.3
        shell: bash
        run: |
          set -euo pipefail
          node tests/f3/a05/a05-2-ui-contract.mjs
          node tests/f3/a05/a05-3-ui-contract.mjs

      - name: Persistir implementación materializada
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add source-recovery/fuente-recuperado.js fuente.js
          if git diff --cached --quiet; then
            echo "A05_3_ALREADY_CURRENT=1"
            exit 0
          fi
          git commit -m "[skip netlify] A05.3 materialize operational actions"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "A05_3_MATERIALIZED=1"
