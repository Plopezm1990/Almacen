name: Inspeccionar bloque multilocal fase 2
on:
  push:
    branches: [multilocal-fase-2]
    paths:
      - .github/workflows/inspeccionar-bloque-multilocal-fase2.yml
jobs:
  inspeccion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar bloques exactos
        shell: python
        run: |
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          pats=['const productosDelLocalActivo =','const { iniciarConteo','const { crearOrdenProduccion','const { registrarMovimientoCaja','const { fichar','const { registrarAppcc','const { addFreidora','const { traspasarStock','tab === "pedidos" &&','tab === "caja" &&','tab === "personal" &&']
          for pat in pats:
            i=s.find(pat)
            print(f'\n===== {pat} @ {i} =====')
            if i>=0: print(s[max(0,i-1500):min(len(s),i+9000)])