name: Diagnosticar runtime TPV fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - '.github/workflows/diagnosticar-runtime-tpv-fase4.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Esperar Preview y capturar errores del navegador
        shell: bash
        run: |
          set -o pipefail
          URL='https://deploy-preview-8--chic-entremet-9107cf.netlify.app'
          for i in $(seq 1 18); do
            if curl -fsS "$URL" >/tmp/tpv.html; then break; fi
            sleep 5
          done
          which google-chrome || true
          timeout 25s google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --enable-logging=stderr --v=1 --virtual-time-budget=12000 --dump-dom "$URL" >/tmp/dom.txt 2>/tmp/chrome.log || true
          echo '=== MENSAJES JS/CONSOLE ==='
          grep -Ei 'uncaught|referenceerror|typeerror|syntaxerror|error|exception|console' /tmp/chrome.log | tail -n 160 || true
          echo '=== DOM FINAL ==='
          tail -n 80 /tmp/dom.txt || true
