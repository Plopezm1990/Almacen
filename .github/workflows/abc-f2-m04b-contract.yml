name: "ABC F2 M04B -- movimientos caja"

on:
  push:
    branches: [abc-f2-m04b-caja-movimientos]
  pull_request:
    branches: [release]
    paths:
      - "supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql"
      - "supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql"
      - "supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql"
      - "supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql"
      - "supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql"
      - "supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql"
      - "supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql"
      - "supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql"
      - "supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql"
      - "tests/f2/m04b/**"
      - ".github/workflows/abc-f2-m04b-contract.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  m04b-postgres-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Guardar orden, alcance y autoridad C02-M04B
        shell: bash
        run: |
          set -euo pipefail
          files=(
            supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
            supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
            supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
            supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
            supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
            supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
            supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
            supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
            supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql
          )

          previous=""
          for file in "${files[@]}"; do
            test -f "$file"
            current="$(basename "$file")"
            if [[ -n "$previous" && ! "$previous" < "$current" ]]; then
              echo "M04B_ORDER_GUARD: orden invalido $previous -> $current" >&2
              exit 1
            fi
            previous="$current"
          done

          m04b="${files[8]}"
          if grep -Eiq '(^|[[:space:]])drop[[:space:]]+(table|column|constraint)|alter[[:space:]]+table.*rename|alter[[:space:]]+table.*alter[[:space:]]+column.*type' "$m04b"; then
            echo "M04B_DESTRUCTIVA: DDL destructivo detectado" >&2
            exit 1
          fi

          if grep -Eiq 'grant[[:space:]]+(insert|update|delete|truncate).*authenticated' "$m04b"; then
            echo "M04B_SECURITY: mutacion directa concedida a authenticated" >&2
            exit 1
          fi

          if grep -Eiq 'stock_operaciones|movimientos_stock|ventas_fiscales|pago_aplicaciones|reembolso_aplicaciones' "$m04b"; then
            echo "M04B_SCOPE: dominio economico/stock fuera de C02" >&2
            exit 1
          fi

          grep -q 'movimiento_abc_requiere_reverso_abc' "$m04b"
          grep -q "'ABC_CAJA_MANUAL'" "$m04b"
          grep -q "'ABC_CAJA_REVERSO_MANUAL'" "$m04b"

          echo "M04B_SCOPE_GUARD=PASS"

      - name: Preparar fixture
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04b/fixture-m04b.sql
      - name: Aplicar M01
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210000_abc_f2_m01_base_transaccional_caja.sql
      - name: Aplicar M01b
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923210100_abc_f2_m01b_acl_hardening.sql
      - name: Aplicar M02A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923220000_abc_f2_m02a_core_comercial_fiscal.sql
      - name: Aplicar M02B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923230000_abc_f2_m02b_pagos_reservas_reembolsos.sql
      - name: Aplicar M03A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923233000_abc_f2_m03a_autoridad_transaccional.sql
      - name: Aplicar M03B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923234500_abc_f2_m03b_checkout_cobro.sql
      - name: Aplicar M03C
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260923235900_abc_f2_m03c_reembolsos_transaccionales.sql
      - name: Aplicar M04A
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924001000_abc_f2_m04a_caja_sesiones.sql
      - name: Aplicar C02-M04B
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20260924002000_abc_f2_m04b_movimientos_caja.sql
      - name: Ejecutar contrato C02-M04B
        run: psql -v ON_ERROR_STOP=1 -f tests/f2/m04b/m04b-contract.sql

      - name: Concurrencia -- dos correcciones sobre el mismo movimiento
        shell: bash
        run: |
          set -euo pipefail

          psql -v ON_ERROR_STOP=1 <<'SQL' &
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_revertir_movimiento_caja(
            'M04B:conc:reverse:1','E1','L1',
            (
              select operation_id
                from public.caja_operaciones
               where abc_command_id='M04B:manual:conc:1'
            ),
            'b1000000-0000-0000-0000-000000000101',
            'Correccion concurrente A','2026-09-23'
          );
          select pg_sleep(4);
          commit;
          SQL
          holder=$!

          sleep 1
          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m04b_lock.out 2>&1 <<'SQL'
          begin;
          set local lock_timeout='1s';
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_revertir_movimiento_caja(
            'M04B:conc:reverse:2','E1','L1',
            (
              select operation_id
                from public.caja_operaciones
               where abc_command_id='M04B:manual:conc:1'
            ),
            'b1000000-0000-0000-0000-000000000101',
            'Correccion concurrente B','2026-09-23'
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]]; then
            cat /tmp/m04b_lock.out
            wait "$holder" || true
            echo "M04B_CONCURRENCY_FAIL: segunda correccion no espero lock" >&2
            exit 1
          fi

          if ! grep -Eiq 'lock timeout|canceling statement due to lock timeout' /tmp/m04b_lock.out; then
            cat /tmp/m04b_lock.out
            wait "$holder" || true
            echo "M04B_CONCURRENCY_FAIL: error inesperado durante lock" >&2
            exit 1
          fi

          wait "$holder"

          set +e
          psql -v ON_ERROR_STOP=1 >/tmp/m04b_after.out 2>&1 <<'SQL'
          begin;
          set role authenticated;
          select set_config('request.jwt.claim.sub','11111111-1111-1111-1111-111111111111',false);
          select set_config('app.test_empresa','E1',false);
          select set_config('app.test_local','L1',false);
          select public.abc_revertir_movimiento_caja(
            'M04B:conc:reverse:2','E1','L1',
            (
              select operation_id
                from public.caja_operaciones
               where abc_command_id='M04B:manual:conc:1'
            ),
            'b1000000-0000-0000-0000-000000000101',
            'Correccion concurrente B','2026-09-23'
          );
          commit;
          SQL
          rc=$?
          set -e

          if [[ "$rc" -eq 0 ]] || ! grep -q 'movimiento_caja_ya_revertido' /tmp/m04b_after.out; then
            cat /tmp/m04b_after.out
            echo "M04B_CONCURRENCY_FAIL: segunda correccion no fue rechazada tras commit" >&2
            exit 1
          fi

          echo "ABC_F2_M04B_CONCURRENCY=PASS"
