name: PM33 P05 entorno aislado (PG17 + Auth + PostgREST reales)

# workflow_dispatch por sí solo NO basta aquí: GitHub solo permite
# disparar manualmente (botón "Run workflow" o la API) un workflow cuyo
# archivo YA está registrado -- en la práctica, eso exige que el archivo
# exista en la rama por defecto (main) o que ya se haya ejecutado antes
# por otro evento en ESTA rama. Con main congelada (no se toca) y esta
# rama sin ejecuciones previas, un workflow_dispatch aislado se quedaría
# sin poder dispararse nunca. Por eso se añade `push`, restringido
# EXCLUSIVAMENTE al nombre exacto de esta rama candidata (nunca un
# comodín, igual que el resto de workflows de este repositorio) -- el
# mismo patrón que ya usa pm12-p08-produccion-segura.yml. Un push a
# cualquier OTRA rama no dispara nada. workflow_dispatch se conserva para
# poder re-ejecutar manualmente una vez el archivo ya esté registrado.
# Este workflow no despliega nada: solo levanta un stack de Supabase
# desechable en el propio ejecutor de GitHub, corre las pruebas, y lo
# destruye -- ver docs/plan-maestro/PM33_ENTORNO_AISLADO.md.
on:
  push:
    branches: [claude/pm33-p03-obtener-contexto-operativo]
    paths:
      - 'tests/pm33/supabase-full/**'
      - 'supabase/migrations/20260919170000_pm33_p05_identidad_antes_de_actividad.sql'
      - '.github/workflows/pm33-p05-entorno-aislado.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  entorno-aislado-supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar rama dedicada y release sin tocar
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "claude/pm33-p03-obtener-contexto-operativo"
          git fetch origin release --quiet
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "93a570badba1c5375febfbddc1dffdbcef003dcd"
          git merge-base --is-ancestor origin/release HEAD
          echo 'MAIN_FROZEN=1'
          echo 'RELEASE_ANCESTOR_OK=1'

      - name: Instalar dependencias del entorno aislado
        shell: bash
        run: npm ci --prefix tests/pm33/supabase-full --no-audit --no-fund

      - name: Iniciar Auth, PostgREST y PostgreSQL 17 desechables
        shell: bash
        run: |
          set -euo pipefail
          tests/pm33/supabase-full/node_modules/.bin/supabase start \
            --workdir tests/pm33/supabase-full \
            -x realtime,storage-api,imgproxy,studio,mailpit,postgres-meta,edge-runtime,logflare,vector,supavisor
          tests/pm33/supabase-full/node_modules/.bin/supabase status \
            --workdir tests/pm33/supabase-full -o env \
            > tests/pm33/supabase-full/supabase/.temp/status.env

      - name: P05 real -- Auth JWT + PostgREST + RLS contra PG17 real
        run: node tests/pm33/supabase-full/p05-auth-postgrest-contract.mjs

      - name: Detener Supabase desechable
        if: always()
        run: tests/pm33/supabase-full/node_modules/.bin/supabase stop --workdir tests/pm33/supabase-full --no-backup || true
