name: PM10 P11 focus robustez
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p11-focus-robustez.yml'
permissions:
  contents: write
jobs:
  focus:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraer bloques limpios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          out=[]
          # function inventory relevant names
          names=[]
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(',s):
            n=m.group(1)
            if re.search(r'product|invent|pedido|recep|personal|emple|encargo|gestionAlmacen',n,re.I):
              names.append((n,m.start()))
          out.append('FUNCTIONS\n'+ '\n'.join(f'{n} {o}' for n,o in names))
          # exact known blocks
          for label,start,end,maxlen in [
            ('PEDIDOS_UI','function Pedidos({','function Recepcion(',55000),
            ('RECEPCION_UI','function Recepcion({','function textoHojaConteo(',55000),
            ('PERSONAL_UI','function Personal({','function Turnos(',55000),
            ('ENCARGOS_UI','function Encargos({','function Clientes(',65000),
            ('LOGICA_PEDIDOS','function crearLogicaPedidos(', 'function crearLogicaFichasCosto',35000),
            ('LOGICA_PERSONAL','function crearLogicaPersonal({','function crearLogicaTurnos({',26000),
            ('LOGICA_ENCARGOS','function crearLogicaEncargos({','function crearLogicaVenta({',30000),
          ]:
            a=s.find(start)
            if a<0:
              out.append(f'===== {label} NO ENCONTRADO ====='); continue
            b=s.find(end,a+len(start))
            if b<0 or b-a>maxlen: b=min(len(s),a+maxlen)
            out.append(f'===== {label} {a}:{b} =====\n'+s[a:b])
          # all save effects around five keys
          for key in ['productos','pedidos','empleados','encargos','movimientos']:
            pat=f'saveKey("{key}"'
            for m in re.finditer(re.escape(pat),s):
              out.append(f'===== SAVE {key} {m.start()} =====\n'+s[max(0,m.start()-1800):min(len(s),m.start()+3000)])
          Path('tests/pm10/P11_FOCUS_ROBUSTEZ.txt').write_text('\n\n'.join(out),encoding='utf-8')
          print('bytes',Path('tests/pm10/P11_FOCUS_ROBUSTEZ.txt').stat().st_size)
          PY
      - name: Commit focus
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/pm10/P11_FOCUS_ROBUSTEZ.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'PM10: guardar foco robustez punto 11'
          git push
