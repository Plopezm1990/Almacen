name: G1 Punto 7 concurrencia replay

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p07-concurrencia-replay.yml'
      - 'tests/g1/P07_CONCURRENCIA_REPLAY_EVIDENCIA.md'
      - 'tests/g1/p07-concurrencia-replay-contract.mjs'
      - 'tests/g1/**'
      - 'tests/pm08/**'
      - 'tests/pm09/**'
      - 'docs/plan-maestro/PM03_CONTRATOS_MINIMOS_PROPUESTA.md'
      - 'fuente.js'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  concurrencia-replay:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verificar descendencia de PM10 final
        run: |
          git merge-base --is-ancestor 94d37cc7a5176e3a44d00f8f8bfb79a630dae314 HEAD
          echo 'G1_P07_DESCIENDE_PM10_FINAL=1'
      - name: Sintaxis del candidato
        run: node --check fuente.js
      - name: Contrato G1.7
        run: node tests/g1/p07-concurrencia-replay-contract.mjs
      - name: Regresión robustez e idempotencia
        run: |
          node tests/pm08/replay-scope-contract.mjs
          node tests/pm08/frontend-contract.mjs
          node tests/pm08/migration-contract.mjs
          node tests/pm09/p17-robustness-contract.mjs
          node tests/pm09/p15-special-economic-contract.mjs
      - name: Regresión G1 previa
        run: |
          node tests/g1/p02-evidence-map-contract.mjs
          node tests/g1/p03-la019-contract.mjs
          node tests/g1/p04-la023-contract.mjs
          node tests/g1/p05-permisos-aislamiento-contract.mjs
          node tests/g1/p06-cifras-conciliaciones-contract.mjs
      - name: Resumen
        run: |
          echo 'G1_P07_CONCURRENCIA_REPLAY=PASS'
          echo 'G1_GATE_SUPERADO=NO'
          echo 'G1_SIGUIENTE=P08_LA004_Y_CIERRE_GATE'
