name: G1 P08 diagnostico build

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p08-diagnostico-build.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspeccionar limites del cuerpo recuperado
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path('fuente.js').read_text(encoding='utf-8')
          src=Path('source-recovery/fuente-recuperado.js').read_text(encoding='utf-8')
          print('ROOT_BYTES',len(root.encode()))
          print('SRC_BYTES',len(src.encode()))
          print('ROOT_LINES',root.count('\n')+1)
          print('SRC_LINES',src.count('\n')+1)
          keys=['var C2 = {','function GestionAlmacen','GestionAlmacen','var ErroresSistema','ErroresSistema','createRoot']
          for k in keys:
              print('KEY',repr(k),'ROOT',root.find(k),'SRC',src.find(k))
          anchor='var C2 = {'
          ri=root.find(anchor); si=src.find(anchor)
          if ri>=0 and si>=0:
              rt=root[ri:]; st=src[si:]
              print('ANCHOR_ROOT_TAIL_CHARS',len(rt),'ANCHOR_SRC_TAIL_CHARS',len(st))
              n=min(len(rt),len(st))
              first=next((j for j in range(n) if rt[j]!=st[j]),None)
              print('FIRST_DIFF_FROM_C2',first)
              if first is not None:
                  print('ROOT_AT_FIRST_DIFF',repr(rt[max(0,first-300):first+900]))
                  print('SRC_AT_FIRST_DIFF',repr(st[max(0,first-300):first+900]))
              # sufijo común
              common=0
              maxs=min(len(rt),len(st))
              while common < maxs and rt[-1-common] == st[-1-common]: common += 1
              print('COMMON_SUFFIX_CHARS',common)
              if common:
                  print('COMMON_SUFFIX_HEAD',repr(rt[-common:-common+500]))
              print('ROOT_TAIL_END',repr(rt[-1200:]))
              print('SRC_TAIL_END',repr(st[-1200:]))
          print('ROOT_HEAD',repr(root[:1200]))
          print('SRC_HEAD',repr(src[:1200]))
          PY
