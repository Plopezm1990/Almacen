name: G1 P08 diagnostico build

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p08-diagnostico-build.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Probar variantes de reextraccion
        run: |
          cd source-recovery
          npm ci
          cp fuente-recuperado.js fuente-recuperado.original
          python - <<'PY'
          from pathlib import Path
          root=Path('../fuente.js').read_text(encoding='utf-8')
          src=Path('fuente-recuperado.original').read_text(encoding='utf-8')
          anchor='var C2 = {'
          ri=root.find(anchor); si=src.find(anchor)
          if ri<0 or si<0: raise SystemExit('anchor_missing')
          markers=['Bundled license information','/*! Bundled license information','/** Bundled license information']
          print('ROOT_ANCHOR',ri,'SRC_ANCHOR',si)
          for m in markers:
              print('LICENSE_MARKER',repr(m),'ROOT',root.find(m,ri),'SRC',src.find(m,si))
          rlic=root.find('Bundled license information',ri)
          slic=src.find('Bundled license information',si)
          # retroceder al inicio del comentario si existe.
          def comment_start(text,pos):
              if pos<0: return -1
              a=text.rfind('/*!',0,pos)
              b=text.rfind('/**',0,pos)
              return max(a,b)
          rstart=comment_start(root,rlic); sstart=comment_start(src,slic)
          print('LICENSE_START ROOT',rstart,'SRC',sstart)
          header=src[:si]
          variants={
            'body_only': header + (root[ri:rstart] if rstart>=0 else root[ri:]),
            'body_plus_old_licenses': header + (root[ri:rstart] if rstart>=0 else root[ri:]) + (src[sstart:] if sstart>=0 else ''),
            'full_root_tail': header + root[ri:],
          }
          for name,data in variants.items():
              Path(f'{name}.js').write_text(data,encoding='utf-8')
              print('VARIANT',name,'BYTES',len(data.encode()))
          PY
          for v in body_only body_plus_old_licenses full_root_tail; do
            cp "$v.js" fuente-recuperado.js
            npx esbuild entrada-recuperada.js --bundle --platform=browser --format=esm --target=es2020 --outfile="dist/$v.js"
            echo "--- $v ---"
            sha256sum "dist/$v.js" ../fuente.js
            if cmp -s "dist/$v.js" ../fuente.js; then echo "VARIANT_MATCH=$v"; else echo "VARIANT_MATCH_${v}=NO"; fi
          done
          mv fuente-recuperado.original fuente-recuperado.js
