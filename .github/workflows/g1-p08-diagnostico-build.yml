name: G1 P08 diagnostico build

on:
  push:
    branches: [g1-nucleo-seguro]
    paths:
      - '.github/workflows/g1-p08-diagnostico-build.yml'

permissions:
  contents: read

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Localizar commit que coincide con el build recuperado
        run: |
          cd source-recovery
          npm ci
          npm run check
          npm run build
          BASE_SHA=$(sha256sum dist/fuente.js | awk '{print $1}')
          TARGET_SHA=$(sha256sum ../fuente.js | awk '{print $1}')
          echo "BASE_BUILD_SHA=$BASE_SHA"
          echo "TARGET_SHA=$TARGET_SHA"
          cd ..
          FOUND=''
          while read -r c; do
            if git cat-file -e "$c:fuente.js" 2>/dev/null; then
              s=$(git show "$c:fuente.js" | sha256sum | awk '{print $1}')
              if [ "$s" = "$BASE_SHA" ]; then
                FOUND="$c"
                break
              fi
            fi
          done < <(git log --all --format=%H -- fuente.js)
          if [ -z "$FOUND" ]; then
            echo 'BASELINE_COMMIT=NOT_FOUND'
          else
            echo "BASELINE_COMMIT=$FOUND"
            git show -s --format='BASELINE_MESSAGE=%s%nBASELINE_DATE=%cI' "$FOUND"
            echo "COMMITS_FUENTE_AFTER_BASE=$(git rev-list --count "$FOUND..HEAD" -- fuente.js)"
            echo 'COMMITS_FUENTE_AFTER_BASE_LIST_BEGIN'
            git log --reverse --format='%H|%cI|%s' "$FOUND..HEAD" -- fuente.js
            echo 'COMMITS_FUENTE_AFTER_BASE_LIST_END'
          fi
          echo 'DIFF_STATS_BEGIN'
          git diff --no-index --numstat source-recovery/dist/fuente.js fuente.js || true
          echo 'DIFF_STATS_END'
          git diff --no-index --text --minimal --no-prefix source-recovery/dist/fuente.js fuente.js > /tmp/current-overlay.patch || true
          echo "OVERLAY_BYTES=$(wc -c < /tmp/current-overlay.patch)"
          echo "OVERLAY_LINES=$(wc -l < /tmp/current-overlay.patch)"
