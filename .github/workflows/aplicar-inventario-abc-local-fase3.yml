name: Aplicar Inventario y ABC por local fase 3
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/aplicar-inventario-abc-local-fase3.yml
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche con guardas
        run: python3 .github/scripts/aplicar_inventario_abc_local_fase3.py
      - name: Validar JavaScript y diff
        run: |
          node --check fuente.js
          git diff --check
          git diff --stat
          git diff -- fuente.js | sed -n '1,520p'
      - name: Guardar y retirar herramientas temporales
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/scripts/aplicar_inventario_abc_local_fase3.py
          rm -f .github/workflows/aplicar-inventario-abc-local-fase3.yml
          rm -f .github/workflows/inspeccionar-inventario-abc-fase3.yml
          rm -f .github/workflows/inspeccionar-anclas-inventario-fase3.yml
          git add fuente.js .github/scripts/aplicar_inventario_abc_local_fase3.py .github/workflows/aplicar-inventario-abc-local-fase3.yml .github/workflows/inspeccionar-inventario-abc-fase3.yml .github/workflows/inspeccionar-anclas-inventario-fase3.yml
          git diff --cached --check
          git commit -m 'Aislar inventario ciego y ABC por local'
          git push origin HEAD:multilocal-fase-3