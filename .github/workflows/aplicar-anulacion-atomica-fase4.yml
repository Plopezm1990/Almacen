name: Aplicar anulacion atomica fase 4
on:
  push:
    branches: [tpv-ventas-fase-4]
    paths:
      - .github/workflows/aplicar-anulacion-atomica-fase4.yml
      - .github/scripts/aplicar_anulacion_atomica_fase4.py
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar parche
        run: python3 .github/scripts/aplicar_anulacion_atomica_fase4.py
      - name: Validar
        run: |
          node --check fuente.js
          git diff --check
          test "$(grep -o 'anular_venta_tpv' fuente.js | wc -l)" -eq 1
          test "$(grep -o 'async function anularVenta(' fuente.js | wc -l)" -eq 1
          test "$(grep -o 'function anularVentaLocal(' fuente.js | wc -l)" -eq 1
          test "$(grep -o 'async function confirmarAnulacion()' fuente.js | wc -l)" -eq 1
          test "$(grep -o 'await anularVenta(confirmAnular.ventaId' fuente.js | wc -l)" -eq 1
      - name: Limpiar y guardar
        run: |
          git rm -f .github/workflows/aplicar-anulacion-atomica-fase4.yml .github/workflows/inspeccionar-handler-anulacion-fase4.yml .github/scripts/aplicar_anulacion_atomica_fase4.py
          node --check fuente.js
          git diff --check
          git config user.name "Plopezm1990"
          git config user.email "pedroroger1990@gmail.com"
          git add fuente.js
          git commit -m "Conectar anulacion atomica de ventas"
          git push origin HEAD:tpv-ventas-fase-4