name: Auditoría final multilocal fase 3 segunda pasada
on:
  push:
    branches: [multilocal-fase-3]
    paths:
      - .github/workflows/auditoria-final-multilocal-fase3-2.yml
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar huecos exactos restantes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          def bloque_func(nombre):
              i=s.find('function '+nombre+'(')
              print('\n===== FUNC '+nombre+' '+str(i)+' =====')
              if i>=0:
                  j=s.find('\nfunction ',i+10)
                  if j<0: j=min(len(s),i+18000)
                  print(s[i:j])
          for nombre in ['crearLogicaGastos','crearLogicaFichaje','crearLogicaTurnos','crearLogicaEmpleados']:
              bloque_func(nombre)
          for tab in ['gastos','fichaje','turnos','personal','mapa','diagnostico','reportes']:
              i=s.find('tab === "'+tab+'"')
              print('\n===== TAB '+tab+' '+str(i)+' =====')
              if i>=0:
                  siguiente=s.find('tab === "',i+10)
                  if siguiente<0 or siguiente>i+10000: siguiente=min(len(s),i+10000)
                  print(s[max(0,i-700):siguiente+300])
          for termino in [
              'const recordatorioConteo =',
              '{ id: "traspasos", label:',
              'const descuadresPendientes =',
              'const diagnosticoStock =',
              'diagnosticoStock =',
              'movimientosParaReconciliar',
              'gastosGeneralesDelLocalActivo',
              'empleadosDelLocalActivo',
              'fichajesDelLocalActivo',
              'turnosDelLocalActivo',
              'pisoVentaBajoDelLocalActivo'
          ]:
              print('\n===== TERM '+termino+' =====')
              pos=[]; k=0
              while True:
                  i=s.find(termino,k)
                  if i<0: break
                  pos.append(i); k=i+1
              print('POS',pos[:20])
              for i in pos[:10]: print(s[max(0,i-1400):min(len(s),i+3800)])
          PY