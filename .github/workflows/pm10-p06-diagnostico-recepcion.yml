name: PM10 P06 diagnostico LA-013 recepcion
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p06-diagnostico-recepcion.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraer bloques exactos recepcion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('fuente.js').read_text(encoding='utf-8')
          i=s.find('function procesarRecepcion(')
          print('\n===== PROCESAR_RECEPCION =====')
          if i>=0:
            print(s[max(0,i-300):min(len(s),i+15000)].replace('\n','\\n'))
          else: print('NO ENCONTRADO')
          print('\n===== LLAMADAS recibirPedido =====')
          for m in re.finditer(r'(?<!function )recibirPedido\s*\(',s):
            print('\nOFFSET',m.start(),'\n',s[max(0,m.start()-2200):min(len(s),m.start()+6500)].replace('\n','\\n'))
          print('\n===== COMPONENTES/ESTADO RECEPCION =====')
          for q in ['lineasRecepcion','cantidadesRecibir','recibirPedido(pedido','setRecibir','pedidoARecibir','showRecepcion','Recibir pedido']:
            for m in list(re.finditer(re.escape(q),s,re.I))[:15]:
              print('\nQ',q,'OFFSET',m.start(),'\n',s[max(0,m.start()-1800):min(len(s),m.start()+5000)].replace('\n','\\n'))
          PY
