name: PM10 P06 diagnostico LA-013 recepcion
on:
  push:
    branches: [pm10-validaciones-altas-datos-legados]
    paths:
      - '.github/workflows/pm10-p06-diagnostico-recepcion.yml'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Extraer confirmacion albaran y componente Recepcion
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('fuente.js').read_text(encoding='utf-8')
          for label,q,n in [
            ('CONFIRMAR_ALBARAN','function confirmarAlbaran(',18000),
            ('COMPONENTE_RECEPCION','function Recepcion(',22000),
            ('GUARDAR_ALBARAN_UI','function guardar()',10000)
          ]:
            print('\n===== '+label+' =====')
            i=s.find(q)
            if i<0: print('NO ENCONTRADO',q)
            else: print(s[max(0,i-400):min(len(s),i+n)].replace('\n','\\n'))
          PY
