name: PM11 P08 vínculo cuenta empleado

on:
  push:
    branches: [pm11-personal-empleados]
    paths:
      - '.github/workflows/pm11-p08-vinculo-cuenta-empleado.yml'
      - 'supabase/migrations/20260906094500_pm11_vinculo_cuenta_empleado_integridad.sql'
      - 'tests/pm11/P08_VINCULO_CUENTA_EMPLEADO_INTEGRIDAD_EVIDENCIA.md'
      - 'tests/pm11/p08-vinculo-cuenta-empleado-contract.mjs'

permissions:
  contents: read

jobs:
  vinculo-cuenta-empleado-pm11:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar origen, alcance P08 y main intacto
        run: |
          set -e
          test "$GITHUB_REF_NAME" = "pm11-personal-empleados"
          git merge-base --is-ancestor 1e21458b48a11302c59911ef966ded0aca3eb639 HEAD
          git merge-base --is-ancestor 2c2f66617ad9bd24324babcd9c2601ce1c870ab5 HEAD
          test "$(git rev-parse origin/main)" = "7f792925d6a3d27334ee0e7335ba635b4ed79b6b"
          git diff --quiet 2c2f66617ad9bd24324babcd9c2601ce1c870ab5 -- fuente.js source-recovery
          test "$(git diff --name-only 2c2f66617ad9bd24324babcd9c2601ce1c870ab5 -- supabase/migrations)" = "supabase/migrations/20260906094500_pm11_vinculo_cuenta_empleado_integridad.sql"
          echo 'PM11_P08_ALCANCE=PASS'
          echo "PM11_P08_SHA=$(git rev-parse HEAD)"

      - name: Sintaxis fuente
        run: node --check fuente.js

      - name: Contrato P08 vínculo cuenta empleado
        run: node tests/pm11/p08-vinculo-cuenta-empleado-contract.mjs

      - name: Regresión P07 migración legacy
        run: node tests/pm11/p07-migracion-controlada-legacy-contract.mjs

      - name: Regresión P06 puente frontend SQL
        run: node tests/pm11/p06-puente-frontend-sql-contract.mjs

      - name: Regresión Personal LA-017
        run: node tests/pm10/p07-personal-contract.mjs

      - name: Regresiones PM11 P05 a P01
        run: |
          set -e
          node tests/pm11/p05-rpc-ciclo-vida-contract.mjs
          node tests/pm11/p04-empleados-rls-contract.mjs
          node tests/pm11/p03-identidad-ciclo-vida-contract.mjs
          node tests/pm11/p02-mapa-personal-contract.mjs
          node tests/pm11/p01-checkpoint-contract.mjs

      - name: Reproducibilidad fuente P06 sin cambios P08
        run: |
          set -e
          cd source-recovery
          npm ci
          npm run check
          npm run build:current
          cd ..
          python3 tools/corregir_pm11_p06_frontend.py source-recovery/dist/fuente.js
          python3 tools/corregir_pm11_p06_sintaxis.py source-recovery/dist/fuente.js
          node --check source-recovery/dist/fuente.js
          cmp -s source-recovery/dist/fuente.js fuente.js
          echo 'PM11_P08_BUILD_REPRODUCIBLE=PASS'

      - name: Resumen P08
        run: |
          echo 'PM11_P08_VINCULO_CUENTA_EMPLEADO_INTEGRIDAD=PASS'
          echo 'PM11_SIGUIENTE=P09_CREACION_CUENTA_EMPLEADO_SEGURA'
