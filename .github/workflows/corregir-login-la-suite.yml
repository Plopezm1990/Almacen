name: Corregir login L&A Suite
on:
  push:
    paths:
      - '.github/workflows/corregir-login-la-suite.yml'
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar identidad al acceso y recuperación
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('fuente.js')
          s = p.read_text(encoding='utf-8')
          old = '/* @__PURE__ */ import_react4.default.createElement("div", { style: { fontSize: 18, fontWeight: 700, marginBottom: 4, color: "#17241C" } }, "Chocoloyos"), /* @__PURE__ */ import_react4.default.createElement("div", { style: { fontSize: 12.5, color: "#6B7A6E", marginBottom: 22 } }, "Inicia sesi\\xF3n para sincronizar entre dispositivos")'
          new = '/* @__PURE__ */ import_react4.default.createElement("img", { src: LOGO_PROYECTO, alt: "L&A Suite", style: { width: "min(210px,72%)", height: "auto", display: "block", marginBottom: 10 } }), /* @__PURE__ */ import_react4.default.createElement("div", { style: { fontSize: 12.5, color: "#6B7A6E", marginBottom: 22 } }, "Inicia sesi\\xF3n para sincronizar entre dispositivos")'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Login esperado 1 vez; encontrado {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('restablecer-contrasena.html')
          s = p.read_text(encoding='utf-8')
          cambios = {
              '<title>Restablecer contraseña · Chocoloyos</title>': '<title>Restablecer contraseña · L&A Suite</title>',
              '<h1>Chocoloyos</h1>': '<h1>L&amp;A Suite</h1>',
              'Ya puedes volver a Chocoloyos e iniciar sesión': 'Ya puedes volver a L&amp;A Suite e iniciar sesión',
              '>Volver a Chocoloyos</a>': '>Volver a L&amp;A Suite</a>',
          }
          for old, new in cambios.items():
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'Restablecer: {old!r} esperado 1 vez; encontrado {n}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          old = 'let datos = { titulo: "Chocoloyos Almacén", cuerpo: "Tienes una notificación nueva.", url: "/" };'
          new = 'let datos = { titulo: "L&A Suite", cuerpo: "Tienes una notificación nueva.", url: "/" };'
          n = s.count(old)
          if n != 1:
              raise SystemExit(f'Service worker: título esperado 1 vez; encontrado {n}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validar corrección
        run: |
          set -euo pipefail
          node --check fuente.js
          node --check sw.js
          grep -q 'src: LOGO_PROYECTO, alt: "L&A Suite"' fuente.js
          grep -q '<h1>L&amp;A Suite</h1>' restablecer-contrasena.html
          grep -q 'titulo: "L&A Suite"' sw.js
          git diff --check
      - name: Limpiar temporales y guardar
        run: |
          set -euo pipefail
          rm -f .github/workflows/inspeccionar-login-la-suite.yml
          rm -f .github/workflows/corregir-login-la-suite.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuente.js restablecer-contrasena.html sw.js .github
          git diff --cached --check
          git commit -m 'Corregir identidad L&A Suite en acceso y recuperación'
          git push origin HEAD:la-suite-identidad
