<!doctype html>
<html lang="es" data-la-diseno="orbita">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15171B">
  <title>Restablecer contraseña · L&A Suite</title>
    <link rel="stylesheet" href="./la-apariencia.css?v=qa-orbita-modules-v65-20261121">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:var(--la-space-5,20px);background:radial-gradient(circle at 50% 26%,var(--c-chrome,#15171B) 0%,var(--c-bg,#17191C) 44%,#08090B 100%);color:var(--c-ink,#F1F3F6);font-family:var(--la-font,"Inter","Segoe UI",system-ui,sans-serif)}
    .card{width:min(440px,100%);background:var(--c-surface,#202328);border:1px solid var(--c-divider,#343941);border-radius:var(--la-radius-xl,18px);padding:var(--la-space-7,32px);box-shadow:var(--la-shadow-2,0 12px 32px rgba(0,0,0,.14))}
    .brand{display:block;width:min(70%,230px);height:auto;margin:0 auto 4px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.28))}
    h1{font-family:var(--la-display,var(--la-font));text-align:center;font-size:var(--la-type-title,24px);margin:0 0 7px;color:var(--c-ink,#F1F3F6)}
    .sub{color:var(--c-ink-soft,#929DA7);line-height:1.5;font-size:var(--la-type-body,14px);margin:0 0 var(--la-space-6,24px);text-align:center}
    label{display:block;font-weight:700;font-size:var(--la-type-label,12px);margin:var(--la-space-3,12px) 0 7px;color:var(--c-ink-soft,#929DA7)}
    input{width:100%;min-height:var(--la-control-height,44px);padding:0 14px;border:1px solid var(--c-border-control,#737D88);border-radius:var(--la-radius-md,10px);background:var(--c-bg,#17191C);color:var(--c-ink,#F1F3F6);font:inherit;outline:none}
    input:focus{border-color:var(--c-accent-fill,#FF4B32);box-shadow:0 0 0 3px color-mix(in srgb,var(--c-accent-fill,#FF4B32) 18%,transparent)}
    button{width:100%;min-height:var(--la-control-height-large,48px);margin-top:var(--la-space-4,16px);padding:0 14px;border:1px solid var(--c-accent-fill,#FF4B32);border-radius:var(--la-radius-md,10px);background:var(--c-accent-fill,#FF4B32);color:var(--c-on-accent,#17191C);font:inherit;font-weight:800;cursor:pointer;box-shadow:var(--la-shadow-1,0 2px 12px rgba(0,0,0,.08))}
    button:disabled{opacity:.55;cursor:default}.msg{margin-top:12px;min-height:20px;font-size:var(--la-type-label,12px);line-height:1.4;color:var(--c-ink-soft,#929DA7)}.msg.error{color:var(--c-red,#FFB5A9)}.ok{padding:13px;border-radius:var(--la-radius-md,10px);background:var(--c-accent-soft,#342727);border:1px solid var(--c-divider,#343941);color:var(--c-ink,#F1F3F6);margin-top:14px;font-size:var(--la-type-label,12px);line-height:1.5}.volver{display:flex;align-items:center;justify-content:center;margin-top:18px;text-align:center;color:var(--c-accent,#FF8E7D);font-size:var(--la-type-label,12px);text-underline-offset:3px;min-height:var(--la-control-height,44px);line-height:1.2}.hidden{display:none!important}
  </style>
</head>
<body>
  <main class="card">
    <img class="brand" src="la-suite-logo.svg" alt="L&amp;A Suite">
    <h1>L&amp;A Suite</h1>
    <p class="sub" id="intro">Recupera el acceso a tu cuenta sin modificar ningún dato del negocio.</p>

    <section id="solicitar">
      <label for="email">Correo de la cuenta</label>
      <input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
      <button id="enviar" type="button">Enviar enlace de recuperación</button>
      <div id="msgEnviar" class="msg" aria-live="polite"></div>
    </section>

    <section id="cambiar" class="hidden">
      <label for="pass1">Nueva contraseña</label>
      <input id="pass1" type="password" autocomplete="new-password" minlength="8">
      <label for="pass2">Repetir contraseña</label>
      <input id="pass2" type="password" autocomplete="new-password" minlength="8">
      <button id="guardar" type="button">Guardar nueva contraseña</button>
      <div id="msgGuardar" class="msg" aria-live="polite"></div>
    </section>

    <section id="final" class="hidden">
      <div class="ok">Contraseña actualizada correctamente. Ya puedes volver a L&amp;A Suite e iniciar sesión con la nueva contraseña.</div>
    </section>

    <a class="volver" href="./">Volver a L&amp;A Suite</a>
  </main>

<script src="./restablecer-contrasena.js"></script>
</body>
</html>
