/* ================= FICHAS DE COSTO ================= */
function fichaVacia() {
  return {
    nombre: "",
    productoVinculadoId: "",
    rendimiento: 1,
    componentes: [],
    empaque: "",
    manoObra: "",
    otros: "",
    precioVenta: "",
  };
}

function FichasCosto({ fichasCosto, productos, addFichaCosto, deleteFichaCosto }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(fichaVacia());
  const [error, setError] = useState("");

  function addComponente() {
    setForm((f) => ({
      ...f,
      componentes: [...f.componentes, { productoId: "", nombre: "", unidad: "unidad", cantidad: 1, costoUnitario: 0 }],
    }));
  }
  function updateComponente(idx, campo, valor) {
    setForm((f) => ({
      ...f,
      componentes: f.componentes.map((c, i) => {
        if (i !== idx) return c;
        if (campo === "productoId") {
          const p = productos.find((pr) => pr.id === valor);
          if (p) return { ...c, productoId: valor, nombre: p.nombre, unidad: p.unidad, costoUnitario: p.costo };
          return { ...c, productoId: "" };
        }
        return { ...c, [campo]: valor };
      }),
    }));
  }
  function removeComponente(idx) {
    setForm((f) => ({ ...f, componentes: f.componentes.filter((_, i) => i !== idx) }));
  }

  const costoComponentes = form.componentes.reduce((a, c) => a + (Number(c.cantidad) || 0) * (Number(c.costoUnitario) || 0), 0);
  const costoAdicionales = (Number(form.empaque) || 0) + (Number(form.manoObra) || 0) + (Number(form.otros) || 0);
  const costoTotal = costoComponentes + costoAdicionales;
  const rendimiento = Number(form.rendimiento) || 1;
  const costoPorUnidad = costoTotal / rendimiento;
  const precioVentaNum = Number(form.precioVenta) || 0;
  const margen = precioVentaNum > 0 ? ((precioVentaNum - costoPorUnidad) / precioVentaNum) * 100 : null;

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del producto o receta.");
      return;
    }
    if (form.componentes.length === 0) {
      setError("Añade al menos un ingrediente o insumo.");
      return;
    }
    setError("");
    addFichaCosto({ ...form, rendimiento });
    setForm(fichaVacia());
    setShowForm(false);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Nueva ficha de costo</Btn>}>
        Fichas de costo
      </SectionTitle>

      {!showForm && (
        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="text-[12.5px]" style={{ color: C.ink }}>
            Una ficha de costo desglosa todos los ingredientes o insumos de un producto que vendes, para saber exactamente cuánto cuesta producirlo y qué margen real deja frente a tu precio de venta.
          </div>
        </Card>
      )}

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre del producto / receta">
              <Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Ej. Caja de bombones x12" />
            </Field>
            <Field label="Vincular a un producto del catálogo (opcional)">
              <select value={form.productoVinculadoId} onChange={(e) => setForm({ ...form, productoVinculadoId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                <option value="">Sin vincular</option>
                {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
              </select>
            </Field>
            <Field label="Rendimiento (unidades que produce esta receta)">
              <Input type="number" value={form.rendimiento} onChange={(e) => setForm({ ...form, rendimiento: e.target.value })} placeholder="1" />
            </Field>
          </div>

          <div className="mb-2 text-[12px] font-medium" style={{ color: C.inkSoft }}>Ingredientes / insumos</div>
          {form.componentes.map((c, idx) => (
            <div key={idx} className="grid md:grid-cols-12 gap-2 items-center mb-2">
              <select
                value={c.productoId}
                onChange={(e) => updateComponente(idx, "productoId", e.target.value)}
                className="md:col-span-3 rounded-lg px-2 py-2 text-[12px]"
                style={{ border: `1px solid ${C.line}` }}
              >
                <option value="">Ingrediente libre</option>
                {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
              </select>
              <Input className="md:col-span-3" value={c.nombre} onChange={(e) => updateComponente(idx, "nombre", e.target.value)} placeholder="Nombre" />
              <Input className="md:col-span-1" value={c.unidad} onChange={(e) => updateComponente(idx, "unidad", e.target.value)} placeholder="ud/kg" />
              <Input className="md:col-span-2" type="number" value={c.cantidad} onChange={(e) => updateComponente(idx, "cantidad", e.target.value)} placeholder="Cantidad" />
              <Input className="md:col-span-2" type="number" step="0.01" value={c.costoUnitario} onChange={(e) => updateComponente(idx, "costoUnitario", e.target.value)} placeholder="Costo u. (€)" />
              <div className="md:col-span-1 flex items-center justify-between">
                <span className="mono text-[12px]">€{fmt((Number(c.cantidad) || 0) * (Number(c.costoUnitario) || 0))}</span>
                <button type="button" onClick={() => removeComponente(idx)}><X size={15} color={C.inkSoft} /></button>
              </div>
            </div>
          ))}
          <button type="button" onClick={addComponente} className="text-[12.5px] font-medium mb-4" style={{ color: C.accent }}>+ Añadir ingrediente / insumo</button>

          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Empaque (€, opcional)"><Input type="number" step="0.01" value={form.empaque} onChange={(e) => setForm({ ...form, empaque: e.target.value })} /></Field>
            <Field label="Mano de obra (€, opcional)"><Input type="number" step="0.01" value={form.manoObra} onChange={(e) => setForm({ ...form, manoObra: e.target.value })} /></Field>
            <Field label="Otros costos (€, opcional)"><Input type="number" step="0.01" value={form.otros} onChange={(e) => setForm({ ...form, otros: e.target.value })} /></Field>
          </div>
          <Field label="Precio de venta al público (€)">
            <Input type="number" step="0.01" value={form.precioVenta} onChange={(e) => setForm({ ...form, precioVenta: e.target.value })} placeholder="Opcional, para calcular el margen" />
          </Field>

          <Card style={{ background: C.bg, border: `1px solid ${C.line}` }} className="mb-3">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Costo total</div>
                <div className="mono font-semibold text-[15px]">€{fmt(costoTotal)}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Costo por unidad</div>
                <div className="mono font-semibold text-[15px]">€{fmt(costoPorUnidad)}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Precio de venta</div>
                <div className="mono font-semibold text-[15px]">{precioVentaNum > 0 ? `€${fmt(precioVentaNum)}` : "—"}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Margen</div>
                <div className="mono font-semibold text-[15px]" style={{ color: margen == null ? C.ink : margen < 15 ? C.red : C.accent }}>
                  {margen == null ? "—" : `${fmt(margen)}%`}
                </div>
              </div>
            </div>
          </Card>

          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>Guardar ficha de costo</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); setForm(fichaVacia()); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {fichasCosto.length === 0 ? <Empty text="Todavía no has creado ninguna ficha de costo." /> : (
        <div className="grid md:grid-cols-2 gap-3">
          {fichasCosto.map((f) => {
            const costoComp = f.componentes.reduce((a, c) => a + (Number(c.cantidad) || 0) * (Number(c.costoUnitario) || 0), 0);
            const costoAdi = (Number(f.empaque) || 0) + (Number(f.manoObra) || 0) + (Number(f.otros) || 0);
            const total = costoComp + costoAdi;
            const rend = Number(f.rendimiento) || 1;
            const porUnidad = total / rend;
            const pv = Number(f.precioVenta) || 0;
            const marg = pv > 0 ? ((pv - porUnidad) / pv) * 100 : null;
            return (
              <Card key={f.id}>
                <div className="flex items-start justify-between mb-2">
                  <div>
                    <div className="font-semibold">{f.nombre}</div>
                    <div className="text-[11px]" style={{ color: C.inkSoft }}>Rinde {rend} unidad(es)</div>
                  </div>
                  <button onClick={() => deleteFichaCosto(f.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                </div>
                <div className="space-y-1 mb-2">
                  {f.componentes.map((c, i) => (
                    <div key={i} className="flex items-center justify-between text-[12px]">
                      <span>{c.nombre} <span style={{ color: C.inkSoft }}>({c.cantidad} {c.unidad})</span></span>
                      <span className="mono">€{fmt((Number(c.cantidad) || 0) * (Number(c.costoUnitario) || 0))}</span>
                    </div>
                  ))}
                  {costoAdi > 0 && (
                    <div className="flex items-center justify-between text-[12px]">
                      <span>Costos adicionales</span>
                      <span className="mono">€{fmt(costoAdi)}</span>
                    </div>
                  )}
                </div>
                <div className="pt-2 flex items-center justify-between text-[13px]" style={{ borderTop: `1px solid ${C.line}` }}>
                  <span className="font-medium">Costo por unidad</span>
                  <span className="mono font-semibold">€{fmt(porUnidad)}</span>
                </div>
                {pv > 0 && (
                  <div className="flex items-center justify-between text-[13px] mt-1">
                    <span className="font-medium">Margen sobre €{fmt(pv)}</span>
                    <span className="mono font-semibold" style={{ color: marg < 15 ? C.red : C.accent }}>{fmt(marg)}%</span>
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ================= RESPALDOS ================= */
function Respaldos({ historial, crearPuntoDeGuardado, restaurarDesdeHistorial, abrirRespaldo, abrirRestaurar }) {
  const [guardado, setGuardado] = useState(false);

  function guardarAhora() {
    crearPuntoDeGuardado();
    setGuardado(true);
    setTimeout(() => setGuardado(false), 2000);
  }

  function contar(data) {
    return (data.proveedores?.length || 0) + (data.productos?.length || 0) + (data.pedidos?.length || 0);
  }

  return (
    <div>
      <SectionTitle>Respaldos</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]" style={{ color: C.ink }}>
          Todo lo que capturas en este programa ya se guarda automáticamente en tu cuenta, no solo en este teléfono — si abres esta misma conversación desde otro dispositivo, verás la misma información. Aquí además puedes crear copias de seguridad puntuales, para poder volver atrás si algo se borra o se modifica por error.
        </div>
      </Card>

      <Card className="mb-4">
        <div className="flex items-center justify-between">
          <div>
            <div className="font-semibold text-[14px]">Crear copia de seguridad ahora</div>
            <div className="text-[12px]" style={{ color: C.inkSoft }}>Guarda el estado actual de todo el programa como un punto al que podrás volver.</div>
          </div>
          <Btn onClick={guardarAhora}><History size={14} /> {guardado ? "¡Guardada!" : "Guardar copia"}</Btn>
        </div>
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Historial de copias guardadas</div>
      {historial.length === 0 ? <Empty text="Todavía no hay copias de seguridad guardadas." /> : (
        <div className="space-y-2 mb-6">
          {historial.map((h) => (
            <Card key={h.id}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-[13px] font-medium">{new Date(h.fecha).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" })}</div>
                  <div className="text-[11px]" style={{ color: C.inkSoft }}>
                    {h.automatica ? "Copia automática de inicio de sesión" : "Copia manual"} · {contar(h.data)} registros principales
                  </div>
                </div>
                <Btn small variant="ghost" onClick={() => restaurarDesdeHistorial(h)}>Restaurar esta copia</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Copia portátil (para guardar fuera del programa)</div>
      <Card>
        <div className="text-[12.5px] mb-3" style={{ color: C.inkSoft }}>
          Si quieres una copia que puedas guardar tú mismo fuera de aquí (en tus notas, correo, etc.), puedes verla como texto y copiarla, o pegar una que hayas guardado antes.
        </div>
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={abrirRespaldo}><Download size={14} /> Ver / copiar respaldo</Btn>
          <Btn variant="ghost" onClick={abrirRestaurar}><Upload size={14} /> Restaurar desde texto</Btn>
        </div>
      </Card>
    </div>
  );
}
