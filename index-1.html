<script>
  // Guardado local en el propio tel&eacute;fono (sustituye a window.storage de Claude)
  window.storage = {
    async get(key) {
      const v = localStorage.getItem("almacen:" + key);
      if (v === null) throw new Error("no existe");
      return { key: key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem("almacen:" + key, value);
      return { key: key, value: value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem("almacen:" + key);
      return { key: key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("almacen:")) keys.push(k.slice(8));
      }
      return { keys: keys, shared: false };
    }
  };
</script>

<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useMemo } from "react";
import {
  Package, Truck, ShoppingCart, ClipboardList, BarChart3, Boxes,
  AlertTriangle, Mail, MessageCircle, Plus, X, Trash2, CheckCircle2,
  ArrowUpCircle, ArrowDownCircle, Search, Eye, EyeOff, Loader2, ChevronRight,
  Calculator, Download, Upload, History
} from "lucide-react";

/* ============ TOKENS DE DISEÑO ============
Fondo: #F4F5F3 (gris-hueso neutro)
Superficie: #FFFFFF
Tinta: #14201C (verde-negro, tono "libro mayor")
Acento primario: #2F6F4E (verde contable, confianza/dinero)
Acento ámbar (alertas de stock): #B45309
Acento rojo (faltantes/errores): #B91C1C
Tipografía: IBM Plex Sans (UI) + IBM Plex Mono (cifras, como un libro de almacén)
Firma visual: los números clave siempre en mono, alineados como una columna de libro mayor
=========================================== */

const C = {
  bg: "#F4F5F3",
  surface: "#FFFFFF",
  ink: "#14201C",
  inkSoft: "#4B5A54",
  line: "#DFE3DF",
  accent: "#2F6F4E",
  accentSoft: "#E7F0EA",
  amber: "#B45309",
  amberSoft: "#FBEEE0",
  red: "#B91C1C",
  redSoft: "#FBEAEA",
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmt = (n) => (Number(n) || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);

async function loadKey(key, fallback, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await window.storage.get(key, false);
      if (res && res.value) return JSON.parse(res.value);
      return fallback; // la clave genuinamente no existe todavía (primer uso)
    } catch (e) {
      if (attempt === retries) {
        console.error("No se pudo cargar", key, "tras varios intentos:", e);
        return fallback;
      }
      await new Promise((r) => setTimeout(r, 350));
    }
  }
  return fallback;
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("Error guardando", key, e);
  }
}

function GestionAlmacen() {
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const skipSaveRef = React.useRef(true); // evita guardar en el primer instante tras cargar
  const autoSnapshotRef = React.useRef(false); // evita crear más de una copia automática por sesión

  const [proveedores, setProveedores] = useState([]);
  const [productos, setProductos] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [movimientos, setMovimientos] = useState([]);
  const [conteos, setConteos] = useState([]);
  const [fichasCosto, setFichasCosto] = useState([]);
  const [historial, setHistorial] = useState([]);

  useEffect(() => {
    (async () => {
      const [p, pr, pe, mo, co, fc, hi] = await Promise.all([
        loadKey("proveedores", []),
        loadKey("productos", []),
        loadKey("pedidos", []),
        loadKey("movimientos", []),
        loadKey("conteos", []),
        loadKey("fichasCosto", []),
        loadKey("historialRespaldos", []),
      ]);
      setProveedores(p);
      setProductos(pr);
      setPedidos(pe);
      setMovimientos(mo);
      setConteos(co);
      setFichasCosto(fc);
      setHistorial(hi);
      setReady(true);
      // Solo después de que el estado ya se pintó con los datos cargados
      // habilitamos el guardado automático, para no sobrescribir nada
      // por un fallo de lectura pasajero.
      setTimeout(() => { skipSaveRef.current = false; }, 400);

      // Copia de seguridad automática: una por sesión, para poder recuperar
      // el estado con el que se abrió el programa si algo sale mal después.
      if (!autoSnapshotRef.current) {
        autoSnapshotRef.current = true;
        const tieneDatos = p.length || pr.length || pe.length || mo.length || co.length || fc.length;
        if (tieneDatos) {
          const snapshot = {
            id: uid(),
            fecha: new Date().toISOString(),
            automatica: true,
            data: { proveedores: p, productos: pr, pedidos: pe, movimientos: mo, conteos: co, fichasCosto: fc },
          };
          setHistorial((s) => [snapshot, ...hi].slice(0, 12));
        }
      }
    })();
  }, []);

  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("proveedores", proveedores); }, [proveedores, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("productos", productos); }, [productos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("pedidos", pedidos); }, [pedidos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("movimientos", movimientos); }, [movimientos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("conteos", conteos); }, [conteos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("fichasCosto", fichasCosto); }, [fichasCosto, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("historialRespaldos", historial); }, [historial, ready]);

  const productoPorId = (id) => productos.find((p) => p.id === id);
  const proveedorPorId = (id) => proveedores.find((p) => p.id === id);

  const [pendingRestore, setPendingRestore] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [showBackupView, setShowBackupView] = useState(false);
  const [backupText, setBackupText] = useState("");
  const [showRestoreInput, setShowRestoreInput] = useState(false);
  const [restoreText, setRestoreText] = useState("");
  const [copiado, setCopiado] = useState(false);

  function crearPuntoDeGuardado() {
    const snapshot = {
      id: uid(),
      fecha: new Date().toISOString(),
      automatica: false,
      data: { proveedores, productos, pedidos, movimientos, conteos, fichasCosto },
    };
    setHistorial((s) => [snapshot, ...s].slice(0, 12));
  }
  function restaurarDesdeHistorial(snapshot) {
    setPendingRestore({ ...snapshot.data, exportadoEl: snapshot.fecha });
  }

  function abrirRespaldo() {
    const data = {
      version: 1,
      exportadoEl: new Date().toISOString(),
      proveedores, productos, pedidos, movimientos, conteos, fichasCosto,
    };
    setBackupText(JSON.stringify(data));
    setCopiado(false);
    setShowBackupView(true);
  }

  function copiarRespaldo() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupText).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  function abrirRestaurar() {
    setRestoreText("");
    setRestoreError("");
    setShowRestoreInput(true);
  }

  function analizarTextoRestauracion() {
    try {
      const data = JSON.parse(restoreText.trim());
      const tieneAlgo = data && (data.proveedores || data.productos || data.pedidos || data.movimientos || data.conteos || data.fichasCosto);
      if (!tieneAlgo) throw new Error("Formato no reconocido");
      setRestoreError("");
      setShowRestoreInput(false);
      setPendingRestore(data);
    } catch (err) {
      setRestoreError("Ese texto no parece un respaldo válido. Revisa que lo hayas copiado completo.");
    }
  }

  function confirmarRestauracion() {
    if (!pendingRestore) return;
    if (pendingRestore.proveedores) setProveedores(pendingRestore.proveedores);
    if (pendingRestore.productos) setProductos(pendingRestore.productos);
    if (pendingRestore.pedidos) setPedidos(pendingRestore.pedidos);
    if (pendingRestore.movimientos) setMovimientos(pendingRestore.movimientos);
    if (pendingRestore.conteos) setConteos(pendingRestore.conteos);
    if (pendingRestore.fichasCosto) setFichasCosto(pendingRestore.fichasCosto);
    setPendingRestore(null);
  }

  /* ---------- ACCIONES DE NEGOCIO ---------- */

  function addProveedor(data) {
    setProveedores((s) => [...s, { id: uid(), ...data }]);
  }
  function deleteProveedor(id) {
    setProveedores((s) => s.filter((p) => p.id !== id));
  }
  function addProducto(data) {
    setProductos((s) => [...s, { id: uid(), stock: Number(data.stock) || 0, ...data }]);
  }
  function updateProducto(id, data) {
    setProductos((s) => s.map((p) => (p.id === id ? { ...p, ...data } : p)));
  }
  function deleteProducto(id) {
    setProductos((s) => s.filter((p) => p.id !== id));
  }

  function crearPedido({ proveedorId, fechaEsperada, items }) {
    const pedido = {
      id: uid(),
      proveedorId,
      fecha: todayISO(),
      fechaEsperada,
      estado: "Pendiente",
      items: items.map((it) => ({ ...it, cantidadRecibida: 0 })),
    };
    setPedidos((s) => [pedido, ...s]);
    return pedido;
  }

  function actualizarPedido(pedidoId, { proveedorId, fechaEsperada, items }) {
    setPedidos((s) =>
      s.map((pe) =>
        pe.id === pedidoId
          ? { ...pe, proveedorId, fechaEsperada, items: items.map((it) => ({ ...it, cantidadRecibida: 0 })) }
          : pe
      )
    );
  }

  function eliminarPedido(pedidoId) {
    setPedidos((s) => s.filter((pe) => pe.id !== pedidoId));
  }

  function recibirPedido(pedidoId, recepciones) {
    // recepciones: { [productoId]: cantidadRecibidaAhora }
    setPedidos((s) =>
      s.map((pe) => {
        if (pe.id !== pedidoId) return pe;
        const items = pe.items.map((it) => {
          const nueva = Number(recepciones[it.productoId] || 0);
          return { ...it, cantidadRecibida: it.cantidadRecibida + nueva };
        });
        const completo = items.every((it) => it.cantidadRecibida >= it.cantidad);
        const algo = items.some((it) => it.cantidadRecibida > 0);
        return { ...pe, items, estado: completo ? "Recibido" : algo ? "Parcial" : "Pendiente" };
      })
    );
    // Actualizar stock y movimientos
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const cant = Number(recepciones[p.id] || 0);
        if (cant > 0) {
          nuevosMov.push({ id: uid(), productoId: p.id, tipo: "entrada", cantidad: cant, fecha: todayISO(), referencia: "Recepción pedido" });
          return { ...p, stock: p.stock + cant };
        }
        return p;
      })
    );
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
  }

  function registrarSalida(productoId, cantidad, referencia) {
    const cant = Number(cantidad);
    if (!cant || cant <= 0) return;
    setProductos((s) => s.map((p) => (p.id === productoId ? { ...p, stock: Math.max(0, p.stock - cant) } : p)));
    setMovimientos((s) => [{ id: uid(), productoId, tipo: "salida", cantidad: cant, fecha: todayISO(), referencia: referencia || "Salida manual" }, ...s]);
  }

  function addFichaCosto(data) {
    setFichasCosto((s) => [...s, { id: uid(), ...data }]);
  }
  function deleteFichaCosto(id) {
    setFichasCosto((s) => s.filter((f) => f.id !== id));
  }

  function crearProductoEnConteo(conteoId, datos, cantidadContada) {
    const nuevoId = uid();
    const nuevoProducto = {
      id: nuevoId,
      stock: 0,
      codigo: datos.codigo || "",
      nombre: datos.nombre,
      categoria: datos.categoria || "",
      unidad: datos.unidad || "unidad",
      costo: Number(datos.costo) || 0,
      precioVenta: Number(datos.precioVenta) || 0,
      stockMinimo: Number(datos.stockMinimo) || 0,
      ubicacion: datos.ubicacion || "",
      proveedorId: datos.proveedorId || "",
    };
    setProductos((s) => [...s, nuevoProducto]);
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId ? { ...c, items: [...c.items, { productoId: nuevoId, cantidadContada }] } : c
      )
    );
  }

  function iniciarConteo() {
    const conteo = {
      id: uid(),
      fecha: todayISO(),
      completado: false,
      items: productos.map((p) => ({ productoId: p.id, cantidadContada: "" })),
    };
    setConteos((s) => [conteo, ...s]);
    return conteo.id;
  }
  function actualizarConteoItem(conteoId, productoId, valor) {
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId
          ? { ...c, items: c.items.map((it) => (it.productoId === productoId ? { ...it, cantidadContada: valor } : it)) }
          : c
      )
    );
  }
  function finalizarConteo(conteoId) {
    setConteos((s) => s.map((c) => (c.id === conteoId ? { ...c, completado: true } : c)));
  }
  function aplicarAjustes(conteoId) {
    const conteo = conteos.find((c) => c.id === conteoId);
    if (!conteo) return;
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const item = conteo.items.find((it) => it.productoId === p.id);
        if (!item || item.cantidadContada === "") return p;
        const contado = Number(item.cantidadContada);
        const dif = contado - p.stock;
        if (dif !== 0) {
          nuevosMov.push({
            id: uid(), productoId: p.id, tipo: "ajuste", cantidad: dif,
            fecha: todayISO(), referencia: "Ajuste por inventario ciego",
          });
        }
        return { ...p, stock: contado };
      })
    );
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
  }

  /* ---------- CÁLCULOS ---------- */

  const valorInventario = useMemo(
    () => productos.reduce((acc, p) => acc + p.stock * Number(p.costo || 0), 0),
    [productos]
  );
  const stockBajo = useMemo(() => productos.filter((p) => p.stock <= Number(p.stockMinimo || 0)), [productos]);
  const pedidosPendientes = useMemo(() => pedidos.filter((p) => p.estado !== "Recibido"), [pedidos]);
  const margenPromedio = useMemo(() => {
    const conPrecio = productos.filter((p) => Number(p.precioVenta) > 0);
    if (!conPrecio.length) return 0;
    const total = conPrecio.reduce((acc, p) => acc + ((p.precioVenta - p.costo) / p.precioVenta) * 100, 0);
    return total / conPrecio.length;
  }, [productos]);

  const rotacionPorProducto = useMemo(() => {
    return productos.map((p) => {
      const salidas = movimientos.filter((m) => m.productoId === p.id && m.tipo === "salida");
      const cantSalidas = salidas.reduce((a, m) => a + m.cantidad, 0);
      const costoVentas = cantSalidas * Number(p.costo || 0);
      const inventarioPromedio = p.stock * Number(p.costo || 0);
      const rotacion = inventarioPromedio > 0 ? costoVentas / inventarioPromedio : null;
      const dias = rotacion ? 365 / rotacion : null;
      return { ...p, cantSalidas, rotacion, dias };
    });
  }, [productos, movimientos]);

  const gastoPorProveedor = useMemo(() => {
    const map = {};
    pedidos.forEach((pe) => {
      const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
      map[pe.proveedorId] = (map[pe.proveedorId] || 0) + total;
    });
    return Object.entries(map)
      .map(([proveedorId, total]) => ({ proveedor: proveedorPorId(proveedorId), total }))
      .sort((a, b) => b.total - a.total);
  }, [pedidos, proveedores]);

  const productosSinMovimiento = useMemo(
    () => productos.filter((p) => !movimientos.some((m) => m.productoId === p.id && m.tipo === "salida")),
    [productos, movimientos]
  );

  if (!ready) {
    return (
      <div style={{ background: C.bg, color: C.ink }} className="w-full h-full min-h-[600px] flex items-center justify-center font-sans">
        <Loader2 className="animate-spin" size={22} />
        <span className="ml-2 text-sm">Cargando almacén…</span>
      </div>
    );
  }

  return (
    <div style={{ background: C.bg, color: C.ink, fontFamily: "'IBM Plex Sans', ui-sans-serif, system-ui" }} className="w-full min-h-[700px] flex flex-col md:flex-row text-[14px]">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
        .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
        input, select { font-family: inherit; }
        ::placeholder { color: #9AA5A0; }
      `}</style>

      <Sidebar
        tab={tab}
        setTab={setTab}
        pendientes={pedidosPendientes.length}
        bajos={stockBajo.length}
      />

      <main className="flex-1 p-4 md:p-7 overflow-y-auto" style={{ maxHeight: "900px" }}>
        {tab === "dashboard" && (
          <Dashboard
            valorInventario={valorInventario}
            stockBajo={stockBajo}
            pedidosPendientes={pedidosPendientes}
            margenPromedio={margenPromedio}
            movimientos={movimientos}
            productos={productos}
          />
        )}
        {tab === "proveedores" && (
          <Proveedores proveedores={proveedores} addProveedor={addProveedor} deleteProveedor={deleteProveedor} pedidos={pedidos} />
        )}
        {tab === "productos" && (
          <Productos
            productos={productos}
            proveedores={proveedores}
            proveedorPorId={proveedorPorId}
            addProducto={addProducto}
            updateProducto={updateProducto}
            deleteProducto={deleteProducto}
            registrarSalida={registrarSalida}
          />
        )}
        {tab === "pedidos" && (
          <Pedidos
            pedidos={pedidos}
            proveedores={proveedores}
            productos={productos}
            crearPedido={crearPedido}
            actualizarPedido={actualizarPedido}
            eliminarPedido={eliminarPedido}
            proveedorPorId={proveedorPorId}
            productoPorId={productoPorId}
          />
        )}
        {tab === "recepcion" && (
          <Recepcion pedidos={pedidos} proveedorPorId={proveedorPorId} productoPorId={productoPorId} recibirPedido={recibirPedido} />
        )}
        {tab === "conteo" && (
          <InventarioCiego
            productos={productos}
            proveedores={proveedores}
            conteos={conteos}
            iniciarConteo={iniciarConteo}
            actualizarConteoItem={actualizarConteoItem}
            finalizarConteo={finalizarConteo}
            aplicarAjustes={aplicarAjustes}
            productoPorId={productoPorId}
            crearProductoEnConteo={crearProductoEnConteo}
          />
        )}
        {tab === "reportes" && (
          <Reportes
            rotacionPorProducto={rotacionPorProducto}
            gastoPorProveedor={gastoPorProveedor}
            productosSinMovimiento={productosSinMovimiento}
            valorInventario={valorInventario}
          />
        )}
        {tab === "fichas" && (
          <FichasCosto
            fichasCosto={fichasCosto}
            productos={productos}
            addFichaCosto={addFichaCosto}
            deleteFichaCosto={deleteFichaCosto}
          />
        )}
        {tab === "respaldos" && (
          <Respaldos
            historial={historial}
            crearPuntoDeGuardado={crearPuntoDeGuardado}
            restaurarDesdeHistorial={restaurarDesdeHistorial}
            abrirRespaldo={abrirRespaldo}
            abrirRestaurar={abrirRestaurar}
          />
        )}
      </main>

      {showBackupView && (
        <Modal onClose={() => setShowBackupView(false)} title="Tu respaldo">
          <div className="text-[12.5px] mb-2" style={{ color: C.ink }}>
            Copia este texto y guárdalo en algún lugar seguro (notas, correo, Google Drive). Para restaurarlo más adelante, pégalo en "Restaurar respaldo".
          </div>
          <textarea
            readOnly
            value={backupText}
            onFocus={(e) => e.target.select()}
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, height: 160, resize: "none" }}
          />
          <div className="flex items-center gap-2">
            <Btn onClick={copiarRespaldo}>{copiado ? "¡Copiado!" : "Copiar al portapapeles"}</Btn>
            <Btn variant="ghost" onClick={() => setShowBackupView(false)}>Cerrar</Btn>
          </div>
          <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
            Si el botón no copia solo, toca dentro del recuadro de texto, selecciona todo y cópialo manualmente.
          </div>
        </Modal>
      )}

      {showRestoreInput && (
        <Modal onClose={() => setShowRestoreInput(false)} title="Restaurar respaldo">
          <div className="text-[12.5px] mb-2" style={{ color: C.ink }}>
            Pega aquí el texto completo del respaldo que copiaste anteriormente.
          </div>
          <textarea
            value={restoreText}
            onChange={(e) => setRestoreText(e.target.value)}
            placeholder="Pega aquí el texto del respaldo…"
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, height: 160, resize: "none" }}
          />
          {restoreError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{restoreError}</div>}
          <div className="flex gap-2">
            <Btn onClick={analizarTextoRestauracion}>Continuar</Btn>
            <Btn variant="ghost" onClick={() => setShowRestoreInput(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {pendingRestore && (
        <Modal onClose={() => setPendingRestore(null)} title="Restaurar respaldo">
          <div className="text-[12.5px] mb-3" style={{ color: C.ink }}>
            Vas a reemplazar los datos actuales del programa con lo que contiene este archivo:
          </div>
          <div className="text-[12.5px] mb-4 space-y-1" style={{ color: C.inkSoft }}>
            <div>Proveedores: <span className="mono">{(pendingRestore.proveedores || []).length}</span></div>
            <div>Productos: <span className="mono">{(pendingRestore.productos || []).length}</span></div>
            <div>Pedidos: <span className="mono">{(pendingRestore.pedidos || []).length}</span></div>
            <div>Movimientos: <span className="mono">{(pendingRestore.movimientos || []).length}</span></div>
            <div>Conteos: <span className="mono">{(pendingRestore.conteos || []).length}</span></div>
            <div>Fichas de costo: <span className="mono">{(pendingRestore.fichasCosto || []).length}</span></div>
            {pendingRestore.exportadoEl && <div>Respaldo generado el: {new Date(pendingRestore.exportadoEl).toLocaleString("es-ES")}</div>}
          </div>
          <div className="text-[12px] mb-4" style={{ color: C.red }}>
            Esta acción reemplaza todo lo que tengas cargado ahora mismo en el programa. Si quieres conservarlo, cancela y descarga primero un respaldo del estado actual.
          </div>
          <div className="flex gap-2">
            <Btn onClick={confirmarRestauracion}>Sí, restaurar este respaldo</Btn>
            <Btn variant="ghost" onClick={() => setPendingRestore(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= UI HELPERS ================= */
function Card({ children, className = "", style = {} }) {
  return (
    <div className={`rounded-xl p-4 ${className}`} style={{ background: C.surface, border: `1px solid ${C.line}`, ...style }}>
      {children}
    </div>
  );
}
function SectionTitle({ children, action }) {
  return (
    <div className="flex items-center justify-between mb-4">
      <h2 className="text-[18px] font-semibold">{children}</h2>
      {action}
    </div>
  );
}
function Btn({ children, onClick, variant = "primary", type = "button", small }) {
  const styles = {
    primary: { background: C.accent, color: "#fff" },
    ghost: { background: "transparent", color: C.ink, border: `1px solid ${C.line}` },
    danger: { background: C.redSoft, color: C.red },
  };
  return (
    <button
      type={type}
      onClick={onClick}
      className={`inline-flex items-center gap-1.5 rounded-lg font-medium ${small ? "px-2.5 py-1.5 text-[12px]" : "px-3.5 py-2 text-[13px]"}`}
      style={styles[variant]}
    >
      {children}
    </button>
  );
}
function LinkBtn({ children, href, variant = "ghost", small, newTab = true }) {
  const styles = {
    primary: { background: C.accent, color: "#fff" },
    ghost: { background: "transparent", color: C.ink, border: `1px solid ${C.line}` },
    danger: { background: C.redSoft, color: C.red },
  };
  return (
    <a
      href={href}
      {...(newTab ? { target: "_blank", rel: "noopener noreferrer" } : {})}
      className={`inline-flex items-center gap-1.5 rounded-lg font-medium no-underline ${small ? "px-2.5 py-1.5 text-[12px]" : "px-3.5 py-2 text-[13px]"}`}
      style={styles[variant]}
    >
      {children}
    </a>
  );
}
function Input(props) {
  return (
    <input
      {...props}
      className={`w-full rounded-lg px-3 py-2 text-[13px] outline-none ${props.className || ""}`}
      style={{ border: `1px solid ${C.line}`, background: "#fff", ...(props.style || {}) }}
    />
  );
}
function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <div className="text-[12px] font-medium mb-1" style={{ color: C.inkSoft }}>{label}</div>
      {children}
    </label>
  );
}
function Empty({ text }) {
  return (
    <div className="text-center py-10 text-[13px]" style={{ color: C.inkSoft }}>
      {text}
    </div>
  );
}
function Pill({ children, color }) {
  return (
    <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full" style={{ background: color + "22", color }}>
      {children}
    </span>
  );
}

function Proveedores({ proveedores, addProveedor, deleteProveedor, pedidos }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ nombre: "", contacto: "", telefono: "", email: "", condiciones: "", leadTime: "" });
  const [error, setError] = useState("");

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del proveedor.");
      return;
    }
    setError("");
    addProveedor(form);
    setForm({ nombre: "", contacto: "", telefono: "", email: "", condiciones: "", leadTime: "" });
    setShowForm(false);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Nuevo proveedor</Btn>}>

      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre del proveedor"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Distribuidora del Norte" /></Field>
            <Field label="Persona de contacto"><Input value={form.contacto} onChange={(e) => setForm({ ...form, contacto: e.target.value })} placeholder="Nombre" /></Field>

            <Field label="Correo electrónico"><Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="pedidos@proveedor.com" /></Field>
            <Field label="Condiciones de pago"><Input value={form.condiciones} onChange={(e) => setForm({ ...form, condiciones: e.target.value })} placeholder="Contado / 30 días" /></Field>
            <Field label="Tiempo de entrega (días)"><Input type="number" value={form.leadTime} onChange={(e) => setForm({ ...form, leadTime: e.target.value })} placeholder="5" /></Field>

            <Btn onClick={submit}>Guardar proveedor</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Cancelar</Btn>
          </div>

      )}

      {proveedores.length === 0 ? <Empty text="Todavía no has añadido proveedores." /> : (
        <div className="grid md:grid-cols-2 gap-3">

            const nPedidos = pedidos.filter((p) => p.proveedorId === pv.id).length;
            return (
              <Card key={pv.id}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-semibold">{pv.nombre}</div>
                    <div className="text-[12px] mt-0.5" style={{ color: C.inkSoft }}>{pv.contacto}</div>
                  </div>
                  <button onClick={() => deleteProveedor(pv.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                </div>
                <div className="mt-3 text-[12px] space-y-1" style={{ color: C.inkSoft }}>
                  {pv.email && <div>✉ {pv.email}</div>}
                  {pv.telefono && <div>☎ {pv.telefono}</div>}
                  {pv.condiciones && <div>Condiciones: {pv.condiciones}</div>}
                  {pv.leadTime && <div>Entrega estimada: {pv.leadTime} días</div>}
                  <div className="mono">{nPedidos} pedido(s) registrados</div>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ================= PRODUCTOS ================= */
function Productos({ productos, proveedores, proveedorPorId, addProducto, updateProducto, deleteProducto, registrarSalida }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { codigo: "", nombre: "", categoria: "", unidad: "unidad", costo: "", precioVenta: "", stock: "", stockMinimo: "", ubicacion: "", proveedorId: "" };
  const [form, setForm] = useState(blank);
  const [salidaFor, setSalidaFor] = useState(null);
  const [salidaCant, setSalidaCant] = useState("");
  const [error, setError] = useState("");

  const [editFor, setEditFor] = useState(null);
  const [editForm, setEditForm] = useState(blank);
  const [editError, setEditError] = useState("");

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del producto.");
      return;
    }
    setError("");
    addProducto({ ...form, costo: Number(form.costo) || 0, precioVenta: Number(form.precioVenta) || 0, stockMinimo: Number(form.stockMinimo) || 0 });
    setForm(blank);
    setShowForm(false);
  }

  function openEdit(p) {
    setEditFor(p.id);
    setEditForm({
      codigo: p.codigo || "", nombre: p.nombre || "", categoria: p.categoria || "",
      unidad: p.unidad || "unidad", costo: p.costo ?? "", precioVenta: p.precioVenta ?? "",
      stock: p.stock ?? "", stockMinimo: p.stockMinimo ?? "", ubicacion: p.ubicacion || "", proveedorId: p.proveedorId || "",
    });
    setEditError("");
  }
  function submitEdit() {
    if (!editForm.nombre.trim()) {
      setEditError("Escribe el nombre del producto.");
      return;
    }
    updateProducto(editFor, {
      ...editForm,
      costo: Number(editForm.costo) || 0,
      precioVenta: Number(editForm.precioVenta) || 0,
      stock: Number(editForm.stock) || 0,
      stockMinimo: Number(editForm.stockMinimo) || 0,
    });
    setEditFor(null);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Nuevo producto</Btn>}>
        Productos
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} /></Field>
            <Field label="Código / SKU (opcional)"><Input value={form.codigo} onChange={(e) => setForm({ ...form, codigo: e.target.value })} placeholder="Interno o de proveedor" /></Field>
            <Field label="Categoría"><Input value={form.categoria} onChange={(e) => setForm({ ...form, categoria: e.target.value })} /></Field>
            <Field label="Unidad de medida"><Input value={form.unidad} onChange={(e) => setForm({ ...form, unidad: e.target.value })} placeholder="unidad, kg, caja…" /></Field>
            <Field label="Costo de compra (€)"><Input type="number" step="0.01" value={form.costo} onChange={(e) => setForm({ ...form, costo: e.target.value })} /></Field>
            <Field label="Precio de venta (€)"><Input type="number" step="0.01" value={form.precioVenta} onChange={(e) => setForm({ ...form, precioVenta: e.target.value })} /></Field>
            <Field label="Stock inicial"><Input type="number" value={form.stock} onChange={(e) => setForm({ ...form, stock: e.target.value })} /></Field>
            <Field label="Stock mínimo (reorden)"><Input type="number" value={form.stockMinimo} onChange={(e) => setForm({ ...form, stockMinimo: e.target.value })} /></Field>
            <Field label="Ubicación en almacén (opcional)"><Input value={form.ubicacion} onChange={(e) => setForm({ ...form, ubicacion: e.target.value })} placeholder="Estante 3, pasillo B…" /></Field>
            <Field label="Proveedor principal (opcional)">
              <select value={form.proveedorId} onChange={(e) => setForm({ ...form, proveedorId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                <option value="">Sin asignar</option>
                {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
              </select>
            </Field>
          </div>
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2 mt-1">
            <Btn onClick={submit}>Guardar producto</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {productos.length === 0 ? <Empty text="Todavía no has añadido productos." /> : (
        <Card style={{ padding: 0 }}>
          <table className="w-full text-[12.5px]">
            <thead>
              <tr style={{ color: C.inkSoft, borderBottom: `1px solid ${C.line}` }}>
                <th className="text-left font-medium py-2.5 px-3">Producto</th>
                <th className="text-left font-medium py-2.5 px-3">Stock</th>
                <th className="text-left font-medium py-2.5 px-3">Costo</th>
                <th className="text-left font-medium py-2.5 px-3">Venta</th>
                <th className="text-left font-medium py-2.5 px-3">Margen</th>
                <th className="text-left font-medium py-2.5 px-3"></th>
              </tr>
            </thead>
            <tbody>
              {productos.map((p) => {
                const margen = p.precioVenta > 0 ? ((p.precioVenta - p.costo) / p.precioVenta) * 100 : null;
                const bajo = p.stock <= Number(p.stockMinimo || 0);
                return (
                  <tr key={p.id} style={{ borderBottom: `1px solid ${C.line}` }}>
                    <td className="py-2.5 px-3">
                      <div className="font-medium">{p.nombre}</div>
                      <div className="text-[11px]" style={{ color: C.inkSoft }}>
                        {[p.codigo, p.categoria, p.ubicacion].filter(Boolean).join(" · ")}
                        {p.proveedorId && proveedorPorId(p.proveedorId) ? ` · ${proveedorPorId(p.proveedorId).nombre}` : ""}
                      </div>
                    </td>
                    <td className="py-2.5 px-3 mono">
                      {p.stock} {p.unidad}
                      {bajo && <div><Pill color={C.amber}>bajo mínimo</Pill></div>}
                    </td>
                    <td className="py-2.5 px-3 mono">€{fmt(p.costo)}</td>
                    <td className="py-2.5 px-3 mono">€{fmt(p.precioVenta)}</td>
                    <td className="py-2.5 px-3 mono" style={{ color: margen == null ? C.inkSoft : margen < 15 ? C.red : C.accent }}>
                      {margen == null ? "—" : `${fmt(margen)}%`}
                    </td>
                    <td className="py-2.5 px-3">
                      <div className="flex gap-2 justify-end">
                        <Btn small variant="ghost" onClick={() => openEdit(p)}>Editar</Btn>
                        <Btn small variant="ghost" onClick={() => setSalidaFor(p.id)}>Registrar salida</Btn>
                        <button onClick={() => deleteProducto(p.id)}><Trash2 size={14} color={C.inkSoft} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </Card>
      )}

      {salidaFor && (
        <Modal onClose={() => { setSalidaFor(null); setSalidaCant(""); }} title="Registrar salida de almacén">
          <Field label="Cantidad a retirar">
            <Input type="number" value={salidaCant} onChange={(e) => setSalidaCant(e.target.value)} autoFocus />
          </Field>
          <Btn onClick={() => { registrarSalida(salidaFor, salidaCant, "Venta / consumo"); setSalidaFor(null); setSalidaCant(""); }}>Confirmar salida</Btn>
        </Modal>
      )}

      {editFor && (
        <Modal onClose={() => setEditFor(null)} title="Editar producto">
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Nombre"><Input value={editForm.nombre} onChange={(e) => setEditForm({ ...editForm, nombre: e.target.value })} /></Field>
            <Field label="Código / SKU"><Input value={editForm.codigo} onChange={(e) => setEditForm({ ...editForm, codigo: e.target.value })} /></Field>
            <Field label="Categoría"><Input value={editForm.categoria} onChange={(e) => setEditForm({ ...editForm, categoria: e.target.value })} /></Field>
            <Field label="Unidad de medida"><Input value={editForm.unidad} onChange={(e) => setEditForm({ ...editForm, unidad: e.target.value })} /></Field>
            <Field label="Costo de compra (€)">
              <Input type="number" step="0.01" value={editForm.costo} onChange={(e) => setEditForm({ ...editForm, costo: e.target.value })} autoFocus />
            </Field>
            <Field label="Precio de venta (€)">
              <Input type="number" step="0.01" value={editForm.precioVenta} onChange={(e) => setEditForm({ ...editForm, precioVenta: e.target.value })} />
            </Field>
            <Field label="Stock actual"><Input type="number" value={editForm.stock} onChange={(e) => setEditForm({ ...editForm, stock: e.target.value })} /></Field>
            <Field label="Stock mínimo"><Input type="number" value={editForm.stockMinimo} onChange={(e) => setEditForm({ ...editForm, stockMinimo: e.target.value })} /></Field>
            <Field label="Ubicación"><Input value={editForm.ubicacion} onChange={(e) => setEditForm({ ...editForm, ubicacion: e.target.value })} /></Field>
            <Field label="Proveedor principal">
              <select value={editForm.proveedorId} onChange={(e) => setEditForm({ ...editForm, proveedorId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                <option value="">Sin asignar</option>
                {proveedores.map((pv) => <option key={pv.id} value={pv.id}>{pv.nombre}</option>)}
              </select>
            </Field>
          </div>
          {editError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{editError}</div>}
          <div className="flex gap-2 mt-1">
            <Btn onClick={submitEdit}>Guardar cambios</Btn>
            <Btn variant="ghost" onClick={() => setEditFor(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= MODAL ================= */
function Modal({ children, onClose, title }) {
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: "rgba(20,32,28,0.45)" }}>
      <div className="rounded-xl p-5 w-full max-w-md" style={{ background: C.surface }}>
        <div className="flex items-center justify-between mb-4">
          <div className="font-semibold text-[15px]">{title}</div>
          <button onClick={onClose}><X size={17} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ================= PEDIDOS ================= */
function Pedidos({ pedidos, proveedores, productos, crearPedido, actualizarPedido, eliminarPedido, proveedorPorId, productoPorId }) {
  const [showForm, setShowForm] = useState(false);
  const [proveedorId, setProveedorId] = useState("");
  const [fechaEsperada, setFechaEsperada] = useState("");
  const [items, setItems] = useState([]);
  const [enviarPedido, setEnviarPedido] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  function addItemRow() {
    if (!productos.length) return;
    setItems((s) => [...s, { productoId: productos[0].id, cantidad: 1, costoUnitario: productos[0].costo }]);
  }
  function updateItem(idx, field, value) {
    setItems((s) =>
      s.map((it, i) => {
        if (i !== idx) return it;
        if (field === "productoId") {
          const p = productos.find((pr) => pr.id === value);
          return { ...it, productoId: value, costoUnitario: p ? p.costo : it.costoUnitario };
        }
        return { ...it, [field]: value };
      })
    );
  }
  function removeItem(idx) {
    setItems((s) => s.filter((_, i) => i !== idx));
  }
  const [error, setError] = useState("");

  function resetForm() {
    setItems([]);
    setProveedorId("");
    setFechaEsperada("");
    setEditingId(null);
    setError("");
  }

  function openEdit(pedido) {
    setEditingId(pedido.id);
    setProveedorId(pedido.proveedorId);
    setFechaEsperada(pedido.fechaEsperada || "");
    setItems(pedido.items.map((it) => ({ productoId: it.productoId, cantidad: it.cantidad, costoUnitario: it.costoUnitario })));
    setError("");
    setShowForm(true);
  }

  function submit() {
    if (!proveedorId) {
      setError("Selecciona un proveedor.");
      return;
    }
    if (items.length === 0) {
      setError("Añade al menos un producto al pedido.");
      return;
    }
    setError("");
    const itemsLimpios = items.map((it) => ({ productoId: it.productoId, cantidad: Number(it.cantidad), costoUnitario: Number(it.costoUnitario) }));
    if (editingId) {
      actualizarPedido(editingId, { proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
    } else {
      const pedido = crearPedido({ proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
      setEnviarPedido(pedido);
    }
  }

  function textoPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const lineas = pedido.items.map((it) => {
      const p = productoPorId(it.productoId);
      return `- ${p ? p.nombre : "?"} x${it.cantidad} @ €${fmt(it.costoUnitario)} = €${fmt(it.cantidad * it.costoUnitario)}`;
    });
    const total = pedido.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
    return `Pedido para ${prov ? prov.nombre : ""}\nFecha: ${pedido.fecha}\nEntrega esperada: ${pedido.fechaEsperada || "por confirmar"}\n\nProductos:\n${lineas.join("\n")}\n\nTotal: €${fmt(total)}`;
  }

  function mailtoHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `mailto:${prov?.email || ""}?subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailAppHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `googlegmail:///co?to=${encodeURIComponent(prov?.email || "")}&subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailWebHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const params = new URLSearchParams({
      view: "cm", fs: "1", tf: "1",
      to: prov?.email || "",
      su: "Pedido - " + (prov?.nombre || ""),
      body: texto,
    });
    return `https://mail.google.com/mail/u/0/?${params.toString()}`;
  }
  function whatsappHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const numero = (prov?.telefono || "").replace(/[^0-9]/g, "");
    return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
  }

  const [correoPedido, setCorreoPedido] = useState(null);

  const estadoColor = { Pendiente: C.amber, Parcial: C.accent, Recibido: C.inkSoft };

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { if (showForm) { resetForm(); } setShowForm((s) => !s); }}><Plus size={15} /> Nuevo pedido</Btn>}>
        Pedidos de compra
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando pedido pendiente" : "Nuevo pedido"}</div>
          <div>
            <div className="grid md:grid-cols-2 gap-x-4">
              <Field label="Proveedor">
                <select value={proveedorId} onChange={(e) => setProveedorId(e.target.value)} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                  <option value="">Selecciona un proveedor</option>
                  {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
              </Field>
              <Field label="Fecha esperada de entrega">
                <Input type="date" value={fechaEsperada} onChange={(e) => setFechaEsperada(e.target.value)} />
              </Field>
            </div>

            <div className="mb-2 text-[12px] font-medium" style={{ color: C.inkSoft }}>Productos del pedido</div>
            {items.map((it, idx) => (
              <div key={idx} className="flex gap-2 items-center mb-2">
                <select value={it.productoId} onChange={(e) => updateItem(idx, "productoId", e.target.value)} className="flex-1 rounded-lg px-2 py-2 text-[12.5px]" style={{ border: `1px solid ${C.line}` }}>
                  {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
                <Input type="number" style={{ width: 80 }} value={it.cantidad} onChange={(e) => updateItem(idx, "cantidad", e.target.value)} placeholder="Cant." />
                <Input type="number" step="0.01" style={{ width: 100 }} value={it.costoUnitario} onChange={(e) => updateItem(idx, "costoUnitario", e.target.value)} placeholder="Costo u." />
                <button type="button" onClick={() => removeItem(idx)}><X size={16} color={C.inkSoft} /></button>
              </div>
            ))}
            <button type="button" onClick={addItemRow} className="text-[12.5px] font-medium mb-4" style={{ color: C.accent }}>+ Añadir producto al pedido</button>

            {error && <div className="text-[12px] mb-3" style={{ color: C.red }}>{error}</div>}
            <div className="flex gap-2">
              <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Crear pedido"}</Btn>
              <Btn variant="ghost" onClick={() => { setShowForm(false); resetForm(); }}>Cancelar</Btn>
            </div>
          </div>
        </Card>
      )}

      {pedidos.length === 0 ? <Empty text="No hay pedidos registrados todavía." /> : (
        <div className="space-y-2">
          {pedidos.map((pe) => {
            const prov = proveedorPorId(pe.proveedorId);
            const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
            return (
              <Card key={pe.id}>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="font-semibold">{prov ? prov.nombre : "Proveedor eliminado"}</div>
                    <div className="text-[12px]" style={{ color: C.inkSoft }}>
                      Pedido {pe.fecha} · Entrega esperada {pe.fechaEsperada || "—"}
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <Pill color={estadoColor[pe.estado]}>{pe.estado}</Pill>
                    <div className="mono font-semibold">€{fmt(total)}</div>
                  </div>
                </div>
                <div className="mt-2 flex gap-2 flex-wrap">
                  <Btn small variant="ghost" onClick={() => { setCorreoPedido(pe); }}><Mail size={13} /> Enviar por correo</Btn>
                  <LinkBtn small href={whatsappHref(pe)}><MessageCircle size={13} /> Enviar por WhatsApp</LinkBtn>
                  {pe.estado === "Pendiente" && (
                    <>
                      <Btn small variant="ghost" onClick={() => openEdit(pe)}>Editar</Btn>
                      <Btn small variant="danger" onClick={() => setConfirmDeleteId(pe.id)}><Trash2 size={13} /> Eliminar</Btn>
                    </>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {confirmDeleteId && (
        <Modal onClose={() => setConfirmDeleteId(null)} title="Eliminar pedido">
          <div className="text-[12.5px] mb-4" style={{ color: C.ink }}>
            ¿Seguro que quieres eliminar este pedido? Esta acción no se puede deshacer.
          </div>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { eliminarPedido(confirmDeleteId); setConfirmDeleteId(null); }}>Sí, eliminar</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {correoPedido && (
        <Modal onClose={() => setCorreoPedido(null)} title="Enviar pedido por correo">
          <div className="text-[12.5px] mb-3" style={{ color: C.ink }}>
            Prueba los botones de Gmail. Si no se abren, más abajo tienes el correo listo para copiar y pegar.
          </div>
          <div className="flex flex-col gap-2 mb-4">
            <LinkBtn variant="primary" href={mailtoHref(correoPedido)} newTab={false}><Mail size={14} /> Enviar por correo</LinkBtn>
            <LinkBtn href={gmailWebHref(correoPedido)}><Mail size={14} /> Abrir en Gmail (navegador)</LinkBtn>
            <LinkBtn href={gmailAppHref(correoPedido)} newTab={false}><Mail size={14} /> App de Gmail (solo iPhone)</LinkBtn>
          </div>
          <div className="text-[11.5px] mb-2 pt-3" style={{ color: C.inkSoft, borderTop: `1px solid ${C.line}` }}>
            Si ninguno abre, toca cada campo (se selecciona solo) y cópialo:
          </div>
          <Field label="Destinatario">
            <Input readOnly value={proveedorPorId(correoPedido.proveedorId)?.email || ""} onFocus={(e) => e.target.select()} />
          </Field>
          <Field label="Asunto">
            <Input readOnly value={`Pedido - ${proveedorPorId(correoPedido.proveedorId)?.nombre || ""}`} onFocus={(e) => e.target.select()} />
          </Field>
          <Field label="Mensaje">
            <textarea
              readOnly
              value={textoPedido(correoPedido)}
              onFocus={(e) => e.target.select()}
              className="w-full rounded-lg p-2 text-[12px] mono"
              style={{ border: `1px solid ${C.line}`, height: 160, resize: "none" }}
            />
          </Field>
          <Btn variant="ghost" onClick={() => setCorreoPedido(null)}>Cerrar</Btn>
        </Modal>
      )}

      {enviarPedido && (
        <Modal onClose={() => setEnviarPedido(null)} title="Pedido creado — ¿cómo quieres enviarlo?">
          <p className="text-[12.5px] mb-4" style={{ color: C.inkSoft }}>Puedes enviarlo ahora al proveedor o hacerlo más tarde desde la lista de pedidos.</p>
          <div className="flex gap-2">
            <Btn onClick={() => { setCorreoPedido(enviarPedido); setEnviarPedido(null); }}><Mail size={14} /> Correo</Btn>
            <LinkBtn variant="primary" href={whatsappHref(enviarPedido)}><MessageCircle size={14} /> WhatsApp</LinkBtn>
            <Btn variant="ghost" onClick={() => setEnviarPedido(null)}>Ahora no</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= RECEPCIÓN ================= */
function Recepcion({ pedidos, proveedorPorId, productoPorId, recibirPedido }) {
  const [activos, setActivos] = useState({});
  const pendientes = pedidos.filter((p) => p.estado !== "Recibido");

  function setCant(pedidoId, productoId, val) {
    setActivos((s) => ({ ...s, [pedidoId]: { ...(s[pedidoId] || {}), [productoId]: val } }));
  }

  return (
    <div>
      <SectionTitle>Recepción de mercancía</SectionTitle>
      {pendientes.length === 0 ? <Empty text="No hay pedidos pendientes de recibir." /> : (
        <div className="space-y-3">
          {pendientes.map((pe) => {
            const prov = proveedorPorId(pe.proveedorId);
            return (
              <Card key={pe.id}>
                <div className="flex items-center justify-between mb-3">
                  <div className="font-semibold">{prov ? prov.nombre : "—"}</div>
                  <Pill color={C.amber}>{pe.estado}</Pill>
                </div>
                {pe.items.map((it) => {
                  const p = productoPorId(it.productoId);
                  const pendiente = it.cantidad - it.cantidadRecibida;
                  return (
                    <div key={it.productoId} className="flex items-center justify-between py-1.5 border-b last:border-0" style={{ borderColor: C.line }}>
                      <div>
                        <div>{p ? p.nombre : "—"}</div>
                        <div className="text-[11px] mono" style={{ color: C.inkSoft }}>Pedido: {it.cantidad} · Recibido: {it.cantidadRecibida} · Pendiente: {pendiente}</div>
                      </div>
                      <Input
                        type="number"
                        style={{ width: 90 }}
                        placeholder="Cant. hoy"
                        value={(activos[pe.id] || {})[it.productoId] || ""}
                        onChange={(e) => setCant(pe.id, it.productoId, e.target.value)}
                        disabled={pendiente <= 0}
                      />
                    </div>
                  );
                })}
                <div className="mt-3">
                  <Btn onClick={() => { recibirPedido(pe.id, activos[pe.id] || {}); setActivos((s) => ({ ...s, [pe.id]: {} })); }}>
                    <CheckCircle2 size={14} /> Confirmar recepción
                  </Btn>
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ================= INVENTARIO CIEGO ================= */
function InventarioCiego({ productos, proveedores, conteos, iniciarConteo, actualizarConteoItem, finalizarConteo, aplicarAjustes, productoPorId, crearProductoEnConteo }) {
  const [activoId, setActivoId] = useState(null);
  const activo = conteos.find((c) => c.id === activoId);
  const [showNuevo, setShowNuevo] = useState(false);
  const blankNuevo = { codigo: "", nombre: "", categoria: "", unidad: "unidad", costo: "", precioVenta: "", stockMinimo: "", ubicacion: "", proveedorId: "", cantidadContada: "" };
  const [nuevo, setNuevo] = useState(blankNuevo);
  const [errorNuevo, setErrorNuevo] = useState("");
  const [showHoja, setShowHoja] = useState(false);
  const [hojaCopiada, setHojaCopiada] = useState(false);

  function textoHoja() {
    const fecha = new Date().toLocaleDateString("es-ES", { dateStyle: "long" });
    const porUbicacion = [...productos].sort((a, b) => (a.ubicacion || "").localeCompare(b.ubicacion || ""));
    const lineas = porUbicacion.map((p, i) => `${i + 1}. ${p.nombre}${p.ubicacion ? ` — ${p.ubicacion}` : ""}  (${p.unidad})\n   Cantidad contada: _______________`);
    return `HOJA DE CONTEO DE INVENTARIO\nFecha: ${fecha}\n\n${lineas.join("\n\n")}\n\nContado por: ______________________\nFirma: ______________________`;
  }

  function copiarHoja() {
    const texto = textoHoja();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(() => setHojaCopiada(true)).catch(() => setHojaCopiada(false));
    }
  }

  function submitNuevo() {
    if (!nuevo.nombre.trim()) {
      setErrorNuevo("Escribe el nombre del producto.");
      return;
    }
    if (nuevo.cantidadContada === "" || isNaN(Number(nuevo.cantidadContada))) {
      setErrorNuevo("Escribe la cantidad que contaste.");
      return;
    }
    setErrorNuevo("");
    const { cantidadContada, ...datosProducto } = nuevo;
    crearProductoEnConteo(activo.id, datosProducto, cantidadContada);
    setNuevo(blankNuevo);
    setShowNuevo(false);
  }

  return (
    <div>
      <SectionTitle
        action={
          <div className="flex gap-2">
            <Btn variant="ghost" onClick={() => { setHojaCopiada(false); setShowHoja(true); }}><ClipboardList size={15} /> Hoja de conteo</Btn>
            {!activo && <Btn onClick={() => setActivoId(iniciarConteo())}><Plus size={15} /> Iniciar conteo ciego</Btn>}
          </div>
        }
      >
        Inventario ciego
      </SectionTitle>

      {!activo && (
        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]" style={{ color: C.ink }}>
            <EyeOff size={16} style={{ marginTop: 2 }} />
            <span>Al iniciar un conteo <b>no verás el stock que el sistema tiene registrado</b>: solo cuentas físicamente y capturas la cantidad real. Al terminar, el sistema compara tu conteo contra el stock teórico y te muestra las diferencias.</span>
          </div>
        </Card>
      )}

      {activo && !activo.completado && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3 flex items-center gap-1.5"><Eye size={15} /> Captura tu conteo físico</div>
          <div className="space-y-2">
            {activo.items.map((it) => {
              const p = productoPorId(it.productoId);
              if (!p) return null;
              return (
                <div key={it.productoId} className="flex items-center justify-between py-1.5 border-b last:border-0" style={{ borderColor: C.line }}>
                  <span>{p.nombre} <span className="text-[11px]" style={{ color: C.inkSoft }}>({p.unidad})</span></span>
                  <Input
                    type="number"
                    style={{ width: 100 }}
                    placeholder="Cantidad contada"
                    value={it.cantidadContada}
                    onChange={(e) => actualizarConteoItem(activo.id, it.productoId, e.target.value)}
                  />
                </div>
              );
            })}
          </div>
          <div className="mt-4 flex gap-2 items-center flex-wrap">
            <Btn onClick={() => finalizarConteo(activo.id)}>Finalizar conteo</Btn>
            <Btn variant="ghost" onClick={() => setShowNuevo((s) => !s)}><Plus size={14} /> Encontré un producto que no está en el sistema</Btn>
          </div>

          {showNuevo && (
            <div className="mt-4 pt-4" style={{ borderTop: `1px solid ${C.line}` }}>
              <div className="text-[12.5px] font-medium mb-3" style={{ color: C.inkSoft }}>
                Da de alta el producto encontrado en el almacén y captura la cantidad que contaste. Se añadirá al catálogo y a este conteo.
              </div>
              <div className="grid md:grid-cols-3 gap-x-4">
                <Field label="Nombre"><Input value={nuevo.nombre} onChange={(e) => setNuevo({ ...nuevo, nombre: e.target.value })} /></Field>
                <Field label="Código / SKU (opcional)"><Input value={nuevo.codigo} onChange={(e) => setNuevo({ ...nuevo, codigo: e.target.value })} /></Field>
                <Field label="Categoría"><Input value={nuevo.categoria} onChange={(e) => setNuevo({ ...nuevo, categoria: e.target.value })} /></Field>
                <Field label="Unidad de medida"><Input value={nuevo.unidad} onChange={(e) => setNuevo({ ...nuevo, unidad: e.target.value })} placeholder="unidad, kg, caja…" /></Field>
                <Field label="Costo de compra (€)"><Input type="number" step="0.01" value={nuevo.costo} onChange={(e) => setNuevo({ ...nuevo, costo: e.target.value })} /></Field>
                <Field label="Precio de venta (€)"><Input type="number" step="0.01" value={nuevo.precioVenta} onChange={(e) => setNuevo({ ...nuevo, precioVenta: e.target.value })} /></Field>
                <Field label="Stock mínimo (reorden)"><Input type="number" value={nuevo.stockMinimo} onChange={(e) => setNuevo({ ...nuevo, stockMinimo: e.target.value })} /></Field>
                <Field label="Ubicación en almacén (opcional)"><Input value={nuevo.ubicacion} onChange={(e) => setNuevo({ ...nuevo, ubicacion: e.target.value })} /></Field>
                <Field label="Proveedor principal (opcional)">
                  <select value={nuevo.proveedorId} onChange={(e) => setNuevo({ ...nuevo, proveedorId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                    <option value="">Sin asignar</option>
                    {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                  </select>
                </Field>
                <Field label="Cantidad contada físicamente">
                  <Input type="number" value={nuevo.cantidadContada} onChange={(e) => setNuevo({ ...nuevo, cantidadContada: e.target.value })} />
                </Field>
              </div>
              {errorNuevo && (
                <div className="text-[12px] mb-2" style={{ color: C.red }}>{errorNuevo}</div>
              )}
              <div className="flex gap-2 mt-1">
                <Btn onClick={submitNuevo}>Añadir al conteo</Btn>
                <Btn variant="ghost" onClick={() => { setShowNuevo(false); setErrorNuevo(""); }}>Cancelar</Btn>
              </div>
            </div>
          )}
        </Card>
      )}

      {activo && activo.completado && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">Resultado del conteo — {activo.fecha}</div>
          <table className="w-full text-[12.5px]">
            <thead>
              <tr style={{ color: C.inkSoft, borderBottom: `1px solid ${C.line}` }}>
                <th className="text-left font-medium py-2">Producto</th>
                <th className="text-left font-medium py-2">Sistema</th>
                <th className="text-left font-medium py-2">Contado</th>
                <th className="text-left font-medium py-2">Diferencia</th>
              </tr>
            </thead>
            <tbody>
              {activo.items.map((it) => {
                const p = productoPorId(it.productoId);
                if (!p) return null;
                const contado = it.cantidadContada === "" ? null : Number(it.cantidadContada);
                const dif = contado === null ? null : contado - p.stock;
                return (
                  <tr key={it.productoId} style={{ borderBottom: `1px solid ${C.line}` }}>
                    <td className="py-2">{p.nombre}</td>
                    <td className="py-2 mono">{p.stock}</td>
                    <td className="py-2 mono">{contado ?? "—"}</td>
                    <td className="py-2 mono" style={{ color: !dif ? C.inkSoft : dif < 0 ? C.red : C.accent }}>
                      {dif === null ? "—" : dif > 0 ? `+${dif}` : dif}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          <div className="mt-4 flex gap-2">
            <Btn onClick={() => { aplicarAjustes(activo.id); setActivoId(null); }}>Aplicar ajustes al stock</Btn>
            <Btn variant="ghost" onClick={() => setActivoId(null)}>Cerrar sin ajustar</Btn>
          </div>
        </Card>
      )}

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Historial de conteos</div>
      <div className="space-y-2">
        {conteos.filter((c) => c.id !== activoId).length === 0 ? <Empty text="Sin conteos anteriores." /> : (
          conteos.filter((c) => c.id !== activoId).map((c) => (
            <Card key={c.id}>
              <div className="flex items-center justify-between">
                <span>Conteo del {c.fecha}</span>
                <div className="flex items-center gap-2">
                  <Pill color={c.completado ? C.accent : C.amber}>{c.completado ? "Completado" : "En curso"}</Pill>
                  <Btn small variant="ghost" onClick={() => setActivoId(c.id)}>Ver <ChevronRight size={13} /></Btn>
                </div>
              </div>
            </Card>
          ))
        )}
      </div>

      {showHoja && (
        <Modal onClose={() => setShowHoja(false)} title="Hoja de conteo">
          <div className="text-[12.5px] mb-2" style={{ color: C.ink }}>
            Lista de todos tus productos, sin mostrar el stock del sistema, con espacio en blanco para que un trabajador anote la cantidad real. Cópiala para imprimirla (pégala en un documento y manda a imprimir) o envíala directo por WhatsApp.
          </div>
          <textarea
            readOnly
            value={textoHoja()}
            onFocus={(e) => e.target.select()}
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, height: 200, resize: "none" }}
          />
          <div className="flex flex-wrap gap-2">
            <Btn onClick={copiarHoja}>{hojaCopiada ? "¡Copiado!" : "Copiar texto"}</Btn>
            <LinkBtn href={`https://wa.me/?text=${encodeURIComponent(textoHoja())}`}><MessageCircle size={14} /> Enviar por WhatsApp</LinkBtn>
            <Btn variant="ghost" onClick={() => setShowHoja(false)}>Cerrar</Btn>
          </div>
          <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
            Si el botón de copiar no funciona, toca dentro del recuadro, selecciona todo el texto y cópialo manualmente.
          </div>
        </Modal>
      )}
    </div>
  );
}
