<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Banco - campos de formulario</title>
<link rel="stylesheet" href="./la-apariencia.css" />
<style>
  /* Reproduce las utilidades de Tailwind que usa el programa en sus campos. */
  :root { --c-bg:#F7F2E8; --c-surface:#FFFDF8; --c-ink:#1B2420; --c-ink-soft:#4F5B55;
          --c-line:#8F8470; --c-divider:#E3DACA; }
  html,body{margin:0;background:var(--c-bg);color:var(--c-ink);font:14px/1.4 'IBM Plex Sans',system-ui}
  main{padding:16px;max-width:900px;margin:0 auto}
  .w-full{width:100%}
  .rounded-lg{border-radius:.5rem}
  .px-3{padding-left:.75rem;padding-right:.75rem}
  .py-2{padding-top:.5rem;padding-bottom:.5rem}
  .py-1\.5{padding-top:.375rem;padding-bottom:.375rem}
  .rounded-full{border-radius:9999px}
  .text-\[13px\]{font-size:13px}
  .text-\[12px\]{font-size:12px}
  input,select,textarea{box-sizing:border-box;font:inherit;border:1px solid var(--c-line);background:var(--c-surface);color:var(--c-ink)}
  label{display:block;margin:10px 0 4px;font-size:12.5px;font-weight:600;color:var(--c-ink-soft)}
  .grid{display:grid;gap:12px}
  @media (min-width:768px){ .md\:grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .barra{position:fixed;left:0;right:0;bottom:0;height:64px;background:var(--c-surface);border-top:1px solid var(--c-divider)}
</style>
</head>
<body>
<div id="root"><main>
  <h1 style="font-size:20px">Alta de producto</h1>
  <div class="grid md:grid-cols-3">
    <div><label for="n">Nombre</label><input id="n" class="w-full rounded-lg px-3 py-2 text-[13px]" /></div>
    <div><label for="t">Tipo</label>
      <select id="t" class="w-full rounded-lg px-3 py-2 text-[13px]">
        <option>Materia prima (se transforma)</option><option>Consumible / desechable</option>
      </select></div>
    <div><label for="d">Departamento</label>
      <select id="d" class="w-full rounded-lg px-3 py-2 text-[13px]"><option>Bebidas</option></select></div>
    <div><label for="c">Costo s/IVA</label><input id="c" type="number" class="w-full rounded-lg px-3 py-2 text-[12px]" /></div>
    <div><label for="p">PVP c/IVA</label><input id="p" type="number" class="w-full rounded-lg px-3 py-2 text-[13px]" /></div>
    <div><label for="o">Notas</label><textarea id="o" class="w-full rounded-lg px-3 py-2 text-[13px]" rows="2"></textarea></div>
  </div>
  <label><input type="checkbox" /> Activo</label>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button type="button" class="text-[12px] font-medium px-3 py-1.5 rounded-full">Todos</button>
    <button type="button" class="text-[12px] font-medium px-3 py-1.5 rounded-full">Bebidas</button>
  </div>
  <div style="height:420px"></div>
  <div><label for="z">Campo al final, con la barra fija encima</label><input id="z" class="w-full rounded-lg px-3 py-2 text-[13px]" /></div>
  <div style="height:40px"></div>
</main></div>
<div class="barra" aria-hidden="true"></div>
<script>
window.__medir = function(){
  const campos=[...document.querySelectorAll('#root input:not([type=checkbox]), #root select, #root textarea')];
  const chips=[...document.querySelectorAll('#root button.rounded-full')];
  const casilla=document.querySelector('#root input[type=checkbox]');
  const z=document.getElementById('z');
  return {
    ancho: window.innerWidth,
    campos: campos.length,
    camposBajo44: campos.filter(e=>e.getBoundingClientRect().height < 44)
                        .map(e=>(e.id||e.tagName)+' '+Math.round(e.getBoundingClientRect().height)),
    chipsBajo44: chips.filter(e=>e.getBoundingClientRect().height < 44).length,
    casillaAlto: Math.round(casilla.getBoundingClientRect().height),
    margenFocoFinal: getComputedStyle(z).scrollMarginBlockEnd,
    columnas: getComputedStyle(document.querySelector('.grid')).gridTemplateColumns,
    desbordaH: document.documentElement.scrollWidth > window.innerWidth + 1
  };
};
</script>
</body>
</html>
