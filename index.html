                              </div>
                            )}
                          </div>
                          <div className="flex items-center gap-2">
                            <Btn small variant="ghost" onClick={() => openEdit(f)}>Editar</Btn>
                            <button onClick={() => deleteFichaCosto(f.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                          </div>
                        </div>
                        <div className="space-y-1 mb-2">
                          {f.componentes.map((c, i) => (
                            <div key={i} className="flex items-center justify-between text-[12px]">
                              <span>
                                {c.nombre} <span style={{ color: C.inkSoft }}>({fmt(cantidadMostrada(c))} {tieneConversion(c) && c.unidadEntrada === "contenido" ? productoDe(c).unidadContenido : c.unidad})</span>
                                {estaEnlazado(c) && <span className="ml-1" style={{ color: C.accent }} title="Costo enlazado al catálogo">•</span>}
                              </span>
                              <span className="mono">€{fmt((Number(c.cantidad) || 0) * costoDe(c))}</span>
                            </div>
                          ))}
                          {costoAdi > 0 && (
                            <div className="flex items-center justify-between text-[12px]">
                              <span>Costos adicionales</span>
                              <span className="mono">€{fmt(costoAdi)}</span>
                            </div>
                          )}
                        </div>
                        <div className="pt-2 flex items-center justify-between text-[13px]" style={{ borderTop: `1px solid ${C.line}` }}>
                          <span className="font-medium">Costo por unidad</span>
                          <span className="mono font-semibold">€{fmt(porUnidad)}</span>
                        </div>
                        {costoRealMedio !== null && (
                          <div className="mt-1.5 p-2 rounded-lg text-[11.5px]" style={{ background: Math.abs(diferenciaPct) > 15 ? C.amberSoft : C.accentSoft }}>
                            <div className="flex items-center justify-between">
                              <span style={{ color: C.inkSoft }}>Coste real medio ({ordenesDeFicha.length} producción/es)</span>
                              <span className="mono font-semibold" style={{ color: Math.abs(diferenciaPct) > 15 ? C.amber : C.accent }}>
                                €{fmt(costoRealMedio)}
                              </span>
                            </div>
                            {Math.abs(diferenciaPct) > 15 && (
                              <div className="mt-0.5" style={{ color: C.inkSoft }}>
                                {diferenciaPct > 0
                                  ? `Te está saliendo un ${fmt(diferenciaPct)}% más caro de lo que dice la ficha — revisa las mermas o actualiza la receta.`
                                  : `Te está saliendo un ${fmt(Math.abs(diferenciaPct))}% más barato de lo que dice la ficha.`}
                              </div>
                            )}
                          </div>
                        )}
                        {pv > 0 && (
                          <div className="flex items-center justify-between text-[13px] mt-1">
                            <span className="font-medium">Margen sobre €{fmt(pv)}</span>
                            <span className="mono font-semibold" style={{ color: marg < 15 ? C.red : C.accent }}>{fmt(marg)}%</span>
                          </div>
                        )}
                        {f.pvpConIva > 0 && (
                          <div className="flex items-center justify-between text-[13px] mt-2 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
                            <span className="font-medium">Precio de carta (IVA incl.)</span>
                            <span className="mono font-bold text-[15px]" style={{ color: C.accent }}>€{fmt(f.pvpConIva)}</span>
                          </div>
                        )}
                        {(() => {
                          const set = new Set(f.alergenosExtra || []);
                          (f.componentes || []).forEach((c) => {
                            if (!c.productoId) return;
                            const p = productos.find((x) => x.id === c.productoId);
                            (p?.alergenos || []).forEach((a) => set.add(a));
                          });
                          const lista = [...set];
                          if (lista.length === 0) return null;
                          return (
                            <div className="mt-2 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
                              <div className="text-[11px] mb-1" style={{ color: C.inkSoft }}>Alérgenos</div>
                              <div className="flex flex-wrap gap-1">
                                {lista.map((id) => {
                                  const a = alergenoPorId(id);
                                  return a ? <span key={id} className="text-[11px]" title={a.nombre}>{a.icono}</span> : null;
                                })}
                              </div>
                            </div>
                          );
                        })()}
                        {(f.tiempoElaboracion || f.conservacion) && (
                          <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
                            {f.tiempoElaboracion && <>⏱ {f.tiempoElaboracion}</>}
                            {f.tiempoElaboracion && f.conservacion && " · "}
                            {f.conservacion && <>❄ {f.conservacion}</>}
                          </div>
                        )}
                      </Card>
                    );
                  })}
                </div>
              </div>
            ))}
          </>
        );
      })()}
    </div>
  );
}

/* ================= RESPALDOS ================= */
function Respaldos({ historial, crearPuntoDeGuardado, restaurarDesdeHistorial, abrirRespaldo, abrirRestaurar, exportarExcelGeneral, pinPropietario, establecerPin, activarModoEmpleado }) {
  const [nuevoPin, setNuevoPin] = useState("");
  const [confirmarPin, setConfirmarPin] = useState("");
  const [pinError, setPinError] = useState("");
  const [pinGuardado, setPinGuardado] = useState(false);

  function guardarPin() {
    if (!/^\d{4,6}$/.test(nuevoPin)) {
      setPinError("El PIN debe tener entre 4 y 6 dígitos.");
      return;
    }
    if (nuevoPin !== confirmarPin) {
      setPinError("Los dos PIN no coinciden.");
      return;
    }
    setPinError("");
    establecerPin(nuevoPin);
    setNuevoPin("");
    setConfirmarPin("");
    setPinGuardado(true);
    setTimeout(() => setPinGuardado(false), 3000);
  }
  const [guardado, setGuardado] = useState(false);

  function guardarAhora() {
    crearPuntoDeGuardado();
    setGuardado(true);
    setTimeout(() => setGuardado(false), 2000);
  }

  function contar(data) {
    return (data.proveedores?.length || 0) + (data.productos?.length || 0) + (data.pedidos?.length || 0);
  }

  return (
    <div>
      <SectionTitle>Respaldos</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]" style={{ color: C.ink }}>
          Todo lo que capturas en este programa ya se guarda automáticamente en tu cuenta, no solo en este teléfono — si abres esta misma conversación desde otro dispositivo, verás la misma información. Aquí además puedes crear copias de seguridad puntuales, para poder volver atrás si algo se borra o se modifica por error.
        </div>
      </Card>

      <Card className="mb-4">
        <div className="flex items-center justify-between">
          <div>
            <div className="font-semibold text-[14px]">Crear copia de seguridad ahora</div>
            <div className="text-[12px]" style={{ color: C.inkSoft }}>Guarda el estado actual de todo el programa como un punto al que podrás volver.</div>
          </div>
          <Btn onClick={guardarAhora}><History size={14} /> {guardado ? "¡Guardada!" : "Guardar copia"}</Btn>
        </div>
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Historial de copias guardadas</div>
      {historial.length === 0 ? <Empty text="Todavía no hay copias de seguridad guardadas." /> : (
        <div className="space-y-2 mb-6">
          {historial.map((h) => (
            <Card key={h.id}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-[13px] font-medium">{new Date(h.fecha).toLocaleString("es-ES", { dateStyle: "medium", timeStyle: "short" })}</div>
                  <div className="text-[11px]" style={{ color: C.inkSoft }}>
                    {h.automatica ? "Copia automática de inicio de sesión" : "Copia manual"} · {contar(h.data)} registros principales
                  </div>
                </div>
                <Btn small variant="ghost" onClick={() => restaurarDesdeHistorial(h)}>Restaurar esta copia</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Copia portátil (para guardar fuera del programa)</div>
      <Card className="mb-4">
        <div className="text-[12.5px] mb-3" style={{ color: C.inkSoft }}>
          Si quieres una copia que puedas guardar tú mismo fuera de aquí (en tus notas, correo, etc.), puedes verla como texto y copiarla, o pegar una que hayas guardado antes.
        </div>
        <div className="flex gap-2">
          <Btn variant="ghost" onClick={abrirRespaldo}><Download size={14} /> Ver / copiar respaldo</Btn>
          <Btn variant="ghost" onClick={abrirRestaurar}><Upload size={14} /> Restaurar desde texto</Btn>
        </div>
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Para tu gestoría</div>
      <Card>
        <div className="text-[12.5px] mb-3" style={{ color: C.inkSoft }}>
          Un Excel con productos, movimientos y albaranes, listo para mandar. Para el resumen de IVA trimestral
          concreto, mejor usa el botón de exportar dentro de <b>Libro de IVA</b>, que ya viene calculado.
        </div>
        <Btn variant="ghost" onClick={exportarExcelGeneral}><Download size={14} /> Exportar datos a Excel</Btn>
      </Card>

      <div className="text-[12px] font-medium mb-2 mt-4" style={{ color: C.inkSoft }}>Acceso y modo empleado</div>
      <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Esto son códigos guardados en este teléfono, no cuentas de usuario reales: sirven para que un empleado no
          vea márgenes, sueldos ni resultados si coge el móvil, y para que la Auditoría diga quién hizo qué — pero
          no protegen los datos frente a alguien con acceso técnico al dispositivo. En modo empleado solo quedan
          visibles: Panel general, Venta rápida, Registro horario, Recepción, Inventario ciego, Control sanitario,
          Mapa de almacén y Traspasos.
        </div>
      </Card>

      <Card className="mb-4">
        <div className="text-[12.5px] font-semibold mb-2">{pinPropietario ? "Cambiar tu PIN de propietario" : "Crear tu PIN de propietario"}</div>
        <div className="text-[12px] mb-2" style={{ color: C.inkSoft }}>
          Este es el tuyo, el del dueño — hace falta para volver a modo propietario cuando alguien esté en modo empleado.
        </div>
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="PIN (4 a 6 dígitos)">
            <Input type="password" inputMode="numeric" value={nuevoPin} onChange={(e) => setNuevoPin(e.target.value)} />
          </Field>
          <Field label="Repite el PIN">
            <Input type="password" inputMode="numeric" value={confirmarPin} onChange={(e) => setConfirmarPin(e.target.value)} />
          </Field>
        </div>
        {pinError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{pinError}</div>}
        {pinGuardado && <div className="text-[12px] mb-2" style={{ color: C.accent }}>PIN guardado.</div>}
        <Btn variant="ghost" onClick={guardarPin}>{pinPropietario ? "Cambiar PIN" : "Guardar PIN"}</Btn>
      </Card>

      <Card>
        <div className="text-[12.5px] font-semibold mb-2">Cómo entra cada empleado</div>
        <div className="text-[12px]" style={{ color: C.inkSoft }}>
          Ponle a cada empleado su propio código en <b>Personal</b> (al editar su ficha). Con eso, cualquiera puede
          tocar el botón <b>"🔓 Modo empleado"</b> junto al menú, elegir su nombre y entrar con su código — sin que
          tú tengas que hacerlo por ellos.
        </div>
      </Card>
    </div>
  );
}

/* ================= SALDO DE ALMACÉN ================= */
function SaldoAlmacen({ productos, proveedores, valorInventario, valorUtillaje = 0, proveedorPorId, clasificacionABC, analisisABC }) {
  const [vista, setVista] = useState("saldo"); // saldo | conteo
  const [ubicacion, setUbicacion] = useState("todo"); // todo | piso | almacen
  const [copiado, setCopiado] = useState(false);
  const fecha = new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });

  // Se recalcula el "stock" de cada producto según la ubicación elegida, sin
  // tocar los datos reales — es solo para listar y contar por separado.
  // "Piso de venta" solo incluye vendibles; "Almacén" es el resto (para
  // vendibles, lo que no está en el mostrador; para todo lo demás, el total).
  const esVendible = (p) => p.tipo === "elaborado" || Number(p.precioVenta) > 0;
  const productosVista = useMemo(() => {
    if (ubicacion === "piso") {
      return productos.filter(esVendible).map((p) => ({ ...p, stock: Number(p.stockPisoVenta) || 0 }));
    }
    if (ubicacion === "almacen") {
      return productos.map((p) =>
        esVendible(p) ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) - (Number(p.stockPisoVenta) || 0)) } : p
      );
    }
    return productos;
  }, [productos, ubicacion]);

  const valorVista = productosVista.reduce((a, p) => a + (Number(p.stock) || 0) * (Number(p.costo) || 0), 0);
  const grupos = agruparPorProveedor(productosVista, proveedores || []);

  const totalUnidades = productosVista.reduce((a, p) => a + (Number(p.stock) || 0), 0);

  const tituloUbicacion = ubicacion === "piso" ? "Piso de venta" : ubicacion === "almacen" ? "Almacén (trastienda)" : "Total";

  function textoSaldo() {
    const bloques = grupos.map((g) => {
      const sub = g.items.reduce((a, p) => a + (Number(p.stock) || 0) * (Number(p.costo) || 0), 0);
      const lineas = g.items.map((p) => {
        const importe = (Number(p.stock) || 0) * (Number(p.costo) || 0);
        return `${p.nombre} | ${p.unidad} | ${p.stock} | €${fmt(importe)}`;
      });
      return `--- ${g.nombre.toUpperCase()} ---\n${lineas.join("\n")}\nSubtotal: €${fmt(sub)}`;
    });
    return `SALDO DE ALMACÉN (${tituloUbicacion}) — ${fecha}\n\n${bloques.join("\n\n")}\n\nTOTAL: €${fmt(valorVista)}`;
  }

  function textoConteo() {
    return textoHojaConteo(productosVista, proveedores);
  }

  function copiar() {
    const texto = vista === "saldo" ? textoSaldo() : textoConteo();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(vista === "saldo" ? textoSaldo() : textoConteo())}`;
  const correoUrl = `mailto:?subject=${encodeURIComponent(vista === "saldo" ? `Saldo de almacén ${fecha}` : `Hoja de conteo ${fecha}`)}&body=${encodeURIComponent(vista === "saldo" ? textoSaldo() : textoConteo())}`;

  const thStyle = { color: "#fff", background: C.chrome, fontWeight: 600 };

  return (
    <div>
      <div className="no-imprimir">
        <SectionTitle>Saldo de almacén</SectionTitle>

        <div className="flex gap-2 mb-3">
          <Btn variant={vista === "saldo" ? "primary" : "ghost"} onClick={() => setVista("saldo")}>Saldo valorado</Btn>
          <Btn variant={vista === "conteo" ? "primary" : "ghost"} onClick={() => setVista("conteo")}>Hoja de conteo</Btn>
        </div>

        <div className="flex gap-2 mb-4">
          {[
            { id: "todo", label: "Total" },
            { id: "piso", label: "Piso de venta" },
            { id: "almacen", label: "Almacén (trastienda)" },
          ].map((o) => (
            <button
              key={o.id}
              onClick={() => setUbicacion(o.id)}
              className="text-[12px] font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
              style={{
                background: ubicacion === o.id ? C.chrome : C.surface,
                color: ubicacion === o.id ? "#fff" : C.inkSoft,
                border: `1px solid ${ubicacion === o.id ? C.chrome : C.line}`,
              }}
            >
              {o.label}
            </button>
          ))}
        </div>

        {vista === "saldo" && (
          <div className="grid grid-cols-3 gap-3 mb-4">
            <Card>
              <div className="text-[11px]" style={{ color: C.inkSoft }}>Referencias</div>
              <div className="text-xl font-semibold mono mt-1">{productosVista.length}</div>
            </Card>
            <Card>
              <div className="text-[11px]" style={{ color: C.inkSoft }}>Unidades totales</div>
              <div className="text-xl font-semibold mono mt-1">{fmt(totalUnidades)}</div>
            </Card>
            <Card>
              <div className="text-[11px]" style={{ color: C.inkSoft }}>Valor — {tituloUbicacion}</div>
              <div className="text-xl font-semibold mono mt-1" style={{ color: C.accent }}>€{fmt(valorVista)}</div>
              {ubicacion === "todo" && valorUtillaje > 0 && (
                <div className="text-[10.5px] mt-0.5" style={{ color: C.inkSoft }}>+ €{fmt(valorUtillaje)} en utillaje</div>
              )}
            </Card>
          </div>
        )}


        {vista === "saldo" && (
          <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
            <div className="text-[12px] font-semibold mb-1">Clasificación ABC y frecuencia de conteo sugerida</div>
            <div className="text-[11.5px] space-y-0.5" style={{ color: C.ink }}>
              <div>Se calcula por <b>valor de consumo</b>: lo que ha salido en los últimos 12 meses × su costo. Un producto barato que rota mucho pesa más que uno caro parado.</div>
              <div className="pt-1"><b>A</b> — mueven el 80% del dinero. Cuéntalos <b>cada mes</b>.</div>
              <div><b>B</b> — hasta el 95%. Cuéntalos <b>cada trimestre</b>.</div>
              <div><b>C</b> — el resto. Cuéntalos <b>una o dos veces al año</b>.</div>
            </div>
            {analisisABC && !analisisABC.baseConsumo && (
              <div className="text-[11.5px] mt-2 pt-2" style={{ color: C.amber, borderTop: `1px solid rgba(0,0,0,0.08)` }}>
                Todavía no hay salidas registradas, así que de momento se clasifica por valor en stock. En cuanto empieces a registrar salidas, el ABC pasará a medir consumo real.
              </div>
            )}
          </Card>
        )}

        <div className="flex flex-wrap gap-2 mb-4">
          <Btn onClick={() => window.print()}>Imprimir / Guardar PDF</Btn>
          <LinkBtn href={whatsappUrl}><MessageCircle size={14} /> WhatsApp</LinkBtn>
          <LinkBtn href={correoUrl} newTab={false}><Mail size={14} /> Correo</LinkBtn>
          <Btn variant="ghost" onClick={copiar}>{copiado ? "¡Copiado!" : "Copiar texto"}</Btn>
        </div>
      </div>

      {productosVista.length === 0 ? <Empty text="No hay productos en esta ubicación todavía." /> : (
        <div className="zona-impresion" style={ESTILO_IMPRESION_CLARO}>
          <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>
            <div>
              <div className="text-[17px] font-semibold">
                {vista === "saldo" ? "Saldo de almacén" : "Hoja de conteo de inventario"} — {tituloUbicacion}
              </div>
              <div className="text-[11.5px]" style={{ color: C.inkSoft }}>Fecha: {fecha}</div>
            </div>
            <img src={LOGO} alt="" style={{ height: 62, width: "auto" }} />
          </div>

          {vista === "conteo" && (
            <div className="text-[11px] mb-3" style={{ color: C.inkSoft }}>
Cuenta físicamente cada producto y anota la cantidad en la columna "Conteo". No se muestra la existencia del sistema.
            </div>
          )}

          <table className="w-full text-[11.5px]" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th className="py-2 px-2 text-left" style={{ ...thStyle, width: 28 }}>Nº</th>
                <th className="py-2 px-2 text-left" style={thStyle}>Descripción del producto</th>
                <th className="py-2 px-2 text-center" style={{ ...thStyle, width: 52 }}>U/M</th>
                {vista === "saldo" ? (
                  <>
                    <th className="py-2 px-2 text-right" style={{ ...thStyle, width: 70 }}>Existencia</th>
                    <th className="py-2 px-2 text-right" style={{ ...thStyle, width: 70 }}>Costo</th>
                    <th className="py-2 px-2 text-right" style={{ ...thStyle, width: 80 }}>Importe</th>
                    <th className="py-2 px-2 text-right" style={{ ...thStyle, width: 66 }}>Salidas 12m</th>
                    <th className="py-2 px-2 text-center" style={{ ...thStyle, width: 34 }}>ABC</th>
                  </>
                ) : (
                  <>
                    <th className="py-2 px-2 text-center" style={{ ...thStyle, width: 90 }}>Conteo</th>
                  </>
                )}
              </tr>
            </thead>
            <tbody>
              {(() => {
                let n = 0;
                const cols = vista === "saldo" ? 8 : 4;
                return grupos.map((g) => {
                  const sub = g.items.reduce((a, p) => a + (Number(p.stock) || 0) * (Number(p.costo) || 0), 0);
                  return (
                    <React.Fragment key={g.id}>
                      <tr>
                        <td colSpan={cols} className="py-1.5 px-2 font-semibold text-[11.5px]" style={{ background: C.accentSoft, border: `1px solid ${C.line}` }}>
                          {g.nombre} · {g.items.length} referencia(s)
                          {vista === "saldo" && <span className="mono float-right">€{fmt(sub)}</span>}
                        </td>
                      </tr>
                      {g.items.map((p) => {
                const importe = (Number(p.stock) || 0) * (Number(p.costo) || 0);
                n += 1;
                const i = n;
                return (
                  <tr key={p.id} style={{ background: i % 2 ? C.bg : "#fff" }}>
                    <td className="py-2 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{i}</td>
                    <td className="py-2 px-2" style={{ border: `1px solid ${C.line}` }}>
                      {p.nombre}
                      {p.codigo && <span className="mono" style={{ color: C.inkSoft }}> · {p.codigo}</span>}
                    </td>
                    <td className="py-2 px-2 text-center" style={{ border: `1px solid ${C.line}` }}>{p.unidad}</td>
                    {vista === "saldo" ? (
                      <>
                        <td className="py-2 px-2 text-right mono" style={{ border: `1px solid ${C.line}` }}>{p.stock}</td>
                        <td className="py-2 px-2 text-right mono" style={{ border: `1px solid ${C.line}` }}>€{fmt(p.costo)}</td>
                        <td className="py-2 px-2 text-right mono font-semibold" style={{ border: `1px solid ${C.line}` }}>€{fmt(importe)}</td>
                        <td className="py-2 px-2 text-right mono" style={{ border: `1px solid ${C.line}` }}>
                          {analisisABC && analisisABC.detalle[p.id] ? analisisABC.detalle[p.id].unidades : 0}
                        </td>
                        <td className="py-2 px-2 text-center mono font-semibold" style={{ border: `1px solid ${C.line}` }}>{p.tipo === "utillaje" ? "—" : (clasificacionABC[p.id] || "C")}</td>
                      </>
                    ) : (
                      <>
                        <td style={{ border: `1px solid ${C.line}`, height: 32, background: "#F0F4F1" }}></td>
                      </>
                    )}
                  </tr>
                );
              })}
                    </React.Fragment>
                  );
                });
              })()}
              {vista === "saldo" && (
                <tr>
                  <td colSpan={5} className="py-2 px-2 text-right font-semibold" style={{ border: `1px solid ${C.line}`, background: C.accentSoft }}>
                    TOTAL VALOR — {tituloUbicacion.toUpperCase()}
                  </td>
                  <td className="py-2 px-2 text-right mono font-semibold" style={{ border: `1px solid ${C.line}`, background: C.accentSoft }}>
                    €{fmt(valorVista)}
                  </td>
                  <td style={{ border: `1px solid ${C.line}`, background: C.accentSoft }}></td>
                  <td style={{ border: `1px solid ${C.line}`, background: C.accentSoft }}></td>
                </tr>
              )}
            </tbody>
          </table>

          <div className="mt-6 text-[11px]" style={{ color: C.inkSoft }}>
            {vista === "conteo" ? (
              <div className="grid grid-cols-2 gap-6">
                <div>Contado por: _________________________</div>
                <div>Fecha y firma: _________________________</div>
              </div>
            ) : (
              <div className="grid grid-cols-2 gap-6">
                <div>Responsable de almacén: _________________________</div>
                <div>Fecha y firma: _________________________</div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ================= ALBARANES ================= */
function lineaVacia() {
  return {
    codigoProveedor: "",
    descripcion: "",
    unidad: "unidad",
    tipoUnidad: "unidad", // "unidad" | "peso"
    cantidad: "",
    udsPorCaja: 1,
    precioPor: "bulto", // "bulto" = precio de la caja | "unidad" = precio de cada pieza
    precioBruto: "",
    dtoPct: "",
    importe: "",
    canon: "", // Punto Verde, SIG, canon de envases: suma a la base de ESTA línea
    ivaPct: 10,
    lote: "",
    caducidad: "",
    contenido: "",
    unidadContenido: "",
    productoId: "",
  };
}

function Albaranes({
  albaranes, proveedores, productos, proveedorPorId,
  buscarEnCatalogo, guardarAlbaran, eliminarAlbaran, confirmarAlbaran, anularAlbaran, marcarPagada,
  prefill, limpiarPrefill, pedidos = [],
}) {
  const [modo, setModo] = useState("lista"); // lista | editor
  const [alb, setAlb] = useState(null);
  const [error, setError] = useState("");
  const [avisos, setAvisos] = useState(null);
  const [confirmarId, setConfirmarId] = useState(null);
  const [anularId, setAnularId] = useState(null);

  useEffect(() => {
    if (prefill) {
      setAlb(prefill);
      setModo("editor");
      setError("");
      limpiarPrefill();
    }
  }, [prefill]);

  function nuevoAlbaran() {
    setAlb({
      id: uid(),
      proveedorId: proveedores[0] ? proveedores[0].id : "",
      numero: "",
      fecha: todayISO(),
      totalPapel: "",
      cargos: "",
      cargosConcepto: "",
      cargosIva: 21,
      esFactura: true,
      numeroFactura: "",
      fechaFactura: todayISO(),
      pagada: false,
      fechaPago: "",
      lineas: [lineaVacia()],
      estado: "borrador",
    });
    setError("");
    setModo("editor");
  }

  function abrir(a) {
    setAlb(JSON.parse(JSON.stringify(a)));
    setError("");
    setModo("editor");
  }

  function setLinea(idx, campo, valor) {
    setAlb((a) => ({
      ...a,
      lineas: a.lineas.map((ln, i) => (i === idx ? { ...ln, [campo]: valor } : ln)),
    }));
  }

  // Al escribir el código, si ya se conoce esa referencia se rellena todo
  function aplicarCodigo(idx, codigo) {
    setAlb((a) => {
      const cat = buscarEnCatalogo(a.proveedorId, codigo);
      return {
        ...a,
        lineas: a.lineas.map((ln, i) => {
          if (i !== idx) return ln;
          if (!cat) return { ...ln, codigoProveedor: codigo };
          return {
            ...ln,
            codigoProveedor: codigo,
            descripcion: cat.descripcion || ln.descripcion,
            unidad: cat.unidad || ln.unidad,
            udsPorCaja: cat.udsPorCaja || 1,
            ivaPct: cat.ivaPct ?? ln.ivaPct,
            tipoUnidad: cat.tipoUnidad || "unidad",
            precioPor: cat.precioPor || "bulto",
            contenido: cat.contenido || "",
            unidadContenido: cat.unidadContenido || "",
            productoId: cat.productoId || "",
            precioBruto: ln.precioBruto === "" && cat.ultimoPrecio ? cat.ultimoPrecio : ln.precioBruto,
            dtoPct: ln.dtoPct === "" && cat.ultimoDto ? cat.ultimoDto : ln.dtoPct,
          };
        }),
      };
    });
  }

  // Importe = cantidad × precio − descuento (lo mismo que hace el albarán)
  // El albarán puede dar el precio por bulto (1 caja = 18,36 €) o por pieza
  // (cada croissant = 0,35 €). En el segundo caso hay que multiplicar además
  // por las unidades que trae cada caja.
  function unidadesFacturadas(ln) {
    const c = Number(ln.cantidad) || 0;
    if (ln.tipoUnidad === "peso") return c;
    const uds = Number(ln.udsPorCaja) > 0 ? Number(ln.udsPorCaja) : 1;
    return ln.precioPor === "unidad" ? c * uds : c;
  }
  function importeCalculado(ln) {
    const p = Number(ln.precioBruto) || 0;
    const d = Number(ln.dtoPct) || 0;
    const envase = Number(ln.envase) || 0;
    // El Punto Verde / recargo de envase se suma tal cual, sin descuento,
    // y lleva el mismo IVA que el producto (no es un cargo aparte).
    return unidadesFacturadas(ln) * p * (1 - d / 100) + envase;
  }
  // Base sobre la que se aplica el IVA de la línea: mercancía + canon de envases.
  // Coca-Cola suma el Punto Verde a la base y lo grava al mismo tipo del producto.
  function baseLinea(ln) {
    const imp = ln.importe !== "" ? Number(ln.importe) : importeCalculado(ln);
    return (Number(imp) || 0) + (Number(ln.canon) || 0);
  }

  function addLinea() {
    setAlb((a) => ({ ...a, lineas: [...a.lineas, lineaVacia()] }));
  }
  function quitarLinea(idx) {
    setAlb((a) => ({ ...a, lineas: a.lineas.filter((_, i) => i !== idx) }));
  }

  const baseTotal = !alb ? 0 : alb.lineas.reduce((acc, ln) => acc + baseLinea(ln), 0);
  const ivaTotal = !alb ? 0 : alb.lineas.reduce((acc, ln) => acc + baseLinea(ln) * ((Number(ln.ivaPct) || 0) / 100), 0);
  const cargosBase = Number(alb?.cargos) || 0;
  const cargosIvaImp = cargosBase * ((Number(alb?.cargosIva) || 0) / 100);
  const totalCalculado = baseTotal + ivaTotal + cargosBase + cargosIvaImp;
  const totalPapel = Number(alb?.totalPapel) || 0;
  const descuadre = totalPapel > 0 ? totalCalculado - totalPapel : 0;
  const cuadra = totalPapel > 0 && Math.abs(descuadre) < 0.02;

  function guardarBorrador() {
    if (!alb.proveedorId) { setError("Selecciona el proveedor."); return; }
    setError("");
    const limpio = {
      ...alb,
      lineas: alb.lineas.map((ln) => ({ ...ln, importe: ln.importe !== "" ? Number(ln.importe) : Number(importeCalculado(ln).toFixed(4)) })),
    };
    guardarAlbaran(limpio);
    setAlb(limpio);
  }

  function darEntrada() {
    if (!alb.proveedorId) { setError("Selecciona el proveedor."); return; }
    const validas = alb.lineas.filter((ln) => (ln.descripcion || ln.codigoProveedor) && Number(ln.cantidad) > 0);
    if (!validas.length) { setError("Añade al menos una línea con descripción y cantidad."); return; }
    setError("");
    const limpio = {
      ...alb,
      lineas: validas.map((ln) => ({ ...ln, importe: ln.importe !== "" ? Number(ln.importe) : Number(importeCalculado(ln).toFixed(4)) })),
    };
    const av = confirmarAlbaran(limpio);
    setAvisos(av && av.length ? av : []);
    setModo("lista");
    setAlb(null);
  }

  /* ---------- LISTA ---------- */
  if (modo === "lista") {
    return (
      <div>
        <SectionTitle action={<Btn onClick={nuevoAlbaran}><Plus size={15} /> Nuevo albarán</Btn>}>
          Entrada de albaranes
        </SectionTitle>

        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="text-[12.5px]">
            Teclea el albarán tal y como viene en el papel. La primera vez que introduzcas un código, el programa
            aprende su descripción, unidad y unidades por caja: a partir de ahí solo tendrás que escribir el código
            y la cantidad. Al dar entrada se crean o actualizan los productos, sube el stock y se recalculan los costes.
          </div>
        </Card>

        {avisos && (
          <Card className="mb-4" style={{ background: avisos.length ? C.amberSoft : C.accentSoft, border: "none" }}>
            {avisos.length === 0 ? (
              <div className="text-[12.5px]">Entrada registrada. Ningún precio ha variado más de un 3%.</div>
            ) : (
              <>
                <div className="text-[12.5px] font-semibold mb-2">Atención: el precio de esta entrega se aleja del coste promedio que tenías</div>
                {avisos.map((a, i) => (
                  <div key={i} className="text-[12px] flex items-center justify-between py-0.5">
                    <span>{a.nombre}</span>
                    <span className="mono" style={{ color: a.variacion > 0 ? C.red : C.accent }}>
                      €{fmt(a.anterior)} → €{fmt(a.nuevo)} ({a.variacion > 0 ? "+" : ""}{fmt(a.variacion)}%)
                    </span>
                  </div>
                ))}
                <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
                  El coste final del producto ya no es exactamente €{avisos[0] ? fmt(avisos[0].nuevo) : ""}: se ha promediado
                  con el stock que ya tenías, para no revalorizar de golpe lo que compraste más barato o más caro antes.
                </div>
              </>
            )}
            <div className="mt-2"><Btn small variant="ghost" onClick={() => setAvisos(null)}>Entendido</Btn></div>
          </Card>
        )}

        {albaranes.length === 0 ? <Empty text="Todavía no has registrado ningún albarán." /> : (
          <div className="space-y-2">
            {albaranes.map((a) => {
              const prov = proveedorPorId(a.proveedorId);
              const base = a.lineas.reduce((x, ln) => x + (Number(ln.importe) || 0), 0);
              return (
                <Card key={a.id}>
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="font-semibold">{prov ? prov.nombre : "Sin proveedor"}</div>
                      <div className="text-[12px]" style={{ color: C.inkSoft }}>
                        Albarán {a.numero || "s/n"} · {a.fecha} · {a.lineas.length} línea(s)
                      </div>
                    </div>
                    <div className="text-right">
                      <Pill color={a.estado === "confirmado" ? C.accent : C.amber}>
                        {a.estado === "confirmado" ? "Dado de entrada" : "Borrador"}
                      </Pill>
                      <div className="mono font-semibold mt-1">€{fmt(base)}</div>
                      {a.estado === "confirmado" && a.esFactura !== false && (
                        <div className="mt-0.5"><Pill color={a.pagada ? C.inkSoft : C.amber}>{a.pagada ? "Pagada" : "Sin pagar"}</Pill></div>
                      )}
                    </div>
                  </div>
                  <div className="mt-2 flex gap-2 flex-wrap">
                    <Btn small variant="ghost" onClick={() => abrir(a)}>
                      {a.estado === "confirmado" ? "Ver" : "Continuar editando"}
                    </Btn>
                    {a.estado === "confirmado" && (
                      <Btn small variant="ghost" onClick={() => setAnularId(a.id)}>Anular para editar</Btn>
                    )}
                    <Btn small variant="danger" onClick={() => setConfirmarId(a.id)}><Trash2 size={13} /> Eliminar</Btn>
                  </div>
                </Card>
              );
            })}
          </div>
        )}

        {anularId && (
          <Modal onClose={() => setAnularId(null)} title="Anular entrada para poder editar">
            <div className="text-[12.5px] mb-4">
              Se restará del stock lo que entró con este albarán y se borrarán sus movimientos.
              El albarán volverá a estado borrador para que puedas corregirlo y darle entrada otra vez.
              <br /><br />
              Los costes de los productos <b>no se revierten</b>: quedarán con el último valor introducido
              hasta que vuelvas a confirmar el albarán corregido.
            </div>
            <div className="flex gap-2">
              <Btn onClick={() => {
                const a = albaranes.find((x) => x.id === anularId);
                if (a) { anularAlbaran(a); }
                setAnularId(null);
              }}>Sí, anular y editar</Btn>
              <Btn variant="ghost" onClick={() => setAnularId(null)}>Cancelar</Btn>
            </div>
          </Modal>
        )}

        {confirmarId && (
          <Modal onClose={() => setConfirmarId(null)} title="Eliminar albarán">
            <div className="text-[12.5px] mb-4">
              Se borrará el registro del albarán. El stock y los movimientos que ya generó <b>no se deshacen</b>;
              si necesitas corregirlos, hazlo desde Inventario ciego o con una salida manual.
            </div>
            <div className="flex gap-2">
              <Btn variant="danger" onClick={() => { eliminarAlbaran(confirmarId); setConfirmarId(null); }}>Sí, eliminar</Btn>
              <Btn variant="ghost" onClick={() => setConfirmarId(null)}>Cancelar</Btn>
            </div>
          </Modal>
        )}
      </div>
    );
  }

  /* ---------- EDITOR ---------- */
  const bloqueado = alb.estado === "confirmado";

  return (
    <div>
      <SectionTitle action={<Btn variant="ghost" onClick={() => { setModo("lista"); setAlb(null); }}>Volver</Btn>}>
        {bloqueado ? "Albarán registrado" : "Nuevo albarán"}
      </SectionTitle>

      {bloqueado && (
        <Card className="mb-4" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
          <div className="text-[12.5px] mb-2">
            Este albarán ya se dio de entrada, por eso está en solo lectura. Si necesitas corregir algo,
            anula la entrada: se devolverá el stock y podrás editarlo.
          </div>
          <Btn small variant="ghost" onClick={() => { anularAlbaran(alb); setAlb({ ...alb, estado: "borrador" }); }}>
            Anular entrada y editar
          </Btn>
        </Card>
      )}

      {alb.pedidoId && (
        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="text-[12.5px]">
            Este albarán está enlazado a un pedido. Las líneas vienen con lo que pediste: corrige las cantidades
            para reflejar <b>lo que ha llegado de verdad</b>. Al dar entrada, el pedido se marcará como recibido
            o parcial según corresponda.
          </div>
        </Card>
      )}

      <Card className="mb-4">
        <div className="grid md:grid-cols-4 gap-x-3">
          <Field label="Proveedor">
            <select
              value={alb.proveedorId}
              onChange={(e) => setAlb({ ...alb, proveedorId: e.target.value })}
              disabled={bloqueado}
              className="w-full rounded-lg px-3 py-2 text-[13px]"
              style={{ border: `1px solid ${C.line}`, background: C.surface }}
            >
              <option value="">Selecciona…</option>
              {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
          </Field>
          <Field label="Nº de albarán">
            <Input value={alb.numero} onChange={(e) => setAlb({ ...alb, numero: e.target.value })} disabled={bloqueado} placeholder="ALENDUO26027571" />
          </Field>
          <Field label="Fecha">
            <Input type="date" value={alb.fecha} onChange={(e) => setAlb({ ...alb, fecha: e.target.value })} disabled={bloqueado} />
          </Field>
          <Field label="Total del papel (€)">
            <Input type="number" step="0.01" value={alb.totalPapel} onChange={(e) => setAlb({ ...alb, totalPapel: e.target.value })} disabled={bloqueado} placeholder="116,41" />
          </Field>
        </div>

        <div className="text-[11.5px] font-semibold mb-2 pt-2" style={{ borderTop: `1px solid ${C.line}`, color: C.inkSoft }}>
          Cargos aparte de la mercancía (opcional)
        </div>
        <div className="grid md:grid-cols-3 gap-x-3">
          <Field label="Concepto">
            <Input value={alb.cargosConcepto || ""} onChange={(e) => setAlb({ ...alb, cargosConcepto: e.target.value })} disabled={bloqueado} placeholder="Portes, Punto Verde, envases…" />
          </Field>
          <Field label="Importe (€)">
            <Input type="number" step="0.01" value={alb.cargos || ""} onChange={(e) => setAlb({ ...alb, cargos: e.target.value })} disabled={bloqueado} placeholder="0,47" />
          </Field>
          <Field label="IVA del cargo (%)">
            <select
              value={alb.cargosIva ?? 21}
              onChange={(e) => setAlb({ ...alb, cargosIva: e.target.value })}
              disabled={bloqueado}
              className="w-full rounded-lg px-3 py-2 text-[13px]"
              style={{ border: `1px solid ${C.line}`, background: C.surface }}
            >
              {TIPOS_IVA.map((t) => <option key={t} value={t}>{t}%</option>)}
            </select>
          </Field>
        </div>
        <div className="text-[11px]" style={{ color: C.inkSoft }}>
          Estos cargos no entran en el coste de los productos: solo sirven para que el total cuadre con el papel.
        </div>

        <div className="text-[11.5px] font-semibold mb-2 pt-3 mt-1" style={{ borderTop: `1px solid ${C.line}`, color: C.inkSoft }}>
          Facturación y pago
        </div>
        <div className="flex items-center gap-2 mb-2">
          <button
            type="button"
            disabled={bloqueado}
            onClick={() => setAlb({ ...alb, esFactura: !(alb.esFactura !== false) })}
            className="text-[12px] font-medium px-3 py-1.5 rounded-lg"
            style={{
              background: alb.esFactura !== false ? C.accentSoft : C.bg,
              border: `1px solid ${alb.esFactura !== false ? C.accent : C.line}`,
              color: C.ink,
            }}
          >
            {alb.esFactura !== false ? "✓ Este albarán es también la factura" : "Este albarán NO es la factura (aún no ha llegado)"}
          </button>
        </div>

        {alb.esFactura !== false && (
          <div className="grid md:grid-cols-3 gap-x-3">
            <Field label="Nº de factura (si es distinto del albarán)">
              <Input value={alb.numeroFactura || ""} onChange={(e) => setAlb({ ...alb, numeroFactura: e.target.value })} disabled={bloqueado} placeholder={alb.numero || "s/n"} />
            </Field>
            <Field label="Fecha de factura">
              <Input type="date" value={alb.fechaFactura || alb.fecha} onChange={(e) => setAlb({ ...alb, fechaFactura: e.target.value })} disabled={bloqueado} />
            </Field>
            <Field label={`Vencimiento (${proveedorPorId(alb.proveedorId)?.diasPago ? proveedorPorId(alb.proveedorId).diasPago + " días" : "sin días de pago"})`}>
              <Input
                readOnly
                value={(() => {
                  const prov = proveedorPorId(alb.proveedorId);
                  if (!prov || !prov.diasPago) return "Añade los días de pago en el proveedor";
                  const f = new Date(alb.fechaFactura || alb.fecha);
                  f.setDate(f.getDate() + Number(prov.diasPago));
                  return f.toLocaleDateString("es-ES");
                })()}
                style={{ background: C.bg, color: C.inkSoft }}
              />
            </Field>
          </div>
        )}

        {bloqueado && alb.esFactura !== false && (
          <div className="flex items-center justify-between pt-2 mt-1" style={{ borderTop: `1px solid ${C.line}` }}>
            <span className="text-[12.5px]">{alb.pagada ? `Pagada el ${alb.fechaPago}` : "Pendiente de pago"}</span>
            <Btn small variant={alb.pagada ? "ghost" : "primary"} onClick={() => { marcarPagada(alb.id, !alb.pagada); setAlb({ ...alb, pagada: !alb.pagada }); }}>
              {alb.pagada ? "Marcar como pendiente" : "Marcar como pagada"}
            </Btn>
          </div>
        )}
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Líneas del albarán</div>

      {alb.lineas.map((ln, idx) => {
        const cat = buscarEnCatalogo(alb.proveedorId, ln.codigoProveedor);
        const conocido = !!cat;
        const uds = Number(ln.udsPorCaja) > 0 ? Number(ln.udsPorCaja) : 1;
        const imp = ln.importe !== "" ? Number(ln.importe) : importeCalculado(ln);
        const totalUds = ln.tipoUnidad === "peso" ? Number(ln.cantidad) || 0 : (Number(ln.cantidad) || 0) * uds;
        const costoUd = totalUds > 0 ? imp / totalUds : 0;

        return (
          <Card key={idx} className="mb-3" style={{ background: C.bg }}>
            <div className="flex items-center justify-between mb-2">
              <span className="text-[12px] font-semibold">Línea {idx + 1}</span>
              <div className="flex items-center gap-2">
                {conocido && <Pill color={C.accent}>referencia conocida</Pill>}
                {!bloqueado && <button type="button" onClick={() => quitarLinea(idx)}><X size={16} color={C.inkSoft} /></button>}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-x-3">
              <Field label="Código del proveedor">
                <Input value={ln.codigoProveedor} onChange={(e) => aplicarCodigo(idx, e.target.value)} disabled={bloqueado} placeholder="01201" />
              </Field>
              <Field label="¿Cómo te lo cobran?">
                <select
                  value={ln.tipoUnidad}
                  onChange={(e) => setLinea(idx, "tipoUnidad", e.target.value)}
                  disabled={bloqueado}
                  className="w-full rounded-lg px-3 py-2 text-[13px]"
                  style={{ border: `1px solid ${C.line}`, background: C.surface }}
                >
                  <option value="unidad">Precio por bulto (saco, caja, bote…)</option>
                  <option value="peso">Precio por kilo (peso variable)</option>
                </select>
              </Field>
            </div>

            <div className="text-[11px] mb-3 rounded-lg p-2" style={{ background: C.surface, color: C.inkSoft, border: `1px solid ${C.line}` }}>
              {ln.tipoUnidad === "peso" ? (
                <>Solo si el albarán pone <b>€/kg</b> y el peso cambia en cada entrega: jamón 1,02 kg × 7,95 €/kg, naranjas 30 kg × 1,20 €/kg. En "Kilos" van los kilos servidos.</>
              ) : (
                <>Lo habitual. Un saco de harina de 25 kg a 18 € es <b>1 bulto a 18 €</b>, no 25 kilos: los 25 kg son el formato, van en el nombre. En "Cantidad" van los sacos o cajas que llegaron.</>
              )}
            </div>

            <div className="hidden">
            </div>

            <Field label="Descripción">
              <Input value={ln.descripcion} onChange={(e) => setLinea(idx, "descripcion", e.target.value)} disabled={bloqueado} placeholder="HARINA DE TRIGO FLOJA CIFUENTES S 25 KG" />
            </Field>

            <div className="grid grid-cols-3 gap-x-3">
              <Field label="Unidad">
                <Input value={ln.unidad} onChange={(e) => setLinea(idx, "unidad", e.target.value)} disabled={bloqueado} placeholder="saco, kg, bote" />
              </Field>
              <Field label={ln.tipoUnidad === "peso" ? "Kilos servidos" : "Cantidad de bultos"}>
                <Input type="number" step="0.01" value={ln.cantidad} onChange={(e) => setLinea(idx, "cantidad", e.target.value)} disabled={bloqueado} />
              </Field>
              <Field label="Uds por caja">
                <Input type="number" step="1" value={ln.udsPorCaja} onChange={(e) => setLinea(idx, "udsPorCaja", e.target.value)} disabled={bloqueado} />
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-x-3">
              <Field label="Contenido de cada bulto (opcional)">
                <Input type="number" step="0.001" value={ln.contenido} onChange={(e) => setLinea(idx, "contenido", e.target.value)} disabled={bloqueado} placeholder="25" />
              </Field>
              <Field label="Unidad del contenido">
                <Input value={ln.unidadContenido} onChange={(e) => setLinea(idx, "unidadContenido", e.target.value)} disabled={bloqueado} placeholder="kg, L, uds" />
              </Field>
            </div>

            {ln.tipoUnidad !== "peso" && (
              <Field label="El precio del albarán es…">
                <select
                  value={ln.precioPor || "bulto"}
                  onChange={(e) => setLinea(idx, "precioPor", e.target.value)}
                  disabled={bloqueado}
                  className="w-full rounded-lg px-3 py-2 text-[13px]"
                  style={{ border: `1px solid ${C.line}`, background: C.surface }}
                >
                  <option value="bulto">Por bulto entero (1 caja = X €)</option>
                  <option value="unidad">Por pieza suelta (1 croissant = X €)</option>
                </select>
              </Field>
            )}

            <div className="grid grid-cols-3 gap-x-3">
              <Field label="Precio">
                <Input type="number" step="0.0001" value={ln.precioBruto} onChange={(e) => setLinea(idx, "precioBruto", e.target.value)} disabled={bloqueado} />
              </Field>
              <Field label="% Dto.">
                <Input type="number" step="0.01" value={ln.dtoPct} onChange={(e) => setLinea(idx, "dtoPct", e.target.value)} disabled={bloqueado} />
              </Field>
              <Field label="Punto Verde / envase (€)">
                <Input type="number" step="0.001" value={ln.envase} onChange={(e) => setLinea(idx, "envase", e.target.value)} disabled={bloqueado} placeholder="0,02" />
              </Field>
              <Field label="Importe">
                <Input type="number" step="0.01" value={ln.importe} onChange={(e) => setLinea(idx, "importe", e.target.value)} disabled={bloqueado} placeholder={fmt(importeCalculado(ln))} />
              </Field>
              <Field label="Punto Verde / envases">
                <Input type="number" step="0.01" value={ln.canon} onChange={(e) => setLinea(idx, "canon", e.target.value)} disabled={bloqueado} placeholder="0,02" />
              </Field>
              <Field label="IVA %">
                <select
                  value={ln.ivaPct}
                  onChange={(e) => setLinea(idx, "ivaPct", e.target.value)}
                  disabled={bloqueado}
                  className="w-full rounded-lg px-3 py-2 text-[13px]"
                  style={{ border: `1px solid ${C.line}`, background: C.surface }}
                >
                  {TIPOS_IVA.map((t) => <option key={t} value={t}>{t}%</option>)}
                </select>
              </Field>
            </div>

            <div className="grid grid-cols-2 gap-x-3">
              <Field label="Lote (trazabilidad)">
                <Input value={ln.lote} onChange={(e) => setLinea(idx, "lote", e.target.value)} disabled={bloqueado} placeholder="1/52451" />
              </Field>
              <Field label="Caducidad">
                <Input type="date" value={ln.caducidad} onChange={(e) => setLinea(idx, "caducidad", e.target.value)} disabled={bloqueado} />
              </Field>
            </div>

            {ln.cantidadPedida != null && ln.cantidadPedida !== "" && (() => {
              const pedida = Number(ln.cantidadPedida) || 0;
              const dif = totalUds - pedida;
              if (Math.abs(dif) < 0.001) {
                return (
                  <div className="text-[11.5px] mb-2" style={{ color: C.accent }}>
                    Coincide con lo pedido ({fmt(pedida)} {ln.unidad}).
                  </div>
                );
              }
              return (
                <div className="text-[11.5px] mb-2" style={{ color: C.amber }}>
                  Pediste {fmt(pedida)} {ln.unidad} y llegan {fmt(totalUds)}
                  {" "}({dif > 0 ? "+" : ""}{fmt(dif)}). Quedará como recibido parcial.
                </div>
              );
            })()}

            {totalUds > 0 && (
              <div className="pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
                <div className="text-[11.5px] mono" style={{ color: C.inkSoft }}>
                  {ln.precioPor === "unidad" && ln.tipoUnidad !== "peso"
                    ? `${fmt(Number(ln.cantidad) || 0)} bultos × ${fmt(uds)} uds × €${fmt(Number(ln.precioBruto) || 0)}`
                    : `${fmt(Number(ln.cantidad) || 0)} × €${fmt(Number(ln.precioBruto) || 0)}`}
                  {Number(ln.dtoPct) ? ` − ${fmt(Number(ln.dtoPct))}%` : ""}
                  {Number(ln.envase) ? ` + €${fmt(Number(ln.envase))} envase` : ""} = €{fmt(imp)}
                </div>
                <div className="text-[11.5px] mono" style={{ color: C.accent }}>
                  Entran {fmt(totalUds)} {ln.unidad} · €{fmt(costoUd)} cada {ln.tipoUnidad === "peso" ? "kg" : "unidad"}
                </div>
                {Number(ln.contenido) > 0 && ln.tipoUnidad !== "peso" && (
                  <div className="text-[11.5px] mono" style={{ color: C.accent }}>
                    Contenido total {fmt(totalUds * Number(ln.contenido))} {ln.unidadContenido || ""} ·
                    €{fmt(costoUd / Number(ln.contenido))} por {ln.unidadContenido || "unidad de contenido"}
                  </div>
                )}
              </div>
            )}
          </Card>
        );
      })}

      {!bloqueado && (
        <button type="button" onClick={addLinea} className="text-[12.5px] font-medium mb-4" style={{ color: C.accent }}>
          + Añadir línea
        </button>
      )}

      <Card className="mb-4" style={{ background: totalPapel > 0 ? (cuadra ? C.accentSoft : C.amberSoft) : C.bg, border: "none" }}>
        <div className="grid grid-cols-3 gap-3 text-center mb-2">
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Base imponible</div>
            <div className="mono font-semibold">€{fmt(baseTotal)}</div>
            {cargosBase > 0 && (
              <div className="text-[10.5px] mono" style={{ color: C.inkSoft }}>+ cargos €{fmt(cargosBase)}</div>
            )}
          </div>
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>IVA</div>
            <div className="mono font-semibold">€{fmt(ivaTotal)}</div>
          </div>
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Total calculado</div>
            <div className="mono font-bold text-[16px]">€{fmt(totalCalculado)}</div>
          </div>
        </div>
        {totalPapel > 0 && (
          <div className="text-[12px] text-center pt-2" style={{ borderTop: "1px solid rgba(0,0,0,0.08)" }}>
            {cuadra ? (
              <span style={{ color: C.accent }}>Cuadra con el total del papel (€{fmt(totalPapel)}).</span>
            ) : (
              <span style={{ color: C.amber }}>
                No cuadra: el papel dice €{fmt(totalPapel)} y sale €{fmt(totalCalculado)}
                {" "}(diferencia {descuadre > 0 ? "+" : ""}€{fmt(descuadre)}). Revisa descuentos, portes o IVA.
              </span>
            )}
          </div>
        )}
      </Card>

      {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}

      {!bloqueado && (
        <div className="flex gap-2 flex-wrap">
          <Btn onClick={darEntrada}><CheckCircle2 size={14} /> Dar entrada al almacén</Btn>
          <Btn variant="ghost" onClick={guardarBorrador}>Guardar como borrador</Btn>
          <Btn variant="ghost" onClick={() => { setModo("lista"); setAlb(null); }}>Cancelar</Btn>
        </div>
      )}
    </div>
  );
}

/* ================= RESULTADOS ================= */
function Resultados({ movimientos, productos, productoPorId, gastosGenerales, addGasto, deleteGasto, empleados = [] }) {
  const [desde, setDesde] = useState(primerDiaMes(new Date()));
  const [hasta, setHasta] = useState(ultimoDiaMes(new Date()));
  const [showGasto, setShowGasto] = useState(false);
  const [gastoForm, setGastoForm] = useState({ concepto: "", importe: "" });
  const [gastoError, setGastoError] = useState("");

  function irMesActual() {
    setDesde(primerDiaMes(new Date()));
    setHasta(ultimoDiaMes(new Date()));
  }
  function irMesAnterior() {
    const d = new Date();
    d.setMonth(d.getMonth() - 1);
    setDesde(primerDiaMes(d));
    setHasta(ultimoDiaMes(d));
  }

  const salidasPeriodo = useMemo(
    () => movimientos.filter((m) => m.tipo === "salida" && m.motivo && m.fecha >= desde && m.fecha <= hasta),
    [movimientos, desde, hasta]
  );

  const ventas = salidasPeriodo.filter((m) => m.motivo === "Venta");
  const mermas = salidasPeriodo.filter((m) => m.motivo === "Merma");
  const autoconsumo = salidasPeriodo.filter((m) => m.motivo === "Autoconsumo");
  const roturas = salidasPeriodo.filter((m) => m.motivo === "Rotura");

  const ingresos = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0), 0);
  const costeVentas = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
  const margenBruto = ingresos - costeVentas;
  const margenPct = ingresos > 0 ? (margenBruto / ingresos) * 100 : null;

  const valorMermas = mermas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
  const valorAutoconsumo = autoconsumo.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
  const valorRoturas = roturas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);

  const mermasPorProducto = useMemo(() => {
    const mapa = {};
    mermas.forEach((m) => {
      mapa[m.productoId] = (mapa[m.productoId] || 0) + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0);
    });
    return Object.entries(mapa)
      .map(([id, valor]) => ({ producto: productoPorId(id), valor }))
      .filter((x) => x.producto && x.valor > 0)
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 5);
  }, [mermas, productoPorId]);

  const dias = Math.max(1, Math.round((new Date(hasta) - new Date(desde)) / 86400000) + 1);
  const gastosGeneralesMensual = gastosGenerales.reduce((a, g) => a + (Number(g.importe) || 0), 0);

  // Coste de personal: usa el coste para la empresa si lo pusiste; si no,
  // una estimación aproximada (bruto × 1,32) que cubre Seguridad Social a
  // cargo de la empresa. Solo cuenta a los empleados de alta (activo !== false).
  const costePersonalMensual = empleados
    .filter((e) => e.activo !== false)
    .reduce((a, e) => {
      const bruto = Number(e.salarioBrutoMensual) || 0;
      const coste = e.costeEmpresaMensual !== "" && e.costeEmpresaMensual != null ? Number(e.costeEmpresaMensual) : bruto * 1.32;
      return a + coste;
    }, 0);
  const personalEsEstimado = empleados.some((e) => e.activo !== false && (e.costeEmpresaMensual === "" || e.costeEmpresaMensual == null) && Number(e.salarioBrutoMensual) > 0);

  const gastosTotalMensual = gastosGeneralesMensual + costePersonalMensual;
  const gastosPeriodo = gastosTotalMensual * (dias / 30);
  const resultadoNeto = margenBruto - gastosPeriodo;

  const huboLegacy = movimientos.some((m) => m.tipo === "salida" && !m.motivo);

  // Punto de equilibrio: si ya hay ventas reales en el periodo se usa su margen;
  // si todavía no hay ninguna, se usa el margen medio de los productos con
  // precio puesto en el catálogo, dejando claro que es una estimación.
  const margenTeorico = useMemo(() => {
    const conPrecio = productos.filter((p) => Number(p.precioVenta) > 0);
    if (!conPrecio.length) return null;
    const total = conPrecio.reduce((a, p) => a + (margenDe(p) || 0), 0);
    return total / conPrecio.length;
  }, [productos]);

  const margenParaPE = ingresos > 0 ? margenPct : margenTeorico;
  const esTeorico = !(ingresos > 0);
  const peMensual = margenParaPE > 0 ? gastosTotalMensual / (margenParaPE / 100) : null;
  const pePeriodo = margenParaPE > 0 ? gastosPeriodo / (margenParaPE / 100) : null;


  function submitGasto() {
    if (!gastoForm.concepto.trim()) {
      setGastoError("Escribe el concepto del gasto.");
      return;
    }
    if (!Number(gastoForm.importe) || Number(gastoForm.importe) <= 0) {
      setGastoError("Escribe un importe mensual mayor que cero.");
      return;
    }
    setGastoError("");
    addGasto({ concepto: gastoForm.concepto.trim(), importe: Number(gastoForm.importe) });
    setGastoForm({ concepto: "", importe: "" });
    setShowGasto(false);
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-1">
        <SectionTitle>Resultados</SectionTitle>
        <Btn small variant="ghost" onClick={() => window.print()} className="no-imprimir">
          <FileText size={13} /> Imprimir / Guardar PDF
        </Btn>
      </div>

      <Card className="mb-4 no-imprimir">
        <div className="flex flex-wrap gap-2 mb-3">
          <Btn small variant="ghost" onClick={irMesActual}>Este mes</Btn>
          <Btn small variant="ghost" onClick={irMesAnterior}>Mes anterior</Btn>
        </div>
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
          <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
        </div>
      </Card>

      <div className="zona-impresion" style={ESTILO_IMPRESION_CLARO}>
        <div className="flex items-end justify-between mb-4 pb-3" style={{ borderBottom: "2px solid #9C7A34" }}>
          <div>
            <div className="text-[17px] font-semibold">Resultados</div>
            <div className="text-[11.5px]" style={{ color: "#6B7A6E" }}>
              Del {desde} al {hasta} · generado el {todayISO()}
            </div>
          </div>
          <img src={LOGO} alt="" style={{ height: 56, width: "auto" }} />
        </div>

      {huboLegacy && (
        <Card className="mb-4 no-imprimir" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12px]">
            Algunas salidas registradas antes de esta actualización no tienen motivo ni precio de venta, así que no
            entran en este cálculo. A partir de ahora, cada salida que registres desde Productos sí alimentará estos resultados.
          </div>
        </Card>
      )}

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Ingresos por ventas</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: C.accent }}>€{fmt(ingresos)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Coste de lo vendido</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(costeVentas)}</div>
        </Card>
      </div>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="flex items-center justify-between">
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Margen bruto</div>
            <div className="text-2xl font-bold mono">€{fmt(margenBruto)}</div>
          </div>
          <div className="text-right">
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Sobre ventas</div>
            <div className="text-xl font-semibold mono" style={{ color: margenPct == null ? C.ink : margenPct < 15 ? C.red : C.accent }}>
              {margenPct == null ? "—" : `${fmt(margenPct)}%`}
            </div>
          </div>
        </div>
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Lo que se ha perdido (a coste)</div>
      <div className="grid grid-cols-3 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Mermas / caducidad</div>
          <div className="text-lg font-semibold mono mt-1" style={{ color: valorMermas > 0 ? C.red : C.ink }}>€{fmt(valorMermas)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Autoconsumo</div>
          <div className="text-lg font-semibold mono mt-1">€{fmt(valorAutoconsumo)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Roturas</div>
          <div className="text-lg font-semibold mono mt-1" style={{ color: valorRoturas > 0 ? C.red : C.ink }}>€{fmt(valorRoturas)}</div>
        </Card>
      </div>

      {mermasPorProducto.length > 0 && (

        <div className="space-y-1.5 mb-4 no-imprimir">
          {gastosGenerales.map((g) => (
            <Card key={g.id}>
              <div className="flex items-center justify-between">
                <span className="text-[12.5px]">{g.concepto}</span>

                  <span className="mono text-[12.5px]">€{fmt(g.importe)}/mes</span>
                  <button onClick={() => deleteGasto(g.id)}><Trash2 size={14} color={C.inkSoft} /></button>

            </Card>

          <span className="text-[12px]" style={{ color: C.inkSoft }}>Gastos generales del periodo</span>
          <span className="mono">€{fmt(gastosGeneralesMensual * (dias / 30))}</span>
        </div>
        {costePersonalMensual > 0 && (
          <div className="flex items-center justify-between mb-1">
            <span className="text-[12px]" style={{ color: C.inkSoft }}>
              Coste de personal del periodo{personalEsEstimado ? " (parte estimado)" : ""}
            </span>
            <span className="mono">€{fmt(costePersonalMensual * (dias / 30))}</span>
          </div>

        <div className="flex items-center justify-between pt-2" style={{ borderTop: `1px solid ${C.line}` }}>

            {resultadoNeto >= 0 ? "" : "−"}€{fmt(Math.abs(resultadoNeto))}
          </span>
        </div>
        <div className="text-[10.5px] mt-1" style={{ color: C.inkSoft }}>
          Aproximado: los gastos fijos y el personal se reparten a prorrata de los días del periodo, no día a día real
          {personalEsEstimado ? ", y el coste de personal sin cifra exacta usa bruto × 1,32 como aproximación." : "."}

      {gastosTotalMensual > 0 && (

            <>
              <div className="text-[12.5px] mt-1 mb-2">
                Con un margen {esTeorico ? "medio del catálogo" : "real de este periodo"} del <b>{fmt(margenParaPE)}%</b>,
                necesitas facturar esto solo para cubrir tus gastos fijos{costePersonalMensual > 0 ? " y el personal" : ""}, sin ganar ni perder:
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="text-[11px]" style={{ color: "#9CB6A9" }}>Al mes</div>
                  <div className="text-xl font-bold mono">€{fmt(peMensual)}</div>

                <div>
                  <div className="text-[11px]" style={{ color: "#9CB6A9" }}>En este periodo ({dias} días)</div>
                  <div className="text-xl font-bold mono">€{fmt(pePeriodo)}</div>
