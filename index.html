                      <div className="text-[12.5px]">{v.producto.nombre}</div>
                      {v.alergenos.length > 0 && (
                        <div className="text-[10.5px]" style={{ color: "#6B7A6E" }}>
                          {v.alergenos.map((id) => { const a = alergenoPorId(id); return a ? `${a.icono} ${a.nombre}` : ""; }).join(" · ")}
                        </div>
                      )}
                    </div>
                    <div className="mono font-semibold text-[13px]">€{fmt(precioNeto(v.producto) * (1 + ivaDe(v.producto) / 100))}</div>
                  </div>
                ))}
              </div>
            ))}

            <div className="text-[10px] mt-4" style={{ color: "#6B7A6E" }}>
              Precios con IVA incluido. Puede haber trazas de otros alérgenos por manipulación en el mismo obrador.
            </div>
          </div>
        </>
      )}
    </div>
  );
}

/* ================= VENTA RÁPIDA ================= */
function VentaRapida({ productos, venderCarrito }) {
  const [carrito, setCarrito] = useState([]); // [{productoId, cantidad}]
  const [categoria, setCategoria] = useState("Todos");
  const [busqueda, setBusqueda] = useState("");
  const [avisoEscaneo, setAvisoEscaneo] = useState("");
  const inputEscaneoRef = useRef(null);
  const [showCobro, setShowCobro] = useState(false);
  const [medioPago, setMedioPago] = useState("Efectivo");
  const [efectivoRecibido, setEfectivoRecibido] = useState("");
  const [importeTarjetaMixto, setImporteTarjetaMixto] = useState("");
  const [confirmacion, setConfirmacion] = useState(null);
  const [enviandoVenta, setEnviandoVenta] = useState(false);
  const [errorVenta, setErrorVenta] = useState("");

  // Solo entra lo que físicamente está en el mostrador ahora mismo. Si algo
  // se quedó en el almacén de atrás y no se ha traspasado, no aparece aquí
  // para vender — no se puede vender lo que no está a la vista.
  const vendibles = useMemo(
    () => productos.filter((p) => (p.tipo === "elaborado" || Number(p.precioVenta) > 0) && (Number(p.stockPisoVenta) || 0) > 0),
    [productos]
  );
  const categorias = useMemo(() => {
    const set = new Set(vendibles.map((p) => p.categoria).filter(Boolean));
    return ["Todos", ...[...set].sort()];
  }, [vendibles]);
  const visibles = useMemo(() => {
    const base = categoria === "Todos" ? vendibles : vendibles.filter((p) => p.categoria === categoria);
    const q = busqueda.trim().toLowerCase();
    if (!q) return base;
    return base.filter((p) => p.nombre.toLowerCase().includes(q) || (p.codigoBarras || "").toLowerCase().includes(q));
  }, [vendibles, categoria, busqueda]);

  // Al escanear con un lector de código de barras (que "escribe" muy rápido
  // y termina con Enter, como un teclado), si el texto coincide exacto con
  // el código de un producto, se añade solo al carrito y se limpia el campo
  // para el siguiente escaneo — sin tener que tocar la pantalla.
  function manejarEnterEscaneo(e) {
    if (e.key !== "Enter") return;
    const q = busqueda.trim().toLowerCase();
    if (!q) return;
    const exacto = vendibles.find((p) => (p.codigoBarras || "").toLowerCase() === q);
    if (exacto) {
      agregar(exacto);
      setBusqueda("");
      setAvisoEscaneo(`✓ ${exacto.nombre}`);
      setTimeout(() => setAvisoEscaneo(""), 1500);
    } else if (visibles.length === 1) {
      // No hay coincidencia exacta de código, pero solo queda un producto
      // visible tras filtrar por texto — es casi seguro que es ese.
      agregar(visibles[0]);
      setBusqueda("");
      setAvisoEscaneo(`✓ ${visibles[0].nombre}`);
      setTimeout(() => setAvisoEscaneo(""), 1500);
    }
  }

  function agregar(producto) {
    setCarrito((s) => {
      const existe = s.find((l) => l.productoId === producto.id);
      if (existe) return s.map((l) => (l.productoId === producto.id ? { ...l, cantidad: (Number(l.cantidad) || 0) + 1 } : l));
      return [...s, { productoId: producto.id, cantidad: 1 }];
    });
  }
  function cambiarCantidad(productoId, delta) {
    setCarrito((s) =>
      s.map((l) => (l.productoId === productoId ? { ...l, cantidad: Math.max(1, (Number(l.cantidad) || 0) + delta) } : l)).filter((l) => l.cantidad > 0)
    );
  }
  // Escribir la cantidad a mano. Se admite dejarlo vacío mientras se teclea
  // (si no, al borrar para escribir otro número saltaría a 1 y estorbaría);
  // al salir del campo, si quedó vacío o en cero, vuelve a 1.
  function fijarCantidad(productoId, valor) {
    setCarrito((s) => s.map((l) => (l.productoId === productoId ? { ...l, cantidad: valor } : l)));
  }
  function normalizarCantidad(productoId) {
    setCarrito((s) =>
      s.map((l) => {
        if (l.productoId !== productoId) return l;
        const n = Number(l.cantidad);
        return { ...l, cantidad: !n || n <= 0 ? 1 : n };
      })
    );
  }
  function quitar(productoId) {
    setCarrito((s) => s.filter((l) => l.productoId !== productoId));
  }
  function vaciarCarrito() {
    setCarrito([]);
  }

  const lineasCarrito = carrito
    .map((l) => {
      const p = productos.find((x) => x.id === l.productoId);
      if (!p) return null;
      const precioConIva = precioNeto(p) * (1 + ivaDe(p) / 100);
      // La cantidad puede venir escrita a mano (y por tanto como texto, o
      // vacía mientras se teclea), así que se convierte a número siempre.
      const cant = Number(l.cantidad) || 0;
      return { ...l, cantidadNum: cant, producto: p, precioUnitario: precioConIva, subtotal: precioConIva * cant };
    })
    .filter(Boolean);

  const total = lineasCarrito.reduce((a, l) => a + l.subtotal, 0);
  const faltaStock = lineasCarrito.filter((l) => l.cantidadNum > (Number(l.producto.stockPisoVenta) || 0));
  // En pago mixto, lo que no va con tarjeta se cobra en efectivo — el
  // cambio se calcula sobre ese resto, no sobre el total de la venta.
  const restoEfectivoMixto = medioPago === "Mixto" ? Math.max(0, total - (Number(importeTarjetaMixto) || 0)) : null;
  const baseParaCambio = medioPago === "Mixto" ? restoEfectivoMixto : total;
  const cambio = (medioPago === "Efectivo" || medioPago === "Mixto") && efectivoRecibido !== ""
    ? Number(efectivoRecibido) - baseParaCambio
    : null;

  function abrirCobro() {
    if (lineasCarrito.length === 0) return;
    setMedioPago("Efectivo");
    setEfectivoRecibido("");
    setImporteTarjetaMixto("");
    setErrorVenta("");
    setShowCobro(true);
  }

  async function confirmarCobro() {
    const detallePago = medioPago === "Mixto"
      ? { tarjeta: Number(importeTarjetaMixto) || 0, efectivo: restoEfectivoMixto }
      : null;
    setErrorVenta("");
    setEnviandoVenta(true);
    const resultado = await venderCarrito(
      carrito.map((l) => ({ productoId: l.productoId, cantidad: l.cantidad })),
      medioPago,
      detallePago
    );
    setEnviandoVenta(false);

    if (!resultado || resultado.ok === false) {
      // Rechazada de verdad (sin stock suficiente en el mismo instante en
      // otro dispositivo, por ejemplo) — no se cobra nada, no se vacía el
      // carrito, y se avisa con el producto exacto para poder ajustarlo.
      const prod = resultado && resultado.productoId ? productos.find((p) => p.id === resultado.productoId) : null;
      setErrorVenta(
        resultado && resultado.error === "Stock insuficiente"
          ? `Sin stock suficiente de "${prod ? prod.nombre : "ese producto"}" — quedan ${fmt(resultado.disponible)}. No se ha cobrado nada, ajusta la cantidad.`
          : (resultado && resultado.error) || "No se pudo completar la venta. Inténtalo de nuevo."
      );
      return;
    }

    setConfirmacion({ total, n: resultado.n, medioPago, cambio, detallePago });
    setCarrito([]);
    setShowCobro(false);
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <h2 className="text-[16px] font-semibold">Venta rápida</h2>
        {carrito.length > 0 && <Btn small variant="ghost" onClick={vaciarCarrito}>Vaciar carrito</Btn>}
      </div>

      <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
        <div className="text-[12px]">
          Esto registra la venta y descuenta el stock para tu control interno — <b>no emite ningún tique fiscal</b>.
          Para lo que le das al cliente, sigue usando tu caja o TPV habitual.
        </div>
      </Card>

      {vendibles.length === 0 ? (
        <Empty text="No hay nada en el piso de venta ahora mismo. Ponle precio a un producto en Productos, o haz un traspaso desde el almacén en la pestaña Traspasos." />
      ) : (
        <>
          <div className="relative mb-3">
            <input
              ref={inputEscaneoRef}
              type="text"
              inputMode="search"
              value={busqueda}
              onChange={(e) => setBusqueda(e.target.value)}
              onKeyDown={manejarEnterEscaneo}
              placeholder="Escanea un código de barras o busca por nombre…"
              autoFocus
              className="w-full rounded-xl px-4 py-3 text-[14px]"
              style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}
            />
            {avisoEscaneo && (
              <div
                className="absolute right-3 top-1/2 -translate-y-1/2 text-[12.5px] font-semibold px-2 py-1 rounded-md"
                style={{ background: C.accentSoft, color: C.accent }}
              >
                {avisoEscaneo}
              </div>
            )}
            {busqueda && !avisoEscaneo && (
              <button
                onClick={() => { setBusqueda(""); inputEscaneoRef.current?.focus(); }}
                className="absolute right-3 top-1/2 -translate-y-1/2"
              >
                <X size={16} color={C.inkSoft} />
              </button>
            )}
          </div>

          <div className="flex gap-2 mb-3 overflow-x-auto">
            {categorias.map((c) => (
              <button
                key={c}
                onClick={() => setCategoria(c)}
                className="text-[12px] font-medium px-3 py-1.5 rounded-full whitespace-nowrap shrink-0"
                style={{
                  background: categoria === c ? C.chrome : C.surface,
                  color: categoria === c ? "#fff" : C.inkSoft,
                  border: `1px solid ${categoria === c ? C.chrome : C.line}`,
                }}
              >
                {c}
              </button>
            ))}
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 mb-4">
            {visibles.map((p) => {
              const precioConIva = precioNeto(p) * (1 + ivaDe(p) / 100);
              const enCarrito = carrito.find((l) => l.productoId === p.id);
              const sinStock = (Number(p.stockPisoVenta) || 0) <= 0;
              return (
                <button
                  key={p.id}
                  onClick={() => agregar(p)}
                  className="rounded-xl p-3 text-left relative"
                  style={{ background: C.surface, border: `1px solid ${enCarrito ? C.accent : C.line}` }}
                >
                  <div className="text-[12.5px] font-medium leading-tight mb-1">{p.nombre}</div>
                  <div className="text-[14px] font-bold mono" style={{ color: C.accent }}>€{fmt(precioConIva)}</div>
                  {sinStock && <div className="text-[10px] mt-0.5" style={{ color: C.red }}>sin stock</div>}
                  {enCarrito && (
                    <span
                      className="absolute -top-2 -right-2 rounded-full text-[11px] font-bold flex items-center justify-center"
                      style={{ background: C.accent, color: "#fff", width: 22, height: 22 }}
                    >
                      {fmt(Number(enCarrito.cantidad) || 0)}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </>
      )}

      {lineasCarrito.length > 0 && (
        <Card className="mb-4">
          <div className="text-[12.5px] font-semibold mb-2">Carrito</div>
          <div className="space-y-1.5 mb-3">
            {lineasCarrito.map((l) => (
              <div key={l.productoId} className="flex items-center justify-between text-[12.5px]">
                <span className="flex-1">{l.producto.nombre}</span>
                <div className="flex items-center gap-1.5">
                  <button onClick={() => cambiarCantidad(l.productoId, -1)} className="rounded-md p-1" style={{ border: `1px solid ${C.line}` }}>
                    <Minus size={12} />
                  </button>
                  <input
                    type="number"
                    inputMode="decimal"
                    step="any"
                    min="0"
                    value={l.cantidad}
                    onChange={(e) => fijarCantidad(l.productoId, e.target.value)}
                    onBlur={() => normalizarCantidad(l.productoId)}
                    onFocus={(e) => e.target.select()}
                    className="mono text-center rounded-md py-1"
                    style={{ width: 54, border: `1px solid ${C.line}`, background: C.surface, color: C.ink, fontSize: 13 }}
                  />
                  <button onClick={() => cambiarCantidad(l.productoId, 1)} className="rounded-md p-1" style={{ border: `1px solid ${C.line}` }}>
                    <Plus size={12} />
                  </button>
                  <span className="mono font-semibold w-16 text-right">€{fmt(l.subtotal)}</span>
                  <button onClick={() => quitar(l.productoId)}><X size={14} color={C.inkSoft} /></button>
                </div>
              </div>
            ))}
          </div>

          {faltaStock.length > 0 && (
            <div className="text-[11px] mb-2" style={{ color: C.red }}>
              Vas a dejar en negativo: {faltaStock.map((l) => l.producto.nombre).join(", ")}.
            </div>
          )}

          <div className="flex items-center justify-between pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
            <span className="font-semibold">Total</span>
            <span className="mono font-bold text-[19px]" style={{ color: C.accent }}>€{fmt(total)}</span>
          </div>
        </Card>
      )}

      {lineasCarrito.length > 0 && (
        <Btn onClick={abrirCobro}>Cobrar €{fmt(total)}</Btn>
      )}

      {showCobro && (
        <Modal onClose={() => setShowCobro(false)} title="Cobrar">
          <div className="text-center mb-4">
            <div className="text-[12px]" style={{ color: C.inkSoft }}>Total</div>
            <div className="text-[28px] font-bold mono" style={{ color: C.accent }}>€{fmt(total)}</div>
          </div>
          <Field label="Medio de pago">
            <select value={medioPago} onChange={(e) => setMedioPago(e.target.value)} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
              <option>Efectivo</option>
              <option>Tarjeta</option>
              <option>Mixto</option>
              <option>Transferencia</option>
              <option>Otro</option>
            </select>
          </Field>
          {medioPago === "Efectivo" && (
            <>
              <Field label="Efectivo entregado por el cliente (€)">
                <Input type="number" step="0.01" value={efectivoRecibido} onChange={(e) => setEfectivoRecibido(e.target.value)} autoFocus />
              </Field>
              {cambio !== null && (
                <div className="text-[13px] mb-3" style={{ color: cambio < 0 ? C.red : C.accent }}>
                  {cambio < 0 ? `Faltan €${fmt(Math.abs(cambio))}` : `Cambio a devolver: €${fmt(cambio)}`}
                </div>
              )}
            </>
          )}
          {medioPago === "Mixto" && (
            <>
              <Field label="Paga con tarjeta (€)">
                <Input type="number" step="0.01" min="0" max={total} value={importeTarjetaMixto} onChange={(e) => setImporteTarjetaMixto(e.target.value)} autoFocus />
              </Field>
              <div className="text-[12.5px] mb-3" style={{ color: C.inkSoft }}>
                Resto en efectivo: <b className="mono" style={{ color: C.ink }}>€{fmt(restoEfectivoMixto)}</b>
              </div>
              {restoEfectivoMixto > 0 && (
                <>
                  <Field label="Efectivo entregado por el cliente (€)">
                    <Input type="number" step="0.01" value={efectivoRecibido} onChange={(e) => setEfectivoRecibido(e.target.value)} />
                  </Field>
                  {cambio !== null && (
                    <div className="text-[13px] mb-3" style={{ color: cambio < 0 ? C.red : C.accent }}>
                      {cambio < 0 ? `Faltan €${fmt(Math.abs(cambio))}` : `Cambio a devolver: €${fmt(cambio)}`}
                    </div>
                  )}
                </>
              )}
            </>
          )}
          {errorVenta && (
            <div className="text-[12.5px] mb-3 p-2 rounded-lg" style={{ background: "#FCE8E6", color: C.red }}>
              ⚠ {errorVenta}
            </div>
          )}
          <div className="flex gap-2">
            <Btn
              onClick={confirmarCobro}
              disabled={
                enviandoVenta ||
                (medioPago === "Efectivo" && cambio !== null && cambio < 0) ||
                (medioPago === "Mixto" && (Number(importeTarjetaMixto) < 0 || Number(importeTarjetaMixto) > total || (restoEfectivoMixto > 0 && cambio !== null && cambio < 0)))
              }
            >
              {enviandoVenta ? "Cobrando…" : "Confirmar venta"}
            </Btn>
            <Btn variant="ghost" onClick={() => setShowCobro(false)} disabled={enviandoVenta}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {confirmacion && (
        <Modal onClose={() => setConfirmacion(null)} title="Venta registrada">
          <div className="text-[13px] mb-2">
            €{fmt(confirmacion.total)} · {confirmacion.medioPago} · {confirmacion.n} línea(s)
          </div>
          {confirmacion.detallePago && (
            <div className="text-[12.5px] mb-2" style={{ color: C.inkSoft }}>
              Tarjeta €{fmt(confirmacion.detallePago.tarjeta)} + Efectivo €{fmt(confirmacion.detallePago.efectivo)}
            </div>
          )}
          {confirmacion.cambio > 0 && (
            <div className="text-[13px] mb-3" style={{ color: C.accent }}>Entrega €{fmt(confirmacion.cambio)} de cambio.</div>
          )}
          <div className="text-[11.5px] mb-3" style={{ color: C.inkSoft }}>
            Ya se ha descontado el stock y entra en Resultados. Recuerda: esto no sustituye el tique que le des al cliente.
          </div>
          <Btn onClick={() => setConfirmacion(null)}>Aceptar</Btn>
        </Modal>
      )}
    </div>
  );
}

/* ================= TRASPASOS ================= */
function Traspasos({ productos, traspasos, traspasarStock, pisoVentaBajo, fichasCosto = [] }) {
  const [verTodos, setVerTodos] = useState(false);

  // Qué productos tiene sentido mover al mostrador. Se incluye cualquiera que
  // cumpla al menos una condición, no solo el tipo "elaborado": así un producto
  // que sale de producción o que ya tiene precio de venta aparece aunque su
  // ficha esté a medio rellenar. Y si aun así falta alguno, el enlace de abajo
  // permite ver todos, para no dejar a nadie atascado.
  const vendibles = useMemo(() => {
    if (verTodos) return productos;
    const idsDeFichas = new Set(fichasCosto.map((f) => f.productoVinculadoId).filter(Boolean));
    return productos.filter(
      (p) =>
        p.tipo === "elaborado" ||
        Number(p.precioVenta) > 0 ||
        idsDeFichas.has(p.id) ||
        Number(p.stockPisoVenta) > 0
    );
  }, [productos, fichasCosto, verTodos]);

  const [productoId, setProductoId] = useState(vendibles[0]?.id || "");
  const [cantidad, setCantidad] = useState("");
  const [direccion, setDireccion] = useState("a_piso");
  const [error, setError] = useState("");
  const [ok, setOk] = useState("");

  // Si el producto elegido ya no está en la lista (o nunca llegó a elegirse
  // porque al abrir la pantalla todavía no había ninguno), se selecciona el
  // primero. Sin esto, el desplegable enseña un producto pero por dentro
  // está vacío, y al traspasar decía "producto no encontrado".
  useEffect(() => {
    if (vendibles.length > 0 && !vendibles.some((p) => p.id === productoId)) {
      setProductoId(vendibles[0].id);
    }
  }, [vendibles, productoId]);

  const producto = productos.find((p) => p.id === productoId);
  const enPiso = producto ? Number(producto.stockPisoVenta) || 0 : 0;
  const enAlmacen = producto ? (Number(producto.stock) || 0) - enPiso : 0;

  function submit() {
    const res = traspasarStock(productoId, cantidad, direccion);
    if (!res.ok) {
      setError(res.error);
      setOk("");
      return;
    }
    setError("");
    setOk(`Traspasado ${fmt(Number(cantidad))} ${producto.unidad} ${direccion === "a_piso" ? "al piso de venta" : "al almacén"}.`);
    setCantidad("");
    setTimeout(() => setOk(""), 3000);
  }

  return (
    <div>
      <SectionTitle>Traspasos</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Mueve stock entre el almacén de atrás y el piso de venta. Esto no cambia cuánto tienes en total —
          solo dónde está. Lo que llega por albarán o sale de producción entra al almacén; desde aquí lo pasas
          al mostrador cuando lo repones.
        </div>
      </Card>

      {pisoVentaBajo.length > 0 && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12.5px] font-semibold mb-2">Bajo mínimo en el piso de venta</div>
          <div className="space-y-1">
            {pisoVentaBajo.map((p) => (
              <div key={p.id} className="flex items-center justify-between text-[12px]">
                <span>{p.nombre}</span>
                <span className="mono">{fmt(p.stockPisoVenta || 0)} / mín. {fmt(p.stockMinimoPisoVenta)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {vendibles.length === 0 ? (
        <Empty text="Todavía no tienes productos de venta. Márcalos como 'Elaborado' o ponles precio en Productos." />
      ) : (
        <Card className="mb-4">
          <Field label="Producto">
            <select
              value={productoId}
              onChange={(e) => { setProductoId(e.target.value); setError(""); setOk(""); }}
              className="w-full rounded-lg px-3 py-2 text-[13px]"
              style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}
            >
              {vendibles.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
            </select>
          </Field>

          <button
            type="button"
            onClick={() => setVerTodos((s) => !s)}
            className="text-[11.5px] font-medium mb-3"
            style={{ color: C.accent }}
          >
            {verTodos ? "Ver solo los productos de venta" : "No encuentro el producto, ver todos"}
          </button>

          {producto && (
            <div className="grid grid-cols-2 gap-3 mb-3">
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>En almacén</div>
                <div className="text-xl font-semibold mono">{fmt(enAlmacen)} {producto.unidad}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>En piso de venta</div>
                <div className="text-xl font-semibold mono">{fmt(enPiso)} {producto.unidad}</div>
              </div>
            </div>
          )}

          <Field label="Dirección">
            <select
              value={direccion}
              onChange={(e) => setDireccion(e.target.value)}
              className="w-full rounded-lg px-3 py-2 text-[13px]"
              style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}
            >
              <option value="a_piso">Almacén → Piso de venta</option>
              <option value="a_almacen">Piso de venta → Almacén</option>
            </select>
          </Field>

          <Field label="Cantidad">
            <Input type="number" step="0.01" value={cantidad} onChange={(e) => setCantidad(e.target.value)} />
          </Field>

          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          {ok && <div className="text-[12px] mb-2" style={{ color: C.accent }}>{ok}</div>}

          <Btn onClick={submit}>Traspasar</Btn>
        </Card>
      )}

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Historial de traspasos</div>
      {traspasos.length === 0 ? <Empty text="Todavía no has hecho ningún traspaso." /> : (
        <div className="space-y-1.5">
          {traspasos.slice(0, 50).map((t) => (
            <Card key={t.id}>
              <div className="flex items-center justify-between text-[12.5px]">
                <span>{t.nombre}</span>
                <span className="mono" style={{ color: t.direccion === "a_piso" ? C.accent : C.inkSoft }}>
                  {t.direccion === "a_piso" ? "→ Piso" : "→ Almacén"} · {fmt(t.cantidad)}
                </span>
              </div>
              <div className="text-[11px] mt-0.5" style={{ color: C.inkSoft }}>{t.fecha} {t.hora}</div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= TESORERÍA ================= */
function Tesoreria({ proyeccionTesoreria, promedioDiarioVentas }) {
  const [saldoActual, setSaldoActual] = useState("");

  const saldoInicial = Number(saldoActual) || 0;
  let acumulado = saldoInicial;
  const filas = proyeccionTesoreria.map((d) => {
    acumulado += d.netoDia;
    return { ...d, saldoProyectado: acumulado };
  });

  const primerNegativo = filas.find((f) => f.saldoProyectado < 0);
  const totalPagos30d = proyeccionTesoreria.reduce((a, d) => a + d.pagosDia, 0);
  const totalIngresos30d = proyeccionTesoreria.reduce((a, d) => a + d.ingresosDia, 0);

  return (
    <div>
      <SectionTitle>Tesorería</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Proyección a 30 días. Los pagos son reales (facturas con vencimiento conocido) y los encargos con fecha de
          entrega fijada también. La venta del día a día se estima con tu promedio de los últimos 30 días
          (€{fmt(promedioDiarioVentas)}/día) — es una estimación, no una promesa, y mejora cuantas más ventas registres.
        </div>
      </Card>

      <Card className="mb-4">
        <Field label="Saldo disponible hoy (caja + banco)">
          <Input type="number" step="0.01" value={saldoActual} onChange={(e) => setSaldoActual(e.target.value)} placeholder="Lo que tienes ahora mismo" />
        </Field>
        <div className="text-[11px]" style={{ color: C.inkSoft }}>
          El programa no sabe tu saldo bancario — lo pones tú aquí para poder proyectar hacia delante.
        </div>
      </Card>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Ingresos previstos (30 días)</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: C.accent }}>€{fmt(totalIngresos30d)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Pagos comprometidos (30 días)</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(totalPagos30d)}</div>
        </Card>
      </div>

      {saldoActual !== "" && primerNegativo && (
        <Card className="mb-4" style={{ background: C.redSoft, border: "none" }}>
          <div className="text-[12.5px] font-semibold">
            Posible falta de caja el {new Date(primerNegativo.fecha).toLocaleDateString("es-ES")}
          </div>
          <div className="text-[12px] mt-1" style={{ color: C.inkSoft }}>
            Al ritmo actual, ese día el saldo proyectado bajaría de cero. Revisa si puedes retrasar algún pago o
            adelantar algún cobro antes de esa fecha.
          </div>
        </Card>
      )}

      {saldoActual === "" ? (
        <Empty text="Pon tu saldo actual arriba para ver la proyección día a día." />
      ) : (
        <div className="space-y-1">
          {filas.map((f) => (
            <Card key={f.fecha} style={{ padding: "0.6rem 1rem" }}>
              <div className="flex items-center justify-between text-[12.5px]">
                <span>{new Date(f.fecha).toLocaleDateString("es-ES", { weekday: "short", day: "2-digit", month: "2-digit" })}</span>
                <div className="flex items-center gap-3">
                  {f.pagosDia > 0 && <span className="mono text-[11.5px]" style={{ color: C.red }}>−€{fmt(f.pagosDia)}</span>}
                  <span className="mono font-semibold" style={{ color: f.saldoProyectado < 0 ? C.red : C.ink }}>
                    €{fmt(f.saldoProyectado)}
                  </span>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= ESTACIONALIDAD ================= */
const MESES_NOMBRE = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

function Estacionalidad({ ingresosPorMes }) {
  const hoy = new Date();
  const filas = [];
  for (let i = 0; i < 12; i++) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const key = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const keyAnterior = `${d.getFullYear() - 1}-${String(d.getMonth() + 1).padStart(2, "0")}`;
    const actual = ingresosPorMes[key] || 0;
    const anterior = ingresosPorMes[keyAnterior];
    const variacion = anterior ? ((actual - anterior) / anterior) * 100 : null;
    filas.push({
      key,
      etiqueta: `${MESES_NOMBRE[d.getMonth()]} ${d.getFullYear()}`,
      actual,
      anterior: anterior ?? null,
      variacion,
    });
  }
  filas.reverse();

  const hayComparacion = filas.some((f) => f.anterior !== null);
  const mesesConDatos = filas.filter((f) => f.actual > 0).length;

  return (
    <div>
      <SectionTitle>Estacionalidad</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Compara cada mes contra el mismo mes del año anterior — para ver si San Valentín, Navidad o el verano
          se comportan distinto de un año a otro, en vez de comparar solo contra el mes justo antes.
        </div>
      </Card>

      {!hayComparacion && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12.5px]">
            Todavía no tienes un año completo de ventas registradas, así que no hay ningún mes con el que comparar.
            En cuanto pase un año desde que empezaste a registrar ventas, aquí aparecerá la comparación real.
            {mesesConDatos > 0 && ` Por ahora tienes ${mesesConDatos} mes(es) con datos.`}
          </div>
        </Card>
      )}

      <div className="space-y-1.5">
        {filas.map((f) => (
          <Card key={f.key}>
            <div className="flex items-center justify-between">
              <span className="text-[13px] font-medium capitalize">{f.etiqueta}</span>
              <div className="text-right">
                <div className="mono font-semibold">€{fmt(f.actual)}</div>
                {f.anterior !== null ? (
                  <div className="text-[11px] mono" style={{ color: f.variacion >= 0 ? C.accent : C.red }}>
                    {f.variacion >= 0 ? "+" : ""}{fmt(f.variacion)}% vs. €{fmt(f.anterior)} el año pasado
                  </div>
                ) : (
                  <div className="text-[11px]" style={{ color: C.inkSoft }}>Sin dato del año anterior</div>
                )}
              </div>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
}

/* ================= COSTE DE PERSONAL ================= */
function CostePersonal({ empleados, nominas, addNomina, deleteNomina, fichajes, movimientos }) {
  const mesActual = new Date().toISOString().slice(0, 7);
  const [mes, setMes] = useState(mesActual);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ empleadoId: "", mes: mesActual, brutoTotal: "", seguridadSocialEmpresa: "", notas: "" });
  const [error, setError] = useState("");

  const activos = empleados.filter((e) => e.activo !== false);
  const nominasDelMes = nominas.filter((n) => n.mes === mes);
  const costeTotalMes = nominasDelMes.reduce((a, n) => a + (Number(n.costeTotalEmpresa) || 0), 0);

  // Ingresos reales del mismo mes, para saber qué porcentaje de lo que
  // entra se va en personal — el dato que de verdad importa en hostelería.
  const ingresosDelMes = movimientos
    .filter((m) => m.tipo === "salida" && m.motivo === "Venta" && (m.fecha || "").slice(0, 7) === mes)
    .reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0), 0);
  const porcentajeSobreVentas = ingresosDelMes > 0 ? (costeTotalMes / ingresosDelMes) * 100 : null;

  // Horas trabajadas de ese mes según los fichajes, para el coste por hora real.
  function horasDelEmpleadoEnMes(empleadoId) {
    const delMes = fichajes
      .filter((f) => f.empleadoId === empleadoId && (f.fecha || "").slice(0, 7) === mes)
      .sort((a, b) => (a.timestamp || "").localeCompare(b.timestamp || ""));
    let total = 0;
    let entrada = null;
    delMes.forEach((f) => {
      if (f.tipo === "entrada") entrada = f;
      else if (f.tipo === "salida" && entrada) {
        const ini = new Date(`${entrada.fecha}T${entrada.hora}:00`);
        const fin = new Date(`${f.fecha}T${f.hora}:00`);
        const horas = (fin - ini) / 3600000;
        if (horas > 0 && horas < 24) total += horas;
        entrada = null;
      }
    });
    return total;
  }

  const filas = nominasDelMes
    .map((n) => {
      const emp = empleados.find((e) => e.id === n.empleadoId);
      const horas = horasDelEmpleadoEnMes(n.empleadoId);
      const costePorHora = horas > 0 ? (Number(n.costeTotalEmpresa) || 0) / horas : null;
      return { ...n, empleado: emp, horas, costePorHora };
    })
    .sort((a, b) => (b.costeTotalEmpresa || 0) - (a.costeTotalEmpresa || 0));

  function submit() {
    if (!form.empleadoId) { setError("Elige de qué empleado es la nómina."); return; }
    if (!(Number(form.brutoTotal) > 0)) { setError("Pon el bruto total del mes."); return; }
    setError("");
    addNomina(form);
    setForm({ empleadoId: "", mes, brutoTotal: "", seguridadSocialEmpresa: "", notas: "" });
    setShowForm(false);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { setForm({ ...form, mes }); setShowForm((s) => !s); }}><Plus size={15} /> Registrar nómina</Btn>}>
        Coste de personal
      </SectionTitle>

      <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
        <div className="text-[12.5px]">
          <b>Esto no calcula nóminas</b> — eso lo hace tu gestoría, que es quien tiene la autorización ante la
          Seguridad Social y responde legalmente. Aquí solo apuntas lo que la gestoría ya te ha pasado, para
          cruzarlo con tus ventas reales y saber cuánto te cuesta de verdad el personal, en vez de una estimación.
        </div>
      </Card>

      <Card className="mb-4">
        <Field label="Mes que estás viendo">
          <Input type="month" value={mes} onChange={(e) => setMes(e.target.value)} />
        </Field>
      </Card>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">Registrar nómina del mes</div>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Empleado">
              <select value={form.empleadoId} onChange={(e) => setForm({ ...form, empleadoId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                <option value="">— Elige un empleado —</option>
                {activos.map((e) => <option key={e.id} value={e.id}>{e.nombre}</option>)}
              </select>
            </Field>
            <Field label="Mes">
              <Input type="month" value={form.mes} onChange={(e) => setForm({ ...form, mes: e.target.value })} />
            </Field>
            <Field label="Bruto del mes (€)">
              <Input type="number" step="0.01" value={form.brutoTotal} onChange={(e) => setForm({ ...form, brutoTotal: e.target.value })} placeholder="Lo que pone la nómina" />
            </Field>
            <Field label="Seguridad Social a cargo de la empresa (€)">
              <Input type="number" step="0.01" value={form.seguridadSocialEmpresa} onChange={(e) => setForm({ ...form, seguridadSocialEmpresa: e.target.value })} placeholder="Del boletín de cotización" />
            </Field>
            <Field label="Notas (opcional)">
              <Input value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} placeholder="Incluye paga extra, finiquito…" />
            </Field>
          </div>
          {Number(form.brutoTotal) > 0 && (
            <div className="text-[12px] mb-2" style={{ color: C.inkSoft }}>
              Coste total para la empresa: <b className="mono">€{fmt(Number(form.brutoTotal) + (Number(form.seguridadSocialEmpresa) || 0))}</b>
            </div>
          )}
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setShowForm(false)}>Cancelar</Btn>
          </div>
        </Card>
      )}

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Coste total del mes</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(costeTotalMes)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>% sobre ventas del mes</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: porcentajeSobreVentas === null ? C.inkSoft : porcentajeSobreVentas > 35 ? C.red : porcentajeSobreVentas > 30 ? C.amber : C.accent }}>
            {porcentajeSobreVentas === null ? "—" : `${fmt(porcentajeSobreVentas)}%`}
          </div>
          {porcentajeSobreVentas !== null && (
            <div className="text-[10.5px] mt-0.5" style={{ color: C.inkSoft }}>
              sobre €{fmt(ingresosDelMes)} vendidos
            </div>
          )}
        </Card>
      </div>

      {porcentajeSobreVentas !== null && porcentajeSobreVentas > 35 && (
        <Card className="mb-4" style={{ background: C.redSoft, border: "none" }}>
          <div className="text-[12.5px]">
            El personal se está llevando más del 35% de lo que vendes. En hostelería suele considerarse una señal
            de alerta — puede ser un mes flojo de ventas, o que haga falta revisar turnos o plantilla.
          </div>
        </Card>
      )}

      {filas.length === 0 ? (
        <Empty text={`No has registrado nóminas de ${mes} todavía.`} />
      ) : (
        <div className="space-y-2">
          {filas.map((n) => (
            <Card key={n.id}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-[13px] font-medium">{n.empleado ? n.empleado.nombre : "Empleado eliminado"}</div>
                  <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                    Bruto €{fmt(n.brutoTotal)} + SS empresa €{fmt(n.seguridadSocialEmpresa)}
                  </div>
                  {n.notas && <div className="text-[11px] mt-0.5" style={{ color: C.inkSoft }}>{n.notas}</div>}
                </div>
                <div className="text-right">
                  <div className="mono font-semibold">€{fmt(n.costeTotalEmpresa)}</div>
                  {n.costePorHora !== null && (
                    <div className="text-[11px] mono" style={{ color: C.inkSoft }}>
                      €{fmt(n.costePorHora)}/h · {fmt(n.horas)} h fichadas
                    </div>
                  )}
                </div>
              </div>
              <div className="mt-2">
                <Btn small variant="ghost" onClick={() => deleteNomina(n.id)}><Trash2 size={13} /> Eliminar</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}
/* ================= HISTORIAL DE PRODUCTO ================= */
// Reúne en un solo sitio todo lo que le ha pasado a un producto — hasta
// ahora esto estaba repartido entre Movimientos, Pedidos, Albaranes y
// Traspasos, y para verlo completo había que ir saltando de pantalla en
// pantalla. Cada apartado se queda separado (en vez de mezclarlo todo en
// una sola lista) porque un mismo hecho puede aparecer en más de un sitio
// con matices distintos — por ejemplo, un albarán confirmado también deja
// su propio movimiento de entrada; verlos por separado evita que parezca
// un duplicado cuando en realidad cada uno cuenta algo distinto (el papel
// del proveedor, o el asiento real de stock).
function HistorialProducto({ productos, movimientos, pedidos, albaranes, traspasos, proveedorPorId }) {
  const [busqueda, setBusqueda] = useState("");
  const [productoId, setProductoId] = useState("");
  const [seccion, setSeccion] = useState("movimientos");

  const coincidencias = useMemo(() => {
    const q = busqueda.trim().toLowerCase();
    if (!q) return [];
    return productos.filter((p) => p.nombre.toLowerCase().includes(q) || (p.codigoBarras || "").toLowerCase().includes(q)).slice(0, 8);
  }, [productos, busqueda]);

  const producto = productos.find((p) => p.id === productoId);

  const movimientosDelProducto = useMemo(() => {
    if (!producto) return [];
    return movimientos.filter((m) => m.productoId === producto.id).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  }, [movimientos, producto]);

  const pedidosDelProducto = useMemo(() => {
    if (!producto) return [];
    return pedidos
      .filter((pe) => (pe.items || []).some((it) => it.productoId === producto.id))
      .map((pe) => ({ pedido: pe, item: pe.items.find((it) => it.productoId === producto.id) }))
      .sort((a, b) => (b.pedido.fecha || "").localeCompare(a.pedido.fecha || ""));
  }, [pedidos, producto]);

  const comprasDelProducto = useMemo(() => {
    if (!producto) return [];
    return albaranes
      .filter((a) => a.estado === "confirmado" && (a.lineas || []).some((ln) => ln.productoId === producto.id))
      .map((a) => {
        const ln = a.lineas.find((x) => x.productoId === producto.id);
        const unidades = Number(ln.unidadesEntradas) || 0;
        const importe = Number(ln.importe) || 0;
        return { albaran: a, linea: ln, unidades, precioUnitario: unidades > 0 ? importe / unidades : 0 };
      })
      .sort((a, b) => (b.albaran.fecha || "").localeCompare(a.albaran.fecha || ""));
  }, [albaranes, producto]);

  const traspasosDelProducto = useMemo(() => {
    if (!producto) return [];
    return traspasos.filter((t) => t.productoId === producto.id).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  }, [traspasos, producto]);

  const SECCIONES = [
    { id: "movimientos", label: "Movimientos", n: movimientosDelProducto.length },
    { id: "pedidos", label: "Pedidos", n: pedidosDelProducto.length },
    { id: "compras", label: "Compras", n: comprasDelProducto.length },
    { id: "traspasos", label: "Traspasos", n: traspasosDelProducto.length },
  ];

  return (
    <div>
      <SectionTitle>Historial de producto</SectionTitle>

      <Card className="mb-4">
        <Field label="Busca un producto por nombre o código de barras">
          <Input
            value={busqueda}
            onChange={(e) => { setBusqueda(e.target.value); setProductoId(""); }}
            placeholder="Ej. Harina, Bombón surtido…"
            autoFocus
          />
        </Field>
        {busqueda && !producto && (
          <div className="space-y-1 mt-1">
            {coincidencias.length === 0 ? (
              <div className="text-[12.5px]" style={{ color: C.inkSoft }}>Sin resultados.</div>
            ) : (
              coincidencias.map((p) => (
                <button
                  key={p.id}
                  onClick={() => { setProductoId(p.id); setBusqueda(p.nombre); }}
                  className="w-full text-left px-3 py-2 rounded-lg text-[13px]"
                  style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}
                >
                  {p.nombre} <span style={{ color: C.inkSoft }}>· {p.unidad}</span>
                </button>
              ))
            )}
          </div>
        )}
      </Card>

      {!producto ? (
        <Empty text="Busca y elige un producto para ver todo su historial." />
      ) : (
        <>
          <Card className="mb-4">
            <div className="flex items-start justify-between mb-2">
              <div>
                <div className="font-semibold text-[15px]">{producto.nombre}</div>
                <div className="text-[11.5px]" style={{ color: C.inkSoft }}>{producto.categoria || "Sin categoría"} · {producto.unidad}</div>
              </div>
              <button onClick={() => { setProductoId(""); setBusqueda(""); }}><X size={16} color={C.inkSoft} /></button>
            </div>
            <div className="grid grid-cols-2 gap-3 mt-2">
              <div>
                <div className="text-[10.5px]" style={{ color: C.inkSoft }}>Stock total</div>
                <div className="mono font-semibold">{fmt(producto.stock)} {producto.unidad}</div>
              </div>
              <div>
                <div className="text-[10.5px]" style={{ color: C.inkSoft }}>En piso de venta</div>
                <div className="mono font-semibold">{fmt(producto.stockPisoVenta || 0)} {producto.unidad}</div>
              </div>
              <div>
                <div className="text-[10.5px]" style={{ color: C.inkSoft }}>Costo</div>
                <div className="mono font-semibold">€{fmt(producto.costo)}</div>
              </div>
              <div>
                <div className="text-[10.5px]" style={{ color: C.inkSoft }}>Precio de venta</div>
                <div className="mono font-semibold">{producto.precioVenta ? `€${fmt(producto.precioVenta)}` : "—"}</div>
              </div>
            </div>
          </Card>

          <div className="flex gap-2 mb-3 overflow-x-auto">
            {SECCIONES.map((s) => (
              <button
                key={s.id}
                onClick={() => setSeccion(s.id)}
                className="text-[12px] font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
                style={{
                  background: seccion === s.id ? C.accent : C.surface,
                  color: seccion === s.id ? "#fff" : C.inkSoft,
                  border: `1px solid ${seccion === s.id ? C.accent : C.line}`,
                }}
              >
                {s.label} ({s.n})
              </button>
            ))}
          </div>

          {seccion === "movimientos" && (
            movimientosDelProducto.length === 0 ? <Empty text="Sin movimientos registrados para este producto." /> : (
              <div className="space-y-1.5">
                {movimientosDelProducto.map((m) => {
                  // El signo a mostrar depende del EFECTO real sobre el stock, no
                  // solo del tipo: una entrada siempre suma, una salida siempre
                  // resta, pero un ajuste (por ejemplo, de un conteo) puede sumar
                  // O restar según lo que se contó — su cantidad ya viene con el
                  // signo correcto guardado, así que no hay que forzar uno encima.
                  const cantidadNum = Number(m.cantidad) || 0;
                  const efecto = m.tipo === "salida" ? -Math.abs(cantidadNum) : cantidadNum;
                  const esPositivo = efecto >= 0;
                  return (
                    <Card key={m.id}>
                      <div className="flex items-center justify-between">
                        <div>
                          <div className="text-[12.5px]">
                            <b style={{ color: esPositivo ? C.accent : C.red }}>
                              {esPositivo ? "+" : "−"}{fmt(Math.abs(efecto))}
                            </b>
                            {" "}{m.motivo || m.referencia || "—"}
                            {m.tipo === "ajuste" && <span className="ml-1 text-[10.5px]" style={{ color: C.inkSoft }}>(ajuste de inventario)</span>}
                          </div>
                          <div className="text-[10.5px]" style={{ color: C.inkSoft }}>{m.fecha}</div>
                        </div>
                        {(m.costoUnitario || m.ingresoUnitario) && (
                          <span className="mono text-[11.5px]" style={{ color: C.inkSoft }}>
                            €{fmt(m.tipo === "entrada" ? m.costoUnitario : m.ingresoUnitario)}/{producto.unidad}
                          </span>
                        )}
                      </div>
                    </Card>
                  );
                })}
              </div>
            )
          )}

          {seccion === "pedidos" && (
            pedidosDelProducto.length === 0 ? <Empty text="Este producto no está en ningún pedido a proveedor." /> : (
              <div className="space-y-1.5">
                {pedidosDelProducto.map(({ pedido, item }) => (
                  <Card key={pedido.id}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[12.5px] font-medium">{(proveedorPorId(pedido.proveedorId) || {}).nombre || "Proveedor eliminado"}</span>
                      <Pill color={pedido.estado === "Recibido" ? C.inkSoft : pedido.estado === "Parcial" ? C.amber : C.accent}>{pedido.estado}</Pill>
                    </div>
                    <div className="text-[12px]" style={{ color: C.inkSoft }}>
                      {pedido.fecha} · pedidas {fmt(item.cantidad)} {producto.unidad} · recibidas {fmt(item.cantidadRecibida || 0)}
                    </div>
                  </Card>
                ))}
              </div>
            )
          )}

          {seccion === "compras" && (
            comprasDelProducto.length === 0 ? <Empty text="Sin compras confirmadas de este producto." /> : (
              <div className="space-y-1.5">
                {comprasDelProducto.map(({ albaran, linea, unidades, precioUnitario }) => (
                  <Card key={albaran.id}>
                    <div className="flex items-center justify-between mb-1">
                      <span className="text-[12.5px] font-medium">{(proveedorPorId(albaran.proveedorId) || {}).nombre || "Proveedor eliminado"}</span>
                      <span className="text-[11px]" style={{ color: C.inkSoft }}>Albarán {albaran.numero || "s/n"}</span>
                    </div>
                    <div className="text-[12px]" style={{ color: C.inkSoft }}>
                      {albaran.fecha} · {fmt(unidades)} {producto.unidad} a €{fmt(precioUnitario)}/{producto.unidad}
                      {linea.lote && ` · lote ${linea.lote}`}
                      {linea.caducidad && ` · caduca ${linea.caducidad}`}
                    </div>
                  </Card>
                ))}
              </div>
            )
          )}

          {seccion === "traspasos" && (
            traspasosDelProducto.length === 0 ? <Empty text="Sin traspasos entre almacén y piso de venta para este producto." /> : (
              <div className="space-y-1.5">
                {traspasosDelProducto.map((t) => (
                  <Card key={t.id}>
                    <div className="flex items-center justify-between">
                      <span className="text-[12.5px]">
                        {t.direccion === "a_piso" ? "Almacén → Piso de venta" : "Piso de venta → Almacén"}
                      </span>
                      <span className="mono text-[12.5px] font-semibold">{fmt(t.cantidad)} {producto.unidad}</span>
                    </div>
                    <div className="text-[10.5px]" style={{ color: C.inkSoft }}>{t.fecha} {t.hora}</div>
                  </Card>
                ))}
              </div>
            )
          )}
        </>
      )}
    </div>
  );
}
/* ================= BÚSQUEDA GLOBAL ================= */
// Un solo cuadro de búsqueda que mira en las colecciones que más se buscan
// a mano hoy — productos, proveedores, clientes, fichas de costo y
// empleados — y lleva directo a la pantalla correcta. Con 37 pantallas ya,
// recordar "¿esto estaba en Proveedores o en Compras?" cuesta más de lo
// que debería.
function BusquedaGlobal({ productos, proveedores, clientes, fichasCosto, empleados, setTab }) {
  const [q, setQ] = useState("");

  const resultados = useMemo(() => {
    const texto = q.trim().toLowerCase();
    if (texto.length < 2) return null; // evita listas enormes con una sola letra
    return {
      productos: productos.filter((p) => p.nombre.toLowerCase().includes(texto) || (p.codigoBarras || "").toLowerCase().includes(texto)).slice(0, 8),
      proveedores: proveedores.filter((p) => p.nombre.toLowerCase().includes(texto)).slice(0, 8),
      clientes: clientes.filter((c) => c.nombre.toLowerCase().includes(texto)).slice(0, 8),
      fichasCosto: fichasCosto.filter((f) => f.nombre.toLowerCase().includes(texto)).slice(0, 8),
      empleados: empleados.filter((e) => e.nombre.toLowerCase().includes(texto)).slice(0, 8),
    };
  }, [q, productos, proveedores, clientes, fichasCosto, empleados]);

  const totalResultados = resultados
    ? Object.values(resultados).reduce((a, lista) => a + lista.length, 0)
    : 0;

  const GRUPOS = [
    { clave: "productos", titulo: "Productos", tab: "productos", icon: Package },
    { clave: "proveedores", titulo: "Proveedores", tab: "proveedores", icon: Truck },
    { clave: "clientes", titulo: "Clientes", tab: "clientes", icon: Users },
    { clave: "fichasCosto", titulo: "Fichas de costo", tab: "fichas", icon: Calculator },
    { clave: "empleados", titulo: "Personal", tab: "personal", icon: UserRound },
  ];

  return (
    <div>
      <SectionTitle>Buscar en todo el programa</SectionTitle>

      <Card className="mb-4">
        <Input
          value={q}
          onChange={(e) => setQ(e.target.value)}
          placeholder="Escribe un nombre… (productos, proveedores, clientes, fichas, personal)"
          autoFocus
        />
      </Card>

      {q.trim().length > 0 && q.trim().length < 2 ? (
        <div className="text-[12.5px]" style={{ color: C.inkSoft }}>Sigue escribiendo, al menos 2 letras.</div>
      ) : resultados === null ? (
        <Empty text="Escribe algo para buscar en productos, proveedores, clientes, fichas de costo y personal." />
      ) : totalResultados === 0 ? (
        <Empty text={`Sin resultados para "${q}".`} />
      ) : (
        <div className="space-y-4">
          {GRUPOS.map((g) => {
            const lista = resultados[g.clave];
            if (!lista || lista.length === 0) return null;
            const Icono = g.icon;
            return (
              <div key={g.clave}>
                <div className="flex items-center gap-1.5 text-[12px] font-semibold mb-2" style={{ color: C.inkSoft }}>
                  <Icono size={14} /> {g.titulo} ({lista.length})
                </div>
                <div className="space-y-1.5">
                  {lista.map((item) => (
                    <button
                      key={item.id}
                      onClick={() => setTab(g.tab)}
                      className="w-full text-left flex items-center justify-between px-3 py-2.5 rounded-lg"
                      style={{ border: `1px solid ${C.line}`, background: C.surface }}
                    >
                      <span className="text-[13px]" style={{ color: C.ink }}>{item.nombre}</span>
                      <ChevronRight size={15} color={C.inkSoft} />
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}


/* ================= ARRANQUE: LOCAL O NUBE ================= */
/* El programa arranca SIEMPRE, haya nube o no. Si se puede llegar a la
   nube, se pide inicio de sesión para poder sincronizar entre dispositivos.
   Si no se puede (sin internet, servicio bloqueado en el país, o
   simplemente sin configurar), se entra directamente en modo local: los
   datos viven en este equipo y no se pierde nada. */
function AppConSesion() {
  const [fase, setFase] = useState("comprobando"); // comprobando | login | dentro
  const [cliente, setCliente] = useState(null);
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [cargando, setCargando] = useState(false);

  useEffect(() => {
    let activo = true;
    (async () => {
      const hayNube = await window.conectarNube();
      if (!activo) return;

      if (!hayNube) {
        // Sin nube: se entra directo, trabajando con los datos de este equipo.
        window.actualizarIndicador();
        setFase("dentro");
        return;
      }

      const supabase = window.__nubeCliente;
      setCliente(supabase);
      try {
        const { data } = await supabase.auth.getSession();
        if (!activo) return;
        if (data.session) {
          await window.subirPendientes();
          setFase("dentro");
        } else {
          setFase("login");
        }
        supabase.auth.onAuthStateChange(async (_evento, s) => {
          if (!activo) return;
          if (s) { await window.subirPendientes(); setFase("dentro"); }
          else setFase("login");
        });
      } catch (e) {
        // Si algo falla al comprobar la sesión, no dejamos a nadie fuera
        // de su propio programa: se entra en local.
        window.__nubeActiva = false;
        window.actualizarIndicador();
        setFase("dentro");
      }
    })();
    return () => { activo = false; };
  }, []);

  async function entrar(e) {
    e.preventDefault();
    if (!cliente) return;
    setError("");
    setCargando(true);
    const { error } = await cliente.auth.signInWithPassword({ email, password });
    setCargando(false);
    if (error) setError("Correo o contraseña incorrectos.");
  }

  function entrarSinNube() {
    window.__nubeActiva = false;
    window.actualizarIndicador();
    setFase("dentro");
  }

  const estiloBase = { minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", background: "#F7F3E9", fontFamily: "'IBM Plex Sans', ui-sans-serif, system-ui", padding: 20 };

  if (fase === "comprobando") {
    return <div style={{ ...estiloBase, color: "#6B7A6E", fontSize: 13.5 }}>Comprobando conexión…</div>;
  }

  if (fase === "login") {
    return (
      <div style={estiloBase}>
        <form onSubmit={entrar} style={{ background: "#fff", padding: 28, borderRadius: 14, width: "100%", maxWidth: 340, border: "1px solid #E2DBC7", boxShadow: "0 4px 20px rgba(23,36,28,0.06)" }}>
          <div style={{ fontSize: 18, fontWeight: 700, marginBottom: 4, color: "#17241C" }}>Chocoloyos</div>
          <div style={{ fontSize: 12.5, color: "#6B7A6E", marginBottom: 22 }}>Inicia sesión para sincronizar entre dispositivos</div>
          <input type="email" required autoFocus placeholder="Correo" value={email} onChange={(e) => setEmail(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", marginBottom: 10, border: "1px solid #E2DBC7", borderRadius: 8, fontSize: 14, boxSizing: "border-box", fontFamily: "inherit" }} />
          <input type="password" required placeholder="Contraseña" value={password} onChange={(e) => setPassword(e.target.value)}
            style={{ width: "100%", padding: "10px 12px", marginBottom: 16, border: "1px solid #E2DBC7", borderRadius: 8, fontSize: 14, boxSizing: "border-box", fontFamily: "inherit" }} />
          {error && <div style={{ color: "#B5473A", fontSize: 12.5, marginBottom: 12 }}>{error}</div>}
          <button type="submit" disabled={cargando} style={{ width: "100%", padding: "11px", background: "#8C6D2A", color: "#fff", border: "none", borderRadius: 8, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>
            {cargando ? "Entrando…" : "Entrar"}
          </button>
          <div onClick={entrarSinNube} style={{ marginTop: 16, textAlign: "center", fontSize: 12, color: "#6B7A6E", textDecoration: "underline", cursor: "pointer" }}>
            Trabajar solo en este equipo, sin sincronizar
          </div>
        </form>
      </div>
    );
  }

  return <GestionAlmacen />;
}

import { createRoot } from "react-dom/client";
createRoot(document.getElementById("root")).render(<AppConSesion />);
</script>

<script>
(function () {
  var VERSION = "96cd0b27e70f";
  var CLAVE = "almacen:compilado:" + VERSION;
  var paso = document.getElementById("paso");
  var di = function (t) { if (paso) paso.textContent = t; };

  function arranca(codigo) {
    try {
      var blob = new Blob([codigo], { type: "text/javascript" });
      var url = URL.createObjectURL(blob);
      import(url)
        .then(function () {
          var c = document.getElementById("cargando");
          if (c) c.remove();
        })
        .catch(function (e) {
          console.error("Fallo al arrancar:", e);
          // Si el codigo guardado esta corrupto, se descarta y se recompila
          try { localStorage.removeItem(CLAVE); } catch (x) {}
          di("Reintentando…");
          compila(true);
        });
    } catch (e) {
      console.error(e);
      di("Error al arrancar. Recarga la pagina.");
    }
  }

  function compila(sinCache) {
    di("Preparando el programa (solo la primera vez)…");
    var s = document.createElement("script");
    s.src = "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js";
    s.onload = function () {
      try {
        var fuente = document.getElementById("fuente").textContent;
        var salida = Babel.transform(fuente, {
          presets: [["react"]],
          sourceType: "module"
        }).code;
        try {
          // Se limpian versiones anteriores para no llenar el almacenamiento
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf("almacen:compilado:") === 0 && k !== CLAVE) localStorage.removeItem(k);
          }
          localStorage.setItem(CLAVE, salida);
        } catch (x) { /* si no cabe, seguimos sin cache */ }
        di("Cargando…");
        arranca(salida);
      } catch (e) {
        console.error("Error compilando:", e);
        di("Error en el programa. Mira la consola.");
      }
    };
    s.onerror = function () { di("No hay conexion para preparar el programa."); };
    document.head.appendChild(s);
  }

  var guardado = null;
  try { guardado = localStorage.getItem(CLAVE); } catch (e) {}

  if (guardado) {
    di("Cargando…");
    arranca(guardado);
  } else {
    compila(false);
  }
})();
</script>
