<script>
  /* ==========================================================
     ALMACENAMIENTO: PRIMERO LOCAL, NUBE OPCIONAL
     ----------------------------------------------------------
     El programa guarda SIEMPRE en el propio dispositivo. Así
     funciona sin internet y en cualquier país, sin depender de
     que un servicio extranjero esté accesible.

     Si además hay nube configurada y se puede llegar a ella, se
     sincroniza en segundo plano para poder trabajar desde varios
     dispositivos. Si la nube falla, se bloquea o no hay conexión,
     el programa sigue funcionando igual: nada se pierde, y lo
     pendiente se sube solo en cuanto vuelva a haber acceso.
     ========================================================== */

  var NUBE_URL = "https://flqercbgpgmmfaakrwkc.supabase.co";
  var NUBE_CLAVE = "sb_publishable_dDpJoqnVG8Axmk2QqCCX1g_4h5keXWJ";
  var ESPERA_NUBE_MS = 6000; // si tarda más que esto, se trabaja en local

  window.__nubeActiva = false;   // ¿se pudo contactar con la nube?
  window.__nubeCliente = null;

  function conTiempoLimite(promesa, ms) {
    return Promise.race([
      promesa,
      new Promise(function (_, rechazar) {
        setTimeout(function () { rechazar(new Error("La nube tarda demasiado en responder")); }, ms);
      })
    ]);
  }

  // --- Guardado en el propio dispositivo (nunca falla, no necesita red) ---
  var LOCAL = {
    get: function (key) {
      var v = localStorage.getItem("almacen:" + key);
      if (v === null) throw new Error("no existe");
      return v;
    },
    set: function (key, value) { localStorage.setItem("almacen:" + key, value); },
    delete: function (key) { localStorage.removeItem("almacen:" + key); },
    list: function () {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf("almacen:") === 0) keys.push(k.slice(8));
      }
      return keys;
    }
  };

  // --- Cola de lo que falta subir a la nube ---
  function pendientes() {
    try { return JSON.parse(localStorage.getItem("almacen__pendientes") || "[]"); }
    catch (e) { return []; }
  }
  function marcarPendiente(key) {
    var lista = pendientes();
    if (lista.indexOf(key) === -1) {
      lista.push(key);
      localStorage.setItem("almacen__pendientes", JSON.stringify(lista));
    }
    actualizarIndicador();
  }
  function quitarPendiente(key) {
    var lista = pendientes().filter(function (k) { return k !== key; });
    localStorage.setItem("almacen__pendientes", JSON.stringify(lista));
    actualizarIndicador();
  }

  // --- Aviso discreto del estado (sin molestar) ---
  function actualizarIndicador() {
    var el = document.getElementById("estado-guardado");
    if (!el) {
      el = document.createElement("div");
      el.id = "estado-guardado";
      el.style.cssText = "position:fixed;bottom:8px;right:8px;padding:5px 11px;border-radius:14px;font-family:sans-serif;font-size:11px;z-index:9998;pointer-events:none;opacity:0.9;";
      document.body.appendChild(el);
    }
    var sinSubir = pendientes().length;
    if (window.__nubeActiva && sinSubir === 0) {
      el.style.display = "none";
      return;
    }
    el.style.display = "block";
    if (!window.__nubeActiva) {
      el.style.background = "#4B5A54";
      el.style.color = "#fff";
      el.textContent = sinSubir > 0
        ? "Guardado en este equipo · " + sinSubir + " sin subir"
        : "Guardado en este equipo";
    } else {
      el.style.background = "#B08228";
      el.style.color = "#fff";
      el.textContent = "Subiendo " + sinSubir + "…";
    }
  }
  window.actualizarIndicador = actualizarIndicador;

  // --- Conectar con la nube (si se puede) ---
  window.conectarNube = async function () {
    if (!NUBE_URL || !NUBE_CLAVE) return false;
    try {
      var m = await conTiempoLimite(import("https://esm.sh/@supabase/supabase-js@2"), ESPERA_NUBE_MS);
      window.__nubeCliente = m.createClient(NUBE_URL, NUBE_CLAVE);
      window.__nubeActiva = true;
      return true;
    } catch (e) {
      console.warn("Sin nube, se trabaja en local:", e && e.message);
      window.__nubeActiva = false;
      return false;
    }
  };

  // --- Subir a la nube lo que quedó pendiente ---
  window.subirPendientes = async function () {
    if (!window.__nubeActiva || !window.__nubeCliente) return;
    var lista = pendientes();
    for (var i = 0; i < lista.length; i++) {
      var key = lista[i];
      try {
        var valor = LOCAL.get(key);
        var tablaEspecial = TABLAS_POR_FILA[key];
        if (tablaEspecial) {
          await sincronizarColeccionPorFila(tablaEspecial, JSON.parse(valor));
        } else {
          var r = await window.__nubeCliente.from("almacen_kv").upsert({ key: key, value: JSON.parse(valor) });
          if (r.error) throw r.error;
        }
        quitarPendiente(key);
      } catch (e) { /* se reintenta la próxima vez */ }
    }
    actualizarIndicador();
  };

  /* ----------------------------------------------------------
     MOVIMIENTOS, FICHAJES Y AUDITORÍA: una fila por registro
     ------------------------------------------------------------
     Estas tres colecciones crecen sin parar (cada venta, cada
     fichaje, cada acción registrada) — guardarlas como un bloque
     único significaba reescribir el historial entero en cada
     guardado. Aquí cada registro es su propia fila: se añade o
     se corrige solo lo que cambió, nunca todo.

     El resto de colecciones (productos, proveedores, clientes...)
     siguen exactamente igual que antes — son pequeñas y cambian
     poco, así que no ganan nada con este cambio y no se tocan.
     ---------------------------------------------------------- */
  var TABLAS_POR_FILA = {
    movimientos: "movimientos_registro",
    fichajes: "fichajes_registro",
    auditoria: "auditoria_registro",
  };
  var LIMITE_LECTURA = { auditoria: 500 }; // igual que el límite que ya tenía antes

  async function leerColeccionPorFila(tabla, key) {
    var query = window.__nubeCliente.from(tabla).select("datos").order("creado_en", { ascending: false });
    if (LIMITE_LECTURA[key]) query = query.limit(LIMITE_LECTURA[key]);
    var r = await query;
    if (r.error) throw r.error;
    return (r.data || []).map(function (fila) { return fila.datos; });
  }

  // Compara lo que hay en la nube contra la lista que se quiere guardar, y
  // hace solo lo necesario: añade lo nuevo, corrige lo que cambió (por
  // ejemplo, un fichaje editado a mano), y borra lo que ya no está (una
  // producción anulada, un albarán anulado). Nunca reescribe todo de golpe.
  async function sincronizarColeccionPorFila(tabla, listaLocal) {
    var r = await window.__nubeCliente.from(tabla).select("id, datos");
    if (r.error) throw r.error;
    var remotoPorId = {};
    (r.data || []).forEach(function (fila) { remotoPorId[fila.id] = fila.datos; });

    var idsLocales = {};
    var filasParaGuardar = [];
    listaLocal.forEach(function (x) {
      if (!x || !x.id) return;
      idsLocales[x.id] = true;
      var enNube = remotoPorId[x.id];
      if (!enNube || JSON.stringify(enNube) !== JSON.stringify(x)) {
        filasParaGuardar.push({
          id: x.id,
          fecha: x.fecha || new Date().toISOString().slice(0, 10),
          datos: x,
        });
      }
    });
    var idsParaBorrar = Object.keys(remotoPorId).filter(function (id) { return !idsLocales[id]; });

    if (filasParaGuardar.length > 0) {
      var rUp = await window.__nubeCliente.from(tabla).upsert(filasParaGuardar);
      if (rUp.error) throw rUp.error;
    }
    if (idsParaBorrar.length > 0) {
      var rDel = await window.__nubeCliente.from(tabla).delete().in("id", idsParaBorrar);
      if (rDel.error) throw rDel.error;
    }
  }

  window.storage = {
    // Leer: si hay nube, se prefiere (trae lo que hayan hecho en otro
    // dispositivo) y se deja copia local. Si no, se lee de local.
    async get(key) {
      var tablaEspecial = TABLAS_POR_FILA[key];
      if (window.__nubeActiva && window.__nubeCliente && pendientes().indexOf(key) === -1) {
        try {
          var lista;
          if (tablaEspecial) {
            lista = await conTiempoLimite(leerColeccionPorFila(tablaEspecial, key), ESPERA_NUBE_MS);
          } else {
            var r = await conTiempoLimite(
              window.__nubeCliente.from("almacen_kv").select("value").eq("key", key).maybeSingle(),
              ESPERA_NUBE_MS
            );
            if (r.error || !r.data) throw new Error("sin datos en la nube para " + key);
            lista = r.data.value;
          }
          var texto = JSON.stringify(lista);
          LOCAL.set(key, texto); // copia local, para poder trabajar sin red
          return { key: key, value: texto, shared: false };
        } catch (e) { /* si falla la nube, seguimos con lo local */ }
      }
      return { key: key, value: LOCAL.get(key), shared: false };
    },

    // Guardar: primero en el dispositivo (instantáneo y sin fallo posible),
    // y después se intenta subir. Si no sube, queda en la cola de pendientes.
    async set(key, value) {
      LOCAL.set(key, value);
      var tablaEspecial = TABLAS_POR_FILA[key];
      if (window.__nubeActiva && window.__nubeCliente) {
        try {
          if (tablaEspecial) {
            await conTiempoLimite(sincronizarColeccionPorFila(tablaEspecial, JSON.parse(value)), ESPERA_NUBE_MS);
          } else {
            var r = await conTiempoLimite(
              window.__nubeCliente.from("almacen_kv").upsert({ key: key, value: JSON.parse(value) }),
              ESPERA_NUBE_MS
            );
            if (r.error) throw r.error;
          }
          quitarPendiente(key);
        } catch (e) {
          marcarPendiente(key);
        }
      } else {
        marcarPendiente(key);
      }
      return { key: key, value: value, shared: false };
    },

    async delete(key) {
      LOCAL.delete(key);
      if (window.__nubeActiva && window.__nubeCliente) {
        try {
          var tablaEspecial = TABLAS_POR_FILA[key];
          if (tablaEspecial) {
            await conTiempoLimite(window.__nubeCliente.from(tablaEspecial).delete().neq("id", ""), ESPERA_NUBE_MS);
          } else {
            await conTiempoLimite(window.__nubeCliente.from("almacen_kv").delete().eq("key", key), ESPERA_NUBE_MS);
          }
        } catch (e) { /* el borrado local ya está hecho */ }
      }
      return { key: key, deleted: true, shared: false };
    },

    async list() {
      return { keys: LOCAL.list(), shared: false };
    }
  };
</script>

// Los precios de venta se introducen CON IVA (como en carta).
// El coste de compra es SIN IVA (el IVA soportado es deducible).
// Por eso el margen se calcula sobre el precio neto.
function ivaDe(p) {
  const v = Number(p && p.ivaVenta);
  return isNaN(v) ? 10 : v;
}
// IVA soportado en la compra. En España conviven 4% (alimentación básica),
// 10% (resto de alimentos) y 21% (general).
function ivaCompraDe(p) {
  const v = Number(p && p.ivaCompra);
  return isNaN(v) ? 10 : v;
}
function costoConIva(p) {
  return (Number(p && p.costo) || 0) * (1 + ivaCompraDe(p) / 100);
}
// Agrupa productos por proveedor para inventarios y hojas de recuento.
// Los que no tienen proveedor asignado van al final, en su propio grupo.
function agruparPorProveedor(productos, proveedores) {
  const grupos = new Map();
  productos.forEach((p) => {
    const id = p.proveedorId || "__sin__";
    if (!grupos.has(id)) grupos.set(id, []);
    grupos.get(id).push(p);
  });
  const orden = (a, b) => (a.ubicacion || "").localeCompare(b.ubicacion || "") || (a.nombre || "").localeCompare(b.nombre || "");
  const salida = [];
  proveedores.forEach((pv) => {
    if (grupos.has(pv.id)) {
      salida.push({ id: pv.id, nombre: pv.nombre, items: grupos.get(pv.id).sort(orden) });
      grupos.delete(pv.id);
    }
  });
  grupos.forEach((items, id) => {
    if (id === "__sin__") return;
    salida.push({ id, nombre: "Proveedor no encontrado", items: items.sort(orden) });
  });
  if (grupos.has("__sin__")) {
    salida.push({ id: "__sin__", nombre: "Sin proveedor asignado", items: grupos.get("__sin__").sort(orden) });
  }
  return salida;
}

// Empaque de compra: cuántas unidades trae la caja/saco/paquete del proveedor.
function udsPorCaja(p) {
  const v = Number(p && p.udsPorCaja);
  return !v || v <= 0 ? 1 : v;
}
function costoCaja(p) {
  return (Number(p && p.costo) || 0) * udsPorCaja(p);
}
function precioNeto(p) {
  const pvp = Number(p && p.precioVenta) || 0;
  return pvp / (1 + ivaDe(p) / 100);
}
function margenDe(p) {
  const neto = precioNeto(p);
  if (neto <= 0) return null;
  return ((neto - (Number(p.costo) || 0)) / neto) * 100;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Conteo final de un ítem: usa CF si está puesto; si no, el último conteo con valor.
// Soporta el formato antiguo (cantidadContada) de conteos ya guardados.
function valorCF(item) {
  if (!item) return null;
  const candidatos = [item.conteo, item.cf, item.c3, item.c2, item.c1, item.cantidadContada];
  for (const v of candidatos) {
    if (v !== "" && v !== null && v !== undefined && !isNaN(Number(v))) return Number(v);
  }
  return null;
}

const ultimoDiaMes = (fecha) => { const d = new Date(fecha); return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0, 10); };

async function loadKey(key, fallback, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await window.storage.get(key, false);
      if (res && res.value) return JSON.parse(res.value);
      return fallback; // la clave genuinamente no existe todavía (primer uso)
    } catch (e) {
      if (attempt === retries) {
        console.error("No se pudo cargar", key, "tras varios intentos:", e);
        return fallback;
      }
      await new Promise((r) => setTimeout(r, 350));
    }
  }
  return fallback;
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("Error guardando", key, e);
  }
}

        loadKey("historialRespaldos", []),
        loadKey("albaranes", []),
        loadKey("catalogoProv", {}),
        loadKey("gastosGenerales", []),
        loadKey("empleados", []),
        loadKey("fichajes", []),
        loadKey("disenoMenu", "B"),
        loadKey("registrosAppcc", []),
        loadKey("puntosControl", []),
        loadKey("clientes", []),
        loadKey("encargos", []),
        loadKey("arqueos", []),
        loadKey("turnos", []),
        loadKey("temaOscuro", false),
        loadKey("modoEmpleado", false),
        loadKey("pinPropietario", ""),
        loadKey("auditoria", []),
        loadKey("ordenesProduccion", []),

        loadKey("usuarioActivoId", null),

  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("auditoria", auditoria); }, [auditoria, ready]);

  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("usuarioActivoId", usuarioActivoId); }, [usuarioActivoId, ready]);

  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("nominas", nominas); }, [nominas, ready]);

  // Qué puede ver la persona identificada en modo empleado, según su rol.
  // Si el empleado activo no tiene rol guardado (fichas creadas antes de
  // este cambio) o no se identificó a nadie, se usa "Estándar" — el mismo

  const itemsPermitidosEmpleado = useMemo(() => {
    const activo = usuarioActivoId ? empleados.find((e) => e.id === usuarioActivoId) : null;
    const rol = activo?.rol && ROLES_EMPLEADO[activo.rol] ? activo.rol : "Estándar";

  }, [usuarioActivoId, empleados]);

  // Si se activa el modo empleado estando en una pantalla que ya no es
  // accesible, se vuelve sola al panel en vez de dejar la pantalla en blanco.

    if (modoEmpleado && !itemsPermitidosEmpleado.includes(tab)) setTab("dashboard");

  const productoPorId = (id) => productos.find((p) => p.id === id);
  const proveedorPorId = (id) => proveedores.find((p) => p.id === id);

  const [prefillAlbaran, setPrefillAlbaran] = useState(null);

  const [pendingRestore, setPendingRestore] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [showBackupView, setShowBackupView] = useState(false);
  const [backupText, setBackupText] = useState("");
  const [showRestoreInput, setShowRestoreInput] = useState(false);
  const [restoreText, setRestoreText] = useState("");
  const [copiado, setCopiado] = useState(false);

  const {
    crearPuntoDeGuardado, restaurarDesdeHistorial, abrirRespaldo, copiarRespaldo,
    abrirRestaurar, analizarTextoRestauracion, confirmarRestauracion, exportarExcelGeneral,
  } = crearLogicaRespaldos({
    proveedores, productos, pedidos, movimientos, conteos, fichasCosto,
    albaranes, catalogoProv, gastosGenerales, empleados, fichajes,
    registrosAppcc, puntosControl, clientes, encargos, arqueos, turnos,
    setProveedores, setProductos, setPedidos, setMovimientos, setConteos, setFichasCosto,
    setAlbaranes, setCatalogoProv, setGastosGenerales, setEmpleados, setFichajes,
    setRegistrosAppcc, setPuntosControl, setClientes, setEncargos, setArqueos, setTurnos,
    setHistorial, setPendingRestore, pendingRestore,
    setBackupText, backupText, setCopiado,
    setShowBackupView, setShowRestoreInput, setRestoreText, restoreText, setRestoreError,
    proveedorPorId, productoPorId,
  });

  /* ---------- ACCIONES DE NEGOCIO ---------- */

  const { addProveedor, updateProveedor, deleteProveedor } = crearLogicaProveedores({ proveedores, setProveedores, registrarAuditoria });

  /* ---------- AUDITORÍA ---------- */
  // Registro de acciones sensibles: solo en las que de verdad importan si algo
  // sale mal (borrados, pagos, ajustes de inventario), no en cada clic.

  const { addGasto, deleteGasto } = crearLogicaGastos({ setGastosGenerales });

  /* ---------- PERSONAL ---------- */
  const { addEmpleado, updateEmpleado, deleteEmpleado, anonimizarEmpleado, registrarAusencia, eliminarAusencia, registrarEpi, eliminarEpi } =

  const { addEncargo, updateEncargo, deleteEncargo, entregarEncargo } =

  /* ---------- APPCC ---------- */

  const { addPuntoControl, updatePuntoControl, deletePuntoControl, registrarAppcc, eliminarRegistroAppcc } =
    crearLogicaAppcc({ setPuntosControl, setRegistrosAppcc });

  /* ---------- REGISTRO HORARIO ---------- */
  const { fichar, addFichajeManual, updateFichaje, eliminarFichaje } = crearLogicaFichaje({ setFichajes });

  const { addFichaCosto, updateFichaCosto, deleteFichaCosto, alergenosDeFicha } =
    crearLogicaFichasCosto({ productos, setFichasCosto });

  const { crearProductoEnConteo, iniciarConteo, actualizarConteoItem, actualizarResponsable, finalizarConteo, aplicarAjustes } =
    crearLogicaConteos({ productos, setProductos, conteos, setConteos, setMovimientos, registrarAuditoria });

  // Hay un conteo abierto: el almacén queda congelado para no falsear el descuadre
  const conteoAbierto = useMemo(() => conteos.find((c) => !c.completado) || null, [conteos]);
  const almacenCongelado = !!conteoAbierto;

  // Se llaman aquí, no en su antigua posición, porque necesitan almacenCongelado
  // ya calculado — colocarlas antes rompería con un error de referencia.
  const { addProducto, updateProducto, deleteProducto, registrarSalida } =
    crearLogicaProductos({ productos, setProductos, setMovimientos, registrarAuditoria, almacenCongelado });
  const { crearPedido, actualizarPedido, eliminarPedido, recibirPedido, cerrarPedido } =
    crearLogicaPedidos({ setPedidos, setProductos, setMovimientos, almacenCongelado });


  /* ---------- ALBARANES ---------- */

  const { buscarEnCatalogo, aprenderReferencia, guardarAlbaran, eliminarAlbaran, marcarPagada, confirmarAlbaran, anularAlbaran, recibirConAlbaran } =
    crearLogicaAlbaranes({
      catalogoProv, setCatalogoProv,
      albaranes, setAlbaranes,
      productos, setProductos,
      setMovimientos, setPedidos,
      registrarAuditoria, proveedorPorId,
      setPrefillAlbaran, setTab,
    });

  const { addFacturaDirecta, updateFacturaDirecta, deleteFacturaDirecta, marcarPagadaFacturaDirecta } =
    crearLogicaFacturasDirectas({ setFacturasDirectas, registrarAuditoria });

  const { addNomina, deleteNomina } = crearLogicaNominas({ setNominas, registrarAuditoria });

  // Auditoría: quién tocó qué y cuándo. Solo en las acciones que de verdad
  // importan si algo sale mal — borrados, pagos y ajustes de inventario — no
  // en cada clic, o el registro se vuelve ilegible.
  //
  // Con conexión, pasa por la RPC "registrar_auditoria" — la única vía
  // permitida para escribir en la tabla desde que se revocó el insert
  // directo, así que una entrada de auditoría solo puede nacer de una
  // sesión autenticada de verdad. Sin conexión (o si la RPC falla por
  // cualquier motivo de red), se guarda igual en local para no perder el
  // rastro — no queda protegida contra manipulación hasta que sincronice,
  // pero es mejor tenerla sin esa garantía que no tenerla en absoluto.
  function registrarAuditoria(accion, detalle) {
    const empleadoActivo = usuarioActivoId ? empleados.find((e) => e.id === usuarioActivoId) : null;
    const usuario = modoEmpleado ? (empleadoActivo ? empleadoActivo.nombre : "Empleado sin identificar") : "Propietario/a";
    const entrada = { id: uid(), fecha: todayISO(), hora: new Date().toTimeString().slice(0, 5), usuario, accion, detalle };

    const hayConexion =
      typeof window !== "undefined" && window.__nubeActiva && typeof window.getSupabaseClient === "function";

    if (!hayConexion) {
      setAuditoria((s) => [entrada, ...s].slice(0, 500));
      return;
    }

    (async () => {
      try {
        const supabase = await window.getSupabaseClient();
        const r = await Promise.race([
          supabase.rpc("registrar_auditoria", { p_usuario: usuario, p_accion: accion, p_detalle: detalle }),
          new Promise((_, reject) => setTimeout(() => reject(new Error("La auditoría tardó demasiado en responder")), 6000)),
        ]);
        if (r.error) throw r.error;
        const rAud = await supabase.from("auditoria_registro").select("datos").order("creado_en", { ascending: false }).limit(500);
        if (!rAud.error && rAud.data) setAuditoria(rAud.data.map((fila) => fila.datos));
      } catch (e) {
        setAuditoria((s) => [entrada, ...s].slice(0, 500));
      }
    })();
  }

  /* ---------- CÁLCULOS ---------- */

  // El utillaje (jarras, bandejas, báscula...) no es mercancía: no rota, no se
  // consume por venta y no cuenta como capital circulante. Se trata aparte en
  // valor de almacén, ABC y alertas de "sin movimiento".
  const esUtillaje = (p) => (p.tipo || "materia_prima") === "utillaje";

  const valorInventario = useMemo(
    () => productos.filter((p) => !esUtillaje(p)).reduce((acc, p) => acc + p.stock * Number(p.costo || 0), 0),
    [productos]
  );
  const valorUtillaje = useMemo(
    () => productos.filter(esUtillaje).reduce((acc, p) => acc + p.stock * Number(p.costo || 0), 0),
    [productos]
  );
  const stockBajo = useMemo(() => productos.filter((p) => p.stock <= Number(p.stockMinimo || 0)), [productos]);

  // Bajo en el mostrador aunque en el almacén de atrás sí quede: aviso de
  // "hay que sacar más", distinto al de "hay que pedir al proveedor".
  const pisoVentaBajo = useMemo(
    () => productos.filter((p) => Number(p.stockMinimoPisoVenta) > 0 && (Number(p.stockPisoVenta) || 0) <= Number(p.stockMinimoPisoVenta)),
    [productos]
  );

  // Clasificación ABC por VALOR DE CONSUMO: lo que realmente mueve dinero.
  // valorConsumo = unidades que han salido en los últimos 12 meses × costo unitario.
  // Si todavía no hay histórico de salidas, se usa el valor en stock como aproximación
  // provisional y se avisa de ello en la interfaz. El utillaje queda fuera: nunca
  // "rota" y forzarlo en A/B/C solo añadiría ruido.
  const analisisABC = useMemo(() => {
    const hace12meses = new Date();
    hace12meses.setMonth(hace12meses.getMonth() - 12);

    const consumo = {};
    movimientos.forEach((m) => {
      if (m.tipo !== "salida") return;
      if (new Date(m.fecha) < hace12meses) return;
      consumo[m.productoId] = (consumo[m.productoId] || 0) + Math.abs(Number(m.cantidad) || 0);
    });

    const totalSalidas = Object.values(consumo).reduce((a, x) => a + x, 0);
    const baseConsumo = totalSalidas > 0;

    const clasificables = productos.filter((p) => !esUtillaje(p));
    const conValor = clasificables.map((p) => {
      const unidades = consumo[p.id] || 0;
      const costo = Number(p.costo) || 0;
      const valor = baseConsumo ? unidades * costo : (Number(p.stock) || 0) * costo;
      return { id: p.id, valor, unidades, rotacion: (Number(p.stock) || 0) > 0 ? unidades / (Number(p.stock) || 1) : null };
    });

    const total = conValor.reduce((a, x) => a + x.valor, 0);
    const mapa = {};
    const detalle = {};

    if (total <= 0) {
      clasificables.forEach((p) => { mapa[p.id] = "C"; detalle[p.id] = { valor: 0, unidades: 0, rotacion: null }; });
      return { mapa, detalle, baseConsumo };
    }

    const ordenados = [...conValor].sort((a, b) => b.valor - a.valor);
    let acumulado = 0;
    ordenados.forEach((x) => {
      acumulado += x.valor;
      const pct = (acumulado / total) * 100;
      mapa[x.id] = pct <= 80 ? "A" : pct <= 95 ? "B" : "C";
      detalle[x.id] = { valor: x.valor, unidades: x.unidades, rotacion: x.rotacion };
    });
    return { mapa, detalle, baseConsumo };
  }, [productos, movimientos]);

  const clasificacionABC = analisisABC.mapa;
  const pedidosPendientes = useMemo(() => pedidos.filter((p) => p.estado !== "Recibido"), [pedidos]);
  const margenPromedio = useMemo(() => {
    const conPrecio = productos.filter((p) => Number(p.precioVenta) > 0);
    if (!conPrecio.length) return 0;
    const total = conPrecio.reduce((acc, p) => acc + (margenDe(p) || 0), 0);
    return total / conPrecio.length;
  }, [productos]);

  // Ranking de margen por producto: no solo el % de margen, sino cuánto
  // beneficio bruto ha generado de verdad en los últimos 90 días — un
  // producto con margen altísimo pero que casi no se vende importa menos
  // que uno de margen normal que se vende sin parar.
  const margenPorProducto = useMemo(() => {
    const hace90 = new Date();
    hace90.setDate(hace90.getDate() - 90);
    return productos
      .filter((p) => Number(p.precioVenta) > 0)
      .map((p) => {
        const ventas = movimientos.filter(
          (m) => m.productoId === p.id && m.tipo === "salida" && m.motivo === "Venta" && new Date(m.fecha) >= hace90
        );
        const unidadesVendidas = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0), 0);
        const ingresos = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0), 0);
        const costes = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
        return { ...p, unidadesVendidas, ingresos, beneficio: ingresos - costes, margenPct: margenDe(p) };
      })
      .filter((p) => p.unidadesVendidas > 0)
      .sort((a, b) => b.beneficio - a.beneficio);
  }, [productos, movimientos]);

  // Días de stock al ritmo de venta real: se mide cuánto ha salido desde
  // el primer movimiento de ese producto y se divide entre los días
  // transcurridos. Es más honesto que proyectar a 365 días con solo unas
  // semanas de historial, que infla artificialmente la rotación.
  const rotacionPorProducto = useMemo(() => {
    const hoy = new Date();
    return productos.map((p) => {
      const salidas = movimientos.filter((m) => m.productoId === p.id && m.tipo === "salida");
      const cantSalidas = salidas.reduce((a, m) => a + (Number(m.cantidad) || 0), 0);
      if (salidas.length === 0) {
        return { ...p, cantSalidas: 0, consumoDiario: null, dias: null, rotacion: null };
      }
      const primera = salidas.reduce((min, m) => (new Date(m.fecha) < min ? new Date(m.fecha) : min), new Date(salidas[0].fecha));
      const diasTranscurridos = Math.max(1, Math.round((hoy - primera) / 86400000) + 1);
      const consumoDiario = cantSalidas / diasTranscurridos;
      const dias = consumoDiario > 0 ? (Number(p.stock) || 0) / consumoDiario : null;
      const rotacion = dias ? 365 / dias : null;
      return { ...p, cantSalidas, consumoDiario, dias, rotacion, diasConDatos: diasTranscurridos };
    });
  }, [productos, movimientos]);

  // Punto de pedido: cruza cuántos días de stock quedan (rotación real) con
  // cuántos días tarda en llegar de verdad — no solo el plazo de entrega, sino
  // también si el proveedor solo reparte ciertos días de la semana. Si el
  // stock se agota antes de eso, hay que pedir ya. No avisa de productos que
  // ya están en un pedido pendiente, para no duplicar el aviso.
  function diasHastaProximaEntrega(leadTime, diasReparto) {
    if (!diasReparto || diasReparto.length === 0) return leadTime;
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    for (let n = leadTime; n <= leadTime + 14; n++) {
      const fecha = new Date(hoy);
      fecha.setDate(fecha.getDate() + n);
      if (diasReparto.includes(fecha.getDay())) return n;
    }
    return leadTime;
  }

  const productosEnPedidoPendiente = useMemo(() => {
    const ids = new Set();
    pedidosPendientes.forEach((pe) => (pe.items || []).forEach((it) => ids.add(it.productoId)));
    return ids;
  }, [pedidosPendientes]);

  const sugerenciasPedido = useMemo(() => {
    return rotacionPorProducto
      .filter((p) => p.tipo !== "utillaje" && p.tipo !== "elaborado" && p.proveedorId && p.dias !== null)
      .map((p) => {
        const prov = proveedores.find((pv) => pv.id === p.proveedorId);
        const leadTime = prov ? Number(prov.leadTime) || 0 : 0;
        const diasHastaEntrega = diasHastaProximaEntrega(leadTime, prov ? prov.diasReparto : []);
        return { ...p, proveedorNombre: prov ? prov.nombre : "—", leadTime, diasHastaEntrega, margen: p.dias - diasHastaEntrega };
      })
      .filter((p) => p.leadTime > 0 && p.margen <= 1 && !productosEnPedidoPendiente.has(p.id))
      .sort((a, b) => a.margen - b.margen);
  }, [rotacionPorProducto, proveedores, productosEnPedidoPendiente]);


  // Lotes con caducidad, sacados de los albaranes ya confirmados.
  // No hace falta guardar nada nuevo: la información ya está en las líneas.
  const lotesCaducidad = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const filas = [];
    albaranes.forEach((a) => {
      if (a.estado !== "confirmado") return;
      (a.lineas || []).forEach((ln) => {
        if (!ln.caducidad) return;
        const f = new Date(ln.caducidad);
        if (isNaN(f)) return;
        const dias = Math.round((f - hoy) / 86400000);
        const prod = productos.find((x) => x.id === ln.productoId);
        filas.push({
          id: `${a.id}-${ln.codigoProveedor || ln.descripcion}`,
          productoId: ln.productoId,
          nombre: prod ? prod.nombre : ln.descripcion,
          lote: ln.lote || "",
          caducidad: ln.caducidad,
          dias,
          unidades: Number(ln.unidadesEntradas) || 0,
          albaran: a.numero,
          proveedorId: a.proveedorId,
        });
      });
    });

    // Como el stock se lleva por producto y no por lote, un lote que ya se
    // vendió entero seguiría avisando de su caducidad para siempre. Para
    // evitarlo, se asume consumo FIFO (lo que entró antes se vende antes,
    // que es además la práctica correcta en cocina): se ordenan los lotes de
    // cada producto por caducidad —el más próximo es el que entró antes— y
    // solo se avisa de la cantidad que cabe dentro del stock que queda hoy.
    // Lo que sobra por encima del stock actual se da por ya consumido.
    const porProducto = {};
    filas.forEach((l) => {
      const key = l.productoId || l.nombre;
      if (!porProducto[key]) porProducto[key] = [];
      porProducto[key].push(l);
    });

    const filasAjustadas = [];
    Object.entries(porProducto).forEach(([key, lotes]) => {
      const prod = productos.find((p) => p.id === key);
      const stockActual = prod ? Number(prod.stock) || 0 : lotes.reduce((a, l) => a + l.unidades, 0);
      // Se ordena de más próximo a caducar a más lejano: es el orden en que
      // debería consumirse (y en el que se descuenta aquí), porque es la
      // práctica correcta en cocina — lo que caduca antes, se usa antes.
      const ordenados = [...lotes].sort((x, y) => x.dias - y.dias);
      const totalNominal = ordenados.reduce((a, l) => a + l.unidades, 0);
      // Cuánto se ha consumido desde que entró, si el stock actual es menor
      // que lo que entró en total. Se resta empezando por lo que caduca
      // antes, que es lo primero que se habría gastado.
      let porDescontar = Math.max(0, totalNominal - stockActual);
      ordenados.forEach((l) => {
        if (porDescontar >= l.unidades) {
          porDescontar -= l.unidades; // este lote ya se dio por consumido del todo
          return;
        }
        const quedan = l.unidades - porDescontar;
        porDescontar = 0;
        filasAjustadas.push({ ...l, unidades: quedan, parcial: quedan < l.unidades });
      });
    });

    return filasAjustadas.sort((x, y) => x.dias - y.dias);
  }, [albaranes, productos]);

  const caducanPronto = useMemo(() => lotesCaducidad.filter((l) => l.dias <= 30), [lotesCaducidad]);

  // Recordatorio de conteo: cuánto hace del último inventario ciego
  // COMPLETADO de cada ámbito. El piso de venta se recomienda contar más a
  // menudo (14 días) porque ahí es donde antes se nota una diferencia real
  // con la caja; el almacén y el total, cada 30.
  const recordatorioConteo = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const ambitos = [
      { id: "piso_venta", nombre: "Piso de venta", limiteDias: 14 },
      { id: "almacen", nombre: "Almacén (trastienda)", limiteDias: 30 },
      { id: "total", nombre: "Total (empresa completa)", limiteDias: 30 },
    ];
    return ambitos.map((amb) => {
      const delAmbito = conteos.filter((c) => c.completado && (c.ambito || "total") === amb.id);
      if (delAmbito.length === 0) {
        return { ...amb, ultimaFecha: null, diasDesde: null, atrasado: true };
      }
      const ultima = delAmbito.reduce((max, c) => (c.fecha > max ? c.fecha : max), delAmbito[0].fecha);
      const diasDesde = Math.round((hoy - new Date(ultima)) / 86400000);
      return { ...amb, ultimaFecha: ultima, diasDesde, atrasado: diasDesde > amb.limiteDias };
    });
  }, [conteos]);

  const conteosAtrasados = useMemo(() => recordatorioConteo.filter((a) => a.atrasado), [recordatorioConteo]);

  // Documentos de personal que caducan (certificado médico, formación de manipulador, etc.)
  // y contratos temporales que están a punto de acabar.
  const documentosPersonalCaducan = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const filas = [];
    empleados.filter((e) => e.activo !== false).forEach((e) => {
      (e.documentos || []).forEach((d) => {
        if (!d.fechaCaducidad) return;
        const f = new Date(d.fechaCaducidad);
        if (isNaN(f)) return;
        const dias = Math.round((f - hoy) / 86400000);
        filas.push({ id: `${e.id}-doc-${d.id}`, empleado: e.nombre, concepto: d.nombre, fecha: d.fechaCaducidad, dias });
      });
      if (e.fechaFinContrato) {
        const f = new Date(e.fechaFinContrato);
        if (!isNaN(f)) {
          const dias = Math.round((f - hoy) / 86400000);
          filas.push({ id: `${e.id}-contrato`, empleado: e.nombre, concepto: "Fin de contrato", fecha: e.fechaFinContrato, dias });
        }
      }
    });
    return filas.sort((a, b) => a.dias - b.dias);
  }, [empleados]);
  const documentosPersonalPronto = useMemo(() => documentosPersonalCaducan.filter((d) => d.dias <= 30), [documentosPersonalCaducan]);

  // Fichajes "abiertos": alguien marcó entrada pero no salida. Es un aviso
  // operativo (se les olvidó fichar la salida), no una alarma legal.

  // Puntos de control que hoy todavía no se han registrado
  // Encargos pendientes ordenados por urgencia de entrega
  const encargosPendientes = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return encargos
      .filter((e) => e.estado !== "Entregado" && e.estado !== "Cancelado")
      .map((e) => {
        const f = new Date(e.fechaEntrega);
        const dias = isNaN(f) ? null : Math.round((f - hoy) / 86400000);
        const total = (e.lineas || []).reduce((a, ln) => a + (Number(ln.cantidad) || 0) * (Number(ln.precioUnitario) || 0), 0);
        return { ...e, dias, total, cliente: clientes.find((c) => c.id === e.clienteId) };
      })
      .sort((a, b) => (a.dias ?? 9999) - (b.dias ?? 9999));
  }, [encargos, clientes]);

  const encargosUrgentes = useMemo(() => encargosPendientes.filter((e) => e.dias !== null && e.dias <= 2), [encargosPendientes]);

  // Análisis de clientes: cuánto ha comprado cada uno y cuándo fue la última vez.
  // Solo cuenta ventas con cliente identificado (encargos), no el mostrador anónimo.
  const analisisClientes = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return clientes
      .map((c) => {
        const susVentas = movimientos.filter((m) => m.clienteId === c.id && m.tipo === "salida" && m.motivo === "Venta");
        const facturado = susVentas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0), 0);
        const fechas = susVentas.map((m) => m.fecha).sort();
        const ultima = fechas[fechas.length - 1] || null;
        const diasSinComprar = ultima ? Math.round((hoy - new Date(ultima)) / 86400000) : null;
        const nEncargos = encargos.filter((e) => e.clienteId === c.id && e.estado === "Entregado").length;
        return { ...c, facturado, ultima, diasSinComprar, nEncargos };
      })
      .sort((a, b) => b.facturado - a.facturado);
  }, [clientes, movimientos, encargos]);

  // Clientes que compraban y llevan tiempo sin aparecer: candidatos a recuperar
  const clientesDormidos = useMemo(
    () => analisisClientes.filter((c) => c.nEncargos > 0 && c.diasSinComprar !== null && c.diasSinComprar > 60),
    [analisisClientes]
  );

  // Venta cruzada: qué productos aparecen juntos en el mismo encargo.
  // Con pocos datos no dice nada fiable, así que solo se muestra a partir
  // de 3 encargos entregados y se avisa de la limitación en pantalla.
  const ventaCruzada = useMemo(() => {
    const entregados = encargos.filter((e) => e.estado === "Entregado");
    const pares = {};
    entregados.forEach((e) => {
      const ids = [...new Set((e.lineas || []).map((l) => l.productoId).filter(Boolean))];
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const key = [ids[i], ids[j]].sort().join("|");
          pares[key] = (pares[key] || 0) + 1;
        }
      }
    });
    return {
      base: entregados.length,
      filas: Object.entries(pares)
        .map(([key, veces]) => {
          const [a, b] = key.split("|");
          return { a: productos.find((p) => p.id === a), b: productos.find((p) => p.id === b), veces };
        })
        .filter((x) => x.a && x.b)
        .sort((x, y) => y.veces - x.veces)
        .slice(0, 8),
    };
  }, [encargos, productos]);

  const appccPendientesHoy = useMemo(() => {
    const hoy = todayISO();
    const hechosHoy = new Set(registrosAppcc.filter((r) => r.fecha === hoy).map((r) => r.puntoId));
    return puntosControl.filter((p) => p.activo !== false && !hechosHoy.has(p.id));
  }, [puntosControl, registrosAppcc]);

  const fichajesAbiertos = useMemo(() => {
    const porEmpleadoFecha = {};
    fichajes.forEach((f) => {
      const key = `${f.empleadoId}-${f.fecha}`;
      if (!porEmpleadoFecha[key]) porEmpleadoFecha[key] = [];
      porEmpleadoFecha[key].push(f);
    });
    const abiertos = [];
    Object.entries(porEmpleadoFecha).forEach(([key, lista]) => {
      const entradas = lista.filter((f) => f.tipo === "entrada").length;
      const salidas = lista.filter((f) => f.tipo === "salida").length;
      if (entradas > salidas) {
        const [empleadoId, fecha] = [lista[0].empleadoId, lista[0].fecha];
        const emp = empleados.find((e) => e.id === empleadoId);
        abiertos.push({ empleadoId, fecha, nombre: emp ? emp.nombre : "—" });
      }
    });
    return abiertos;
  }, [fichajes, empleados]);

  // Cuentas por pagar: se calcula el vencimiento de cada factura a partir de
  // los días de pago del proveedor. Si el proveedor no tiene ese dato, no se
  // puede calcular vencimiento y se avisa en vez de inventar una fecha.
  const facturasPorPagar = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);

    function calcularVencimiento(fechaFactura, diasPago) {
      if (diasPago === null || !fechaFactura) return { vencimiento: null, dias: null };
      const v = new Date(fechaFactura);
      v.setDate(v.getDate() + diasPago);
      return { vencimiento: v.toISOString().slice(0, 10), dias: Math.round((v - hoy) / 86400000) };
    }

    const deAlbaranes = albaranes
      .filter((a) => a.estado === "confirmado" && a.esFactura !== false)
      .map((a) => {
        const prov = proveedorPorId(a.proveedorId);
        const base = a.lineas.reduce((x, ln) => x + (Number(ln.importe) || 0), 0);
        const ivaLineas = a.lineas.reduce((x, ln) => x + (Number(ln.importe) || 0) * ((Number(ln.ivaPct) || 0) / 100), 0);
        const cargosBase = Number(a.cargos) || 0;
        const cargosIva = cargosBase * ((Number(a.cargosIva) || 0) / 100);
        const total = base + ivaLineas + cargosBase + cargosIva;
        const fechaFactura = a.fechaFactura || a.fecha;
        const diasPago = prov ? Number(prov.diasPago) || null : null;
        const { vencimiento, dias } = calcularVencimiento(fechaFactura, diasPago);
        return {
          id: a.id, origen: "albaran", concepto: `Mercancía · ${prov ? prov.nombre : "—"}`,
          proveedor: prov, numeroFactura: a.numeroFactura || a.numero || "s/n",
          fechaFactura, vencimiento, dias, total, pagada: !!a.pagada,
        };
      });

    // Facturas directas: gastos sin mercancía de por medio (luz, alquiler,
    // gestoría...). Mismo vencimiento por días de pago del proveedor si lo
    // tiene, o la fecha que se haya puesto a mano.
    const deDirectas = facturasDirectas.map((f) => {
      const prov = proveedorPorId(f.proveedorId);
      const diasPago = prov ? Number(prov.diasPago) || null : null;
      const auto = calcularVencimiento(f.fecha, diasPago);
      const vencimiento = f.vencimiento || auto.vencimiento;
      const dias = vencimiento ? Math.round((new Date(vencimiento) - hoy) / 86400000) : null;
      return {
        id: f.id, origen: "directa", concepto: f.concepto || "Factura directa",
        proveedor: prov, numeroFactura: f.numeroFactura || "s/n",
        fechaFactura: f.fecha, vencimiento, dias, total: Number(f.importeTotal) || 0, pagada: !!f.pagada,
      };
    });

    return [...deAlbaranes, ...deDirectas].sort((x, y) => {
      if (x.pagada !== y.pagada) return x.pagada ? 1 : -1;
      if (x.dias === null) return 1;
      if (y.dias === null) return -1;
      return x.dias - y.dias;
    });
  }, [albaranes, proveedores]);

  const pendientesPago = useMemo(() => facturasPorPagar.filter((f) => !f.pagada), [facturasPorPagar]);
  const vencenPronto = useMemo(() => pendientesPago.filter((f) => f.dias !== null && f.dias <= 7), [pendientesPago]);
  const totalPendientePago = useMemo(() => pendientesPago.reduce((a, f) => a + f.total, 0), [pendientesPago]);

  // Ingreso medio diario real de los últimos 30 días, para usarlo como base
  // de lo que se espera cobrar cada día en la previsión de tesorería.
  const promedioDiarioVentas = useMemo(() => {
    const hace30 = new Date();
    hace30.setDate(hace30.getDate() - 30);
    const ventas = movimientos.filter((m) => m.tipo === "salida" && m.motivo === "Venta" && new Date(m.fecha) >= hace30);
    const total = ventas.reduce(
      (a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0) * (1 + (Number(m.ivaVentaAplicado) || 0) / 100),
      0
    );
    return total / 30;
  }, [movimientos]);

  // Previsión de tesorería a 30 días: lo único "real" son los pagos con
  // vencimiento conocido y los encargos con fecha de entrega ya fijada. Todo
  // lo demás (venta de mostrador del día a día) se estima con el promedio
  // reciente, dejando claro en pantalla que es una estimación, no un hecho.
  const proyeccionTesoreria = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const dias = [];
    for (let i = 0; i < 30; i++) {
      const d = new Date(hoy);
      d.setDate(d.getDate() + i);
      const fechaISO = d.toISOString().slice(0, 10);
      const pagosDia = pendientesPago.filter((f) => f.vencimiento === fechaISO).reduce((a, f) => a + f.total, 0);
      const encargosDia = encargos
        .filter((e) => e.estado !== "Entregado" && e.estado !== "Cancelado" && e.fechaEntrega === fechaISO)
        .reduce((a, e) => {
          const total = (e.lineas || []).reduce((x, l) => x + (Number(l.cantidad) || 0) * (Number(l.precioUnitario) || 0), 0);
          return a + Math.max(0, total - (Number(e.señal) || 0));
        }, 0);
      const ingresosDia = promedioDiarioVentas + encargosDia;
      dias.push({ fecha: fechaISO, ingresosDia, pagosDia, netoDia: ingresosDia - pagosDia });
    }
    return dias;
  }, [pendientesPago, encargos, promedioDiarioVentas]);

  // Ingresos por venta agrupados por mes, para comparar el mismo mes contra
  // el año anterior. Con pocos meses de historial, simplemente no habrá
  // dato de comparación todavía — se avisa en pantalla en vez de inventarlo.
  const ingresosPorMes = useMemo(() => {
    const mapa = {};
    movimientos.forEach((m) => {
      if (m.tipo !== "salida" || m.motivo !== "Venta") return;
      const key = m.fecha.slice(0, 7);
      const importe = (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0);
      mapa[key] = (mapa[key] || 0) + importe;
    });
    return mapa;
  }, [movimientos]);

  const gastoPorProveedor = useMemo(() => {
    const map = {};
    pedidos.forEach((pe) => {
      const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
      map[pe.proveedorId] = (map[pe.proveedorId] || 0) + total;
    });
    return Object.entries(map)
      .map(([proveedorId, total]) => ({ proveedor: proveedorPorId(proveedorId), total }))
      .sort((a, b) => b.total - a.total);
  }, [pedidos, proveedores]);

  const productosSinMovimiento = useMemo(
    () => productos.filter((p) => !esUtillaje(p) && !movimientos.some((m) => m.productoId === p.id && m.tipo === "salida")),
    [productos, movimientos]
  );

  if (!ready) {
    return (
      <div style={{ background: C.bg, color: C.ink }} className="w-full h-full min-h-[600px] flex items-center justify-center font-sans">
        <Loader2 className="animate-spin" size={22} />
        <span className="ml-2 text-sm">Cargando almacén…</span>
      </div>
    );
  }

  const contenido = (
    <>
        {tab === "dashboard" && (
          <Dashboard
            valorInventario={valorInventario}
            valorUtillaje={valorUtillaje}
            stockBajo={stockBajo}
            pedidosPendientes={pedidosPendientes}
            margenPromedio={margenPromedio}
            movimientos={movimientos}
            productos={productos}
            caducanPronto={caducanPronto}
            proveedorPorId={proveedorPorId}
            vencenPronto={vencenPronto}
            totalPendientePago={totalPendientePago}
            documentosPersonalPronto={documentosPersonalPronto}
            fichajesAbiertos={fichajesAbiertos}
            encargosUrgentes={encargosUrgentes}
            pisoVentaBajo={pisoVentaBajo}
            sugerenciasPedido={sugerenciasPedido}

            <div>Fichas de costo: <span className="mono">{(pendingRestore.fichasCosto || []).length}</span></div>
            <div>Albaranes: <span className="mono">{(pendingRestore.albaranes || []).length}</span></div>
            <div>Códigos de proveedor aprendidos: <span className="mono">{Object.keys(pendingRestore.catalogoProv || {}).length}</span></div>
            {pendingRestore.exportadoEl && <div>Respaldo generado el: {new Date(pendingRestore.exportadoEl).toLocaleString("es-ES")}</div>}
          </div>
          {!pendingRestore.albaranes && (
            <div className="text-[12px] mb-3 p-2 rounded-lg" style={{ background: C.amberSoft, color: C.ink }}>
              Esta copia es anterior al módulo de albaranes, así que no los contiene. Al restaurarla,
              <b> los albaranes y los códigos de proveedor que tengas ahora se conservan</b>: no se borran.
            </div>
          )}
          <div className="text-[12px] mb-4" style={{ color: C.red }}>
            Esta acción reemplaza todo lo que tengas cargado ahora mismo en el programa. Si quieres conservarlo, cancela y descarga primero un respaldo del estado actual.
          </div>
          <div className="flex gap-2">
            <Btn onClick={confirmarRestauracion}>Sí, restaurar este respaldo</Btn>
            <Btn variant="ghost" onClick={() => setPendingRestore(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= LÓGICA: PERSONAL Y TURNOS ================= */
function crearLogicaPersonal({ empleados, setEmpleados, registrarAuditoria, setNominas }) {
  function addEmpleado(data) {
    setEmpleados((s) => [...s, { id: uid(), activo: true, documentos: [], ...data }]);
  }
  function updateEmpleado(id, data) {
    setEmpleados((s) => s.map((e) => (e.id === id ? { ...e, ...data } : e)));
  }
  function deleteEmpleado(id) {
    const e = empleados.find((x) => x.id === id);
    registrarAuditoria("Eliminar empleado", e ? e.nombre : id);
    setEmpleados((s) => s.filter((e) => e.id !== id));
    // Sin esto, las nóminas de ese empleado se quedaban en el sistema sin
    // nadie a quien pertenecer — un dato huérfano que ya no aparece en
    // ningún sitio, pero que sigue ahí.
    if (setNominas) setNominas((s) => s.filter((n) => n.empleadoId !== id));
  }

  // Alternativa al borrado total: quita el nombre y los datos que
  // identifican a la persona, pero mantiene la ficha (con el mismo id) para
  // que sus fichajes y nóminas —que la ley obliga a conservar varios
  // años— sigan teniendo a quién pertenecer, aunque ya no digan quién era.
  function anonimizarEmpleado(id) {
    const e = empleados.find((x) => x.id === id);
    registrarAuditoria("Anonimizar empleado", e ? e.nombre : id);
    setEmpleados((s) =>
      s.map((emp) =>
        emp.id === id
          ? {
              ...emp,
              nombre: "Empleado anonimizado",
              dni: "",
              pin: "",
              documentos: [],
              ausencias: [],
              anonimizado: true,
              activo: false,
            }
          : emp
      )
    );
  }
  function registrarAusencia(empleadoId, ausencia) {
    setEmpleados((s) =>
      s.map((e) => (e.id === empleadoId ? { ...e, ausencias: [...(e.ausencias || []), { id: uid(), ...ausencia }] } : e))
    );
  }
  function eliminarAusencia(empleadoId, ausenciaId) {
    setEmpleados((s) =>
      s.map((e) => (e.id === empleadoId ? { ...e, ausencias: (e.ausencias || []).filter((a) => a.id !== ausenciaId) } : e))
    );
  }
  // EPIs entregados: obligación documental de PRL (equipos de protección individual).
  function registrarEpi(empleadoId, epi) {
    setEmpleados((s) =>
      s.map((e) => (e.id === empleadoId ? { ...e, epis: [...(e.epis || []), { id: uid(), fecha: todayISO(), ...epi }] } : e))
    );
  }
  function eliminarEpi(empleadoId, epiId) {
    setEmpleados((s) =>
      s.map((e) => (e.id === empleadoId ? { ...e, epis: (e.epis || []).filter((x) => x.id !== epiId) } : e))
    );
  }
  return { addEmpleado, updateEmpleado, deleteEmpleado, anonimizarEmpleado, registrarAusencia, eliminarAusencia, registrarEpi, eliminarEpi };
}

function crearLogicaTurnos({ turnos, setTurnos }) {
  function addTurno(data) {
    setTurnos((s) => [...s, { id: uid(), ...data }]);
  }
  function updateTurno(id, data) {
    setTurnos((s) => s.map((t) => (t.id === id ? { ...t, ...data } : t)));
  }
  function deleteTurno(id) {
    setTurnos((s) => s.filter((t) => t.id !== id));
  }
  function copiarSemana(desdeFechas, haciaFechas) {
    // desdeFechas/haciaFechas: arrays de 7 fechas ISO en el mismo orden (lunes..domingo)
    const nuevos = [];
    turnos.forEach((t) => {
      const idx = desdeFechas.indexOf(t.fecha);
      if (idx === -1) return;
      nuevos.push({ id: uid(), empleadoId: t.empleadoId, fecha: haciaFechas[idx], tipo: t.tipo, horaInicio: t.horaInicio, horaFin: t.horaFin, notas: t.notas });
    });
    if (nuevos.length) setTurnos((s) => [...s, ...nuevos]);
    return nuevos.length;
  }
  return { addTurno, updateTurno, deleteTurno, copiarSemana };
}

/* ================= LÓGICA: PRODUCTOS ================= */
function crearLogicaProductos({ productos, setProductos, setMovimientos, registrarAuditoria, almacenCongelado }) {
  function addProducto(data) {
    // Devuelve el producto ya creado (con su id) para que quien lo llama
    // pueda enlazarlo con algo — por ejemplo, una ficha de costo.
    const nuevo = { id: uid(), stock: Number(data.stock) || 0, ...data };
    setProductos((s) => [...s, nuevo]);
    return nuevo;
  }
  function updateProducto(id, data) {
    const anterior = productos.find((p) => p.id === id);
    setProductos((s) => s.map((p) => (p.id === id ? { ...p, ...data } : p)));

    // Si el stock cambió a mano, dejamos un movimiento de ajuste — para que
    // nunca desaparezca sin dejar rastro, como pasó con el caso real de la
    // leche. Solo se dispara si el número de verdad cambió, no en cada
    // edición (cambiar el nombre o el precio no debe generar un ajuste).
    if (anterior && data.stock !== undefined && setMovimientos) {
      const stockAnterior = Number(anterior.stock) || 0;
      const stockNuevo = Number(data.stock) || 0;
      const dif = stockNuevo - stockAnterior;
      if (dif !== 0) {
        setMovimientos((s) => [
          {
            id: uid(), productoId: id, tipo: "ajuste", cantidad: dif,
            fecha: todayISO(), motivo: "Corrección manual de stock",
          },
          ...s,
        ]);
      }
    }
  }
  function deleteProducto(id) {
    const p = productos.find((x) => x.id === id);
    registrarAuditoria("Eliminar producto", p ? p.nombre : id);
    setProductos((s) => s.filter((p) => p.id !== id));
  }

  function registrarSalida(productoId, cantidad, opciones = {}) {
    if (almacenCongelado) return false;
    const cant = Number(cantidad);
    if (!cant || cant <= 0) return false;
    const { motivo = "Venta", precioVentaUnitario = null, referencia = "", medioPago = "Efectivo" } = opciones;
    const prod = productos.find((p) => p.id === productoId);
    const costoUnitario = prod ? Number(prod.costo) || 0 : 0;
    const ivaVentaAplicado = prod ? ivaDe(prod) : 10;
    const ingresoUnitario =
      motivo === "Venta"
        ? precioVentaUnitario !== null && precioVentaUnitario !== ""
          ? Number(precioVentaUnitario) || 0
          : prod
          ? precioNeto(prod)
          : 0
        : 0;
    setProductos((s) => s.map((p) => (p.id === productoId ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) - cant) } : p)));
    setMovimientos((s) => [
      {
        id: uid(),
        productoId,
        tipo: "salida",
        cantidad: cant,
        fecha: todayISO(),
        motivo,
        costoUnitario,
        ingresoUnitario,
        ivaVentaAplicado,
        medioPago: motivo === "Venta" ? medioPago : null,
        referencia: referencia || motivo,
      },
      ...s,
    ]);
    return true;
  }

  return { addProducto, updateProducto, deleteProducto, registrarSalida };
}

/* ================= LÓGICA: PEDIDOS ================= */
function crearLogicaPedidos({ setPedidos, setProductos, setMovimientos, almacenCongelado }) {
  function crearPedido({ proveedorId, fechaEsperada, items }) {
    const pedido = {
      id: uid(),
      proveedorId,
      fecha: todayISO(),
      fechaEsperada,
      estado: "Pendiente",
      items: items.map((it) => ({ ...it, cantidadRecibida: 0 })),
    };
    setPedidos((s) => [pedido, ...s]);
    return pedido;
  }

  function actualizarPedido(pedidoId, { proveedorId, fechaEsperada, items }) {
    setPedidos((s) =>
      s.map((pe) =>
        pe.id === pedidoId
          ? { ...pe, proveedorId, fechaEsperada, items: items.map((it) => ({ ...it, cantidadRecibida: 0 })) }
          : pe
      )
    );
  }

  function eliminarPedido(pedidoId) {
    setPedidos((s) => s.filter((pe) => pe.id !== pedidoId));
  }

  // Dar un pedido por cerrado aunque no haya llegado todo: pasa cuando el
  // proveedor sirve de menos y no va a mandar el resto. Sin esto, el pedido
  // se quedaría en "Parcial" para siempre estorbando en Recepción.
  function cerrarPedido(pedidoId) {
    setPedidos((s) => s.map((pe) => (pe.id === pedidoId ? { ...pe, estado: "Recibido", cerradoManualmente: true } : pe)));
  }

  function recibirPedido(pedidoId, recepciones) {
    if (almacenCongelado) return false;
    // recepciones: { [productoId]: cantidadRecibidaAhora }
    setPedidos((s) =>
      s.map((pe) => {
        if (pe.id !== pedidoId) return pe;
        const items = pe.items.map((it) => {
          const nueva = Number(recepciones[it.productoId] || 0);
          return { ...it, cantidadRecibida: it.cantidadRecibida + nueva };
        });
        const completo = items.every((it) => it.cantidadRecibida >= it.cantidad);
        const algo = items.some((it) => it.cantidadRecibida > 0);
        return { ...pe, items, estado: completo ? "Recibido" : algo ? "Parcial" : "Pendiente" };
      })
    );
    // Actualizar stock y movimientos
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const cant = Number(recepciones[p.id] || 0);
        if (cant > 0) {
          nuevosMov.push({ id: uid(), productoId: p.id, tipo: "entrada", cantidad: cant, fecha: todayISO(), referencia: "Recepción pedido" });
          return { ...p, stock: p.stock + cant };
        }
        return p;
      })
    );
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
    return true;
  }

  return { crearPedido, actualizarPedido, eliminarPedido, recibirPedido, cerrarPedido };
}

function crearLogicaFichasCosto({ productos, setFichasCosto }) {
  function addFichaCosto(data) {
