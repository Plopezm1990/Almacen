              <Field label="Lote (trazabilidad)">
                <Input value={ln.lote} onChange={(e) => setLinea(idx, "lote", e.target.value)} disabled={bloqueado} placeholder="1/52451" />
              </Field>
              <Field label="Caducidad">
                <Input type="date" value={ln.caducidad} onChange={(e) => setLinea(idx, "caducidad", e.target.value)} disabled={bloqueado} />
              </Field>
            </div>

            {ln.cantidadPedida != null && ln.cantidadPedida !== "" && (() => {
              const pedida = Number(ln.cantidadPedida) || 0;
              const dif = totalUds - pedida;
              if (Math.abs(dif) < 0.001) {
                return (
                  <div className="text-[11.5px] mb-2" style={{ color: C.accent }}>
                    Coincide con lo pedido ({fmt(pedida)} {ln.unidad}).
                  </div>
                );
              }
              return (
                <div className="text-[11.5px] mb-2" style={{ color: C.amber }}>
                  Pediste {fmt(pedida)} {ln.unidad} y llegan {fmt(totalUds)}
                  {" "}({dif > 0 ? "+" : ""}{fmt(dif)}). Quedará como recibido parcial.
                </div>
              );
            })()}

            {totalUds > 0 && (
              <div className="pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
                <div className="text-[11.5px] mono" style={{ color: C.inkSoft }}>
                  {ln.precioPor === "unidad" && ln.tipoUnidad !== "peso"
                    ? `${fmt(Number(ln.cantidad) || 0)} bultos × ${fmt(uds)} uds × €${fmt(Number(ln.precioBruto) || 0)}`
                    : `${fmt(Number(ln.cantidad) || 0)} × €${fmt(Number(ln.precioBruto) || 0)}`}
                  {Number(ln.dtoPct) ? ` − ${fmt(Number(ln.dtoPct))}%` : ""}
                  {Number(ln.envase) ? ` + €${fmt(Number(ln.envase))} envase` : ""} = €{fmt(imp)}
                </div>
                <div className="text-[11.5px] mono" style={{ color: C.accent }}>
                  Entran {fmt(totalUds)} {ln.unidad} · €{fmt(costoUd)} cada {ln.tipoUnidad === "peso" ? "kg" : "unidad"}
                </div>
                {Number(ln.contenido) > 0 && ln.tipoUnidad !== "peso" && (
                  <div className="text-[11.5px] mono" style={{ color: C.accent }}>
                    Contenido total {fmt(totalUds * Number(ln.contenido))} {ln.unidadContenido || ""} ·
                    €{fmt(costoUd / Number(ln.contenido))} por {ln.unidadContenido || "unidad de contenido"}
                  </div>
                )}
              </div>
            )}
          </Card>
        );
      })}

      {!bloqueado && (
        <button type="button" onClick={addLinea} className="text-[12.5px] font-medium mb-4" style={{ color: C.accent }}>
          + Añadir línea
        </button>
      )}

      <Card className="mb-4" style={{ background: totalPapel > 0 ? (cuadra ? C.accentSoft : C.amberSoft) : C.bg, border: "none" }}>
        <div className="grid grid-cols-3 gap-3 text-center mb-2">
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Base imponible</div>
            <div className="mono font-semibold">€{fmt(baseTotal)}</div>
            {cargosBase > 0 && (
              <div className="text-[10.5px] mono" style={{ color: C.inkSoft }}>+ cargos €{fmt(cargosBase)}</div>
            )}
          </div>
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>IVA</div>
            <div className="mono font-semibold">€{fmt(ivaTotal)}</div>
          </div>
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Total calculado</div>
            <div className="mono font-bold text-[16px]">€{fmt(totalCalculado)}</div>
          </div>
        </div>
        {totalPapel > 0 && (
          <div className="text-[12px] text-center pt-2" style={{ borderTop: "1px solid rgba(0,0,0,0.08)" }}>
            {cuadra ? (
              <span style={{ color: C.accent }}>Cuadra con el total del papel (€{fmt(totalPapel)}).</span>
            ) : (
              <span style={{ color: C.amber }}>
                No cuadra: el papel dice €{fmt(totalPapel)} y sale €{fmt(totalCalculado)}
                {" "}(diferencia {descuadre > 0 ? "+" : ""}€{fmt(descuadre)}). Revisa descuentos, portes o IVA.
              </span>
            )}
          </div>
        )}
      </Card>

      {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}

      {!bloqueado && (
        <div className="flex gap-2 flex-wrap">
          <Btn onClick={darEntrada}><CheckCircle2 size={14} /> Dar entrada al almacén</Btn>
          <Btn variant="ghost" onClick={guardarBorrador}>Guardar como borrador</Btn>
          <Btn variant="ghost" onClick={() => { setModo("lista"); setAlb(null); }}>Cancelar</Btn>
        </div>
      )}
    </div>
  );
}

/* ================= RESULTADOS ================= */
function Resultados({ movimientos, productos, productoPorId, gastosGenerales, addGasto, deleteGasto, empleados = [] }) {
  const [desde, setDesde] = useState(primerDiaMes(new Date()));
  const [hasta, setHasta] = useState(ultimoDiaMes(new Date()));
  const [showGasto, setShowGasto] = useState(false);
  const [gastoForm, setGastoForm] = useState({ concepto: "", importe: "" });
  const [gastoError, setGastoError] = useState("");

  function irMesActual() {
    setDesde(primerDiaMes(new Date()));
    setHasta(ultimoDiaMes(new Date()));
  }
  function irMesAnterior() {
    const d = new Date();
    d.setMonth(d.getMonth() - 1);
    setDesde(primerDiaMes(d));
    setHasta(ultimoDiaMes(d));
  }

  const salidasPeriodo = useMemo(
    () => movimientos.filter((m) => m.tipo === "salida" && m.motivo && m.fecha >= desde && m.fecha <= hasta),
    [movimientos, desde, hasta]
  );

  const ventas = salidasPeriodo.filter((m) => m.motivo === "Venta");
  const mermas = salidasPeriodo.filter((m) => m.motivo === "Merma");
  const autoconsumo = salidasPeriodo.filter((m) => m.motivo === "Autoconsumo");
  const roturas = salidasPeriodo.filter((m) => m.motivo === "Rotura");

  const ingresos = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0), 0);
  const costeVentas = ventas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
  const margenBruto = ingresos - costeVentas;
  const margenPct = ingresos > 0 ? (margenBruto / ingresos) * 100 : null;

  const valorMermas = mermas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
  const valorAutoconsumo = autoconsumo.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);
  const valorRoturas = roturas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0), 0);

  const mermasPorProducto = useMemo(() => {
    const mapa = {};
    mermas.forEach((m) => {
      mapa[m.productoId] = (mapa[m.productoId] || 0) + (Number(m.cantidad) || 0) * (Number(m.costoUnitario) || 0);
    });
    return Object.entries(mapa)
      .map(([id, valor]) => ({ producto: productoPorId(id), valor }))
      .filter((x) => x.producto && x.valor > 0)
      .sort((a, b) => b.valor - a.valor)
      .slice(0, 5);
  }, [mermas, productoPorId]);

  const dias = Math.max(1, Math.round((new Date(hasta) - new Date(desde)) / 86400000) + 1);
  const gastosGeneralesMensual = gastosGenerales.reduce((a, g) => a + (Number(g.importe) || 0), 0);

  // Coste de personal: usa el coste para la empresa si lo pusiste; si no,
  // una estimación aproximada (bruto × 1,32) que cubre Seguridad Social a
  // cargo de la empresa. Solo cuenta a los empleados de alta (activo !== false).
  const costePersonalMensual = empleados
    .filter((e) => e.activo !== false)
    .reduce((a, e) => {
      const bruto = Number(e.salarioBrutoMensual) || 0;
      const coste = e.costeEmpresaMensual !== "" && e.costeEmpresaMensual != null ? Number(e.costeEmpresaMensual) : bruto * 1.32;
      return a + coste;
    }, 0);
  const personalEsEstimado = empleados.some((e) => e.activo !== false && (e.costeEmpresaMensual === "" || e.costeEmpresaMensual == null) && Number(e.salarioBrutoMensual) > 0);

  const gastosTotalMensual = gastosGeneralesMensual + costePersonalMensual;
  const gastosPeriodo = gastosTotalMensual * (dias / 30);
  const resultadoNeto = margenBruto - gastosPeriodo;

  const huboLegacy = movimientos.some((m) => m.tipo === "salida" && !m.motivo);

  // Punto de equilibrio: si ya hay ventas reales en el periodo se usa su margen;
  // si todavía no hay ninguna, se usa el margen medio de los productos con
  // precio puesto en el catálogo, dejando claro que es una estimación.
  const margenTeorico = useMemo(() => {
    const conPrecio = productos.filter((p) => Number(p.precioVenta) > 0);
    if (!conPrecio.length) return null;
    const total = conPrecio.reduce((a, p) => a + (margenDe(p) || 0), 0);
    return total / conPrecio.length;
  }, [productos]);

  const margenParaPE = ingresos > 0 ? margenPct : margenTeorico;
  const esTeorico = !(ingresos > 0);
  const peMensual = margenParaPE > 0 ? gastosTotalMensual / (margenParaPE / 100) : null;
  const pePeriodo = margenParaPE > 0 ? gastosPeriodo / (margenParaPE / 100) : null;


  function submitGasto() {
    if (!gastoForm.concepto.trim()) {
      setGastoError("Escribe el concepto del gasto.");
      return;
    }
    if (!Number(gastoForm.importe) || Number(gastoForm.importe) <= 0) {
      setGastoError("Escribe un importe mensual mayor que cero.");
      return;
    }
    setGastoError("");
    addGasto({ concepto: gastoForm.concepto.trim(), importe: Number(gastoForm.importe) });
    setGastoForm({ concepto: "", importe: "" });
    setShowGasto(false);
  }

  return (
    <div>
      <SectionTitle>Resultados</SectionTitle>

      <Card className="mb-4">
        <div className="flex flex-wrap gap-2 mb-3">
          <Btn small variant="ghost" onClick={irMesActual}>Este mes</Btn>
          <Btn small variant="ghost" onClick={irMesAnterior}>Mes anterior</Btn>
        </div>
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
          <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
        </div>
      </Card>

      {huboLegacy && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12px]">
            Algunas salidas registradas antes de esta actualización no tienen motivo ni precio de venta, así que no
            entran en este cálculo. A partir de ahora, cada salida que registres desde Productos sí alimentará estos resultados.
          </div>
        </Card>
      )}

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Ingresos por ventas</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: C.accent }}>€{fmt(ingresos)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Coste de lo vendido</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(costeVentas)}</div>
        </Card>
      </div>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="flex items-center justify-between">
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Margen bruto</div>
            <div className="text-2xl font-bold mono">€{fmt(margenBruto)}</div>
          </div>
          <div className="text-right">
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Sobre ventas</div>
            <div className="text-xl font-semibold mono" style={{ color: margenPct == null ? C.ink : margenPct < 15 ? C.red : C.accent }}>
              {margenPct == null ? "—" : `${fmt(margenPct)}%`}
            </div>
          </div>
        </div>
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Lo que se ha perdido (a coste)</div>
      <div className="grid grid-cols-3 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Mermas / caducidad</div>
          <div className="text-lg font-semibold mono mt-1" style={{ color: valorMermas > 0 ? C.red : C.ink }}>€{fmt(valorMermas)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Autoconsumo</div>
          <div className="text-lg font-semibold mono mt-1">€{fmt(valorAutoconsumo)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Roturas</div>
          <div className="text-lg font-semibold mono mt-1" style={{ color: valorRoturas > 0 ? C.red : C.ink }}>€{fmt(valorRoturas)}</div>
        </Card>
      </div>

      {mermasPorProducto.length > 0 && (
        <Card className="mb-4">
          <div className="text-[12.5px] font-semibold mb-2">Dónde más se pierde por mermas</div>
          <div className="space-y-1.5">
            {mermasPorProducto.map((x, i) => (
              <div key={i} className="flex items-center justify-between text-[12.5px]">
                <span>{x.producto.nombre}</span>
                <span className="mono font-semibold" style={{ color: C.red }}>€{fmt(x.valor)}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      <div className="flex items-center justify-between mb-2">
        <div className="text-[12px] font-medium" style={{ color: C.inkSoft }}>Gastos generales del negocio (mensuales)</div>
        <Btn small variant="ghost" onClick={() => setShowGasto(true)}><Plus size={13} /> Añadir gasto</Btn>
      </div>

      {gastosGenerales.length === 0 ? <Empty text="No has añadido gastos fijos (alquiler, luz, seguros…)." /> : (
        <div className="space-y-1.5 mb-4">
          {gastosGenerales.map((g) => (
            <Card key={g.id}>
              <div className="flex items-center justify-between">
                <span className="text-[12.5px]">{g.concepto}</span>
                <div className="flex items-center gap-3">
                  <span className="mono text-[12.5px]">€{fmt(g.importe)}/mes</span>
                  <button onClick={() => deleteGasto(g.id)}><Trash2 size={14} color={C.inkSoft} /></button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      <Card style={{ background: C.bg, border: `1px solid ${C.line}` }}>
        <div className="flex items-center justify-between mb-1">
          <span className="text-[12px]" style={{ color: C.inkSoft }}>Gastos generales del periodo</span>
          <span className="mono">€{fmt(gastosGeneralesMensual * (dias / 30))}</span>
        </div>
        {costePersonalMensual > 0 && (
          <div className="flex items-center justify-between mb-1">
            <span className="text-[12px]" style={{ color: C.inkSoft }}>
              Coste de personal del periodo{personalEsEstimado ? " (parte estimado)" : ""}
            </span>
            <span className="mono">€{fmt(costePersonalMensual * (dias / 30))}</span>
          </div>
        )}
        <div className="flex items-center justify-between pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
          <span className="font-semibold">Resultado neto aproximado</span>
          <span className="mono font-bold text-[17px]" style={{ color: resultadoNeto >= 0 ? C.accent : C.red }}>
            {resultadoNeto >= 0 ? "" : "−"}€{fmt(Math.abs(resultadoNeto))}
          </span>
        </div>
        <div className="text-[10.5px] mt-1" style={{ color: C.inkSoft }}>
          Aproximado: los gastos fijos y el personal se reparten a prorrata de los días del periodo, no día a día real
          {personalEsEstimado ? ", y el coste de personal sin cifra exacta usa bruto × 1,32 como aproximación." : "."}
        </div>
      </Card>

      {gastosTotalMensual > 0 && (
        <Card className="mt-4" style={{ background: C.ink, color: "#fff" }}>
          <div className="text-[11px] tracking-wide uppercase" style={{ color: "#9CB6A9" }}>Punto de equilibrio</div>
          {margenParaPE > 0 ? (
            <>
              <div className="text-[12.5px] mt-1 mb-2">
                Con un margen {esTeorico ? "medio del catálogo" : "real de este periodo"} del <b>{fmt(margenParaPE)}%</b>,
                necesitas facturar esto solo para cubrir tus gastos fijos{costePersonalMensual > 0 ? " y el personal" : ""}, sin ganar ni perder:
              </div>
              <div className="grid grid-cols-2 gap-3">
                <div>
                  <div className="text-[11px]" style={{ color: "#9CB6A9" }}>Al mes</div>
                  <div className="text-xl font-bold mono">€{fmt(peMensual)}</div>
                </div>
                <div>
                  <div className="text-[11px]" style={{ color: "#9CB6A9" }}>En este periodo ({dias} días)</div>
                  <div className="text-xl font-bold mono">€{fmt(pePeriodo)}</div>
                </div>
              </div>
              {esTeorico && (
                <div className="text-[10.5px] mt-2" style={{ color: "#9CB6A9" }}>
                  Todavía no hay ventas registradas en este periodo, así que se usa el margen medio de los productos
                  que ya tienen precio en el catálogo. En cuanto registres ventas reales, se calculará con datos de verdad.
                </div>
              )}
            </>
          ) : (
            <div className="text-[12.5px] mt-1">
              Ponle precio de venta a tus productos (o registra alguna venta) para poder calcular esto.
            </div>
          )}
        </Card>
      )}

      {showGasto && (
        <Modal onClose={() => setShowGasto(false)} title="Añadir gasto general">
          <Field label="Concepto">
            <Input value={gastoForm.concepto} onChange={(e) => setGastoForm({ ...gastoForm, concepto: e.target.value })} placeholder="Alquiler, luz, agua, seguros…" />
          </Field>
          <Field label="Importe mensual (€)">
            <Input type="number" step="0.01" value={gastoForm.importe} onChange={(e) => setGastoForm({ ...gastoForm, importe: e.target.value })} />
          </Field>
          {gastoError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{gastoError}</div>}
          <div className="flex gap-2">
            <Btn onClick={submitGasto}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setShowGasto(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= CUENTAS POR PAGAR ================= */
function CuentasPorPagar({ facturasPorPagar, totalPendientePago, marcarPagada }) {
  const [verPagadas, setVerPagadas] = useState(false);

  const pendientes = facturasPorPagar.filter((f) => !f.pagada);
  const pagadas = facturasPorPagar.filter((f) => f.pagada);
  const vencidas = pendientes.filter((f) => f.dias !== null && f.dias < 0);
  const proximas = pendientes.filter((f) => f.dias !== null && f.dias >= 0 && f.dias <= 7);
  const sinDatos = pendientes.filter((f) => f.dias === null);

  const colorPara = (f) => {
    if (f.dias === null) return C.inkSoft;
    if (f.dias < 0) return C.red;
    if (f.dias <= 7) return C.amber;
    return C.ink;
  };
  const textoPara = (f) => {
    if (f.dias === null) return "Sin días de pago";
    if (f.dias < 0) return `Vencida hace ${Math.abs(f.dias)} d`;
    if (f.dias === 0) return "Vence hoy";
    return `Vence en ${f.dias} d`;
  };

  return (
    <div>
      <SectionTitle>Cuentas por pagar</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Se calcula solo con las facturas ya dadas de entrada por Albaranes. El vencimiento sale de la fecha de
          factura más los días de pago que tengas puestos en cada proveedor — si falta ese dato, no se puede calcular
          y te lo señala en gris.
        </div>
      </Card>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Pendiente de pagar</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(totalPendientePago)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Vencidas / próximos 7 días</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: vencidas.length ? C.red : proximas.length ? C.amber : C.ink }}>
            {vencidas.length + proximas.length}
          </div>
        </Card>
      </div>

      {pendientes.length === 0 ? <Empty text="No hay facturas pendientes de pago." /> : (
        <div className="space-y-2 mb-4">
          {pendientes.map((f) => (
            <Card key={f.id}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="font-semibold">{f.proveedor ? f.proveedor.nombre : "Proveedor eliminado"}</div>
                  <div className="text-[12px]" style={{ color: C.inkSoft }}>
                    Factura {f.numeroFactura} · {f.fechaFactura}
                    {f.vencimiento && <> · vence {new Date(f.vencimiento).toLocaleDateString("es-ES")}</>}
                  </div>
                </div>
                <div className="text-right">
                  <div className="mono font-semibold">€{fmt(f.total)}</div>
                  <div className="text-[11.5px] font-medium mt-0.5" style={{ color: colorPara(f) }}>{textoPara(f)}</div>
                </div>
              </div>
              <div className="mt-2">
                <Btn small onClick={() => marcarPagada(f.id, true)}><CheckCircle2 size={13} /> Marcar como pagada</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

      {sinDatos.length > 0 && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12px]">
            {sinDatos.length} factura(s) sin poder calcular vencimiento porque el proveedor no tiene "días de pago"
            puestos. Entra a Proveedores y añádeselo para que aparezcan bien ordenadas aquí.
          </div>
        </Card>
      )}

      <button onClick={() => setVerPagadas((s) => !s)} className="text-[12.5px] font-medium mb-2" style={{ color: C.accent }}>
        {verPagadas ? "Ocultar" : "Ver"} facturas ya pagadas ({pagadas.length})
      </button>

      {verPagadas && (
        <div className="space-y-2">
          {pagadas.length === 0 ? <Empty text="Todavía no has marcado ninguna como pagada." /> : pagadas.map((f) => (
            <Card key={f.id} style={{ background: C.bg }}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-[13px]">{f.proveedor ? f.proveedor.nombre : "Proveedor eliminado"}</div>
                  <div className="text-[11px]" style={{ color: C.inkSoft }}>Factura {f.numeroFactura}</div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="mono text-[12.5px]" style={{ color: C.inkSoft }}>€{fmt(f.total)}</span>
                  <Btn small variant="ghost" onClick={() => marcarPagada(f.id, false)}>Deshacer</Btn>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= PERSONAL ================= */
const TIPOS_CONTRATO = [
  "Indefinido",
  "Indefinido fijo-discontinuo",
  "Temporal — circunstancias de la producción",
  "Temporal — sustitución",
  "Formación en alternancia",
  "Obtención de práctica profesional",
];

function blankEmpleado() {
  return {
    nombre: "",
    dni: "",
    puesto: "",
    tipoContrato: "Indefinido",
    fechaAlta: todayISO(),
    fechaFinContrato: "",
    horasSemanales: 40,
    pagas: 14,
    salarioBrutoMensual: "",
    costeEmpresaMensual: "",
    diasVacacionesAnuales: 30,
    documentos: [],
    activo: true,
  };
}

function Personal({ empleados, addEmpleado, updateEmpleado, deleteEmpleado, registrarAusencia, eliminarAusencia, registrarEpi, eliminarEpi, documentosPersonalCaducan }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(blankEmpleado());
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [ausenciaFor, setAusenciaFor] = useState(null);
  const [ausenciaForm, setAusenciaForm] = useState({ tipo: "Vacaciones", fechaInicio: todayISO(), fechaFin: todayISO() });
  const [epiFor, setEpiFor] = useState(null);
  const [epiForm, setEpiForm] = useState({ nombre: "", firmado: false });
  const [detalleId, setDetalleId] = useState(null);

  function resetForm() {
    setForm(blankEmpleado());
    setEditingId(null);
    setError("");
  }

  function openEdit(e) {
    setEditingId(e.id);
    setForm({
      nombre: e.nombre || "", dni: e.dni || "", puesto: e.puesto || "",
      tipoContrato: e.tipoContrato || "Indefinido", fechaAlta: e.fechaAlta || todayISO(),
      fechaFinContrato: e.fechaFinContrato || "", horasSemanales: e.horasSemanales ?? 40, pagas: e.pagas ?? 14,
      salarioBrutoMensual: e.salarioBrutoMensual ?? "", costeEmpresaMensual: e.costeEmpresaMensual ?? "",
      diasVacacionesAnuales: e.diasVacacionesAnuales ?? 30,
      documentos: (e.documentos || []).map((d) => ({ ...d })),
      activo: e.activo !== false,
    });
    setError("");
    setShowForm(true);
  }

  function addDocumento() {
    setForm((f) => ({ ...f, documentos: [...f.documentos, { id: uid(), nombre: "", fechaCaducidad: "" }] }));
  }
  function updateDocumento(idx, campo, valor) {
    setForm((f) => ({ ...f, documentos: f.documentos.map((d, i) => (i === idx ? { ...d, [campo]: valor } : d)) }));
  }
  function quitarDocumento(idx) {
    setForm((f) => ({ ...f, documentos: f.documentos.filter((_, i) => i !== idx) }));
  }

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del empleado.");
      return;
    }
    setError("");
    const datos = {
      ...form,
      horasSemanales: Number(form.horasSemanales) || 0,
      pagas: Number(form.pagas) || 14,
      salarioBrutoMensual: Number(form.salarioBrutoMensual) || 0,
      costeEmpresaMensual: form.costeEmpresaMensual === "" ? "" : Number(form.costeEmpresaMensual),
      diasVacacionesAnuales: Number(form.diasVacacionesAnuales) || 0,
    };
    if (editingId) updateEmpleado(editingId, datos);
    else addEmpleado(datos);
    resetForm();
    setShowForm(false);
  }

  function diasAusencia(ini, fin) {
    const a = new Date(ini), b = new Date(fin);
    if (isNaN(a) || isNaN(b)) return 0;
    return Math.max(1, Math.round((b - a) / 86400000) + 1);
  }

  function submitAusencia() {
    registrarAusencia(ausenciaFor, {
      tipo: ausenciaForm.tipo,
      fechaInicio: ausenciaForm.fechaInicio,
      fechaFin: ausenciaForm.fechaFin,
      dias: diasAusencia(ausenciaForm.fechaInicio, ausenciaForm.fechaFin),
    });
    setAusenciaFor(null);
    setAusenciaForm({ tipo: "Vacaciones", fechaInicio: todayISO(), fechaFin: todayISO() });
  }

  const anioActual = new Date().getFullYear();
  function vacacionesUsadas(e) {
    return (e.ausencias || [])
      .filter((a) => a.tipo === "Vacaciones" && new Date(a.fechaInicio).getFullYear() === anioActual)
      .reduce((acc, a) => acc + (Number(a.dias) || 0), 0);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { if (showForm) resetForm(); setShowForm((s) => !s); }}><Plus size={15} /> Nuevo empleado</Btn>}>
        Personal
      </SectionTitle>

      <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Aquí llevas la ficha de cada empleado, sus documentos y sus vacaciones. Este programa <b>no calcula nóminas</b>
          (retenciones de IRPF, cotizaciones a la Seguridad Social): eso debe hacerlo tu gestoría o un programa de
          nóminas certificado, porque las cifras cambian cada año y un error tiene consecuencias legales reales.
        </div>
      </Card>

      {documentosPersonalCaducan.length > 0 && (
        <Card className="mb-4" style={{ background: C.red + "15", border: "none" }}>
          <div className="text-[12.5px] font-semibold mb-2 flex items-center gap-1.5">
            <AlertTriangle size={15} color={C.red} /> Documentos y contratos que necesitan atención
          </div>
          <div className="space-y-1">
            {documentosPersonalCaducan.slice(0, 8).map((d) => (
              <div key={d.id} className="flex items-center justify-between text-[12px]">
                <span>{d.empleado} · {d.concepto}</span>
                <span className="mono font-semibold" style={{ color: d.dias < 0 ? C.red : d.dias <= 7 ? C.amber : C.inkSoft }}>
                  {d.dias < 0 ? `venció hace ${Math.abs(d.dias)} d` : d.dias === 0 ? "hoy" : `en ${d.dias} d`}
                </span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando empleado" : "Nuevo empleado"}</div>

          <Bloque titulo="1 · Identificación">
            <div className="grid md:grid-cols-3 gap-x-4">
              <Field label="Nombre completo"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} /></Field>
              <Field label="DNI / NIE (opcional)"><Input value={form.dni} onChange={(e) => setForm({ ...form, dni: e.target.value })} /></Field>
              <Field label="Puesto / categoría"><Input value={form.puesto} onChange={(e) => setForm({ ...form, puesto: e.target.value })} placeholder="Dependienta, obrador…" /></Field>
            </div>
          </Bloque>

          <Bloque titulo="2 · Contrato">
            <div className="grid md:grid-cols-3 gap-x-4">
              <Field label="Tipo de contrato">
                <select value={form.tipoContrato} onChange={(e) => setForm({ ...form, tipoContrato: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
                  {TIPOS_CONTRATO.map((t) => <option key={t} value={t}>{t}</option>)}
                </select>
              </Field>
              <Field label="Fecha de alta"><Input type="date" value={form.fechaAlta} onChange={(e) => setForm({ ...form, fechaAlta: e.target.value })} /></Field>
              {form.tipoContrato.startsWith("Temporal") || form.tipoContrato.startsWith("Formación") || form.tipoContrato.startsWith("Obtención") ? (
                <Field label="Fecha de fin de contrato"><Input type="date" value={form.fechaFinContrato} onChange={(e) => setForm({ ...form, fechaFinContrato: e.target.value })} /></Field>
              ) : (
                <Field label="Horas semanales"><Input type="number" value={form.horasSemanales} onChange={(e) => setForm({ ...form, horasSemanales: e.target.value })} /></Field>
              )}
            </div>
            {(form.tipoContrato.startsWith("Temporal") || form.tipoContrato.startsWith("Formación") || form.tipoContrato.startsWith("Obtención")) && (
              <Field label="Horas semanales"><Input type="number" value={form.horasSemanales} onChange={(e) => setForm({ ...form, horasSemanales: e.target.value })} /></Field>
            )}
          </Bloque>

          <Bloque titulo="3 · Retribución">
            <div className="grid md:grid-cols-3 gap-x-4">
              <Field label="Salario bruto mensual (€)"><Input type="number" step="0.01" value={form.salarioBrutoMensual} onChange={(e) => setForm({ ...form, salarioBrutoMensual: e.target.value })} /></Field>
              <Field label="Nº de pagas al año"><Input type="number" value={form.pagas} onChange={(e) => setForm({ ...form, pagas: e.target.value })} placeholder="12 o 14" /></Field>
              <Field label="Coste total mensual para la empresa (€, opcional)">
                <Input type="number" step="0.01" value={form.costeEmpresaMensual} onChange={(e) => setForm({ ...form, costeEmpresaMensual: e.target.value })} placeholder="Bruto + Seg. Social, según tu gestoría" />
              </Field>
            </div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>
              Si dejas el coste para la empresa en blanco, se usará una estimación aproximada (bruto × 1,32) para
              calcular resultados — pídele la cifra exacta a tu gestoría cuando la tengas.
            </div>
          </Bloque>

          <Bloque titulo="4 · Vacaciones">
            <Field label="Días de vacaciones al año"><Input type="number" value={form.diasVacacionesAnuales} onChange={(e) => setForm({ ...form, diasVacacionesAnuales: e.target.value })} /></Field>
          </Bloque>

          <Bloque titulo="5 · Documentos con caducidad (opcional)">
            <div className="text-[11px] mb-2" style={{ color: C.inkSoft }}>
              Certificado médico, formación en manipulación de alimentos, permiso de trabajo…
            </div>
            {form.documentos.map((d, idx) => (
              <div key={d.id} className="grid grid-cols-5 gap-2 items-center mb-2">
                <Input className="col-span-3" value={d.nombre} onChange={(e) => updateDocumento(idx, "nombre", e.target.value)} placeholder="Formación manipulador de alimentos" />
                <Input className="col-span-1" type="date" value={d.fechaCaducidad} onChange={(e) => updateDocumento(idx, "fechaCaducidad", e.target.value)} />
                <button type="button" onClick={() => quitarDocumento(idx)}><X size={16} color={C.inkSoft} /></button>
              </div>
            ))}
            <button type="button" onClick={addDocumento} className="text-[12.5px] font-medium" style={{ color: C.accent }}>+ Añadir documento</button>
            {" · "}
            <button
              type="button"
              onClick={() => setForm((f) => ({ ...f, documentos: [...f.documentos, { id: uid(), nombre: "Formación PRL", fechaCaducidad: "" }] }))}
              className="text-[12.5px] font-medium"
              style={{ color: C.amber }}
            >
              + Formación PRL (obligatoria)
            </button>
          </Bloque>

          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Guardar empleado"}</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); resetForm(); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {empleados.length === 0 ? <Empty text="Todavía no has añadido a nadie." /> : (
        <div className="grid md:grid-cols-2 gap-3">
          {empleados.map((e) => {
            const usados = vacacionesUsadas(e);
            const total = Number(e.diasVacacionesAnuales) || 0;
            return (
              <Card key={e.id}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-semibold flex items-center gap-1.5">
                      {e.nombre}
                      {e.activo === false && <Pill color={C.inkSoft}>baja</Pill>}
                    </div>
                    <div className="text-[12px] mt-0.5" style={{ color: C.inkSoft }}>{e.puesto} · {e.tipoContrato}</div>
                  </div>
                  <button onClick={() => setConfirmDeleteId(e.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                </div>

                <div className="mt-3 text-[12px] space-y-1" style={{ color: C.inkSoft }}>
                  <div>Alta: {e.fechaAlta}{e.fechaFinContrato && ` · Fin de contrato: ${e.fechaFinContrato}`}</div>
                  {e.salarioBrutoMensual > 0 && <div className="mono">Bruto: €{fmt(e.salarioBrutoMensual)}/mes ({e.pagas} pagas)</div>}
                  <div>Vacaciones: {usados} / {total} días usados este año</div>
                  {(e.documentos || []).length > 0 && (
                    <div>
                      {e.documentos.map((d) => d.nombre).filter(Boolean).join(" · ")}
                    </div>
                  )}
                </div>

                <div className="mt-3 flex gap-2 flex-wrap">
                  <Btn small variant="ghost" onClick={() => openEdit(e)}>Editar</Btn>
                  <Btn small variant="ghost" onClick={() => setAusenciaFor(e.id)}>Registrar ausencia</Btn>
                  <Btn small variant="ghost" onClick={() => setEpiFor(e.id)}>Entregar EPI</Btn>
                  <Btn small variant="ghost" onClick={() => setDetalleId(detalleId === e.id ? null : e.id)}>
                    {detalleId === e.id ? "Ocultar historial" : "Ver historial"}
                  </Btn>
                </div>

                {detalleId === e.id && (
                  <div className="mt-3 pt-3" style={{ borderTop: `1px solid ${C.line}` }}>
                    <div className="text-[11px] font-semibold uppercase tracking-wide mb-1" style={{ color: C.inkSoft }}>Ausencias</div>
                    {(e.ausencias || []).length === 0 ? <Empty text="Sin ausencias registradas." /> : (
                      <div className="space-y-1 mb-3">
                        {[...(e.ausencias || [])].reverse().map((a) => (
                          <div key={a.id} className="flex items-center justify-between text-[12px]">
                            <span>{a.tipo}: {a.fechaInicio} → {a.fechaFin} ({a.dias} d)</span>
                            <button onClick={() => eliminarAusencia(e.id, a.id)}><X size={14} color={C.inkSoft} /></button>
                          </div>
                        ))}
                      </div>
                    )}
                    <div className="text-[11px] font-semibold uppercase tracking-wide mb-1 pt-2" style={{ color: C.inkSoft, borderTop: `1px solid ${C.line}` }}>EPIs entregados</div>
                    {(e.epis || []).length === 0 ? <Empty text="Sin EPIs registrados." /> : (
                      <div className="space-y-1">
                        {[...(e.epis || [])].reverse().map((epi) => (
                          <div key={epi.id} className="flex items-center justify-between text-[12px]">
                            <span>{epi.nombre} · {epi.fecha} {epi.firmado ? "· firmado" : "· sin firmar"}</span>
                            <button onClick={() => eliminarEpi(e.id, epi.id)}><X size={14} color={C.inkSoft} /></button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}
              </Card>
            );
          })}
        </div>
      )}

      {ausenciaFor && (
        <Modal onClose={() => setAusenciaFor(null)} title="Registrar ausencia">
          <Field label="Tipo">
            <select value={ausenciaForm.tipo} onChange={(e) => setAusenciaForm({ ...ausenciaForm, tipo: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
              <option value="Vacaciones">Vacaciones</option>
              <option value="Baja médica">Baja médica</option>
              <option value="Otro">Otro permiso</option>
            </select>
          </Field>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Desde"><Input type="date" value={ausenciaForm.fechaInicio} onChange={(e) => setAusenciaForm({ ...ausenciaForm, fechaInicio: e.target.value })} /></Field>
            <Field label="Hasta"><Input type="date" value={ausenciaForm.fechaFin} onChange={(e) => setAusenciaForm({ ...ausenciaForm, fechaFin: e.target.value })} /></Field>
          </div>
          <div className="text-[11.5px] mb-3" style={{ color: C.inkSoft }}>
            {diasAusencia(ausenciaForm.fechaInicio, ausenciaForm.fechaFin)} día(s) naturales, contando ambos extremos.
          </div>
          <div className="flex gap-2">
            <Btn onClick={submitAusencia}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setAusenciaFor(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {epiFor && (
        <Modal onClose={() => setEpiFor(null)} title="Entregar EPI">
          <div className="text-[12.5px] mb-3" style={{ color: C.inkSoft }}>
            Deja constancia de qué equipo de protección le has dado. Es parte de la obligación de PRL.
          </div>
          <Field label="Equipo entregado">
            <Input value={epiForm.nombre} onChange={(e) => setEpiForm({ ...epiForm, nombre: e.target.value })} placeholder="Guantes térmicos, calzado antideslizante…" />
          </Field>
          <label className="flex items-center gap-2 mb-3 text-[12.5px]">
            <input type="checkbox" checked={epiForm.firmado} onChange={(e) => setEpiForm({ ...epiForm, firmado: e.target.checked })} />
            El empleado ha firmado el recibí
          </label>
          <div className="flex gap-2">
            <Btn onClick={() => { if (epiForm.nombre.trim()) { registrarEpi(epiFor, epiForm); setEpiFor(null); setEpiForm({ nombre: "", firmado: false }); } }}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setEpiFor(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {confirmDeleteId && (
        <Modal onClose={() => setConfirmDeleteId(null)} title="Eliminar empleado">
          <div className="text-[12.5px] mb-4">
            Se borra la ficha completa, incluidas sus ausencias y documentos. Si solo ha causado baja, mejor edítalo
            y desmárcalo como activo en vez de borrarlo, para conservar el historial.
          </div>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { deleteEmpleado(confirmDeleteId); setConfirmDeleteId(null); }}>Sí, eliminar</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= REGISTRO HORARIO ================= */
function inicioSemana(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay(); // 0 domingo .. 6 sabado
  const diff = dia === 0 ? -6 : 1 - dia; // lunes como inicio
  const l = new Date(d);
  l.setDate(d.getDate() + diff);
  return l.toISOString().slice(0, 10);
}

function RegistroHorario({ empleados, fichajes, fichar, addFichajeManual, updateFichaje, eliminarFichaje, fichajesAbiertos }) {
  const activos = empleados.filter((e) => e.activo !== false);
  const [desde, setDesde] = useState(inicioSemana(new Date()));
  const [hasta, setHasta] = useState(todayISO());
  const [showManual, setShowManual] = useState(false);
  const [manual, setManual] = useState({ empleadoId: activos[0]?.id || "", fecha: todayISO(), tipo: "entrada", hora: "09:00" });
  const [manualError, setManualError] = useState("");
  const [showExportar, setShowExportar] = useState(false);
  const [copiado, setCopiado] = useState(false);

  function irEstaSemana() {
    setDesde(inicioSemana(new Date()));
    setHasta(todayISO());
  }
  function irSemanaAnterior() {
    const d = new Date();
    d.setDate(d.getDate() - 7);
    const ini = inicioSemana(d);
    const fin = new Date(ini);
    fin.setDate(fin.getDate() + 6);
    setDesde(ini);
    setHasta(fin.toISOString().slice(0, 10));
  }

  const estadoHoy = activos.map((e) => {
    const deHoy = fichajes.filter((f) => f.empleadoId === e.id && f.fecha === todayISO()).sort((a, b) => (a.hora || "").localeCompare(b.hora || ""));
    const entradas = deHoy.filter((f) => f.tipo === "entrada");
    const salidas = deHoy.filter((f) => f.tipo === "salida");
    const abierto = entradas.length > salidas.length;
    return { empleado: e, ultimaEntrada: entradas[entradas.length - 1], abierto, totalFichajesHoy: deHoy.length };
  });

  // Agrupar por empleado + fecha dentro del rango, para ver horas trabajadas por día
  const filasHistorial = useMemo(() => {
    const grupos = {};
    fichajes
      .filter((f) => f.fecha >= desde && f.fecha <= hasta)
      .forEach((f) => {
        const key = `${f.empleadoId}-${f.fecha}`;
        if (!grupos[key]) grupos[key] = { empleadoId: f.empleadoId, fecha: f.fecha, entradas: [], salidas: [] };
        if (f.tipo === "entrada") grupos[key].entradas.push(f);
        else grupos[key].salidas.push(f);
      });
    return Object.values(grupos)
      .map((g) => {
        const emp = empleados.find((e) => e.id === g.empleadoId);
        const entrada = g.entradas.sort((a, b) => a.hora.localeCompare(b.hora))[0];
        const salida = g.salidas.sort((a, b) => a.hora.localeCompare(b.hora)).slice(-1)[0];
        let horas = null;
        if (entrada && salida) {
          const [h1, m1] = entrada.hora.split(":").map(Number);
          const [h2, m2] = salida.hora.split(":").map(Number);
          horas = (h2 * 60 + m2 - (h1 * 60 + m1)) / 60;
        }
        return { ...g, nombre: emp ? emp.nombre : "—", entrada, salida, horas };
      });
  }, [fichajes, desde, hasta, empleados]);

  function textoRegistro() {
    const lineas = filasHistorial
      .sort((a, b) => a.fecha.localeCompare(b.fecha) || a.nombre.localeCompare(b.nombre))
      .map((f) => `${f.fecha} · ${f.nombre} · Entrada ${f.entrada ? f.entrada.hora : "—"} · Salida ${f.salida ? f.salida.hora : "sin fichar"} · ${f.horas !== null ? f.horas.toFixed(2) + " h" : ""}`);
    return `REGISTRO HORARIO\nDel ${desde} al ${hasta}\n\n${lineas.join("\n")}\n\nGenerado el ${new Date().toLocaleString("es-ES")}`;
  }

  function copiarRegistro() {
    const texto = textoRegistro();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  function submitManual() {
    if (!manual.empleadoId) {
      setManualError("Selecciona un empleado.");
      return;
    }
    setManualError("");
    addFichajeManual({
      empleadoId: manual.empleadoId,
      fecha: manual.fecha,
      tipo: manual.tipo,
      hora: manual.hora,
      timestamp: new Date(`${manual.fecha}T${manual.hora}:00`).toISOString(),
      manual: true,
    });
    setShowManual(false);
  }

  return (
    <div>
      <SectionTitle>Registro horario</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Desde 2019, todas las empresas en España están obligadas a llevar un registro diario de la jornada de cada
          persona trabajadora, sea cual sea su tamaño. Este registro se debe conservar 4 años y estar disponible para
          la Inspección de Trabajo si lo pide.
        </div>
      </Card>

      {fichajesAbiertos.length > 0 && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12.5px] font-semibold mb-1">Fichajes sin cerrar</div>
          {fichajesAbiertos.map((f, i) => (
            <div key={i} className="text-[12px]">{f.nombre} — entró el {f.fecha} y no consta salida</div>
          ))}
        </Card>
      )}

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Hoy</div>
      {activos.length === 0 ? <Empty text="Añade empleados activos en Personal para poder ficharles." /> : (
        <div className="grid md:grid-cols-2 gap-3 mb-4">
          {estadoHoy.map(({ empleado, ultimaEntrada, abierto }) => (
            <Card key={empleado.id}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="font-medium text-[13.5px]">{empleado.nombre}</div>
                  <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                    {abierto ? `Entró a las ${ultimaEntrada.hora}` : ultimaEntrada ? "Jornada cerrada" : "Sin fichar hoy"}
                  </div>
                </div>
                <Pill color={abierto ? C.accent : C.inkSoft}>{abierto ? "Trabajando" : "Fuera"}</Pill>
              </div>
              <div className="mt-2 flex gap-2">
                <Btn small disabled={abierto} onClick={() => fichar(empleado.id, "entrada")}><LogIn size={13} /> Entrada</Btn>
                <Btn small variant="ghost" disabled={!abierto} onClick={() => fichar(empleado.id, "salida")}><LogOut size={13} /> Salida</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

      <div className="flex items-center justify-between mb-2">
        <div className="text-[12px] font-medium" style={{ color: C.inkSoft }}>Historial</div>
        <div className="flex gap-2">
          <Btn small variant="ghost" onClick={() => setShowManual(true)}><Plus size={13} /> Corrección manual</Btn>
          <Btn small variant="ghost" onClick={() => setShowExportar(true)}><Download size={13} /> Exportar</Btn>
        </div>
      </div>

      <Card className="mb-4">
        <div className="flex flex-wrap gap-2 mb-3">
          <Btn small variant="ghost" onClick={irEstaSemana}>Esta semana</Btn>
          <Btn small variant="ghost" onClick={irSemanaAnterior}>Semana anterior</Btn>
        </div>
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
          <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
        </div>
      </Card>

      {filasHistorial.length === 0 ? <Empty text="Sin fichajes en este periodo." /> : (
        <div className="space-y-1.5">
          {filasHistorial
            .sort((a, b) => b.fecha.localeCompare(a.fecha) || a.nombre.localeCompare(b.nombre))
            .map((f, i) => (
              <Card key={i}>
                <div className="flex items-center justify-between text-[12.5px]">
                  <div>
                    <div className="font-medium">{f.nombre}</div>
                    <div className="text-[11px]" style={{ color: C.inkSoft }}>{f.fecha}</div>
                  </div>
                  <div className="text-right">
                    <div className="mono">
                      {f.entrada ? f.entrada.hora : "—"} → {f.salida ? f.salida.hora : "sin salida"}
                    </div>
                    {f.horas !== null && <div className="text-[11px] mono" style={{ color: C.accent }}>{f.horas.toFixed(2)} h</div>}
                  </div>
                </div>
              </Card>
            ))}
        </div>
      )}

      {showManual && (
        <Modal onClose={() => setShowManual(false)} title="Corrección manual de fichaje">
          <Field label="Empleado">
            <select value={manual.empleadoId} onChange={(e) => setManual({ ...manual, empleadoId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
              {activos.map((e) => <option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-3 gap-x-3">
            <Field label="Fecha"><Input type="date" value={manual.fecha} onChange={(e) => setManual({ ...manual, fecha: e.target.value })} /></Field>
            <Field label="Tipo">
              <select value={manual.tipo} onChange={(e) => setManual({ ...manual, tipo: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
              </select>
            </Field>
            <Field label="Hora"><Input type="time" value={manual.hora} onChange={(e) => setManual({ ...manual, hora: e.target.value })} /></Field>
          </div>
          {manualError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{manualError}</div>}
          <div className="flex gap-2">
            <Btn onClick={submitManual}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setShowManual(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {showExportar && (
        <Modal onClose={() => setShowExportar(false)} title="Exportar registro horario">
          <div className="text-[12.5px] mb-2">
            Copia este texto y guárdalo (o pégalo en un documento). Es tu justificante del registro horario del
            periodo seleccionado, por si te lo pide la Inspección de Trabajo.
          </div>
          <textarea
            readOnly
            value={textoRegistro()}
            onFocus={(e) => e.target.select()}
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, height: 180, resize: "none" }}
          />
          <div className="flex gap-2">
            <Btn onClick={copiarRegistro}>{copiado ? "¡Copiado!" : "Copiar texto"}</Btn>
            <Btn variant="ghost" onClick={() => setShowExportar(false)}>Cerrar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= SELECTOR DE ALÉRGENOS ================= */
function SelectorAlergenos({ seleccionados = [], onCambio, soloLectura = false }) {
  function alternar(id) {
    if (soloLectura) return;
    onCambio(seleccionados.includes(id) ? seleccionados.filter((x) => x !== id) : [...seleccionados, id]);
  }
  return (
    <div>
      <div className="flex flex-wrap gap-1.5">
        {ALERGENOS.map((a) => {
          const activo = seleccionados.includes(a.id);
          return (
            <button
              key={a.id}
              type="button"
              onClick={() => alternar(a.id)}
              className="text-[11.5px] font-medium px-2.5 py-1.5 rounded-lg flex items-center gap-1"
              style={{
                background: activo ? C.amberSoft : "#fff",
                border: `1px solid ${activo ? C.amber : C.line}`,
                color: activo ? C.ink : C.inkSoft,
                cursor: soloLectura ? "default" : "pointer",
              }}
            >
              <span>{a.icono}</span>
              <span>{a.nombre}</span>
            </button>
          );
        })}
      </div>
      {!soloLectura && (
        <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
          Marca los que contenga este producto. Son los 14 de declaración obligatoria (Reglamento UE 1169/2011).
        </div>
      )}
    </div>
  );
}

/* ================= APPCC ================= */
const TIPOS_PUNTO = [
  { id: "temperatura", label: "Temperatura (cámara, nevera, congelador)", unidad: "°C" },
  { id: "limpieza", label: "Limpieza y desinfección", unidad: "" },
  { id: "recepcion", label: "Control en recepción de mercancía", unidad: "°C" },
  { id: "otro", label: "Otro control", unidad: "" },
];

function Appcc({
  puntosControl, registrosAppcc, addPuntoControl, updatePuntoControl, deletePuntoControl,
  registrarAppcc, eliminarRegistroAppcc, appccPendientesHoy, productos, fichasCosto, alergenosDeFicha,
}) {
  const [vista, setVista] = useState("hoy"); // hoy | historial | puntos | alergenos
  const [showPunto, setShowPunto] = useState(false);
  const [puntoForm, setPuntoForm] = useState({ nombre: "", tipo: "temperatura", tempMin: "", tempMax: "", frecuencia: "Diaria" });
  const [puntoError, setPuntoError] = useState("");
  const [registroPara, setRegistroPara] = useState(null);
  const [registroForm, setRegistroForm] = useState({ valor: "", conforme: true, observaciones: "", responsable: "" });
  const [desde, setDesde] = useState(primerDiaMes(new Date()));
  const [hasta, setHasta] = useState(todayISO());
  const [copiado, setCopiado] = useState(false);

  function submitPunto() {
    if (!puntoForm.nombre.trim()) {
      setPuntoError("Ponle nombre al punto de control.");
      return;
    }
    setPuntoError("");
    addPuntoControl({
      nombre: puntoForm.nombre.trim(),
      tipo: puntoForm.tipo,
      tempMin: puntoForm.tempMin === "" ? null : Number(puntoForm.tempMin),
      tempMax: puntoForm.tempMax === "" ? null : Number(puntoForm.tempMax),
      frecuencia: puntoForm.frecuencia,
    });
    setPuntoForm({ nombre: "", tipo: "temperatura", tempMin: "", tempMax: "", frecuencia: "Diaria" });
    setShowPunto(false);
  }

  function abrirRegistro(punto) {
    setRegistroPara(punto);
    setRegistroForm({ valor: "", conforme: true, observaciones: "", responsable: "" });
  }

  // Un valor fuera del rango marcado se considera NO conforme automáticamente:
  // es lo que exige el sistema APPCC, para que quede constancia de la desviación.
  function evaluarConformidad(punto, valor) {
    if (punto.tipo !== "temperatura" && punto.tipo !== "recepcion") return null;
    const v = Number(valor);
    if (valor === "" || isNaN(v)) return null;
    if (punto.tempMin != null && v < punto.tempMin) return false;
    if (punto.tempMax != null && v > punto.tempMax) return false;
    return true;
  }

  function submitRegistro() {
    const auto = evaluarConformidad(registroPara, registroForm.valor);
    registrarAppcc({
      puntoId: registroPara.id,
      puntoNombre: registroPara.nombre,
      tipo: registroPara.tipo,
      valor: registroForm.valor,
      conforme: auto === null ? registroForm.conforme : auto,
      observaciones: registroForm.observaciones,
      responsable: registroForm.responsable,
    });
    setRegistroPara(null);
  }

  const registrosPeriodo = registrosAppcc
    .filter((r) => r.fecha >= desde && r.fecha <= hasta)
    .sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));

  const noConformes = registrosPeriodo.filter((r) => r.conforme === false);

  // Alérgenos de todo lo que vendes: elaborados con ficha + productos marcados
  const cartaAlergenos = useMemo(() => {
    const filas = [];
    (fichasCosto || []).forEach((f) => {
      filas.push({ id: "f-" + f.id, nombre: f.nombre, alergenos: alergenosDeFicha(f), origen: "ficha" });
    });
    (productos || [])
      .filter((p) => p.tipo === "elaborado" && !(fichasCosto || []).some((f) => f.productoVinculadoId === p.id))
      .forEach((p) => {
        filas.push({ id: "p-" + p.id, nombre: p.nombre, alergenos: p.alergenos || [], origen: "producto" });
      });
    return filas.sort((a, b) => a.nombre.localeCompare(b.nombre));
  }, [fichasCosto, productos, alergenosDeFicha]);

  function textoRegistroAppcc() {
    const lineas = registrosPeriodo.map(
      (r) => `${r.fecha} ${r.hora} · ${r.puntoNombre} · ${r.valor || "—"} · ${r.conforme ? "CONFORME" : "NO CONFORME"}${r.observaciones ? " · " + r.observaciones : ""}${r.responsable ? " · " + r.responsable : ""}`
    );
    return `REGISTRO APPCC\nDel ${desde} al ${hasta}\n\n${lineas.join("\n")}\n\nNo conformidades: ${noConformes.length}\nGenerado el ${new Date().toLocaleString("es-ES")}`;
  }

  function copiar() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textoRegistroAppcc()).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  return (
    <div>
      <div className="no-imprimir">
        <SectionTitle>Control sanitario (APPCC)</SectionTitle>

        <div className="flex gap-2 mb-4 overflow-x-auto">
          {[
            { id: "hoy", label: "Hoy" },
            { id: "historial", label: "Historial" },
            { id: "puntos", label: "Puntos de control" },
            { id: "alergenos", label: "Cartel de alérgenos" },
          ].map((v) => (
            <Btn key={v.id} small variant={vista === v.id ? "primary" : "ghost"} onClick={() => setVista(v.id)}>{v.label}</Btn>
          ))}
        </div>
      </div>

      {vista === "hoy" && (
        <div className="no-imprimir">
          <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
            <div className="text-[12.5px]">
              El sistema APPCC es obligatorio en cualquier negocio que manipule alimentos. Estos registros deben
              conservarse y estar disponibles si Sanidad los pide. Registra cada control el día que lo haces:
              rellenar una semana de golpe al final no vale.
            </div>
          </Card>

          {puntosControl.length === 0 ? (
            <Empty text="Todavía no has definido qué controlas. Ve a “Puntos de control” para empezar." />
          ) : (
            <>
              {appccPendientesHoy.length > 0 && (
                <Card className="mb-3" style={{ background: C.amberSoft, border: "none" }}>
                  <div className="text-[12.5px] font-semibold">
                    Te faltan {appccPendientesHoy.length} control(es) por registrar hoy
                  </div>
                </Card>
              )}
              <div className="space-y-2">
                {puntosControl.filter((p) => p.activo !== false).map((p) => {
                  const hechoHoy = registrosAppcc.find((r) => r.fecha === todayISO() && r.puntoId === p.id);
                  return (
                    <Card key={p.id}>
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="font-medium text-[13.5px]">{p.nombre}</div>
                          <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                            {TIPOS_PUNTO.find((t) => t.id === p.tipo)?.label}
                            {p.tempMin != null && p.tempMax != null && ` · rango ${p.tempMin} a ${p.tempMax} °C`}
                          </div>
                        </div>
                        {hechoHoy ? (
                          <Pill color={hechoHoy.conforme ? C.accent : C.red}>
                            {hechoHoy.conforme ? `OK ${hechoHoy.valor}` : `Desviación ${hechoHoy.valor}`}
                          </Pill>
                        ) : (
                          <Pill color={C.amber}>pendiente</Pill>
                        )}
                      </div>
                      {!hechoHoy && (
                        <div className="mt-2">
                          <Btn small onClick={() => abrirRegistro(p)}>Registrar ahora</Btn>
                        </div>
                      )}
                    </Card>
                  );
                })}
              </div>
            </>
          )}
        </div>
      )}

      {vista === "puntos" && (
        <div className="no-imprimir">
          <div className="flex justify-end mb-3">
            <Btn onClick={() => setShowPunto(true)}><Plus size={15} /> Nuevo punto de control</Btn>
          </div>
          {puntosControl.length === 0 ? (
            <Empty text="Define qué vas a controlar: cámara de refrigerado, congelador, limpieza del obrador…" />
          ) : (
            <div className="space-y-2">
              {puntosControl.map((p) => (
                <Card key={p.id}>
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="font-medium">{p.nombre}</div>
                      <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                        {TIPOS_PUNTO.find((t) => t.id === p.tipo)?.label} · {p.frecuencia}
                        {p.tempMin != null && p.tempMax != null && ` · ${p.tempMin} a ${p.tempMax} °C`}
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <Btn small variant="ghost" onClick={() => updatePuntoControl(p.id, { activo: p.activo === false })}>
                        {p.activo === false ? "Activar" : "Desactivar"}
                      </Btn>
                      <button onClick={() => deletePuntoControl(p.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}
        </div>
      )}

      {vista === "historial" && (
        <>
          <div className="no-imprimir">
            <Card className="mb-3">
              <div className="grid grid-cols-2 gap-x-3">
                <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
                <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
              </div>
              <div className="flex flex-wrap gap-2">
                <Btn onClick={() => window.print()}>Imprimir / Guardar PDF</Btn>
                <Btn variant="ghost" onClick={copiar}>{copiado ? "¡Copiado!" : "Copiar texto"}</Btn>
              </div>
            </Card>

            {noConformes.length > 0 && (
              <Card className="mb-3" style={{ background: C.red + "15", border: "none" }}>
                <div className="text-[12.5px] font-semibold">
                  {noConformes.length} desviación(es) en el periodo. Revisa que quede anotada la medida correctora.
                </div>
              </Card>
            )}
          </div>

          <div className="zona-impresion">
            <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>
              <div>
                <div className="text-[17px] font-semibold">Registro de control sanitario (APPCC)</div>
                <div className="text-[11.5px]" style={{ color: C.inkSoft }}>Del {desde} al {hasta}</div>
              </div>
              <img src={LOGO} alt="" style={{ height: 52, width: "auto" }} />
            </div>

            {registrosPeriodo.length === 0 ? <Empty text="Sin registros en este periodo." /> : (
              <table className="w-full text-[11.5px]" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Fecha</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Hora</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Punto de control</th>
                    <th className="py-2 px-2 text-center" style={{ background: C.ink, color: "#fff" }}>Valor</th>
                    <th className="py-2 px-2 text-center" style={{ background: C.ink, color: "#fff" }}>Conforme</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Observaciones</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Responsable</th>
                  </tr>
                </thead>
                <tbody>
                  {registrosPeriodo.map((r, i) => (
                    <tr key={r.id} style={{ background: i % 2 ? C.bg : "#fff" }}>
                      <td className="py-1.5 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{r.fecha}</td>
                      <td className="py-1.5 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{r.hora}</td>
                      <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{r.puntoNombre}</td>
                      <td className="py-1.5 px-2 text-center mono" style={{ border: `1px solid ${C.line}` }}>{r.valor || "—"}</td>
                      <td className="py-1.5 px-2 text-center font-semibold" style={{ border: `1px solid ${C.line}`, color: r.conforme ? C.accent : C.red }}>
                        {r.conforme ? "Sí" : "NO"}
                      </td>
                      <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{r.observaciones || ""}</td>
                      <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{r.responsable || ""}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </>
      )}

      {vista === "alergenos" && (
        <>
          <div className="no-imprimir mb-3">
            <Card style={{ background: C.accentSoft, border: "none" }}>
              <div className="text-[12.5px]">
                Este cartel se genera solo desde tus fichas de costo: hereda los alérgenos de cada ingrediente
                enlazado al catálogo. Imprímelo y ténlo visible o a disposición del cliente, como exige la ley.
              </div>
            </Card>
            <div className="flex gap-2 mt-3">
              <Btn onClick={() => window.print()}>Imprimir cartel</Btn>
            </div>
          </div>

          <div className="zona-impresion">
            <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>
              <div>
                <div className="text-[17px] font-semibold">Información de alérgenos</div>
                <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                  Reglamento (UE) 1169/2011 · Actualizado el {new Date().toLocaleDateString("es-ES")}
                </div>
              </div>
              <img src={LOGO} alt="" style={{ height: 52, width: "auto" }} />
            </div>

            {cartaAlergenos.length === 0 ? (
              <Empty text="Crea fichas de costo o marca productos como elaborados para generar el cartel." />
            ) : (
              <table className="w-full text-[11.5px]" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Producto</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Contiene</th>
                  </tr>
                </thead>
                <tbody>
                  {cartaAlergenos.map((f, i) => (
                    <tr key={f.id} style={{ background: i % 2 ? C.bg : "#fff" }}>
                      <td className="py-2 px-2 font-medium" style={{ border: `1px solid ${C.line}` }}>{f.nombre}</td>
                      <td className="py-2 px-2" style={{ border: `1px solid ${C.line}` }}>
                        {f.alergenos.length === 0 ? (
                          <span style={{ color: C.inkSoft }}>Sin alérgenos declarados</span>
                        ) : (
                          f.alergenos.map((id) => {
                            const a = alergenoPorId(id);
                            return a ? `${a.icono} ${a.nombre}` : id;
                          }).join(" · ")
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}

            <div className="text-[10.5px] mt-4" style={{ color: C.inkSoft }}>
              Puede haber trazas de otros alérgenos por manipulación en el mismo obrador. Consulte al personal
              si tiene alguna alergia o intolerancia.
            </div>
          </div>
        </>
      )}

      {showPunto && (
        <Modal onClose={() => setShowPunto(false)} title="Nuevo punto de control">
          <Field label="Nombre">
            <Input value={puntoForm.nombre} onChange={(e) => setPuntoForm({ ...puntoForm, nombre: e.target.value })} placeholder="Cámara de refrigerado, Congelador obrador…" />
          </Field>
          <Field label="Tipo">
            <select value={puntoForm.tipo} onChange={(e) => setPuntoForm({ ...puntoForm, tipo: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
              {TIPOS_PUNTO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </Field>
          {(puntoForm.tipo === "temperatura" || puntoForm.tipo === "recepcion") && (
            <div className="grid grid-cols-2 gap-x-3">
              <Field label="Temperatura mínima (°C)"><Input type="number" step="0.1" value={puntoForm.tempMin} onChange={(e) => setPuntoForm({ ...puntoForm, tempMin: e.target.value })} placeholder="0" /></Field>
              <Field label="Temperatura máxima (°C)"><Input type="number" step="0.1" value={puntoForm.tempMax} onChange={(e) => setPuntoForm({ ...puntoForm, tempMax: e.target.value })} placeholder="4" /></Field>
            </div>
          )}
          <Field label="Frecuencia">
            <select value={puntoForm.frecuencia} onChange={(e) => setPuntoForm({ ...puntoForm, frecuencia: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
              <option>Diaria</option>
              <option>Dos veces al día</option>
              <option>Semanal</option>
              <option>En cada recepción</option>
            </select>
          </Field>
          {puntoError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{puntoError}</div>}
          <div className="flex gap-2">
            <Btn onClick={submitPunto}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setShowPunto(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {registroPara && (
        <Modal onClose={() => setRegistroPara(null)} title={registroPara.nombre}>
          {(registroPara.tipo === "temperatura" || registroPara.tipo === "recepcion") ? (
            <>
              <Field label="Temperatura medida (°C)">
                <Input type="number" step="0.1" value={registroForm.valor} onChange={(e) => setRegistroForm({ ...registroForm, valor: e.target.value })} autoFocus />
              </Field>
              {(() => {
                const ev = evaluarConformidad(registroPara, registroForm.valor);
                if (ev === null) return null;
                return (
                  <div className="text-[12px] mb-3" style={{ color: ev ? C.accent : C.red }}>
                    {ev
                      ? "Dentro del rango correcto."
                      : `Fuera del rango (${registroPara.tempMin} a ${registroPara.tempMax} °C). Se registrará como desviación: anota abajo qué medida correctora has tomado.`}
                  </div>
                );
              })()}
            </>
          ) : (
            <Field label="Resultado">
              <select value={registroForm.conforme ? "si" : "no"} onChange={(e) => setRegistroForm({ ...registroForm, conforme: e.target.value === "si" })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
                <option value="si">Conforme — realizado correctamente</option>
                <option value="no">No conforme — hubo un problema</option>
              </select>
            </Field>
          )}
          <Field label="Observaciones / medida correctora">
            <Input value={registroForm.observaciones} onChange={(e) => setRegistroForm({ ...registroForm, observaciones: e.target.value })} placeholder="Opcional, salvo si hay desviación" />
          </Field>
          <Field label="Responsable">
            <Input value={registroForm.responsable} onChange={(e) => setRegistroForm({ ...registroForm, responsable: e.target.value })} placeholder="Quién lo comprueba" />
          </Field>
          <div className="flex gap-2">
            <Btn onClick={submitRegistro}>Guardar registro</Btn>
            <Btn variant="ghost" onClick={() => setRegistroPara(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= ENCARGOS ================= */
function lineaEncargo() {
  return { productoId: "", descripcion: "", cantidad: 1, precioUnitario: "" };
}

function Encargos({ encargosPendientes, encargos, clientes, productos, addEncargo, updateEncargo, deleteEncargo, entregarEncargo, addCliente }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(null);
  const [error, setError] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [entregarId, setEntregarId] = useState(null);
  const [verEntregados, setVerEntregados] = useState(false);
  const [clienteNuevo, setClienteNuevo] = useState("");

  const vendibles = productos.filter((p) => p.tipo === "elaborado" || Number(p.precioVenta) > 0);

  function nuevo() {
    setForm({
      clienteId: clientes[0]?.id || "",
      numero: "",
      fechaEntrega: todayISO(),
      horaEntrega: "",
      notas: "",
      señal: "",
      lineas: [lineaEncargo()],
    });
    setEditingId(null);
    setError("");
    setShowForm(true);
  }

  function abrirEdicion(e) {
    setForm({
      clienteId: e.clienteId || "",
      numero: e.numero || "",
      fechaEntrega: e.fechaEntrega || todayISO(),
      horaEntrega: e.horaEntrega || "",
      notas: e.notas || "",
      señal: e.señal ?? "",
      lineas: (e.lineas || []).map((l) => ({ ...l })),
    });
    setEditingId(e.id);
    setError("");
    setShowForm(true);
  }

  function setLinea(idx, campo, valor) {
    setForm((f) => ({
      ...f,
      lineas: f.lineas.map((l, i) => {
        if (i !== idx) return l;
        if (campo === "productoId") {
          const p = productos.find((x) => x.id === valor);
          return { ...l, productoId: valor, descripcion: p ? p.nombre : l.descripcion, precioUnitario: p ? precioNeto(p).toFixed(2) : l.precioUnitario };
        }
        return { ...l, [campo]: valor };
      }),
    }));
  }
  const addLinea = () => setForm((f) => ({ ...f, lineas: [...f.lineas, lineaEncargo()] }));
  const quitarLinea = (idx) => setForm((f) => ({ ...f, lineas: f.lineas.filter((_, i) => i !== idx) }));

  const totalForm = !form ? 0 : form.lineas.reduce((a, l) => a + (Number(l.cantidad) || 0) * (Number(l.precioUnitario) || 0), 0);

  function submit() {
    if (!form.clienteId) { setError("Selecciona o crea un cliente."); return; }
    const validas = form.lineas.filter((l) => (l.productoId || l.descripcion) && Number(l.cantidad) > 0);
    if (!validas.length) { setError("Añade al menos un producto con cantidad."); return; }
    setError("");
    const datos = { ...form, lineas: validas, señal: form.señal === "" ? 0 : Number(form.señal) };
    if (editingId) updateEncargo(editingId, datos);
    else addEncargo(datos);
    setShowForm(false);
    setForm(null);
    setEditingId(null);
  }

  function crearClienteRapido() {
    if (!clienteNuevo.trim()) return;
    const c = addCliente({ nombre: clienteNuevo.trim() });
    setForm((f) => ({ ...f, clienteId: c.id }));
    setClienteNuevo("");
  }

  const entregados = encargos.filter((e) => e.estado === "Entregado");

  function colorDias(d) {
    if (d === null) return C.inkSoft;
    if (d < 0) return C.red;
    if (d <= 2) return C.amber;
    return C.ink;
  }
  function textoDias(d) {
    if (d === null) return "Sin fecha";
    if (d < 0) return `Se pasó hace ${Math.abs(d)} d`;
    if (d === 0) return "¡Hoy!";
    if (d === 1) return "Mañana";
    return `En ${d} días`;
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={nuevo}><Plus size={15} /> Nuevo encargo</Btn>}>Encargos</SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando encargo" : "Nuevo encargo"}</div>

          <div className="grid md:grid-cols-2 gap-x-3">
            <Field label="Cliente">
              <select value={form.clienteId} onChange={(e) => setForm({ ...form, clienteId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: "#fff" }}>
                <option value="">Selecciona…</option>
