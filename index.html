<script>
  // Guardado local en el propio telefono
  window.storage = {
    async get(key) {
      const v = localStorage.getItem("almacen:" + key);
      if (v === null) throw new Error("no existe");
      return { key: key, value: v, shared: false };
    },
    async set(key, value) { localStorage.setItem("almacen:" + key, value); return { key: key, value: value, shared: false }; },
    async delete(key) { localStorage.removeItem("almacen:" + key); return { key: key, deleted: true, shared: false }; },
    async list() {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("almacen:")) keys.push(k.slice(8));
      }
      return { keys: keys, shared: false };
    }
  };
</script>

// Los precios de venta se introducen CON IVA (como en carta).
// El coste de compra es SIN IVA (el IVA soportado es deducible).
// Por eso el margen se calcula sobre el precio neto.
function ivaDe(p) {
  const v = Number(p && p.ivaVenta);
  return isNaN(v) ? 10 : v;
}
// IVA soportado en la compra. En España conviven 4% (alimentación básica),
// 10% (resto de alimentos) y 21% (general).
function ivaCompraDe(p) {
  const v = Number(p && p.ivaCompra);
  return isNaN(v) ? 10 : v;
}
function costoConIva(p) {
  return (Number(p && p.costo) || 0) * (1 + ivaCompraDe(p) / 100);
}
// Agrupa productos por proveedor para inventarios y hojas de recuento.
// Los que no tienen proveedor asignado van al final, en su propio grupo.
function agruparPorProveedor(productos, proveedores) {
  const grupos = new Map();
  productos.forEach((p) => {
    const id = p.proveedorId || "__sin__";
    if (!grupos.has(id)) grupos.set(id, []);
    grupos.get(id).push(p);
  });
  const orden = (a, b) => (a.ubicacion || "").localeCompare(b.ubicacion || "") || (a.nombre || "").localeCompare(b.nombre || "");
  const salida = [];
  proveedores.forEach((pv) => {
    if (grupos.has(pv.id)) {
      salida.push({ id: pv.id, nombre: pv.nombre, items: grupos.get(pv.id).sort(orden) });
      grupos.delete(pv.id);
    }
  });
  grupos.forEach((items, id) => {
    if (id === "__sin__") return;
    salida.push({ id, nombre: "Proveedor no encontrado", items: items.sort(orden) });
  });
  if (grupos.has("__sin__")) {
    salida.push({ id: "__sin__", nombre: "Sin proveedor asignado", items: grupos.get("__sin__").sort(orden) });
  }
  return salida;
}

// Empaque de compra: cuántas unidades trae la caja/saco/paquete del proveedor.
function udsPorCaja(p) {
  const v = Number(p && p.udsPorCaja);
  return !v || v <= 0 ? 1 : v;
}
function costoCaja(p) {
  return (Number(p && p.costo) || 0) * udsPorCaja(p);
}
function precioNeto(p) {
  const pvp = Number(p && p.precioVenta) || 0;
  return pvp / (1 + ivaDe(p) / 100);
}
function margenDe(p) {
  const neto = precioNeto(p);
  if (neto <= 0) return null;
  return ((neto - (Number(p.costo) || 0)) / neto) * 100;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Conteo final de un ítem: usa CF si está puesto; si no, el último conteo con valor.
// Soporta el formato antiguo (cantidadContada) de conteos ya guardados.
function valorCF(item) {
  if (!item) return null;
  const candidatos = [item.conteo, item.cf, item.c3, item.c2, item.c1, item.cantidadContada];
  for (const v of candidatos) {
    if (v !== "" && v !== null && v !== undefined && !isNaN(Number(v))) return Number(v);
  }
  return null;
}

const ultimoDiaMes = (fecha) => { const d = new Date(fecha); return new Date(d.getFullYear(), d.getMonth() + 1, 0).toISOString().slice(0, 10); };

async function loadKey(key, fallback, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await window.storage.get(key, false);
      if (res && res.value) return JSON.parse(res.value);
      return fallback; // la clave genuinamente no existe todavía (primer uso)
    } catch (e) {
      if (attempt === retries) {
        console.error("No se pudo cargar", key, "tras varios intentos:", e);
        return fallback;
      }
      await new Promise((r) => setTimeout(r, 350));
    }
  }
  return fallback;
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("Error guardando", key, e);
  }
}

      if (!prod) return;
      const costoUnitario = Number(prod.costo) || 0;
      const ingresoUnitario = Number(ln.precioUnitario) || precioNeto(prod);
      lista = lista.map((p) => (p.id === prod.id ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) - cant) } : p));
      nuevosMov.push({
        id: uid(), productoId: prod.id, tipo: "salida", cantidad: cant,
        fecha: todayISO(), motivo: "Venta", costoUnitario, ingresoUnitario,
        ivaVentaAplicado: ivaDe(prod), medioPago,
        referencia: `Encargo ${encargo.numero || ""}`.trim(),
        encargoId: encargo.id, clienteId: encargo.clienteId,
      });
    });
    setProductos(lista);
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
    updateEncargo(encargo.id, { estado: "Entregado", fechaEntregaReal: todayISO() });
  }

  /* ---------- CAJA ---------- */
  function addArqueo(data) {

      Stock: Number(p.stock) || 0, "Stock mínimo": Number(p.stockMinimo) || 0,

    }));

        Base: Number(base.toFixed(2)), Pagada: a.pagada ? "Sí" : "No",
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaAlb), "Albaranes");

    XLSX.writeFile(wb, `datos_almacen_${todayISO()}.xlsx`);
  }

  /* ---------- APPCC ---------- */

  function crearProductoEnConteo(conteoId, datos, cantidadContada) {
    const nuevoId = uid();
    const nuevoProducto = {
      id: nuevoId,
      stock: 0,
      codigo: datos.codigo || "",
      nombre: datos.nombre,
      categoria: datos.categoria || "",
      unidad: datos.unidad || "unidad",
      costo: Number(datos.costo) || 0,
      precioVenta: Number(datos.precioVenta) || 0,
      stockMinimo: Number(datos.stockMinimo) || 0,
      ubicacion: datos.ubicacion || "",
      proveedorId: datos.proveedorId || "",
    };
    setProductos((s) => [...s, nuevoProducto]);
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId ? { ...c, items: [...c.items, { productoId: nuevoId, cantidadContada }] } : c
      )
    );
  }

  function iniciarConteo() {
    const conteo = {
      id: uid(),
      fecha: todayISO(),
      completado: false,
      responsables: { contadoPor: "", revisor: "" },
      items: productos.map((p) => ({ productoId: p.id, conteo: "" })),
    };
    setConteos((s) => [conteo, ...s]);
    return conteo.id;
  }
  function actualizarConteoItem(conteoId, productoId, campo, valor) {
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId
          ? { ...c, items: c.items.map((it) => (it.productoId === productoId ? { ...it, [campo]: valor } : it)) }
          : c
      )
    );
  }
  function actualizarResponsable(conteoId, campo, valor) {
    setConteos((s) =>
      s.map((c) => (c.id === conteoId ? { ...c, responsables: { ...(c.responsables || {}), [campo]: valor } } : c))
    );
  }
  function finalizarConteo(conteoId) {
    setConteos((s) => s.map((c) => (c.id === conteoId ? { ...c, completado: true } : c)));
  }
  function aplicarAjustes(conteoId, motivos = {}) {
    const conteo = conteos.find((c) => c.id === conteoId);
    if (!conteo) return;
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const item = conteo.items.find((it) => it.productoId === p.id);
        const valorFinal = item ? valorCF(item) : null;
        if (valorFinal === null) return p;
        const dif = valorFinal - Number(p.stock || 0);
        if (dif !== 0) {
          nuevosMov.push({
            id: uid(), productoId: p.id, tipo: "ajuste", cantidad: dif,
            fecha: todayISO(),
            motivo: motivos[p.id] || "Sin especificar",
            referencia: `Ajuste por inventario · ${motivos[p.id] || "Sin especificar"}`,
          });
        }
        return { ...p, stock: valorFinal };
      })
    );
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
  }

  // Hay un conteo abierto: el almacén queda congelado para no falsear el descuadre
  const conteoAbierto = useMemo(() => conteos.find((c) => !c.completado) || null, [conteos]);
  const almacenCongelado = !!conteoAbierto;


  /* ---------- ALBARANES ---------- */

  // Clave del catálogo aprendido: cada proveedor tiene sus propios códigos
  const claveCat = (proveedorId, codigo) => `${proveedorId}::${String(codigo || "").trim().toUpperCase()}`;

  function buscarEnCatalogo(proveedorId, codigo) {
    return catalogoProv[claveCat(proveedorId, codigo)] || null;
  }

  // Registra la referencia del proveedor para no volver a teclearla nunca más
  function aprenderReferencia(proveedorId, codigo, datos) {
    if (!codigo) return;
    setCatalogoProv((s) => ({ ...s, [claveCat(proveedorId, codigo)]: { ...(s[claveCat(proveedorId, codigo)] || {}), ...datos } }));
  }

  function guardarAlbaran(alb) {
    setAlbaranes((s) => {
      const existe = s.some((a) => a.id === alb.id);
      return existe ? s.map((a) => (a.id === alb.id ? alb : a)) : [alb, ...s];
    });
  }

  function eliminarAlbaran(id) {
    setAlbaranes((s) => s.filter((a) => a.id !== id));
  }

  function marcarPagada(id, pagada) {
    setAlbaranes((s) => s.map((a) => (a.id === id ? { ...a, pagada, fechaPago: pagada ? todayISO() : "" } : a)));
  }

  // Confirmar = dar entrada real: crea/actualiza productos, sube stock y deja rastro.
  // Se calcula TODO de forma síncrona antes de tocar el estado; si no, el albarán
  // se guardaba vacío porque las líneas aún no estaban resueltas.
  function confirmarAlbaran(alb) {
    const avisos = [];
    const nuevosMov = [];
    const lineasResueltas = [];
    let lista = [...productos];

    alb.lineas.forEach((ln) => {
      const uds = Number(ln.udsPorCaja) > 0 ? Number(ln.udsPorCaja) : 1;
      const cantidad = Number(ln.cantidad) || 0;
      const importe = Number(ln.importe) || 0;
      const unidadesTotales = ln.tipoUnidad === "peso" ? cantidad : cantidad * uds;
      const costoUnitario = unidadesTotales > 0 ? importe / unidadesTotales : 0;

      const cat = catalogoProv[claveCat(alb.proveedorId, ln.codigoProveedor)];
      let prod = null;
      if (ln.productoId) prod = lista.find((p) => p.id === ln.productoId);
      if (!prod && cat && cat.productoId) prod = lista.find((p) => p.id === cat.productoId);

      if (prod) {
        const stockAnterior = Number(prod.stock) || 0;
        const costoAnterior = Number(prod.costo) || 0;
        if (costoAnterior > 0 && costoUnitario > 0) {
          const variacion = ((costoUnitario - costoAnterior) / costoAnterior) * 100;
          if (Math.abs(variacion) >= 3) {
            avisos.push({ nombre: prod.nombre, anterior: costoAnterior, nuevo: costoUnitario, variacion });
          }
        }
        // Coste promedio ponderado: lo que ya tenías en stock no se revalúa
        // al precio nuevo de golpe, se pondera con lo que entra. Así el coste
        // no se infla ni se deshincha de un día para otro.
        const stockTotal = stockAnterior + unidadesTotales;
        const costoPonderado = stockTotal > 0
          ? (stockAnterior * costoAnterior + unidadesTotales * costoUnitario) / stockTotal
          : costoUnitario;
        lista = lista.map((p) =>
          p.id === prod.id
            ? {
                ...p,
                stock: stockTotal,
                costo: costoUnitario > 0 ? Number(costoPonderado.toFixed(4)) : p.costo,
                ivaCompra: Number(ln.ivaPct) || p.ivaCompra || 10,
                udsPorCaja: uds,
                proveedorId: p.proveedorId || alb.proveedorId,
              }
            : p
        );
        lineasResueltas.push({ ...ln, productoId: prod.id, unidadesEntradas: unidadesTotales });
        nuevosMov.push({
          id: uid(), productoId: prod.id, tipo: "entrada", cantidad: unidadesTotales,
          fecha: alb.fecha, albaranId: alb.id,
          referencia: `Albarán ${alb.numero || "s/n"}${ln.lote ? " · lote " + ln.lote : ""}`,
        });
      } else {
        const nuevoId = uid();
        const nuevo = {
          id: nuevoId,
          codigo: ln.codigoProveedor || "",
          nombre: ln.descripcion || "Sin descripción",
          categoria: "",
          unidad: ln.unidad || "unidad",
          costo: Number(costoUnitario.toFixed(4)),
          ivaCompra: Number(ln.ivaPct) || 10,
          udsPorCaja: uds,
          precioVenta: 0,
          ivaVenta: 10,
          stock: unidadesTotales,
          stockMinimo: 0,
          ubicacion: "",
          proveedorId: alb.proveedorId,
        };
        lista = [...lista, nuevo];
        lineasResueltas.push({ ...ln, productoId: nuevoId, unidadesEntradas: unidadesTotales });
        nuevosMov.push({
          id: uid(), productoId: nuevoId, tipo: "entrada", cantidad: unidadesTotales,
          fecha: alb.fecha, albaranId: alb.id,
          referencia: `Albarán ${alb.numero || "s/n"} · alta automática`,
        });
      }
    });

    setProductos(lista);
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);

    setCatalogoProv((prev) => {
      const copia = { ...prev };
      lineasResueltas.forEach((ln) => {
        if (!ln.codigoProveedor) return;
        copia[claveCat(alb.proveedorId, ln.codigoProveedor)] = {
          descripcion: ln.descripcion,
          unidad: ln.unidad,
          udsPorCaja: Number(ln.udsPorCaja) || 1,
          ivaPct: Number(ln.ivaPct) || 10,
          tipoUnidad: ln.tipoUnidad || "unidad",
          precioPor: ln.precioPor || "bulto",
          contenido: ln.contenido || "",
          unidadContenido: ln.unidadContenido || "",
          productoId: ln.productoId,
          ultimoPrecio: Number(ln.precioBruto) || 0,
          ultimoDto: Number(ln.dtoPct) || 0,
        };
      });
      return copia;
    });

    // Si el albarán viene de un pedido, se marca lo recibido y se cierra si procede
    if (alb.pedidoId) {
      setPedidos((prev) =>
        prev.map((pe) => {
          if (pe.id !== alb.pedidoId) return pe;
          const items = pe.items.map((it) => {
            const suyas = lineasResueltas.filter((ln) => ln.productoId === it.productoId);
            if (!suyas.length) return it;
            const recibidas = suyas.reduce((a, ln) => a + (Number(ln.unidadesEntradas) || 0), 0);
            return { ...it, cantidadRecibida: (Number(it.cantidadRecibida) || 0) + recibidas };
          });
          const completo = items.every((it) => (Number(it.cantidadRecibida) || 0) >= (Number(it.cantidad) || 0));
          const algo = items.some((it) => (Number(it.cantidadRecibida) || 0) > 0);
          return { ...pe, items, estado: completo ? "Recibido" : algo ? "Parcial" : "Pendiente" };
        })
      );
    }

    guardarAlbaran({ ...alb, lineas: lineasResueltas, estado: "confirmado", avisosPrecio: avisos });
    return avisos;
  }

  // Deshace la entrada de un albarán: resta el stock que sumó y borra sus movimientos,
  // dejándolo en borrador para poder corregirlo.
  function anularAlbaran(alb) {
    setProductos((prev) =>
      prev.map((p) => {
        const suyas = alb.lineas.filter((ln) => ln.productoId === p.id);
        if (!suyas.length) return p;
        const restar = suyas.reduce((a, ln) => a + (Number(ln.unidadesEntradas) || 0), 0);
        return { ...p, stock: Math.max(0, (Number(p.stock) || 0) - restar) };
      })
    );
    setMovimientos((prev) => prev.filter((m) => m.albaranId !== alb.id));
    guardarAlbaran({ ...alb, estado: "borrador", avisosPrecio: [] });
  }

  /* ---------- CÁLCULOS ---------- */

  // El utillaje (jarras, bandejas, báscula...) no es mercancía: no rota, no se
  // consume por venta y no cuenta como capital circulante. Se trata aparte en
  // valor de almacén, ABC y alertas de "sin movimiento".
  const esUtillaje = (p) => (p.tipo || "materia_prima") === "utillaje";

  const valorInventario = useMemo(
    () => productos.filter((p) => !esUtillaje(p)).reduce((acc, p) => acc + p.stock * Number(p.costo || 0), 0),
    [productos]
  );
  const valorUtillaje = useMemo(
    () => productos.filter(esUtillaje).reduce((acc, p) => acc + p.stock * Number(p.costo || 0), 0),
    [productos]
  );
  const stockBajo = useMemo(() => productos.filter((p) => p.stock <= Number(p.stockMinimo || 0)), [productos]);

  // Clasificación ABC por VALOR DE CONSUMO: lo que realmente mueve dinero.
  // valorConsumo = unidades que han salido en los últimos 12 meses × costo unitario.
  // Si todavía no hay histórico de salidas, se usa el valor en stock como aproximación
  // provisional y se avisa de ello en la interfaz. El utillaje queda fuera: nunca
  // "rota" y forzarlo en A/B/C solo añadiría ruido.
  const analisisABC = useMemo(() => {
    const hace12meses = new Date();
    hace12meses.setMonth(hace12meses.getMonth() - 12);

    const consumo = {};
    movimientos.forEach((m) => {
      if (m.tipo !== "salida") return;
      if (new Date(m.fecha) < hace12meses) return;
      consumo[m.productoId] = (consumo[m.productoId] || 0) + Math.abs(Number(m.cantidad) || 0);
    });

    const totalSalidas = Object.values(consumo).reduce((a, x) => a + x, 0);
    const baseConsumo = totalSalidas > 0;

    const clasificables = productos.filter((p) => !esUtillaje(p));
    const conValor = clasificables.map((p) => {
      const unidades = consumo[p.id] || 0;
      const costo = Number(p.costo) || 0;
      const valor = baseConsumo ? unidades * costo : (Number(p.stock) || 0) * costo;
      return { id: p.id, valor, unidades, rotacion: (Number(p.stock) || 0) > 0 ? unidades / (Number(p.stock) || 1) : null };
    });

    const total = conValor.reduce((a, x) => a + x.valor, 0);
    const mapa = {};
    const detalle = {};

    if (total <= 0) {
      clasificables.forEach((p) => { mapa[p.id] = "C"; detalle[p.id] = { valor: 0, unidades: 0, rotacion: null }; });
      return { mapa, detalle, baseConsumo };
    }

    const ordenados = [...conValor].sort((a, b) => b.valor - a.valor);
    let acumulado = 0;
    ordenados.forEach((x) => {
      acumulado += x.valor;
      const pct = (acumulado / total) * 100;
      mapa[x.id] = pct <= 80 ? "A" : pct <= 95 ? "B" : "C";
      detalle[x.id] = { valor: x.valor, unidades: x.unidades, rotacion: x.rotacion };
    });
    return { mapa, detalle, baseConsumo };
  }, [productos, movimientos]);

  const clasificacionABC = analisisABC.mapa;
  const pedidosPendientes = useMemo(() => pedidos.filter((p) => p.estado !== "Recibido"), [pedidos]);
  const margenPromedio = useMemo(() => {
    const conPrecio = productos.filter((p) => Number(p.precioVenta) > 0);
    if (!conPrecio.length) return 0;
    const total = conPrecio.reduce((acc, p) => acc + (margenDe(p) || 0), 0);
    return total / conPrecio.length;
  }, [productos]);

  const rotacionPorProducto = useMemo(() => {
    return productos.map((p) => {
      const salidas = movimientos.filter((m) => m.productoId === p.id && m.tipo === "salida");
      const cantSalidas = salidas.reduce((a, m) => a + m.cantidad, 0);
      const costoVentas = cantSalidas * Number(p.costo || 0);
      const inventarioPromedio = p.stock * Number(p.costo || 0);
      const rotacion = inventarioPromedio > 0 ? costoVentas / inventarioPromedio : null;
      const dias = rotacion ? 365 / rotacion : null;
      return { ...p, cantSalidas, rotacion, dias };
    });
  }, [productos, movimientos]);


  // Lotes con caducidad, sacados de los albaranes ya confirmados.
  // No hace falta guardar nada nuevo: la información ya está en las líneas.
  const lotesCaducidad = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const filas = [];
    albaranes.forEach((a) => {
      if (a.estado !== "confirmado") return;
      (a.lineas || []).forEach((ln) => {
        if (!ln.caducidad) return;
        const f = new Date(ln.caducidad);
        if (isNaN(f)) return;
        const dias = Math.round((f - hoy) / 86400000);
        const prod = productos.find((x) => x.id === ln.productoId);
        filas.push({
          id: `${a.id}-${ln.codigoProveedor || ln.descripcion}`,
          nombre: prod ? prod.nombre : ln.descripcion,
          lote: ln.lote || "",
          caducidad: ln.caducidad,
          dias,
          unidades: Number(ln.unidadesEntradas) || 0,
          albaran: a.numero,
          proveedorId: a.proveedorId,
        });
      });
    });
    return filas.sort((x, y) => x.dias - y.dias);
  }, [albaranes, productos]);

  const caducanPronto = useMemo(() => lotesCaducidad.filter((l) => l.dias <= 30), [lotesCaducidad]);

  // Documentos de personal que caducan (certificado médico, formación de manipulador, etc.)
  // y contratos temporales que están a punto de acabar.
  const documentosPersonalCaducan = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    const filas = [];
    empleados.filter((e) => e.activo !== false).forEach((e) => {
      (e.documentos || []).forEach((d) => {
        if (!d.fechaCaducidad) return;
        const f = new Date(d.fechaCaducidad);
        if (isNaN(f)) return;
        const dias = Math.round((f - hoy) / 86400000);
        filas.push({ id: `${e.id}-doc-${d.id}`, empleado: e.nombre, concepto: d.nombre, fecha: d.fechaCaducidad, dias });
      });
      if (e.fechaFinContrato) {
        const f = new Date(e.fechaFinContrato);
        if (!isNaN(f)) {
          const dias = Math.round((f - hoy) / 86400000);
          filas.push({ id: `${e.id}-contrato`, empleado: e.nombre, concepto: "Fin de contrato", fecha: e.fechaFinContrato, dias });
        }
      }
    });
    return filas.sort((a, b) => a.dias - b.dias);
  }, [empleados]);
  const documentosPersonalPronto = useMemo(() => documentosPersonalCaducan.filter((d) => d.dias <= 30), [documentosPersonalCaducan]);

  // Fichajes "abiertos": alguien marcó entrada pero no salida. Es un aviso
  // operativo (se les olvidó fichar la salida), no una alarma legal.
  // Alérgenos de cada ficha de costo: se heredan de los ingredientes enlazados
  // al catálogo, más los que se marquen a mano en la propia ficha.
  function alergenosDeFicha(f) {
    const set = new Set(f.alergenosExtra || []);
    (f.componentes || []).forEach((c) => {
      if (!c.productoId) return;
      const p = productos.find((x) => x.id === c.productoId);
      (p?.alergenos || []).forEach((a) => set.add(a));
    });
    return [...set];
  }

  // Puntos de control que hoy todavía no se han registrado
  // Encargos pendientes ordenados por urgencia de entrega
  const encargosPendientes = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return encargos
      .filter((e) => e.estado !== "Entregado" && e.estado !== "Cancelado")
      .map((e) => {
        const f = new Date(e.fechaEntrega);
        const dias = isNaN(f) ? null : Math.round((f - hoy) / 86400000);
        const total = (e.lineas || []).reduce((a, ln) => a + (Number(ln.cantidad) || 0) * (Number(ln.precioUnitario) || 0), 0);
        return { ...e, dias, total, cliente: clientes.find((c) => c.id === e.clienteId) };
      })
      .sort((a, b) => (a.dias ?? 9999) - (b.dias ?? 9999));
  }, [encargos, clientes]);

  const encargosUrgentes = useMemo(() => encargosPendientes.filter((e) => e.dias !== null && e.dias <= 2), [encargosPendientes]);

  // Análisis de clientes: cuánto ha comprado cada uno y cuándo fue la última vez.
  // Solo cuenta ventas con cliente identificado (encargos), no el mostrador anónimo.
  const analisisClientes = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return clientes
      .map((c) => {
        const susVentas = movimientos.filter((m) => m.clienteId === c.id && m.tipo === "salida" && m.motivo === "Venta");
        const facturado = susVentas.reduce((a, m) => a + (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0), 0);
        const fechas = susVentas.map((m) => m.fecha).sort();
        const ultima = fechas[fechas.length - 1] || null;
        const diasSinComprar = ultima ? Math.round((hoy - new Date(ultima)) / 86400000) : null;
        const nEncargos = encargos.filter((e) => e.clienteId === c.id && e.estado === "Entregado").length;
        return { ...c, facturado, ultima, diasSinComprar, nEncargos };
      })
      .sort((a, b) => b.facturado - a.facturado);
  }, [clientes, movimientos, encargos]);

  // Clientes que compraban y llevan tiempo sin aparecer: candidatos a recuperar
  const clientesDormidos = useMemo(
    () => analisisClientes.filter((c) => c.nEncargos > 0 && c.diasSinComprar !== null && c.diasSinComprar > 60),
    [analisisClientes]
  );

  // Venta cruzada: qué productos aparecen juntos en el mismo encargo.
  // Con pocos datos no dice nada fiable, así que solo se muestra a partir
  // de 3 encargos entregados y se avisa de la limitación en pantalla.
  const ventaCruzada = useMemo(() => {
    const entregados = encargos.filter((e) => e.estado === "Entregado");
    const pares = {};
    entregados.forEach((e) => {
      const ids = [...new Set((e.lineas || []).map((l) => l.productoId).filter(Boolean))];
      for (let i = 0; i < ids.length; i++) {
        for (let j = i + 1; j < ids.length; j++) {
          const key = [ids[i], ids[j]].sort().join("|");
          pares[key] = (pares[key] || 0) + 1;
        }
      }
    });
    return {
      base: entregados.length,
      filas: Object.entries(pares)
        .map(([key, veces]) => {
          const [a, b] = key.split("|");
          return { a: productos.find((p) => p.id === a), b: productos.find((p) => p.id === b), veces };
        })
        .filter((x) => x.a && x.b)
        .sort((x, y) => y.veces - x.veces)
        .slice(0, 8),
    };
  }, [encargos, productos]);

  const appccPendientesHoy = useMemo(() => {
    const hoy = todayISO();
    const hechosHoy = new Set(registrosAppcc.filter((r) => r.fecha === hoy).map((r) => r.puntoId));
    return puntosControl.filter((p) => p.activo !== false && !hechosHoy.has(p.id));
  }, [puntosControl, registrosAppcc]);

  const fichajesAbiertos = useMemo(() => {
    const porEmpleadoFecha = {};
    fichajes.forEach((f) => {
      const key = `${f.empleadoId}-${f.fecha}`;
      if (!porEmpleadoFecha[key]) porEmpleadoFecha[key] = [];
      porEmpleadoFecha[key].push(f);
    });
    const abiertos = [];
    Object.entries(porEmpleadoFecha).forEach(([key, lista]) => {
      const entradas = lista.filter((f) => f.tipo === "entrada").length;
      const salidas = lista.filter((f) => f.tipo === "salida").length;
      if (entradas > salidas) {
        const [empleadoId, fecha] = [lista[0].empleadoId, lista[0].fecha];
        const emp = empleados.find((e) => e.id === empleadoId);
        abiertos.push({ empleadoId, fecha, nombre: emp ? emp.nombre : "—" });
      }
    });
    return abiertos;
  }, [fichajes, empleados]);

  // Cuentas por pagar: se calcula el vencimiento de cada factura a partir de
  // los días de pago del proveedor. Si el proveedor no tiene ese dato, no se
  // puede calcular vencimiento y se avisa en vez de inventar una fecha.
  const facturasPorPagar = useMemo(() => {
    const hoy = new Date();
    hoy.setHours(0, 0, 0, 0);
    return albaranes
      .filter((a) => a.estado === "confirmado" && a.esFactura !== false)
      .map((a) => {
        const prov = proveedorPorId(a.proveedorId);
        const base = a.lineas.reduce((x, ln) => x + (Number(ln.importe) || 0), 0);
        const ivaLineas = a.lineas.reduce((x, ln) => x + (Number(ln.importe) || 0) * ((Number(ln.ivaPct) || 0) / 100), 0);
        const cargosBase = Number(a.cargos) || 0;
        const cargosIva = cargosBase * ((Number(a.cargosIva) || 0) / 100);
        const total = base + ivaLineas + cargosBase + cargosIva;
        const fechaFactura = a.fechaFactura || a.fecha;
        const diasPago = prov ? Number(prov.diasPago) || null : null;
        let vencimiento = null;
        let dias = null;
        if (diasPago !== null && fechaFactura) {
          const v = new Date(fechaFactura);
          v.setDate(v.getDate() + diasPago);
          vencimiento = v.toISOString().slice(0, 10);
          dias = Math.round((v - hoy) / 86400000);
        }
        return {
          id: a.id,
          proveedor: prov,
          numeroFactura: a.numeroFactura || a.numero || "s/n",
          fechaFactura,
          vencimiento,
          dias,
          total,
          pagada: !!a.pagada,
        };
      })
      .sort((x, y) => {
        if (x.pagada !== y.pagada) return x.pagada ? 1 : -1;
        if (x.dias === null) return 1;
        if (y.dias === null) return -1;
        return x.dias - y.dias;
      });
  }, [albaranes, proveedores]);

  const pendientesPago = useMemo(() => facturasPorPagar.filter((f) => !f.pagada), [facturasPorPagar]);
  const vencenPronto = useMemo(() => pendientesPago.filter((f) => f.dias !== null && f.dias <= 7), [pendientesPago]);
  const totalPendientePago = useMemo(() => pendientesPago.reduce((a, f) => a + f.total, 0), [pendientesPago]);

  const gastoPorProveedor = useMemo(() => {
    const map = {};
    pedidos.forEach((pe) => {
      const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
      map[pe.proveedorId] = (map[pe.proveedorId] || 0) + total;
    });
    return Object.entries(map)
      .map(([proveedorId, total]) => ({ proveedor: proveedorPorId(proveedorId), total }))
      .sort((a, b) => b.total - a.total);
  }, [pedidos, proveedores]);

  const productosSinMovimiento = useMemo(
    () => productos.filter((p) => !esUtillaje(p) && !movimientos.some((m) => m.productoId === p.id && m.tipo === "salida")),

  if (!ready) {

        {tab === "albaranes" && (

        {tab === "pagos" && (

        {tab === "personal" && (

        {tab === "encargos" && (

            exportarExcelGeneral={exportarExcelGeneral}
          />
        )}
    </>
  );

  // Metadatos de cada módulo: una sola fuente de verdad para las tres
  // organizaciones de menú (por departamento, por ciclo, o por frecuencia).
  const itemsMeta = [
    { id: "dashboard", label: "Panel general", icon: BarChart3 },
    { id: "proveedores", label: "Proveedores", icon: Truck },
    { id: "productos", label: "Productos", icon: Package },
    { id: "pedidos", label: "Pedidos", icon: ShoppingCart, badge: pedidosPendientes.length },
    { id: "recepcion", label: "Recepción", icon: ClipboardList },
    { id: "albaranes", label: "Albaranes", icon: FileText },
    { id: "pagos", label: "Cuentas por pagar", icon: Coins, badge: vencenPronto.length, badgeColor: C.red },
    { id: "conteo", label: "Inventario ciego", icon: Boxes, badge: stockBajo.length, badgeColor: C.amber },
    { id: "saldo", label: "Saldo de almacén", icon: ClipboardList },

    { id: "fichaje", label: "Registro horario", icon: Clock, badge: fichajesAbiertos.length, badgeColor: C.amber },
    { id: "turnos", label: "Cuadrante de turnos", icon: CalendarClock },
    { id: "appcc", label: "Control sanitario", icon: ShieldCheck, badge: appccPendientesHoy.length, badgeColor: C.amber },
    { id: "encargos", label: "Encargos", icon: CalendarDays, badge: encargosUrgentes.length, badgeColor: C.red },

    { id: "libroiva", label: "Libro de IVA", icon: Receipt },
    { id: "caja", label: "Arqueo de caja", icon: Wallet },

  const porId = (id) => itemsMeta.find((x) => x.id === id);
  const pick = (ids) => ids.map(porId).filter(Boolean);

  // A — Por departamento: agrupado como en un ERP (Compras / Almacén / Costes / Finanzas / RRHH)
  const gruposA = [

  // B — Por ciclo de negocio: cada grupo es un proceso completo de principio a fin
  const gruposB = [
    { titulo: null, items: pick(["dashboard"]) },
    { titulo: "Ciclo de compra", items: pick(["proveedores", "pedidos", "recepcion", "albaranes", "pagos"]) },

  // C — Por frecuencia: 3 categorías grandes + "Más" con subcategorías, estilo app móvil
  const categoriasC = {
    comprar: { titulo: "Comprar", items: pick(["proveedores", "pedidos", "recepcion", "albaranes", "pagos"]) },
    almacen: { titulo: "Almacén", items: pick(["productos", "conteo", "saldo", "mapa"]) },

  return (
    <div style={{ background: C.bg, color: C.ink, fontFamily: "'IBM Plex Sans', ui-sans-serif, system-ui" }} className={disenoMenu === "C" ? "w-full min-h-[700px] flex flex-col text-[14px]" : "w-full min-h-[700px] flex flex-col md:flex-row text-[14px]"}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

        @media print {

          body * { visibility: hidden !important; }
          .zona-impresion, .zona-impresion * { visibility: visible !important; }
          .zona-impresion {

            left: 0; top: 0; width: 100%;

          .zona-impresion table { page-break-inside: auto; }
          .zona-impresion tr { page-break-inside: avoid; page-break-after: auto; }
          .zona-impresion thead { display: table-header-group; }
        }
      `}</style>

      {disenoMenu === "C" ? (
        <>
          <TopBarC disenoMenu={disenoMenu} setDisenoMenu={setDisenoMenu} tab={tab} setTab={setTab} pendientes={pedidosPendientes.length} />
          <main className="flex-1 p-4 overflow-y-auto" style={{ maxHeight: "900px" }}>

          <BottomNavC tab={tab} setTab={setTab} categorias={categoriasC} dashboardItem={porId("dashboard")} />

          <SidebarGrupos

            setDisenoMenu={setDisenoMenu}
          />
          <main className="flex-1 p-4 md:p-7 overflow-y-auto" style={{ maxHeight: "900px" }}>
            {contenido}
          </main>
        </>
      )}

      {showBackupView && (
        <Modal onClose={() => setShowBackupView(false)} title="Tu respaldo">
          <div className="text-[12.5px] mb-2" style={{ color: C.ink }}>
            Copia este texto y guárdalo en algún lugar seguro (notas, correo, Google Drive). Para restaurarlo más adelante, pégalo en "Restaurar respaldo".
          </div>
          <textarea
            readOnly
            value={backupText}
            onFocus={(e) => e.target.select()}
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, height: 160, resize: "none" }}
          />
          <div className="flex items-center gap-2">
            <Btn onClick={copiarRespaldo}>{copiado ? "¡Copiado!" : "Copiar al portapapeles"}</Btn>
            <Btn variant="ghost" onClick={() => setShowBackupView(false)}>Cerrar</Btn>
          </div>
          <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
            Si el botón no copia solo, toca dentro del recuadro de texto, selecciona todo y cópialo manualmente.
          </div>
        </Modal>
      )}

      {showRestoreInput && (
        <Modal onClose={() => setShowRestoreInput(false)} title="Restaurar respaldo">
          <div className="text-[12.5px] mb-2" style={{ color: C.ink }}>
            Pega aquí el texto completo del respaldo que copiaste anteriormente.
          </div>
          <textarea
            value={restoreText}
            onChange={(e) => setRestoreText(e.target.value)}
            placeholder="Pega aquí el texto del respaldo…"
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, height: 160, resize: "none" }}
          />
          {restoreError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{restoreError}</div>}
          <div className="flex gap-2">
            <Btn onClick={analizarTextoRestauracion}>Continuar</Btn>
            <Btn variant="ghost" onClick={() => setShowRestoreInput(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {pendingRestore && (
        <Modal onClose={() => setPendingRestore(null)} title="Restaurar respaldo">
          <div className="text-[12.5px] mb-3" style={{ color: C.ink }}>
            Vas a reemplazar los datos actuales del programa con lo que contiene este archivo:
          </div>
          <div className="text-[12.5px] mb-4 space-y-1" style={{ color: C.inkSoft }}>
            <div>Proveedores: <span className="mono">{(pendingRestore.proveedores || []).length}</span></div>
            <div>Productos: <span className="mono">{(pendingRestore.productos || []).length}</span></div>
            <div>Pedidos: <span className="mono">{(pendingRestore.pedidos || []).length}</span></div>
            <div>Movimientos: <span className="mono">{(pendingRestore.movimientos || []).length}</span></div>
            <div>Conteos: <span className="mono">{(pendingRestore.conteos || []).length}</span></div>
            <div>Fichas de costo: <span className="mono">{(pendingRestore.fichasCosto || []).length}</span></div>
            <div>Albaranes: <span className="mono">{(pendingRestore.albaranes || []).length}</span></div>
            <div>Códigos de proveedor aprendidos: <span className="mono">{Object.keys(pendingRestore.catalogoProv || {}).length}</span></div>
            {pendingRestore.exportadoEl && <div>Respaldo generado el: {new Date(pendingRestore.exportadoEl).toLocaleString("es-ES")}</div>}
          </div>
          {!pendingRestore.albaranes && (
            <div className="text-[12px] mb-3 p-2 rounded-lg" style={{ background: C.amberSoft, color: C.ink }}>
              Esta copia es anterior al módulo de albaranes, así que no los contiene. Al restaurarla,
              <b> los albaranes y los códigos de proveedor que tengas ahora se conservan</b>: no se borran.
            </div>
          )}
          <div className="text-[12px] mb-4" style={{ color: C.red }}>
            Esta acción reemplaza todo lo que tengas cargado ahora mismo en el programa. Si quieres conservarlo, cancela y descarga primero un respaldo del estado actual.
          </div>
          <div className="flex gap-2">
            <Btn onClick={confirmarRestauracion}>Sí, restaurar este respaldo</Btn>
            <Btn variant="ghost" onClick={() => setPendingRestore(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function BotonItemSheet({ it, tab, onPick }) {

  const active = tab === it.id;
  return (
    <button
      onClick={onPick}
      className="w-full flex items-center gap-2.5 px-3 py-2.5 rounded-lg text-left mb-1"

      {!!it.badge && (

          {it.badge}
        </span>
      )}

function BottomNavC({ tab, setTab, categorias, dashboardItem }) {
  const [sheet, setSheet] = useState(null); // 'comprar' | 'almacen' | 'mas' | null

  const enComprar = categorias.comprar.items.some((i) => i.id === tab);
  const enAlmacen = categorias.almacen.items.some((i) => i.id === tab);
  const enMas = categorias.mas.some((g) => g.items.some((i) => i.id === tab));
  const enHoy = tab === "dashboard";

  const badgeComprar = categorias.comprar.items.some((i) => i.badge > 0);
  const badgeAlmacen = categorias.almacen.items.some((i) => i.badge > 0);
  const badgeMas = categorias.mas.some((g) => g.items.some((i) => i.badge > 0));

  function BotonNav({ activo, icon: Icon, label, onClick, badge }) {
    return (
      <button onClick={onClick} className="flex-1 flex flex-col items-center gap-0.5 py-2 relative">
        <Icon size={20} color={activo ? C.accent : C.inkSoft} />
        <span className="text-[10.5px] font-medium" style={{ color: activo ? C.accent : C.inkSoft }}>{label}</span>
        {!!badge && <span className="absolute top-1.5 right-[28%] w-2 h-2 rounded-full" style={{ background: C.red }} />}
      </button>
    );
  }

  return (
    <>
      <div className="flex shrink-0" style={{ background: C.surface, borderTop: `1px solid ${C.line}` }}>
        <BotonNav activo={enHoy} icon={BarChart3} label="Hoy" onClick={() => setTab("dashboard")} />
        <BotonNav activo={enComprar} icon={ShoppingCart} label="Comprar" onClick={() => setSheet("comprar")} badge={badgeComprar} />
        <BotonNav activo={enAlmacen} icon={Package} label="Almacén" onClick={() => setSheet("almacen")} badge={badgeAlmacen} />
        <BotonNav activo={enMas} icon={MoreHorizontal} label="Más" onClick={() => setSheet("mas")} badge={badgeMas} />
      </div>

      {sheet === "comprar" && (
        <Modal onClose={() => setSheet(null)} title={categorias.comprar.titulo}>
          {categorias.comprar.items.map((it) => (
            <BotonItemSheet key={it.id} it={it} tab={tab} onPick={() => { setTab(it.id); setSheet(null); }} />
          ))}
        </Modal>
      )}
      {sheet === "almacen" && (
        <Modal onClose={() => setSheet(null)} title={categorias.almacen.titulo}>
          {categorias.almacen.items.map((it) => (
            <BotonItemSheet key={it.id} it={it} tab={tab} onPick={() => { setTab(it.id); setSheet(null); }} />
          ))}
        </Modal>
      )}
      {sheet === "mas" && (
        <Modal onClose={() => setSheet(null)} title="Más">
          {categorias.mas.map((g) => (
            <div key={g.titulo} className="mb-3">
              <div className="text-[11px] font-semibold uppercase tracking-wide mb-1" style={{ color: C.inkSoft }}>{g.titulo}</div>
              {g.items.map((it) => (
                <BotonItemSheet key={it.id} it={it} tab={tab} onPick={() => { setTab(it.id); setSheet(null); }} />
              ))}
            </div>
          ))}
        </Modal>
      )}
    </>
  );
}

/* ================= UI HELPERS ================= */
function Card({ children, className = "", style = {} }) {
  return (
    <div className={`rounded-xl p-4 ${className}`} style={{ background: C.surface, border: `1px solid ${C.line}`, ...style }}>
      {children}

}
function SectionTitle({ children, action }) {
  return (
    <div className="flex items-center justify-between mb-4">
      <h2 className="text-[18px] font-semibold">{children}</h2>
      {action}
    </div>
  );
}
function Btn({ children, onClick, variant = "primary", type = "button", small, disabled = false }) {
  const styles = {
    primary: { background: C.accent, color: "#fff" },
    ghost: { background: "transparent", color: C.ink, border: `1px solid ${C.line}` },
    danger: { background: C.redSoft, color: C.red },
  };
  return (
    <button
      type={type}
      onClick={onClick}
      disabled={disabled}
      className={`inline-flex items-center gap-1.5 rounded-lg font-medium ${small ? "px-2.5 py-1.5 text-[12px]" : "px-3.5 py-2 text-[13px]"}`}
      style={{ ...styles[variant], opacity: disabled ? 0.45 : 1, cursor: disabled ? "not-allowed" : "pointer" }}
    >
      {children}
    </button>
  );
}
function LinkBtn({ children, href, variant = "ghost", small, newTab = true }) {
  const styles = {
    primary: { background: C.accent, color: "#fff" },
    ghost: { background: "transparent", color: C.ink, border: `1px solid ${C.line}` },
    danger: { background: C.redSoft, color: C.red },
  };
  return (
    <a
      href={href}
      {...(newTab ? { target: "_blank", rel: "noopener noreferrer" } : {})}
      className={`inline-flex items-center gap-1.5 rounded-lg font-medium no-underline ${small ? "px-2.5 py-1.5 text-[12px]" : "px-3.5 py-2 text-[13px]"}`}
      style={styles[variant]}

      {children}
    </a>
  );
}
function Input(props) {
  return (
    <input
      {...props}
      className={`w-full rounded-lg px-3 py-2 text-[13px] outline-none ${props.className || ""}`}
      style={{ border: `1px solid ${C.line}`, background: "#fff", ...(props.style || {}) }}
    />
  );
}
function Field({ label, children }) {
  return (
    <label className="block mb-3">
      <div className="text-[12px] font-medium mb-1" style={{ color: C.inkSoft }}>{label}</div>

}
function Empty({ text }) {
  return (
    <div className="text-center py-10 text-[13px]" style={{ color: C.inkSoft }}>

function Pill({ children, color }) {

/* ================= DASHBOARD ================= */
function Dashboard({ valorInventario, valorUtillaje = 0, stockBajo, pedidosPendientes, margenPromedio, movimientos, productos, caducanPronto = [], proveedorPorId, vencenPronto = [], totalPendientePago = 0, documentosPersonalPronto = [], fichajesAbiertos = [], encargosUrgentes = [] }) {

  const salidas30 = movimientos.filter((m) => m.tipo === "salida").reduce((a, m) => a + m.cantidad, 0);

  return (
    <div>
      <div className="flex items-center justify-between mb-4 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>

          <h2 className="text-[18px] font-semibold">Panel general</h2>

        </div>
        <img src={LOGO} alt="" style={{ height: 56, width: "auto" }} />

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-6">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Saldo de almacén</div>
          <div className="text-2xl font-semibold mono mt-1">€{fmt(valorInventario)}</div>
          {valorUtillaje > 0 && (
            <div className="text-[10.5px] mt-0.5" style={{ color: C.inkSoft }}>

          )}
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Margen promedio</div>

        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Pedidos pendientes</div>
          <div className="text-2xl font-semibold mono mt-1">{pedidosPendientes.length}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Productos en stock bajo</div>
          <div className="text-2xl font-semibold mono mt-1" style={{ color: stockBajo.length ? C.red : C.ink }}>{stockBajo.length}</div>

        <Card>

        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Facturas por pagar (7 d)</div>
          <div className="text-2xl font-semibold mono mt-1" style={{ color: vencenPronto.some((f) => f.dias < 0) ? C.red : vencenPronto.length ? C.amber : C.ink }}>
            {vencenPronto.length}
          </div>
          {totalPendientePago > 0 && (
            <div className="text-[10.5px] mt-0.5" style={{ color: C.inkSoft }}>€{fmt(totalPendientePago)} pendiente en total</div>

        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Encargos urgentes</div>
          <div className="text-2xl font-semibold mono mt-1" style={{ color: encargosUrgentes.some((e) => e.dias < 0) ? C.red : encargosUrgentes.length ? C.amber : C.ink }}>

          )}
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Personal: avisos</div>

            {documentosPersonalPronto.length}

      <div className="grid md:grid-cols-2 gap-4">
        <Card>
          <div className="text-[13px] font-semibold mb-3 flex items-center gap-1.5"><AlertTriangle size={15} color={C.amber} /> Alertas de reposición</div>

            <div className="space-y-2">

                <div key={p.id} className="flex items-center justify-between py-1.5 border-b last:border-0" style={{ borderColor: C.line }}>
                  <span>{p.nombre}</span>
                  <span className="mono text-[12px]" style={{ color: C.amber }}>{p.stock} / mín. {p.stockMinimo}</span>

        <Card>
          <div className="text-[13px] font-semibold mb-3 flex items-center gap-1.5">

          {caducanPronto.length === 0 ? (
            <Empty text="Ningún lote caduca en los próximos 30 días." />
          ) : (
            <div className="space-y-1.5 max-h-48 overflow-y-auto">
              {caducanPronto.slice(0, 12).map((l) => {
                const vencido = l.dias < 0;
                const urgente = l.dias >= 0 && l.dias <= 7;
                return (
                  <div key={l.id} className="flex items-center justify-between py-1 border-b last:border-0" style={{ borderColor: C.line }}>
                    <div>
                      <div className="text-[12.5px]">{l.nombre}</div>
                      <div className="text-[10.5px] mono" style={{ color: C.inkSoft }}>
                        {l.lote ? `lote ${l.lote} · ` : ""}{l.caducidad}
                        {l.unidades ? ` · ${fmt(l.unidades)} uds` : ""}
                      </div>
                    </div>
                    <span className="text-[11.5px] mono font-semibold" style={{ color: vencido ? C.red : urgente ? C.amber : C.inkSoft }}>
                      {vencido ? `caducado hace ${Math.abs(l.dias)} d` : l.dias === 0 ? "caduca hoy" : `${l.dias} días`}
                    </span>
                  </div>
                );
              })}
            </div>

        <Card>
          <div className="text-[13px] font-semibold mb-3">Movimiento reciente de almacén</div>
          <div className="flex gap-6 mb-3">
            <div>
              <div className="flex items-center gap-1 text-[12px]" style={{ color: C.accent }}><ArrowUpCircle size={14} /> Entradas totales</div>
              <div className="text-xl font-semibold mono">{entradas30}</div>

              <div className="flex items-center gap-1 text-[12px]" style={{ color: C.red }}><ArrowDownCircle size={14} /> Salidas totales</div>
              <div className="text-xl font-semibold mono">{salidas30}</div>

            <div className="space-y-1.5 max-h-40 overflow-y-auto">

                const p = productos.find((x) => x.id === m.productoId);
                return (
                  <div key={m.id} className="flex items-center justify-between text-[12px]">
                    <span>{p ? p.nombre : "—"} · {m.motivo || m.referencia}</span>
                    <span className="mono" style={{ color: m.tipo === "entrada" ? C.accent : m.tipo === "salida" ? C.red : C.inkSoft }}>
                      {m.tipo === "entrada" ? "+" : m.tipo === "salida" ? "-" : "±"}{Math.abs(m.cantidad)}

                  </div>
                );
              })}
            </div>
          )}
        </Card>
      </div>
    </div>
  );
}

/* ================= PROVEEDORES ================= */
function Proveedores({ proveedores, addProveedor, updateProveedor, deleteProveedor, pedidos }) {
  const blankProv = { nombre: "", contacto: "", telefono: "", email: "", condiciones: "", leadTime: "", diasPago: "" };
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(blankProv);
  const [error, setError] = useState("");
  const [editFor, setEditFor] = useState(null);
  const [editForm, setEditForm] = useState(blankProv);
  const [editError, setEditError] = useState("");

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del proveedor.");
      return;
    }
    setError("");
    addProveedor(form);
    setForm(blankProv);
    setShowForm(false);
  }

  function openEdit(pv) {
    setEditFor(pv.id);
    setEditForm({
      nombre: pv.nombre || "", contacto: pv.contacto || "", telefono: pv.telefono || "",
      email: pv.email || "", condiciones: pv.condiciones || "", leadTime: pv.leadTime || "", diasPago: pv.diasPago || "",
    });
    setEditError("");
  }
  function submitEdit() {
    if (!editForm.nombre.trim()) {
      setEditError("Escribe el nombre del proveedor.");
      return;
    }
    updateProveedor(editFor, editForm);
    setEditFor(null);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Nuevo proveedor</Btn>}>
        Proveedores
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre del proveedor"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Distribuidora del Norte" /></Field>
            <Field label="Persona de contacto"><Input value={form.contacto} onChange={(e) => setForm({ ...form, contacto: e.target.value })} placeholder="Nombre" /></Field>
            <Field label="Teléfono (WhatsApp)"><Input value={form.telefono} onChange={(e) => setForm({ ...form, telefono: e.target.value })} placeholder="+34 600 000 000" /></Field>
            <Field label="Correo electrónico"><Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="pedidos@proveedor.com" /></Field>
            <Field label="Condiciones de pago (texto libre)"><Input value={form.condiciones} onChange={(e) => setForm({ ...form, condiciones: e.target.value })} placeholder="Transferencia 45 días F/F" /></Field>
            <Field label="Días de pago (para calcular vencimientos)"><Input type="number" value={form.diasPago} onChange={(e) => setForm({ ...form, diasPago: e.target.value })} placeholder="45" /></Field>
            <Field label="Tiempo de entrega (días)"><Input type="number" value={form.leadTime} onChange={(e) => setForm({ ...form, leadTime: e.target.value })} placeholder="5" /></Field>
          </div>
          <div className="text-[11px] mb-2" style={{ color: C.inkSoft }}>
            "Días de pago" es el plazo real hasta que toca pagar la factura (lo que ves como "45 días F/F" o "TR 30 días" en el papel).
            Es distinto del tiempo de entrega, que es cuánto tarda en llegarte el pedido.
          </div>
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2 mt-1">
            <Btn onClick={submit}>Guardar proveedor</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {proveedores.length === 0 ? <Empty text="Todavía no has añadido proveedores." /> : (
        <div className="grid md:grid-cols-2 gap-3">
          {proveedores.map((pv) => {
            const nPedidos = pedidos.filter((p) => p.proveedorId === pv.id).length;
            return (
              <Card key={pv.id}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-semibold">{pv.nombre}</div>
                    <div className="text-[12px] mt-0.5" style={{ color: C.inkSoft }}>{pv.contacto}</div>
                  </div>
                  <button onClick={() => deleteProveedor(pv.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                </div>
                <div className="mt-3 text-[12px] space-y-1" style={{ color: C.inkSoft }}>
                  {pv.email && <div>✉ {pv.email}</div>}
                  {pv.telefono && <div>☎ {pv.telefono}</div>}
                  {pv.condiciones && <div>Condiciones: {pv.condiciones}</div>}
                  {pv.leadTime && <div>Entrega estimada: {pv.leadTime} días</div>}
                  {pv.diasPago && <div>Pago a {pv.diasPago} días</div>}
                  <div className="mono">{nPedidos} pedido(s) registrados</div>
                </div>
                <div className="mt-3">
                  <Btn small variant="ghost" onClick={() => openEdit(pv)}>Editar</Btn>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {editFor && (
        <Modal onClose={() => setEditFor(null)} title="Editar proveedor">
          <Field label="Nombre del proveedor"><Input value={editForm.nombre} onChange={(e) => setEditForm({ ...editForm, nombre: e.target.value })} autoFocus /></Field>
          <Field label="Persona de contacto"><Input value={editForm.contacto} onChange={(e) => setEditForm({ ...editForm, contacto: e.target.value })} /></Field>
          <Field label="Teléfono (WhatsApp)"><Input value={editForm.telefono} onChange={(e) => setEditForm({ ...editForm, telefono: e.target.value })} /></Field>
          <Field label="Correo electrónico"><Input type="email" value={editForm.email} onChange={(e) => setEditForm({ ...editForm, email: e.target.value })} /></Field>
          <Field label="Condiciones de pago (texto libre)"><Input value={editForm.condiciones} onChange={(e) => setEditForm({ ...editForm, condiciones: e.target.value })} /></Field>
          <Field label="Días de pago (para vencimientos)"><Input type="number" value={editForm.diasPago} onChange={(e) => setEditForm({ ...editForm, diasPago: e.target.value })} /></Field>
          <Field label="Tiempo de entrega (días)"><Input type="number" value={editForm.leadTime} onChange={(e) => setEditForm({ ...editForm, leadTime: e.target.value })} /></Field>
          {editError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{editError}</div>}
          <div className="flex gap-2 mt-1">
            <Btn onClick={submitEdit}>Guardar cambios</Btn>
            <Btn variant="ghost" onClick={() => setEditFor(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= PRODUCTOS ================= */
function Productos({ productos, proveedores, proveedorPorId, addProducto, updateProducto, deleteProducto, registrarSalida, clasificacionABC, almacenCongelado, movimientos = [] }) {
  const [showForm, setShowForm] = useState(false);
  const blank = { codigo: "", codigoBarras: "", nombre: "", categoria: "", unidad: "unidad", tipo: "materia_prima", alergenos: [], costo: "", ivaCompra: 10, udsPorCaja: 1, nombreEmpaque: "caja", precioVenta: "", ivaVenta: 10, stock: "", stockMinimo: "", zona: "", ubicacion: "", proveedorId: "" };
  const [form, setForm] = useState(blank);
  const [salidaFor, setSalidaFor] = useState(null);
  const [salidaCant, setSalidaCant] = useState("");
  const [salidaMotivo, setSalidaMotivo] = useState("Venta");
  const [salidaMedioPago, setSalidaMedioPago] = useState("Efectivo");
  const [salidaPrecio, setSalidaPrecio] = useState("");
  const [error, setError] = useState("");

  const [editFor, setEditFor] = useState(null);
  const [editForm, setEditForm] = useState(blank);
  const [editError, setEditError] = useState("");
  const [busqueda, setBusqueda] = useState("");
  const [filtroTipo, setFiltroTipo] = useState("todos");
  const [showScanner, setShowScanner] = useState(false);
  const [kardexId, setKardexId] = useState(null);

  const TIPOS_FILTRO = [
    { id: "todos", label: "Todos" },
    { id: "materia_prima", label: "Materias primas" },
    { id: "consumible", label: "Consumibles" },
    { id: "elaborado", label: "Elaborados" },
    { id: "utillaje", label: "Utillaje" },
  ];

  const productosFiltrados = productos.filter((p) => {
    if (filtroTipo !== "todos" && (p.tipo || "materia_prima") !== filtroTipo) return false;
    const q = busqueda.trim().toLowerCase();
    if (!q) return true;
    return [p.nombre, p.codigo, p.codigoBarras, p.categoria, p.ubicacion, p.zona]
      .filter(Boolean)
      .some((campo) => String(campo).toLowerCase().includes(q));
  });

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del producto.");
      return;
    }
    setError("");
    addProducto({ ...form, costo: Number(form.costo) || 0, ivaCompra: Number(form.ivaCompra) || 0, udsPorCaja: Number(form.udsPorCaja) || 1, precioVenta: Number(form.precioVenta) || 0, ivaVenta: Number(form.ivaVenta) || 0, stockMinimo: Number(form.stockMinimo) || 0 });
    setForm(blank);
    setShowForm(false);
  }

  function openEdit(p) {
    setEditFor(p.id);
    setEditForm({
      codigo: p.codigo || "", codigoBarras: p.codigoBarras || "", nombre: p.nombre || "", categoria: p.categoria || "", tipo: p.tipo || "materia_prima", alergenos: p.alergenos || [],
      unidad: p.unidad || "unidad", costo: p.costo ?? "", ivaCompra: p.ivaCompra ?? 10, udsPorCaja: p.udsPorCaja ?? 1, nombreEmpaque: p.nombreEmpaque || "caja", precioVenta: p.precioVenta ?? "", ivaVenta: p.ivaVenta ?? 10,
      stock: p.stock ?? "", stockMinimo: p.stockMinimo ?? "", zona: p.zona || "", ubicacion: p.ubicacion || "", proveedorId: p.proveedorId || "",
    });
    setEditError("");
  }
  function submitEdit() {
    if (!editForm.nombre.trim()) {
      setEditError("Escribe el nombre del producto.");
      return;
    }
    updateProducto(editFor, {
      ...editForm,
      costo: Number(editForm.costo) || 0,
      ivaCompra: Number(editForm.ivaCompra) || 0,
      udsPorCaja: Number(editForm.udsPorCaja) || 1,
      precioVenta: Number(editForm.precioVenta) || 0,
      ivaVenta: Number(editForm.ivaVenta) || 0,

      stockMinimo: Number(editForm.stockMinimo) || 0,

            <span><b>Almacén congelado por conteo en curso.</b> Las entradas y salidas están bloqueadas hasta que finalices el conteo en Inventario ciego.</span>
          </div>

              <Field label="Tipo de producto">

                <option value="">Sin asignar</option>

              <select value={editForm.proveedorId} onChange={(e) => setEditForm({ ...editForm, proveedorId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>

      {kardexId && (() => {
        const p = productos.find((x) => x.id === kardexId);
        if (!p) return null;
        const suyos = [...movimientos.filter((m) => m.productoId === kardexId)].sort((a, b) => (a.fecha + (a.id || "")).localeCompare(b.fecha + (b.id || "")));
        let saldo = 0;
        const filas = suyos.map((m) => {
          const delta = m.tipo === "entrada" ? Number(m.cantidad) || 0 : m.tipo === "salida" ? -(Number(m.cantidad) || 0) : Number(m.cantidad) || 0;
          saldo += delta;
          return { ...m, delta, saldo };
        });
        return (
          <Modal onClose={() => setKardexId(null)} title={`Kardex — ${p.nombre}`} ancho="max-w-2xl">
            <div className="text-[12px] mb-3" style={{ color: C.inkSoft }}>
              Stock actual: <b className="mono">{p.stock} {p.unidad}</b> · Histórico de {filas.length} movimiento(s)
            </div>
            {filas.length === 0 ? <Empty text="Sin movimientos registrados todavía." /> : (
              <div style={{ maxHeight: 400, overflowY: "auto" }}>
                <table className="w-full text-[12px]">
                  <thead>
                    <tr style={{ color: C.inkSoft, borderBottom: `1px solid ${C.line}` }}>
                      <th className="text-left font-medium py-1.5 px-2">Fecha</th>
                      <th className="text-left font-medium py-1.5 px-2">Motivo</th>
                      <th className="text-right font-medium py-1.5 px-2">Movimiento</th>
                      <th className="text-right font-medium py-1.5 px-2">Saldo</th>
                    </tr>
                  </thead>
                  <tbody>
                    {[...filas].reverse().map((m, i) => (
                      <tr key={m.id} style={{ background: i % 2 ? C.bg : "#fff" }}>
                        <td className="py-1.5 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{m.fecha}</td>
                        <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{m.motivo || m.referencia || m.tipo}</td>
                        <td className="py-1.5 px-2 text-right mono" style={{ border: `1px solid ${C.line}`, color: m.delta >= 0 ? C.accent : C.red }}>
                          {m.delta >= 0 ? "+" : ""}{fmt(m.delta)}
                        </td>
                        <td className="py-1.5 px-2 text-right mono font-semibold" style={{ border: `1px solid ${C.line}` }}>{fmt(m.saldo)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
            <div className="mt-3">
              <Btn variant="ghost" onClick={() => setKardexId(null)}>Cerrar</Btn>
            </div>
          </Modal>
        );
      })()}
    </div>
  );
}

/* ================= MODAL ================= */
/* ====== Bloque de compra por caja / paquete ====== */
/* Campo cuyo valor se calcula a partir de otro. Mientras el usuario escribe
   se muestra tal cual lo teclea; al salir del campo vuelve al valor calculado.
   Sin esto, el reformateo en cada pulsación impide escribir decimales. */
function InputCalc({ valor, onEscribir, decimales = 2, ...props }) {
  const [borrador, setBorrador] = useState(null);
  const formateado =
    valor === "" || valor === null || valor === undefined || isNaN(Number(valor))
      ? ""
      : Number(valor).toFixed(decimales);
  const mostrado = borrador !== null ? borrador : formateado;
  return (
    <Input
      {...props}
      type="number"
      value={mostrado}
      onChange={(e) => { setBorrador(e.target.value); onEscribir(e.target.value); }}
      onBlur={() => setBorrador(null)}
    />
  );
}

function Bloque({ titulo, children }) {
  return (
    <div className="mb-4">
      <div className="text-[11px] font-semibold uppercase tracking-wider mb-2 pb-1" style={{ color: C.accent, borderBottom: `1px solid ${C.line}` }}>
        {titulo}
      </div>
      {children}
    </div>
  );
}

function CompraPorCaja({ form, setForm }) {
  const iva = Number(form.ivaCompra) || 0;
  const uds = Number(form.udsPorCaja) || 1;
  const costoUd = Number(form.costo) || 0;

  // Escribir en cualquiera de las casillas recalcula el costo por unidad
  const desdeCaja = (valor, conIva) => {
    if (valor === "") { setForm({ ...form, costo: "" }); return; }
    let neto = Number(valor);
    if (isNaN(neto)) return;
    if (conIva) neto = neto / (1 + iva / 100);
    setForm({ ...form, costo: String(uds > 0 ? neto / uds : neto) });
  };
  const desdeUnidadBruta = (valor) => {
    if (valor === "") { setForm({ ...form, costo: "" }); return; }
    const n = Number(valor);
    if (isNaN(n)) return;
    setForm({ ...form, costo: String(n / (1 + iva / 100)) });
  };

  const cajaNeta = costoUd > 0 ? costoUd * uds : "";
  const cajaBruta = costoUd > 0 ? costoUd * uds * (1 + iva / 100) : "";
  const unidadBruta = costoUd > 0 ? costoUd * (1 + iva / 100) : "";

  return (
    <div className="rounded-lg p-3 mb-3" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
      <div className="text-[12px] font-semibold mb-1">Cómo te lo vende el proveedor</div>
      <div className="text-[11px] mb-3" style={{ color: C.inkSoft }}>
        Escribe en la casilla que traiga tu factura. Las demás se calculan solas.
      </div>

      <Field label="Unidades por caja (1 si lo compras suelto)">
        <Input type="number" step="1" value={form.udsPorCaja} onChange={(e) => setForm({ ...form, udsPorCaja: e.target.value })} />
      </Field>

      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Precio CAJA sin IVA (€)">
          <InputCalc step="0.01" valor={cajaNeta} decimales={2} onEscribir={(v) => desdeCaja(v, false)} />
        </Field>
        <Field label="Precio CAJA con IVA (€)">
          <InputCalc step="0.01" valor={cajaBruta} decimales={2} onEscribir={(v) => desdeCaja(v, true)} />
        </Field>
        <Field label="Costo UNIDAD sin IVA (€)">
          <InputCalc step="0.0001" valor={form.costo} decimales={4} onEscribir={(v) => setForm({ ...form, costo: v })} />
        </Field>
        <Field label="Costo UNIDAD con IVA (€)">
          <InputCalc step="0.0001" valor={unidadBruta} decimales={4} onEscribir={desdeUnidadBruta} />
        </Field>
      </div>

      {uds > 1 && costoUd > 0 && (
        <div className="text-[11.5px] mono" style={{ color: C.accent }}>
          Caja de {uds}: €{fmt(costoUd * uds)} sin IVA · €{fmt(costoUd * uds * (1 + iva / 100))} con IVA → unidad €{fmt(costoUd)}
        </div>
      )}
    </div>
  );
}

function Modal({ children, onClose, title, ancho = "max-w-md" }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto" style={{ background: "rgba(20,32,28,0.45)" }}>
      <div className={`rounded-xl p-5 w-full ${ancho} my-4`} style={{ background: C.surface }}>
        <div className="flex items-center justify-between mb-4">
          <div className="font-semibold text-[15px]">{title}</div>
          <button onClick={onClose}><X size={17} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ================= PEDIDOS ================= */
function Pedidos({ pedidos, proveedores, productos, crearPedido, actualizarPedido, eliminarPedido, proveedorPorId, productoPorId }) {
  const [showForm, setShowForm] = useState(false);
  const [proveedorId, setProveedorId] = useState("");
  const [fechaEsperada, setFechaEsperada] = useState("");
  const [items, setItems] = useState([]);
  const [enviarPedido, setEnviarPedido] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  function addItemRow() {
    if (!productos.length) return;
    setItems((s) => [...s, { productoId: productos[0].id, cantidad: 1, costoUnitario: productos[0].costo }]);
  }
  function updateItem(idx, field, value) {
    setItems((s) =>
      s.map((it, i) => {
        if (i !== idx) return it;
        if (field === "productoId") {
          const p = productos.find((pr) => pr.id === value);
          return { ...it, productoId: value, costoUnitario: p ? p.costo : it.costoUnitario };
        }
        return { ...it, [field]: value };
      })
    );
  }
  function removeItem(idx) {
    setItems((s) => s.filter((_, i) => i !== idx));
  }
  const [error, setError] = useState("");

  function resetForm() {
    setItems([]);
    setProveedorId("");
    setFechaEsperada("");
    setEditingId(null);
    setError("");
  }

  function openEdit(pedido) {
    setEditingId(pedido.id);
    setProveedorId(pedido.proveedorId);
    setFechaEsperada(pedido.fechaEsperada || "");
    setItems(pedido.items.map((it) => ({ productoId: it.productoId, cantidad: it.cantidad, costoUnitario: it.costoUnitario })));
    setError("");
    setShowForm(true);
  }

  function submit() {
    if (!proveedorId) {
      setError("Selecciona un proveedor.");
      return;
    }
    if (items.length === 0) {
      setError("Añade al menos un producto al pedido.");
      return;
    }
    setError("");
    const itemsLimpios = items.map((it) => ({ productoId: it.productoId, cantidad: Number(it.cantidad), costoUnitario: Number(it.costoUnitario) }));
    if (editingId) {
      actualizarPedido(editingId, { proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
    } else {
      const pedido = crearPedido({ proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
      setEnviarPedido(pedido);
    }
  }

  function textoPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const lineas = pedido.items.map((it) => {
      const p = productoPorId(it.productoId);
      return `- ${p ? p.nombre : "?"} x${it.cantidad} @ €${fmt(it.costoUnitario)} = €${fmt(it.cantidad * it.costoUnitario)}`;
    });
    const total = pedido.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
    const ivaTotal = pedido.items.reduce((a, it) => {
      const prod = productoPorId(it.productoId);
      return a + it.cantidad * it.costoUnitario * (ivaCompraDe(prod) / 100);
    }, 0);
    return `Pedido para ${prov ? prov.nombre : ""}\nFecha: ${pedido.fecha}\nEntrega esperada: ${pedido.fechaEsperada || "por confirmar"}\n\nProductos:\n${lineas.join("\n")}\n\nBase imponible: €${fmt(total)}\nIVA: €${fmt(ivaTotal)}\nTOTAL: €${fmt(total + ivaTotal)}`;
  }

  function mailtoHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `mailto:${prov?.email || ""}?subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailAppHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `googlegmail:///co?to=${encodeURIComponent(prov?.email || "")}&subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailWebHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const params = new URLSearchParams({
      view: "cm", fs: "1",
      to: prov?.email || "",
      su: "Pedido - " + (prov?.nombre || ""),
      body: texto,
    });
    return `https://mail.google.com/mail/?${params.toString()}`;
  }

  const [compartirError, setCompartirError] = useState("");
  async function compartirPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    if (navigator.share) {
      try {
        await navigator.share({
          title: `Pedido - ${prov?.nombre || ""}`,
          text: texto,
        });
        setCompartirError("");
      } catch (e) {
        if (e && e.name !== "AbortError") setCompartirError("No se pudo abrir el menú de compartir.");
      }
    } else {
      setCompartirError("Tu navegador no permite compartir. Usa las otras opciones o copia el texto.");
    }
  }
  function whatsappHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const numero = (prov?.telefono || "").replace(/[^0-9]/g, "");
    return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
  }

  const [correoPedido, setCorreoPedido] = useState(null);

  const estadoColor = { Pendiente: C.amber, Parcial: C.accent, Recibido: C.inkSoft };

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { if (showForm) { resetForm(); } setShowForm((s) => !s); }}><Plus size={15} /> Nuevo pedido</Btn>}>
        Pedidos de compra
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando pedido pendiente" : "Nuevo pedido"}</div>
          <div>
            <div className="grid md:grid-cols-2 gap-x-4">
              <Field label="Proveedor">
                <select value={proveedorId} onChange={(e) => setProveedorId(e.target.value)} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                  <option value="">Selecciona un proveedor</option>
                  {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
              </Field>
              <Field label="Fecha esperada de entrega">
                <Input type="date" value={fechaEsperada} onChange={(e) => setFechaEsperada(e.target.value)} />
              </Field>
            </div>

            <div className="mb-2 text-[12px] font-medium" style={{ color: C.inkSoft }}>Productos del pedido</div>
            {items.map((it, idx) => (
              <div key={idx}>
              <div className="flex gap-2 items-center mb-2">
                <select value={it.productoId} onChange={(e) => updateItem(idx, "productoId", e.target.value)} className="flex-1 rounded-lg px-2 py-2 text-[12.5px]" style={{ border: `1px solid ${C.line}` }}>
                  {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
                <Input type="number" style={{ width: 80 }} value={it.cantidad} onChange={(e) => updateItem(idx, "cantidad", e.target.value)} placeholder="Cant." />
                <Input type="number" step="0.01" style={{ width: 100 }} value={it.costoUnitario} onChange={(e) => updateItem(idx, "costoUnitario", e.target.value)} placeholder="Costo u." />
                <button type="button" onClick={() => removeItem(idx)}><X size={16} color={C.inkSoft} /></button>
              </div>
              {(() => {
                const prod = productos.find((pr) => pr.id === it.productoId);
                const uds = udsPorCaja(prod);
                if (!prod || uds <= 1) return null;
                const cajas = Number(it.cantidad) / uds;
                const enteras = Number.isInteger(cajas);
                return (
                  <div className="text-[11px] mb-2 flex items-center gap-2 flex-wrap" style={{ color: enteras ? C.accent : C.amber }}>
                    <span>
                      {fmt(cajas)} caja(s) de {uds} {prod.unidad}
                      {!enteras && " — no es un número exacto de cajas"}
                    </span>
                    <button
                      type="button"
                      onClick={() => updateItem(idx, "cantidad", String(Math.ceil(cajas) * uds))}
                      className="underline"
                      style={{ color: C.accent }}
                    >
                      redondear a {Math.ceil(cajas)} caja(s) = {Math.ceil(cajas) * uds} {prod.unidad}
                    </button>
                  </div>
                );
              })()}
              </div>
            ))}

            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
