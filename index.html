  );
}

/* ================= CUENTAS POR PAGAR ================= */
function CuentasPorPagar({ facturasPorPagar, totalPendientePago, marcarPagada, marcarPagadaFacturaDirecta, addFacturaDirecta, deleteFacturaDirecta, proveedores }) {
  const [verPagadas, setVerPagadas] = useState(false);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ proveedorId: "", concepto: "", numeroFactura: "", fecha: todayISO(), importeBase: "", ivaPct: 21, vencimiento: "" });
  const [error, setError] = useState("");

  const pendientes = facturasPorPagar.filter((f) => !f.pagada);
  const pagadas = facturasPorPagar.filter((f) => f.pagada);
  const vencidas = pendientes.filter((f) => f.dias !== null && f.dias < 0);
  const proximas = pendientes.filter((f) => f.dias !== null && f.dias >= 0 && f.dias <= 7);
  const sinDatos = pendientes.filter((f) => f.dias === null);

  const colorPara = (f) => {
    if (f.dias === null) return C.inkSoft;
    if (f.dias < 0) return C.red;
    if (f.dias <= 7) return C.amber;
    return C.ink;
  };
  const textoPara = (f) => {
    if (f.dias === null) return "Sin días de pago";
    if (f.dias < 0) return `Vencida hace ${Math.abs(f.dias)} d`;
    if (f.dias === 0) return "Vence hoy";
    return `Vence en ${f.dias} d`;
  };

  function marcar(f, pagada) {
    if (f.origen === "directa") marcarPagadaFacturaDirecta(f.id, pagada);
    else marcarPagada(f.id, pagada);
  }

  function submit() {
    if (!form.concepto.trim()) { setError("Escribe de qué es el gasto (ej. \"Electricidad julio\")."); return; }
    if (!(Number(form.importeBase) > 0)) { setError("Pon un importe mayor que cero."); return; }
    setError("");
    addFacturaDirecta(form);
    setForm({ proveedorId: "", concepto: "", numeroFactura: "", fecha: todayISO(), importeBase: "", ivaPct: 21, vencimiento: "" });
    setShowForm(false);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Factura directa</Btn>}>
        Cuentas por pagar
      </SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Junta dos orígenes: las facturas dadas de entrada por Albaranes (mercancía recibida) y las <b>facturas
          directas</b> que registres aquí a mano — luz, alquiler, gestoría, cualquier gasto sin productos de por
          medio. El vencimiento sale de la fecha de factura más los días de pago del proveedor, o de la fecha que
          pongas tú a mano si no hay proveedor con ese dato.
        </div>
      </Card>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">Nueva factura directa</div>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="¿De qué es? (concepto)">
              <Input value={form.concepto} onChange={(e) => setForm({ ...form, concepto: e.target.value })} placeholder="Electricidad julio, alquiler local…" />
            </Field>
            <Field label="Proveedor (opcional)">
              <select value={form.proveedorId} onChange={(e) => setForm({ ...form, proveedorId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                <option value="">Sin asignar</option>
                {proveedores.map((pv) => <option key={pv.id} value={pv.id}>{pv.nombre}</option>)}
              </select>
            </Field>
            <Field label="Número de factura (opcional)">
              <Input value={form.numeroFactura} onChange={(e) => setForm({ ...form, numeroFactura: e.target.value })} />
            </Field>
            <Field label="Fecha de la factura">
              <Input type="date" value={form.fecha} onChange={(e) => setForm({ ...form, fecha: e.target.value })} />
            </Field>
            <Field label="Importe sin IVA (€)">
              <Input type="number" step="0.01" value={form.importeBase} onChange={(e) => setForm({ ...form, importeBase: e.target.value })} />
            </Field>
            <Field label="IVA %">
              <select value={form.ivaPct} onChange={(e) => setForm({ ...form, ivaPct: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                {TIPOS_IVA.map((v) => <option key={v} value={v}>{v}%</option>)}
              </select>
            </Field>
            <Field label="Vencimiento manual (opcional)">
              <Input type="date" value={form.vencimiento} onChange={(e) => setForm({ ...form, vencimiento: e.target.value })} placeholder="Si no, se calcula por días de pago" />
            </Field>
          </div>
          {Number(form.importeBase) > 0 && (
            <div className="text-[12px] mb-2" style={{ color: C.inkSoft }}>
              Total con IVA: <b className="mono">€{fmt(Number(form.importeBase) * (1 + Number(form.ivaPct) / 100))}</b>
            </div>
          )}
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>Guardar factura</Btn>
            <Btn variant="ghost" onClick={() => setShowForm(false)}>Cancelar</Btn>
          </div>
        </Card>
      )}

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Pendiente de pagar</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(totalPendientePago)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>Vencidas / próximos 7 días</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: vencidas.length ? C.red : proximas.length ? C.amber : C.ink }}>
            {vencidas.length + proximas.length}
          </div>
        </Card>
      </div>

      {pendientes.length === 0 ? <Empty text="No hay facturas pendientes de pago." /> : (
        <div className="space-y-2 mb-4">
          {pendientes.map((f) => (
            <Card key={f.id}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-semibold">{f.proveedor ? f.proveedor.nombre : f.origen === "directa" ? "Sin proveedor" : "Proveedor eliminado"}</span>
                    <Pill color={f.origen === "directa" ? C.amber : C.inkSoft}>{f.origen === "directa" ? "Directa" : "Mercancía"}</Pill>
                  </div>
                  <div className="text-[12px]" style={{ color: C.inkSoft }}>{f.concepto}</div>
                  <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                    Factura {f.numeroFactura} · {f.fechaFactura}
                    {f.vencimiento && <> · vence {new Date(f.vencimiento).toLocaleDateString("es-ES")}</>}
                  </div>
                </div>
                <div className="text-right">
                  <div className="mono font-semibold">€{fmt(f.total)}</div>
                  <div className="text-[11.5px] font-medium mt-0.5" style={{ color: colorPara(f) }}>{textoPara(f)}</div>
                </div>
              </div>
              <div className="mt-2 flex gap-2">
                <Btn small onClick={() => marcar(f, true)}><CheckCircle2 size={13} /> Marcar como pagada</Btn>
                {f.origen === "directa" && (
                  <Btn small variant="ghost" onClick={() => deleteFacturaDirecta(f.id)}><Trash2 size={13} /> Eliminar</Btn>
                )}
              </div>
            </Card>
          ))}
        </div>
      )}

      {sinDatos.length > 0 && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12px]">
            {sinDatos.length} factura(s) sin poder calcular vencimiento porque falta el proveedor con "días de pago"
            puestos, o el vencimiento manual. Añádelo en Proveedores, o edítalo a mano si es una factura directa.
          </div>
        </Card>
      )}

      <button onClick={() => setVerPagadas((s) => !s)} className="text-[12.5px] font-medium mb-2" style={{ color: C.accent }}>
        {verPagadas ? "Ocultar" : "Ver"} facturas ya pagadas ({pagadas.length})
      </button>

      {verPagadas && (
        <div className="space-y-2">
          {pagadas.length === 0 ? <Empty text="Todavía no has marcado ninguna como pagada." /> : pagadas.map((f) => (
            <Card key={f.id} style={{ background: C.bg }}>
              <div className="flex items-center justify-between">
                <div>
                  <div className="text-[13px] flex items-center gap-1.5">
                    {f.proveedor ? f.proveedor.nombre : f.origen === "directa" ? "Sin proveedor" : "Proveedor eliminado"}
                    <Pill color={f.origen === "directa" ? C.amber : C.inkSoft}>{f.origen === "directa" ? "Directa" : "Mercancía"}</Pill>
                  </div>
                  <div className="text-[11px]" style={{ color: C.inkSoft }}>{f.concepto} · Factura {f.numeroFactura}</div>
                </div>
                <div className="flex items-center gap-2">
                  <span className="mono text-[12.5px]" style={{ color: C.inkSoft }}>€{fmt(f.total)}</span>
                  <Btn small variant="ghost" onClick={() => marcar(f, false)}>Deshacer</Btn>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= PERSONAL ================= */
const TIPOS_CONTRATO = [
  "Indefinido",
  "Indefinido fijo-discontinuo",
  "Temporal — circunstancias de la producción",
  "Temporal — sustitución",
  "Formación en alternancia",
  "Obtención de práctica profesional",
];

function blankEmpleado() {
  return {
    nombre: "",
    dni: "",
    puesto: "",
    rol: "Estándar",
    diasDisponibles: [],
    tipoContrato: "Indefinido",
    fechaAlta: todayISO(),
    fechaFinContrato: "",
    horasSemanales: 40,
    pagas: 14,
    salarioBrutoMensual: "",
    costeEmpresaMensual: "",
    diasVacacionesAnuales: 30,
    pin: "",
    documentos: [],
    activo: true,
  };
}

function Personal({ empleados, addEmpleado, updateEmpleado, deleteEmpleado, anonimizarEmpleado, registrarAusencia, eliminarAusencia, registrarEpi, eliminarEpi, documentosPersonalCaducan, fichajes = [], nominas = [] }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(blankEmpleado());
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [ausenciaFor, setAusenciaFor] = useState(null);
  const [ausenciaForm, setAusenciaForm] = useState({ tipo: "Vacaciones", fechaInicio: todayISO(), fechaFin: todayISO() });
  const [epiFor, setEpiFor] = useState(null);
  const [epiForm, setEpiForm] = useState({ nombre: "", firmado: false });
  const [detalleId, setDetalleId] = useState(null);

  function resetForm() {
    setForm(blankEmpleado());
    setEditingId(null);
    setError("");
  }

  function openEdit(e) {
    setEditingId(e.id);
    setForm({
      nombre: e.nombre || "", dni: e.dni || "", puesto: e.puesto || "", rol: e.rol && ROLES_EMPLEADO[e.rol] ? e.rol : "Estándar",
      diasDisponibles: e.diasDisponibles || [],
      tipoContrato: e.tipoContrato || "Indefinido", fechaAlta: e.fechaAlta || todayISO(),
      fechaFinContrato: e.fechaFinContrato || "", horasSemanales: e.horasSemanales ?? 40, pagas: e.pagas ?? 14,
      salarioBrutoMensual: e.salarioBrutoMensual ?? "", costeEmpresaMensual: e.costeEmpresaMensual ?? "",
      diasVacacionesAnuales: e.diasVacacionesAnuales ?? 30,
      pin: e.pin || "",
      documentos: (e.documentos || []).map((d) => ({ ...d })),
      activo: e.activo !== false,
    });
    setError("");
    setShowForm(true);
  }

  function addDocumento() {
    setForm((f) => ({ ...f, documentos: [...f.documentos, { id: uid(), nombre: "", fechaCaducidad: "" }] }));
  }
  function updateDocumento(idx, campo, valor) {
    setForm((f) => ({ ...f, documentos: f.documentos.map((d, i) => (i === idx ? { ...d, [campo]: valor } : d)) }));
  }
  function quitarDocumento(idx) {
    setForm((f) => ({ ...f, documentos: f.documentos.filter((_, i) => i !== idx) }));
  }

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del empleado.");
      return;
    }
    if (form.pin && !/^\d{4,6}$/.test(form.pin)) {
      setError("El código de acceso debe tener entre 4 y 6 dígitos.");
      return;
    }
    if (form.pin && empleados.some((e) => e.id !== editingId && e.pin === form.pin)) {
      setError("Ese código ya lo usa otro empleado. Ponle uno distinto.");
      return;
    }
    setError("");
    const datos = {
      ...form,
      horasSemanales: Number(form.horasSemanales) || 0,
      pagas: Number(form.pagas) || 14,
      salarioBrutoMensual: Number(form.salarioBrutoMensual) || 0,
      costeEmpresaMensual: form.costeEmpresaMensual === "" ? "" : Number(form.costeEmpresaMensual),
      diasVacacionesAnuales: Number(form.diasVacacionesAnuales) || 0,
    };
    if (editingId) updateEmpleado(editingId, datos);
    else addEmpleado(datos);
    resetForm();
    setShowForm(false);
  }

  function diasAusencia(ini, fin) {
    const a = new Date(ini), b = new Date(fin);
    if (isNaN(a) || isNaN(b)) return 0;
    return Math.max(1, Math.round((b - a) / 86400000) + 1);
  }

  function submitAusencia() {
    registrarAusencia(ausenciaFor, {
      tipo: ausenciaForm.tipo,
      fechaInicio: ausenciaForm.fechaInicio,
      fechaFin: ausenciaForm.fechaFin,
      dias: diasAusencia(ausenciaForm.fechaInicio, ausenciaForm.fechaFin),
    });
    setAusenciaFor(null);
    setAusenciaForm({ tipo: "Vacaciones", fechaInicio: todayISO(), fechaFin: todayISO() });
  }

  const anioActual = new Date().getFullYear();
  // Descarga un texto como archivo, para el "derecho de acceso" del RGPD:
  // que la persona pueda llevarse una copia legible de lo que se guarda
  // sobre ella. Funciona entero en el navegador, sin mandar nada a ningún
  // sitio.
  function descargarComoArchivo(nombreArchivo, texto) {
    const blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombreArchivo;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportarDatosEmpleado(e) {
    const fichajesDelEmpleado = fichajes.filter((f) => f.empleadoId === e.id);
    const nominasDelEmpleado = nominas.filter((n) => n.empleadoId === e.id);
    const lineas = [
      `DATOS GUARDADOS SOBRE: ${e.nombre}`,
      `Generado el ${todayISO()}`,
      "",
      "=== FICHA ===",
      `Nombre: ${e.nombre}`,
      `DNI: ${e.dni || "—"}`,
      `Puesto: ${e.puesto || "—"}`,
      `Tipo de contrato: ${e.tipoContrato || "—"}`,
      `Fecha de alta: ${e.fechaAlta || "—"}`,
      `Fecha de fin de contrato: ${e.fechaFinContrato || "—"}`,
      `Horas semanales: ${e.horasSemanales ?? "—"}`,
      `Estado: ${e.activo === false ? "de baja" : "activo"}`,
      "",
      "=== AUSENCIAS ===",
      ...((e.ausencias || []).length === 0 ? ["Ninguna registrada."] : (e.ausencias || []).map((a) => `${a.tipo}: ${a.fechaInicio} a ${a.fechaFin} (${a.dias} día/s)`)),
      "",
      "=== DOCUMENTOS ===",
      ...((e.documentos || []).length === 0 ? ["Ninguno registrado."] : (e.documentos || []).map((d) => `${d.nombre}${d.fechaCaducidad ? ` — caduca ${d.fechaCaducidad}` : ""}`)),
      "",
      `=== FICHAJES (${fichajesDelEmpleado.length} registrados) ===`,
      ...(fichajesDelEmpleado.length === 0 ? ["Ninguno registrado."] : fichajesDelEmpleado.slice(0, 200).map((f) => `${f.fecha} ${f.hora} — ${f.tipo}`)),
      fichajesDelEmpleado.length > 200 ? `… y ${fichajesDelEmpleado.length - 200} más (se han omitido por espacio).` : "",
      "",
      `=== NÓMINAS REGISTRADAS (${nominasDelEmpleado.length}) ===`,
      ...(nominasDelEmpleado.length === 0 ? ["Ninguna registrada."] : nominasDelEmpleado.map((n) => `${n.mes}: bruto €${fmt(n.brutoTotal)} + SS empresa €${fmt(n.seguridadSocialEmpresa)}`)),
    ];
    descargarComoArchivo(`datos-${e.nombre.replace(/\s+/g, "-").toLowerCase()}.txt`, lineas.filter((l) => l !== "").join("\n"));
  }

  function vacacionesUsadas(e) {
    return (e.ausencias || [])
      .filter((a) => a.tipo === "Vacaciones" && new Date(a.fechaInicio).getFullYear() === anioActual)

/* ================= REGISTRO HORARIO ================= */
function inicioSemana(fecha) {
  const d = new Date(fecha);
  const dia = d.getDay(); // 0 domingo .. 6 sabado
  const diff = dia === 0 ? -6 : 1 - dia; // lunes como inicio
  const l = new Date(d);
  l.setDate(d.getDate() + diff);
  return l.toISOString().slice(0, 10);
}

function RegistroHorario({ empleados, fichajes, fichar, addFichajeManual, updateFichaje, eliminarFichaje, fichajesAbiertos }) {
  const activos = empleados.filter((e) => e.activo !== false);
  const [desde, setDesde] = useState(inicioSemana(new Date()));
  const [hasta, setHasta] = useState(todayISO());
  const [showManual, setShowManual] = useState(false);
  const [manual, setManual] = useState({ empleadoId: activos[0]?.id || "", fecha: todayISO(), tipo: "entrada", hora: "09:00" });
  const [manualError, setManualError] = useState("");
  const [showExportar, setShowExportar] = useState(false);
  const [copiado, setCopiado] = useState(false);

  function irEstaSemana() {
    setDesde(inicioSemana(new Date()));
    setHasta(todayISO());
  }
  function irSemanaAnterior() {
    const d = new Date();
    d.setDate(d.getDate() - 7);
    const ini = inicioSemana(d);
    const fin = new Date(ini);
    fin.setDate(fin.getDate() + 6);
    setDesde(ini);
    setHasta(fin.toISOString().slice(0, 10));
  }

  const estadoHoy = activos.map((e) => {
    const deHoy = fichajes.filter((f) => f.empleadoId === e.id && f.fecha === todayISO()).sort((a, b) => (a.hora || "").localeCompare(b.hora || ""));
    const entradas = deHoy.filter((f) => f.tipo === "entrada");
    const salidas = deHoy.filter((f) => f.tipo === "salida");
    const abierto = entradas.length > salidas.length;
    return { empleado: e, ultimaEntrada: entradas[entradas.length - 1], abierto, totalFichajesHoy: deHoy.length };
  });

  // Agrupar por empleado + fecha dentro del rango, para ver horas trabajadas por día
  const filasHistorial = useMemo(() => {
    const grupos = {};
    fichajes
      .filter((f) => f.fecha >= desde && f.fecha <= hasta)
      .forEach((f) => {
        const key = `${f.empleadoId}-${f.fecha}`;
        if (!grupos[key]) grupos[key] = { empleadoId: f.empleadoId, fecha: f.fecha, entradas: [], salidas: [] };
        if (f.tipo === "entrada") grupos[key].entradas.push(f);
        else grupos[key].salidas.push(f);
      });
    return Object.values(grupos)
      .map((g) => {
        const emp = empleados.find((e) => e.id === g.empleadoId);
        const entrada = g.entradas.sort((a, b) => a.hora.localeCompare(b.hora))[0];
        const salida = g.salidas.sort((a, b) => a.hora.localeCompare(b.hora)).slice(-1)[0];
        let horas = null;
        if (entrada && salida) {
          const [h1, m1] = entrada.hora.split(":").map(Number);
          const [h2, m2] = salida.hora.split(":").map(Number);
          horas = (h2 * 60 + m2 - (h1 * 60 + m1)) / 60;
        }
        return { ...g, nombre: emp ? emp.nombre : "—", entrada, salida, horas };
      });
  }, [fichajes, desde, hasta, empleados]);

  function textoRegistro() {
    const lineas = filasHistorial
      .sort((a, b) => a.fecha.localeCompare(b.fecha) || a.nombre.localeCompare(b.nombre))
      .map((f) => `${f.fecha} · ${f.nombre} · Entrada ${f.entrada ? f.entrada.hora : "—"} · Salida ${f.salida ? f.salida.hora : "sin fichar"} · ${f.horas !== null ? f.horas.toFixed(2) + " h" : ""}`);
    return `REGISTRO HORARIO\nDel ${desde} al ${hasta}\n\n${lineas.join("\n")}\n\nGenerado el ${new Date().toLocaleString("es-ES")}`;
  }

  function copiarRegistro() {
    const texto = textoRegistro();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  function submitManual() {
    if (!manual.empleadoId) {
      setManualError("Selecciona un empleado.");
      return;
    }
    setManualError("");
    addFichajeManual({
      empleadoId: manual.empleadoId,
      fecha: manual.fecha,
      tipo: manual.tipo,
      hora: manual.hora,
      timestamp: new Date(`${manual.fecha}T${manual.hora}:00`).toISOString(),
      manual: true,
    });
    setShowManual(false);
  }

  return (
    <div>
      <SectionTitle>Registro horario</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Desde 2019, todas las empresas en España están obligadas a llevar un registro diario de la jornada de cada
          persona trabajadora, sea cual sea su tamaño. Este registro se debe conservar 4 años y estar disponible para
          la Inspección de Trabajo si lo pide.
        </div>
      </Card>

      {fichajesAbiertos.length > 0 && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12.5px] font-semibold mb-1">Fichajes sin cerrar</div>
          {fichajesAbiertos.map((f, i) => (
            <div key={i} className="text-[12px]">{f.nombre} — entró el {f.fecha} y no consta salida</div>

                <Btn small variant="ghost" disabled={!abierto} onClick={() => fichar(empleado.id, "salida")}><LogOut size={13} /> Salida</Btn>
              </div>
            </Card>

      )}

      <div className="flex items-center justify-between mb-2">
        <div className="text-[12px] font-medium" style={{ color: C.inkSoft }}>Historial</div>
        <div className="flex gap-2">
          <Btn small variant="ghost" onClick={() => setShowManual(true)}><Plus size={13} /> Corrección manual</Btn>
          <Btn small variant="ghost" onClick={() => setShowExportar(true)}><Download size={13} /> Exportar</Btn>

      <Card className="mb-4">
        <div className="flex flex-wrap gap-2 mb-3">
          <Btn small variant="ghost" onClick={irEstaSemana}>Esta semana</Btn>
          <Btn small variant="ghost" onClick={irSemanaAnterior}>Semana anterior</Btn>

        <div className="grid grid-cols-2 gap-x-3">
          <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
          <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
        </div>
      </Card>

      {filasHistorial.length === 0 ? <Empty text="Sin fichajes en este periodo." /> : (
        <div className="space-y-1.5">
          {filasHistorial
            .sort((a, b) => b.fecha.localeCompare(a.fecha) || a.nombre.localeCompare(b.nombre))
            .map((f, i) => (
              <Card key={i}>
                <div className="flex items-center justify-between text-[12.5px]">
                  <div>
                    <div className="font-medium">{f.nombre}</div>
                    <div className="text-[11px]" style={{ color: C.inkSoft }}>{f.fecha}</div>
                  </div>
                  <div className="text-right">
                    <div className="mono">
                      {f.entrada ? f.entrada.hora : "—"} → {f.salida ? f.salida.hora : "sin salida"}
                    </div>
                    {f.horas !== null && <div className="text-[11px] mono" style={{ color: C.accent }}>{f.horas.toFixed(2)} h</div>}
                  </div>
                </div>
              </Card>
            ))}
        </div>
      )}

      {showManual && (
        <Modal onClose={() => setShowManual(false)} title="Corrección manual de fichaje">
          <Field label="Empleado">
            <select value={manual.empleadoId} onChange={(e) => setManual({ ...manual, empleadoId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
              {activos.map((e) => <option key={e.id} value={e.id}>{e.nombre}</option>)}
            </select>
          </Field>
          <div className="grid grid-cols-3 gap-x-3">
            <Field label="Fecha"><Input type="date" value={manual.fecha} onChange={(e) => setManual({ ...manual, fecha: e.target.value })} /></Field>
            <Field label="Tipo">
              <select value={manual.tipo} onChange={(e) => setManual({ ...manual, tipo: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
                <option value="entrada">Entrada</option>
                <option value="salida">Salida</option>
              </select>
            </Field>
            <Field label="Hora"><Input type="time" value={manual.hora} onChange={(e) => setManual({ ...manual, hora: e.target.value })} /></Field>
          </div>
          {manualError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{manualError}</div>}
          <div className="flex gap-2">
            <Btn onClick={submitManual}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setShowManual(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {showExportar && (
        <Modal onClose={() => setShowExportar(false)} title="Exportar registro horario">
          <div className="text-[12.5px] mb-2">
            Copia este texto y guárdalo (o pégalo en un documento). Es tu justificante del registro horario del
            periodo seleccionado, por si te lo pide la Inspección de Trabajo.
          </div>
          <textarea
            readOnly
            value={textoRegistro()}
            onFocus={(e) => e.target.select()}
            className="w-full rounded-lg p-2 text-[11px] mono mb-3"
            style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink, height: 180, resize: "none" }}
          />
          <div className="flex gap-2">
            <Btn onClick={copiarRegistro}>{copiado ? "¡Copiado!" : "Copiar texto"}</Btn>
            <Btn variant="ghost" onClick={() => setShowExportar(false)}>Cerrar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= SELECTOR DE ALÉRGENOS ================= */
function SelectorAlergenos({ seleccionados = [], onCambio, soloLectura = false }) {
  function alternar(id) {
    if (soloLectura) return;
    onCambio(seleccionados.includes(id) ? seleccionados.filter((x) => x !== id) : [...seleccionados, id]);
  }
  return (
    <div>
      <div className="flex flex-wrap gap-1.5">
        {ALERGENOS.map((a) => {
          const activo = seleccionados.includes(a.id);
          return (
            <button
              key={a.id}
              type="button"
              onClick={() => alternar(a.id)}
              className="text-[11.5px] font-medium px-2.5 py-1.5 rounded-lg flex items-center gap-1"
              style={{
                background: activo ? C.amberSoft : C.surface,
                border: `1px solid ${activo ? C.amber : C.line}`,
                color: activo ? C.ink : C.inkSoft,
                cursor: soloLectura ? "default" : "pointer",
              }}
            >
              <span>{a.icono}</span>
              <span>{a.nombre}</span>
            </button>
          );
        })}
      </div>
      {!soloLectura && (
        <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
          Marca los que contenga este producto. Son los 14 de declaración obligatoria (Reglamento UE 1169/2011).
        </div>
      )}
    </div>
  );
}

/* ================= APPCC ================= */
const TIPOS_PUNTO = [
  { id: "temperatura", label: "Temperatura (cámara, nevera, congelador)", unidad: "°C" },
  { id: "limpieza", label: "Limpieza y desinfección", unidad: "" },
  { id: "recepcion", label: "Control en recepción de mercancía", unidad: "°C" },
  { id: "otro", label: "Otro control", unidad: "" },
];

function Appcc({
  puntosControl, registrosAppcc, addPuntoControl, updatePuntoControl, deletePuntoControl,
  registrarAppcc, eliminarRegistroAppcc, appccPendientesHoy, productos, fichasCosto, alergenosDeFicha,
}) {
  const [vista, setVista] = useState("hoy"); // hoy | historial | puntos | alergenos
  const [showPunto, setShowPunto] = useState(false);
  const [puntoForm, setPuntoForm] = useState({ nombre: "", tipo: "temperatura", tempMin: "", tempMax: "", frecuencia: "Diaria" });
  const [puntoError, setPuntoError] = useState("");
  const [registroPara, setRegistroPara] = useState(null);
  const [registroForm, setRegistroForm] = useState({ valor: "", conforme: true, observaciones: "", responsable: "" });
  const [desde, setDesde] = useState(primerDiaMes(new Date()));
  const [hasta, setHasta] = useState(todayISO());
  const [copiado, setCopiado] = useState(false);

  function submitPunto() {
    if (!puntoForm.nombre.trim()) {
      setPuntoError("Ponle nombre al punto de control.");
      return;
    }
    setPuntoError("");
    addPuntoControl({
      nombre: puntoForm.nombre.trim(),
      tipo: puntoForm.tipo,
      tempMin: puntoForm.tempMin === "" ? null : Number(puntoForm.tempMin),
      tempMax: puntoForm.tempMax === "" ? null : Number(puntoForm.tempMax),
      frecuencia: puntoForm.frecuencia,
    });
    setPuntoForm({ nombre: "", tipo: "temperatura", tempMin: "", tempMax: "", frecuencia: "Diaria" });
    setShowPunto(false);
  }

  function abrirRegistro(punto) {
    setRegistroPara(punto);
    setRegistroForm({ valor: "", conforme: true, observaciones: "", responsable: "" });
  }

  // Un valor fuera del rango marcado se considera NO conforme automáticamente:
  // es lo que exige el sistema APPCC, para que quede constancia de la desviación.
  function evaluarConformidad(punto, valor) {
    if (punto.tipo !== "temperatura" && punto.tipo !== "recepcion") return null;
    const v = Number(valor);
    if (valor === "" || isNaN(v)) return null;
    if (punto.tempMin != null && v < punto.tempMin) return false;
    if (punto.tempMax != null && v > punto.tempMax) return false;
    return true;
  }

  function submitRegistro() {
    const auto = evaluarConformidad(registroPara, registroForm.valor);
    registrarAppcc({
      puntoId: registroPara.id,
      puntoNombre: registroPara.nombre,
      tipo: registroPara.tipo,
      valor: registroForm.valor,
      conforme: auto === null ? registroForm.conforme : auto,
      observaciones: registroForm.observaciones,
      responsable: registroForm.responsable,
    });
    setRegistroPara(null);
  }

  const registrosPeriodo = registrosAppcc
    .filter((r) => r.fecha >= desde && r.fecha <= hasta)
    .sort((a, b) => (b.fecha + b.hora).localeCompare(a.fecha + a.hora));

  const noConformes = registrosPeriodo.filter((r) => r.conforme === false);

  // Alérgenos de todo lo que vendes: elaborados con ficha + productos marcados
  const cartaAlergenos = useMemo(() => {
    const filas = [];
    (fichasCosto || []).forEach((f) => {
      filas.push({ id: "f-" + f.id, nombre: f.nombre, alergenos: alergenosDeFicha(f), origen: "ficha" });
    });
    (productos || [])
      .filter((p) => p.tipo === "elaborado" && !(fichasCosto || []).some((f) => f.productoVinculadoId === p.id))
      .forEach((p) => {
        filas.push({ id: "p-" + p.id, nombre: p.nombre, alergenos: p.alergenos || [], origen: "producto" });
      });
    return filas.sort((a, b) => a.nombre.localeCompare(b.nombre));
  }, [fichasCosto, productos, alergenosDeFicha]);

  function textoRegistroAppcc() {
    const lineas = registrosPeriodo.map(
      (r) => `${r.fecha} ${r.hora} · ${r.puntoNombre} · ${r.valor || "—"} · ${r.conforme ? "CONFORME" : "NO CONFORME"}${r.observaciones ? " · " + r.observaciones : ""}${r.responsable ? " · " + r.responsable : ""}`
    );
    return `REGISTRO APPCC\nDel ${desde} al ${hasta}\n\n${lineas.join("\n")}\n\nNo conformidades: ${noConformes.length}\nGenerado el ${new Date().toLocaleString("es-ES")}`;
  }

  function copiar() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textoRegistroAppcc()).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  return (
    <div>
      <div className="no-imprimir">
        <SectionTitle>Control sanitario (APPCC)</SectionTitle>

        <div className="flex gap-2 mb-4 overflow-x-auto">
          {[
            { id: "hoy", label: "Hoy" },
            { id: "historial", label: "Historial" },
            { id: "puntos", label: "Puntos de control" },
            { id: "alergenos", label: "Cartel de alérgenos" },
          ].map((v) => (
            <Btn key={v.id} small variant={vista === v.id ? "primary" : "ghost"} onClick={() => setVista(v.id)}>{v.label}</Btn>
          ))}
        </div>
      </div>

      {vista === "hoy" && (
        <div className="no-imprimir">
          <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
            <div className="text-[12.5px]">
              El sistema APPCC es obligatorio en cualquier negocio que manipule alimentos. Estos registros deben
              conservarse y estar disponibles si Sanidad los pide. Registra cada control el día que lo haces:
              rellenar una semana de golpe al final no vale.
            </div>
          </Card>

          {puntosControl.length === 0 ? (
            <Empty text="Todavía no has definido qué controlas. Ve a “Puntos de control” para empezar." />
          ) : (
            <>
              {appccPendientesHoy.length > 0 && (
                <Card className="mb-3" style={{ background: C.amberSoft, border: "none" }}>
                  <div className="text-[12.5px] font-semibold">
                    Te faltan {appccPendientesHoy.length} control(es) por registrar hoy
                  </div>
                </Card>
              )}
              <div className="space-y-2">
                {puntosControl.filter((p) => p.activo !== false).map((p) => {
                  const hechoHoy = registrosAppcc.find((r) => r.fecha === todayISO() && r.puntoId === p.id);
                  return (
                    <Card key={p.id}>
                      <div className="flex items-start justify-between">
                        <div>
                          <div className="font-medium text-[13.5px]">{p.nombre}</div>
                          <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                            {TIPOS_PUNTO.find((t) => t.id === p.tipo)?.label}
                            {p.tempMin != null && p.tempMax != null && ` · rango ${p.tempMin} a ${p.tempMax} °C`}
                          </div>
                        </div>
                        {hechoHoy ? (
                          <Pill color={hechoHoy.conforme ? C.accent : C.red}>
                            {hechoHoy.conforme ? `OK ${hechoHoy.valor}` : `Desviación ${hechoHoy.valor}`}
                          </Pill>
                        ) : (
                          <Pill color={C.amber}>pendiente</Pill>
                        )}
                      </div>
                      {!hechoHoy && (
                        <div className="mt-2">
                          <Btn small onClick={() => abrirRegistro(p)}>Registrar ahora</Btn>
                        </div>
                      )}
                    </Card>
                  );
                })}
              </div>
            </>
          )}
        </div>
      )}

      {vista === "puntos" && (
        <div className="no-imprimir">
          <div className="flex justify-end mb-3">
            <Btn onClick={() => setShowPunto(true)}><Plus size={15} /> Nuevo punto de control</Btn>
          </div>
          {puntosControl.length === 0 ? (
            <Empty text="Define qué vas a controlar: cámara de refrigerado, congelador, limpieza del obrador…" />
          ) : (
            <div className="space-y-2">
              {puntosControl.map((p) => (
                <Card key={p.id}>
                  <div className="flex items-start justify-between">
                    <div>
                      <div className="font-medium">{p.nombre}</div>
                      <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                        {TIPOS_PUNTO.find((t) => t.id === p.tipo)?.label} · {p.frecuencia}
                        {p.tempMin != null && p.tempMax != null && ` · ${p.tempMin} a ${p.tempMax} °C`}
                      </div>
                    </div>
                    <div className="flex items-center gap-2">
                      <Btn small variant="ghost" onClick={() => updatePuntoControl(p.id, { activo: p.activo === false })}>
                        {p.activo === false ? "Activar" : "Desactivar"}
                      </Btn>
                      <button onClick={() => deletePuntoControl(p.id)}><Trash2 size={15} color={C.inkSoft} /></button>
                    </div>
                  </div>
                </Card>
              ))}
            </div>
          )}
        </div>
      )}

      {vista === "historial" && (
        <>
          <div className="no-imprimir">
            <Card className="mb-3">
              <div className="grid grid-cols-2 gap-x-3">
                <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
                <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
              </div>
              <div className="flex flex-wrap gap-2">
                <Btn onClick={() => window.print()}>Imprimir / Guardar PDF</Btn>
                <Btn variant="ghost" onClick={copiar}>{copiado ? "¡Copiado!" : "Copiar texto"}</Btn>
              </div>
            </Card>

            {noConformes.length > 0 && (
              <Card className="mb-3" style={{ background: C.redSoft, border: "none" }}>
                <div className="text-[12.5px] font-semibold">
                  {noConformes.length} desviación(es) en el periodo. Revisa que quede anotada la medida correctora.
                </div>
              </Card>
            )}
          </div>

          <div className="zona-impresion" style={ESTILO_IMPRESION_CLARO}>
            <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>
              <div>
                <div className="text-[17px] font-semibold">Registro de control sanitario (APPCC)</div>
                <div className="text-[11.5px]" style={{ color: C.inkSoft }}>Del {desde} al {hasta}</div>
              </div>
              <img src={LOGO} alt="" style={{ height: 52, width: "auto" }} />
            </div>

            {registrosPeriodo.length === 0 ? <Empty text="Sin registros en este periodo." /> : (
              <table className="w-full text-[11.5px]" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Fecha</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Hora</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Punto de control</th>
                    <th className="py-2 px-2 text-center" style={{ background: C.chrome, color: "#fff" }}>Valor</th>
                    <th className="py-2 px-2 text-center" style={{ background: C.chrome, color: "#fff" }}>Conforme</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Observaciones</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Responsable</th>
                  </tr>
                </thead>
                <tbody>
                  {registrosPeriodo.map((r, i) => (
                    <tr key={r.id} style={{ background: i % 2 ? C.bg : "#fff" }}>
                      <td className="py-1.5 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{r.fecha}</td>
                      <td className="py-1.5 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{r.hora}</td>
                      <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{r.puntoNombre}</td>
                      <td className="py-1.5 px-2 text-center mono" style={{ border: `1px solid ${C.line}` }}>{r.valor || "—"}</td>
                      <td className="py-1.5 px-2 text-center font-semibold" style={{ border: `1px solid ${C.line}`, color: r.conforme ? C.accent : C.red }}>
                        {r.conforme ? "Sí" : "NO"}
                      </td>
                      <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{r.observaciones || ""}</td>
                      <td className="py-1.5 px-2" style={{ border: `1px solid ${C.line}` }}>{r.responsable || ""}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </>
      )}

      {vista === "alergenos" && (
        <>
          <div className="no-imprimir mb-3">
            <Card style={{ background: C.accentSoft, border: "none" }}>
              <div className="text-[12.5px]">
                Este cartel se genera solo desde tus fichas de costo: hereda los alérgenos de cada ingrediente
                enlazado al catálogo. Imprímelo y ténlo visible o a disposición del cliente, como exige la ley.
              </div>
            </Card>
            <div className="flex gap-2 mt-3">
              <Btn onClick={() => window.print()}>Imprimir cartel</Btn>
            </div>
          </div>

          <div className="zona-impresion" style={ESTILO_IMPRESION_CLARO}>
            <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>
              <div>
                <div className="text-[17px] font-semibold">Información de alérgenos</div>
                <div className="text-[11.5px]" style={{ color: C.inkSoft }}>
                  Reglamento (UE) 1169/2011 · Actualizado el {new Date().toLocaleDateString("es-ES")}
                </div>
              </div>
              <img src={LOGO} alt="" style={{ height: 52, width: "auto" }} />
            </div>

            {cartaAlergenos.length === 0 ? (
              <Empty text="Crea fichas de costo o marca productos como elaborados para generar el cartel." />
            ) : (
              <table className="w-full text-[11.5px]" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Producto</th>
                    <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Contiene</th>
                  </tr>
                </thead>
                <tbody>
                  {cartaAlergenos.map((f, i) => (
                    <tr key={f.id} style={{ background: i % 2 ? C.bg : "#fff" }}>
                      <td className="py-2 px-2 font-medium" style={{ border: `1px solid ${C.line}` }}>{f.nombre}</td>
                      <td className="py-2 px-2" style={{ border: `1px solid ${C.line}` }}>
                        {f.alergenos.length === 0 ? (
                          <span style={{ color: C.inkSoft }}>Sin alérgenos declarados</span>
                        ) : (
                          f.alergenos.map((id) => {
                            const a = alergenoPorId(id);
                            return a ? `${a.icono} ${a.nombre}` : id;
                          }).join(" · ")
                        )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}

            <div className="text-[10.5px] mt-4" style={{ color: C.inkSoft }}>
              Puede haber trazas de otros alérgenos por manipulación en el mismo obrador. Consulte al personal
              si tiene alguna alergia o intolerancia.
            </div>
          </div>
        </>
