<style>
  html, body, #root { height: 100%; margin: 0; }
  body { background: #F7F3E9; -webkit-tap-highlight-color: transparent;
         font-family: 'IBM Plex Sans', ui-sans-serif, system-ui; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  a { text-decoration: none; }

  #cargando {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(circle at 50% 26%, #153D27 0%, #0C2714 44%, #06170E 100%); color: #E7D1A5; z-index: 9999;
  }
  #cargando .logo-suite { width: min(68vw, 300px); height: auto; display: block; filter: drop-shadow(0 6px 12px rgba(0,0,0,.28)); }
  #cargando .sub { margin-top: -4px; font-size: 12px; letter-spacing: .035em; color: #B8AC91; }
  #cargando .paso { font-size: 12px; color: #9FB0A5; }
  #cargando .barra { width: 210px; height: 3px; border-radius: 4px; background: rgba(207,172,105,.18); overflow: hidden; }
  #cargando .barra i { display: block; height: 100%; width: 30%; background: linear-gradient(90deg,#7F5823,#C69A52,#D2AD68); border-radius: 4px;
                       animation: desliza 1.1s ease-in-out infinite; }
  @keyframes desliza { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
</style>


<script src="./owner-bootstrap-prelock.js"></script>
<script src="./reset-pruebas-preview.js"></script>

<script src="./index-storage-bootstrap.js"></script>
<script src="./server-authority-storage-bridge.js"></script>
</head>
<body>

<div id="cargando">
  <img class="logo-suite" src="la-suite-logo.svg" alt="L&A Suite" />
  <div class="sub">Gestión integral para tu negocio</div>
  <div class="barra"><i></i></div>
  <div class="paso" id="paso">Abriendo…</div>
</div>

<div id="root"></div>

<script src="./index-loader.js"></script>
<script src="./pm12-conteo-estados-v1.js"></script>
<script src="pm12-stock-atomico-v1.js"></script>
<script src="./pm12-p09-historial-informes-movil-v1.js"></script>
<script src="./edge-auth-patch.js"></script>
<script src="./ui-context-bridge.js"></script>
<script src="./owner-bootstrap-post-reset.js"></script>
<script type="module" src="./fuente.js"></script>
<script defer src="./pm11-compra-mobile-p10-v1.js"></script>
<script defer src="./dashboard-premium-v2.js"></script>
<script src="./index-mounted.js"></script>

</body>
</html>
