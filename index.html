      {showPunto && (
        <Modal onClose={() => setShowPunto(false)} title="Nuevo punto de control">
          <Field label="Nombre">
            <Input value={puntoForm.nombre} onChange={(e) => setPuntoForm({ ...puntoForm, nombre: e.target.value })} placeholder="Cámara de refrigerado, Congelador obrador…" />
          </Field>
          <Field label="Tipo">
            <select value={puntoForm.tipo} onChange={(e) => setPuntoForm({ ...puntoForm, tipo: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
              {TIPOS_PUNTO.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
            </select>
          </Field>
          {(puntoForm.tipo === "temperatura" || puntoForm.tipo === "recepcion") && (
            <div className="grid grid-cols-2 gap-x-3">
              <Field label="Temperatura mínima (°C)"><Input type="number" step="0.1" value={puntoForm.tempMin} onChange={(e) => setPuntoForm({ ...puntoForm, tempMin: e.target.value })} placeholder="0" /></Field>
              <Field label="Temperatura máxima (°C)"><Input type="number" step="0.1" value={puntoForm.tempMax} onChange={(e) => setPuntoForm({ ...puntoForm, tempMax: e.target.value })} placeholder="4" /></Field>
            </div>
          )}
          <Field label="Frecuencia">
            <select value={puntoForm.frecuencia} onChange={(e) => setPuntoForm({ ...puntoForm, frecuencia: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
              <option>Diaria</option>
              <option>Dos veces al día</option>
              <option>Semanal</option>
              <option>En cada recepción</option>
            </select>
          </Field>
          {puntoError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{puntoError}</div>}
          <div className="flex gap-2">
            <Btn onClick={submitPunto}>Guardar</Btn>
            <Btn variant="ghost" onClick={() => setShowPunto(false)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {registroPara && (
        <Modal onClose={() => setRegistroPara(null)} title={registroPara.nombre}>
          {(registroPara.tipo === "temperatura" || registroPara.tipo === "recepcion") ? (
            <>
              <Field label="Temperatura medida (°C)">
                <Input type="number" step="0.1" value={registroForm.valor} onChange={(e) => setRegistroForm({ ...registroForm, valor: e.target.value })} autoFocus />
              </Field>
              {(() => {
                const ev = evaluarConformidad(registroPara, registroForm.valor);
                if (ev === null) return null;
                return (
                  <div className="text-[12px] mb-3" style={{ color: ev ? C.accent : C.red }}>
                    {ev
                      ? "Dentro del rango correcto."
                      : `Fuera del rango (${registroPara.tempMin} a ${registroPara.tempMax} °C). Se registrará como desviación: anota abajo qué medida correctora has tomado.`}
                  </div>
                );
              })()}
            </>
          ) : (
            <Field label="Resultado">
              <select value={registroForm.conforme ? "si" : "no"} onChange={(e) => setRegistroForm({ ...registroForm, conforme: e.target.value === "si" })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
                <option value="si">Conforme — realizado correctamente</option>
                <option value="no">No conforme — hubo un problema</option>
              </select>
            </Field>
          )}
          <Field label="Observaciones / medida correctora">
            <Input value={registroForm.observaciones} onChange={(e) => setRegistroForm({ ...registroForm, observaciones: e.target.value })} placeholder="Opcional, salvo si hay desviación" />
          </Field>
          <Field label="Responsable">
            <Input value={registroForm.responsable} onChange={(e) => setRegistroForm({ ...registroForm, responsable: e.target.value })} placeholder="Quién lo comprueba" />
          </Field>
          <div className="flex gap-2">
            <Btn onClick={submitRegistro}>Guardar registro</Btn>
            <Btn variant="ghost" onClick={() => setRegistroPara(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= ENCARGOS ================= */
function lineaEncargo() {
  return { productoId: "", descripcion: "", cantidad: 1, precioUnitario: "" };
}

function Encargos({ encargosPendientes, encargos, clientes, productos, addEncargo, updateEncargo, deleteEncargo, entregarEncargo, addCliente }) {
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState(null);
  const [error, setError] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [entregarId, setEntregarId] = useState(null);
  const [verEntregados, setVerEntregados] = useState(false);
  const [clienteNuevo, setClienteNuevo] = useState("");

  const vendibles = productos.filter((p) => p.tipo === "elaborado" || Number(p.precioVenta) > 0);

  function nuevo() {
    setForm({
      clienteId: clientes[0]?.id || "",
      numero: "",
      fechaEntrega: todayISO(),
      horaEntrega: "",
      notas: "",
      señal: "",
      lineas: [lineaEncargo()],
    });
    setEditingId(null);
    setError("");
    setShowForm(true);
  }

  function abrirEdicion(e) {
    setForm({
      clienteId: e.clienteId || "",
      numero: e.numero || "",
      fechaEntrega: e.fechaEntrega || todayISO(),
      horaEntrega: e.horaEntrega || "",
      notas: e.notas || "",
      señal: e.señal ?? "",
      lineas: (e.lineas || []).map((l) => ({ ...l })),
    });
    setEditingId(e.id);
    setError("");
    setShowForm(true);
  }

  function setLinea(idx, campo, valor) {
    setForm((f) => ({
      ...f,
      lineas: f.lineas.map((l, i) => {
        if (i !== idx) return l;
        if (campo === "productoId") {
          const p = productos.find((x) => x.id === valor);
          return { ...l, productoId: valor, descripcion: p ? p.nombre : l.descripcion, precioUnitario: p ? precioNeto(p).toFixed(2) : l.precioUnitario };
        }
        return { ...l, [campo]: valor };
      }),
    }));
  }
  const addLinea = () => setForm((f) => ({ ...f, lineas: [...f.lineas, lineaEncargo()] }));
  const quitarLinea = (idx) => setForm((f) => ({ ...f, lineas: f.lineas.filter((_, i) => i !== idx) }));

  const totalForm = !form ? 0 : form.lineas.reduce((a, l) => a + (Number(l.cantidad) || 0) * (Number(l.precioUnitario) || 0), 0);

  function submit() {
    if (!form.clienteId) { setError("Selecciona o crea un cliente."); return; }
    const validas = form.lineas.filter((l) => (l.productoId || l.descripcion) && Number(l.cantidad) > 0);
    if (!validas.length) { setError("Añade al menos un producto con cantidad."); return; }
    setError("");
    const datos = { ...form, lineas: validas, señal: form.señal === "" ? 0 : Number(form.señal) };
    if (editingId) updateEncargo(editingId, datos);
    else addEncargo(datos);
    setShowForm(false);
    setForm(null);
    setEditingId(null);
  }

  function crearClienteRapido() {
    if (!clienteNuevo.trim()) return;
    const c = addCliente({ nombre: clienteNuevo.trim() });
    setForm((f) => ({ ...f, clienteId: c.id }));
    setClienteNuevo("");
  }

  const entregados = encargos.filter((e) => e.estado === "Entregado");

  function colorDias(d) {
    if (d === null) return C.inkSoft;
    if (d < 0) return C.red;
    if (d <= 2) return C.amber;
    return C.ink;
  }
  function textoDias(d) {
    if (d === null) return "Sin fecha";
    if (d < 0) return `Se pasó hace ${Math.abs(d)} d`;
    if (d === 0) return "¡Hoy!";
    if (d === 1) return "Mañana";
    return `En ${d} días`;
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={nuevo}><Plus size={15} /> Nuevo encargo</Btn>}>Encargos</SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando encargo" : "Nuevo encargo"}</div>

          <div className="grid md:grid-cols-2 gap-x-3">
            <Field label="Cliente">
              <select value={form.clienteId} onChange={(e) => setForm({ ...form, clienteId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
                <option value="">Selecciona…</option>
                {clientes.map((c) => <option key={c.id} value={c.id}>{c.nombre}</option>)}
              </select>
            </Field>
            <Field label="Referencia del encargo (opcional)">
              <Input value={form.numero} onChange={(e) => setForm({ ...form, numero: e.target.value })} placeholder="E-001" />
            </Field>
          </div>

          <div className="flex gap-2 items-end mb-3">
            <div className="flex-1">
              <div className="text-[12px] font-medium mb-1" style={{ color: C.inkSoft }}>¿Cliente nuevo? Créalo aquí mismo</div>
              <Input value={clienteNuevo} onChange={(e) => setClienteNuevo(e.target.value)} placeholder="Nombre del cliente" />
            </div>
            <Btn variant="ghost" onClick={crearClienteRapido}>Crear</Btn>
          </div>

          <div className="grid md:grid-cols-3 gap-x-3">
            <Field label="Fecha de entrega"><Input type="date" value={form.fechaEntrega} onChange={(e) => setForm({ ...form, fechaEntrega: e.target.value })} /></Field>
            <Field label="Hora (opcional)"><Input type="time" value={form.horaEntrega} onChange={(e) => setForm({ ...form, horaEntrega: e.target.value })} /></Field>
            <Field label="Señal / anticipo (€)"><Input type="number" step="0.01" value={form.señal} onChange={(e) => setForm({ ...form, señal: e.target.value })} /></Field>
          </div>

          <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Productos del encargo</div>
          {form.lineas.map((l, idx) => (
            <Card key={idx} className="mb-2" style={{ background: C.bg }}>
              <div className="flex items-center justify-between mb-2">
                <span className="text-[12px] font-semibold">Línea {idx + 1}</span>
                <button type="button" onClick={() => quitarLinea(idx)}><X size={16} color={C.inkSoft} /></button>
              </div>
              <Field label="Producto del catálogo">
                <select value={l.productoId} onChange={(e) => setLinea(idx, "productoId", e.target.value)} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
                  <option value="">— Escribirlo a mano —</option>
                  {vendibles.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
              </Field>
              {!l.productoId && (
                <Field label="Descripción">
                  <Input value={l.descripcion} onChange={(e) => setLinea(idx, "descripcion", e.target.value)} placeholder="Tarta personalizada 6 personas" />
                </Field>
              )}
              <div className="grid grid-cols-3 gap-x-2">
                <Field label="Cantidad"><Input type="number" step="0.01" value={l.cantidad} onChange={(e) => setLinea(idx, "cantidad", e.target.value)} /></Field>
                <Field label="Precio ud. (€)"><Input type="number" step="0.01" value={l.precioUnitario} onChange={(e) => setLinea(idx, "precioUnitario", e.target.value)} /></Field>
                <Field label="Subtotal">
                  <Input readOnly value={fmt((Number(l.cantidad) || 0) * (Number(l.precioUnitario) || 0))} style={{ background: C.bg }} />
                </Field>
              </div>
            </Card>
          ))}
          <button type="button" onClick={addLinea} className="text-[12.5px] font-medium mb-3" style={{ color: C.accent }}>+ Añadir producto</button>

          <Field label="Notas para el obrador">
            <textarea value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} className="w-full rounded-lg p-2 text-[12.5px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink, height: 70, resize: "vertical" }} placeholder="Sin gluten, felicitación 'Feliz cumpleaños Ana'…" />
          </Field>

          <Card className="mb-3" style={{ background: C.accentSoft, border: "none" }}>
            <div className="flex items-center justify-between">
              <span className="text-[12.5px] font-medium">Total del encargo</span>
              <span className="mono font-bold text-[17px]">€{fmt(totalForm)}</span>
            </div>
            {Number(form.señal) > 0 && (
              <div className="flex items-center justify-between text-[12px] mt-1" style={{ color: C.inkSoft }}>
                <span>Pendiente de cobrar al entregar</span>
                <span className="mono">€{fmt(totalForm - Number(form.señal))}</span>
              </div>
            )}
          </Card>

          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Guardar encargo"}</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setForm(null); setEditingId(null); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {encargosPendientes.length === 0 ? <Empty text="No hay encargos pendientes." /> : (
        <div className="space-y-2">
          {encargosPendientes.map((e) => (
            <Card key={e.id} style={{ borderLeft: `3px solid ${colorDias(e.dias)}` }}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="font-semibold">{e.cliente ? e.cliente.nombre : "Sin cliente"}</div>
                  <div className="text-[12px]" style={{ color: C.inkSoft }}>
                    {e.fechaEntrega}{e.horaEntrega && ` · ${e.horaEntrega}`}
                    {e.numero && ` · ${e.numero}`}
                  </div>
                </div>
                <div className="text-right">
                  <div className="text-[12px] font-semibold" style={{ color: colorDias(e.dias) }}>{textoDias(e.dias)}</div>
                  <div className="mono font-semibold mt-0.5">€{fmt(e.total)}</div>
                </div>
              </div>

              <div className="mt-2 text-[12px] space-y-0.5">
                {(e.lineas || []).map((l, i) => (
                  <div key={i}>· {l.cantidad} × {l.descripcion || "—"}</div>
                ))}
              </div>

              {e.notas && (
                <div className="mt-2 text-[11.5px] p-2 rounded-lg" style={{ background: C.amberSoft }}>{e.notas}</div>
              )}

              {Number(e.señal) > 0 && (
                <div className="text-[11.5px] mt-2" style={{ color: C.inkSoft }}>
                  Señal cobrada €{fmt(e.señal)} · pendiente €{fmt(e.total - Number(e.señal))}
                </div>
              )}

              <div className="mt-2 flex gap-2 flex-wrap">
                <Btn small onClick={() => setEntregarId(e.id)}><CheckCircle2 size={13} /> Entregar</Btn>
                <Btn small variant="ghost" onClick={() => abrirEdicion(e)}>Editar</Btn>
                <Btn small variant="danger" onClick={() => setConfirmDeleteId(e.id)}><Trash2 size={13} /> Eliminar</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

      <button onClick={() => setVerEntregados((s) => !s)} className="text-[12.5px] font-medium mt-4 mb-2" style={{ color: C.accent }}>
        {verEntregados ? "Ocultar" : "Ver"} encargos entregados ({entregados.length})
      </button>
      {verEntregados && (
        <div className="space-y-1.5">
          {entregados.length === 0 ? <Empty text="Todavía no has entregado ninguno." /> : entregados.map((e) => {
            const cliente = clientes.find((c) => c.id === e.clienteId);
            const total = (e.lineas || []).reduce((a, l) => a + (Number(l.cantidad) || 0) * (Number(l.precioUnitario) || 0), 0);
            return (
              <Card key={e.id} style={{ background: C.bg }}>
                <div className="flex items-center justify-between text-[12.5px]">
                  <span>{cliente ? cliente.nombre : "—"} · {e.fechaEntregaReal || e.fechaEntrega}</span>
                  <span className="mono">€{fmt(total)}</span>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {entregarId && (() => {
        const e = encargos.find((x) => x.id === entregarId);
        if (!e) return null;
        return (
          <Modal onClose={() => setEntregarId(null)} title="Entregar encargo">
            <div className="text-[12.5px] mb-4">
              Al entregar, se descuenta el stock de los productos del catálogo y se registra la venta,
              así que entrará en tus Resultados. Los productos escritos a mano no descuentan stock.
            </div>
            <div className="flex gap-2">
              <Btn onClick={() => { entregarEncargo(e); setEntregarId(null); }}>Confirmar entrega</Btn>
              <Btn variant="ghost" onClick={() => setEntregarId(null)}>Cancelar</Btn>
            </div>
          </Modal>
        );
      })()}

      {confirmDeleteId && (
        <Modal onClose={() => setConfirmDeleteId(null)} title="Eliminar encargo">
          <div className="text-[12.5px] mb-4">Se borra el encargo. Esta acción no se puede deshacer.</div>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { deleteEncargo(confirmDeleteId); setConfirmDeleteId(null); }}>Sí, eliminar</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= CLIENTES ================= */
function Clientes({ analisisClientes, clientesDormidos, ventaCruzada, addCliente, updateCliente, deleteCliente }) {
  const blank = { nombre: "", telefono: "", email: "", notas: "" };
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(blank);
  const [editingId, setEditingId] = useState(null);
  const [error, setError] = useState("");
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  function submit() {
    if (!form.nombre.trim()) { setError("Escribe el nombre del cliente."); return; }
    setError("");
    if (editingId) updateCliente(editingId, form);
    else addCliente(form);
    setForm(blank);
    setEditingId(null);
    setShowForm(false);
  }

  function abrirEdicion(c) {
    setForm({ nombre: c.nombre || "", telefono: c.telefono || "", email: c.email || "", notas: c.notas || "" });
    setEditingId(c.id);
    setError("");
    setShowForm(true);
  }

  // Igual que en Personal: descarga como archivo, para el "derecho de
  // acceso" del RGPD — que el cliente pueda llevarse una copia de lo que
  // se guarda sobre él.
  function exportarDatosCliente(c) {
    const lineas = [
      `DATOS GUARDADOS SOBRE: ${c.nombre}`,
      `Generado el ${todayISO()}`,
      "",
      "=== FICHA ===",
      `Nombre: ${c.nombre}`,
      `Teléfono: ${c.telefono || "—"}`,
      `Email: ${c.email || "—"}`,
      `Notas: ${c.notas || "—"}`,
      "",
      "=== ACTIVIDAD ===",
      `Total facturado: €${fmt(c.facturado || 0)}`,
      `Encargos entregados: ${c.nEncargos || 0}`,
      `Última compra: ${c.ultima || "sin compras registradas"}`,
    ];
    const blob = new Blob([lineas.join("\n")], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `datos-${c.nombre.replace(/\s+/g, "-").toLowerCase()}.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { setForm(blank); setEditingId(null); setShowForm(true); }}><Plus size={15} /> Nuevo cliente</Btn>}>
        Clientes
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-3">
            <Field label="Nombre"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} /></Field>
            <Field label="Teléfono"><Input value={form.telefono} onChange={(e) => setForm({ ...form, telefono: e.target.value })} placeholder="+34 600 000 000" /></Field>
            <Field label="Correo (opcional)"><Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} /></Field>
          </div>
          <Field label="Notas (gustos, alergias, empresa…)">
            <Input value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} />
          </Field>
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Guardar cliente"}</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setForm(blank); setEditingId(null); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {clientesDormidos.length > 0 && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="text-[12.5px] font-semibold mb-2">Clientes que hace tiempo que no vuelven</div>
          <div className="space-y-1">
            {clientesDormidos.slice(0, 6).map((c) => (
              <div key={c.id} className="flex items-center justify-between text-[12px]">
                <span>{c.nombre}{c.telefono && ` · ${c.telefono}`}</span>
                <span className="mono">{c.diasSinComprar} días</span>
              </div>
            ))}
          </div>
          <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
            Te compraron antes y llevan más de 2 meses sin encargar nada. Una llamada o un WhatsApp puede recuperarlos.
          </div>
        </Card>
      )}

      {analisisClientes.length === 0 ? <Empty text="Todavía no tienes clientes registrados." /> : (
        <div className="space-y-2 mb-4">
          {analisisClientes.map((c) => (
            <Card key={c.id}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="font-semibold">{c.nombre}</div>
                  <div className="text-[12px]" style={{ color: C.inkSoft }}>
                    {[c.telefono, c.email].filter(Boolean).join(" · ")}
                  </div>
                  {c.notas && <div className="text-[11.5px] mt-1" style={{ color: C.inkSoft }}>{c.notas}</div>}
                </div>
                <div className="text-right">
                  <div className="mono font-semibold">€{fmt(c.facturado)}</div>
                  <div className="text-[11px]" style={{ color: C.inkSoft }}>{c.nEncargos} encargo(s)</div>
                </div>
              </div>
              <div className="mt-2 flex items-center justify-between">
                <span className="text-[11.5px]" style={{ color: C.inkSoft }}>
                  {c.ultima ? `Última compra: ${c.ultima}` : "Sin compras registradas"}
                </span>
                <div className="flex gap-2">
                  {c.telefono && (
                    <LinkBtn small href={`https://wa.me/${c.telefono.replace(/[^0-9]/g, "")}`}><MessageCircle size={13} /> WhatsApp</LinkBtn>
                  )}
                  <Btn small variant="ghost" onClick={() => exportarDatosCliente(c)}><Download size={13} /></Btn>
                  <Btn small variant="ghost" onClick={() => abrirEdicion(c)}>Editar</Btn>
                  <Btn small variant="danger" onClick={() => setConfirmDeleteId(c.id)}><Trash2 size={13} /></Btn>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Productos que se piden juntos</div>
      {ventaCruzada.base < 3 ? (
        <Card style={{ background: C.bg }}>
          <div className="text-[12.5px]" style={{ color: C.inkSoft }}>
            Con {ventaCruzada.base} encargo(s) entregado(s) todavía no se puede sacar ninguna conclusión fiable.
            A partir de 3 empezarás a ver qué se pide junto; con 20 o 30 el dato ya sirve para decidir qué poner
            cerca en el mostrador.
          </div>
        </Card>
      ) : ventaCruzada.filas.length === 0 ? (
        <Empty text="Todavía no hay dos productos distintos en un mismo encargo." />
      ) : (
        <div className="space-y-1.5">
          {ventaCruzada.filas.map((f, i) => (
            <Card key={i}>
              <div className="flex items-center justify-between text-[12.5px]">
                <span>{f.a.nombre} <span style={{ color: C.inkSoft }}>+</span> {f.b.nombre}</span>
                <span className="mono font-semibold">{f.veces}×</span>
              </div>
            </Card>
          ))}
          <div className="text-[11px] mt-1" style={{ color: C.inkSoft }}>
            Basado en {ventaCruzada.base} encargos entregados. Cuantos más acumules, más fiable será.
          </div>
        </div>
      )}

      {confirmDeleteId && (
        <Modal onClose={() => setConfirmDeleteId(null)} title="Eliminar cliente">
          <div className="text-[12.5px] mb-4">
            Se borra la ficha del cliente. Los encargos que ya le hiciste se conservan, pero quedarán sin nombre asociado.
          </div>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { deleteCliente(confirmDeleteId); setConfirmDeleteId(null); }}>Sí, eliminar</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= LIBRO DE IVA ================= */
function trimestreDe(fechaISO) {
  const mes = new Date(fechaISO).getMonth(); // 0-11
  return Math.floor(mes / 3) + 1; // 1-4
}
function rangoTrimestre(anio, trimestre) {
  const mesIni = (trimestre - 1) * 3;
  const desde = new Date(anio, mesIni, 1).toISOString().slice(0, 10);
  const hasta = new Date(anio, mesIni + 3, 0).toISOString().slice(0, 10);
  return { desde, hasta };
}

function LibroIva({ movimientos, productos, albaranes, proveedorPorId, facturasDirectas = [] }) {
  const hoy = new Date();
  const [anio, setAnio] = useState(hoy.getFullYear());
  const [trimestre, setTrimestre] = useState(Math.floor(hoy.getMonth() / 3) + 1);
  const { desde, hasta } = rangoTrimestre(anio, trimestre);

  // IVA repercutido: de las ventas del periodo, agrupado por tipo de IVA
  const repercutido = useMemo(() => {
    const porTipo = {};
    movimientos
      .filter((m) => m.tipo === "salida" && m.motivo === "Venta" && m.fecha >= desde && m.fecha <= hasta)
      .forEach((m) => {
        const base = (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0);
        const tipo = m.ivaVentaAplicado != null ? m.ivaVentaAplicado : (productos.find((p) => p.id === m.productoId)?.ivaVenta ?? 10);
        if (!porTipo[tipo]) porTipo[tipo] = { base: 0, cuota: 0 };
        porTipo[tipo].base += base;
        porTipo[tipo].cuota += base * (tipo / 100);
      });
    return porTipo;
  }, [movimientos, productos, desde, hasta]);

  // IVA soportado: de los albaranes confirmados del periodo (líneas + cargos)
  // y también de las facturas directas (luz, alquiler, gestoría...) del periodo.
  const soportado = useMemo(() => {
    const porTipo = {};
    albaranes
      .filter((a) => a.estado === "confirmado" && (a.fechaFactura || a.fecha) >= desde && (a.fechaFactura || a.fecha) <= hasta)
      .forEach((a) => {
        (a.lineas || []).forEach((ln) => {
          const base = Number(ln.importe) || 0;
          const tipo = Number(ln.ivaPct) || 0;
          if (!porTipo[tipo]) porTipo[tipo] = { base: 0, cuota: 0 };
          porTipo[tipo].base += base;
          porTipo[tipo].cuota += base * (tipo / 100);
        });
        const cargoBase = Number(a.cargos) || 0;
        if (cargoBase > 0) {
          const tipo = Number(a.cargosIva) || 21;
          if (!porTipo[tipo]) porTipo[tipo] = { base: 0, cuota: 0 };
          porTipo[tipo].base += cargoBase;
          porTipo[tipo].cuota += cargoBase * (tipo / 100);
        }
      });
    facturasDirectas
      .filter((f) => f.fecha >= desde && f.fecha <= hasta)
      .forEach((f) => {
        const base = Number(f.importeBase) || 0;
        const tipo = Number(f.ivaPct) || 0;
        if (!porTipo[tipo]) porTipo[tipo] = { base: 0, cuota: 0 };
        porTipo[tipo].base += base;
        porTipo[tipo].cuota += base * (tipo / 100);
      });
    return porTipo;
  }, [albaranes, facturasDirectas, desde, hasta]);

  const sumar = (obj) => Object.values(obj).reduce((a, x) => ({ base: a.base + x.base, cuota: a.cuota + x.cuota }), { base: 0, cuota: 0 });
  const totalRep = sumar(repercutido);
  const totalSop = sumar(soportado);
  const resultado = totalRep.cuota - totalSop.cuota;

  function exportarExcel() {
    const wb = XLSX.utils.book_new();

    const filasRep = Object.entries(repercutido).map(([tipo, v]) => ({ "Tipo IVA": `${tipo}%`, "Base imponible": Number(v.base.toFixed(2)), "Cuota IVA": Number(v.cuota.toFixed(2)) }));
    filasRep.push({ "Tipo IVA": "TOTAL", "Base imponible": Number(totalRep.base.toFixed(2)), "Cuota IVA": Number(totalRep.cuota.toFixed(2)) });
    const wsRep = XLSX.utils.json_to_sheet(filasRep);
    XLSX.utils.book_append_sheet(wb, wsRep, "IVA Repercutido");

    const filasSop = Object.entries(soportado).map(([tipo, v]) => ({ "Tipo IVA": `${tipo}%`, "Base imponible": Number(v.base.toFixed(2)), "Cuota IVA": Number(v.cuota.toFixed(2)) }));
    filasSop.push({ "Tipo IVA": "TOTAL", "Base imponible": Number(totalSop.base.toFixed(2)), "Cuota IVA": Number(totalSop.cuota.toFixed(2)) });
    const wsSop = XLSX.utils.json_to_sheet(filasSop);
    XLSX.utils.book_append_sheet(wb, wsSop, "IVA Soportado");

    const wsResumen = XLSX.utils.json_to_sheet([
      { Concepto: "Periodo", Valor: `T${trimestre} ${anio} (${desde} a ${hasta})` },
      { Concepto: "Base repercutida", Valor: Number(totalRep.base.toFixed(2)) },
      { Concepto: "IVA repercutido", Valor: Number(totalRep.cuota.toFixed(2)) },
      { Concepto: "Base soportada", Valor: Number(totalSop.base.toFixed(2)) },
      { Concepto: "IVA soportado", Valor: Number(totalSop.cuota.toFixed(2)) },
      { Concepto: resultado >= 0 ? "A ingresar" : "A compensar", Valor: Number(Math.abs(resultado).toFixed(2)) },
    ]);
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");

    const detalleCompras = albaranes
      .filter((a) => a.estado === "confirmado" && (a.fechaFactura || a.fecha) >= desde && (a.fechaFactura || a.fecha) <= hasta)
      .map((a) => {
        const prov = proveedorPorId(a.proveedorId);
        const base = (a.lineas || []).reduce((x, ln) => x + (Number(ln.importe) || 0), 0) + (Number(a.cargos) || 0);
        const iva = (a.lineas || []).reduce((x, ln) => x + (Number(ln.importe) || 0) * ((Number(ln.ivaPct) || 0) / 100), 0) + (Number(a.cargos) || 0) * ((Number(a.cargosIva) || 0) / 100);
        return {
          Fecha: a.fechaFactura || a.fecha,
          Proveedor: prov ? prov.nombre : "—",
          "Nº factura": a.numeroFactura || a.numero || "",
          Base: Number(base.toFixed(2)),
          IVA: Number(iva.toFixed(2)),
          Total: Number((base + iva).toFixed(2)),
        };
      });
    if (detalleCompras.length) {
      XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(detalleCompras), "Detalle compras");
    }

    XLSX.writeFile(wb, `libro_iva_T${trimestre}_${anio}.xlsx`);
  }

  const filas = [...new Set([...Object.keys(repercutido), ...Object.keys(soportado)])].sort((a, b) => Number(a) - Number(b));

  return (
    <div>
      <SectionTitle>Libro de IVA</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Resumen trimestral para tu declaración (modelo 303): IVA repercutido de tus ventas e IVA soportado de tus
          compras, por tipo. Este programa no presenta el modelo por ti — te da los números listos para que tu
          gestoría los meta, o para revisarlos tú antes de dárselos.
        </div>
      </Card>

      <Card className="mb-4">
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="Trimestre">
            <select value={trimestre} onChange={(e) => setTrimestre(Number(e.target.value))} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
              <option value={1}>1T — Enero a Marzo</option>
              <option value={2}>2T — Abril a Junio</option>
              <option value={3}>3T — Julio a Septiembre</option>
              <option value={4}>4T — Octubre a Diciembre</option>
            </select>
          </Field>
          <Field label="Año">
            <Input type="number" value={anio} onChange={(e) => setAnio(Number(e.target.value) || hoy.getFullYear())} />
          </Field>
        </div>
        <div className="text-[11px]" style={{ color: C.inkSoft }}>Del {desde} al {hasta}</div>
      </Card>

      <div className="grid grid-cols-2 gap-3 mb-4">
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>IVA repercutido (ventas)</div>
          <div className="text-xl font-semibold mono mt-1" style={{ color: C.accent }}>€{fmt(totalRep.cuota)}</div>
        </Card>
        <Card>
          <div className="text-[11px]" style={{ color: C.inkSoft }}>IVA soportado (compras)</div>
          <div className="text-xl font-semibold mono mt-1">€{fmt(totalSop.cuota)}</div>
        </Card>
      </div>

      <Card className="mb-4" style={{ background: C.chrome, color: "#fff" }}>
        <div className="flex items-center justify-between">
          <span className="text-[13px] font-medium">{resultado >= 0 ? "A ingresar en Hacienda" : "A compensar / devolver"}</span>
          <span className="mono font-bold text-[19px]">€{fmt(Math.abs(resultado))}</span>
        </div>
      </Card>

      {filas.length === 0 ? <Empty text="No hay ventas ni compras registradas en este trimestre." /> : (
        <Card style={{ padding: 0 }} className="mb-4">
          <table className="w-full text-[12.5px]">
            <thead>
              <tr style={{ color: C.inkSoft, borderBottom: `1px solid ${C.line}` }}>
                <th className="text-left font-medium py-2 px-3">Tipo</th>
                <th className="text-right font-medium py-2 px-3">Base repercutida</th>
                <th className="text-right font-medium py-2 px-3">Base soportada</th>
              </tr>
            </thead>
            <tbody>
              {filas.map((tipo) => (
                <tr key={tipo} style={{ borderBottom: `1px solid ${C.line}` }}>
                  <td className="py-2 px-3 mono">{tipo}%</td>
                  <td className="py-2 px-3 mono text-right">{repercutido[tipo] ? `€${fmt(repercutido[tipo].base)}` : "—"}</td>
                  <td className="py-2 px-3 mono text-right">{soportado[tipo] ? `€${fmt(soportado[tipo].base)}` : "—"}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </Card>
      )}

      <Btn onClick={exportarExcel}><Download size={14} /> Exportar a Excel</Btn>
      <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
        Solo cuentan las ventas registradas con motivo "Venta", los albaranes ya dados de entrada y las facturas
        directas registradas en Cuentas por pagar. Si falta algo por registrar, este libro tampoco lo verá.
      </div>
    </div>
  );
}

/* ================= ARQUEO DE CAJA ================= */
function ArqueoCaja({ movimientos, arqueos, addArqueo, deleteArqueo }) {
  const [fecha, setFecha] = useState(todayISO());
  const [contado, setContado] = useState("");
  const [notas, setNotas] = useState("");
  const [error, setError] = useState("");

  const ventasDelDia = movimientos.filter((m) => m.tipo === "salida" && m.motivo === "Venta" && m.fecha === fecha);
  const porMedio = { Efectivo: 0, Tarjeta: 0, Transferencia: 0, Otro: 0 };
  ventasDelDia.forEach((m) => {
    const medio = m.medioPago || "Efectivo";
    const importe = (Number(m.cantidad) || 0) * (Number(m.ingresoUnitario) || 0) * (1 + (Number(m.ivaVentaAplicado) || 0) / 100);
    // El pago mixto no es un cajón aparte: se reparte entre Efectivo y
    // Tarjeta según lo que de verdad se cobró de cada uno, para que el
    // efectivo esperado en caja cuadre exacto.
    if (medio === "Mixto" && m.detallePago) {
      porMedio.Efectivo += Number(m.detallePago.efectivo) || 0;
      porMedio.Tarjeta += Number(m.detallePago.tarjeta) || 0;
    } else {
      porMedio[medio] = (porMedio[medio] || 0) + importe;
    }
  });
  const efectivoEsperado = porMedio.Efectivo || 0;
  const diferencia = contado === "" ? null : Number(contado) - efectivoEsperado;

  const yaArqueado = arqueos.find((a) => a.fecha === fecha);

  function submit() {
    if (contado === "") { setError("Escribe cuánto efectivo hay en caja."); return; }
    setError("");
    addArqueo({ fecha, efectivoEsperado, efectivoContado: Number(contado), diferencia, notas });
    setContado("");
    setNotas("");
  }

  return (
    <div>
      <SectionTitle>Arqueo de caja</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Compara el efectivo que hay físicamente en el cajón con lo que el programa dice que se ha vendido en
          efectivo ese día. Las ventas con tarjeta o transferencia no se cuadran aquí, solo se muestran como referencia.
        </div>
      </Card>

      <Card className="mb-4">
        <Field label="Fecha"><Input type="date" value={fecha} onChange={(e) => setFecha(e.target.value)} /></Field>

        <div className="grid grid-cols-2 gap-3 my-3">
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Efectivo esperado</div>
            <div className="text-xl font-semibold mono">€{fmt(efectivoEsperado)}</div>
          </div>
          <div>
            <div className="text-[11px]" style={{ color: C.inkSoft }}>Otras ventas (tarjeta, transf.)</div>
            <div className="text-xl font-semibold mono" style={{ color: C.inkSoft }}>
              €{fmt((porMedio.Tarjeta || 0) + (porMedio.Transferencia || 0) + (porMedio.Otro || 0))}
            </div>
          </div>
        </div>

        {yaArqueado ? (
          <div className="p-2 rounded-lg text-[12.5px]" style={{ background: C.bg }}>
            Ya arqueaste este día: contaste €{fmt(yaArqueado.efectivoContado)}
            {" "}({yaArqueado.diferencia === 0 ? "cuadra" : yaArqueado.diferencia > 0 ? `sobran €${fmt(yaArqueado.diferencia)}` : `faltan €${fmt(Math.abs(yaArqueado.diferencia))}`}).
            <div className="mt-2"><Btn small variant="danger" onClick={() => deleteArqueo(yaArqueado.id)}>Borrar y repetir</Btn></div>
          </div>
        ) : (
          <>
            <Field label="Efectivo contado en caja (€)">
              <Input type="number" step="0.01" value={contado} onChange={(e) => setContado(e.target.value)} autoFocus />
            </Field>
            {diferencia !== null && (
              <div className="text-[12.5px] mb-2" style={{ color: diferencia === 0 ? C.accent : Math.abs(diferencia) < 1 ? C.amber : C.red }}>
                {diferencia === 0 ? "Cuadra exacto." : diferencia > 0 ? `Sobran €${fmt(diferencia)}` : `Faltan €${fmt(Math.abs(diferencia))}`}
              </div>
            )}
            <Field label="Notas (opcional)"><Input value={notas} onChange={(e) => setNotas(e.target.value)} placeholder="Motivo del descuadre, si lo sabes" /></Field>
            {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
            <Btn onClick={submit}>Guardar arqueo</Btn>
          </>
        )}
      </Card>

      <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Historial de arqueos</div>
      {arqueos.length === 0 ? <Empty text="Todavía no has hecho ningún arqueo." /> : (
        <div className="space-y-1.5">
          {arqueos.slice(0, 30).map((a) => (
            <Card key={a.id}>
              <div className="flex items-center justify-between text-[12.5px]">
                <span>{a.fecha}</span>
                <span className="mono font-semibold" style={{ color: a.diferencia === 0 ? C.accent : Math.abs(a.diferencia) < 1 ? C.amber : C.red }}>
                  {a.diferencia === 0 ? "Cuadra" : a.diferencia > 0 ? `+€${fmt(a.diferencia)}` : `−€${fmt(Math.abs(a.diferencia))}`}
                </span>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= TURNOS ================= */
const PLANTILLAS_TURNO = [
  { id: "manana", label: "Mañana", horaInicio: "08:00", horaFin: "14:00" },
  { id: "tarde", label: "Tarde", horaInicio: "16:00", horaFin: "20:00" },
  { id: "cierre", label: "Cierre", horaInicio: "14:00", horaFin: "21:00" },
  { id: "libre", label: "Libre / descanso", horaInicio: "", horaFin: "" },
  { id: "personalizado", label: "Personalizado", horaInicio: "", horaFin: "" },
];
const DIAS_SEMANA = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado", "Domingo"];

function fechasSemana(inicioIso) {
  const out = [];
  const d = new Date(inicioIso);
  for (let i = 0; i < 7; i++) {
    const f = new Date(d);
    f.setDate(d.getDate() + i);
    out.push(f.toISOString().slice(0, 10));
  }
  return out;
}
function horasTurno(t) {
  if (!t.horaInicio || !t.horaFin) return 0;
  const [h1, m1] = t.horaInicio.split(":").map(Number);
  const [h2, m2] = t.horaFin.split(":").map(Number);
  return Math.max(0, (h2 * 60 + m2 - (h1 * 60 + m1)) / 60);
}

function Turnos({ empleados, turnos, addTurno, updateTurno, deleteTurno, copiarSemana }) {
  const activos = empleados.filter((e) => e.activo !== false);
  const [inicio, setInicio] = useState(inicioSemana(new Date()));
  const dias = fechasSemana(inicio);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(null);
  const [error, setError] = useState("");
  const [copiadoMsg, setCopiadoMsg] = useState("");

  function irSemana(delta) {
    const d = new Date(inicio);
    d.setDate(d.getDate() + delta * 7);
    setInicio(inicioSemana(d));
  }

  function abrirNuevo(fecha) {
    setForm({ empleadoId: activos[0]?.id || "", fecha: fecha || dias[0], plantilla: "manana", horaInicio: "08:00", horaFin: "14:00", notas: "" });
    setError("");
    setShowForm(true);
  }

  function elegirPlantilla(id) {
    const p = PLANTILLAS_TURNO.find((x) => x.id === id);
    setForm((f) => ({ ...f, plantilla: id, horaInicio: p.horaInicio, horaFin: p.horaFin }));
  }

  function submit() {
    if (!form.empleadoId) { setError("Selecciona un empleado."); return; }
    setError("");
    const plantilla = PLANTILLAS_TURNO.find((p) => p.id === form.plantilla);
    addTurno({
      empleadoId: form.empleadoId, fecha: form.fecha,
      tipo: plantilla ? plantilla.label : "Personalizado",
      horaInicio: form.horaInicio, horaFin: form.horaFin, notas: form.notas,
    });
    setShowForm(false);
    setForm(null);
  }

  // Si el empleado marcó qué días suele poder trabajar, avisa cuando el
  // turno cae en un día que no marcó — sin bloquear, porque siempre puede
  // ser una excepción puntual que el propio dueño decide a mano.
  const empleadoElegido = form ? activos.find((e) => e.id === form.empleadoId) : null;
  const avisoDisponibilidad = useMemo(() => {
    if (!form || !empleadoElegido) return null;
    const dias = empleadoElegido.diasDisponibles;
    if (!dias || dias.length === 0) return null;
    const diaSemana = new Date(form.fecha).getDay();
    if (dias.includes(diaSemana)) return null;
    return `${empleadoElegido.nombre} no suele estar disponible los ${DIAS_SEMANA[diaSemana === 0 ? 6 : diaSemana - 1]}.`;
  }, [form, empleadoElegido]);

  function hacerCopiarSemana() {
    const anteriorInicio = new Date(inicio);
    anteriorInicio.setDate(anteriorInicio.getDate() - 7);
    const desdeFechas = fechasSemana(anteriorInicio.toISOString().slice(0, 10));
    const n = copiarSemana(desdeFechas, dias);
    setCopiadoMsg(n > 0 ? `Copiados ${n} turno(s) de la semana anterior.` : "La semana anterior no tenía turnos que copiar.");
    setTimeout(() => setCopiadoMsg(""), 4000);
  }

  // Horas asignadas por empleado en la semana, para comparar con su contrato
  const horasPorEmpleado = useMemo(() => {
    const mapa = {};
    activos.forEach((e) => { mapa[e.id] = 0; });
    turnos.filter((t) => dias.includes(t.fecha)).forEach((t) => {

/* ================= MAPA DE ALMACÉN ================= */
function MapaAlmacen({ productos, proveedorPorId }) {
  const zonas = useMemo(() => {
    const mapa = {};
    ZONAS_ALMACEN.forEach((z) => { mapa[z] = []; });
    productos.forEach((p) => {
      const z = p.zona || "Sin asignar";
      if (!mapa[z]) mapa[z] = [];
      mapa[z].push(p);
    });
    return ZONAS_ALMACEN.map((z) => ({ zona: z, items: mapa[z] || [] })).filter((g) => g.items.length > 0);
  }, [productos]);

  return (
    <div>
      <SectionTitle>Mapa de almacén</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Cada producto se asigna a una zona desde su ficha (Productos → Editar → Zona del almacén). Aquí ves de un
          vistazo qué hay en cada rincón del local, sin tener que buscar producto a producto.
        </div>
      </Card>

      {zonas.length === 0 ? (
        <Empty text="Todavía no has asignado ninguna zona a tus productos." />
      ) : (
        <div className="grid md:grid-cols-2 gap-3">
          {zonas.map((g) => {
            const valor = g.items.reduce((a, p) => a + (Number(p.stock) || 0) * (Number(p.costo) || 0), 0);
            const bajos = g.items.filter((p) => (Number(p.stock) || 0) <= (Number(p.stockMinimo) || 0)).length;
            return (
              <Card key={g.zona}>
                <div className="flex items-center justify-between mb-2">
                  <div className="font-semibold text-[14px]">{g.zona}</div>
                  <Pill color={C.accent}>{g.items.length} ref.</Pill>
                </div>
                <div className="text-[11.5px] mb-2" style={{ color: C.inkSoft }}>
                  Valor: <span className="mono">€{fmt(valor)}</span>
                  {bajos > 0 && <span style={{ color: C.amber }}> · {bajos} en stock bajo</span>}
                </div>
                <div className="space-y-1 max-h-48 overflow-y-auto">
                  {g.items
                    .sort((a, b) => (a.ubicacion || "").localeCompare(b.ubicacion || "") || a.nombre.localeCompare(b.nombre))
                    .map((p) => {
                      const bajo = (Number(p.stock) || 0) <= (Number(p.stockMinimo) || 0);
                      return (
                        <div key={p.id} className="flex items-center justify-between text-[12px] py-0.5">
                          <span>
                            {p.nombre}
                            {p.ubicacion && <span style={{ color: C.inkSoft }}> · {p.ubicacion}</span>}
                          </span>
                          <span className="mono" style={{ color: bajo ? C.red : C.inkSoft }}>{p.stock} {p.unidad}</span>
                        </div>
                      );
                    })}
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ================= ESCÁNER DE CÓDIGO DE BARRAS ================= */
function EscanerCodigoBarras({ onDetectado, onClose }) {
  const videoRef = React.useRef(null);
  const streamRef = React.useRef(null);
  const [estado, setEstado] = useState("iniciando"); // iniciando | activo | sin-soporte | sin-permiso
  const [manual, setManual] = useState("");
  const [intento, setIntento] = useState(0);

  useEffect(() => {
    let detenido = false;

    async function arrancar() {
      if (!("BarcodeDetector" in window)) {
        setEstado("sin-soporte");
        return;
      }
      // Antes de intentar nada: la cámara del navegador exige una conexión seria
      // (https, o un servidor local de pruebas). Un archivo abierto directamente
      // desde Descargas no cuenta como tal, y el error que da el navegador en
      // ese caso es el mismo que si hubieras denegado el permiso — así que se
      // comprueba esto primero, para poder decir la causa exacta en vez de
      // dejarte adivinar entre dos posibles.
      if (!window.isSecureContext) {
        setEstado("sin-https");
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
        if (detenido) { stream.getTracks().forEach((t) => t.stop()); return; }
        streamRef.current = stream;
        // El <video> ya está montado desde el primer render (no depende de "estado"),
        // así que aquí la referencia siempre existe. Antes se intentaba conectar
        // la cámara antes de que el elemento existiera, y por eso salía en negro.
        if (videoRef.current) {
          videoRef.current.srcObject = stream;
          try {
            await videoRef.current.play();
          } catch (e) {
            // Algunos navegadores necesitan un segundo intento tras cargar metadatos
            videoRef.current.onloadedmetadata = () => { videoRef.current.play().catch(() => {}); };
          }
        }
        setEstado("activo");
        const detector = new window.BarcodeDetector({
          formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code"],
        });
        const loop = async () => {
          if (detenido || !videoRef.current) return;
          try {
            if (videoRef.current.readyState >= 2) {
              const codigos = await detector.detect(videoRef.current);
              if (codigos.length > 0) {
                onDetectado(codigos[0].rawValue);
                return;
              }
            }
          } catch (e) { /* seguir intentando */ }
          if (!detenido) requestAnimationFrame(loop);
        };
        loop();
      } catch (e) {
        setEstado("sin-permiso");
      }
    }
    arrancar();

    return () => {
      detenido = true;
      if (streamRef.current) streamRef.current.getTracks().forEach((t) => t.stop());
    };
  }, [intento]);

  return (
    <Modal onClose={onClose} title="Escanear código de barras">
      <div
        className="rounded-lg overflow-hidden mb-3"
        style={{ background: "#000", height: 240, display: "flex", alignItems: "center", justifyContent: "center" }}
      >
        <video
          ref={videoRef}
          autoPlay
          muted
          playsInline
          style={{ width: "100%", height: "100%", objectFit: "cover", display: estado === "activo" ? "block" : "none" }}
        />
        {estado === "iniciando" && <div className="text-[12.5px]" style={{ color: "#fff" }}>Abriendo la cámara…</div>}
      </div>
      {estado === "sin-soporte" && (
        <div className="text-[12.5px] mb-3" style={{ color: C.amber }}>
          Tu navegador no permite leer códigos de barras automáticamente (esto solo funciona en Chrome para Android,
          y en tu web real, no aquí dentro de Claude). Escribe el código a mano abajo.
        </div>
      )}
      {estado === "sin-https" && (
        <div className="text-[12.5px] mb-2" style={{ color: C.red }}>
          La cámara no funciona así — estás abriendo el archivo descargado directamente, y por seguridad del
          navegador, la cámara solo se puede usar entrando desde tu web real (la que empieza por <b>https://</b>).
          Entra desde ahí para escanear, o escribe el código a mano abajo.
        </div>
      )}
      {estado === "sin-permiso" && (
        <div className="text-[12.5px] mb-2" style={{ color: C.red }}>
          No se pudo acceder a la cámara — puede que no hayas dado permiso, o que estés en un sitio sin conexión
          segura (https). Escribe el código a mano abajo.
        </div>
      )}
      {estado === "activo" && (
        <div className="text-[11.5px] mb-3" style={{ color: C.inkSoft }}>
          Si ves negro más de unos segundos, toca "Reintentar".
          <button type="button" onClick={() => { setEstado("iniciando"); setIntento((i) => i + 1); }} className="ml-1 font-medium" style={{ color: C.accent }}>
            Reintentar
          </button>
        </div>
      )}
      <Field label="O escribe el código a mano">
        <Input value={manual} onChange={(e) => setManual(e.target.value)} placeholder="EAN o código" autoFocus={estado !== "activo"} />
      </Field>
      <div className="flex gap-2">
        <Btn onClick={() => manual.trim() && onDetectado(manual.trim())}>Usar este código</Btn>
        <Btn variant="ghost" onClick={onClose}>Cancelar</Btn>
      </div>
    </Modal>
  );
}

/* ================= AUDITORÍA ================= */
function Auditoria({ auditoria }) {
  const [desde, setDesde] = useState(primerDiaMes(new Date()));
  const [hasta, setHasta] = useState(todayISO());
  const [copiado, setCopiado] = useState(false);

  const filtrada = auditoria.filter((a) => a.fecha >= desde && a.fecha <= hasta);

  function textoAuditoria() {
    const lineas = filtrada.map((a) => `${a.fecha} ${a.hora} · [${a.usuario || a.modo}] ${a.accion} — ${a.detalle}`);
    return `AUDITORÍA DE CAMBIOS\nDel ${desde} al ${hasta}\n\n${lineas.join("\n")}\n\nGenerado el ${new Date().toLocaleString("es-ES")}`;
  }
  function copiar() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(textoAuditoria()).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  return (
    <div>
      <SectionTitle>Auditoría</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Registro de las acciones sensibles: borrados, pagos marcados, ajustes de inventario, anulaciones y
          variaciones de precio al confirmar un albarán. No registra cada clic — solo lo que de verdad importa
          revisar si algo sale mal.
        </div>
      </Card>

      <Card className="mb-4">
        <div className="grid grid-cols-2 gap-x-3">
          <Field label="Desde"><Input type="date" value={desde} onChange={(e) => setDesde(e.target.value)} /></Field>
          <Field label="Hasta"><Input type="date" value={hasta} onChange={(e) => setHasta(e.target.value)} /></Field>
        </div>
        <Btn variant="ghost" onClick={copiar}>{copiado ? "¡Copiado!" : "Copiar como texto"}</Btn>
      </Card>

      {filtrada.length === 0 ? <Empty text="Sin acciones registradas en este periodo." /> : (
        <div className="space-y-1.5">
          {filtrada.map((a) => (
            <Card key={a.id}>
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-[12.5px] font-medium">{a.accion}</div>
                  <div className="text-[11.5px]" style={{ color: C.inkSoft }}>{a.detalle}</div>
                </div>
                <div className="text-right shrink-0 ml-2">
                  <div className="text-[11px] mono" style={{ color: C.inkSoft }}>{a.fecha} {a.hora}</div>
                  <Pill color={(a.usuario || a.modo) !== "Propietario/a" ? C.amber : C.inkSoft}>{a.usuario || a.modo}</Pill>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* ================= PRODUCCIÓN ================= */
function Produccion({ fichasCosto, productos, ordenesProduccion, producir, anularProduccion, traspasarStock }) {
  const [fichaId, setFichaId] = useState(fichasCosto[0]?.id || "");
  const [unidadesDeseadas, setUnidadesDeseadas] = useState("");
  const [ingredientesReales, setIngredientesReales] = useState([]);
  const [empaqueReal, setEmpaqueReal] = useState("");
  const [manoObraReal, setManoObraReal] = useState("");
  const [gastosGeneralesReal, setGastosGeneralesReal] = useState("");
  const [unidadesBuenas, setUnidadesBuenas] = useState("");
  const [notas, setNotas] = useState("");
  const [error, setError] = useState("");
  const [resultado, setResultado] = useState(null);
  const [verHistorial, setVerHistorial] = useState(false);
  const [anulando, setAnulando] = useState(null);
  const [enviadoAPiso, setEnviadoAPiso] = useState(false);
  const [errorEnvio, setErrorEnvio] = useState("");

  // Atajo para no tener que ir a Traspasos cada vez que se hornea algo:
  // manda al mostrador justo lo que acaba de salir de esta tanda.
  function enviarAPisoDeVenta(orden) {
    const productoId = orden.productoVinculadoId ||
      (fichasCosto.find((f) => f.id === orden.fichaId) || {}).productoVinculadoId;
    if (!productoId) {
      setErrorEnvio("Esta ficha no tiene un producto de venta enlazado.");
      return;
    }
    const res = traspasarStock(productoId, Number(orden.unidadesBuenas) || 0, "a_piso");
    if (!res.ok) {
      setErrorEnvio(res.error);
      return;
    }
    setErrorEnvio("");
    setEnviadoAPiso(true);
  }

  // Corregir una producción = anularla y volver a dejar el formulario tal
  // como estaba, para rehacerla con los datos bien. Es más seguro que editar
  // sobre la marcha: así el stock siempre queda cuadrado.
  function rehacer(orden) {
    anularProduccion(orden);
    setFichaId(orden.fichaId);
    setUnidadesDeseadas(String(orden.unidadesDeseadas || ""));
    setUnidadesBuenas(String(orden.unidadesBuenas || ""));
    setIngredientesReales(
      (orden.ingredientes || []).map((i) => {
        const p = productos.find((x) => x.id === i.productoId);
        return {
          ...i,
          nombre: p ? p.nombre : i.nombre || "—",
          unidad: p ? p.unidad : i.unidad || "",
          stockDisponible: p ? Number(p.stock) || 0 : 0,
        };
      })
    );
    setEmpaqueReal(orden.empaqueReal ?? "");
    setManoObraReal(orden.manoObraReal ?? "");
    setGastosGeneralesReal(orden.gastosGeneralesReal ?? "");
    setNotas(orden.notas || "");
    setError("");
    setVerHistorial(false);
    if (typeof window !== "undefined" && window.scrollTo) window.scrollTo({ top: 0, behavior: "smooth" });
  }

  const ficha = fichasCosto.find((f) => f.id === fichaId);
  const rendimiento = Number(ficha?.rendimiento) || 1;
  const factor = ficha && Number(unidadesDeseadas) > 0 ? Number(unidadesDeseadas) / rendimiento : 1;

  // Al elegir ficha o cambiar la cantidad deseada, se recalculan las cantidades
  // teóricas de cada ingrediente. El usuario parte de ahí y las ajusta si hubo mermas.
  function recalcular(fichaElegida, deseadas) {
    if (!fichaElegida) {
      setIngredientesReales([]);
      return;
    }
    const f = Number(deseadas) > 0 ? Number(deseadas) / (Number(fichaElegida.rendimiento) || 1) : 1;
    const lista = (fichaElegida.componentes || [])
      .filter((c) => c.productoId)
      .map((c) => {
        const p = productos.find((x) => x.id === c.productoId);
        const teorica = (Number(c.cantidad) || 0) * f;
        return {
          productoId: c.productoId,
          nombre: p ? p.nombre : c.nombre || "—",
          unidad: p ? p.unidad : "",
          stockDisponible: p ? Number(p.stock) || 0 : 0,
          cantidadTeorica: teorica,
          cantidadReal: Number(teorica.toFixed(3)),
        };
      });
    setIngredientesReales(lista);
    setEmpaqueReal(Number(((Number(fichaElegida.empaque) || 0) * f).toFixed(2)));
    setManoObraReal(Number(((Number(fichaElegida.manoObra) || 0) * f).toFixed(2)));
    setGastosGeneralesReal(Number(((Number(fichaElegida.gastosGenerales) || 0) * f).toFixed(2)));
  }

  function elegirFicha(id) {
    setFichaId(id);
    setError("");
    setResultado(null);
    const f = fichasCosto.find((x) => x.id === id);
    setUnidadesDeseadas(f ? String(f.rendimiento || 1) : "");
    setUnidadesBuenas(f ? String(f.rendimiento || 1) : "");
    recalcular(f, f ? f.rendimiento : 1);
  }

  function cambiarDeseadas(v) {
    setUnidadesDeseadas(v);
    setUnidadesBuenas(v);
    recalcular(ficha, v);
  }

  function actualizarIngrediente(idx, valor) {
    setIngredientesReales((s) => s.map((ing, i) => (i === idx ? { ...ing, cantidadReal: valor } : ing)));
  }

  const costoIngredientes = ingredientesReales.reduce((a, ing) => {
    const p = productos.find((x) => x.id === ing.productoId);
    return a + (Number(ing.cantidadReal) || 0) * (p ? Number(p.costo) || 0 : 0);
  }, 0);
  const costoTotalPrevisto = costoIngredientes + (Number(empaqueReal) || 0) + (Number(manoObraReal) || 0) + (Number(gastosGeneralesReal) || 0);
  const costoPorUnidadPrevisto = Number(unidadesBuenas) > 0 ? costoTotalPrevisto / Number(unidadesBuenas) : 0;

  const faltantes = ingredientesReales.filter((ing) => Number(ing.cantidadReal) > ing.stockDisponible);

  function submit() {
    if (!ficha) { setError("Elige una ficha de costo."); return; }
    if (!ficha.productoVinculadoId) { setError("Esta ficha no tiene un producto de venta enlazado. Ve a Fichas de costo y usa \"Crear producto de venta\" primero."); return; }
    if (!(Number(unidadesBuenas) > 0)) { setError("Indica cuántas unidades buenas han salido."); return; }
    setError("");
    const res = producir({
      fichaId, unidadesDeseadas, unidadesBuenas,
      ingredientesReales, empaqueReal, manoObraReal, gastosGeneralesReal, notas,
    });
    if (!res.ok) { setError(res.error); return; }
    setResultado(res.orden);
    setNotas("");
  }

  return (
    <div>
      <SectionTitle>Producción</SectionTitle>

      <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
        <div className="text-[12.5px]">
          Convierte una ficha de costo en una fabricación real: descuenta los ingredientes que de verdad se
          gastaron (no solo la teoría de la receta) y da entrada al producto elaborado con el coste real de esta
          tanda. Ajusta las cantidades si hubo mermas — un huevo roto, un poco más de mantequilla, lo que sea.
        </div>
      </Card>

      {fichasCosto.length === 0 ? (
        <Empty text="Crea antes una ficha de costo en 'Fichas de costo' para poder producir algo." />
      ) : (
        <>
          <Card className="mb-4">
            <Field label="¿Qué vas a producir?">
              <select value={fichaId} onChange={(e) => elegirFicha(e.target.value)} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface }}>
                <option value="">Selecciona una ficha…</option>
                {fichasCosto.map((f) => <option key={f.id} value={f.id}>{f.nombre}</option>)}
              </select>
            </Field>

            {ficha && !ficha.productoVinculadoId && (
              <div className="text-[12px] mb-2" style={{ color: C.amber }}>
                Esta ficha no tiene un producto de venta enlazado — ve a Fichas de costo y usa "Crear producto de venta" antes de producir.
              </div>
            )}

            {ficha && (
              <>
                <div className="text-[11.5px] mb-2" style={{ color: C.inkSoft }}>
                  La receta rinde {rendimiento} unidad(es) de base.
                </div>
                <Field label="¿Cuántas unidades quieres producir?">
                  <Input type="number" step="0.01" value={unidadesDeseadas} onChange={(e) => cambiarDeseadas(e.target.value)} />
                </Field>
              </>
            )}
          </Card>

          {ficha && ingredientesReales.length > 0 && (
            <>
              <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Ingredientes — ajusta si hubo mermas</div>
              <div className="space-y-2 mb-4">
                {ingredientesReales.map((ing, idx) => {
                  const faltaStock = Number(ing.cantidadReal) > ing.stockDisponible;
                  return (
                    <Card key={idx}>
                      <div className="flex items-center justify-between mb-1">
                        <span className="text-[12.5px] font-medium">{ing.nombre}</span>
                        <span className="text-[11px]" style={{ color: C.inkSoft }}>Receta: {fmt(ing.cantidadTeorica)} {ing.unidad}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <Input type="number" step="0.001" value={ing.cantidadReal} onChange={(e) => actualizarIngrediente(idx, e.target.value)} />
                        <span className="text-[12px] shrink-0" style={{ color: C.inkSoft }}>{ing.unidad}</span>
                      </div>
                      <div className="text-[11px] mt-1" style={{ color: faltaStock ? C.red : C.inkSoft }}>
                        Stock disponible: {fmt(ing.stockDisponible)} {ing.unidad}
                        {faltaStock && " — no hay suficiente"}
                      </div>
                    </Card>
                  );
                })}
              </div>

              <Card className="mb-4">
                <div className="text-[12px] font-medium mb-2" style={{ color: C.inkSoft }}>Otros costes de esta tanda</div>
                <div className="grid grid-cols-3 gap-x-2">
                  <Field label="Empaque (€)"><Input type="number" step="0.01" value={empaqueReal} onChange={(e) => setEmpaqueReal(e.target.value)} /></Field>
                  <Field label="Mano de obra (€)"><Input type="number" step="0.01" value={manoObraReal} onChange={(e) => setManoObraReal(e.target.value)} /></Field>
                  <Field label="Gastos generales (€)"><Input type="number" step="0.01" value={gastosGeneralesReal} onChange={(e) => setGastosGeneralesReal(e.target.value)} /></Field>
                </div>
              </Card>

              <Card className="mb-4">
                <Field label="¿Cuántas unidades buenas han salido realmente?">
                  <Input type="number" step="0.01" value={unidadesBuenas} onChange={(e) => setUnidadesBuenas(e.target.value)} />
                </Field>
                <div className="text-[11px] mb-2" style={{ color: C.inkSoft }}>
                  Si se te quemó parte de la tanda, pon aquí solo lo aprovechable — el coste se reparte entre estas unidades.
                </div>
                <Field label="Notas (opcional)"><Input value={notas} onChange={(e) => setNotas(e.target.value)} /></Field>
              </Card>

              <Card className="mb-4" style={{ background: C.chrome, color: "#fff" }}>
                <div className="flex items-center justify-between">
                  <span className="text-[12.5px]">Coste previsto de esta tanda</span>
                  <span className="mono font-bold">€{fmt(costoTotalPrevisto)}</span>
                </div>
                <div className="flex items-center justify-between mt-1">
                  <span className="text-[12.5px]">Coste por unidad</span>
                  <span className="mono font-bold">€{fmt(costoPorUnidadPrevisto)}</span>
                </div>
              </Card>

              {faltantes.length > 0 && (
                <Card className="mb-4" style={{ background: C.redSoft, border: "none" }}>
                  <div className="text-[12.5px]">
                    Vas a dejar en negativo el stock de: {faltantes.map((f) => f.nombre).join(", ")}. Puedes seguir igualmente,
                    pero revisa si de verdad tienes ese ingrediente o si falta darle entrada por Albaranes.
                  </div>
                </Card>
              )}

              {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
              <Btn onClick={submit}>Confirmar producción</Btn>
            </>
          )}
        </>
      )}

      {resultado && (
        <Modal onClose={() => { setResultado(null); setEnviadoAPiso(false); }} title="Producción registrada">
          <div className="text-[12.5px] mb-3">
            {resultado.fichaNombre}: {fmt(resultado.unidadesBuenas)} unidad(es) a €{fmt(resultado.costoUnitarioLote)}/ud.
            Ya se ha descontado el stock de ingredientes y dado entrada al producto elaborado.
          </div>

          {enviadoAPiso ? (
            <Card className="mb-3" style={{ background: C.accentSoft, border: "none" }}>
              <div className="text-[12.5px]">
                Enviadas al piso de venta. Ya aparecen en <b>Venta rápida</b> para cobrarlas.
              </div>
            </Card>
          ) : (
            <>
              <Card className="mb-3" style={{ background: C.amberSoft, border: "none" }}>
                <div className="text-[12.5px]">
                  Están en el almacén, todavía no en el mostrador. Para poder venderlas en Venta rápida hay que
                  pasarlas al piso de venta.
                </div>
              </Card>
              <div className="flex gap-2 mb-3">
                <Btn onClick={() => enviarAPisoDeVenta(resultado)}>
                  Enviar las {fmt(resultado.unidadesBuenas)} al piso de venta
                </Btn>
              </div>
              {errorEnvio && <div className="text-[12px] mb-2" style={{ color: C.red }}>{errorEnvio}</div>}
            </>
          )}

          <Btn variant="ghost" onClick={() => { setResultado(null); setEnviadoAPiso(false); }}>Cerrar</Btn>
        </Modal>
      )}

      <button onClick={() => setVerHistorial((s) => !s)} className="text-[12.5px] font-medium mt-4 mb-2" style={{ color: C.accent }}>
        {verHistorial ? "Ocultar" : "Ver"} historial de producción ({ordenesProduccion.length})
      </button>
      {verHistorial && (
        <div className="space-y-1.5">
          {ordenesProduccion.length === 0 ? <Empty text="Todavía no has registrado ninguna producción." /> : ordenesProduccion.map((o) => (
            <Card key={o.id}>
              <div className="flex items-center justify-between text-[12.5px]">
                <span>{o.fechaHora || `${o.fecha} ${o.hora}`} · {o.fichaNombre}</span>
                <span className="mono">{fmt(o.unidadesBuenas)} ud · €{fmt(o.costoUnitarioLote)}/ud</span>
              </div>
              {o.notas && <div className="text-[11.5px] mt-1" style={{ color: C.inkSoft }}>{o.notas}</div>}
              <div className="mt-2 flex gap-2">
                <Btn small variant="ghost" onClick={() => setAnulando(o)}><Trash2 size={13} /> Anular</Btn>
                <Btn small variant="ghost" onClick={() => rehacer(o)}>Corregir</Btn>
              </div>
            </Card>
          ))}
        </div>
      )}

      {anulando && (
        <Modal onClose={() => setAnulando(null)} title="¿Anular esta producción?">
          <div className="text-[12.5px] mb-3">
            <b>{anulando.fichaNombre}</b> · {fmt(anulando.unidadesBuenas)} unidad(es) del {anulando.fecha}
          </div>
          <div className="text-[12.5px] mb-3">
            Se devolverán los ingredientes al almacén y se quitarán las unidades elaboradas. Se borran también sus
            movimientos, para que no cuenten dos veces en los informes.
          </div>
          <Card className="mb-3" style={{ background: C.amberSoft, border: "none" }}>
            <div className="text-[12px]">
              El coste del producto elaborado vuelve al que tenía antes de esta tanda. Ese cálculo es exacto si no
              has producido ni recibido más de ese producto desde entonces; si sí, quedará aproximado — conviene
              revisar su coste en Productos después de anular.
            </div>
          </Card>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { anularProduccion(anulando); setAnulando(null); }}>Sí, anular</Btn>
            <Btn variant="ghost" onClick={() => setAnulando(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= ETIQUETAS Y CATÁLOGO ================= */
function EtiquetasCatalogo({ productos, fichasCosto, alergenosDeFicha }) {
  const [vista, setVista] = useState("etiquetas"); // etiquetas | catalogo
  const [seleccionados, setSeleccionados] = useState([]);
  const [copias, setCopias] = useState(1);

  // Vendibles: elaborados con ficha, o cualquier producto con precio de venta puesto
  const vendibles = useMemo(() => {
    const conFicha = new Map(fichasCosto.filter((f) => f.productoVinculadoId).map((f) => [f.productoVinculadoId, f]));
    return productos
      .filter((p) => p.tipo === "elaborado" || Number(p.precioVenta) > 0)
      .map((p) => {
        const ficha = conFicha.get(p.id);
        const alergenos = ficha ? alergenosDeFicha(ficha) : (p.alergenos || []);
        return { producto: p, alergenos };
      })
      .sort((a, b) => (a.producto.categoria || "").localeCompare(b.producto.categoria || "") || a.producto.nombre.localeCompare(b.producto.nombre));
  }, [productos, fichasCosto, alergenosDeFicha]);

  function alternar(id) {
    setSeleccionados((s) => (s.includes(id) ? s.filter((x) => x !== id) : [...s, id]));
  }
  function seleccionarTodos() {
    setSeleccionados(vendibles.map((v) => v.producto.id));
  }
  function quitarTodos() {
    setSeleccionados([]);
  }

  const etiquetasAImprimir = useMemo(() => {
    const elegidos = vendibles.filter((v) => seleccionados.includes(v.producto.id));
    const n = Math.max(1, Math.min(20, Number(copias) || 1));
    const out = [];
    elegidos.forEach((v) => { for (let i = 0; i < n; i++) out.push(v); });
    return out;
  }, [vendibles, seleccionados, copias]);

  // Catálogo agrupado por categoría, con subtotal de referencias por grupo
  const catalogoPorCategoria = useMemo(() => {
    const mapa = {};
    vendibles.forEach((v) => {
      const cat = v.producto.categoria || "Sin categoría";
      if (!mapa[cat]) mapa[cat] = [];
      mapa[cat].push(v);
    });
    return Object.entries(mapa).sort((a, b) => a[0].localeCompare(b[0]));
  }, [vendibles]);

  return (
    <div>
      <div className="no-imprimir">
        <SectionTitle>Etiquetas y catálogo</SectionTitle>
        <div className="flex gap-2 mb-4">
          <Btn small variant={vista === "etiquetas" ? "primary" : "ghost"} onClick={() => setVista("etiquetas")}>Etiquetas de vitrina</Btn>
          <Btn small variant={vista === "catalogo" ? "primary" : "ghost"} onClick={() => setVista("catalogo")}>Catálogo</Btn>
        </div>
      </div>

      {vendibles.length === 0 ? (
        <Empty text="Todavía no tienes productos de venta con precio puesto. Ponles precio en Productos, o crea uno desde una ficha de costo." />
      ) : vista === "etiquetas" ? (
        <>
          <div className="no-imprimir">
            <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
              <div className="text-[12.5px]">
                Marca los productos que quieres etiquetar. Cada uno saca su nombre, precio y alérgenos, listos para
                recortar y poner en la vitrina.
              </div>
            </Card>

            <div className="flex items-center justify-between mb-2">
              <span className="text-[12px] font-medium" style={{ color: C.inkSoft }}>{seleccionados.length} seleccionado(s)</span>
              <div className="flex gap-2">
                <Btn small variant="ghost" onClick={seleccionarTodos}>Seleccionar todos</Btn>
                <Btn small variant="ghost" onClick={quitarTodos}>Ninguno</Btn>
              </div>
            </div>

            <div className="space-y-1 mb-4" style={{ maxHeight: 280, overflowY: "auto" }}>
              {vendibles.map((v) => (
                <label key={v.producto.id} className="flex items-center gap-2 px-3 py-2 rounded-lg" style={{ background: C.surface, border: `1px solid ${C.line}` }}>
                  <input type="checkbox" checked={seleccionados.includes(v.producto.id)} onChange={() => alternar(v.producto.id)} />
                  <span className="text-[12.5px] flex-1">{v.producto.nombre}</span>
                  <span className="text-[11.5px] mono" style={{ color: C.inkSoft }}>€{fmt(precioNeto(v.producto) * (1 + ivaDe(v.producto) / 100))}</span>
                </label>
              ))}
            </div>

            <div className="flex items-end gap-3 mb-4">
              <Field label="Copias por producto (por si pones varias en la vitrina)">
                <Input type="number" min="1" max="20" value={copias} onChange={(e) => setCopias(e.target.value)} />
              </Field>
              <Btn onClick={() => window.print()} disabled={seleccionados.length === 0}>Imprimir etiquetas</Btn>
            </div>
          </div>

          {etiquetasAImprimir.length > 0 && (
            <div className="zona-impresion" style={ESTILO_IMPRESION_CLARO}>
              <div className="grid grid-cols-3 gap-3">
                {etiquetasAImprimir.map((v, i) => (
                  <div
                    key={i}
                    className="rounded-lg p-3 flex flex-col justify-between"
                    style={{ border: "1px dashed #999", minHeight: 130 }}
                  >
                    <div>
                      <div className="text-[13px] font-semibold leading-tight mb-1">{v.producto.nombre}</div>
                      {v.producto.categoria && (
                        <div className="text-[10px]" style={{ color: "#666" }}>{v.producto.categoria}</div>
                      )}
                    </div>
                    <div>
                      <div className="text-[20px] font-bold mono" style={{ color: "#8C6D2A" }}>
                        €{fmt(precioNeto(v.producto) * (1 + ivaDe(v.producto) / 100))}
                      </div>
                      {v.alergenos.length > 0 && (
                        <div className="text-[13px] mt-1">
                          {v.alergenos.map((id) => { const a = alergenoPorId(id); return a ? a.icono : ""; }).join(" ")}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      ) : (
        <>
          <div className="no-imprimir mb-3">
            <Btn onClick={() => window.print()}>Imprimir catálogo</Btn>
          </div>

          <div className="zona-impresion" style={ESTILO_IMPRESION_CLARO}>
            <div className="flex items-end justify-between mb-3 pb-3" style={{ borderBottom: "2px solid #8C6D2A" }}>
              <div>
                <div className="text-[17px] font-semibold">Catálogo de productos</div>
                <div className="text-[11.5px]" style={{ color: "#6B7A6E" }}>Actualizado el {new Date().toLocaleDateString("es-ES")}</div>
              </div>
              <img src={LOGO} alt="" style={{ height: 52, width: "auto" }} />
            </div>

            {catalogoPorCategoria.map(([categoria, items]) => (
              <div key={categoria} className="mb-4">
                <div className="text-[13px] font-semibold mb-1.5 px-2 py-1" style={{ background: "#F1E7CE" }}>{categoria}</div>
                {items.map((v) => (
                  <div key={v.producto.id} className="flex items-center justify-between py-1.5" style={{ borderBottom: "1px solid #E2DBC7" }}>
                    <div>
