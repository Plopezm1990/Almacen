/* ================= MODAL ================= */
/* ====== Bloque de compra por caja / paquete ====== */
/* Campo cuyo valor se calcula a partir de otro. Mientras el usuario escribe
   se muestra tal cual lo teclea; al salir del campo vuelve al valor calculado.
   Sin esto, el reformateo en cada pulsación impide escribir decimales. */
function InputCalc({ valor, onEscribir, decimales = 2, ...props }) {
  const [borrador, setBorrador] = useState(null);
  const formateado =
    valor === "" || valor === null || valor === undefined || isNaN(Number(valor))
      ? ""
      : Number(valor).toFixed(decimales);
  const mostrado = borrador !== null ? borrador : formateado;
  return (
    <Input
      {...props}
      type="number"
      value={mostrado}
      onChange={(e) => { setBorrador(e.target.value); onEscribir(e.target.value); }}
      onBlur={() => setBorrador(null)}
    />
  );
}

function Bloque({ titulo, children }) {
  return (
    <div className="mb-4">
      <div className="text-[11px] font-semibold uppercase tracking-wider mb-2 pb-1" style={{ color: C.accent, borderBottom: `1px solid ${C.line}` }}>
        {titulo}
      </div>
      {children}
    </div>
  );
}

function CompraPorCaja({ form, setForm }) {
  const iva = Number(form.ivaCompra) || 0;
  const uds = Number(form.udsPorCaja) || 1;
  const costoUd = Number(form.costo) || 0;

  // Escribir en cualquiera de las casillas recalcula el costo por unidad
  const desdeCaja = (valor, conIva) => {
    if (valor === "") { setForm({ ...form, costo: "" }); return; }
    let neto = Number(valor);
    if (isNaN(neto)) return;
    if (conIva) neto = neto / (1 + iva / 100);
    setForm({ ...form, costo: String(uds > 0 ? neto / uds : neto) });
  };
  const desdeUnidadBruta = (valor) => {
    if (valor === "") { setForm({ ...form, costo: "" }); return; }
    const n = Number(valor);
    if (isNaN(n)) return;
    setForm({ ...form, costo: String(n / (1 + iva / 100)) });
  };

  const cajaNeta = costoUd > 0 ? costoUd * uds : "";
  const cajaBruta = costoUd > 0 ? costoUd * uds * (1 + iva / 100) : "";
  const unidadBruta = costoUd > 0 ? costoUd * (1 + iva / 100) : "";

  return (
    <div className="rounded-lg p-3 mb-3" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
      <div className="text-[12px] font-semibold mb-1">Cómo te lo vende el proveedor</div>
      <div className="text-[11px] mb-3" style={{ color: C.inkSoft }}>
        Escribe en la casilla que traiga tu factura. Las demás se calculan solas.
      </div>

      <Field label="Unidades por caja (1 si lo compras suelto)">
        <Input type="number" step="1" value={form.udsPorCaja} onChange={(e) => setForm({ ...form, udsPorCaja: e.target.value })} />
      </Field>

      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Precio CAJA sin IVA (€)">
          <InputCalc step="0.01" valor={cajaNeta} decimales={2} onEscribir={(v) => desdeCaja(v, false)} />
        </Field>
        <Field label="Precio CAJA con IVA (€)">
          <InputCalc step="0.01" valor={cajaBruta} decimales={2} onEscribir={(v) => desdeCaja(v, true)} />
        </Field>
        <Field label="Costo UNIDAD sin IVA (€)">
          <InputCalc step="0.0001" valor={form.costo} decimales={4} onEscribir={(v) => setForm({ ...form, costo: v })} />
        </Field>
        <Field label="Costo UNIDAD con IVA (€)">
          <InputCalc step="0.0001" valor={unidadBruta} decimales={4} onEscribir={desdeUnidadBruta} />
        </Field>
      </div>

      {uds > 1 && costoUd > 0 && (
        <div className="text-[11.5px] mono" style={{ color: C.accent }}>
          Caja de {uds}: €{fmt(costoUd * uds)} sin IVA · €{fmt(costoUd * uds * (1 + iva / 100))} con IVA → unidad €{fmt(costoUd)}
        </div>
      )}
    </div>
  );
}

function Modal({ children, onClose, title, ancho = "max-w-md" }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto" style={{ background: "rgba(20,32,28,0.45)" }}>
      <div className={`rounded-xl p-5 w-full ${ancho} my-4`} style={{ background: C.surface }}>
        <div className="flex items-center justify-between mb-4">
          <div className="font-semibold text-[15px]">{title}</div>
          <button onClick={onClose}><X size={17} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ================= PEDIDOS ================= */
function Pedidos({ pedidos, proveedores, productos, crearPedido, actualizarPedido, eliminarPedido, proveedorPorId, productoPorId, sugerenciasPedido = [], addProducto }) {
  const [showForm, setShowForm] = useState(false);
  const [proveedorId, setProveedorId] = useState("");
  const [verTodosProductos, setVerTodosProductos] = useState(false);
  const [fechaEsperada, setFechaEsperada] = useState("");
  const [items, setItems] = useState([]);
  const [enviarPedido, setEnviarPedido] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const [creandoNuevoIdx, setCreandoNuevoIdx] = useState(null);
  const [nuevoProd, setNuevoProd] = useState({ nombre: "", unidad: "unidad", costo: "" });

  function addItemRow() {
    if (!productos.length) return;
    setItems((s) => [...s, { productoId: productos[0].id, cantidad: 1, costoUnitario: productos[0].costo }]);
  }
  function updateItem(idx, field, value) {
    setItems((s) =>
      s.map((it, i) => {
        if (i !== idx) return it;
        if (field === "productoId") {
          if (value === "__nuevo__") {
            setNuevoProd({ nombre: "", unidad: "unidad", costo: "" });
            setCreandoNuevoIdx(idx);
            return it; // no se cambia el producto todavía, se espera al formulario
          }
          const p = productos.find((pr) => pr.id === value);
          return { ...it, productoId: value, costoUnitario: p ? p.costo : it.costoUnitario };
        }
        return { ...it, [field]: value };
      })
    );
  }
  function guardarProductoNuevo() {
    if (!nuevoProd.nombre.trim()) return;
    const creado = addProducto({
      nombre: nuevoProd.nombre.trim(),
      unidad: nuevoProd.unidad || "unidad",
      tipo: "materia_prima",
      costo: Number(nuevoProd.costo) || 0,
      ivaCompra: 10,
      proveedorId: proveedorId || "",
      stock: 0,
      stockMinimo: 0,
    });
    setItems((s) => s.map((it, i) => (i === creandoNuevoIdx ? { ...it, productoId: creado.id, costoUnitario: creado.costo } : it)));
    setCreandoNuevoIdx(null);
  }
  function removeItem(idx) {
    setItems((s) => s.filter((_, i) => i !== idx));
  }
  const [error, setError] = useState("");

  function resetForm() {
    setItems([]);
    setProveedorId("");
    setFechaEsperada("");
    setEditingId(null);
    setError("");
    setVerTodosProductos(false);
  }

  function openEdit(pedido) {
    setEditingId(pedido.id);
    setProveedorId(pedido.proveedorId);
    setFechaEsperada(pedido.fechaEsperada || "");
    setItems(pedido.items.map((it) => ({ productoId: it.productoId, cantidad: it.cantidad, costoUnitario: it.costoUnitario })));
    setError("");
    setVerTodosProductos(false);
    setShowForm(true);
  }

  // Prepara un pedido nuevo a partir de las sugerencias de un proveedor: la
  // cantidad de partida cubre el plazo de entrega más una semana de colchón,
  // al ritmo de consumo real — es un punto de partida para ajustar, no una
  // cifra cerrada.
  function prepararPedidoDesdeSugerencias(proveedorId, sugerenciasDelProveedor) {
    setEditingId(null);
    setProveedorId(proveedorId);
    setFechaEsperada("");
    setItems(
      sugerenciasDelProveedor.map((p) => ({
        productoId: p.id,
        cantidad: Math.max(1, Math.ceil((p.consumoDiario || 0) * (p.diasHastaEntrega + 7))),
        costoUnitario: p.costo,
      }))
    );
    setError("");
    setVerTodosProductos(false);
    setShowForm(true);
  }

  function submit() {
    if (!proveedorId) {
      setError("Selecciona un proveedor.");
      return;
    }
    if (items.length === 0) {
      setError("Añade al menos un producto al pedido.");
      return;
    }
    setError("");
    const itemsLimpios = items.map((it) => ({ productoId: it.productoId, cantidad: Number(it.cantidad), costoUnitario: Number(it.costoUnitario) }));
    if (editingId) {
      actualizarPedido(editingId, { proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
    } else {
      const pedido = crearPedido({ proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
      setEnviarPedido(pedido);
    }
  }

  function textoPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const lineas = pedido.items.map((it, i) => {
      const p = productoPorId(it.productoId);
      const unidad = p ? p.unidad : "";
      return `${i + 1}. ${p ? p.nombre : "Producto eliminado"} — ${fmt(it.cantidad)} ${unidad} (a €${fmt(it.costoUnitario)}/${unidad})`;
    });
    const total = pedido.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
    const ivaTotal = pedido.items.reduce((a, it) => {
      const prod = productoPorId(it.productoId);
      return a + it.cantidad * it.costoUnitario * (ivaCompraDe(prod) / 100);
    }, 0);
    const separador = "———————————";
    return [
      `PEDIDO — ${prov ? prov.nombre : "Proveedor"}`,
      `Fecha del pedido: ${new Date(pedido.fecha).toLocaleDateString("es-ES")}`,
      `Entrega esperada: ${pedido.fechaEsperada ? new Date(pedido.fechaEsperada).toLocaleDateString("es-ES") : "por confirmar"}`,
      "",
      "Productos pedidos:",
      lineas.join("\n"),
      "",
      separador,
      `Base imponible: €${fmt(total)}`,
      `IVA: €${fmt(ivaTotal)}`,
      `TOTAL: €${fmt(total + ivaTotal)}`,
      separador,
      "",
      "Gracias.",
    ].join("\n");
  }

  function mailtoHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `mailto:${prov?.email || ""}?subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailAppHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `googlegmail:///co?to=${encodeURIComponent(prov?.email || "")}&subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailWebHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const params = new URLSearchParams({
      view: "cm", fs: "1",
      to: prov?.email || "",
      su: "Pedido - " + (prov?.nombre || ""),
      body: texto,
    });
    return `https://mail.google.com/mail/?${params.toString()}`;
  }

  const [compartirError, setCompartirError] = useState("");
  async function compartirPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    if (navigator.share) {
      try {
        await navigator.share({
          title: `Pedido - ${prov?.nombre || ""}`,
          text: texto,
        });
        setCompartirError("");
      } catch (e) {
        if (e && e.name !== "AbortError") setCompartirError("No se pudo abrir el menú de compartir.");
      }
    } else {
      setCompartirError("Tu navegador no permite compartir. Usa las otras opciones o copia el texto.");
    }
  }
  function whatsappHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const numero = (prov?.telefono || "").replace(/[^0-9]/g, "");
    return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
  }
  function llamarHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    // El "tel:" solo necesita quitar espacios y guiones, no el "+" del prefijo internacional.
    const numero = (prov?.telefono || "").replace(/[^0-9+]/g, "");
    return `tel:${numero}`;
  }

  const [correoPedido, setCorreoPedido] = useState(null);

  const estadoColor = { Pendiente: C.amber, Parcial: C.accent, Recibido: C.inkSoft };

  // Solo los productos de este proveedor, para no tener que buscar entre
  // todo el catálogo al hacer un pedido. Si el que buscas no aparece, es que
  // no tiene este proveedor asignado en su ficha — el enlace de abajo
  // permite ver todos por si acaso.
  const productosSeleccionables = (!proveedorId || verTodosProductos)
    ? productos
    : productos.filter((p) => p.proveedorId === proveedorId);

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { if (showForm) { resetForm(); } setShowForm((s) => !s); }}><Plus size={15} /> Nuevo pedido</Btn>}>
        Pedidos de compra
      </SectionTitle>

      {sugerenciasPedido.length > 0 && (() => {
        const porProveedor = {};
        sugerenciasPedido.forEach((p) => {
          if (!porProveedor[p.proveedorId]) porProveedor[p.proveedorId] = { nombre: p.proveedorNombre, items: [] };
          porProveedor[p.proveedorId].items.push(p);
        });
        return (
          <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
            <div className="text-[12.5px] font-semibold mb-2">Punto de pedido: se te va a agotar antes de que llegue</div>
            <div className="text-[11.5px] mb-3" style={{ color: C.inkSoft }}>
              Al ritmo de venta real de los últimos días, estos productos se agotarían antes de que llegara un
              pedido hecho hoy — según el plazo de entrega que tienes puesto en cada proveedor.
            </div>
            <div className="space-y-2">
              {Object.entries(porProveedor).map(([provId, { nombre, items }]) => (
                <div key={provId} className="rounded-lg p-2.5" style={{ background: C.surface }}>
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-[12.5px] font-medium">{nombre}</span>
                    <div className="flex gap-1.5">
                      {proveedorPorId(provId)?.telefono && (
                        <LinkBtn small href={`tel:${(proveedorPorId(provId).telefono || "").replace(/[^0-9+]/g, "")}`}><Phone size={13} /> Llamar</LinkBtn>
                      )}
                      <Btn small onClick={() => prepararPedidoDesdeSugerencias(provId, items)}>Preparar pedido</Btn>
                    </div>
                  </div>
                  {items.map((p) => (
                    <div key={p.id} className="flex items-center justify-between text-[11.5px]" style={{ color: C.inkSoft }}>
                      <span>{p.nombre}</span>
                      <span className="mono">
                        {Math.round(p.dias)} día(s) de stock · llega en {p.diasHastaEntrega}
                        {p.diasHastaEntrega !== p.leadTime ? ` (reparto fijo, no ${p.leadTime})` : ""}
                      </span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          </Card>
        );
      })()}

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando pedido pendiente" : "Nuevo pedido"}</div>
          <div>
            <div className="grid md:grid-cols-2 gap-x-4">
              <Field label="Proveedor">
                <select value={proveedorId} onChange={(e) => { setProveedorId(e.target.value); setVerTodosProductos(false); }} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                  <option value="">Selecciona un proveedor</option>
                  {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
              </Field>
              <Field label="Fecha esperada de entrega">
                <Input type="date" value={fechaEsperada} onChange={(e) => setFechaEsperada(e.target.value)} />
              </Field>
            </div>

            <div className="mb-2 flex items-center justify-between flex-wrap gap-1">
              <div className="text-[12px] font-medium" style={{ color: C.inkSoft }}>Productos del pedido</div>
              {proveedorId && (
                <button type="button" onClick={() => setVerTodosProductos((s) => !s)} className="text-[11.5px] font-medium" style={{ color: C.accent }}>
                  {verTodosProductos ? "Ver solo los de este proveedor" : "No lo encuentro, ver todos los productos"}
                </button>
              )}
            </div>
            {productosSeleccionables.length === 0 && proveedorId && !verTodosProductos && (
              <div className="text-[12px] mb-2 p-2 rounded-lg" style={{ background: C.amberSoft, color: C.ink }}>
                Ningún producto tiene este proveedor asignado todavía. Ponlo en la ficha de cada producto, o toca
                "ver todos los productos" arriba para elegir de todas formas.
              </div>
            )}
            {items.map((it, idx) => (
              <div key={idx}>
              <div className="flex gap-2 items-center mb-2">
                <select value={it.productoId} onChange={(e) => updateItem(idx, "productoId", e.target.value)} className="flex-1 rounded-lg px-2 py-2 text-[12.5px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                  <option value="">— Elige un producto —</option>
                  {productosSeleccionables.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                  <option value="__nuevo__">+ Es un producto nuevo, nunca ha entrado…</option>
                </select>
                <Input type="number" style={{ width: 80 }} value={it.cantidad} onChange={(e) => updateItem(idx, "cantidad", e.target.value)} placeholder="Cant." />
                <Input type="number" step="0.01" style={{ width: 100 }} value={it.costoUnitario} onChange={(e) => updateItem(idx, "costoUnitario", e.target.value)} placeholder="Costo u." />
                <button type="button" onClick={() => removeItem(idx)}><X size={16} color={C.inkSoft} /></button>
              </div>

              {creandoNuevoIdx === idx && (
                <Card className="mb-2" style={{ background: C.accentSoft, border: "none" }}>
                  <div className="text-[12px] font-medium mb-2">Nuevo producto — se dará de alta en el catálogo</div>
                  <div className="grid grid-cols-3 gap-2 mb-2">
                    <Input
                      value={nuevoProd.nombre}
                      onChange={(e) => setNuevoProd({ ...nuevoProd, nombre: e.target.value })}
                      placeholder="Nombre del producto"
                      style={{ gridColumn: "span 3" }}
                    />
                    <Input
                      value={nuevoProd.unidad}
                      onChange={(e) => setNuevoProd({ ...nuevoProd, unidad: e.target.value })}
                      placeholder="Unidad (kg, unidad…)"
                    />
                    <Input
                      type="number" step="0.01"
                      value={nuevoProd.costo}
                      onChange={(e) => setNuevoProd({ ...nuevoProd, costo: e.target.value })}
                      placeholder="Precio de compra"
                      style={{ gridColumn: "span 2" }}
                    />
                  </div>
                  <div className="flex gap-2">
                    <Btn small onClick={() => guardarProductoNuevo(idx)} disabled={!nuevoProd.nombre.trim()}>Crear y añadir al pedido</Btn>
                    <Btn small variant="ghost" onClick={() => { setCreandoNuevoIdx(null); updateItem(idx, "productoId", ""); }}>Cancelar</Btn>
                  </div>
                </Card>
              )}
              {(() => {
                const prod = productos.find((pr) => pr.id === it.productoId);
                const uds = udsPorCaja(prod);
                if (!prod || uds <= 1) return null;
                const cajas = Number(it.cantidad) / uds;
                const enteras = Number.isInteger(cajas);
                return (
                  <div className="text-[11px] mb-2 flex items-center gap-2 flex-wrap" style={{ color: enteras ? C.accent : C.amber }}>
                    <span>
                      {fmt(cajas)} caja(s) de {uds} {prod.unidad}
                      {!enteras && " — no es un número exacto de cajas"}
                    </span>
                    <button
                      type="button"
                      onClick={() => updateItem(idx, "cantidad", String(Math.ceil(cajas) * uds))}
                      className="underline"
                      style={{ color: C.accent }}
                    >
                      redondear a {Math.ceil(cajas)} caja(s) = {Math.ceil(cajas) * uds} {prod.unidad}
                    </button>
                  </div>
                );
              })()}
              </div>
            ))}
            <button type="button" onClick={addItemRow} className="text-[12.5px] font-medium mb-4" style={{ color: C.accent }}>+ Añadir producto al pedido</button>

            {error && <div className="text-[12px] mb-3" style={{ color: C.red }}>{error}</div>}
            <div className="flex gap-2">
              <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Crear pedido"}</Btn>
              <Btn variant="ghost" onClick={() => { setShowForm(false); resetForm(); }}>Cancelar</Btn>
            </div>
          </div>
        </Card>
      )}

      {pedidos.length === 0 ? <Empty text="No hay pedidos registrados todavía." /> : (
        <div className="space-y-2">
          {pedidos.map((pe) => {
            const prov = proveedorPorId(pe.proveedorId);
            const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
            const ivaPedido = pe.items.reduce((a, it) => {
              const prod = productoPorId(it.productoId);
              return a + it.cantidad * it.costoUnitario * (ivaCompraDe(prod) / 100);
            }, 0);
            return (
              <Card key={pe.id}>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="font-semibold">{prov ? prov.nombre : "Proveedor eliminado"}</div>
                    <div className="text-[12px]" style={{ color: C.inkSoft }}>
                      Pedido {pe.fecha} · Entrega esperada {pe.fechaEsperada || "—"}
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <Pill color={estadoColor[pe.estado]}>{pe.estado}</Pill>
                    <div className="text-right">
                      <div className="mono font-semibold">€{fmt(total + ivaPedido)}</div>
                      <div className="text-[10.5px] mono" style={{ color: C.inkSoft }}>
                        base €{fmt(total)} + IVA €{fmt(ivaPedido)}
                      </div>
                    </div>
                  </div>
                </div>
                <div className="mt-2 flex gap-2 flex-wrap">
                  <Btn small variant="ghost" onClick={() => { setCorreoPedido(pe); }}><Mail size={13} /> Enviar por correo</Btn>
                  <LinkBtn small href={whatsappHref(pe)}><MessageCircle size={13} /> Enviar por WhatsApp</LinkBtn>
                  {proveedorPorId(pe.proveedorId)?.telefono && (
                    <LinkBtn small href={llamarHref(pe)}><Phone size={13} /> Llamar</LinkBtn>
                  )}
                  {pe.estado === "Pendiente" && (
                    <>
                      <Btn small variant="ghost" onClick={() => openEdit(pe)}>Editar</Btn>
                      <Btn small variant="danger" onClick={() => setConfirmDeleteId(pe.id)}><Trash2 size={13} /> Eliminar</Btn>
                    </>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {confirmDeleteId && (
        <Modal onClose={() => setConfirmDeleteId(null)} title="Eliminar pedido">
          <div className="text-[12.5px] mb-4" style={{ color: C.ink }}>
            ¿Seguro que quieres eliminar este pedido? Esta acción no se puede deshacer.
          </div>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { eliminarPedido(confirmDeleteId); setConfirmDeleteId(null); }}>Sí, eliminar</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {correoPedido && (
        <Modal onClose={() => setCorreoPedido(null)} title="Enviar pedido por correo">
          <div className="text-[12.5px] mb-3" style={{ color: C.ink }}>
            Prueba los botones de Gmail. Si no se abren, más abajo tienes el correo listo para copiar y pegar.
          </div>
          <div className="flex flex-col gap-2 mb-4">
            <Btn onClick={() => compartirPedido(correoPedido)}><Mail size={14} /> Compartir con Gmail u otra app</Btn>
            <LinkBtn href={gmailWebHref(correoPedido)}><Mail size={14} /> Abrir en Gmail (navegador)</LinkBtn>
            <LinkBtn href={mailtoHref(correoPedido)} newTab={false}><Mail size={14} /> App de correo del sistema</LinkBtn>
          </div>
          {compartirError && <div className="text-[12px] mb-3" style={{ color: C.red }}>{compartirError}</div>}
          <div className="text-[11.5px] mb-2 pt-3" style={{ color: C.inkSoft, borderTop: `1px solid ${C.line}` }}>
            Si ninguno abre, toca cada campo (se selecciona solo) y cópialo:
          </div>
          <Field label="Destinatario">
            <Input readOnly value={proveedorPorId(correoPedido.proveedorId)?.email || ""} onFocus={(e) => e.target.select()} />
          </Field>
          <Field label="Asunto">
            <Input readOnly value={`Pedido - ${proveedorPorId(correoPedido.proveedorId)?.nombre || ""}`} onFocus={(e) => e.target.select()} />
          </Field>
          <Field label="Mensaje">
            <textarea
              readOnly
              value={textoPedido(correoPedido)}
              onFocus={(e) => e.target.select()}
              className="w-full rounded-lg p-2 text-[12px] mono"
              style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink, height: 160, resize: "none" }}
            />
          </Field>
          <Btn variant="ghost" onClick={() => setCorreoPedido(null)}>Cerrar</Btn>
        </Modal>
      )}

      {enviarPedido && (
        <Modal onClose={() => setEnviarPedido(null)} title="Pedido creado — ¿cómo quieres enviarlo?">
          <p className="text-[12.5px] mb-4" style={{ color: C.inkSoft }}>Puedes enviarlo ahora al proveedor o hacerlo más tarde desde la lista de pedidos.</p>
          <div className="flex gap-2 flex-wrap">
            <Btn onClick={() => { setCorreoPedido(enviarPedido); setEnviarPedido(null); }}><Mail size={14} /> Correo</Btn>
            <LinkBtn variant="primary" href={whatsappHref(enviarPedido)}><MessageCircle size={14} /> WhatsApp</LinkBtn>
            {proveedorPorId(enviarPedido.proveedorId)?.telefono && (
              <LinkBtn href={llamarHref(enviarPedido)}><Phone size={14} /> Llamar</LinkBtn>
            )}
            <Btn variant="ghost" onClick={() => setEnviarPedido(null)}>Ahora no</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

/* ================= RECEPCIÓN ================= */
function Recepcion({ pedidos, proveedorPorId, productoPorId, recibirPedido, almacenCongelado, recibirConAlbaran, cerrarPedido }) {
  const [activos, setActivos] = useState({});
  const [cerrando, setCerrando] = useState(null);
  const pendientes = pedidos.filter((p) => p.estado !== "Recibido");

  function setCant(pedidoId, productoId, val) {
    setActivos((s) => ({ ...s, [pedidoId]: { ...(s[pedidoId] || {}), [productoId]: val } }));
  }

  return (
    <div>
      <SectionTitle>Recepción de mercancía</SectionTitle>
      {almacenCongelado && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]">
            <AlertTriangle size={16} color={C.amber} style={{ marginTop: 2, flexShrink: 0 }} />
            <span><b>Almacén congelado por conteo en curso.</b> Las entradas y salidas están bloqueadas hasta que finalices el conteo en Inventario ciego.</span>
          </div>
        </Card>
      )}
      {pendientes.length === 0 ? <Empty text="No hay pedidos pendientes de recibir." /> : (
        <div className="space-y-3">
          {pendientes.map((pe) => {
            const prov = proveedorPorId(pe.proveedorId);
            return (
              <Card key={pe.id}>
                <div className="flex items-center justify-between mb-3">
                  <div className="font-semibold">{prov ? prov.nombre : "—"}</div>
                  <Pill color={C.amber}>{pe.estado}</Pill>
                </div>
                {pe.items.map((it) => {
                  const p = productoPorId(it.productoId);
                  const pendiente = it.cantidad - it.cantidadRecibida;
                  return (
                    <div key={it.productoId} className="flex items-center justify-between py-1.5 border-b last:border-0" style={{ borderColor: C.line }}>
                      <div>
                        <div>{p ? p.nombre : "—"}</div>
                        <div className="text-[11px] mono" style={{ color: C.inkSoft }}>Pedido: {it.cantidad} · Recibido: {it.cantidadRecibida} · Pendiente: {pendiente}</div>
                      </div>
                      <Input
                        type="number"
                        style={{ width: 90 }}
                        placeholder="Cant. hoy"
                        value={(activos[pe.id] || {})[it.productoId] || ""}
                        onChange={(e) => setCant(pe.id, it.productoId, e.target.value)}
                        disabled={pendiente <= 0}
                      />
                    </div>
                  );
                })}
                <div className="mt-3 flex flex-wrap gap-2">
                  {!almacenCongelado && (
                    <>
                      <Btn onClick={() => recibirConAlbaran(pe)}>
                        <FileText size={14} /> Recibir con albarán
                      </Btn>
                      <Btn variant="ghost" onClick={() => { recibirPedido(pe.id, activos[pe.id] || {}); setActivos((s) => ({ ...s, [pe.id]: {} })); }}>
                        <CheckCircle2 size={14} /> Solo anotar cantidades
                      </Btn>
                    </>
                  )}
                  {cerrarPedido && (
                    <Btn variant="ghost" onClick={() => setCerrando(pe)}>
                      Cerrar pedido
                    </Btn>
                  )}
                </div>
                <div className="text-[11px] mt-2" style={{ color: C.inkSoft }}>
                  Con albarán registras además precios, descuentos, lotes y caducidades, y el pedido se cierra solo.
                  La otra opción solo suma stock, sin dejar rastro del papel.
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {cerrando && (() => {
        const faltan = cerrando.items
          .map((it) => ({ ...it, producto: productoPorId(it.productoId), pendiente: (Number(it.cantidad) || 0) - (Number(it.cantidadRecibida) || 0) }))
          .filter((it) => it.pendiente > 0);
        return (
          <Modal onClose={() => setCerrando(null)} title="¿Dar el pedido por cerrado?">
            {faltan.length === 0 ? (
              <div className="text-[12.5px] mb-3">Ha llegado todo lo pedido. Se marcará como recibido.</div>
            ) : (
              <>
                <div className="text-[12.5px] mb-2">Todavía falta por llegar:</div>
                <div className="space-y-1 mb-3">
                  {faltan.map((it) => (
                    <div key={it.productoId} className="flex items-center justify-between text-[12px]">
                      <span>{it.producto ? it.producto.nombre : "—"}</span>
                      <span className="mono" style={{ color: C.amber }}>faltan {fmt(it.pendiente)}</span>
                    </div>
                  ))}
                </div>
                <div className="text-[12px] mb-3" style={{ color: C.inkSoft }}>
                  Ciérralo si el proveedor ya no va a servir el resto. <b>No suma nada al stock</b> — solo saca el
                  pedido de esta lista para que deje de aparecer como pendiente.
                </div>
              </>
            )}
            <div className="flex gap-2">
              <Btn onClick={() => { cerrarPedido(cerrando.id); setCerrando(null); }}>Sí, cerrar</Btn>
              <Btn variant="ghost" onClick={() => setCerrando(null)}>Cancelar</Btn>
            </div>
          </Modal>
        );
      })()}
    </div>
  );
}

/* ================= INVENTARIO CIEGO ================= */
// Texto plano de la hoja de conteo, para enviar por WhatsApp
function textoHojaConteo(productos, proveedores = []) {
  const fecha = new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
  const grupos = agruparPorProveedor(productos, proveedores);
  let n = 0;
  const bloques = grupos.map((g) => {
    const lineas = g.items.map((p) => {
      n += 1;
      return `${n}. ${p.nombre} (${p.unidad})\n   Conteo: _____________`;
    });
    return `--- ${g.nombre.toUpperCase()} ---\n\n${lineas.join("\n\n")}`;
  });
  return `HOJA DE CONTEO DE INVENTARIO\nFecha: ${fecha}\n\n${bloques.join("\n\n")}\n\nContado por: ____________________`;
}

function InventarioCiego({ productos, proveedores, conteos, iniciarConteo, actualizarConteoItem, actualizarResponsable, finalizarConteo, aplicarAjustes, productoPorId, crearProductoEnConteo, clasificacionABC, almacenCongelado }) {
  const [activoId, setActivoId] = useState(null);
  const activo = conteos.find((c) => c.id === activoId);
  const [showNuevo, setShowNuevo] = useState(false);
  const blankNuevo = { codigo: "", nombre: "", categoria: "", unidad: "unidad", costo: "", precioVenta: "", stockMinimo: "", ubicacion: "", proveedorId: "", cantidadContada: "" };
  const [nuevo, setNuevo] = useState(blankNuevo);
  const [errorNuevo, setErrorNuevo] = useState("");
  const [motivos, setMotivos] = useState({});
  const [verHoja, setVerHoja] = useState(false);
  const [verHojaCompletada, setVerHojaCompletada] = useState(false);

  const MOTIVOS = ["Rotura", "Merma / caducidad", "Robo o pérdida", "Error de captura", "Devolución no registrada", "Otro"];

  function submitNuevo() {
    if (!nuevo.nombre.trim()) {
      setErrorNuevo("Escribe el nombre del producto.");
      return;
    }
    if (nuevo.cantidadContada === "" || isNaN(Number(nuevo.cantidadContada))) {
      setErrorNuevo("Escribe la cantidad que contaste.");
      return;
    }
    setErrorNuevo("");
    const { cantidadContada, ...datosProducto } = nuevo;
    crearProductoEnConteo(activo.id, datosProducto, cantidadContada);
    setNuevo(blankNuevo);
    setShowNuevo(false);
  }

  // Diferencias valoradas del conteo activo, ordenadas por impacto económico.
  // Si el conteo es del piso de venta, se compara contra lo que había ahí,
  // no contra el total de la empresa.
  const esPisoVenta = activo?.ambito === "piso_venta";
  const esAlmacen = activo?.ambito === "almacen";
  function referenciaSistema(p) {
    if (esPisoVenta) return Number(p.stockPisoVenta) || 0;
    if (esAlmacen) return Math.max(0, (Number(p.stock) || 0) - (Number(p.stockPisoVenta) || 0));
    return Number(p.stock) || 0;
  }
  const diferencias = !activo ? [] : activo.items
    .map((it) => {
      const p = productoPorId(it.productoId);
      if (!p) return null;
      const cf = valorCF(it);
      if (cf === null) return null;
      const referencia = referenciaSistema(p);
      const dif = cf - referencia;
      const impacto = dif * (Number(p.costo) || 0);
      return { producto: p, item: it, cf, dif, impacto };
    })
    .filter(Boolean)
    .sort((a, b) => Math.abs(b.impacto) - Math.abs(a.impacto));

  const impactoTotal = diferencias.reduce((a, d) => a + d.impacto, 0);
  const conDescuadre = diferencias.filter((d) => d.dif !== 0);

  const abcColor = { A: C.red, B: C.amber, C: C.inkSoft };

  // Hoja de conteo ya completada, con lo que se contó de verdad — mismo
  // formato que la hoja en blanco de antes de contar, pero rellena.
  function textoHojaConteoCompletada() {
    const fecha = activo.fecha;
    const grupos = agruparPorProveedor(diferencias.map((d) => d.producto), proveedores);
    const cfPorProducto = {};
    diferencias.forEach((d) => { cfPorProducto[d.producto.id] = d.cf; });
    let n = 0;
    const bloques = grupos.map((g) => {
      const lineas = g.items.map((p) => {
        n += 1;
        return `${n}. ${p.nombre} (${p.unidad}): ${fmt(cfPorProducto[p.id])}`;
      });
      return `--- ${g.nombre.toUpperCase()} ---\n${lineas.join("\n")}`;
    });
    const contadoPor = activo.responsables && activo.responsables.contadoPor ? activo.responsables.contadoPor : "—";
    return `HOJA DE CONTEO — YA CONTADO\nFecha: ${fecha}\nContado por: ${contadoPor}\n\n${bloques.join("\n\n")}`;
  }

  // Texto plano del resultado ya terminado, para enviar por WhatsApp — solo
  // lo que tiene descuadre, que es lo que de verdad hace falta comentar.
  function textoResultadoConteo() {
    const ambito = esPisoVenta ? "Piso de venta" : esAlmacen ? "Almacén (trastienda)" : "Todo (empresa completa)";
    const lineas = diferencias
      .filter((d) => d.dif !== 0)
      .map((d) => {
        const motivo = motivos[d.producto.id] ? ` · ${motivos[d.producto.id]}` : "";
        return `${d.producto.nombre}: sistema ${fmt(referenciaSistema(d.producto))}, contado ${d.cf} (${d.dif > 0 ? "+" : ""}${d.dif}) · €${fmt(Math.abs(d.impacto))}${motivo}`;
      });
    const cuerpo = lineas.length > 0 ? lineas.join("\n") : "Sin descuadres — todo cuadraba.";
    return `RESULTADO DE INVENTARIO — ${activo.fecha}\n${ambito}\n\nDescuadrados: ${conDescuadre.length}\nImpacto neto: ${impactoTotal >= 0 ? "+" : "−"}€${fmt(Math.abs(impactoTotal))}\n\n${cuerpo}`;
  }

  return (
    <div>
      <SectionTitle
        action={
          <div className="flex gap-2">
            <Btn variant="ghost" onClick={() => setVerHoja(true)}><ClipboardList size={15} /> Hoja para contar</Btn>
            {!activo && <Btn onClick={() => setActivoId(iniciarConteo("total"))}><Plus size={15} /> Contar todo (empresa completa)</Btn>}
            {!activo && <Btn variant="ghost" onClick={() => setActivoId(iniciarConteo("piso_venta"))}><Plus size={15} /> Contar solo el piso de venta</Btn>}
            {!activo && <Btn variant="ghost" onClick={() => setActivoId(iniciarConteo("almacen"))}><Plus size={15} /> Contar solo el almacén (trastienda)</Btn>}
          </div>
        }
      >
        Inventario ciego
      </SectionTitle>

      {almacenCongelado && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]">
            <AlertTriangle size={16} color={C.amber} style={{ marginTop: 2, flexShrink: 0 }} />
            <span>
              <b>Almacén congelado.</b> Mientras haya un conteo abierto no se pueden registrar entradas ni salidas, para que el descuadre no salga falseado. Finaliza el conteo para desbloquearlo.
            </span>
          </div>
        </Card>
      )}

      {!activo && (
        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]" style={{ color: C.ink }}>
            <EyeOff size={16} style={{ marginTop: 2, flexShrink: 0 }} />
            <span>
              Durante el conteo no se muestra la existencia del sistema: cuentas físicamente y anotas la cantidad. Al finalizar verás las diferencias contra el stock registrado, valoradas en euros.
            </span>
          </div>
        </Card>
      )}

      {activo && !activo.completado && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3 flex items-center gap-1.5">
            <Eye size={15} /> Captura de conteos
            <Pill color={esPisoVenta || esAlmacen ? C.amber : C.inkSoft}>
              {esPisoVenta ? "Solo piso de venta" : esAlmacen ? "Solo almacén (trastienda)" : "Todo (empresa completa)"}
            </Pill>
          </div>

          <div className="grid grid-cols-2 gap-x-3 mb-4">
            <Field label="Contado por"><Input value={(activo.responsables || {}).contadoPor || ""} onChange={(e) => actualizarResponsable(activo.id, "contadoPor", e.target.value)} placeholder="Nombre" /></Field>
            <Field label="Revisado por (opcional)"><Input value={(activo.responsables || {}).revisor || ""} onChange={(e) => actualizarResponsable(activo.id, "revisor", e.target.value)} placeholder="Responsable" /></Field>
          </div>

          <div style={{ overflowX: "auto" }}>
            <table className="w-full text-[12px]" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff", width: 30 }}>Nº</th>
                  <th className="py-2 px-2 text-left" style={{ background: C.chrome, color: "#fff" }}>Descripción del producto</th>
                  <th className="py-2 px-2 text-center" style={{ background: C.chrome, color: "#fff", width: 58 }}>U/M</th>
                  <th className="py-2 px-2 text-center" style={{ background: C.chrome, color: "#fff", width: 96 }}>Conteo</th>
                </tr>
              </thead>
              <tbody>
                {(() => {
                  // Mismo orden que la hoja impresa: por proveedor
                  const enConteo = activo.items.map((it) => ({ it, p: productoPorId(it.productoId) })).filter((x) => x.p);
                  const grupos = agruparPorProveedor(enConteo.map((x) => x.p), proveedores);
                  const porId = new Map(enConteo.map((x) => [x.p.id, x.it]));
                  let n = 0;
                  return grupos.map((g) => (
                    <React.Fragment key={g.id}>
                      <tr>
                        <td colSpan={4} className="py-1.5 px-2 font-semibold text-[11.5px]" style={{ background: C.accentSoft, border: `1px solid ${C.line}` }}>
                          {g.nombre}
                        </td>
                      </tr>
                      {g.items.map((p) => {
                        const it = porId.get(p.id);
                        if (!it) return null;
                        n += 1;
                        const idx = n;
                        const abc = p.tipo === "utillaje" ? "—" : (clasificacionABC[p.id] || "C");
                        const sinContar = (it.conteo ?? valorCF(it) ?? "") === "";
                        return (
                    <tr key={it.productoId} style={{ background: idx % 2 ? C.bg : C.surface }}>
                      <td className="py-2 px-2 mono" style={{ border: `1px solid ${C.line}` }}>{idx + 1}</td>
                      <td className="py-2 px-2" style={{ border: `1px solid ${C.line}` }}>
                        <div className="flex items-center gap-1.5">
                          <span>{p.nombre}</span>
                          <Pill color={abcColor[abc] || C.inkSoft}>{abc}</Pill>
                        </div>
                        {p.codigo && <div className="mono text-[10.5px]" style={{ color: C.inkSoft }}>{p.codigo}</div>}
                      </td>
                      <td className="py-2 px-2 text-center" style={{ border: `1px solid ${C.line}` }}>{p.unidad}</td>
                      <td className="p-1" style={{ border: `1px solid ${C.line}` }}>
                        <input
                          type="number"
                          inputMode="decimal"
                          value={it.conteo ?? valorCF(it) ?? ""}
                          onChange={(e) => actualizarConteoItem(activo.id, it.productoId, "conteo", e.target.value)}
                          className="w-full rounded px-2 py-1.5 text-[13px] text-center outline-none mono"
                          style={{
                            border: `1px solid ${sinContar ? C.line : C.accent}`,
                            background: sinContar ? C.surface : C.accentSoft,
                            fontWeight: 600,
                          }}
                        />
                      </td>
                    </tr>
                        );
                      })}
                    </React.Fragment>
                  ));
                })()}
              </tbody>
            </table>
          </div>
          <div className="text-[11.5px] mt-2" style={{ color: C.inkSoft }}>
            Las casillas en verde ya tienen conteo capturado. Las que quedan en blanco están pendientes.
            El orden es el mismo que el de la hoja impresa, agrupado por proveedor.
          </div>

          <div className="mt-4 flex gap-2 items-center flex-wrap">
            <Btn onClick={() => finalizarConteo(activo.id)}>Finalizar conteo</Btn>
            <Btn variant="ghost" onClick={() => setShowNuevo((s) => !s)}><Plus size={14} /> Encontré un producto que no está en el sistema</Btn>
          </div>

          {showNuevo && (
            <div className="mt-4 pt-4" style={{ borderTop: `1px solid ${C.line}` }}>
              <div className="text-[12.5px] font-medium mb-3" style={{ color: C.inkSoft }}>
                Da de alta el producto encontrado y captura la cantidad contada. Se añadirá al catálogo y a este conteo.
              </div>
              <div className="grid md:grid-cols-3 gap-x-4">
                <Field label="Nombre"><Input value={nuevo.nombre} onChange={(e) => setNuevo({ ...nuevo, nombre: e.target.value })} /></Field>
                <Field label="Código / SKU (opcional)"><Input value={nuevo.codigo} onChange={(e) => setNuevo({ ...nuevo, codigo: e.target.value })} /></Field>
                <Field label="Categoría"><Input value={nuevo.categoria} onChange={(e) => setNuevo({ ...nuevo, categoria: e.target.value })} /></Field>
                <Field label="Unidad de medida"><Input value={nuevo.unidad} onChange={(e) => setNuevo({ ...nuevo, unidad: e.target.value })} placeholder="unidad, kg, caja…" /></Field>
                <Field label="Costo de compra (€)"><Input type="number" step="0.01" value={nuevo.costo} onChange={(e) => setNuevo({ ...nuevo, costo: e.target.value })} /></Field>
                <Field label="Precio de venta (€)"><Input type="number" step="0.01" value={nuevo.precioVenta} onChange={(e) => setNuevo({ ...nuevo, precioVenta: e.target.value })} /></Field>
                <Field label="Stock mínimo (reorden)"><Input type="number" value={nuevo.stockMinimo} onChange={(e) => setNuevo({ ...nuevo, stockMinimo: e.target.value })} /></Field>
                <Field label="Ubicación en almacén (opcional)"><Input value={nuevo.ubicacion} onChange={(e) => setNuevo({ ...nuevo, ubicacion: e.target.value })} /></Field>
                <Field label="Proveedor principal (opcional)">
                  <select value={nuevo.proveedorId} onChange={(e) => setNuevo({ ...nuevo, proveedorId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                    <option value="">Sin asignar</option>
                    {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                  </select>
                </Field>
                <Field label="Cantidad contada físicamente">
                  <Input type="number" value={nuevo.cantidadContada} onChange={(e) => setNuevo({ ...nuevo, cantidadContada: e.target.value })} />
                </Field>
              </div>
              {errorNuevo && <div className="text-[12px] mb-2" style={{ color: C.red }}>{errorNuevo}</div>}
              <div className="flex gap-2 mt-1">
                <Btn onClick={submitNuevo}>Añadir al conteo</Btn>
                <Btn variant="ghost" onClick={() => { setShowNuevo(false); setErrorNuevo(""); }}>Cancelar</Btn>
              </div>
            </div>
          )}
        </Card>
      )}

function fichaVacia() {

    nombre: "",
    seccion: "Otros",

    rendimiento: 1,
    componentes: [],
    empaque: "",
    manoObra: "",
    otros: "",
    gastosGenerales: "",
    precioVenta: "",
    margenObjetivo: 70,

}

function FichasCosto({ fichasCosto, productos, addFichaCosto, updateFichaCosto, deleteFichaCosto, updateProducto, addProducto, ordenesProduccion = [] }) {
  const [showForm, setShowForm] = useState(false);
  const [filtroSeccion, setFiltroSeccion] = useState("todas");
  const [form, setForm] = useState(fichaVacia());
  const [error, setError] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [avisoCreado, setAvisoCreado] = useState("");

  function addComponente() {
    setForm((f) => ({
      ...f,
      componentes: [...f.componentes, { productoId: "", nombre: "", unidad: "unidad", cantidad: 1, costoUnitario: 0, unidadEntrada: "nativa" }],
    }));
  }
  function updateComponente(idx, campo, valor) {
    setForm((f) => ({
      ...f,
      componentes: f.componentes.map((c, i) => {
        if (i !== idx) return c;
        if (campo === "productoId") {
          const p = productos.find((pr) => pr.id === valor);
          if (p) return { ...c, productoId: valor, nombre: p.nombre, unidad: p.unidad, costoUnitario: p.costo, unidadEntrada: "nativa" };
          return { ...c, productoId: "" };
        }
        return { ...c, [campo]: valor };
      }),
    }));
  }
  function removeComponente(idx) {
    setForm((f) => ({ ...f, componentes: f.componentes.filter((_, i) => i !== idx) }));
  }

  // Si el ingrediente está enlazado a un producto del catálogo, su costo se lee
  // en vivo desde ahí. Si es un ingrediente libre, se usa el costo escrito a mano.
  function costoDe(c) {
    if (c.productoId) {
      const p = productos.find((pr) => pr.id === c.productoId);
      if (p) return Number(p.costo) || 0;
    }
    return Number(c.costoUnitario) || 0;
  }
  function estaEnlazado(c) {
    return !!(c.productoId && productos.some((pr) => pr.id === c.productoId));
  }
  function productoDe(c) {
    return c.productoId ? productos.find((pr) => pr.id === c.productoId) : null;
  }
  // "cantidad" del componente vive SIEMPRE en la unidad nativa del producto
  // (la que se usa para el stock) — es lo que espera el resto del programa
  // (Producción, el cálculo de coste...). Lo que cambia aquí es solo cómo se
  // muestra y se teclea: si el producto tiene guardado "cuánto trae cada
  // bulto", se puede escribir directamente en esa otra unidad (ej. gramos),
  // y se convierte a la nativa por dentro, sin que el resto del programa note
  // la diferencia.
  function tieneConversion(c) {
    const p = productoDe(c);
    return !!(p && Number(p.contenido) > 0 && p.unidadContenido);
  }
  function cantidadMostrada(c) {
    const p = productoDe(c);
    if (c.unidadEntrada === "contenido" && p) return (Number(c.cantidad) || 0) * Number(p.contenido);
    return c.cantidad;
  }
  function handleCantidadInput(idx, valorTecleado, c) {
    const p = productoDe(c);
    if (c.unidadEntrada === "contenido" && p && Number(p.contenido) > 0) {
      const enNativa = valorTecleado === "" ? "" : Number(valorTecleado) / Number(p.contenido);
      updateComponente(idx, "cantidad", enNativa);
    } else {
      updateComponente(idx, "cantidad", valorTecleado);
    }
  }

  // La ficha puede tener guardado un enlace a un producto que ya se borró.
  // Sin detectarlo, el desplegable se ve en blanco como si estuviera bien y
  // al producir fallaba sin que se entendiera por qué.
  const enlaceRoto = !!form.productoVinculadoId && !productos.some((p) => p.id === form.productoVinculadoId);

  const costoComponentes = form.componentes.reduce((a, c) => a + (Number(c.cantidad) || 0) * costoDe(c), 0);
  const costoAdicionales = (Number(form.empaque) || 0) + (Number(form.manoObra) || 0) + (Number(form.otros) || 0) + (Number(form.gastosGenerales) || 0);
  const costoTotal = costoComponentes + costoAdicionales;
  const rendimiento = Number(form.rendimiento) || 1;
  const costoPorUnidad = costoTotal / rendimiento;
  // --- Cálculo de precio de venta (escandallo) ---
  const margenObjetivo = Math.min(95, Math.max(0, Number(form.margenObjetivo) || 0));
  const ivaPct = Number(form.iva) || 0;
  // Precio neto que deja el margen objetivo sobre la venta
  const netoSugerido = margenObjetivo < 100 ? costoPorUnidad / (1 - margenObjetivo / 100) : 0;
  const pvpBruto = netoSugerido * (1 + ivaPct / 100);
  // Redondeo comercial al múltiplo de 0,10 más cercano hacia arriba
  const pvpSugerido = form.redondear ? Math.ceil(pvpBruto * 10) / 10 : pvpBruto;

  // El usuario puede fijar a mano el precio de carta (CON IVA); si no, se usa el sugerido
  const pvpFinal = Number(form.precioVenta) || pvpSugerido;
  const netoFinal = ivaPct > 0 ? pvpFinal / (1 + ivaPct / 100) : pvpFinal;
  const precioVentaNum = netoFinal;
  const margen = netoFinal > 0 ? ((netoFinal - costoPorUnidad) / netoFinal) * 100 : null;

  function resetFicha() {
    setForm(fichaVacia());
    setEditingId(null);
    setError("");
    setAvisoCreado("");
  }

  function openEdit(f) {
    setEditingId(f.id);
    setForm({
      nombre: f.nombre || "",
      seccion: f.seccion || "Otros",
      productoVinculadoId: f.productoVinculadoId || "",
      rendimiento: f.rendimiento || 1,
      componentes: (f.componentes || []).map((c) => ({ ...c })),
      empaque: f.empaque ?? "",
      manoObra: f.manoObra ?? "",
      otros: f.otros ?? "",
      gastosGenerales: f.gastosGenerales ?? "",
      precioVenta: f.precioVenta ?? "",
      margenObjetivo: f.margenObjetivo ?? 70,
      iva: f.iva ?? 10,
      redondear: f.redondear ?? true,
      alergenosExtra: f.alergenosExtra || [],
      elaboracion: f.elaboracion || "",
      tiempoElaboracion: f.tiempoElaboracion || "",
      conservacion: f.conservacion || "",
    });
    setError("");
    setShowForm(true);
  }

  function crearProductoDeVenta() {
    if (!form.nombre.trim()) {
      setError("Escribe primero el nombre de la receta.");
      return;
    }
    const nuevo = {
      codigo: "",
      nombre: form.nombre.trim(),
      categoria: "Elaborados / venta",
      tipo: "elaborado",
      unidad: "unidad",
      costo: Number(costoPorUnidad.toFixed(4)),
      precioVenta: Number(pvpFinal.toFixed(2)),
      ivaVenta: ivaPct,
      stock: 0,
      stockMinimo: 0,
      ubicacion: "",
      proveedorId: "",
      esElaborado: true,
    };
    const creado = addProducto(nuevo);
    // Se enlaza sola con la ficha: antes había que subir y elegirla a mano,
    // y era muy fácil olvidarlo — la ficha quedaba sin producto y al producir
    // fallaba sin que se entendiera por qué.
    if (creado && creado.id) {
      setForm((f) => ({ ...f, productoVinculadoId: creado.id }));
    }
    setError("");
    setAvisoCreado(form.nombre.trim());
  }

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del producto o receta.");
      return;
    }
    if (form.componentes.length === 0) {
      setError("Añade al menos un ingrediente o insumo.");
      return;
    }
    setError("");
    const datos = { ...form, rendimiento, precioCalculado: netoFinal, pvpConIva: pvpFinal };
    if (editingId) {
      updateFichaCosto(editingId, datos);
    } else {
      addFichaCosto(datos);
    }
    // Aplicar el precio calculado al producto del catálogo vinculado
    if (form.productoVinculadoId && pvpFinal > 0) {
      updateProducto(form.productoVinculadoId, {
        precioVenta: Number(pvpFinal.toFixed(2)),
        ivaVenta: ivaPct,
        costo: Number(costoPorUnidad.toFixed(4)),
      });
    }
    resetFicha();
    setShowForm(false);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { if (showForm) resetFicha(); setShowForm((s) => !s); }}><Plus size={15} /> Nueva ficha de costo</Btn>}>
        Fichas de costo
      </SectionTitle>

      {!showForm && (
        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="text-[12.5px]" style={{ color: C.ink }}>
            Una ficha de costo desglosa todos los ingredientes o insumos de un producto que vendes, para saber exactamente cuánto cuesta producirlo y qué margen real deja frente a tu precio de venta.
          </div>
        </Card>
      )}

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando ficha de costo" : "Nueva ficha de costo"}</div>
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre del producto / receta">
              <Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Ej. Caja de bombones x12" />
            </Field>
            <Field label="Sección de la carta">
              <select value={form.seccion} onChange={(e) => setForm({ ...form, seccion: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink }}>
                {SECCIONES_FICHAS.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
            </Field>
            <Field label="¿A qué producto del catálogo corresponde?">
              <select value={enlaceRoto ? "" : form.productoVinculadoId} onChange={(e) => setForm({ ...form, productoVinculadoId: e.target.value })} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${form.productoVinculadoId && !enlaceRoto ? C.line : C.amber}`, background: C.surface, color: C.ink }}>
                <option value="">{enlaceRoto ? "El producto enlazado ya no existe — elige otro" : "Sin vincular — no se podrá producir"}</option>
                {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
              </select>
            </Field>
            <Field label="Rendimiento (unidades que produce esta receta)">
              <Input type="number" value={form.rendimiento} onChange={(e) => setForm({ ...form, rendimiento: e.target.value })} placeholder="1" />
            </Field>
          </div>

          {enlaceRoto && (
            <Card className="mb-3" style={{ background: C.amberSoft, border: "none" }}>
              <div className="text-[12.5px]">
                <b>Esta ficha apunta a un producto que ya no existe.</b> Puede que se borrara. Elige otro producto
                en el desplegable de arriba, o usa el botón <b>"Crear producto de venta"</b> para generar uno nuevo
                a partir de esta receta. Mientras tanto no se puede producir.
              </div>
            </Card>
          )}

          <div className="mb-2 text-[12px] font-medium" style={{ color: C.inkSoft }}>Ingredientes / insumos</div>
          {form.componentes.map((c, idx) => {
            const enlazado = estaEnlazado(c);
            return (
              <Card key={idx} className="mb-3" style={{ background: C.bg }}>
                <div className="flex items-center justify-between mb-2">
                  <span className="text-[12px] font-semibold">Ingrediente {idx + 1}</span>
                  <div className="flex items-center gap-2">
                    {enlazado && <Pill color={C.accent}>enlazado al catálogo</Pill>}
                    <button type="button" onClick={() => removeComponente(idx)}><X size={16} color={C.inkSoft} /></button>
                  </div>
                </div>

                <Field label="Elegir del catálogo (recomendado)">
                  <select
                    value={c.productoId}
                    onChange={(e) => updateComponente(idx, "productoId", e.target.value)}
                    className="w-full rounded-lg px-3 py-2 text-[13px]"
                    style={{ border: `1px solid ${C.line}`, background: C.surface }}
                  >
                    <option value="">— Escribirlo a mano —</option>
                    {productos.filter((p) => p.tipo !== "utillaje").map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                  </select>
                </Field>
                <div className="text-[10.5px] mb-2" style={{ color: C.inkSoft }}>
                  El utillaje (jarras, bandejas…) no aparece aquí: no se consume por unidad vendida.
                </div>

                {!enlazado && (
                  <Field label="Nombre del ingrediente">
                    <Input value={c.nombre} onChange={(e) => updateComponente(idx, "nombre", e.target.value)} placeholder="Ej. cacao en polvo" />
                  </Field>
                )}

                <div className="grid grid-cols-3 gap-x-2">
                  <Field label="Unidad">
                    <Input
                      value={tieneConversion(c) && c.unidadEntrada === "contenido" ? productoDe(c).unidadContenido : c.unidad}
                      onChange={(e) => updateComponente(idx, "unidad", e.target.value)}
                      readOnly={enlazado}
                      style={enlazado ? { background: C.accentSoft } : {}}
                    />
                  </Field>
                  <Field label="Cantidad">
                    <Input type="number" step="0.001" value={cantidadMostrada(c)} onChange={(e) => handleCantidadInput(idx, e.target.value, c)} />
                  </Field>
                  <Field label="Costo unidad">
                    <Input
                      type="number"
                      step="0.01"
                      value={enlazado ? costoDe(c) : c.costoUnitario}
                      onChange={(e) => updateComponente(idx, "costoUnitario", e.target.value)}
                      readOnly={enlazado}
                      style={enlazado ? { background: C.accentSoft, color: C.inkSoft } : {}}
                    />
                  </Field>
                </div>

                {tieneConversion(c) && (
                  <button
                    type="button"
                    onClick={() => updateComponente(idx, "unidadEntrada", c.unidadEntrada === "contenido" ? "nativa" : "contenido")}
                    className="text-[11px] font-medium mt-1.5"
                    style={{ color: C.accent }}
                  >
                    {c.unidadEntrada === "contenido"
                      ? `Poner en ${c.unidad} en vez de ${productoDe(c).unidadContenido}`
                      : `Poner en ${productoDe(c).unidadContenido} en vez de ${c.unidad} (cada ${c.unidad} trae ${productoDe(c).contenido} ${productoDe(c).unidadContenido})`}
                  </button>
                )}

                <div className="flex items-center justify-between pt-2" style={{ borderTop: `1px solid ${C.line}` }}>
                  <span className="text-[12px]" style={{ color: C.inkSoft }}>Subtotal de este ingrediente</span>
                  <span className="mono font-semibold text-[13px]">€{fmt((Number(c.cantidad) || 0) * costoDe(c))}</span>
                </div>
              </Card>
            );
          })}
          <button type="button" onClick={addComponente} className="text-[12.5px] font-medium mb-2" style={{ color: C.accent }}>+ Añadir ingrediente / insumo</button>
          <div className="text-[11.5px] mb-4" style={{ color: C.inkSoft }}>
            Si eliges el ingrediente del catálogo, su costo se toma automáticamente y se actualiza solo cuando cambies el precio en Productos.
          </div>

          <div className="grid md:grid-cols-4 gap-x-4">
            <Field label="Empaque (€, opcional)"><Input type="number" step="0.01" value={form.empaque} onChange={(e) => setForm({ ...form, empaque: e.target.value })} /></Field>
            <Field label="Mano de obra (€, opcional)"><Input type="number" step="0.01" value={form.manoObra} onChange={(e) => setForm({ ...form, manoObra: e.target.value })} /></Field>
            <Field label="Otros costos (€, opcional)"><Input type="number" step="0.01" value={form.otros} onChange={(e) => setForm({ ...form, otros: e.target.value })} /></Field>
            <Field label="Gastos generales de esta producción (€, opcional)">
              <Input type="number" step="0.01" value={form.gastosGenerales} onChange={(e) => setForm({ ...form, gastosGenerales: e.target.value })} placeholder="Parte de luz, horno…" />
            </Field>
          </div>
          <div className="text-[12px] font-semibold mb-2 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>Alérgenos</div>
          <div className="rounded-lg p-3 mb-3" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
            {(() => {
              const heredados = new Set();
              (form.componentes || []).forEach((c) => {
                if (!c.productoId) return;
                const p = productos.find((x) => x.id === c.productoId);
                (p?.alergenos || []).forEach((a) => heredados.add(a));
              });
              const lista = [...heredados];
              return (
                <>
                  <div className="text-[11.5px] mb-2" style={{ color: C.inkSoft }}>
                    Heredados de los ingredientes del catálogo:
                  </div>
                  {lista.length === 0 ? (
                    <div className="text-[12px] mb-3" style={{ color: C.inkSoft }}>
                      Ninguno. Si algún ingrediente lleva alérgenos, márcalos en su ficha de producto y aparecerán aquí solos.
                    </div>
                  ) : (
                    <div className="flex flex-wrap gap-1.5 mb-3">
                      {lista.map((id) => {
                        const a = alergenoPorId(id);
                        return a ? (
                          <span key={id} className="text-[11.5px] px-2 py-1 rounded-lg" style={{ background: C.amberSoft, border: `1px solid ${C.amber}` }}>
                            {a.icono} {a.nombre}
                          </span>
                        ) : null;
                      })}
                    </div>
                  )}
                  <div className="text-[11.5px] mb-2 pt-2" style={{ color: C.inkSoft, borderTop: `1px solid ${C.line}` }}>
                    Añadir a mano (ingredientes libres, trazas del obrador…):
                  </div>
                  <SelectorAlergenos
                    seleccionados={form.alergenosExtra || []}
                    onCambio={(l) => setForm({ ...form, alergenosExtra: l })}
                  />
                </>
              );
            })()}
          </div>

          <div className="text-[12px] font-semibold mb-2 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>Ficha técnica de elaboración (opcional)</div>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Tiempo de elaboración"><Input value={form.tiempoElaboracion} onChange={(e) => setForm({ ...form, tiempoElaboracion: e.target.value })} placeholder="20 min" /></Field>
            <Field label="Conservación"><Input value={form.conservacion} onChange={(e) => setForm({ ...form, conservacion: e.target.value })} placeholder="Refrigerado 2 días" /></Field>
          </div>
          <Field label="Pasos de elaboración">
            <textarea
              value={form.elaboracion}
              onChange={(e) => setForm({ ...form, elaboracion: e.target.value })}
              placeholder={"1. Tostar la chapata 2 min\n2. Frotar con tomate rallado\n3. Aliñar con AOVE y sal"}
              className="w-full rounded-lg p-2 text-[12.5px]"
              style={{ border: `1px solid ${C.line}`, background: C.surface, color: C.ink, height: 100, resize: "vertical" }}
            />
          </Field>
          <div className="text-[11px] mb-3" style={{ color: C.inkSoft }}>
            Sirve para que cualquiera del equipo elabore el producto igual. Se imprime junto con la ficha.
          </div>

          <div className="text-[12px] font-semibold mb-2 pt-2" style={{ borderTop: `1px solid ${C.line}` }}>Cálculo del precio de venta</div>
          <div className="grid grid-cols-3 gap-x-3">
            <Field label="Margen objetivo (%)">
              <Input type="number" step="1" value={form.margenObjetivo} onChange={(e) => setForm({ ...form, margenObjetivo: e.target.value })} />
            </Field>
            <Field label="IVA (%)">
              <Input type="number" step="1" value={form.iva} onChange={(e) => setForm({ ...form, iva: e.target.value })} />
            </Field>
            <Field label="Redondeo">
              <button
                type="button"
                onClick={() => setForm({ ...form, redondear: !form.redondear })}
                className="w-full rounded-lg px-3 py-2 text-[12.5px] font-medium"
                style={{
                  border: `1px solid ${form.redondear ? C.accent : C.line}`,
                  background: form.redondear ? C.accentSoft : C.surface,
                  color: C.ink,
                }}
              >
                {form.redondear ? "A múltiplos de 0,10" : "Sin redondear"}
              </button>
            </Field>
          </div>

          <Card style={{ background: C.accentSoft, border: "none" }} className="mb-3">
            <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center mb-3">
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Costo total</div>
                <div className="mono font-semibold text-[15px]">€{fmt(costoTotal)}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Costo por unidad</div>
                <div className="mono font-semibold text-[15px]">€{fmt(costoPorUnidad)}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Precio sin IVA</div>
                <div className="mono font-semibold text-[15px]">€{fmt(netoFinal)}</div>
              </div>
              <div>
                <div className="text-[11px]" style={{ color: C.inkSoft }}>Margen real</div>
                <div className="mono font-semibold text-[15px]" style={{ color: margen == null ? C.ink : margen < 15 ? C.red : C.accent }}>
                  {margen == null ? "—" : `${fmt(margen)}%`}
                </div>
              </div>
            </div>
            <div className="text-center pt-3" style={{ borderTop: `1px solid rgba(0,0,0,0.08)` }}>
              <div className="text-[11px]" style={{ color: C.inkSoft }}>Precio de carta (IVA {ivaPct}% incluido)</div>
              <div className="mono font-bold text-[26px]" style={{ color: C.accent }}>€{fmt(pvpFinal)}</div>
            </div>
          </Card>

          <div className="text-[12px] font-medium mb-1" style={{ color: C.inkSoft }}>
            Fijar el precio a mano (opcional). Escribe en la casilla que prefieras: la otra se calcula sola.
          </div>
          <div className="grid grid-cols-2 gap-x-3">
            <Field label="Precio NETO sin IVA (€)">
              <InputCalc
                step="0.01"
                decimales={2}
                valor={form.precioVenta === "" ? "" : Number(form.precioVenta) / (1 + ivaPct / 100)}
                onEscribir={(neto) => {
                  if (neto === "") { setForm({ ...form, precioVenta: "" }); return; }
                  const n = Number(neto);
                  if (isNaN(n)) return;
                  setForm({ ...form, precioVenta: String(n * (1 + ivaPct / 100)) });
                }}
                placeholder={`Sugerido: ${fmt(pvpSugerido / (1 + ivaPct / 100))}`}
              />
            </Field>
            <Field label="Precio de CARTA con IVA (€)">
              <Input
                type="number"
                step="0.01"
                value={form.precioVenta}
                onChange={(e) => setForm({ ...form, precioVenta: e.target.value })}
                placeholder={`Sugerido: ${fmt(pvpSugerido)}`}
              />
            </Field>
          </div>
          {form.precioVenta !== "" && (
            <div className="text-[11.5px] mb-3" style={{ color: C.inkSoft }}>
              Precio fijado a mano: se ignora el margen objetivo y se recalcula el margen real sobre este precio.
            </div>
          )}

          {form.productoVinculadoId && !enlaceRoto ? (
            <div className="text-[11.5px] mb-3" style={{ color: C.accent }}>
              Al guardar, <b>{(productos.find((p) => p.id === form.productoVinculadoId) || {}).nombre}</b> quedará con precio de venta €{fmt(pvpFinal)} (IVA {ivaPct}% incluido) y costo €{fmt(costoPorUnidad)}.
            </div>
          ) : (
            <Card className="mb-3" style={{ background: C.amberSoft, border: "none" }}>
              <div className="text-[11.5px] mb-2">
                {enlaceRoto ? (
                  <>
                    El producto de venta que tenía esta ficha <b>ya no existe en el catálogo</b>. Elige otro en el
                    desplegable de arriba, o crea uno nuevo aquí mismo a partir de esta receta.
                  </>
                ) : (
                  <>
                    Esta ficha no está asociada a ningún producto del catálogo, así que el precio no se guardará en ninguna parte.
                    Los ingredientes de arriba no llevan precio de venta: quien lo lleva es el <b>producto terminado</b> que vendes al cliente.
                  </>
                )}
              </div>
              <Btn small onClick={crearProductoDeVenta} variant="primary">
                <Plus size={13} /> Crear "{form.nombre || "producto"}" como producto de venta
              </Btn>
            </Card>
          )}

          {avisoCreado && (
            <div className="text-[12px] mb-2 p-2 rounded-lg" style={{ background: C.accentSoft, color: C.ink }}>
              Producto "{avisoCreado}" creado en el catálogo con su costo y precio de venta, y ya enlazado con esta
              ficha. <b>Guarda la ficha ahora</b> para que el enlace quede fijo — si sales sin guardar, se pierde.
            </div>
          )}
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Guardar ficha de costo"}</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); resetFicha(); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {fichasCosto.length === 0 ? <Empty text="Todavía no has creado ninguna ficha de costo." /> : (() => {
        const seccionesConFichas = SECCIONES_FICHAS.filter((s) => fichasCosto.some((f) => (f.seccion || "Otros") === s));
        const fichasFiltradas = filtroSeccion === "todas" ? fichasCosto : fichasCosto.filter((f) => (f.seccion || "Otros") === filtroSeccion);
        const grupos = filtroSeccion !== "todas"
          ? [{ nombre: filtroSeccion, fichas: fichasFiltradas }]
          : seccionesConFichas.map((s) => ({ nombre: s, fichas: fichasCosto.filter((f) => (f.seccion || "Otros") === s) }));

        return (
          <>
            <div className="flex gap-2 mb-3 overflow-x-auto">
              <button
                onClick={() => setFiltroSeccion("todas")}
                className="text-[12px] font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
                style={{
                  background: filtroSeccion === "todas" ? C.chrome : C.surface,
                  color: filtroSeccion === "todas" ? "#fff" : C.inkSoft,
                  border: `1px solid ${filtroSeccion === "todas" ? C.chrome : C.line}`,
                }}
              >
                Todas ({fichasCosto.length})
              </button>
              {seccionesConFichas.map((s) => (
                <button
                  key={s}
                  onClick={() => setFiltroSeccion(s)}
                  className="text-[12px] font-medium px-3 py-1.5 rounded-full whitespace-nowrap"
                  style={{
                    background: filtroSeccion === s ? C.accent : C.surface,
                    color: filtroSeccion === s ? "#fff" : C.inkSoft,
                    border: `1px solid ${filtroSeccion === s ? C.accent : C.line}`,
                  }}
                >
                  {s} ({fichasCosto.filter((f) => (f.seccion || "Otros") === s).length})
                </button>
              ))}
            </div>

            {grupos.map((grupo) => (
              <div key={grupo.nombre} className="mb-5">
                {filtroSeccion === "todas" && (
                  <div className="text-[12px] font-semibold mb-2 uppercase tracking-wide" style={{ color: C.inkSoft }}>
                    {grupo.nombre}
                  </div>
                )}
                <div className="grid md:grid-cols-2 gap-3">
                  {grupo.fichas.map((f) => {
                    const costoComp = f.componentes.reduce((a, c) => a + (Number(c.cantidad) || 0) * costoDe(c), 0);
                    const costoAdi = (Number(f.empaque) || 0) + (Number(f.manoObra) || 0) + (Number(f.otros) || 0) + (Number(f.gastosGenerales) || 0);
                    const total = costoComp + costoAdi;
                    const rend = Number(f.rendimiento) || 1;
                    const porUnidad = total / rend;
                    const pv = Number(f.precioVenta) || Number(f.precioCalculado) || 0;
                    const marg = pv > 0 ? ((pv - porUnidad) / pv) * 100 : null;

                    // Coste real de las producciones ya hechas con esta ficha, para
                    // ver si la receta está desactualizada frente a lo que de verdad
                    // cuesta hacerlo (mermas incluidas). Ponderado por unidades, no
                    // una media simple, para que una tanda grande pese más que una chica.
                    const ordenesDeFicha = ordenesProduccion.filter((o) => o.fichaId === f.id);
                    let costoRealMedio = null;
                    let diferenciaPct = null;
                    if (ordenesDeFicha.length > 0) {
                      const totalUnidades = ordenesDeFicha.reduce((a, o) => a + (Number(o.unidadesBuenas) || 0), 0);
                      const totalCoste = ordenesDeFicha.reduce((a, o) => a + (Number(o.costoUnitarioLote) || 0) * (Number(o.unidadesBuenas) || 0), 0);
                      if (totalUnidades > 0) {
                        costoRealMedio = totalCoste / totalUnidades;
                        diferenciaPct = porUnidad > 0 ? ((costoRealMedio - porUnidad) / porUnidad) * 100 : null;
                      }
                    }
                    return (
                      <Card key={f.id}>
                        <div className="flex items-start justify-between mb-2">
                          <div>
                            <div className="font-semibold">{f.nombre}</div>
                            <div className="text-[11px]" style={{ color: C.inkSoft }}>Rinde {rend} unidad(es)</div>
                            {f.productoVinculadoId && !productos.some((p) => p.id === f.productoVinculadoId) && (
                              <div className="text-[11px] mt-1" style={{ color: C.amber }}>
                                ⚠ El producto enlazado ya no existe — no se puede producir hasta arreglarlo
                              </div>
                            )}
                            {!f.productoVinculadoId && (
                              <div className="text-[11px] mt-1" style={{ color: C.amber }}>
                                ⚠ Sin producto de venta enlazado — no se puede producir
