<script>
  // Guardado local en el propio tel&eacute;fono (sustituye a window.storage de Claude)
  window.storage = {
    async get(key) {
      const v = localStorage.getItem("almacen:" + key);
      if (v === null) throw new Error("no existe");
      return { key: key, value: v, shared: false };
    },
    async set(key, value) {
      localStorage.setItem("almacen:" + key, value);
      return { key: key, value: value, shared: false };
    },
    async delete(key) {
      localStorage.removeItem("almacen:" + key);
      return { key: key, deleted: true, shared: false };
    },
    async list(prefix) {
      const keys = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith("almacen:")) keys.push(k.slice(8));
      }
      return { keys: keys, shared: false };
    }
  };
</script>

// Los precios de venta se introducen CON IVA (como en carta).
// El coste de compra es SIN IVA (el IVA soportado es deducible).
// Por eso el margen se calcula sobre el precio neto.
function ivaDe(p) {
  const v = Number(p && p.ivaVenta);
  return isNaN(v) ? 10 : v;
}
// IVA soportado en la compra. En España conviven 4% (alimentación básica),
// 10% (resto de alimentos) y 21% (general).
function ivaCompraDe(p) {
  const v = Number(p && p.ivaCompra);
  return isNaN(v) ? 10 : v;
}
function costoConIva(p) {
  return (Number(p && p.costo) || 0) * (1 + ivaCompraDe(p) / 100);
}
// Agrupa productos por proveedor para inventarios y hojas de recuento.
// Los que no tienen proveedor asignado van al final, en su propio grupo.
function agruparPorProveedor(productos, proveedores) {
  const grupos = new Map();
  productos.forEach((p) => {
    const id = p.proveedorId || "__sin__";
    if (!grupos.has(id)) grupos.set(id, []);
    grupos.get(id).push(p);
  });
  const orden = (a, b) => (a.ubicacion || "").localeCompare(b.ubicacion || "") || (a.nombre || "").localeCompare(b.nombre || "");
  const salida = [];
  proveedores.forEach((pv) => {
    if (grupos.has(pv.id)) {
      salida.push({ id: pv.id, nombre: pv.nombre, items: grupos.get(pv.id).sort(orden) });
      grupos.delete(pv.id);
    }
  });
  grupos.forEach((items, id) => {
    if (id === "__sin__") return;
    salida.push({ id, nombre: "Proveedor no encontrado", items: items.sort(orden) });
  });
  if (grupos.has("__sin__")) {
    salida.push({ id: "__sin__", nombre: "Sin proveedor asignado", items: grupos.get("__sin__").sort(orden) });
  }
  return salida;
}

const TIPOS_IVA = [0, 4, 10, 21];

// Empaque de compra: cuántas unidades trae la caja/saco/paquete del proveedor.
function udsPorCaja(p) {
  const v = Number(p && p.udsPorCaja);
  return !v || v <= 0 ? 1 : v;
}
function costoCaja(p) {
  return (Number(p && p.costo) || 0) * udsPorCaja(p);
}
function precioNeto(p) {
  const pvp = Number(p && p.precioVenta) || 0;
  return pvp / (1 + ivaDe(p) / 100);
}
function margenDe(p) {
  const neto = precioNeto(p);
  if (neto <= 0) return null;
  return ((neto - (Number(p.costo) || 0)) / neto) * 100;
}

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

// Conteo final de un ítem: usa CF si está puesto; si no, el último conteo con valor.
// Soporta el formato antiguo (cantidadContada) de conteos ya guardados.
function valorCF(item) {
  if (!item) return null;
  const candidatos = [item.conteo, item.cf, item.c3, item.c2, item.c1, item.cantidadContada];
  for (const v of candidatos) {
    if (v !== "" && v !== null && v !== undefined && !isNaN(Number(v))) return Number(v);
  }
  return null;
}
const fmt = (n) => (Number(n) || 0).toLocaleString("es-ES", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const todayISO = () => new Date().toISOString().slice(0, 10);

async function loadKey(key, fallback, retries = 2) {
  for (let attempt = 0; attempt <= retries; attempt++) {
    try {
      const res = await window.storage.get(key, false);
      if (res && res.value) return JSON.parse(res.value);
      return fallback; // la clave genuinamente no existe todavía (primer uso)
    } catch (e) {
      if (attempt === retries) {
        console.error("No se pudo cargar", key, "tras varios intentos:", e);
        return fallback;
      }
      await new Promise((r) => setTimeout(r, 350));
    }
  }
  return fallback;
}
async function saveKey(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), false);
  } catch (e) {
    console.error("Error guardando", key, e);
  }
}

function GestionAlmacen() {
  const [ready, setReady] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const skipSaveRef = React.useRef(true); // evita guardar en el primer instante tras cargar
  const autoSnapshotRef = React.useRef(false); // evita crear más de una copia automática por sesión

  const [proveedores, setProveedores] = useState([]);
  const [productos, setProductos] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [movimientos, setMovimientos] = useState([]);
  const [conteos, setConteos] = useState([]);
  const [fichasCosto, setFichasCosto] = useState([]);
  const [albaranes, setAlbaranes] = useState([]);
  const [catalogoProv, setCatalogoProv] = useState({});
  const [historial, setHistorial] = useState([]);

  useEffect(() => {
    (async () => {
      const [p, pr, pe, mo, co, fc, hi, al, cp] = await Promise.all([
        loadKey("proveedores", []),
        loadKey("productos", []),
        loadKey("pedidos", []),
        loadKey("movimientos", []),
        loadKey("conteos", []),
        loadKey("fichasCosto", []),
        loadKey("historialRespaldos", []),
        loadKey("albaranes", []),
        loadKey("catalogoProv", {}),
      ]);
      setProveedores(p);
      setProductos(pr);
      setPedidos(pe);
      setMovimientos(mo);
      setConteos(co);
      setFichasCosto(fc);
      setHistorial(hi);
      setAlbaranes(al);
      setCatalogoProv(cp);
      setReady(true);
      // Solo después de que el estado ya se pintó con los datos cargados
      // habilitamos el guardado automático, para no sobrescribir nada
      // por un fallo de lectura pasajero.
      setTimeout(() => { skipSaveRef.current = false; }, 400);

      // Copia de seguridad automática: una por sesión, para poder recuperar
      // el estado con el que se abrió el programa si algo sale mal después.
      if (!autoSnapshotRef.current) {
        autoSnapshotRef.current = true;
        const tieneDatos = p.length || pr.length || pe.length || mo.length || co.length || fc.length || al.length;
        if (tieneDatos) {
          const snapshot = {
            id: uid(),
            fecha: new Date().toISOString(),
            automatica: true,
            data: { proveedores: p, productos: pr, pedidos: pe, movimientos: mo, conteos: co, fichasCosto: fc, albaranes: al, catalogoProv: cp },
          };
          setHistorial((s) => [snapshot, ...hi].slice(0, 12));
        }
      }
    })();
  }, []);

  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("proveedores", proveedores); }, [proveedores, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("productos", productos); }, [productos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("pedidos", pedidos); }, [pedidos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("movimientos", movimientos); }, [movimientos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("conteos", conteos); }, [conteos, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("fichasCosto", fichasCosto); }, [fichasCosto, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("historialRespaldos", historial); }, [historial, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("albaranes", albaranes); }, [albaranes, ready]);
  useEffect(() => { if (ready && !skipSaveRef.current) saveKey("catalogoProv", catalogoProv); }, [catalogoProv, ready]);

  const productoPorId = (id) => productos.find((p) => p.id === id);
  const proveedorPorId = (id) => proveedores.find((p) => p.id === id);

  const [pendingRestore, setPendingRestore] = useState(null);
  const [restoreError, setRestoreError] = useState("");
  const [showBackupView, setShowBackupView] = useState(false);
  const [backupText, setBackupText] = useState("");
  const [showRestoreInput, setShowRestoreInput] = useState(false);
  const [restoreText, setRestoreText] = useState("");
  const [copiado, setCopiado] = useState(false);

  function crearPuntoDeGuardado() {
    const snapshot = {
      id: uid(),
      fecha: new Date().toISOString(),
      automatica: false,
      data: { proveedores, productos, pedidos, movimientos, conteos, fichasCosto, albaranes, catalogoProv },
    };
    setHistorial((s) => [snapshot, ...s].slice(0, 12));
  }
  function restaurarDesdeHistorial(snapshot) {
    setPendingRestore({ ...snapshot.data, exportadoEl: snapshot.fecha });
  }

  function abrirRespaldo() {
    const data = {
      version: 2,
      exportadoEl: new Date().toISOString(),
      proveedores, productos, pedidos, movimientos, conteos, fichasCosto,
      albaranes, catalogoProv,
    };
    setBackupText(JSON.stringify(data));
    setCopiado(false);
    setShowBackupView(true);
  }

  function copiarRespaldo() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupText).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  function abrirRestaurar() {
    setRestoreText("");
    setRestoreError("");
    setShowRestoreInput(true);
  }

  function analizarTextoRestauracion() {
    try {
      const data = JSON.parse(restoreText.trim());
      const tieneAlgo = data && (data.proveedores || data.productos || data.pedidos || data.movimientos || data.conteos || data.fichasCosto || data.albaranes);
      if (!tieneAlgo) throw new Error("Formato no reconocido");
      setRestoreError("");
      setShowRestoreInput(false);
      setPendingRestore(data);
    } catch (err) {
      setRestoreError("Ese texto no parece un respaldo válido. Revisa que lo hayas copiado completo.");
    }
  }

  function confirmarRestauracion() {
    if (!pendingRestore) return;
    if (pendingRestore.proveedores) setProveedores(pendingRestore.proveedores);
    if (pendingRestore.productos) setProductos(pendingRestore.productos);
    if (pendingRestore.pedidos) setPedidos(pendingRestore.pedidos);
    if (pendingRestore.movimientos) setMovimientos(pendingRestore.movimientos);
    if (pendingRestore.conteos) setConteos(pendingRestore.conteos);
    if (pendingRestore.fichasCosto) setFichasCosto(pendingRestore.fichasCosto);
    if (pendingRestore.albaranes) setAlbaranes(pendingRestore.albaranes);
    if (pendingRestore.catalogoProv) setCatalogoProv(pendingRestore.catalogoProv);
    setPendingRestore(null);
  }

  /* ---------- ACCIONES DE NEGOCIO ---------- */

  function addProveedor(data) {
    setProveedores((s) => [...s, { id: uid(), ...data }]);
  }
  function updateProveedor(id, data) {
    setProveedores((s) => s.map((p) => (p.id === id ? { ...p, ...data } : p)));
  }
  function deleteProveedor(id) {
    setProveedores((s) => s.filter((p) => p.id !== id));
  }
  function addProducto(data) {
    setProductos((s) => [...s, { id: uid(), stock: Number(data.stock) || 0, ...data }]);
  }
  function updateProducto(id, data) {
    setProductos((s) => s.map((p) => (p.id === id ? { ...p, ...data } : p)));
  }
  function deleteProducto(id) {
    setProductos((s) => s.filter((p) => p.id !== id));
  }

  function crearPedido({ proveedorId, fechaEsperada, items }) {
    const pedido = {
      id: uid(),
      proveedorId,
      fecha: todayISO(),
      fechaEsperada,
      estado: "Pendiente",
      items: items.map((it) => ({ ...it, cantidadRecibida: 0 })),
    };
    setPedidos((s) => [pedido, ...s]);
    return pedido;
  }

  function actualizarPedido(pedidoId, { proveedorId, fechaEsperada, items }) {
    setPedidos((s) =>
      s.map((pe) =>
        pe.id === pedidoId
          ? { ...pe, proveedorId, fechaEsperada, items: items.map((it) => ({ ...it, cantidadRecibida: 0 })) }
          : pe
      )
    );
  }

  function eliminarPedido(pedidoId) {
    setPedidos((s) => s.filter((pe) => pe.id !== pedidoId));
  }

  function recibirPedido(pedidoId, recepciones) {
    if (almacenCongelado) return false;
    // recepciones: { [productoId]: cantidadRecibidaAhora }
    setPedidos((s) =>
      s.map((pe) => {
        if (pe.id !== pedidoId) return pe;
        const items = pe.items.map((it) => {
          const nueva = Number(recepciones[it.productoId] || 0);
          return { ...it, cantidadRecibida: it.cantidadRecibida + nueva };
        });
        const completo = items.every((it) => it.cantidadRecibida >= it.cantidad);
        const algo = items.some((it) => it.cantidadRecibida > 0);
        return { ...pe, items, estado: completo ? "Recibido" : algo ? "Parcial" : "Pendiente" };
      })
    );
    // Actualizar stock y movimientos
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const cant = Number(recepciones[p.id] || 0);
        if (cant > 0) {
          nuevosMov.push({ id: uid(), productoId: p.id, tipo: "entrada", cantidad: cant, fecha: todayISO(), referencia: "Recepción pedido" });
          return { ...p, stock: p.stock + cant };
        }
        return p;
      })
    );
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
    return true;
  }

  function registrarSalida(productoId, cantidad, referencia) {
    if (almacenCongelado) return false;
    const cant = Number(cantidad);
    if (!cant || cant <= 0) return false;
    setProductos((s) => s.map((p) => (p.id === productoId ? { ...p, stock: Math.max(0, p.stock - cant) } : p)));
    setMovimientos((s) => [{ id: uid(), productoId, tipo: "salida", cantidad: cant, fecha: todayISO(), referencia: referencia || "Salida manual" }, ...s]);
    return true;
  }

  function addFichaCosto(data) {
    setFichasCosto((s) => [...s, { id: uid(), ...data }]);
  }
  function updateFichaCosto(id, data) {
    setFichasCosto((s) => s.map((f) => (f.id === id ? { ...f, ...data } : f)));
  }
  function deleteFichaCosto(id) {
    setFichasCosto((s) => s.filter((f) => f.id !== id));
  }

  function crearProductoEnConteo(conteoId, datos, cantidadContada) {
    const nuevoId = uid();
    const nuevoProducto = {
      id: nuevoId,
      stock: 0,
      codigo: datos.codigo || "",
      nombre: datos.nombre,
      categoria: datos.categoria || "",
      unidad: datos.unidad || "unidad",
      costo: Number(datos.costo) || 0,
      precioVenta: Number(datos.precioVenta) || 0,
      stockMinimo: Number(datos.stockMinimo) || 0,
      ubicacion: datos.ubicacion || "",
      proveedorId: datos.proveedorId || "",
    };
    setProductos((s) => [...s, nuevoProducto]);
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId ? { ...c, items: [...c.items, { productoId: nuevoId, cantidadContada }] } : c
      )
    );
  }

  function iniciarConteo() {
    const conteo = {
      id: uid(),
      fecha: todayISO(),
      completado: false,
      responsables: { contadoPor: "", revisor: "" },
      items: productos.map((p) => ({ productoId: p.id, conteo: "" })),
    };
    setConteos((s) => [conteo, ...s]);
    return conteo.id;
  }
  function actualizarConteoItem(conteoId, productoId, campo, valor) {
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId
          ? { ...c, items: c.items.map((it) => (it.productoId === productoId ? { ...it, [campo]: valor } : it)) }
          : c
      )
    );
  }
  function actualizarResponsable(conteoId, campo, valor) {
    setConteos((s) =>
      s.map((c) => (c.id === conteoId ? { ...c, responsables: { ...(c.responsables || {}), [campo]: valor } } : c))
    );
  }
  function finalizarConteo(conteoId) {
    setConteos((s) => s.map((c) => (c.id === conteoId ? { ...c, completado: true } : c)));
  }
  function aplicarAjustes(conteoId, motivos = {}) {
    const conteo = conteos.find((c) => c.id === conteoId);
    if (!conteo) return;
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const item = conteo.items.find((it) => it.productoId === p.id);
        const valorFinal = item ? valorCF(item) : null;
        if (valorFinal === null) return p;
        const dif = valorFinal - Number(p.stock || 0);
        if (dif !== 0) {
          nuevosMov.push({
            id: uid(), productoId: p.id, tipo: "ajuste", cantidad: dif,
            fecha: todayISO(),
            motivo: motivos[p.id] || "Sin especificar",
            referencia: `Ajuste por inventario · ${motivos[p.id] || "Sin especificar"}`,
          });
        }
        return { ...p, stock: valorFinal };
      })
    );
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
  }

  // Hay un conteo abierto: el almacén queda congelado para no falsear el descuadre
  const conteoAbierto = useMemo(() => conteos.find((c) => !c.completado) || null, [conteos]);
  const almacenCongelado = !!conteoAbierto;


  /* ---------- ALBARANES ---------- */

  // Clave del catálogo aprendido: cada proveedor tiene sus propios códigos
  const claveCat = (proveedorId, codigo) => `${proveedorId}::${String(codigo || "").trim().toUpperCase()}`;

  function buscarEnCatalogo(proveedorId, codigo) {
    return catalogoProv[claveCat(proveedorId, codigo)] || null;
  }

  // Registra la referencia del proveedor para no volver a teclearla nunca más
  function aprenderReferencia(proveedorId, codigo, datos) {
    if (!codigo) return;
    setCatalogoProv((s) => ({ ...s, [claveCat(proveedorId, codigo)]: { ...(s[claveCat(proveedorId, codigo)] || {}), ...datos } }));
  }

  function guardarAlbaran(alb) {
    setAlbaranes((s) => {
      const existe = s.some((a) => a.id === alb.id);
      return existe ? s.map((a) => (a.id === alb.id ? alb : a)) : [alb, ...s];
    });
  }

  function eliminarAlbaran(id) {
    setAlbaranes((s) => s.filter((a) => a.id !== id));
  }

  // Confirmar = dar entrada real: crea/actualiza productos, sube stock y deja rastro.
  // Se calcula TODO de forma síncrona antes de tocar el estado; si no, el albarán
  // se guardaba vacío porque las líneas aún no estaban resueltas.
  function confirmarAlbaran(alb) {
    const avisos = [];
    const nuevosMov = [];
    const lineasResueltas = [];
    let lista = [...productos];

    alb.lineas.forEach((ln) => {
      const uds = Number(ln.udsPorCaja) > 0 ? Number(ln.udsPorCaja) : 1;
      const cantidad = Number(ln.cantidad) || 0;
      const importe = Number(ln.importe) || 0;
      const unidadesTotales = ln.tipoUnidad === "peso" ? cantidad : cantidad * uds;
      const costoUnitario = unidadesTotales > 0 ? importe / unidadesTotales : 0;

      const cat = catalogoProv[claveCat(alb.proveedorId, ln.codigoProveedor)];
      let prod = null;
      if (ln.productoId) prod = lista.find((p) => p.id === ln.productoId);
      if (!prod && cat && cat.productoId) prod = lista.find((p) => p.id === cat.productoId);

      if (prod) {
        const costoAnterior = Number(prod.costo) || 0;
        if (costoAnterior > 0 && costoUnitario > 0) {
          const variacion = ((costoUnitario - costoAnterior) / costoAnterior) * 100;
          if (Math.abs(variacion) >= 3) {
            avisos.push({ nombre: prod.nombre, anterior: costoAnterior, nuevo: costoUnitario, variacion });
          }
        }
        lista = lista.map((p) =>
          p.id === prod.id
            ? {
                ...p,
                stock: (Number(p.stock) || 0) + unidadesTotales,
                costo: costoUnitario > 0 ? Number(costoUnitario.toFixed(4)) : p.costo,
                ivaCompra: Number(ln.ivaPct) || p.ivaCompra || 10,
                udsPorCaja: uds,
                proveedorId: p.proveedorId || alb.proveedorId,
              }
            : p
        );
        lineasResueltas.push({ ...ln, productoId: prod.id, unidadesEntradas: unidadesTotales });
        nuevosMov.push({
          id: uid(), productoId: prod.id, tipo: "entrada", cantidad: unidadesTotales,
          fecha: alb.fecha, albaranId: alb.id,
          referencia: `Albarán ${alb.numero || "s/n"}${ln.lote ? " · lote " + ln.lote : ""}`,
        });
      } else {
        const nuevoId = uid();
        const nuevo = {
          id: nuevoId,
          codigo: ln.codigoProveedor || "",
          nombre: ln.descripcion || "Sin descripción",
          categoria: "",
          unidad: ln.unidad || "unidad",
          costo: Number(costoUnitario.toFixed(4)),
          ivaCompra: Number(ln.ivaPct) || 10,
          udsPorCaja: uds,
          precioVenta: 0,
          ivaVenta: 10,
          stock: unidadesTotales,
          stockMinimo: 0,
          ubicacion: "",
          proveedorId: alb.proveedorId,
        };
        lista = [...lista, nuevo];
        lineasResueltas.push({ ...ln, productoId: nuevoId, unidadesEntradas: unidadesTotales });
        nuevosMov.push({
          id: uid(), productoId: nuevoId, tipo: "entrada", cantidad: unidadesTotales,
          fecha: alb.fecha, albaranId: alb.id,
          referencia: `Albarán ${alb.numero || "s/n"} · alta automática`,
        });
      }
    });

    setProductos(lista);
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);

    setCatalogoProv((prev) => {
      const copia = { ...prev };
      lineasResueltas.forEach((ln) => {
        if (!ln.codigoProveedor) return;
        copia[claveCat(alb.proveedorId, ln.codigoProveedor)] = {
          descripcion: ln.descripcion,
          unidad: ln.unidad,
          udsPorCaja: Number(ln.udsPorCaja) || 1,
          ivaPct: Number(ln.ivaPct) || 10,
          tipoUnidad: ln.tipoUnidad || "unidad",
          contenido: ln.contenido || "",
          unidadContenido: ln.unidadContenido || "",
          productoId: ln.productoId,
          ultimoPrecio: Number(ln.precioBruto) || 0,
          ultimoDto: Number(ln.dtoPct) || 0,
        };
      });
      return copia;
    });

    guardarAlbaran({ ...alb, lineas: lineasResueltas, estado: "confirmado", avisosPrecio: avisos });
    return avisos;
  }

  // Deshace la entrada de un albarán: resta el stock que sumó y borra sus movimientos,
  // dejándolo en borrador para poder corregirlo.
  function anularAlbaran(alb) {
    setProductos((prev) =>
      prev.map((p) => {
        const suyas = alb.lineas.filter((ln) => ln.productoId === p.id);
        if (!suyas.length) return p;
        const restar = suyas.reduce((a, ln) => a + (Number(ln.unidadesEntradas) || 0), 0);
        return { ...p, stock: Math.max(0, (Number(p.stock) || 0) - restar) };
      })
    );
    setMovimientos((prev) => prev.filter((m) => m.albaranId !== alb.id));
    guardarAlbaran({ ...alb, estado: "borrador", avisosPrecio: [] });
  }

  /* ---------- CÁLCULOS ---------- */

  const valorInventario = useMemo(
    () => productos.reduce((acc, p) => acc + p.stock * Number(p.costo || 0), 0),
    [productos]
  );
  const stockBajo = useMemo(() => productos.filter((p) => p.stock <= Number(p.stockMinimo || 0)), [productos]);

  // Clasificación ABC por VALOR DE CONSUMO: lo que realmente mueve dinero.
  // valorConsumo = unidades que han salido en los últimos 12 meses × costo unitario.
  // Si todavía no hay histórico de salidas, se usa el valor en stock como aproximación
  // provisional y se avisa de ello en la interfaz.
  const analisisABC = useMemo(() => {
    const hace12meses = new Date();
    hace12meses.setMonth(hace12meses.getMonth() - 12);

    const consumo = {};
    movimientos.forEach((m) => {
      if (m.tipo !== "salida") return;
      if (new Date(m.fecha) < hace12meses) return;
      consumo[m.productoId] = (consumo[m.productoId] || 0) + Math.abs(Number(m.cantidad) || 0);
    });

    const totalSalidas = Object.values(consumo).reduce((a, x) => a + x, 0);
    const baseConsumo = totalSalidas > 0;

    const conValor = productos.map((p) => {
      const unidades = consumo[p.id] || 0;
      const costo = Number(p.costo) || 0;
      const valor = baseConsumo ? unidades * costo : (Number(p.stock) || 0) * costo;
      return { id: p.id, valor, unidades, rotacion: (Number(p.stock) || 0) > 0 ? unidades / (Number(p.stock) || 1) : null };
    });

    const total = conValor.reduce((a, x) => a + x.valor, 0);
    const mapa = {};
    const detalle = {};

    if (total <= 0) {
      productos.forEach((p) => { mapa[p.id] = "C"; detalle[p.id] = { valor: 0, unidades: 0, rotacion: null }; });
      return { mapa, detalle, baseConsumo };
    }

    const ordenados = [...conValor].sort((a, b) => b.valor - a.valor);
    let acumulado = 0;
    ordenados.forEach((x) => {
      acumulado += x.valor;
      const pct = (acumulado / total) * 100;
      mapa[x.id] = pct <= 80 ? "A" : pct <= 95 ? "B" : "C";
      detalle[x.id] = { valor: x.valor, unidades: x.unidades, rotacion: x.rotacion };
    });
    return { mapa, detalle, baseConsumo };
  }, [productos, movimientos]);

  const clasificacionABC = analisisABC.mapa;
  const pedidosPendientes = useMemo(() => pedidos.filter((p) => p.estado !== "Recibido"), [pedidos]);
  const margenPromedio = useMemo(() => {
    const conPrecio = productos.filter((p) => Number(p.precioVenta) > 0);
    if (!conPrecio.length) return 0;
    const total = conPrecio.reduce((acc, p) => acc + (margenDe(p) || 0), 0);
    return total / conPrecio.length;
  }, [productos]);

  const rotacionPorProducto = useMemo(() => {
    return productos.map((p) => {
      const salidas = movimientos.filter((m) => m.productoId === p.id && m.tipo === "salida");
      const cantSalidas = salidas.reduce((a, m) => a + m.cantidad, 0);
      const costoVentas = cantSalidas * Number(p.costo || 0);
      const inventarioPromedio = p.stock * Number(p.costo || 0);
      const rotacion = inventarioPromedio > 0 ? costoVentas / inventarioPromedio : null;
      const dias = rotacion ? 365 / rotacion : null;
      return { ...p, cantSalidas, rotacion, dias };
    });
  }, [productos, movimientos]);

  const gastoPorProveedor = useMemo(() => {
    const map = {};
    pedidos.forEach((pe) => {
      const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
      map[pe.proveedorId] = (map[pe.proveedorId] || 0) + total;
    });
    return Object.entries(map)
      .map(([proveedorId, total]) => ({ proveedor: proveedorPorId(proveedorId), total }))
      .sort((a, b) => b.total - a.total);
  }, [pedidos, proveedores]);

  const productosSinMovimiento = useMemo(
    () => productos.filter((p) => !movimientos.some((m) => m.productoId === p.id && m.tipo === "salida")),
    [productos, movimientos]
  );

  if (!ready) {
    return (
      <div style={{ background: C.bg, color: C.ink }} className="w-full h-full min-h-[600px] flex items-center justify-center font-sans">
        <Loader2 className="animate-spin" size={22} />

          .zona-impresion {

          }
          .no-imprimir { display: none !important; }
          .zona-impresion table { page-break-inside: auto; }
          .zona-impresion tr { page-break-inside: avoid; page-break-after: auto; }

      <main className="flex-1 p-4 md:p-7 overflow-y-auto" style={{ maxHeight: "900px" }}>
        {tab === "dashboard" && (
          <Dashboard
            valorInventario={valorInventario}

            pedidosPendientes={pedidosPendientes}
            margenPromedio={margenPromedio}

            productos={productos}
          />
        )}
        {tab === "proveedores" && (
          <Proveedores proveedores={proveedores} addProveedor={addProveedor} updateProveedor={updateProveedor} deleteProveedor={deleteProveedor} pedidos={pedidos} />
        )}
        {tab === "productos" && (
          <Productos

        {tab === "pedidos" && (

          </div>
          <div className="text-[12.5px] mb-4 space-y-1" style={{ color: C.inkSoft }}>

          {!pendingRestore.albaranes && (

/* ================= PROVEEDORES ================= */
function Proveedores({ proveedores, addProveedor, updateProveedor, deleteProveedor, pedidos }) {
  const blankProv = { nombre: "", contacto: "", telefono: "", email: "", condiciones: "", leadTime: "" };
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(blankProv);
  const [error, setError] = useState("");
  const [editFor, setEditFor] = useState(null);
  const [editForm, setEditForm] = useState(blankProv);
  const [editError, setEditError] = useState("");

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del proveedor.");
      return;
    }
    setError("");
    addProveedor(form);
    setForm(blankProv);
    setShowForm(false);
  }

  function openEdit(pv) {
    setEditFor(pv.id);
    setEditForm({
      nombre: pv.nombre || "", contacto: pv.contacto || "", telefono: pv.telefono || "",
      email: pv.email || "", condiciones: pv.condiciones || "", leadTime: pv.leadTime || "",
    });
    setEditError("");
  }
  function submitEdit() {
    if (!editForm.nombre.trim()) {
      setEditError("Escribe el nombre del proveedor.");
      return;
    }
    updateProveedor(editFor, editForm);
    setEditFor(null);
  }

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => setShowForm((s) => !s)}><Plus size={15} /> Nuevo proveedor</Btn>}>
        Proveedores
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre del proveedor"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Distribuidora del Norte" /></Field>
            <Field label="Persona de contacto"><Input value={form.contacto} onChange={(e) => setForm({ ...form, contacto: e.target.value })} placeholder="Nombre" /></Field>
            <Field label="Teléfono (WhatsApp)"><Input value={form.telefono} onChange={(e) => setForm({ ...form, telefono: e.target.value })} placeholder="+34 600 000 000" /></Field>
            <Field label="Correo electrónico"><Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="pedidos@proveedor.com" /></Field>
            <Field label="Condiciones de pago"><Input value={form.condiciones} onChange={(e) => setForm({ ...form, condiciones: e.target.value })} placeholder="Contado / 30 días" /></Field>
            <Field label="Tiempo de entrega (días)"><Input type="number" value={form.leadTime} onChange={(e) => setForm({ ...form, leadTime: e.target.value })} placeholder="5" /></Field>
          </div>
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2 mt-1">
            <Btn onClick={submit}>Guardar proveedor</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Cancelar</Btn>
          </div>
        </Card>
      )}

      {proveedores.length === 0 ? <Empty text="Todavía no has añadido proveedores." /> : (
        <div className="grid md:grid-cols-2 gap-3">
          {proveedores.map((pv) => {
            const nPedidos = pedidos.filter((p) => p.proveedorId === pv.id).length;
            return (
              <Card key={pv.id}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-semibold">{pv.nombre}</div>
                    <div className="text-[12px] mt-0.5" style={{ color: C.inkSoft }}>{pv.contacto}</div>

/* ================= MODAL ================= */
/* ====== Bloque de compra por caja / paquete ====== */
/* Campo cuyo valor se calcula a partir de otro. Mientras el usuario escribe
   se muestra tal cual lo teclea; al salir del campo vuelve al valor calculado.
   Sin esto, el reformateo en cada pulsación impide escribir decimales. */
function InputCalc({ valor, onEscribir, decimales = 2, ...props }) {
  const [borrador, setBorrador] = useState(null);
  const formateado =
    valor === "" || valor === null || valor === undefined || isNaN(Number(valor))
      ? ""
      : Number(valor).toFixed(decimales);
  const mostrado = borrador !== null ? borrador : formateado;
  return (
    <Input
      {...props}
      type="number"
      value={mostrado}
      onChange={(e) => { setBorrador(e.target.value); onEscribir(e.target.value); }}
      onBlur={() => setBorrador(null)}
    />
  );
}

function Bloque({ titulo, children }) {
  return (
    <div className="mb-4">
      <div className="text-[11px] font-semibold uppercase tracking-wider mb-2 pb-1" style={{ color: C.accent, borderBottom: `1px solid ${C.line}` }}>
        {titulo}
      </div>
      {children}
    </div>
  );
}

function CompraPorCaja({ form, setForm }) {
  const iva = Number(form.ivaCompra) || 0;
  const uds = Number(form.udsPorCaja) || 1;
  const costoUd = Number(form.costo) || 0;

  // Escribir en cualquiera de las casillas recalcula el costo por unidad
  const desdeCaja = (valor, conIva) => {
    if (valor === "") { setForm({ ...form, costo: "" }); return; }
    let neto = Number(valor);
    if (isNaN(neto)) return;
    if (conIva) neto = neto / (1 + iva / 100);
    setForm({ ...form, costo: String(uds > 0 ? neto / uds : neto) });
  };
  const desdeUnidadBruta = (valor) => {
    if (valor === "") { setForm({ ...form, costo: "" }); return; }
    const n = Number(valor);
    if (isNaN(n)) return;
    setForm({ ...form, costo: String(n / (1 + iva / 100)) });
  };

  const cajaNeta = costoUd > 0 ? costoUd * uds : "";
  const cajaBruta = costoUd > 0 ? costoUd * uds * (1 + iva / 100) : "";
  const unidadBruta = costoUd > 0 ? costoUd * (1 + iva / 100) : "";

  return (
    <div className="rounded-lg p-3 mb-3" style={{ background: C.bg, border: `1px solid ${C.line}` }}>
      <div className="text-[12px] font-semibold mb-1">Cómo te lo vende el proveedor</div>
      <div className="text-[11px] mb-3" style={{ color: C.inkSoft }}>
        Escribe en la casilla que traiga tu factura. Las demás se calculan solas.
      </div>

      <Field label="Unidades por caja (1 si lo compras suelto)">
        <Input type="number" step="1" value={form.udsPorCaja} onChange={(e) => setForm({ ...form, udsPorCaja: e.target.value })} />
      </Field>

      <div className="grid grid-cols-2 gap-x-3">
        <Field label="Precio CAJA sin IVA (€)">
          <InputCalc step="0.01" valor={cajaNeta} decimales={2} onEscribir={(v) => desdeCaja(v, false)} />
        </Field>
        <Field label="Precio CAJA con IVA (€)">
          <InputCalc step="0.01" valor={cajaBruta} decimales={2} onEscribir={(v) => desdeCaja(v, true)} />
        </Field>
        <Field label="Costo UNIDAD sin IVA (€)">
          <InputCalc step="0.0001" valor={form.costo} decimales={4} onEscribir={(v) => setForm({ ...form, costo: v })} />
        </Field>
        <Field label="Costo UNIDAD con IVA (€)">
          <InputCalc step="0.0001" valor={unidadBruta} decimales={4} onEscribir={desdeUnidadBruta} />
        </Field>
      </div>

      {uds > 1 && costoUd > 0 && (
        <div className="text-[11.5px] mono" style={{ color: C.accent }}>
          Caja de {uds}: €{fmt(costoUd * uds)} sin IVA · €{fmt(costoUd * uds * (1 + iva / 100))} con IVA → unidad €{fmt(costoUd)}
        </div>
      )}
    </div>
  );
}

function Modal({ children, onClose, title, ancho = "max-w-md" }) {
  return (
    <div className="fixed inset-0 z-50 flex items-start justify-center p-4 overflow-y-auto" style={{ background: "rgba(20,32,28,0.45)" }}>
      <div className={`rounded-xl p-5 w-full ${ancho} my-4`} style={{ background: C.surface }}>
        <div className="flex items-center justify-between mb-4">
          <div className="font-semibold text-[15px]">{title}</div>
          <button onClick={onClose}><X size={17} /></button>
        </div>
        {children}
      </div>
    </div>

}

function Pedidos({ pedidos, proveedores, productos, crearPedido, actualizarPedido, eliminarPedido, proveedorPorId, productoPorId }) {
  const [showForm, setShowForm] = useState(false);
  const [proveedorId, setProveedorId] = useState("");
  const [fechaEsperada, setFechaEsperada] = useState("");
  const [items, setItems] = useState([]);
  const [enviarPedido, setEnviarPedido] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);

  function addItemRow() {
    if (!productos.length) return;
    setItems((s) => [...s, { productoId: productos[0].id, cantidad: 1, costoUnitario: productos[0].costo }]);
  }
  function updateItem(idx, field, value) {
    setItems((s) =>
      s.map((it, i) => {
        if (i !== idx) return it;
        if (field === "productoId") {
          const p = productos.find((pr) => pr.id === value);
          return { ...it, productoId: value, costoUnitario: p ? p.costo : it.costoUnitario };
        }
        return { ...it, [field]: value };
      })
    );
  }
  function removeItem(idx) {
    setItems((s) => s.filter((_, i) => i !== idx));
  }
  const [error, setError] = useState("");

  function resetForm() {
    setItems([]);
    setProveedorId("");
    setFechaEsperada("");
    setEditingId(null);
    setError("");
  }

  function openEdit(pedido) {
    setEditingId(pedido.id);
    setProveedorId(pedido.proveedorId);
    setFechaEsperada(pedido.fechaEsperada || "");
    setItems(pedido.items.map((it) => ({ productoId: it.productoId, cantidad: it.cantidad, costoUnitario: it.costoUnitario })));
    setError("");
    setShowForm(true);
  }

  function submit() {
    if (!proveedorId) {
      setError("Selecciona un proveedor.");
      return;
    }
    if (items.length === 0) {
      setError("Añade al menos un producto al pedido.");
      return;
    }
    setError("");
    const itemsLimpios = items.map((it) => ({ productoId: it.productoId, cantidad: Number(it.cantidad), costoUnitario: Number(it.costoUnitario) }));
    if (editingId) {
      actualizarPedido(editingId, { proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
    } else {
      const pedido = crearPedido({ proveedorId, fechaEsperada, items: itemsLimpios });
      setShowForm(false);
      resetForm();
      setEnviarPedido(pedido);
    }
  }

  function textoPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const lineas = pedido.items.map((it) => {
      const p = productoPorId(it.productoId);
      return `- ${p ? p.nombre : "?"} x${it.cantidad} @ €${fmt(it.costoUnitario)} = €${fmt(it.cantidad * it.costoUnitario)}`;
    });
    const total = pedido.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
    const ivaTotal = pedido.items.reduce((a, it) => {
      const prod = productoPorId(it.productoId);
      return a + it.cantidad * it.costoUnitario * (ivaCompraDe(prod) / 100);
    }, 0);
    return `Pedido para ${prov ? prov.nombre : ""}\nFecha: ${pedido.fecha}\nEntrega esperada: ${pedido.fechaEsperada || "por confirmar"}\n\nProductos:\n${lineas.join("\n")}\n\nBase imponible: €${fmt(total)}\nIVA: €${fmt(ivaTotal)}\nTOTAL: €${fmt(total + ivaTotal)}`;
  }

  function mailtoHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `mailto:${prov?.email || ""}?subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailAppHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    return `googlegmail:///co?to=${encodeURIComponent(prov?.email || "")}&subject=${encodeURIComponent("Pedido - " + (prov?.nombre || ""))}&body=${encodeURIComponent(texto)}`;
  }
  function gmailWebHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const params = new URLSearchParams({
      view: "cm", fs: "1",
      to: prov?.email || "",
      su: "Pedido - " + (prov?.nombre || ""),
      body: texto,
    });
    return `https://mail.google.com/mail/?${params.toString()}`;
  }

  const [compartirError, setCompartirError] = useState("");
  async function compartirPedido(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    if (navigator.share) {
      try {
        await navigator.share({
          title: `Pedido - ${prov?.nombre || ""}`,
          text: texto,
        });
        setCompartirError("");
      } catch (e) {
        if (e && e.name !== "AbortError") setCompartirError("No se pudo abrir el menú de compartir.");
      }
    } else {
      setCompartirError("Tu navegador no permite compartir. Usa las otras opciones o copia el texto.");
    }
  }
  function whatsappHref(pedido) {
    const prov = proveedorPorId(pedido.proveedorId);
    const texto = textoPedido(pedido);
    const numero = (prov?.telefono || "").replace(/[^0-9]/g, "");
    return `https://wa.me/${numero}?text=${encodeURIComponent(texto)}`;
  }

  const [correoPedido, setCorreoPedido] = useState(null);

  const estadoColor = { Pendiente: C.amber, Parcial: C.accent, Recibido: C.inkSoft };

  return (
    <div>
      <SectionTitle action={<Btn onClick={() => { if (showForm) { resetForm(); } setShowForm((s) => !s); }}><Plus size={15} /> Nuevo pedido</Btn>}>
        Pedidos de compra
      </SectionTitle>

      {showForm && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3">{editingId ? "Editando pedido pendiente" : "Nuevo pedido"}</div>
          <div>
            <div className="grid md:grid-cols-2 gap-x-4">
              <Field label="Proveedor">
                <select value={proveedorId} onChange={(e) => setProveedorId(e.target.value)} className="w-full rounded-lg px-3 py-2 text-[13px]" style={{ border: `1px solid ${C.line}` }}>
                  <option value="">Selecciona un proveedor</option>
                  {proveedores.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
              </Field>
              <Field label="Fecha esperada de entrega">
                <Input type="date" value={fechaEsperada} onChange={(e) => setFechaEsperada(e.target.value)} />
              </Field>
            </div>

            <div className="mb-2 text-[12px] font-medium" style={{ color: C.inkSoft }}>Productos del pedido</div>
            {items.map((it, idx) => (
              <div key={idx}>
              <div className="flex gap-2 items-center mb-2">
                <select value={it.productoId} onChange={(e) => updateItem(idx, "productoId", e.target.value)} className="flex-1 rounded-lg px-2 py-2 text-[12.5px]" style={{ border: `1px solid ${C.line}` }}>
                  {productos.map((p) => <option key={p.id} value={p.id}>{p.nombre}</option>)}
                </select>
                <Input type="number" style={{ width: 80 }} value={it.cantidad} onChange={(e) => updateItem(idx, "cantidad", e.target.value)} placeholder="Cant." />
                <Input type="number" step="0.01" style={{ width: 100 }} value={it.costoUnitario} onChange={(e) => updateItem(idx, "costoUnitario", e.target.value)} placeholder="Costo u." />
                <button type="button" onClick={() => removeItem(idx)}><X size={16} color={C.inkSoft} /></button>
              </div>
              {(() => {
                const prod = productos.find((pr) => pr.id === it.productoId);
                const uds = udsPorCaja(prod);
                if (!prod || uds <= 1) return null;
                const cajas = Number(it.cantidad) / uds;
                const enteras = Number.isInteger(cajas);
                return (
                  <div className="text-[11px] mb-2 flex items-center gap-2 flex-wrap" style={{ color: enteras ? C.accent : C.amber }}>
                    <span>
                      {fmt(cajas)} caja(s) de {uds} {prod.unidad}
                      {!enteras && " — no es un número exacto de cajas"}
                    </span>
                    <button
                      type="button"
                      onClick={() => updateItem(idx, "cantidad", String(Math.ceil(cajas) * uds))}
                      className="underline"
                      style={{ color: C.accent }}
                    >
                      redondear a {Math.ceil(cajas)} caja(s) = {Math.ceil(cajas) * uds} {prod.unidad}
                    </button>
                  </div>
                );
              })()}
              </div>
            ))}
            <button type="button" onClick={addItemRow} className="text-[12.5px] font-medium mb-4" style={{ color: C.accent }}>+ Añadir producto al pedido</button>

            {error && <div className="text-[12px] mb-3" style={{ color: C.red }}>{error}</div>}
            <div className="flex gap-2">
              <Btn onClick={submit}>{editingId ? "Guardar cambios" : "Crear pedido"}</Btn>
              <Btn variant="ghost" onClick={() => { setShowForm(false); resetForm(); }}>Cancelar</Btn>
            </div>
          </div>
        </Card>
      )}

      {pedidos.length === 0 ? <Empty text="No hay pedidos registrados todavía." /> : (
        <div className="space-y-2">
          {pedidos.map((pe) => {
            const prov = proveedorPorId(pe.proveedorId);
            const total = pe.items.reduce((a, it) => a + it.cantidad * it.costoUnitario, 0);
            const ivaPedido = pe.items.reduce((a, it) => {
              const prod = productoPorId(it.productoId);
              return a + it.cantidad * it.costoUnitario * (ivaCompraDe(prod) / 100);
            }, 0);
            return (
              <Card key={pe.id}>
                <div className="flex items-center justify-between">
                  <div>
                    <div className="font-semibold">{prov ? prov.nombre : "Proveedor eliminado"}</div>
                    <div className="text-[12px]" style={{ color: C.inkSoft }}>
                      Pedido {pe.fecha} · Entrega esperada {pe.fechaEsperada || "—"}
                    </div>
                  </div>
                  <div className="flex items-center gap-3">
                    <Pill color={estadoColor[pe.estado]}>{pe.estado}</Pill>
                    <div className="text-right">
                      <div className="mono font-semibold">€{fmt(total + ivaPedido)}</div>
                      <div className="text-[10.5px] mono" style={{ color: C.inkSoft }}>
                        base €{fmt(total)} + IVA €{fmt(ivaPedido)}
                      </div>
                    </div>
                  </div>
                </div>
                <div className="mt-2 flex gap-2 flex-wrap">
                  <Btn small variant="ghost" onClick={() => { setCorreoPedido(pe); }}><Mail size={13} /> Enviar por correo</Btn>
                  <LinkBtn small href={whatsappHref(pe)}><MessageCircle size={13} /> Enviar por WhatsApp</LinkBtn>
                  {pe.estado === "Pendiente" && (
                    <>
                      <Btn small variant="ghost" onClick={() => openEdit(pe)}>Editar</Btn>
                      <Btn small variant="danger" onClick={() => setConfirmDeleteId(pe.id)}><Trash2 size={13} /> Eliminar</Btn>
                    </>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {confirmDeleteId && (
        <Modal onClose={() => setConfirmDeleteId(null)} title="Eliminar pedido">
          <div className="text-[12.5px] mb-4" style={{ color: C.ink }}>
            ¿Seguro que quieres eliminar este pedido? Esta acción no se puede deshacer.
          </div>
          <div className="flex gap-2">
            <Btn variant="danger" onClick={() => { eliminarPedido(confirmDeleteId); setConfirmDeleteId(null); }}>Sí, eliminar</Btn>
            <Btn variant="ghost" onClick={() => setConfirmDeleteId(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}

      {correoPedido && (
        <Modal onClose={() => setCorreoPedido(null)} title="Enviar pedido por correo">
          <div className="text-[12.5px] mb-3" style={{ color: C.ink }}>
            Prueba los botones de Gmail. Si no se abren, más abajo tienes el correo listo para copiar y pegar.
          </div>
          <div className="flex flex-col gap-2 mb-4">
            <Btn onClick={() => compartirPedido(correoPedido)}><Mail size={14} /> Compartir con Gmail u otra app</Btn>
            <LinkBtn href={gmailWebHref(correoPedido)}><Mail size={14} /> Abrir en Gmail (navegador)</LinkBtn>
            <LinkBtn href={mailtoHref(correoPedido)} newTab={false}><Mail size={14} /> App de correo del sistema</LinkBtn>
          </div>
          {compartirError && <div className="text-[12px] mb-3" style={{ color: C.red }}>{compartirError}</div>}
          <div className="text-[11.5px] mb-2 pt-3" style={{ color: C.inkSoft, borderTop: `1px solid ${C.line}` }}>
            Si ninguno abre, toca cada campo (se selecciona solo) y cópialo:
          </div>
          <Field label="Destinatario">
            <Input readOnly value={proveedorPorId(correoPedido.proveedorId)?.email || ""} onFocus={(e) => e.target.select()} />
          </Field>
          <Field label="Asunto">
            <Input readOnly value={`Pedido - ${proveedorPorId(correoPedido.proveedorId)?.nombre || ""}`} onFocus={(e) => e.target.select()} />
          </Field>
          <Field label="Mensaje">
            <textarea
              readOnly
              value={textoPedido(correoPedido)}
              onFocus={(e) => e.target.select()}
              className="w-full rounded-lg p-2 text-[12px] mono"
              style={{ border: `1px solid ${C.line}`, height: 160, resize: "none" }}
            />
          </Field>
          <Btn variant="ghost" onClick={() => setCorreoPedido(null)}>Cerrar</Btn>
        </Modal>
      )}

      {enviarPedido && (
        <Modal onClose={() => setEnviarPedido(null)} title="Pedido creado — ¿cómo quieres enviarlo?">
          <p className="text-[12.5px] mb-4" style={{ color: C.inkSoft }}>Puedes enviarlo ahora al proveedor o hacerlo más tarde desde la lista de pedidos.</p>
          <div className="flex gap-2">
            <Btn onClick={() => { setCorreoPedido(enviarPedido); setEnviarPedido(null); }}><Mail size={14} /> Correo</Btn>
            <LinkBtn variant="primary" href={whatsappHref(enviarPedido)}><MessageCircle size={14} /> WhatsApp</LinkBtn>
            <Btn variant="ghost" onClick={() => setEnviarPedido(null)}>Ahora no</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

function Recepcion({ pedidos, proveedorPorId, productoPorId, recibirPedido, almacenCongelado }) {
  const [activos, setActivos] = useState({});
  const pendientes = pedidos.filter((p) => p.estado !== "Recibido");

  function setCant(pedidoId, productoId, val) {
    setActivos((s) => ({ ...s, [pedidoId]: { ...(s[pedidoId] || {}), [productoId]: val } }));
  }

  return (
    <div>
      <SectionTitle>Recepción de mercancía</SectionTitle>
      {almacenCongelado && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]">
            <AlertTriangle size={16} color={C.amber} style={{ marginTop: 2, flexShrink: 0 }} />
            <span><b>Almacén congelado por conteo en curso.</b> Las entradas y salidas están bloqueadas hasta que finalices el conteo en Inventario ciego.</span>
          </div>
        </Card>
      )}
      {pendientes.length === 0 ? <Empty text="No hay pedidos pendientes de recibir." /> : (
        <div className="space-y-3">
          {pendientes.map((pe) => {
            const prov = proveedorPorId(pe.proveedorId);
            return (
              <Card key={pe.id}>
                <div className="flex items-center justify-between mb-3">
                  <div className="font-semibold">{prov ? prov.nombre : "—"}</div>
                  <Pill color={C.amber}>{pe.estado}</Pill>
                </div>
                {pe.items.map((it) => {
                  const p = productoPorId(it.productoId);
                  const pendiente = it.cantidad - it.cantidadRecibida;
                  return (
                    <div key={it.productoId} className="flex items-center justify-between py-1.5 border-b last:border-0" style={{ borderColor: C.line }}>
                      <div>
                        <div>{p ? p.nombre : "—"}</div>
                        <div className="text-[11px] mono" style={{ color: C.inkSoft }}>Pedido: {it.cantidad} · Recibido: {it.cantidadRecibida} · Pendiente: {pendiente}</div>
                      </div>
                      <Input
                        type="number"
                        style={{ width: 90 }}
                        placeholder="Cant. hoy"
                        value={(activos[pe.id] || {})[it.productoId] || ""}
                        onChange={(e) => setCant(pe.id, it.productoId, e.target.value)}
                        disabled={pendiente <= 0}
                      />
                    </div>
                  );
                })}
                <div className="mt-3">
                  {!almacenCongelado && (
                    <Btn onClick={() => { recibirPedido(pe.id, activos[pe.id] || {}); setActivos((s) => ({ ...s, [pe.id]: {} })); }}>
                      <CheckCircle2 size={14} /> Confirmar recepción
                    </Btn>
                  )}
                </div>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ================= INVENTARIO CIEGO ================= */
// Texto plano de la hoja de conteo, para enviar por WhatsApp
function textoHojaConteo(productos, proveedores = []) {
  const fecha = new Date().toLocaleDateString("es-ES", { day: "2-digit", month: "2-digit", year: "numeric" });
  const grupos = agruparPorProveedor(productos, proveedores);
  let n = 0;
  const bloques = grupos.map((g) => {
    const lineas = g.items.map((p) => {
      n += 1;
      return `${n}. ${p.nombre} (${p.unidad})\n   Conteo: _____________`;
    });
    return `--- ${g.nombre.toUpperCase()} ---\n\n${lineas.join("\n\n")}`;
  });
  return `HOJA DE CONTEO DE INVENTARIO\nFecha: ${fecha}\n\n${bloques.join("\n\n")}\n\nContado por: ____________________`;
}

function InventarioCiego({ productos, proveedores, conteos, iniciarConteo, actualizarConteoItem, actualizarResponsable, finalizarConteo, aplicarAjustes, productoPorId, crearProductoEnConteo, clasificacionABC, almacenCongelado }) {
  const [activoId, setActivoId] = useState(null);
  const activo = conteos.find((c) => c.id === activoId);
  const [showNuevo, setShowNuevo] = useState(false);
  const blankNuevo = { codigo: "", nombre: "", categoria: "", unidad: "unidad", costo: "", precioVenta: "", stockMinimo: "", ubicacion: "", proveedorId: "", cantidadContada: "" };
  const [nuevo, setNuevo] = useState(blankNuevo);
  const [errorNuevo, setErrorNuevo] = useState("");
  const [motivos, setMotivos] = useState({});
  const [verHoja, setVerHoja] = useState(false);

  const MOTIVOS = ["Rotura", "Merma / caducidad", "Robo o pérdida", "Error de captura", "Devolución no registrada", "Otro"];

  function submitNuevo() {
    if (!nuevo.nombre.trim()) {
      setErrorNuevo("Escribe el nombre del producto.");
      return;
    }
    if (nuevo.cantidadContada === "" || isNaN(Number(nuevo.cantidadContada))) {
      setErrorNuevo("Escribe la cantidad que contaste.");
      return;
    }
    setErrorNuevo("");
    const { cantidadContada, ...datosProducto } = nuevo;
    crearProductoEnConteo(activo.id, datosProducto, cantidadContada);
    setNuevo(blankNuevo);
    setShowNuevo(false);
  }

  // Diferencias valoradas del conteo activo, ordenadas por impacto económico
  const diferencias = !activo ? [] : activo.items
    .map((it) => {
      const p = productoPorId(it.productoId);
      if (!p) return null;
      const cf = valorCF(it);
      if (cf === null) return null;
      const dif = cf - Number(p.stock || 0);
      const impacto = dif * (Number(p.costo) || 0);
      return { producto: p, item: it, cf, dif, impacto };
    })
    .filter(Boolean)
    .sort((a, b) => Math.abs(b.impacto) - Math.abs(a.impacto));

  const impactoTotal = diferencias.reduce((a, d) => a + d.impacto, 0);
  const conDescuadre = diferencias.filter((d) => d.dif !== 0);

  const abcColor = { A: C.red, B: C.amber, C: C.inkSoft };

  return (
    <div>
      <SectionTitle
        action={
          <div className="flex gap-2">
            <Btn variant="ghost" onClick={() => setVerHoja(true)}><ClipboardList size={15} /> Hoja para contar</Btn>
            {!activo && <Btn onClick={() => setActivoId(iniciarConteo())}><Plus size={15} /> Iniciar conteo</Btn>}
          </div>
        }
      >
        Inventario ciego
      </SectionTitle>

      {almacenCongelado && (
        <Card className="mb-4" style={{ background: C.amberSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]">
            <AlertTriangle size={16} color={C.amber} style={{ marginTop: 2, flexShrink: 0 }} />
            <span>
              <b>Almacén congelado.</b> Mientras haya un conteo abierto no se pueden registrar entradas ni salidas, para que el descuadre no salga falseado. Finaliza el conteo para desbloquearlo.
            </span>
          </div>
        </Card>
      )}

      {!activo && (
        <Card className="mb-4" style={{ background: C.accentSoft, border: "none" }}>
          <div className="flex items-start gap-2 text-[12.5px]" style={{ color: C.ink }}>
            <EyeOff size={16} style={{ marginTop: 2, flexShrink: 0 }} />
            <span>
              Durante el conteo no se muestra la existencia del sistema: cuentas físicamente y anotas la cantidad. Al finalizar verás las diferencias contra el stock registrado, valoradas en euros.
            </span>
          </div>
        </Card>
      )}

      {activo && !activo.completado && (
        <Card className="mb-4">
          <div className="text-[13px] font-semibold mb-3 flex items-center gap-1.5"><Eye size={15} /> Captura de conteos</div>

          <div className="grid grid-cols-2 gap-x-3 mb-4">
            <Field label="Contado por"><Input value={(activo.responsables || {}).contadoPor || ""} onChange={(e) => actualizarResponsable(activo.id, "contadoPor", e.target.value)} placeholder="Nombre" /></Field>
            <Field label="Revisado por (opcional)"><Input value={(activo.responsables || {}).revisor || ""} onChange={(e) => actualizarResponsable(activo.id, "revisor", e.target.value)} placeholder="Responsable" /></Field>
          </div>

          <div style={{ overflowX: "auto" }}>
            <table className="w-full text-[12px]" style={{ borderCollapse: "collapse" }}>
              <thead>
                <tr>
                  <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff", width: 30 }}>Nº</th>
                  <th className="py-2 px-2 text-left" style={{ background: C.ink, color: "#fff" }}>Descripción del producto</th>
                  <th className="py-2 px-2 text-center" style={{ background: C.ink, color: "#fff", width: 58 }}>U/M</th>
                  <th className="py-2 px-2 text-center" style={{ background: C.ink, color: "#fff", width: 96 }}>Conteo</th>
                </tr>
              </thead>
              <tbody>
                {(() => {
                  // Mismo orden que la hoja impresa: por proveedor
                  const enConteo = activo.items.map((it) => ({ it, p: productoPorId(it.productoId) })).filter((x) => x.p);
                  const grupos = agruparPorProveedor(enConteo.map((x) => x.p), proveedores);
                  const porId = new Map(enConteo.map((x) => [x.p.id, x.it]));
                  let n = 0;
                  return grupos.map((g) => (
                    <React.Fragment key={g.id}>
                      <tr>
                        <td colSpan={4} className="py-1.5 px-2 font-semibold text-[11.5px]" style={{ background: C.accentSoft, border: `1px solid ${C.line}` }}>
                          {g.nombre}

                      </tr>
                      {g.items.map((p) => {
                        const it = porId.get(p.id);

                        n += 1;
                        const idx = n;
                        const abc = clasificacionABC[p.id] || "C";
