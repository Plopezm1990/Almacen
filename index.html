  }
  function updateFichaCosto(id, data) {
    setFichasCosto((s) => s.map((f) => (f.id === id ? { ...f, ...data } : f)));
  }
  function deleteFichaCosto(id) {
    setFichasCosto((s) => s.filter((f) => f.id !== id));
  }
  // Alérgenos heredados de los ingredientes enlazados al catálogo, más los
  // que se marquen a mano en la propia ficha.
  function alergenosDeFicha(f) {
    const set = new Set(f.alergenosExtra || []);
    (f.componentes || []).forEach((c) => {
      if (!c.productoId) return;
      const p = productos.find((x) => x.id === c.productoId);
      (p?.alergenos || []).forEach((a) => set.add(a));
    });
    return [...set];
  }
  return { addFichaCosto, updateFichaCosto, deleteFichaCosto, alergenosDeFicha };
}

/* ================= LÓGICA: CONTEOS (INVENTARIO CIEGO) ================= */
function crearLogicaConteos({ productos, setProductos, conteos, setConteos, setMovimientos, registrarAuditoria }) {
  function crearProductoEnConteo(conteoId, datos, cantidadContada) {
    const nuevoId = uid();
    const nuevoProducto = {
      id: nuevoId,
      stock: 0,
      codigo: datos.codigo || "",
      nombre: datos.nombre,
      categoria: datos.categoria || "",
      unidad: datos.unidad || "unidad",
      costo: Number(datos.costo) || 0,
      precioVenta: Number(datos.precioVenta) || 0,
      stockMinimo: Number(datos.stockMinimo) || 0,
      ubicacion: datos.ubicacion || "",
      proveedorId: datos.proveedorId || "",
    };
    setProductos((s) => [...s, nuevoProducto]);
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId ? { ...c, items: [...c.items, { productoId: nuevoId, cantidadContada }] } : c
      )
    );
  }

  function iniciarConteo(ambito = "total") {
    const productosDelConteo = ambito === "piso_venta"
      ? productos.filter((p) => p.tipo === "elaborado" || Number(p.precioVenta) > 0)
      : productos;
    const conteo = {
      id: uid(),
      fecha: todayISO(),
      completado: false,
      ambito,
      responsables: { contadoPor: "", revisor: "" },
      items: productosDelConteo.map((p) => ({ productoId: p.id, conteo: "" })),
    };
    setConteos((s) => [conteo, ...s]);
    return conteo.id;
  }
  function actualizarConteoItem(conteoId, productoId, campo, valor) {
    setConteos((s) =>
      s.map((c) =>
        c.id === conteoId
          ? { ...c, items: c.items.map((it) => (it.productoId === productoId ? { ...it, [campo]: valor } : it)) }
          : c
      )
    );
  }
  function actualizarResponsable(conteoId, campo, valor) {
    setConteos((s) =>
      s.map((c) => (c.id === conteoId ? { ...c, responsables: { ...(c.responsables || {}), [campo]: valor } } : c))
    );
  }
  function finalizarConteo(conteoId) {
    setConteos((s) => s.map((c) => (c.id === conteoId ? { ...c, completado: true } : c)));
  }

  // Compara el conteo contra el número del sistema correcto según el ámbito
  // (total / piso de venta / almacén) y aplica la diferencia como ajuste real.
  function aplicarAjustes(conteoId, motivos = {}) {
    const conteo = conteos.find((c) => c.id === conteoId);
    if (!conteo) return;
    const esPisoVenta = conteo.ambito === "piso_venta";
    const esAlmacen = conteo.ambito === "almacen";
    const nuevosMov = [];
    setProductos((s) =>
      s.map((p) => {
        const item = conteo.items.find((it) => it.productoId === p.id);
        const valorFinal = item ? valorCF(item) : null;
        if (valorFinal === null) return p;

        if (esPisoVenta) {
          // El conteo es solo del mostrador: se compara contra lo que había
          // en piso de venta. La diferencia se descuenta también del total
          // de la empresa, porque sin más información, lo que falta en el
          // mostrador se trata como merma real, no como "está en la trastienda".
          const anteriorPiso = Number(p.stockPisoVenta) || 0;
          const dif = valorFinal - anteriorPiso;
          if (dif !== 0) {
            nuevosMov.push({
              id: uid(), productoId: p.id, tipo: "ajuste", cantidad: dif,
              fecha: todayISO(),
              motivo: motivos[p.id] || "Sin especificar",
              referencia: `Ajuste por inventario (piso de venta) · ${motivos[p.id] || "Sin especificar"}`,
            });
          }
          const nuevoTotal = Math.max(0, (Number(p.stock) || 0) + dif);
          return { ...p, stock: nuevoTotal, stockPisoVenta: Math.min(valorFinal, nuevoTotal) };
        }

        if (esAlmacen) {
          // El conteo es solo de la trastienda: para lo que se vende, se
          // compara contra el total menos lo que ya está en el piso de venta
          // (esa parte no se toca). Para materia prima, consumibles y
          // utillaje, que no tienen piso de venta, es el mismo total de siempre.
          const enPiso = Number(p.stockPisoVenta) || 0;
          const anteriorAlmacen = Math.max(0, (Number(p.stock) || 0) - enPiso);
          const dif = valorFinal - anteriorAlmacen;
          if (dif !== 0) {
            nuevosMov.push({
              id: uid(), productoId: p.id, tipo: "ajuste", cantidad: dif,
              fecha: todayISO(),
              motivo: motivos[p.id] || "Sin especificar",
              referencia: `Ajuste por inventario (almacén) · ${motivos[p.id] || "Sin especificar"}`,
            });
          }
          const nuevoTotal = Math.max(0, (Number(p.stock) || 0) + dif);
          return { ...p, stock: nuevoTotal, stockPisoVenta: Math.min(enPiso, nuevoTotal) };
        }

        const dif = valorFinal - Number(p.stock || 0);
        if (dif !== 0) {
          nuevosMov.push({
            id: uid(), productoId: p.id, tipo: "ajuste", cantidad: dif,
            fecha: todayISO(),
            motivo: motivos[p.id] || "Sin especificar",
            referencia: `Ajuste por inventario · ${motivos[p.id] || "Sin especificar"}`,
          });
        }
        // Si el conteo es del total, la parte de piso de venta no puede
        // quedar por encima del nuevo total.
        const nuevoStockPiso = Math.min(Number(p.stockPisoVenta) || 0, valorFinal);
        return { ...p, stock: valorFinal, stockPisoVenta: nuevoStockPiso };
      })
    );
    if (nuevosMov.length) {
      setMovimientos((s) => [...nuevosMov, ...s]);
      const totalAjuste = nuevosMov.reduce((a, m) => a + Math.abs(m.cantidad), 0);
      registrarAuditoria("Aplicar ajustes de inventario", `${nuevosMov.length} producto(s), ${totalAjuste} unidad(es) en total`);
    }
  }

  return { crearProductoEnConteo, iniciarConteo, actualizarConteoItem, actualizarResponsable, finalizarConteo, aplicarAjustes };
}

/* ================= LÓGICA: PRODUCCIÓN ================= */
// Convierte una ficha de costo en una orden de fabricación real: descuenta
// los ingredientes según lo que de verdad se gastó (no la teoría de la
// receta, para que las mermas de producción no se pierdan de vista) y da
// entrada al producto elaborado con el coste real de ESTA tanda, promediado
// con el stock que ya hubiera.
function crearLogicaProduccion({ fichasCosto, productos, setProductos, setMovimientos, setOrdenesProduccion, registrarAuditoria }) {
  function producir({ fichaId, unidadesDeseadas, unidadesBuenas, ingredientesReales, empaqueReal, manoObraReal, gastosGeneralesReal, notas }) {
    const ficha = fichasCosto.find((f) => f.id === fichaId);
    if (!ficha) return { ok: false, error: "No se encontró la ficha de costo." };
    if (!ficha.productoVinculadoId) return { ok: false, error: "Esta ficha no tiene un producto de venta enlazado todavía." };

    // No basta con que la ficha tenga un enlace: hay que comprobar que el
    // producto existe de verdad. Si apunta a uno borrado, sin esta comprobación
    // se gastarían los ingredientes sin crear nada — y encima diciendo que todo
    // fue bien. Se valida ANTES de tocar ningún stock.
    const elaboradoOriginal = productos.find((p) => p.id === ficha.productoVinculadoId);
    if (!elaboradoOriginal) {
      return {
        ok: false,
        error: "El producto de venta de esta ficha ya no existe (puede que se borrara). Ve a Fichas de costo, edita esta receta y vuelve a enlazarla con un producto, o crea uno nuevo con \"Crear producto de venta\". No se ha descontado ningún ingrediente.",
      };
    }

    // El id se crea antes que los movimientos, para poder marcarlos con él y
    // luego encontrarlos con exactitud si hay que anular esta producción.
    const ordenId = uid();
    const nuevosMov = [];
    let lista = [...productos];
    let costoIngredientes = 0;

    ingredientesReales.forEach((ing) => {
      if (!ing.productoId || !(Number(ing.cantidadReal) > 0)) return;
      const prod = lista.find((p) => p.id === ing.productoId);
      if (!prod) return;
      const costoUnitario = Number(prod.costo) || 0;
      costoIngredientes += Number(ing.cantidadReal) * costoUnitario;
      lista = lista.map((p) => (p.id === prod.id ? { ...p, stock: Math.max(0, (Number(p.stock) || 0) - Number(ing.cantidadReal)) } : p));
      nuevosMov.push({
        id: uid(), ordenId, productoId: prod.id, tipo: "salida", cantidad: Number(ing.cantidadReal),
        fecha: todayISO(), motivo: "Producción", costoUnitario,
        referencia: `Producción: ${ficha.nombre}`,
      });
    });

    const buenas = Number(unidadesBuenas) || 0;
    if (buenas <= 0) return { ok: false, error: "Indica cuántas unidades buenas salieron." };

    const costoLoteTotal = costoIngredientes + (Number(empaqueReal) || 0) + (Number(manoObraReal) || 0) + (Number(gastosGeneralesReal) || 0);
    const costoUnitarioLote = costoLoteTotal / buenas;

    const elaborado = lista.find((p) => p.id === ficha.productoVinculadoId);
    if (elaborado) {
      const stockAnterior = Number(elaborado.stock) || 0;
      const costoAnterior = Number(elaborado.costo) || 0;
      const stockTotal = stockAnterior + buenas;
      const costoPonderado = stockTotal > 0 ? (stockAnterior * costoAnterior + buenas * costoUnitarioLote) / stockTotal : costoUnitarioLote;
      lista = lista.map((p) => (p.id === elaborado.id ? { ...p, stock: stockTotal, costo: Number(costoPonderado.toFixed(4)) } : p));
      nuevosMov.push({
        id: uid(), ordenId, productoId: elaborado.id, tipo: "entrada", cantidad: buenas,
        fecha: todayISO(), referencia: `Producción: ${ficha.nombre}`, costoUnitario: costoUnitarioLote,
      });
    }

    setProductos(lista);
    setMovimientos((s) => [...nuevosMov, ...s]);

    const orden = {
      id: ordenId, fecha: todayISO(), hora: new Date().toTimeString().slice(0, 5),
      fichaId, fichaNombre: ficha.nombre, productoVinculadoId: ficha.productoVinculadoId,
      unidadesDeseadas: Number(unidadesDeseadas) || 0, unidadesBuenas: buenas,
      ingredientes: ingredientesReales.map((i) => ({ ...i })),
      empaqueReal: Number(empaqueReal) || 0, manoObraReal: Number(manoObraReal) || 0, gastosGeneralesReal: Number(gastosGeneralesReal) || 0,
      costoLoteTotal, costoUnitarioLote, notas: notas || "",
    };
    setOrdenesProduccion((s) => [orden, ...s]);
    registrarAuditoria("Producción registrada", `${ficha.nombre} · ${buenas} unidad(es) · coste €${costoUnitarioLote.toFixed(4)}/ud`);

    return { ok: true, orden };
  }

  // Deshace una producción: devuelve los ingredientes al almacén, quita las
  // unidades elaboradas y borra sus movimientos.
  //
  // Sobre el coste: al producir, el coste de la tanda se promedió con el que
  // ya tenía el producto. Al anular se hace la cuenta inversa, que es exacta
  // mientras no haya habido otra entrada o producción de ese mismo producto
  // por medio. Si la ha habido, el coste queda aproximado — por eso conviene
  // anular pronto, y por eso avisamos en pantalla.
  function anularProduccion(orden) {
    const nuevosMov = [];
    let lista = [...productos];

    // 1. Devolver los ingredientes que se habían gastado
    (orden.ingredientes || []).forEach((ing) => {
      if (!ing.productoId || !(Number(ing.cantidadReal) > 0)) return;
      lista = lista.map((p) =>
        p.id === ing.productoId ? { ...p, stock: (Number(p.stock) || 0) + Number(ing.cantidadReal) } : p
      );
    });

    // 2. Quitar las unidades elaboradas y deshacer el promedio de coste
    const elaboradoId = orden.productoVinculadoId ||
      (fichasCosto.find((f) => f.id === orden.fichaId) || {}).productoVinculadoId;
    if (elaboradoId) {
      lista = lista.map((p) => {
        if (p.id !== elaboradoId) return p;
        const buenas = Number(orden.unidadesBuenas) || 0;
        const stockActual = Number(p.stock) || 0;
        const costoActual = Number(p.costo) || 0;
        const costoLote = Number(orden.costoUnitarioLote) || 0;
        const stockRestante = stockActual - buenas;
        if (stockRestante > 0) {
          const costoPrevio = (stockActual * costoActual - buenas * costoLote) / stockRestante;
          return { ...p, stock: stockRestante, costo: Number(Math.max(0, costoPrevio).toFixed(4)) };
        }
        // Si ya no queda nada de esa tanda (todo vendido), no se puede
        // recalcular el coste anterior: se deja el que está.
        return { ...p, stock: Math.max(0, stockRestante) };
      });
    }

    setProductos(lista);
    // 3. Borrar los movimientos de esta producción
    setMovimientos((s) => s.filter((m) => m.ordenId !== orden.id));
    // 4. Quitar la orden del historial
    setOrdenesProduccion((s) => s.filter((o) => o.id !== orden.id));

    registrarAuditoria(
      "Anular producción",
      `${orden.fichaNombre} · ${orden.unidadesBuenas} unidad(es) del ${orden.fecha}`
    );
    return { ok: true };
  }

  return { producir, anularProduccion };
}

/* ================= LÓGICA: ENCARGOS ================= */
function crearLogicaEncargos({ encargos, setEncargos, registrarAuditoria, productos, setProductos, setMovimientos }) {
  function addEncargo(data) {
    setEncargos((s) => [{ id: uid(), estado: "Pendiente", fechaCreacion: todayISO(), ...data }, ...s]);
  }
  function updateEncargo(id, data) {
    setEncargos((s) => s.map((e) => (e.id === id ? { ...e, ...data } : e)));
  }
  function deleteEncargo(id) {
    const e = encargos.find((x) => x.id === id);
    registrarAuditoria("Eliminar encargo", e ? `${e.numero || "s/n"}` : id);
    setEncargos((s) => s.filter((e) => e.id !== id));
  }

  // Entregar un encargo descuenta stock y registra la venta, para que
  // alimente Resultados igual que cualquier otra venta del mostrador.
  function entregarEncargo(encargo, medioPago = "Efectivo") {
    const nuevosMov = [];
    let lista = [...productos];
    (encargo.lineas || []).forEach((ln) => {
      if (!ln.productoId) return;
      const cant = Number(ln.cantidad) || 0;
      if (cant <= 0) return;
      const prod = lista.find((p) => p.id === ln.productoId);
      if (!prod) return;
      const costoUnitario = Number(prod.costo) || 0;
      const ingresoUnitario = Number(ln.precioUnitario) || precioNeto(prod);
      lista = lista.map((p) =>
        p.id === prod.id
          ? {
              ...p,
              stock: Math.max(0, (Number(p.stock) || 0) - cant),
              stockPisoVenta: Math.max(0, (Number(p.stockPisoVenta) || 0) - cant),
            }
          : p
      );
      nuevosMov.push({
        id: uid(), productoId: prod.id, tipo: "salida", cantidad: cant,
        fecha: todayISO(), motivo: "Venta", costoUnitario, ingresoUnitario,
        ivaVentaAplicado: ivaDe(prod), medioPago,
        referencia: `Encargo ${encargo.numero || ""}`.trim(),
        encargoId: encargo.id, clienteId: encargo.clienteId,
      });
    });
    setProductos(lista);
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
    updateEncargo(encargo.id, { estado: "Entregado", fechaEntregaReal: todayISO() });
  }

  return { addEncargo, updateEncargo, deleteEncargo, entregarEncargo };
}

/* ================= LÓGICA: VENTA RÁPIDA Y TRASPASOS ================= */
// Venta rápida de mostrador: mismo motor que entregarEncargo, pero sin
// cliente ni encargo — es para el cara a cara del día a día. No emite
// ningún tique fiscal, solo registra la venta para el control interno.
// Descuenta del piso de venta (de ahí sale físicamente lo que se vende),
// y también del total de la empresa.
//
// Hay dos caminos para vender, y se elige solo según haya conexión o no:
//   - CON conexión: se llama al RPC "descontar_stock_carrito" en Supabase,
//     que comprueba y descuenta todo de forma atómica — si dos móviles
//     venden la última unidad a la vez, solo uno de los dos tiene éxito.
//   - SIN conexión (o si el RPC no responde a tiempo): se sigue vendiendo
//     igual que siempre, en el propio dispositivo, para no dejar de poder
//     cobrar solo porque falle internet. Ese camino tiene el riesgo pequeño
//     de sobreventa que ya conocíamos, y que se acepta a propósito para no
//     perder la posibilidad de vender sin conexión.
function crearLogicaVenta({ productos, setProductos, setMovimientos }) {
  // El camino de siempre: todo en el propio dispositivo, sin depender de
  // ninguna llamada de red. Se usa sin conexión, o como respaldo si el
  // camino atómico falla por cualquier motivo que no sea "no hay stock".
  function venderLocal(lineas, medioPago, detallePago) {
    const nuevosMov = [];
    let lista = [...productos];
    let totalVenta = 0;
    if (detallePago) {
      (lineas || []).forEach((ln) => {
        const cant = Number(ln.cantidad) || 0;
        const prod = productos.find((p) => p.id === ln.productoId);
        if (!prod || cant <= 0) return;
        totalVenta += cant * precioNeto(prod) * (1 + ivaDe(prod) / 100);
      });
    }
    (lineas || []).forEach((ln) => {
      if (!ln.productoId) return;
      const cant = Number(ln.cantidad) || 0;
      if (cant <= 0) return;
      const prod = lista.find((p) => p.id === ln.productoId);
      if (!prod) return;
      const costoUnitario = Number(prod.costo) || 0;
      const ingresoUnitario = precioNeto(prod);
      lista = lista.map((p) =>
        p.id === prod.id
          ? {
              ...p,
              stock: Math.max(0, (Number(p.stock) || 0) - cant),
              stockPisoVenta: Math.max(0, (Number(p.stockPisoVenta) || 0) - cant),
            }
          : p
      );
      const mov = {
        id: uid(), productoId: prod.id, tipo: "salida", cantidad: cant,
        fecha: todayISO(), motivo: "Venta", costoUnitario, ingresoUnitario,
        ivaVentaAplicado: ivaDe(prod), medioPago,
        referencia: "Venta rápida",
      };
      if (detallePago && totalVenta > 0) {
        const importeLinea = cant * ingresoUnitario * (1 + ivaDe(prod) / 100);
        const proporcion = importeLinea / totalVenta;
        mov.detallePago = {
          efectivo: Number((detallePago.efectivo * proporcion).toFixed(4)),
          tarjeta: Number((detallePago.tarjeta * proporcion).toFixed(4)),
        };
      }
      nuevosMov.push(mov);
    });
    setProductos(lista);
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);
    return { ok: true, n: nuevosMov.length, modo: "local" };
  }

  async function venderCarrito(lineas, medioPago = "Efectivo", detallePago = null) {
    const hayConexion =
      typeof window !== "undefined" && window.__nubeActiva && typeof window.getSupabaseClient === "function";

    if (!hayConexion) {
      return venderLocal(lineas, medioPago, detallePago);
    }

    try {
      const ventaId = uid();
      let totalVenta = 0;
      (lineas || []).forEach((ln) => {
        const cant = Number(ln.cantidad) || 0;
        const prod = productos.find((p) => p.id === ln.productoId);
        if (!prod || cant <= 0) return;
        totalVenta += cant * precioNeto(prod) * (1 + ivaDe(prod) / 100);
      });

      const lineasParaRpc = (lineas || [])
        .filter((ln) => ln.productoId && Number(ln.cantidad) > 0)
        .map((ln) => {
          const prod = productos.find((p) => p.id === ln.productoId);
          const cant = Number(ln.cantidad);
          const costoUnitario = prod ? Number(prod.costo) || 0 : 0;
          const ingresoUnitario = prod ? precioNeto(prod) : 0;
          const ivaAplicado = prod ? ivaDe(prod) : 0;
          const datosLinea = {
            productoId: ln.productoId, cantidad: cant, motivo: "Venta",
            costoUnitario, ingresoUnitario, ivaVentaAplicado: ivaAplicado,
            medioPago, referencia: "Venta rápida",
          };
          if (detallePago && totalVenta > 0 && prod) {
            const importeLinea = cant * ingresoUnitario * (1 + ivaAplicado / 100);
            const proporcion = importeLinea / totalVenta;
            datosLinea.detallePago = {
              efectivo: Number((detallePago.efectivo * proporcion).toFixed(4)),
              tarjeta: Number((detallePago.tarjeta * proporcion).toFixed(4)),
            };
          }
          return datosLinea;
        });

      if (lineasParaRpc.length === 0) return { ok: false, error: "Carrito vacío" };

      const supabase = await window.getSupabaseClient();
      const r = await Promise.race([
        supabase.rpc("descontar_stock_carrito", { p_lineas: lineasParaRpc, p_venta_id: ventaId }),
        new Promise((_, reject) => setTimeout(() => reject(new Error("El RPC tardó demasiado en responder")), 6000)),
      ]);

      if (r.error) throw r.error;

      if (r.data && r.data.ok === false) {
        // Rechazo real (sin stock, etc.) — no se cobra nada, se avisa tal cual.
        return { ok: false, error: r.data.error, productoId: r.data.productoId, disponible: r.data.disponible };
      }

      // Éxito por el camino atómico: se relee de la nube para que el estado
      // local quede exactamente igual a lo que de verdad se guardó, en vez
      // de intentar reconstruirlo a mano con lo que ya teníamos en memoria.
      const [rProd, rMov] = await Promise.all([
        supabase.from("almacen_kv").select("value").eq("key", "productos").maybeSingle(),
        supabase.from("movimientos_registro").select("datos").order("creado_en", { ascending: false }),
      ]);
      if (!rProd.error && rProd.data) setProductos(rProd.data.value);
      if (!rMov.error && rMov.data) setMovimientos(rMov.data.map((fila) => fila.datos));

      return { ok: true, n: lineasParaRpc.length, modo: "atomico" };
    } catch (e) {
      // Sin conexión de verdad, tiempo agotado, o cualquier fallo de red:
      // se sigue pudiendo vender, igual que si nunca hubiera existido el
      // camino atómico.
      return venderLocal(lineas, medioPago, detallePago);
    }
  }

  return { venderCarrito };
}

// No cambia el total de la empresa (stock), solo mueve cuánto de ese total
// está en el piso de venta ahora mismo. Se guarda aparte de "movimientos"
// a propósito: no es una entrada ni una salida real, es solo dónde vive.
function crearLogicaTraspasos({ productos, setProductos, setTraspasos }) {
  function traspasarStock(productoId, cantidad, direccion) {
    const cant = Number(cantidad) || 0;
    if (cant <= 0) return { ok: false, error: "Indica una cantidad mayor que cero." };
    const prod = productos.find((p) => p.id === productoId);
    if (!prod) return { ok: false, error: "Producto no encontrado." };

    const enPiso = Number(prod.stockPisoVenta) || 0;
    const total = Number(prod.stock) || 0;
    const enAlmacen = total - enPiso;

    if (direccion === "a_piso" && cant > enAlmacen) {
      return { ok: false, error: `Solo hay ${fmt(enAlmacen)} ${prod.unidad} en el almacén.` };
    }
    if (direccion === "a_almacen" && cant > enPiso) {
      return { ok: false, error: `Solo hay ${fmt(enPiso)} ${prod.unidad} en el piso de venta.` };
    }

    const nuevoEnPiso = direccion === "a_piso" ? enPiso + cant : enPiso - cant;
    setProductos((s) => s.map((p) => (p.id === productoId ? { ...p, stockPisoVenta: nuevoEnPiso } : p)));
    setTraspasos((s) => [
      { id: uid(), productoId, nombre: prod.nombre, cantidad: cant, direccion, fecha: todayISO(), hora: new Date().toTimeString().slice(0, 5) },
      ...s,
    ]);
    return { ok: true };
  }
  return { traspasarStock };
}

/* ================= LÓGICA: SEGURIDAD (ROLES Y ACCESO) ================= */
// Esto es control de acceso a nivel de pantalla, no un sistema de permisos
// fino: sigue siendo un código guardado en el propio teléfono, no una cuenta
// de usuario real con contraseña y servidor. Sirve para que un empleado no
// vea márgenes ni sueldos, y para que la Auditoría diga quién hizo qué —
// no para proteger datos frente a alguien con acceso técnico al dispositivo.
function crearLogicaSeguridad({ pinPropietario, setPinPropietario, empleados, setModoEmpleado, setUsuarioActivoId }) {
  function activarModoEmpleado() {
    if (!pinPropietario) return false;
    setModoEmpleado(true);
    return true;
  }
  // Un empleado se identifica con su propio código (el que le pusiste en su
  // ficha de Personal). No hace falta el PIN del propietario para esto —
  // entrar en modo restringido nunca es peligroso, solo salir de él.
  function entrarComoEmpleado(empleadoId, pinIntento) {
    const emp = empleados.find((e) => e.id === empleadoId && e.activo !== false);
    if (!emp || !emp.pin || pinIntento !== emp.pin) return false;
    setModoEmpleado(true);
    setUsuarioActivoId(empleadoId);
    return true;
  }
  function salirModoEmpleado(pinIntento) {
    // Si nunca se configuró un PIN de propietario, no hay nada que proteger:
    // se puede salir siempre, para no dejar a nadie encerrado por accidente.
    if (!pinPropietario || pinIntento === pinPropietario) {
      setModoEmpleado(false);
      setUsuarioActivoId(null);
      return true;
    }
    return false;
  }
  function establecerPin(nuevoPin) {
    setPinPropietario(nuevoPin);
  }
  return { activarModoEmpleado, entrarComoEmpleado, salirModoEmpleado, establecerPin };
}

/* ================= LÓGICA: ALBARANES ================= */
function crearLogicaAlbaranes({
  catalogoProv, setCatalogoProv,
  albaranes, setAlbaranes,
  productos, setProductos,
  setMovimientos, setPedidos,
  registrarAuditoria, proveedorPorId,
  setPrefillAlbaran, setTab,
}) {
  // Clave del catálogo aprendido: cada proveedor tiene sus propios códigos
  const claveCat = (proveedorId, codigo) => `${proveedorId}::${String(codigo || "").trim().toUpperCase()}`;

  function buscarEnCatalogo(proveedorId, codigo) {
    return catalogoProv[claveCat(proveedorId, codigo)] || null;
  }

  // Registra la referencia del proveedor para no volver a teclearla nunca más
  function aprenderReferencia(proveedorId, codigo, datos) {
    if (!codigo) return;
    setCatalogoProv((s) => ({ ...s, [claveCat(proveedorId, codigo)]: { ...(s[claveCat(proveedorId, codigo)] || {}), ...datos } }));
  }

  function guardarAlbaran(alb) {
    setAlbaranes((s) => {
      const existe = s.some((a) => a.id === alb.id);
      return existe ? s.map((a) => (a.id === alb.id ? alb : a)) : [alb, ...s];
    });
  }

  function eliminarAlbaran(id) {
    const a = albaranes.find((x) => x.id === id);
    registrarAuditoria("Eliminar albarán", a ? `${proveedorPorId(a.proveedorId)?.nombre || "—"} · ${a.numero || "s/n"}` : id);
    setAlbaranes((s) => s.filter((a) => a.id !== id));
  }

  function marcarPagada(id, pagada) {
    const a = albaranes.find((x) => x.id === id);
    registrarAuditoria(pagada ? "Marcar factura pagada" : "Marcar factura pendiente", a ? `${proveedorPorId(a.proveedorId)?.nombre || "—"} · ${a.numeroFactura || a.numero || "s/n"}` : id);
    setAlbaranes((s) => s.map((a) => (a.id === id ? { ...a, pagada, fechaPago: pagada ? todayISO() : "" } : a)));
  }

  // Confirmar = dar entrada real: crea/actualiza productos, sube stock y deja rastro.
  // Se calcula TODO de forma síncrona antes de tocar el estado; si no, el albarán
  // se guardaba vacío porque las líneas aún no estaban resueltas.
  function confirmarAlbaran(alb) {
    const avisos = [];
    const nuevosMov = [];
    const lineasResueltas = [];
    let lista = [...productos];

    alb.lineas.forEach((ln) => {
      const uds = Number(ln.udsPorCaja) > 0 ? Number(ln.udsPorCaja) : 1;
      const cantidad = Number(ln.cantidad) || 0;
      const importe = Number(ln.importe) || 0;
      const unidadesTotales = ln.tipoUnidad === "peso" ? cantidad : cantidad * uds;
      const costoUnitario = unidadesTotales > 0 ? importe / unidadesTotales : 0;

      const cat = catalogoProv[claveCat(alb.proveedorId, ln.codigoProveedor)];
      let prod = null;
      if (ln.productoId) prod = lista.find((p) => p.id === ln.productoId);
      if (!prod && cat && cat.productoId) prod = lista.find((p) => p.id === cat.productoId);

      if (prod) {
        const stockAnterior = Number(prod.stock) || 0;
        const costoAnterior = Number(prod.costo) || 0;
        if (costoAnterior > 0 && costoUnitario > 0) {
          const variacion = ((costoUnitario - costoAnterior) / costoAnterior) * 100;
          if (Math.abs(variacion) >= 3) {
            avisos.push({ nombre: prod.nombre, anterior: costoAnterior, nuevo: costoUnitario, variacion });
          }
        }
        // Coste promedio ponderado: lo que ya tenías en stock no se revalúa
        // al precio nuevo de golpe, se pondera con lo que entra. Así el coste
        // no se infla ni se deshincha de un día para otro.
        const stockTotal = stockAnterior + unidadesTotales;
        const costoPonderado = stockTotal > 0
          ? (stockAnterior * costoAnterior + unidadesTotales * costoUnitario) / stockTotal
          : costoUnitario;
        lista = lista.map((p) =>
          p.id === prod.id
            ? {
                ...p,
                stock: stockTotal,
                costo: costoUnitario > 0 ? Number(costoPonderado.toFixed(4)) : p.costo,
                ivaCompra: Number(ln.ivaPct) || p.ivaCompra || 10,
                udsPorCaja: uds,
                proveedorId: p.proveedorId || alb.proveedorId,
                // Cuánto trae cada bulto (ej. 300 g por bandeja), para poder
                // usarlo luego en Fichas de costo con la unidad de receta,
                // sin cambiar cómo se cuenta el stock (que sigue siendo por bulto).
                contenido: ln.contenido || p.contenido || "",
                unidadContenido: ln.unidadContenido || p.unidadContenido || "",
              }
            : p
        );
        lineasResueltas.push({ ...ln, productoId: prod.id, unidadesEntradas: unidadesTotales });
        nuevosMov.push({
          id: uid(), productoId: prod.id, tipo: "entrada", cantidad: unidadesTotales,
          fecha: alb.fecha, albaranId: alb.id,
          referencia: `Albarán ${alb.numero || "s/n"}${ln.lote ? " · lote " + ln.lote : ""}`,
        });
      } else {
        const nuevoId = uid();
        const nuevo = {
          id: nuevoId,
          codigo: ln.codigoProveedor || "",
          nombre: ln.descripcion || "Sin descripción",
          categoria: "",
          unidad: ln.unidad || "unidad",
          costo: Number(costoUnitario.toFixed(4)),
          ivaCompra: Number(ln.ivaPct) || 10,
          udsPorCaja: uds,
          precioVenta: 0,
          ivaVenta: 10,
          stock: unidadesTotales,
          stockMinimo: 0,
          ubicacion: "",
          proveedorId: alb.proveedorId,
          contenido: ln.contenido || "",
          unidadContenido: ln.unidadContenido || "",
        };
        lista = [...lista, nuevo];
        lineasResueltas.push({ ...ln, productoId: nuevoId, unidadesEntradas: unidadesTotales });
        nuevosMov.push({
          id: uid(), productoId: nuevoId, tipo: "entrada", cantidad: unidadesTotales,
          fecha: alb.fecha, albaranId: alb.id,
          referencia: `Albarán ${alb.numero || "s/n"} · alta automática`,
        });
      }
    });

    setProductos(lista);
    if (nuevosMov.length) setMovimientos((s) => [...nuevosMov, ...s]);

    setCatalogoProv((prev) => {
      const copia = { ...prev };
      lineasResueltas.forEach((ln) => {
        if (!ln.codigoProveedor) return;
        copia[claveCat(alb.proveedorId, ln.codigoProveedor)] = {
          descripcion: ln.descripcion,
          unidad: ln.unidad,
          udsPorCaja: Number(ln.udsPorCaja) || 1,
          ivaPct: Number(ln.ivaPct) || 10,
          tipoUnidad: ln.tipoUnidad || "unidad",
          precioPor: ln.precioPor || "bulto",
          contenido: ln.contenido || "",
          unidadContenido: ln.unidadContenido || "",
          productoId: ln.productoId,
          ultimoPrecio: Number(ln.precioBruto) || 0,
          ultimoDto: Number(ln.dtoPct) || 0,
        };
      });
      return copia;
    });

    // Si el albarán viene de un pedido, se marca lo recibido y se cierra si procede
    if (alb.pedidoId) {
      setPedidos((prev) =>
        prev.map((pe) => {
          if (pe.id !== alb.pedidoId) return pe;
          const items = pe.items.map((it) => {
            const suyas = lineasResueltas.filter((ln) => ln.productoId === it.productoId);
            if (!suyas.length) return it;
            const recibidas = suyas.reduce((a, ln) => a + (Number(ln.unidadesEntradas) || 0), 0);
            return { ...it, cantidadRecibida: (Number(it.cantidadRecibida) || 0) + recibidas };
          });
          const completo = items.every((it) => (Number(it.cantidadRecibida) || 0) >= (Number(it.cantidad) || 0));
          const algo = items.some((it) => (Number(it.cantidadRecibida) || 0) > 0);
          return { ...pe, items, estado: completo ? "Recibido" : algo ? "Parcial" : "Pendiente" };
        })
      );
    }

    guardarAlbaran({ ...alb, lineas: lineasResueltas, estado: "confirmado", avisosPrecio: avisos });
    if (avisos.length) {
      registrarAuditoria(
        "Variación de precio en albarán",
        `${proveedorPorId(alb.proveedorId)?.nombre || "—"} · ${avisos.map((a) => `${a.nombre} ${a.variacion > 0 ? "+" : ""}${fmt(a.variacion)}%`).join(", ")}`
      );
    }
    return avisos;
  }

  // Deshace la entrada de un albarán: resta el stock que sumó y borra sus movimientos,
  // dejándolo en borrador para poder corregirlo.
  function anularAlbaran(alb) {
    registrarAuditoria("Anular entrada de albarán", `${proveedorPorId(alb.proveedorId)?.nombre || "—"} · ${alb.numero || "s/n"}`);
    setProductos((prev) =>
      prev.map((p) => {
        const suyas = alb.lineas.filter((ln) => ln.productoId === p.id);
        if (!suyas.length) return p;
        const restar = suyas.reduce((a, ln) => a + (Number(ln.unidadesEntradas) || 0), 0);
        return { ...p, stock: Math.max(0, (Number(p.stock) || 0) - restar) };
      })
    );
    setMovimientos((prev) => prev.filter((m) => m.albaranId !== alb.id));
    guardarAlbaran({ ...alb, estado: "borrador", avisosPrecio: [] });
  }

  // Desde un pedido pendiente se abre un albarán ya rellenado con lo pedido,
  // para que solo tengas que corregir lo que realmente ha llegado.
  function recibirConAlbaran(pedido) {
    const lineas = pedido.items.map((it) => {
      const prod = productos.find((x) => x.id === it.productoId);
      const pendiente = Math.max(0, (Number(it.cantidad) || 0) - (Number(it.cantidadRecibida) || 0));
      const uds = prod && Number(prod.udsPorCaja) > 0 ? Number(prod.udsPorCaja) : 1;
      return {
        codigoProveedor: prod ? prod.codigo || "" : "",
        descripcion: prod ? prod.nombre : "",
        unidad: prod ? prod.unidad : "unidad",
        tipoUnidad: "unidad",
        cantidad: uds > 1 ? pendiente / uds : pendiente,
        udsPorCaja: uds,
        precioPor: "unidad",
        precioBruto: it.costoUnitario,
        dtoPct: "",
        importe: "",
        ivaPct: prod ? ivaCompraDe(prod) : 10,
        lote: "",
        caducidad: "",
        contenido: "",
        unidadContenido: "",
        productoId: it.productoId,
        cantidadPedida: pendiente,
      };
    });
    setPrefillAlbaran({
      id: uid(),
      proveedorId: pedido.proveedorId,
      numero: "",
      fecha: todayISO(),
      totalPapel: "",
      cargos: "",
      cargosConcepto: "",
      cargosIva: 21,
      esFactura: true,
      numeroFactura: "",
      fechaFactura: todayISO(),
      pagada: false,
      fechaPago: "",
      pedidoId: pedido.id,
      lineas: lineas.length ? lineas : [],
      estado: "borrador",
    });
    setTab("albaranes");
  }

  return { buscarEnCatalogo, aprenderReferencia, guardarAlbaran, eliminarAlbaran, marcarPagada, confirmarAlbaran, anularAlbaran, recibirConAlbaran };
}

/* ================= LÓGICA: RESPALDOS ================= */
// Esta es la única pieza que necesita literalmente todos los datos de la
// empresa a la vez — es lo que hace un respaldo, por definición. La lista de
// parámetros es larga a propósito, no por descuido: es la naturaleza de la
// tarea, no algo que se pueda repartir en piezas más pequeñas sin perder el
// sentido de "copia de todo".
function crearLogicaRespaldos({
  // datos actuales, para leer y para meter en el respaldo
  proveedores, productos, pedidos, movimientos, conteos, fichasCosto,
  albaranes, catalogoProv, gastosGenerales, empleados, fichajes,
  registrosAppcc, puntosControl, clientes, encargos, arqueos, turnos,
  // setters, para cuando se restaura un respaldo
  setProveedores, setProductos, setPedidos, setMovimientos, setConteos, setFichasCosto,
  setAlbaranes, setCatalogoProv, setGastosGenerales, setEmpleados, setFichajes,
  setRegistrosAppcc, setPuntosControl, setClientes, setEncargos, setArqueos, setTurnos,
  // estado propio de la pantalla de respaldos
  setHistorial, setPendingRestore, pendingRestore,
  setBackupText, backupText, setCopiado,
  setShowBackupView, setShowRestoreInput, setRestoreText, restoreText, setRestoreError,
  // extras para el Excel
  proveedorPorId, productoPorId,
}) {
  function crearPuntoDeGuardado() {
    const snapshot = {
      id: uid(),
      fecha: new Date().toISOString(),
      automatica: false,
      data: { proveedores, productos, pedidos, movimientos, conteos, fichasCosto, albaranes, catalogoProv, gastosGenerales, empleados, fichajes, registrosAppcc, puntosControl, clientes, encargos, arqueos, turnos },
    };
    setHistorial((s) => [snapshot, ...s].slice(0, 12));
  }

  function restaurarDesdeHistorial(snapshot) {
    setPendingRestore({ ...snapshot.data, exportadoEl: snapshot.fecha });
  }

  function abrirRespaldo() {
    const data = {
      version: 2,
      exportadoEl: new Date().toISOString(),
      proveedores, productos, pedidos, movimientos, conteos, fichasCosto,
      albaranes, catalogoProv, gastosGenerales, empleados, fichajes,
      registrosAppcc, puntosControl, clientes, encargos, arqueos, turnos,
    };
    setBackupText(JSON.stringify(data));
    setCopiado(false);
    setShowBackupView(true);
  }

  function copiarRespaldo() {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(backupText).then(() => setCopiado(true)).catch(() => setCopiado(false));
    }
  }

  function abrirRestaurar() {
    setRestoreText("");
    setRestoreError("");
    setShowRestoreInput(true);
  }

  function analizarTextoRestauracion() {
    try {
      const data = JSON.parse(restoreText.trim());
      const tieneAlgo = data && (data.proveedores || data.productos || data.pedidos || data.movimientos || data.conteos || data.fichasCosto || data.albaranes);
      if (!tieneAlgo) throw new Error("Formato no reconocido");
      setRestoreError("");
      setShowRestoreInput(false);
      setPendingRestore(data);
    } catch (err) {
      setRestoreError("Ese texto no parece un respaldo válido. Revisa que lo hayas copiado completo.");
    }
  }

  function confirmarRestauracion() {
    if (!pendingRestore) return;
    if (pendingRestore.proveedores) setProveedores(pendingRestore.proveedores);
    if (pendingRestore.productos) setProductos(pendingRestore.productos);
    if (pendingRestore.pedidos) setPedidos(pendingRestore.pedidos);
    if (pendingRestore.movimientos) setMovimientos(pendingRestore.movimientos);
    if (pendingRestore.conteos) setConteos(pendingRestore.conteos);
    if (pendingRestore.fichasCosto) setFichasCosto(pendingRestore.fichasCosto);
    if (pendingRestore.albaranes) setAlbaranes(pendingRestore.albaranes);
    if (pendingRestore.catalogoProv) setCatalogoProv(pendingRestore.catalogoProv);
    if (pendingRestore.gastosGenerales) setGastosGenerales(pendingRestore.gastosGenerales);
    if (pendingRestore.empleados) setEmpleados(pendingRestore.empleados);
    if (pendingRestore.fichajes) setFichajes(pendingRestore.fichajes);
    if (pendingRestore.registrosAppcc) setRegistrosAppcc(pendingRestore.registrosAppcc);
    if (pendingRestore.puntosControl) setPuntosControl(pendingRestore.puntosControl);
    if (pendingRestore.clientes) setClientes(pendingRestore.clientes);
    if (pendingRestore.encargos) setEncargos(pendingRestore.encargos);
    if (pendingRestore.arqueos) setArqueos(pendingRestore.arqueos);
    if (pendingRestore.turnos) setTurnos(pendingRestore.turnos);
    setPendingRestore(null);
  }

  function exportarExcelGeneral() {
    const wb = XLSX.utils.book_new();

    const hojaProductos = productos.map((p) => ({
      Código: p.codigo || "", Nombre: p.nombre, Categoría: p.categoria || "",
      Tipo: p.tipo || "materia_prima", Unidad: p.unidad,
      "Costo sin IVA": Number(p.costo) || 0, "IVA compra %": ivaCompraDe(p),
      "Precio venta c/IVA": Number(p.precioVenta) || 0, "IVA venta %": ivaDe(p),
      Stock: Number(p.stock) || 0, "Stock mínimo": Number(p.stockMinimo) || 0,
      Proveedor: proveedorPorId(p.proveedorId)?.nombre || "",
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaProductos), "Productos");

    const hojaMov = movimientos.map((m) => ({
      Fecha: m.fecha, Tipo: m.tipo, Motivo: m.motivo || "", Producto: productoPorId(m.productoId)?.nombre || "",
      Cantidad: m.cantidad, "Costo unitario": m.costoUnitario || "", "Ingreso unitario": m.ingresoUnitario || "",
      "Medio de pago": m.medioPago || "", Referencia: m.referencia || "",
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaMov), "Movimientos");

    const hojaAlb = albaranes.filter((a) => a.estado === "confirmado").map((a) => {
      const base = (a.lineas || []).reduce((x, ln) => x + (Number(ln.importe) || 0), 0);
      return {
        Fecha: a.fechaFactura || a.fecha, Proveedor: proveedorPorId(a.proveedorId)?.nombre || "",
        "Nº albarán": a.numero || "", "Nº factura": a.numeroFactura || "",
        Base: Number(base.toFixed(2)), Pagada: a.pagada ? "Sí" : "No",
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(hojaAlb), "Albaranes");

    XLSX.writeFile(wb, `datos_almacen_${todayISO()}.xlsx`);
  }

  return {
    crearPuntoDeGuardado, restaurarDesdeHistorial, abrirRespaldo, copiarRespaldo,
    abrirRestaurar, analizarTextoRestauracion, confirmarRestauracion, exportarExcelGeneral,
  };
}

/* ================= LÓGICA: FACTURAS DIRECTAS ================= */
// Para gastos que no vienen de una entrega de mercancía: luz, alquiler,
// gestoría, seguros... cosas que Albaranes no puede registrar bien porque
// exige productos y cantidades, y que Gastos generales tampoco cubre bien
// porque es solo una cifra mensual estimada, no una factura real con
// vencimiento y número propio.
function crearLogicaFacturasDirectas({ setFacturasDirectas, registrarAuditoria }) {
  function addFacturaDirecta(data) {
    const base = Number(data.importeBase) || 0;
    const ivaPct = Number(data.ivaPct) || 0;
    const importeIva = base * (ivaPct / 100);
    const importeTotal = base + importeIva;
    setFacturasDirectas((s) => [
      { id: uid(), pagada: false, ...data, importeBase: base, ivaPct, importeIva, importeTotal },
      ...s,
    ]);
  }
  function updateFacturaDirecta(id, data) {
    setFacturasDirectas((s) =>
      s.map((f) => {
        if (f.id !== id) return f;
        const actualizada = { ...f, ...data };
        const base = Number(actualizada.importeBase) || 0;
        const ivaPct = Number(actualizada.ivaPct) || 0;
        return { ...actualizada, importeBase: base, ivaPct, importeIva: base * (ivaPct / 100), importeTotal: base + base * (ivaPct / 100) };
      })
    );
  }
  function deleteFacturaDirecta(id) {
    setFacturasDirectas((s) => {
      const f = s.find((x) => x.id === id);
      registrarAuditoria("Eliminar factura directa", f ? `${f.concepto} · €${(Number(f.importeTotal) || 0).toFixed(2)}` : id);
      return s.filter((x) => x.id !== id);
    });
  }
  function marcarPagadaFacturaDirecta(id, pagada) {
    setFacturasDirectas((s) => s.map((f) => (f.id === id ? { ...f, pagada, fechaPago: pagada ? todayISO() : "" } : f)));
    if (pagada) registrarAuditoria("Marcar factura directa como pagada", id);
  }
  return { addFacturaDirecta, updateFacturaDirecta, deleteFacturaDirecta, marcarPagadaFacturaDirecta };
}

/* ================= LÓGICA: NÓMINAS (COSTE REAL) ================= */
// IMPORTANTE: esto NO calcula nóminas. El cálculo lo hace la gestoría, que
// es quien tiene la autorización RED y la responsabilidad legal ante la
// Seguridad Social. Aquí solo se registra lo que la gestoría ya ha
// calculado, para poder cruzarlo con los ingresos reales del negocio y
// saber el coste de personal de verdad, en vez de una estimación.
function crearLogicaNominas({ setNominas, registrarAuditoria }) {
  function addNomina(data) {
    const bruto = Number(data.brutoTotal) || 0;
    const ss = Number(data.seguridadSocialEmpresa) || 0;
    setNominas((s) => {
      // Si ya hay un registro de ese empleado y ese mes, se sustituye en vez
      // de duplicarlo — es lo que se espera al corregir una cifra.
      const sinEsteMes = s.filter((n) => !(n.empleadoId === data.empleadoId && n.mes === data.mes));
      return [
        { id: uid(), ...data, brutoTotal: bruto, seguridadSocialEmpresa: ss, costeTotalEmpresa: bruto + ss },
        ...sinEsteMes,
      ];
    });
  }
  function deleteNomina(id) {
    setNominas((s) => {
      const n = s.find((x) => x.id === id);
      registrarAuditoria("Eliminar registro de nómina", n ? `${n.mes} · €${(Number(n.costeTotalEmpresa) || 0).toFixed(2)}` : id);
      return s.filter((x) => x.id !== id);
    });
  }
  return { addNomina, deleteNomina };
}

function BotonModoEmpleado({ modoEmpleado, salirModoEmpleado, empleados = [], usuarioActivoId, entrarComoEmpleado, pinPropietario }) {
  const [pantalla, setPantalla] = useState(null); // null | "elegir" | "codigo" | "salir"
  const [empleadoId, setEmpleadoId] = useState("");
  const [pin, setPin] = useState("");
  const [error, setError] = useState("");

  const conAcceso = empleados.filter((e) => e.activo !== false && e.pin);
  const empleadoActivo = empleados.find((e) => e.id === usuarioActivoId);

  function cerrar() {
    setPantalla(null);
    setPin("");
    setError("");
    setEmpleadoId("");
  }

  function elegirEmpleado(id) {
    setEmpleadoId(id);
    setPantalla("codigo");
    setError("");
  }

  function intentarEntrar() {
    if (entrarComoEmpleado(empleadoId, pin)) {
      cerrar();
    } else {
      setError("Código incorrecto.");
    }
  }

  function intentarSalir() {
    if (salirModoEmpleado(pin)) {
      cerrar();
    } else {
      setError("PIN del propietario incorrecto.");
    }
  }

  return (
    <>
      <button
        onClick={() => setPantalla(modoEmpleado ? "salir" : "elegir")}
        className="text-[10.5px] font-semibold px-2 py-1 rounded-md whitespace-nowrap shrink-0"
        style={{ background: "rgba(255,255,255,0.08)", color: "#B9C7C0" }}
        title={modoEmpleado ? "Toca para cambiar de usuario o salir" : "Entrar en modo empleado"}
      >
        {modoEmpleado ? `🔒 ${empleadoActivo ? empleadoActivo.nombre : "Empleado"}` : "🔓 Modo empleado"}
      </button>

      {pantalla === "elegir" && (
        <Modal onClose={cerrar} title="¿Quién eres?">
          {conAcceso.length === 0 ? (
            <div className="text-[12.5px]" style={{ color: C.inkSoft }}>
              Todavía no hay ningún empleado con código de acceso. Se pone en Personal, editando su ficha.
            </div>
          ) : (
            <div className="space-y-1.5">
              {conAcceso.map((e) => (
                <button
                  key={e.id}
                  onClick={() => elegirEmpleado(e.id)}
                  className="w-full text-left px-3 py-2.5 rounded-lg text-[13px] font-medium"
                  style={{ background: C.bg, border: `1px solid ${C.line}` }}
                >
                  {e.nombre}
                </button>
              ))}
            </div>
          )}
        </Modal>
      )}

      {pantalla === "codigo" && (
        <Modal onClose={cerrar} title="Tu código de acceso">
          <Field label="Código">
            <Input type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)} autoFocus />
          </Field>
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={intentarEntrar}>Entrar</Btn>
            <Btn variant="ghost" onClick={() => setPantalla("elegir")}>Atrás</Btn>
          </div>
        </Modal>
      )}

      {pantalla === "salir" && (
        <Modal onClose={cerrar} title={`Modo empleado — ${empleadoActivo ? empleadoActivo.nombre : "sin identificar"}`}>
          <div className="flex gap-2 mb-3">
            <Btn variant="ghost" onClick={() => { cerrar(); setPantalla("elegir"); }}>Cambiar de usuario</Btn>
          </div>
          <div className="text-[12px] font-medium mb-1" style={{ color: C.inkSoft }}>O salir a modo propietario</div>
          {!pinPropietario && (
            <div className="text-[11.5px] mb-2 p-2 rounded-lg" style={{ background: C.amberSoft, color: C.ink }}>
              Todavía no has creado un PIN de propietario, así que puedes salir directamente sin escribir nada —
              toca "Salir". En cuanto puedas, créalo en Respaldos para proteger la salida de verdad.
            </div>
          )}
          <Field label="PIN del propietario">
            <Input type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)} autoFocus />
          </Field>
          {error && <div className="text-[12px] mb-2" style={{ color: C.red }}>{error}</div>}
          <div className="flex gap-2">
            <Btn onClick={intentarSalir}>Salir</Btn>
            <Btn variant="ghost" onClick={cerrar}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </>
  );
}

function BottomNavC({ tab, setTab, categorias, dashboardItem }) {
  const [sheet, setSheet] = useState(null); // 'comprar' | 'almacen' | 'mas' | null

  const enComprar = categorias.comprar.items.some((i) => i.id === tab);
  const enAlmacen = categorias.almacen.items.some((i) => i.id === tab);
  const enMas = categorias.mas.some((g) => g.items.some((i) => i.id === tab));
  const enHoy = tab === "dashboard";

  const badgeComprar = categorias.comprar.items.some((i) => i.badge > 0);
  const badgeAlmacen = categorias.almacen.items.some((i) => i.badge > 0);
  const badgeMas = categorias.mas.some((g) => g.items.some((i) => i.badge > 0));

  function BotonNav({ activo, icon: Icon, label, onClick, badge }) {
    return (
      <button onClick={onClick} className="flex-1 flex flex-col items-center gap-0.5 py-2 relative">
        <Icon size={20} color={activo ? C.accent : C.inkSoft} />
        <span className="text-[10.5px] font-medium" style={{ color: activo ? C.accent : C.inkSoft }}>{label}</span>
        {!!badge && <span className="absolute top-1.5 right-[28%] w-2 h-2 rounded-full" style={{ background: C.red }} />}
      </button>
    );
  }

  return (
    <>
      <div className="flex shrink-0" style={{ background: C.surface, borderTop: `1px solid ${C.line}` }}>
        <BotonNav activo={enHoy} icon={BarChart3} label="Hoy" onClick={() => setTab("dashboard")} />
        <BotonNav activo={enComprar} icon={ShoppingCart} label="Comprar" onClick={() => setSheet("comprar")} badge={badgeComprar} />
        <BotonNav activo={enAlmacen} icon={Package} label="Almacén" onClick={() => setSheet("almacen")} badge={badgeAlmacen} />
        <BotonNav activo={enMas} icon={MoreHorizontal} label="Más" onClick={() => setSheet("mas")} badge={badgeMas} />
      </div>

      {sheet === "comprar" && (
        <Modal onClose={() => setSheet(null)} title={categorias.comprar.titulo}>
          {categorias.comprar.items.map((it) => (
            <BotonItemSheet key={it.id} it={it} tab={tab} onPick={() => { setTab(it.id); setSheet(null); }} />
          ))}
        </Modal>
      )}
      {sheet === "almacen" && (
        <Modal onClose={() => setSheet(null)} title={categorias.almacen.titulo}>
          {categorias.almacen.items.map((it) => (
            <BotonItemSheet key={it.id} it={it} tab={tab} onPick={() => { setTab(it.id); setSheet(null); }} />
          ))}
        </Modal>
      )}
      {sheet === "mas" && (
        <Modal onClose={() => setSheet(null)} title="Más">
          {categorias.mas.map((g) => (
            <div key={g.titulo} className="mb-3">
              <div className="text-[11px] font-semibold uppercase tracking-wide mb-1" style={{ color: C.inkSoft }}>{g.titulo}</div>
              {g.items.map((it) => (
                <BotonItemSheet key={it.id} it={it} tab={tab} onPick={() => { setTab(it.id); setSheet(null); }} />
              ))}
            </div>
          ))}
        </Modal>
      )}
    </>
  );
}

function SectionTitle({ children, action }) {

}
function Btn({ children, onClick, variant = "primary", type = "button", small, disabled = false }) {
  const styles = {
    primary: { background: C.accent, color: "#fff" },

    <button
      type={type}

      className={`inline-flex items-center gap-1.5 rounded-lg font-medium ${small ? "px-2.5 py-1.5 text-[12px]" : "px-3.5 py-2 text-[13px]"}`}

function LinkBtn({ children, href, variant = "ghost", small, newTab = true }) {

function Field({ label, children }) {

/* ================= DASHBOARD ================= */
function Dashboard({ valorInventario, valorUtillaje = 0, stockBajo, pedidosPendientes, margenPromedio, movimientos, productos, caducanPronto = [], proveedorPorId, vencenPronto = [], totalPendientePago = 0, documentosPersonalPronto = [], fichajesAbiertos = [], encargosUrgentes = [], pisoVentaBajo = [], sugerenciasPedido = [], setTab, recordatorioConteo = [] }) {
  const entradas30 = movimientos.filter((m) => m.tipo === "entrada").reduce((a, m) => a + m.cantidad, 0);
  const salidas30 = movimientos.filter((m) => m.tipo === "salida").reduce((a, m) => a + m.cantidad, 0);

  // Qué tarjeta está abierta mostrando su detalle. Solo una a la vez, para
  // que en el móvil no se llene la pantalla de listas.
  const [abierta, setAbierta] = useState(null);

  const diasTexto = (d) => (d < 0 ? `vencido hace ${Math.abs(d)} d` : d === 0 ? "hoy" : `en ${d} d`);
  const diasColor = (d) => (d < 0 ? C.red : d <= 7 ? C.amber : C.inkSoft);

  // Cada tarjeta declara qué enseña al tocarla y a qué pantalla lleva.
  const tarjetas = [
    {
      id: "saldo", titulo: "Saldo de almacén", valor: `€${fmt(valorInventario)}`,
      nota: valorUtillaje > 0 ? `+ €${fmt(valorUtillaje)} en utillaje (aparte, no es mercancía)` : null,
      tab: "saldo", tabNombre: "Saldo de almacén", items: [],
    },
    {
      id: "margen", titulo: "Margen promedio", valor: `${fmt(margenPromedio)}%`, color: C.accent,
      tab: "resultados", tabNombre: "Resultados", items: [],
    },
    {
      id: "pedidos", titulo: "Pedidos pendientes", valor: pedidosPendientes.length,
      tab: "pedidos", tabNombre: "Pedidos",
      items: pedidosPendientes.map((pe) => ({
        clave: pe.id,
        principal: (proveedorPorId(pe.proveedorId) || {}).nombre || "Proveedor eliminado",
        secundario: `${(pe.items || []).length} producto(s) · ${pe.estado}`,
        derecha: pe.fechaEsperada ? `llega ${new Date(pe.fechaEsperada).toLocaleDateString("es-ES")}` : "sin fecha",
      })),
    },
    {
      id: "stockbajo", titulo: "Productos en stock bajo", valor: stockBajo.length,
      color: stockBajo.length ? C.red : C.ink, tab: "productos", tabNombre: "Productos",
      items: stockBajo.map((p) => ({
        clave: p.id, principal: p.nombre,
        secundario: p.zona || "",
        derecha: `${fmt(p.stock)} / mín. ${fmt(p.stockMinimo)}`, derechaColor: C.red,
      })),
    },
    {
      id: "caducidades", titulo: "Lotes que caducan (30 d)", valor: caducanPronto.length,
      color: caducanPronto.some((l) => l.dias < 0) ? C.red : caducanPronto.length ? C.amber : C.ink,
      tab: "productos", tabNombre: "Productos",
      items: caducanPronto.map((l) => ({
        clave: l.id, principal: l.nombre,
        secundario: `${l.lote ? `lote ${l.lote} · ` : ""}${l.caducidad}${l.unidades ? ` · ${l.parcial ? "quedan aprox. " : ""}${fmt(l.unidades)} uds` : ""}`,
        derecha: diasTexto(l.dias), derechaColor: diasColor(l.dias),
      })),
    },
    {
      id: "facturas", titulo: "Facturas por pagar (7 d)", valor: vencenPronto.length,
      color: vencenPronto.some((f) => f.dias < 0) ? C.red : vencenPronto.length ? C.amber : C.ink,
      nota: totalPendientePago > 0 ? `€${fmt(totalPendientePago)} pendiente en total` : null,
      tab: "pagos", tabNombre: "Cuentas por pagar",
      items: vencenPronto.map((f) => ({
        clave: f.id,
        principal: (f.proveedor && f.proveedor.nombre) || "Sin proveedor",
        secundario: `${f.concepto || ""} · €${fmt(f.total)}`,
        derecha: diasTexto(f.dias), derechaColor: diasColor(f.dias),
      })),
    },
    {
      id: "encargos", titulo: "Encargos urgentes", valor: encargosUrgentes.length,
      color: encargosUrgentes.some((e) => e.dias < 0) ? C.red : encargosUrgentes.length ? C.amber : C.ink,
      nota: encargosUrgentes.length > 0 ? "en 2 días o menos" : null,
      tab: "encargos", tabNombre: "Encargos",
      items: encargosUrgentes.map((e) => ({
        clave: e.id, principal: `Encargo ${e.numero || "s/n"}`,
        secundario: `${(e.lineas || []).length} producto(s)${e.horaEntrega ? ` · ${e.horaEntrega}` : ""}`,
        derecha: diasTexto(e.dias), derechaColor: diasColor(e.dias),
      })),
    },
    {
      id: "reponer", titulo: "Reponer piso de venta", valor: pisoVentaBajo.length,
      color: pisoVentaBajo.length ? C.amber : C.ink,
      nota: pisoVentaBajo.length > 0 ? "sacar del almacén al mostrador" : null,
      tab: "traspasos", tabNombre: "Traspasos",
      items: pisoVentaBajo.map((p) => ({
        clave: p.id, principal: p.nombre,
        secundario: `${fmt((Number(p.stock) || 0) - (Number(p.stockPisoVenta) || 0))} en el almacén`,
        derecha: `${fmt(p.stockPisoVenta || 0)} / mín. ${fmt(p.stockMinimoPisoVenta)}`, derechaColor: C.amber,
      })),
    },
    {
      id: "pedirya", titulo: "Pedir ya", valor: sugerenciasPedido.length,
      color: sugerenciasPedido.length ? C.red : C.ink,
      nota: sugerenciasPedido.length > 0 ? "se agotan antes de que llegue el pedido" : null,
      tab: "pedidos", tabNombre: "Pedidos",
      items: sugerenciasPedido.map((p) => ({
        clave: p.id, principal: p.nombre, secundario: p.proveedorNombre,
        derecha: `${Math.round(p.dias)} d de stock · llega en ${p.diasHastaEntrega}`, derechaColor: C.red,
      })),
    },
    {
      id: "personal", titulo: "Personal: avisos", valor: documentosPersonalPronto.length,
      color: documentosPersonalPronto.some((d) => d.dias < 0) ? C.red : documentosPersonalPronto.length ? C.amber : C.ink,
      nota: fichajesAbiertos.length > 0 ? `${fichajesAbiertos.length} fichaje(s) sin cerrar` : null,
      notaColor: fichajesAbiertos.length > 0 ? C.amber : null,
      tab: "personal", tabNombre: "Personal",
      items: documentosPersonalPronto.map((d) => ({
        clave: d.id, principal: d.empleado, secundario: `${d.concepto} · ${d.fecha}`,
        derecha: diasTexto(d.dias), derechaColor: diasColor(d.dias),
      })),
    },
    {
      id: "conteos", titulo: "Conteos atrasados",
      valor: recordatorioConteo.filter((a) => a.atrasado).length,
      color: recordatorioConteo.some((a) => a.atrasado) ? C.amber : C.ink,
      tab: "conteo", tabNombre: "Inventario ciego",
      items: recordatorioConteo.filter((a) => a.atrasado).map((a) => ({
        clave: a.id, principal: a.nombre,
        secundario: a.ultimaFecha ? `último conteo: ${a.ultimaFecha}` : "todavía no se ha contado nunca",
        derecha: a.diasDesde === null ? "sin datos" : `hace ${a.diasDesde} d`, derechaColor: C.amber,
      })),
    },
  ];

  const tarjetaAbierta = tarjetas.find((t) => t.id === abierta);

  return (
    <div>
      <div className="flex items-center justify-between mb-4 pb-3" style={{ borderBottom: `2px solid ${C.accent}` }}>
        <div>
          <h2 className="text-[18px] font-semibold">Panel general</h2>
          <div className="text-[12px]" style={{ color: C.inkSoft }}>
            {new Date().toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long", year: "numeric" })}
          </div>
        </div>
        <img src={LOGO} alt="" style={{ height: 56, width: "auto" }} />
      </div>

      <div className="text-[11.5px] mb-2" style={{ color: C.inkSoft }}>Toca cualquier cifra para ver el detalle.</div>

      <div className="grid grid-cols-2 md:grid-cols-4 gap-3 mb-3">
        {tarjetas.map((t) => {
          const activa = abierta === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setAbierta(activa ? null : t.id)}
              className="text-left rounded-xl p-4"
              style={{
                background: C.surface,
                border: `1px solid ${activa ? C.accent : C.line}`,
                boxShadow: activa ? `0 0 0 1px ${C.accent}` : "none",
              }}
            >
              <div className="text-[11px]" style={{ color: C.inkSoft }}>{t.titulo}</div>
              <div className="text-2xl font-semibold mono mt-1" style={{ color: t.color || C.ink }}>{t.valor}</div>
              {t.nota && (
                <div className="text-[10.5px] mt-0.5" style={{ color: t.notaColor || C.inkSoft }}>{t.nota}</div>
              )}
            </button>
          );
        })}
      </div>

      {tarjetaAbierta && (
        <Card className="mb-6" style={{ borderColor: C.accent }}>
          <div className="flex items-center justify-between mb-2">
            <div className="text-[13px] font-semibold">{tarjetaAbierta.titulo}</div>
            <button onClick={() => setAbierta(null)}><X size={16} color={C.inkSoft} /></button>
          </div>

          {tarjetaAbierta.items.length === 0 ? (
            <div className="text-[12.5px] mb-3" style={{ color: C.inkSoft }}>
              No hay nada pendiente aquí ahora mismo.
            </div>
          ) : (
            <div className="space-y-1.5 mb-3 max-h-72 overflow-y-auto">

}

  { valor: 1, corta: "L", nombre: "Lunes" },

  { valor: 3, corta: "X", nombre: "Miércoles" },

  const [editForm, setEditForm] = useState(blankProv);
  const [editError, setEditError] = useState("");

  function submit() {
    if (!form.nombre.trim()) {
      setError("Escribe el nombre del proveedor.");
      return;
    }
    setError("");
    addProveedor(form);
    setForm(blankProv);
    setShowForm(false);
  }

  function openEdit(pv) {
    setEditFor(pv.id);
    setEditForm({
      nombre: pv.nombre || "", contacto: pv.contacto || "", telefono: pv.telefono || "",
      email: pv.email || "", condiciones: pv.condiciones || "", leadTime: pv.leadTime || "", diasPago: pv.diasPago || "",

      {showForm && (
        <Card className="mb-4">
          <div className="grid md:grid-cols-3 gap-x-4">
            <Field label="Nombre del proveedor"><Input value={form.nombre} onChange={(e) => setForm({ ...form, nombre: e.target.value })} placeholder="Distribuidora del Norte" /></Field>
            <Field label="Persona de contacto"><Input value={form.contacto} onChange={(e) => setForm({ ...form, contacto: e.target.value })} placeholder="Nombre" /></Field>
            <Field label="Teléfono (WhatsApp)"><Input value={form.telefono} onChange={(e) => setForm({ ...form, telefono: e.target.value })} placeholder="+34 600 000 000" /></Field>
            <Field label="Correo electrónico"><Input type="email" value={form.email} onChange={(e) => setForm({ ...form, email: e.target.value })} placeholder="pedidos@proveedor.com" /></Field>
            <Field label="Condiciones de pago (texto libre)"><Input value={form.condiciones} onChange={(e) => setForm({ ...form, condiciones: e.target.value })} placeholder="Transferencia 45 días F/F" /></Field>

            <Field label="Tiempo de entrega (días)"><Input type="number" value={form.leadTime} onChange={(e) => setForm({ ...form, leadTime: e.target.value })} placeholder="5" /></Field>

          <div className="mb-2">

            <div className="flex gap-1.5">
              {DIAS_REPARTO.map((d) => {
                const activo = (form.diasReparto || []).includes(d.valor);
                return (
                  <button
                    key={d.valor}
                    type="button"

                        diasReparto: (f.diasReparto || []).includes(d.valor)

            <Btn onClick={submit}>Guardar proveedor</Btn>
            <Btn variant="ghost" onClick={() => { setShowForm(false); setError(""); }}>Cancelar</Btn>

      {proveedores.length === 0 ? <Empty text="Todavía no has añadido proveedores." /> : (
        <div className="grid md:grid-cols-2 gap-3">
          {proveedores.map((pv) => {

                  <div className="mono">{nPedidos} pedido(s) registrados</div>
                </div>
                <div className="mt-3">
                  <Btn small variant="ghost" onClick={() => openEdit(pv)}>Editar</Btn>
                </div>
              </Card>
            );
          })}
        </div>
      )}

      {editFor && (
        <Modal onClose={() => setEditFor(null)} title="Editar proveedor">
          <Field label="Nombre del proveedor"><Input value={editForm.nombre} onChange={(e) => setEditForm({ ...editForm, nombre: e.target.value })} autoFocus /></Field>
          <Field label="Persona de contacto"><Input value={editForm.contacto} onChange={(e) => setEditForm({ ...editForm, contacto: e.target.value })} /></Field>
          <Field label="Teléfono (WhatsApp)"><Input value={editForm.telefono} onChange={(e) => setEditForm({ ...editForm, telefono: e.target.value })} /></Field>
          <Field label="Correo electrónico"><Input type="email" value={editForm.email} onChange={(e) => setEditForm({ ...editForm, email: e.target.value })} /></Field>
          <Field label="Condiciones de pago (texto libre)"><Input value={editForm.condiciones} onChange={(e) => setEditForm({ ...editForm, condiciones: e.target.value })} /></Field>
          <Field label="Días de pago (para vencimientos)"><Input type="number" value={editForm.diasPago} onChange={(e) => setEditForm({ ...editForm, diasPago: e.target.value })} /></Field>
          <Field label="Tiempo de entrega (días)"><Input type="number" value={editForm.leadTime} onChange={(e) => setEditForm({ ...editForm, leadTime: e.target.value })} /></Field>
          <div className="mb-2">
            <div className="text-[12px] font-medium mb-1" style={{ color: C.inkSoft }}>¿Qué días reparte? (opcional)</div>
            <div className="flex gap-1.5">
              {DIAS_REPARTO.map((d) => {
                const activo = (editForm.diasReparto || []).includes(d.valor);
                return (
                  <button
                    key={d.valor}
                    type="button"
                    onClick={() =>
                      setEditForm((f) => ({
                        ...f,
                        diasReparto: (f.diasReparto || []).includes(d.valor)
                          ? f.diasReparto.filter((x) => x !== d.valor)
                          : [...(f.diasReparto || []), d.valor],
                      }))
                    }
                    className="w-9 h-9 rounded-full text-[12.5px] font-semibold"
                    style={{ background: activo ? C.accent : C.surface, color: activo ? "#fff" : C.inkSoft, border: `1px solid ${activo ? C.accent : C.line}` }}

                  >
                    {d.corta}
                  </button>
                );
              })}

          </div>
          {editError && <div className="text-[12px] mb-2" style={{ color: C.red }}>{editError}</div>}
          <div className="flex gap-2 mt-1">
            <Btn onClick={submitEdit}>Guardar cambios</Btn>
            <Btn variant="ghost" onClick={() => setEditFor(null)}>Cancelar</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
}

  const [salidaMedioPago, setSalidaMedioPago] = useState("Efectivo");
  const [salidaPrecio, setSalidaPrecio] = useState("");

    { id: "todos", label: "Todos" },

    { id: "elaborado", label: "Elaborados" },
    { id: "utillaje", label: "Utillaje" },

  const productosFiltrados = productos.filter((p) => {
    if (filtroTipo !== "todos" && (p.tipo || "materia_prima") !== filtroTipo) return false;
    if (filtroDepartamento !== "todos" && (p.departamento || "Sin asignar") !== filtroDepartamento) return false;
